 limited company","private limited company ... partnership","partnership ... private limited company","public limited company ... partnership"],"ans":1,"why":"Firm A is a legal entity requiring consent for ownership transfer — matching a private limited company (restricted share transfer, but still legally separate from its owners). Firm B is NOT a legal entity and also requires consent for transfer — matching a partnership, which lacks legal-entity status and needs all partners' agreement to transfer ownership."},{"id":"CE2002/P2/Q19","q":"Amy is an owner of a firm. Her liability to the firm is confined to her investment in the firm and she can transfer her ownership to anyone else without the consent of other owners. Based on the above information, the firm is a","opts":["partnership.","out of syllabus","private limited company.","public limited company."],"ans":3,"why":"Limited liability confined to her own investment rules out sole proprietorship and partnership (both unlimited liability). Being able to transfer her ownership to anyone WITHOUT needing other owners' consent rules out a private limited company, whose share transfers require consent — leaving public limited company as the only fit."}]},{"id":"in35","ch":"ch3","text":"Going public/listing changes LESS than it seems: limited liability, legal entity status, and the profits tax rate are ALL already there for a private limited company and do NOT change. What actually changes: wider capital source (shares to the public), free share transfer, public disclosure of accounts, and HIGHER takeover risk. Privatising (delisting) reverses exactly these.","qs":[{"id":"CE1991/P2/Q16","q":"Which of the following is regarded as an advantage for a private limited company to go public?","opts":["Shareholders enjoy limited liability.","There is separation of ownership and management.","There is a wider scope for raising capital.","Shares become transferable."],"ans":2,"why":"Limited liability and separation of ownership/management already exist in a PRIVATE limited company, so going public doesn't newly grant those (A, B). Shares of a private company are technically transferable too, just with other owners' consent, so 'becoming transferable' overstates what's new (D). The genuinely new advantage of going public is access to a much wider pool of capital, since the company can now issue shares directly to the general investing public via the stock market."},{"id":"CE1993/P2/Q13","q":"One of the advantages of a private limited company 'going public' is :","opts":["limited liability","more access to funds","being subject to a lower profits tax rate","being less likely to be taken over by another company"],"ans":1,"why":"Limited liability already applies to a PRIVATE limited company, so going public doesn't newly grant it (A). Going public opens access to funds from the general investing public via the stock market — a genuinely new source of capital (B). The corporate profits tax rate doesn't change based on whether a limited company is public or private (C), and freely tradable shares actually make a public company MORE, not less, vulnerable to being bought up and taken over (D)."},{"id":"CE1997/P2/Q16","q":"If a listed company is converted into a private limited company,","opts":["it can avoid being controlled by the government.","its firm size will be reduced.","it can reduce the risk of being taken over.","it loses the status of legal entity."],"ans":2,"why":"Once shares are no longer freely traded on the public stock market, it becomes much harder for outside parties to buy up a controlling stake, reducing the risk of a hostile takeover. Going private has no inherent connection to avoiding government control (A); the firm's actual size/operations don't automatically shrink just because its shares stop being publicly traded (B); and a private limited company remains a legal entity — it doesn't lose that status just by delisting (D)."},{"id":"CE2002/P2/Q21","q":"If a private limited company in Hong Kong is turned into a public limited company,","opts":["the company will pay the profits tax at a higher rate.","the company will gain the status of a legal entity.","the company will have a wider source of capital.","the original owners must increase their investments in the company."],"ans":2,"why":"Going public opens access to a much wider source of capital, since the company can now issue shares to the general investing public rather than a restricted set of private shareholders. The corporate profits tax rate doesn't change based on public/private status (A); the company was ALREADY a legal entity as a private limited company, so it doesn't newly 'gain' that status (B); and going public doesn't force the ORIGINAL owners to put in more money — new capital instead comes from new public shareholders (D)."}]},{"id":"in36","ch":"ch3","text":"'Public' has two unrelated meanings: a PUBLIC LIMITED COMPANY is privately owned by shareholders (it's 'public' only in that anyone can buy in), while a PUBLIC CORPORATION (e.g. Airport Authority) is owned by the GOVERNMENT and its staff are NOT civil servants. Also don't equate 'public limited' with 'listed' — a public limited company CAN list, but isn't automatically listed.","qs":[{"id":"CE1992/P2/Q16","q":"Which of the following are the characteristics of a public corporation in Hong Kong? (1) It is owned by the government. (2) It has limited liability. (3) Its employees are civil servants. (4) Its stocks are quoted on the Stock Exchange.","opts":["(1) and (2) only","(1) and (3) only","(2) and (4) only","(3) and (4) only"],"ans":0,"why":"A public corporation in Hong Kong (a statutory body) is owned by the government (1) and typically has legal-entity status with limited liability granted by its founding ordinance (2). Its employees, however, are generally NOT civil servants — they're employed on separate terms outside the civil service (3), and being wholly government-owned, its stock isn't traded on the open stock exchange (4)."},{"id":"CE1993/P2/Q17","q":"In Hong Kong, a public radio broadcasting company enjoys the following advantage over a private radio broadcasting company:","opts":["lower production costs","priority in obtaining world news","a more extensive division of labour","the ability to deal more easily with financial difficulties"],"ans":3,"why":"A publicly (government) owned broadcaster can rely on government financial backing or subsidies to cover losses and weather financial difficulties — an advantage a private broadcaster, which must be self-sustaining or risk closure, doesn't have. Ownership type alone doesn't inherently lower production costs (A), grant priority news access (B), or determine the extent of division of labour (C)."},{"id":"CE2007/P2/Q22","q":"Which of the following about a public limited company is correct?","opts":["The company can be a shareholder of a listed company.","The shares issued by the company are traded on a stock exchange.","The maximum number of shareholders is 50.","It earns greater returns than a private limited company."],"ans":0,"why":"A company, being a legal entity in its own right, can itself hold shares in another (listed) company — nothing about corporate structure prevents this. Not every public limited company is actually listed and traded on a stock exchange — being 'public' is a legal classification distinct from choosing to list (B); the 50-shareholder cap applies to PRIVATE limited companies, not public ones, which have no such limit (C, reversed); and there's no guarantee a public limited company earns greater returns than a private one (D)."}]},{"id":"in37","ch":"ch3","text":"Shareholders are OWNERS (variable dividend, voting rights, paid LAST on liquidation); bondholders are CREDITORS (fixed interest owed even in loss years, no votes, repaid BEFORE shareholders). Almost every MC option that swaps any of these pairings is the trap.","qs":[{"id":"CE1990/P2/Q14","q":"Who will receive the repayment first when a company liquidates?","opts":["shareholders","out of syllabus","directors","debenture-holders"],"ans":3,"why":"Debenture holders are creditors of the company (they've lent it money), and creditors are legally repaid BEFORE shareholders (who are residual owners) when a company liquidates."},{"id":"CE1992/P2/Q18","q":"On the liquidation of a public limited company, which of the following parties will get their money back before the others?","opts":["the shareholders","the debenture-holders","the government","the employees of the company"],"ans":2,"why":"Under Hong Kong insolvency law, the government's claims for unpaid taxes rank as preferential debts, giving it priority to be repaid before other creditors such as debenture-holders and employees, while shareholders — as residual owners — are repaid last of all, after every other claim has been settled."},{"id":"CE1994/P2/Q19","q":"What is the economic role of shareholders in a public limited company?","opts":["preparing the company's accounts","making production decisions","bearing risk","sharing profits"],"ans":2,"why":"The defining economic role of shareholders is bearing risk — as residual claimants, their returns (dividends) aren't guaranteed and depend entirely on the firm's fortunes, and they could lose their whole investment if the firm fails. Preparing accounts (A) and making production decisions (B) are functions of management/staff, not shareholders themselves; and while shareholders do share in profits (D), that's more a consequence of their investment than their fundamental economic function."},{"id":"CE2002/P2/Q17","q":"Which of the following statements about limited companies in Hong Kong is correct?","opts":["Shareholders and debenture holders have to bear unlimited liability.","Issuing more debentures will increase the risk of being taken over.","Shares and debentures of public limited companies are traded on the stock exchange.","Debenture holders can claim the company's assets prior to shareholders when the company goes bankrupt."],"ans":3,"why":"Debenture holders are creditors of the company, and creditors are legally repaid from the company's assets BEFORE shareholders — who are residual owners paid last — when a company goes bankrupt. Shareholders have LIMITED liability, and debenture holders (as creditors, not owners) don't bear 'liability' for the company's debts in the same sense at all (A is false); issuing debt doesn't dilute voting shares, so it doesn't increase takeover risk the way issuing new shares to outsiders might (B is false); and not all debentures are necessarily listed and traded on a public stock exchange (C overstates the case)."}]},{"id":"in38","ch":"ch3","text":"'Issuing shares vs bonds' answers depend on the viewpoint. For the COMPANY/existing owners: shares mean no interest burden and no redemption obligation (advantage) but dilute control and raise takeover risk (disadvantage). For the INVESTOR: bonds mean stabler return and priority repayment; shares mean voting rights and upside. Never claim 'shares/bonds earn more' — relative returns are never guaranteed.","qs":[{"id":"CE1993/P2/Q7","q":"From the viewpoint of a public limited company, which of the following is an advantage of issuing debentures over issuing shares to raise capital?","opts":["The company can raise more capital.","The existing shareholders have a better control of ownership of the company.","The company can pay less to debenture holders than to shareholders when its profit is small.","It is easier to obtain more bank loans if the company issues more debentures rather than more shares."],"ans":1,"why":"Issuing debentures (debt) instead of new shares means the company doesn't have to dilute existing shareholders' ownership stakes or voting control, since debenture holders aren't owners with voting rights — preserving existing shareholders' control. Debentures don't inherently let a company raise MORE capital than shares (A); debenture interest is a FIXED obligation that must be paid regardless of profit level, so the company doesn't pay LESS to debenture holders when profit is small — if anything that's when the fixed obligation is hardest to meet (C, reversed); and issuing MORE debt typically makes a company appear more heavily leveraged, making it HARDER, not easier, to secure additional bank loans (D)."},{"id":"CE2006/P2/Q22","q":"From the viewpoint of the company, which of the following is an advantage of issuing shares over bonds to raise capital?","opts":["The company can raise more capital.","The company has the obligation to redeem the bonds but not the shares.","The shares can be freely transferable on the stock market.","The liability of the shareholders is confined to the amount they have invested in the company."],"ans":1,"why":"Bonds/debentures must eventually be redeemed (repaid) at maturity — a fixed future repayment obligation — whereas shares represent permanent equity capital the company never has to buy back, a genuine advantage of shares from the company's own perspective. Choosing shares over bonds doesn't guarantee raising MORE capital (A); free transferability on the stock market (C) is a feature for the shareholder/investor, not really an advantage TO THE COMPANY in its capital-raising choice; and limited liability (D) protects the shareholder personally, not the company issuing the capital."},{"id":"CE2007/P2/Q21","q":"From the viewpoint of the existing shareholders of a listed company, which of the following is an advantage of issuing bonds over shares to raise funds for future development?","opts":["Their power of control over the company will not be diluted.","The interest paid to the debenture holders is lower than the dividend.","The company need not pay interest to the debenture holders when it incurs a loss.","The debenture holders have no right to sue the company, whereas the shareholders do have the right."],"ans":0,"why":"Issuing bonds (debt) rather than new shares doesn't create any new voting shares, so existing shareholders' proportional control and voting power remain undiluted — the genuine advantage from their perspective. Bond interest isn't necessarily always lower than dividends (B, not a certain fact); it's actually dividends, not bond interest, that the company can skip in a loss year — bond interest is a fixed, contractual obligation owed regardless of profit or loss, the reverse of what C claims; and debenture holders, as creditors, generally have strong legal rights to enforce their claims, not fewer rights than shareholders (D)."},{"id":"DSE2014/P1/Q7","q":"A public limited company plans to issue new bonds for expansion. For the existing shareholders, which of the following is an advantage of issuing bonds instead of shares?","opts":["The accounts of the company need not be disclosed to the public.","They have priority in getting back their capital if the company liquidates.","The interest paid to the bondholders is lower than the dividend paid to the shareholders.","Their power of control over the company will not be diluted."],"ans":3,"why":"Issuing bonds (debt) rather than new shares doesn't create any new voting shares, so existing shareholders' proportional control and voting power remain undiluted — the genuine advantage from their perspective. Disclosure requirements depend on whether the company is listed/public, not on which financing instrument it chooses to issue (A); it's the NEW bondholders, not the existing shareholders themselves, who would gain repayment priority (B); and bond interest isn't necessarily always lower than dividends in every case (C)."}]},{"id":"in39","ch":"ch3","text":"A public good is defined by NON-RIVALRY (concurrent consumption, zero marginal cost per extra user) — NOT by who provides it or whether it's free. Free government masks and free flight tickets are still PRIVATE goods (rival); Mozart's music, poems, knowledge and online videos are public goods even when privately produced. The physical carrier (CD, book, concert seat) is private even when the content is public.","qs":[{"id":"AL1999/P1/Q21","q":"Which of the following statements about a public good is correct?","opts":["A public toilet (water closet) is an example of a public good.","When the marginal cost of serving a good to an extra consumer is zero, that good is a public good.","A public good is characterized by the fact that one person's use of the good does not reduce the amount available for himself in the future.","None of the above."],"ans":1,"why":"The precise economic test for a public good is non-rivalry — zero marginal cost of serving one more consumer, i.e. nobody's consumption reduces what's available to others. A public toilet is actually rivalrous (one person occupying a stall excludes others at that moment); C misstates non-rivalry as being about availability to oneself later, rather than to OTHERS at the same time."},{"id":"AL2001/P1/Q15","q":"A public good is","opts":["a good provided by the government but a price is charged.","a good that must be produced by the government because it is too costly for a private producer to sell and collect payments.","a good that can be consumed by many individuals at the same time.","a good that may be used by the public free of charge."],"ans":2,"why":"The defining test of a public good is non-rivalry — many people can consume it simultaneously without diminishing what's available to others. Government provision, pricing, or being free of charge are not the defining features; private firms can supply public goods too, and government-provided goods can still be rivalrous/excludable."},{"id":"AL2002/P1/Q28","q":"Which of the following is an example of public good?","opts":["books in a public library","a public beach","the music of Mozart","a piece of abandoned land"],"ans":2,"why":"Music, once created, can be enjoyed by unlimited people simultaneously without reducing its availability to anyone else — the clearest case of non-rivalry and non-excludability. Library books are rivalrous (one physical copy, one borrower at a time), a beach can become congested (semi-rival in practice), and abandoned land isn't really 'consumed' by the public at all."},{"id":"AL2005/P1/Q28","q":"Which of the following comes closest to a public good?","opts":["a public telephone in a booth in Central","the singing of Teresa Tang","the City Hall Library","the public beach at the Repulse Bay"],"ans":1,"why":"A recorded/broadcast performance can be enjoyed by unlimited listeners simultaneously without reducing its availability to anyone else — the clearest non-rival, non-excludable case. A phone booth, library books, and a beach are all capacity-limited or physically shared in ways that make one person's use reduce availability to others, at least at busy times."}]},{"id":"in40","ch":"ch8","text":"DEMAND ≠ quantity demanded. A change in the good's OWN price causes a movement ALONG the curve (change in quantity demanded/supplied) and can NEVER shift its own demand or supply curve. Only non-price factors shift curves: income, tastes, related goods' prices, expectations, number of buyers/sellers, input costs, technology. 'Price rose and quantity rose' is a demand SHIFT, not a violation of the law of demand — and equilibrium data from a shifting curve can't measure that curve's own elasticity.","qs":[{"id":"CE1990/P2/Q15","q":"Which of the following will cause the demand curve of ice cream to shift right (from D1 to D2)?","opts":["The cost of production of ice cream decreases.","More and more children enjoy drinking soft drinks.","The price of ice cream decreases.","Children are given more pocket money."],"ans":3,"why":"More pocket money is an increase in buyers' income — a non-price factor that shifts the demand curve right. A cost fall shifts SUPPLY (A); a taste shift towards soft drinks (a substitute) would shift ice-cream demand LEFT (B); and the good's own price change causes a movement ALONG the curve, never a shift (C)."},{"id":"CE1991/P2/Q24","q":"Which of the following may cause the market demand for housing in Hong Kong to increase?","opts":["There is an influx of immigrants.","The interest rate has increased.","More housing estates are built by the government.","The selling price of flats has decreased."],"ans":0,"why":"More immigrants means more potential buyers — a genuine rightward shift of demand. A higher interest rate raises the cost of mortgage financing (demand FALLS); government building affects SUPPLY; and a lower flat price causes a movement ALONG the demand curve, not a shift."},{"id":"CE1992/P2/Q22","q":"Which of the following factors will cause a decrease in the demand for imported private cars? (1) OPEC restricts the production of oil. (2) An extension of the Mass Transit Railway to Kennedy Town is built. (3) The price of imported private cars increases.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2) and (3)"],"ans":0,"why":"Restricted oil output makes petrol — a COMPLEMENT of cars — dearer, cutting car demand (1); an MTR extension improves a SUBSTITUTE, also cutting car demand (2). But the cars' OWN price rising causes a fall in quantity demanded (movement along the curve), not a decrease in demand (3)."},{"id":"CE1993/P2/Q18","q":"In 1992, the lending ceiling on home mortgages in Hong Kong was reduced from 90% to 70% of the value of the property. This resulted in _____ residential property.","opts":["a decrease in the demand for","a decrease in the quantity demanded of","an increase in the supply of","an increase in the quantity supplied of"],"ans":0,"why":"A lower lending ceiling forces buyers to put up much larger down-payments — a change in CREDIT CONDITIONS, which is a non-price factor. Non-price factors shift the whole demand curve: demand for residential property DECREASES. 'Quantity demanded' (B) would only be correct if the property's own price had changed."}]},{"id":"in41","ch":"ch8","text":"Double-shift questions: one variable is CERTAIN, the other AMBIGUOUS. D→ and S→ (both right): Q up, P ambiguous. D← and S← (both left): Q down, P ambiguous. D→ with S←: P up, Q ambiguous. D← with S→: P down, Q ambiguous. Any 'under what condition' answer states WHICH shift dominates. Exception: with a VERTICAL supply curve, quantity follows supply alone — no ambiguity.","qs":[{"id":"CE2011/P2/Q9","q":"The government has imposed an environmental levy on plastic shopping bags but not on non-woven reusable bags. Suppose there was also an increase in the number of producers of non-woven reusable bags. As a result, the total sales revenue of non-woven reusable bags ________.","opts":["would increase","would decrease","would remain unchanged","might increase, remain unchanged or decrease"],"ans":3,"why":"The levy on plastic bags shifts the DEMAND for reusable bags (the substitute) right, and more producers shift their SUPPLY right — quantity definitely rises, but the price can rise, fall, or stay put depending on which shift dominates. With price direction unknown, total revenue (price × quantity) could go any way."},{"id":"DSE2017/P1/Q17","q":"Suppose Good Y is an inferior good. When people's income rises and the production cost of Good Y increases, the equilibrium price of Good Y","opts":["will increase","will decrease","will remain unchanged","may increase or decrease"],"ans":3,"why":"For an INFERIOR good, higher income cuts demand (demand shifts left → price pressure DOWN), while the higher production cost cuts supply (supply shifts left → price pressure UP). The two shifts push the price in OPPOSITE directions, so the net effect on price is indeterminate (the quantity, though, definitely falls)."},{"id":"DSE2025/P1/Q13","q":"The supply curve of Good X is VERTICAL and its demand curve is downward-sloping. Suppose the supply of Good X decreases while the demand for Good X increases. As a result, the equilibrium price of Good X ______ and its equilibrium quantity ______.","opts":["will increase ... will decrease","will increase ... may increase, decrease or remain unchanged","will decrease ... will decrease","will decrease ... may increase, decrease or remain unchanged"],"ans":0,"why":"With a VERTICAL supply curve, the equilibrium quantity is set entirely by supply — a supply decrease moves the vertical line left, so quantity DEFINITELY falls (no ambiguity, unlike the usual opposing-shifts case). Both the leftward supply shift and the rightward demand shift push the price UP, so the price definitely rises."},{"id":"CE2002/P2/Q10","q":"Suppose there is a technological advance in the production of a normal good. In which of the following situations may the market price of the good remain unchanged?","opts":["The income of consumers decreases.","The government raises the unit sales tax on the good.","The demand for the good is perfectly inelastic.","The supply of the good is perfectly inelastic."],"ans":1,"why":"The technological advance shifts supply RIGHT, pressing the price down. A higher unit sales tax shifts supply LEFT — potentially offsetting the advance exactly and leaving the price unchanged. Lower income cuts demand for a normal good (price falls further, A); perfectly inelastic DEMAND is a vertical demand curve, so a supply shift still moves the price down (C); and a technological advance is precisely a supply change, contradicting D's fixed supply."}]},{"id":"in42","ch":"ch8","text":"Related-goods taxonomy drives most wrong answers: SUBSTITUTES (competitive demand — X pricier → Y demand up); COMPLEMENTS (joint demand — X pricier → Y demand down); DERIVED demand (input demanded because of its output: pilots from flights, paper from books — never the reverse); JOINT SUPPLY (beef & leather: more X means more Y); COMPETITIVE SUPPLY (same resources: more X means less Y). For income: NORMAL goods rise with income, INFERIOR goods rise when income FALLS.","qs":[{"id":"AL2005/P1/Q6","q":"An inferior good means","opts":["for the same type of goods, its quality is inferior.","a good consumed mostly by poor people.","a good an individual demands more as his income falls.","a good an individual demands less as his income falls."],"ans":2,"why":"'Inferior' in economics is purely about the INCOME-demand relationship: demand rises when income FALLS (and falls when income rises). It says nothing about physical quality (A) or who consumes it (B); D describes a NORMAL good."},{"id":"CE1999/P2/Q5","q":"In which of the following pairs does the demand for the first good create a derived demand for the second?","opts":["digital versatile disc (DVD) and laser disc (LD) player","wool and mutton","hardback book and printing paper","electricity and light bulb"],"ans":2,"why":"Printing paper is an INPUT used to produce hardback books, so demand for books creates a derived demand for the paper. DVDs and LD players are unrelated formats; wool and mutton are JOINTLY SUPPLIED products of sheep; electricity and light bulbs are complements (joint demand), not an output-input pair."},{"id":"CE2003/P2/Q9","q":"The government has imposed a fee for using the emergency services provided by public hospitals. As a result, patients' total expenditure on private medical services","opts":["will decrease.","will increase.","will remain unchanged.","may increase or decrease."],"ans":1,"why":"Charging for public emergency services makes the SUBSTITUTE dearer, shifting the DEMAND for private medical services right — both the price and quantity of private services rise, so total expenditure on them definitely increases. (Elasticity only matters for movements along a demand curve, not for shifts.)"},{"id":"CE2004/P2/Q6","q":"Suppose the Hong Kong government imposes a toll on highway users. The graph (showing a leftward SUPPLY shift — price up, quantity down) shows the effect of the toll on the market of","opts":["Mass Transit Railway (MTR) services.","private motor cars.","gasoline.","school bus services."],"ans":3,"why":"School buses USE the highways, so the toll raises their operating cost — shifting the SUPPLY of school bus services left, matching the graph. For MTR services the toll would RAISE demand (substitute), and for private cars and gasoline it would CUT demand (complements) — all demand-side effects, not the supply shift shown."}]},{"id":"in43","ch":"ch8","text":"The Alchian-Allen rule: adding the SAME per-unit/lump-sum amount to two prices LOWERS the relative price of the dearer/higher-quality option (mix shifts towards quality/long trips); REMOVING it does the opposite; an AD VALOREM (percentage) charge changes NOTHING relative. A charge per trip/visit/bottle also cuts the frequency of trips while raising quality-or-quantity per trip. Only the MIX/PROPORTION prediction is safe — absolute quantities all fall when everything gets dearer.","qs":[{"id":"AL2000/P1/Q22","q":"If a uniform per-unit tax on wine is removed, then","opts":["the price of high-quality wine will decrease.","the price of low-quality wine will decrease.","the relative price of high-quality wine will increase.","All of the above."],"ans":3,"why":"Removing the per-unit tax cuts BOTH wines' prices by the same dollar amount (A and B true). Because subtracting the same amount from both prices widens their ratio — e.g. ($100+$10)/($20+$10) ≈ 3.7 becomes $100/$20 = 5 — the RELATIVE price of the high-quality wine rises (C true). So all three hold: consumers will shift towards the cheaper (low-quality) wine relatively."},{"id":"AL2001/P1/Q8","q":"If the government charges the same lump-sum sales tax to each and every customer going to eat in restaurants,","opts":["the price of food in restaurants will be reduced.","a customer will eat less each time he goes to a restaurant and he will go less often.","a customer will go to restaurants less often, but he will go to the higher-class restaurants.","None of the above."],"ans":2,"why":"A lump-sum tax PER VISIT raises the cost of each visit but not of each extra dollar spent within a visit. Visits become more expensive → fewer visits; and since the fixed fee is spread over whatever is consumed in one visit, it lowers the RELATIVE price of higher-quality dining — so the customer consumes MORE per visit and shifts towards higher-class restaurants, not less per visit (ruling out B)."},{"id":"AL2001/P1/Q20","q":"A unit sales tax imposed on cigarettes implies that","opts":["the cigarettes produced will be longer.","more smokers will buy cigarettes by the carton.","the quantity of tobacco consumed will not be affected.","the age distribution of smokers will not be affected."],"ans":0,"why":"A tax of the same amount PER CIGARETTE lowers the relative price of 'more tobacco per stick' — the tax on a long cigarette is the same as on a short one, so quality/length per stick becomes relatively cheaper and producers respond with longer cigarettes. Total tobacco consumption falls (higher price — law of demand), so C is wrong; carton-buying and smoker demographics aren't implied by a per-stick tax."},{"id":"AL2004/P1/Q21","q":"There are two types of cars: luxury cars and ordinary cars. If a uniform lump-sum tax is imposed on the purchase of a new car,","opts":["the proportion of luxury cars will increase.","the proportion of ordinary cars will increase.","the number of luxury cars will increase.","the number of ordinary cars will increase."],"ans":0,"why":"A fixed tax per car adds the same dollar amount to both types, which lowers the RELATIVE price of luxury cars — so purchases shift towards luxury and its PROPORTION rises. But because all cars became absolutely more expensive, total purchases fall — so we cannot claim the absolute NUMBER of either type rises (ruling out C and D); only the proportion prediction is safe."}]},{"id":"in44","ch":"ch10","text":"'Price changed x%, quantity changed y%' — before computing anything, ask WHICH curve shifted. The event (weather, scare, boom, tax on a complement) shifts ONE curve, and the observed changes measure the elasticity of the OTHER (unshifted) curve. Demand shifted → you're reading SUPPLY elasticity; supply shifted → you're reading DEMAND elasticity. Naming the wrong side is the single most common elasticity error.","qs":[{"id":"CE1993/P2/Q28","q":"In a period of rainy weather, the price of umbrellas increased by 10% while the quantity transacted increased by 15%. What is the price elasticity of demand/supply of umbrellas in the above situation?","opts":["The demand is elastic.","The demand is inelastic.","The supply is elastic.","The supply is inelastic."],"ans":2,"why":"Rainy weather shifts the DEMAND for umbrellas right, so the observed price-quantity change traces a movement ALONG THE SUPPLY CURVE. Quantity supplied rose 15% in response to a 10% price rise — a bigger percentage response than the price change — so SUPPLY is elastic. Demand elasticity can't be measured here because the demand curve itself was shifting."},{"id":"CE2002/P2/Q8","q":"After a good harvest, the price of choi-sum has changed by 50% and the quantity transacted has changed by 40%. Which of the following statements is/are correct? (1) The quantity demanded of choi-sum has increased. (2) The demand for choi-sum has increased. (3) The total revenue from selling choi-sum has increased.","opts":["(1) only","(1) and (2) only","(2) and (3) only","(1), (2) and (3)"],"ans":0,"why":"The good harvest shifts SUPPLY right: the price FELL 50% and quantity rose 40% — a movement DOWN ALONG the demand curve, so quantity demanded increased (1 ✓) but the demand curve itself never moved (2 ✗). Since quantity rose by a smaller percentage (40%) than the price fell (50%), demand is inelastic here and total revenue FELL (3 ✗)."},{"id":"CE2006/P2/Q9","q":"Fearing an outbreak of bird flu, people consume less live poultry but more canned food. As a result, the price of a particular brand of canned food changed by 50% and its quantity transacted rose from 1,000 to 1,350 cans per month. We can conclude that within the above price range this canned food had","opts":["an elastic demand.","an inelastic demand.","an elastic supply.","an inelastic supply."],"ans":3,"why":"The bird-flu scare shifted DEMAND for canned food right, so the observed changes trace a movement ALONG THE SUPPLY CURVE: price rose 50% but quantity supplied rose only 35% (1,000→1,350) — a smaller percentage response, so SUPPLY is inelastic. Demand elasticity can't be read from these numbers because the demand curve itself was shifting."},{"id":"CE2008/P2/Q6","q":"Recently the stock market in Shanghai has become overheated. Compared with last year, the selling price of a financial magazine has increased from RMB¥5 to RMB¥8 while its sales volume has increased by 10%. In the above case,","opts":["the law of demand is violated.","the demand curve of the magazine can still be downward sloping.","the demand for the magazine is inelastic.","the supply of the magazine is elastic."],"ans":1,"why":"Price and quantity both rising reflects a rightward DEMAND SHIFT (the hot stock market raised interest in financial magazines) — each demand curve can remain perfectly downward-sloping while shifting outward, so no law is violated (A wrong). Demand elasticity can't be computed from two equilibrium points on DIFFERENT demand curves (C), and along the supply curve quantity rose 10% against a 60% price rise — inelastic, not elastic (D)."}]},{"id":"in45","ch":"ch10","text":"Constant QUANTITY at any price = perfectly INELASTIC (E = 0). Constant EXPENDITURE/spending at any price = UNITARY elastic (E = 1). 'I always buy the same amount' vs 'I always spend the same amount' are different claims. From a P-TR table, always recover Q = TR ÷ P first: if Q never changes, E = 0 (not merely 'inelastic').","qs":[{"id":"CE2001/P2/Q6","q":"'I love to take photos very much. Even though the price of film has increased by 30%, my spending on it will still be the same.' Mary said. Mary's demand for film is","opts":["perfectly inelastic.","inelastic.","elastic.","unitarily elastic."],"ans":3,"why":"Constant SPENDING under a price change is the defining test of unitary elasticity: the 30% price rise must be exactly offset by a 30% (in percentage terms) fall in quantity, keeping price × quantity unchanged. Perfectly inelastic would mean constant QUANTITY — in which case spending would have risen 30%."},{"id":"CE2005/P2/Q12","q":"Price ($): 1, 2, 3 — Total sales revenue ($): 100, 200, 300. Within the above price range, the elasticity of demand of Good X is","opts":["equal to zero.","greater than zero and smaller than one.","equal to one.","greater than one."],"ans":0,"why":"Quantity = revenue ÷ price = 100, 100, 100 at every price — the quantity demanded doesn't change at all as the price triples. A zero quantity response means demand is PERFECTLY INELASTIC: elasticity equals zero."},{"id":"CE2009/P2/Q9","q":"Mr Chan travels frequently between Hong Kong and Beijing. Last year, even though the price of air-tickets increased by 50%, his total expenditure on these air-tickets remained unchanged. If his demand for these air-tickets last year remained the same as the previous year, his demand would have been","opts":["perfectly inelastic.","inelastic.","unitarily elastic.","elastic."],"ans":2,"why":"Unchanged total expenditure under a 50% price rise means the quantity bought fell by exactly the offsetting percentage, keeping price × quantity constant — the defining property of UNITARY elasticity. Perfectly inelastic demand (constant quantity) would have RAISED his spending by 50%."},{"id":"CE2010/P2/Q9","q":"The demand elasticity of Good X is equal to one. Which of the following is a correct description of Good X?","opts":["An increase in its price will not affect the quantity demanded.","An increase in the price of its substitute will not affect the quantity demanded.","The imposition of a per unit sales tax on it will not affect consumers' expenditure on it.","A per unit subsidy offered by the government will not affect the total revenue (including the subsidy) of the sellers."],"ans":2,"why":"With unitary elasticity, consumer expenditure (price × quantity) stays CONSTANT under any price change — so the price rise caused by a per-unit tax leaves consumers' total spending on the good unchanged. A describes perfectly inelastic demand; B concerns cross-price effects, unrelated to own-price elasticity; and D fails because sellers' receipts including the subsidy equal consumer spending PLUS the subsidy payment, which changes with quantity."}]},{"id":"in46","ch":"ch10","text":"Total-revenue test: price ↑ with TR ↑ → inelastic; price ↑ with TR ↓ → elastic; TR unchanged → unitary. On a straight-line demand curve elasticity FALLS as price falls — TR peaks at the midpoint, so a price cut below the unit-elastic point starts REDUCING revenue. Elasticity rises with more substitutes, larger budget share, and longer adjustment time; a per-unit tax cuts equilibrium quantity under ANY of these — elasticity only decides by how much.","qs":[{"id":"AL2005/P1/Q7","q":"If the price elasticity of demand is greater than one, it means","opts":["when demand increases total revenue increases.","when demand increases the price goes up.","when the price goes down total revenue decreases.","when the price goes up total revenue decreases."],"ans":3,"why":"Elastic demand (E>1) means quantity demanded changes by a LARGER percentage than price — so a price rise cuts quantity so much that total revenue falls. C states the reverse (elastic demand means a price CUT raises revenue), and A/B describe demand SHIFTS, which elasticity (a property of movements along the curve) says nothing about."},{"id":"CE1990/P2/Q5","q":"Suppose there is a good harvest of apples this year. Under which of the following conditions will apple growers earn more income?","opts":["They sell more apples.","The demand for apples is elastic.","The supply of apples is inelastic.","The government fixes a minimum price on apples."],"ans":1,"why":"A good harvest shifts supply right and pushes the price DOWN; total revenue then rises only if quantity demanded expands by a larger percentage than the price fall — i.e. only if demand is ELASTIC. Merely selling more apples (A) doesn't guarantee more revenue when the price falls; supply elasticity (C) doesn't determine the revenue direction; and a minimum price (D) would leave apples unsold rather than raise income."},{"id":"CE1992/P2/Q28","q":"Suppose the demand for wheat is elastic. Which of the following will decrease if there is a poor harvest of wheat? (1) the price of wheat (2) the total expenditure on wheat (3) the demand for wheat (4) the quantity of wheat transacted","opts":["(1) and (2) only","(1) and (3) only","(2) and (4) only","(3) and (4) only"],"ans":2,"why":"A poor harvest shifts supply LEFT: the price RISES (not falls — 1 wrong) and the quantity transacted falls (4 ✓). With demand elastic, the quantity falls by a larger percentage than the price rises, so total expenditure falls too (2 ✓). The DEMAND curve itself doesn't move — the harvest is a supply-side event (3 wrong)."},{"id":"CE1996/P2/Q10","q":"Changes in bus fares do not affect the number of passengers before 9 am, but the number travelling after 9 am changes by a greater percentage than the fare change. In order to obtain the largest revenue, the bus company should","opts":["increase the fares before and after 9 am","not change the fares before 9 am but reduce the fares after 9 am","Increase the fares before 9 am. But reduce the fares after 9 am.","Not change the fares before 9am. But increase the fares after 9am."],"ans":2,"why":"Before 9 am demand is perfectly INELASTIC (numbers unchanged by fare), so raising that fare adds pure revenue with no passenger loss. After 9 am demand is ELASTIC (quantity changes by a larger percentage than fare), so CUTTING that fare raises revenue, since ridership expands proportionally more than the fare falls. Raise the inelastic fare, cut the elastic one."}]},{"id":"in47","ch":"ch8","text":"A shortage/surplus needs a price STUCK away from equilibrium (price ceiling, fixed official price, minimum wage). If the price is free, demand/supply shifts just move the equilibrium — no persistent shortage. Queues, draws, and ballots signal a price below market-clearing AND non-price competition, and the full cost to the buyer (price + queuing time) exceeds the money price — which is why black markets emerge. But a seller's own low price is NOT a government price ceiling.","qs":[{"id":"CE1990/P2/Q4","q":"Which of the following will result in a 'shortage' of housing?","opts":["There is an increase in population.","Many people cannot afford to buy a flat.","The supply of housing is inelastic.","The government sets the price of housing below the market price."],"ans":3,"why":"A shortage is a DISEQUILIBRIUM — quantity demanded exceeding quantity supplied at the prevailing price — and it persists only when the price is prevented from rising, e.g. when the government sets it below the market-clearing level. A population increase just shifts demand and pushes the free-market price up to a new equilibrium (no lasting shortage); unaffordability and inelastic supply describe high prices or steep curves, not excess demand at the current price."},{"id":"CE1995/P2/Q1","q":"It was reported that many people queued for two days in order to get the monthly parking ticket for a certain car park. This phenomenon implies (1) scarcity in parking spaces. (2) the existence of competition. (3) shortage of parking spaces.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"Queuing for two days shows all three: parking spaces are scarce (limited relative to wants) (1); queuing itself IS a form of (non-price) competition for the good (2); and the fact that people must queue at the posted price means quantity demanded exceeds quantity supplied at that price — a shortage (3)."},{"id":"CE1995/P2/Q9","q":"The flats under the Home-Ownership Scheme are allocated by a draw. This implies that","opts":["the Housing Authority has under-estimated the demand for this type of housing.","a draw is the fairest method in allocating resources.","the price of this type of housing is below its cost.","the price of this type of housing is below the equilibrium prices."],"ans":3,"why":"Needing a draw (lottery) to allocate the flats means more people want them at the set price than there are flats available — quantity demanded exceeds quantity supplied, which happens precisely when the price is set below the equilibrium level. It implies nothing about demand FORECASTING (A), fairness judgments are normative claims not implications (B), and price relative to COST (C) is a different matter from price relative to market-clearing level."},{"id":"CE1996/P2/Q8","q":"Shortage occurs when","opts":["a price floor below the equilibrium price is imposed.","An effective price ceiling is imposed.","The supply is reduced.","The demand increase sharply."],"ans":1,"why":"A shortage requires the price to be HELD below equilibrium — exactly what an effective price ceiling (a legal maximum below the market-clearing price) does. A price floor BELOW equilibrium is non-binding and changes nothing (A); and if supply falls or demand rises in a free market, the price simply rises to a new equilibrium, so no persistent shortage results (C, D)."}]},{"id":"in48","ch":"ch8","text":"Quantity transacted = the SHORT side of the market. In a shortage, transactions equal QUANTITY SUPPLIED (everyone selling sells; not everyone buying buys); in a surplus, they equal QUANTITY DEMANDED. Raising a below-equilibrium price towards equilibrium moves transactions UP the supply curve — price and quantity transacted both rise, so total revenue must rise (no elasticity condition needed until the price passes equilibrium).","qs":[{"id":"CE2000/P2/Q3","q":"In the diagram (a market with price initially below equilibrium and excess demand), when the price increases from P1 to P2,","opts":["the excess demand will disappear.","the quantity transacted will decrease.","the total revenue will necessarily increase.","the total revenue will increase only if the demand is inelastic."],"ans":2,"why":"With the price below equilibrium, the quantity transacted equals the QUANTITY SUPPLIED (the short side of the market). Raising the price from P1 to P2 increases quantity supplied, so quantity transacted RISES — and with both price and quantity transacted higher, total revenue must increase. Excess demand shrinks but only fully disappears if P2 reaches the equilibrium price (A overstates); B has the direction backwards; and D's elasticity condition applies to price rises ABOVE equilibrium where transactions follow the demand curve, not here."},{"id":"DSE2024/P1/Q12","q":"On 'Hong Kong Cinema Day', tickets were priced at HK$30 across all participating cinemas. Many people failed to buy any discounted ticket even after queuing for hours. From the information above, we can infer that the quantity transacted of the discounted film tickets is","opts":["equal to the quantity supplied and smaller than the quantity demanded","equal to the quantity supplied and larger than the quantity demanded","equal to the quantity demanded and smaller than the quantity supplied","equal to the quantity demanded and larger than the quantity supplied"],"ans":0,"why":"People failing to buy at the discounted price means quantity demanded exceeded quantity supplied — a shortage. In a shortage, every ticket supplied gets sold, so the quantity transacted equals the QUANTITY SUPPLIED (the short side of the market), which is smaller than the quantity demanded."}]},{"id":"in49","ch":"ch8","text":"Two functions of price: RATIONING decides who gets the EXISTING stock (touts' resale prices, descending-price tickets — goods go to highest-valued buyers); ALLOCATIVE guides where PRODUCTIVE RESOURCES flow (high prices attract producers into an industry). Resale of already-issued tickets can only be rationing; factories being built in response to demand is allocative. Gifts and freebies involve no price signal at all.","qs":[{"id":"DSESP/P1/Q10","q":"Peter Pang is an indigenous male resident in the New Territories. Which of the following are guided by price signals? (1) He buys a concessionary house from his cousin. (2) He is given a red packet by the Indigenous Inhabitant Representative during the Lunar New Year. (3) He rents one of his concessionary houses to a tenant who is not an indigenous resident.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":1,"why":"Buying a house (1) and renting one out (3) are both market transactions conducted at an agreed price — the price signal guides both the buyer/tenant's and seller/landlord's decisions. A red packet (2) is a pure GIFT: no price is paid, so no price signal is involved in that transfer."},{"id":"DSE2017/P1/Q12","q":"A famous artist held a show. Many people complained that they could not buy a ticket. Ticket touts resold the tickets on the Internet and some buyers paid a price higher than HK$10,000 for a ticket. The above case illustrates the ______ function of price because ______.","opts":["rationing ... the tickets are rationed to the highest-valued buyers","rationing ... demand will be reduced by a higher price","allocative ... more profits can be earned with a higher price","allocative ... more resources should be allocated to the producer to raise the supply"],"ans":0,"why":"The touts' high resale prices decide WHO among competing buyers gets the existing fixed stock of tickets — those willing to pay the most, i.e. the highest-valued buyers. Deciding who gets existing goods is the RATIONING function of price; the ALLOCATIVE function is about guiding producers to shift resources into or out of producing a good, which isn't what resale of already-issued tickets does."},{"id":"DSE2020/P1/Q13","q":"In recent years, the rise in demand for private cars in China has attracted Volkswagen, a German car manufacturer, to set up car manufacturing factories in China. The above case illustrates the __________ function of price because __________.","opts":["rationing ... private cars are sold to the highest-valued users in China","rationing ... fewer buyers are willing to buy private cars in Germany","allocative ... the supply of private cars falls in Germany","allocative ... more resources are allocated to the production of private cars in China"],"ans":3,"why":"Rising demand (and hence higher prices/profitability) in China signalled producers to move productive resources — new factories — into car production there. Prices guiding where PRODUCTIVE RESOURCES flow is the ALLOCATIVE function; the rationing function concerns dividing up existing output among competing buyers, which is not what attracting new factories describes."},{"id":"DSE2022/P1/Q10","q":"A Hong Kong YouTube channel held its first live show with this ticket-pricing arrangement: the price adjusts daily at 10 am, starting at $10,000 on 9 August, then $5,000, $2,000, ... falling to $20 by 31 August and $10 from 1 September onwards. The above case illustrates the __________ function of price because _______________.","opts":["allocative ... more resources can be allocated to the production of the show","allocative ... the arrangement can guarantee a sell-out of the tickets","rationing ... the tickets are sold to the highest-valued buyers","rationing ... the tickets are distributed on a first-come, first-served basis"],"ans":2,"why":"The descending-price design means whoever values a ticket most buys earliest at the highest price, and lower-value buyers wait for lower prices — the price is deciding WHO gets the fixed stock of tickets, the RATIONING function, with tickets going to the highest-valued buyers first. It is price, not queue position per se, doing the rationing (ruling out D), and nothing here is about steering productive resources into making more shows (ruling out the allocative options)."}]},{"id":"in50","ch":"ch12","text":"Classify market structure by NUMBER of sellers + PRODUCT type: perfect competition (many sellers, homogeneous, price-takers, free entry, perfect info); monopolistic competition (many sellers, DIFFERENTIATED, price-searchers, free entry); oligopoly (a FEW dominant sellers, INTERDEPENDENT); monopoly (ONE seller, no close substitutes). In data questions the conclusion must follow from what the table SHOWS — market-share concentration proves 'a few dominant sellers' (oligopoly), but interdependence, though true of oligopolies, can't be read off a share table.","qs":[{"id":"AL2001/P1/Q29","q":"Which of the following comes closest to a product sold in a price-takers' market?","opts":["jade","gold","diamond","pearl"],"ans":1,"why":"Gold is graded into standardized purities and traded on world markets at one prevailing price — homogeneous product, many buyers and sellers, near-perfect information: the closest to perfect competition. Jade, diamonds, and pearls vary piece by piece (heterogeneous), so each seller has some pricing power."},{"id":"CE1991/P2/Q27","q":"The reasons for classifying the video-renting industry in Hong Kong as monopolistic competition are: (1) The entry and exit of firms are restricted. (2) The firms engage in non-price competition. (3) The services of the firms are not homogeneous. (4) The firms charge the same price.","opts":["(1) and (2) only","(1) and (4) only","(2) and (3) only","(3) and (4) only"],"ans":2,"why":"Monopolistic competition means many sellers offering DIFFERENTIATED products (3), competing on both price and non-price dimensions like service and location (2). Entry and exit are FREE, not restricted (1), and differentiated sellers charge DIFFERENT prices, not the same one (4)."},{"id":"CE1992/P2/Q29","q":"The market structure of gasoline supply in Hong Kong is best classified as","opts":["perfect competition.","monopolistic competition.","oligopoly.","monopoly."],"ans":2,"why":"Hong Kong's gasoline is supplied by only a handful of large companies (Esso, Shell, Caltex, etc.) that dominate the market — a few interdependent sellers is the defining mark of OLIGOPOLY."},{"id":"CE1993/P2/Q30","q":"In economics, which of the following statements about 'market' is correct?","opts":["All buyers and sellers must meet at a physical location for transactions to take place.","Under monopolistic competition, the entry of firms is restricted.","Firms in an oligopolistic market compete in price only.","A perfectly competitive firm cannot influence the market price by itself."],"ans":3,"why":"A perfectly competitive firm is a price-taker — too small a share of the market to move the price alone. A market needs no physical location (A); monopolistic competition has FREE entry (B); and oligopolists compete in BOTH price and non-price ways (C)."}]},{"id":"in51","ch":"ch12","text":"Monopoly myths: a monopolist is NOT guaranteed profit (it can make losses), does NOT face zero competition (broad substitutes always exist), and DOES lose some customers if it raises price (demand still slopes down). 'No CLOSE substitutes' — not 'no substitutes'. A franchise is one SOURCE of monopoly power, not a requirement; a natural monopoly comes from economies of scale, not a legal entry ban.","qs":[{"id":"AL2004/P1/Q12","q":"A firm is said to be a price-taker if","opts":["it has the same cost curves as other competing firms.","it cannot alone decide on its output level.","it cannot ask a price higher than the market price and expect to survive.","out of syllabus"],"ans":2,"why":"A price-taker faces a perfectly elastic demand at the market price: charging even slightly above it loses ALL customers, so it cannot ask a higher price and survive. Identical cost curves aren't required (A), and a price-taker DOES choose its own output — what it can't choose is the price (B)."},{"id":"CE1993/P2/Q22","q":"Which of the following statements about a monopolist is true?","opts":["It has a high set-up cost.","It sells only one type of product.","It is regulated by the government.","There are no close substitutes for its product."],"ans":3,"why":"The defining feature of monopoly is being the sole seller of a product with NO CLOSE SUBSTITUTES. High set-up costs (A) and government regulation (C) are possible but not necessary features, and a monopolist can sell many product lines (B)."},{"id":"CE1996/P2/Q58","q":"Which of the following is NOT a difference between monopoly and perfect competition?","opts":["Advertisements are found in monopoly but not in perfect competition.","Firms are free to enter a perfectly competitive market but not a monopoly.","A monopolist can influence the market price while a competitive firm cannot.","Monopolists make greater profits than perfectly competitive firms."],"ans":3,"why":"Profit levels are NOT a defining difference — a monopolist can perfectly well make losses (nothing guarantees profit), so 'monopolists make greater profits' is not a reliable distinction. Advertising, entry conditions, and price-setting power are genuine structural differences between the two market types."},{"id":"CE1997/P2/Q59","q":"With a number of new firms entering the market of mobile phone services, which of the following would LEAST likely occur?","opts":["The price of mobile phone services would decrease.","The market share occupied by existing firms would decrease.","Firms would engage more in non-price competition.","The market would become a perfectly competitive one."],"ans":3,"why":"More entrants push prices down, dilute incumbents' market shares, and intensify non-price competition — all likely. But mobile services remain DIFFERENTIATED (networks, plans, coverage) with imperfect information, so the market cannot become perfectly competitive merely by adding sellers."}]},{"id":"in52","ch":"ch12","text":"Different prices for a 'same' good usually signal monopolistic competition, not a puzzle: causes are product differentiation (better service, warranty, location) or imperfect information (search costs). Watch the direction — a MORE flexible/better feature (free cancellation, sea view, weekend) should cost MORE, so an option where the superior product is cheaper is the trap. A deliberate price cut/price war also proves a firm is a price-SEARCHER, hence not perfectly competitive.","qs":[{"id":"AL2007/P1/Q25","q":"Non-price competition implies","opts":["surplus.","shortage.","scarcity.","monopoly."],"ans":2,"why":"Competition in ANY form — price or non-price — exists only because goods are scarce and must be allocated among competing users. Non-price competition doesn't require a surplus or shortage (disequilibria), and it occurs in most market structures, not just monopoly."},{"id":"CE1996/P2/Q25","q":"Newspapers in Hong Kong competed among themselves by cutting prices in 1995. This implies that","opts":["the total revenue of a newspaper will increase if its demand is inelastic.","The profit of a newspaper will increase if its demand is elastic.","Total revenue in the magazine industry will increase because newspapers and magazines are in competitive demand.","The market structure of newspapers is not perfect competition."],"ans":3,"why":"Firms that can CHOOSE to cut their own prices are price-searchers — in perfect competition every firm simply takes the market price, so a deliberate price war proves the market isn't perfectly competitive. A is backwards (a price CUT with inelastic demand lowers revenue); B confuses revenue with profit; and cheaper newspapers pull readers AWAY from magazines (substitutes), cutting magazine revenue (C)."},{"id":"CE2000/P2/Q26","q":"Private doctors in Hong Kong charge different prices for their medical services. This is because","opts":["people do not have sufficient knowledge of their illnesses.","there are many doctors in the market.","the private doctors' services are different.","there are entry barriers to becoming a doctor."],"ans":2,"why":"Different prices for the 'same' service reflect PRODUCT DIFFERENTIATION — each doctor's experience, specialty, reputation, and location make their service a distinct product commanding its own price (the monopolistic-competition story). Many sellers alone (B) would push towards ONE price if services were identical."},{"id":"DSE2020/P1/Q10","q":"Alfred booked a room in a resort hotel, then found Betty had booked a room in the SAME hotel at a lower price. Which of the following are possible reasons for the price difference? (1) Alfred's booking was non-refundable while Betty's was with free cancellation. (2) Alfred booked a weekend while Betty booked a weekday. (3) Alfred booked a sea-view room while Betty booked a street-view room.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":2,"why":"Weekend vs weekday stays (2) and sea view vs street view (3) are genuinely DIFFERENT products, so different prices are natural. But (1) runs the WRONG WAY: free-cancellation flexibility is a superior feature that normally costs MORE — it can't explain Betty (with free cancellation) paying LESS than non-refundable Alfred."}]},{"id":"in53","ch":"ch13","text":"Efficiency is the MARGINAL condition MSB = MSC (equivalently: total social surplus maximised, all gains captured, deadweight loss zero). It is NOT 'consumer surplus maximised' (that overshoots output), NOT 'producer surplus = consumer surplus' (that's distribution), and NOT 'total benefit = total cost'. A price ceiling can RAISE consumer surplus yet still be inefficient — a higher CS does not mean higher efficiency.","qs":[{"id":"AL2002/P1/Q10","q":"Market price","opts":["is a criterion which determines who wins and who loses.","is the maximum amount a consumer is willing to pay at the margin.","may not be necessary in directing the use of scarce resources.","All of the above."],"ans":3,"why":"All three are correct: price rations goods (deciding who gets them — who 'wins'), the market price equals the marginal consumer's maximum willingness to pay (marginal benefit of the last unit), and price is only ONE possible way to direct resources — command systems, queuing, or ballots can also do it (so price 'may not be necessary')."},{"id":"DSESP/P1/Q8","q":"The marginal cost schedule of a firm can be interpreted as its supply schedule in the production of a good because","opts":["marginal cost will increase when the output of the firm increases.","we can tell the quantity of the good the firm plans to produce from the marginal cost schedule given the price of the good.","the quantity of the good the firm plans to produce depends positively on the marginal cost of producing the good.","we can tell the price of the good from the marginal cost schedule given the quantity of the good."],"ans":1,"why":"A supply schedule answers: 'at each price, how much will the firm produce?' Since a profit-maximising firm produces up to where MC = price, the MC schedule answers exactly that question — GIVEN the price, it tells the planned quantity. A describes rising MC but not why it acts as supply; C reverses the logic (quantity responds to PRICE, not to cost 'positively'); D reads the schedule in the wrong direction for a supply interpretation."},{"id":"DSEPP/P1/Q15","q":"(Diagram: perfectly competitive market for Good X with a price floor set at P1 above the equilibrium.) As a result,","opts":["the deadweight loss is equal to area BEF.","the producer surplus is equal to area P1BC0","the consumer surplus is equal to area AEPe.","the total social surplus is equal to area P1BCG"],"ans":1,"why":"With the floor at P1, the quantity transacted shrinks to the quantity DEMANDED at P1. Producer surplus is the area between the floor price and the supply curve up to that transacted quantity — area P1BC0 in the diagram. The other options mark the wrong regions: the DWL and CS areas must be measured at the REDUCED quantity, not the original equilibrium quantities."},{"id":"DSEPP/P1/Q17","q":"Economic efficiency is attained when (1) total benefits to consumers are maximized. (2) all potential gains are fully captured. (3) marginal social benefits are equal to marginal social costs.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":2,"why":"Efficiency means no unexploited gains remain (2), which occurs exactly where marginal social benefit equals marginal social cost (3). It is TOTAL SOCIAL SURPLUS — the sum of all parties' gains — that is maximized, not consumers' benefits alone (1): maximizing consumer benefits would require output far past the efficient point."}]},{"id":"in54","ch":"ch13","text":"Deadweight loss = lost total social surplus whenever MB ≠ MC. Price ceiling, price floor, minimum wage, tax, and binding quota all push quantity BELOW the efficient level (underproduction: MB > MC). A SUBSIDY pushes quantity ABOVE it (overproduction: MC > MB) — the DWL is the subsidy cost minus the CS+PS gains. A non-binding control (floor below / ceiling above equilibrium) changes nothing. When demand rises against a fixed quota, the MB–MC gap and the DWL grow.","qs":[{"id":"DSESP/P1/Q20","q":"Suppose the government provides a per-unit subsidy to the producers of a good. This would lead to","opts":["an increase in consumer surplus and a fall in producer surplus, so having an ambiguous effect on efficiency.","an increase in producer surplus and a fall in consumer surplus, so having an ambiguous effect on efficiency.","an improvement in efficiency because both sellers and buyers would benefit from the subsidy.","a deadweight loss because the amount of subsidy provided by the government is greater than the sum of the increase in consumer and producer surpluses."],"ans":3,"why":"A subsidy pushes output BEYOND the efficient level: consumer surplus AND producer surplus both rise, but the government's subsidy expenditure exceeds those combined gains — the shortfall is the deadweight loss from over-production. A and B wrongly claim one side loses, and C ignores the taxpayer cost entirely."},{"id":"DSE2012/P1/Q19","q":"The increase of an effective quota on a good will result in (1) an increase in the quantity transacted of the good. (2) a further improvement in the quality of the good. (3) a smaller deadweight loss.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":1,"why":"Relaxing an effective quota lets quantity rise towards the free-market equilibrium (1), which shrinks the under-production deadweight loss (3). The quality-upgrading effect works the other way: it's IMPOSING/tightening a quota that pushes suppliers towards higher quality per unit — RAISING the quota weakens that pressure, so (2) is wrong."},{"id":"DSE2018/P1/Q22","q":"(Diagram: demand and supply of Good X with a per-unit tax raised from t1 to t2.) Which of the following statements is correct?","opts":["The deadweight loss will increase by area bcgh.","The deadweight loss will decrease by area abh.","The new deadweight loss is area bcf.","The new deadweight loss is area aci."],"ans":0,"why":"Raising the tax widens the wedge between what buyers pay and sellers keep, cutting the quantity transacted further below the efficient level. The deadweight loss triangle grows by the additional area between the demand and supply curves over the newly-lost units — area bcgh in the diagram. The other options mark the wrong regions."},{"id":"DSE2020/P1/Q17","q":"A non-profit organisation supports increasing the cigarette tax, revealing that every 10% increase in cigarette prices reduces quantity transacted by 4%. Which of the following statements is INCORRECT?","opts":["Law of demand is illustrated in the above case.","The total expenditure on cigarette will increase after the increase of the cigarette tax.","The increase in cigarette tax may lead to a greater income inequality.","The cigarette tax could help reduce the problem of under-production of cigarette."],"ans":3,"why":"Smoking imposes external costs, so cigarettes are OVER-produced relative to the efficient level — a tax reduces over-production; calling it 'under-production' is exactly backwards, making D the incorrect statement. A is correct (price up 10%, quantity down 4% obeys the law of demand); B is correct (elasticity 0.4 is inelastic, so expenditure rises); C is plausibly correct since cigarette taxes fall relatively harder on lower-income smokers."}]},{"id":"in55","ch":"ch13","text":"A change that merely shifts a curve and re-clears the market is NOT inefficiency. Rising marginal cost lowers total social surplus but efficiency is STILL attained (MB = MC at the new equilibrium). Only a WEDGE between MB and MC — from a tax, control, externality, or quota — creates a deadweight loss. Distinguish 'smaller surplus' (a level) from 'inefficiency' (an uncaptured gain).","qs":[{"id":"DSE2014/P1/Q15","q":"The government proposes to raise the Cross-Harbour Tunnel toll to lessen rush-hour congestion; the tunnel's maximum vehicular capacity is fixed. Which of the following statements are correct? (1) The demand for the tunnel service will decrease. (2) The total revenue of the tunnel will increase. (3) The deadweight loss caused by traffic congestion will decrease. (4) The opportunity cost of the drivers using the tunnel will increase.","opts":["(1) and (3) only","(1) and (4) only","(2) and (3) only","(2) and (4) only"],"ans":2,"why":"With congestion (excess demand) at the current toll, raising the toll leaves the tunnel still running at full capacity — same quantity at a higher price, so total revenue rises (2) — and the smaller excess demand means less time wasted queuing, cutting the congestion deadweight loss (3). A toll rise moves ALONG the demand curve (quantity demanded falls, demand itself doesn't decrease — 1 wrong), and drivers' full cost need not rise, since the higher toll is offset by less queuing time (4 wrong)."},{"id":"DSE2019/P1/Q22","q":"Suppose there is a bad harvest of flowers due to global warming. The marginal benefit of flowers will __________ and the total exchange value __________.","opts":["decrease ... will decrease","increase ... will increase","decrease ... may decrease or increase","increase ... may decrease or increase"],"ans":3,"why":"The bad harvest cuts supply, so fewer flowers are consumed — moving UP the demand (marginal benefit) curve, the MB of the last unit INCREASES. Total exchange value = price × quantity: the price is higher but the quantity smaller, so it may rise or fall depending on the elasticity of demand."},{"id":"DSE2024/P1/Q15","q":"The government imposes an effective catch limit (quota) on Pacific bluefin tuna. If the catch limit is LOWERED, the marginal benefit of the last unit of tuna will _______ and consumers' total expenditure on tuna ________.","opts":["increase ... will increase","decrease ... will decrease","increase ... may decrease or increase","decrease ... may decrease or increase"],"ans":2,"why":"Tightening the quota cuts the quantity further — moving UP the demand (marginal benefit) curve, so the MB of the last unit INCREASES. Total expenditure = price × quantity: the price rises while the quantity falls, so expenditure may rise or fall depending on the elasticity of demand over that range."},{"id":"DSE2025/P1/Q18","q":"Due to poor harvests of oranges, many juice producers use other fruits such as mandarins as an alternative ingredient. Based on the above information, which of the following is correct?","opts":["There is a deadweight loss in the market of oranges.","The total revenue of orange sellers may increase.","The total social surplus in the market of mandarins decreases.","The total exchange value of mandarins may decrease."],"ans":1,"why":"The poor harvest cuts orange supply and raises the price; if demand for oranges is inelastic, sellers' total revenue rises — so it MAY increase (B). A supply shift moves the market to a new clearing equilibrium, creating no deadweight loss (A); the switch to mandarins RAISES mandarin demand, so mandarin prices and quantities rise — total social surplus and total exchange value in the mandarin market INCREASE, not decrease (C, D)."}]},{"id":"in56","ch":"ch13","text":"External COST (negative externality) → the actor imposes uncompensated harm on others → MSC > MPC → OVERproduction/overuse (correct with a tax, charge, fine, or credit). External BENEFIT (positive externality) → the actor confers uncompensated benefit → MSB > MPB → UNDERproduction (correct with a subsidy, or private payment TO the actor). Get the over/under direction from which side (cost or benefit) spills over.","qs":[{"id":"AL1999/P1/Q27","q":"Which of the following implies a divergence between private and social costs?","opts":["Male students contribute money towards buying perfumes for female students.","A student accidentally pours coffee on a professor's jacket and says sorry.","A husband complains about his wife all the time but refuses to get a divorce.","A piano player who never receives any payment for his music from his neighbour always plays the piano up to the point that the marginal value of his piano play to his neighbour is zero."],"ans":1,"why":"The coffee ruins the professor's jacket — a real cost borne by a third party — while the student pays nothing beyond an apology: private cost (to the student) falls short of social cost, the definition of a cost divergence. A is a voluntary, paid transfer (no uncompensated third-party cost); C stays inside the household; and D concerns external BENEFITS, not costs."},{"id":"DSE2013/P1/Q20","q":"A beekeeper keeps bees for honey. The bee-keeping benefits nearby orchard farmers because the bees help pollinate their fruit. Which of the following statements about this case is correct?","opts":["There will be a divergence between private and social benefits and the honey is over-produced.","The beekeeper should be subsidized by the government to improve economic efficiency.","If the value of honey is higher than the value of fruits, there is no need for the government to intervene to correct the externality.","There will be no divergence between private and social benefits if the orchard nearby is owned by the beekeeper."],"ans":3,"why":"If the beekeeper OWNS the orchard, the pollination benefit accrues to himself — the externality is internalized and private benefit equals social benefit. With an external BENEFIT the activity is UNDER-produced, not over-produced (A reversed); a subsidy is one possible remedy but 'should be' isn't established as the correct/necessary fix (B); and comparing the values of honey and fruit (C) is irrelevant to whether a divergence exists."},{"id":"DSE2014/P1/Q18","q":"Korean pop singers are becoming more popular in Hong Kong. To these singers, which of the following are their private benefits? (1) the rise in royalties from the sales of their albums (2) the rise in sales revenue of Korean-designed fashion (3) the rise in the number of tourists visiting Korea (4) the rise in revenue shared from their concerts held in Hong Kong","opts":["(1) and (3) only","(1) and (4) only","(2) and (3) only","(2) and (4) only"],"ans":1,"why":"Private benefits are those captured by the singers THEMSELVES: album royalties (1) and their share of concert revenue (4) flow directly to them. Higher Korean-fashion sales (2) and more tourism to Korea (3) benefit THIRD PARTIES the singers can't charge — those are the external benefits of their popularity."},{"id":"DSE2014/P1/Q19","q":"Which of the following are ways to lessen the problem of divergence between private and social costs in Hong Kong? (1) to collect a sewage charge (2) to collect a university tuition fee (3) to collect a charge on electricity (4) to collect a levy on plastic bags","opts":["(1) and (3) only","(1) and (4) only","(2) and (3) only","(2) and (4) only"],"ans":1,"why":"A sewage charge (1) and a plastic-bag levy (4) make polluters pay for the environmental damage they impose on others — raising private cost towards social cost, narrowing the divergence. University tuition (2) concerns education, which involves external BENEFITS, and an electricity charge (3) is just the ordinary price of a private good, not a corrective charge on an external cost."}]},{"id":"in57","ch":"ch13","text":"No divergence — hence NO externality — when the effect is internalized: the same person owns both sides (the beekeeper owns the orchard; sheep damage the farmer's OWN crops), or the actor is in fact compensated at the margin (free videos that boost the maker's ad/tuition income until MPB = MSB). Also: prices capitalized into a market (a flat's value rising) capture the effect, so it isn't an uncompensated spillover. Coasean point: efficiency can be reached by private bargaining in EITHER direction, regardless of who holds the right.","qs":[{"id":"DSESP/P1/Q18","q":"In which of the following situations will there be NO divergence between private and social costs / benefits?","opts":["A chemical factory upstream pollutes a river without considering the damage inflicted upon fish farmers downstream.","A diner smokes in a restaurant without considering the effects on people nearby.","A farmer raises some sheep which damage the crops of nearby farmland owned by the farmer.","A pianist plays the piano at home and receives no payment from his neighbour who enjoys the music."],"ans":2,"why":"The sheep damage crops on land the SAME farmer owns — the cost falls entirely on the decision-maker himself, so it is fully internalized and private cost equals social cost. Pollution hitting downstream fish farmers (A) and second-hand smoke (B) impose uncompensated costs on OTHERS, and the unpaid piano enjoyment (D) is an uncaptured benefit to a third party — all divergences."},{"id":"DSE2025/P1/Q21","q":"A developer plans to construct a tall building that will block the sea view enjoyed by some households in another building. In this situation, efficiency may be attained if _______. (1) the government restricts the height of the new building (2) the developer pays a compensation to each affected household for blocking the sea view (3) the affected households pay the developer to request it to reduce the height of the new building","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"All three CAN attain efficiency: a government height restriction (1) is a direct regulation that may set output at the efficient level, while (2) and (3) are the two directions of private (Coasean) bargaining — whether the developer compensates the households or the households pay the developer, negotiation over the sea view can internalize the external cost and reach the efficient outcome regardless of which side holds the effective right."}]},{"id":"in58","ch":"ch14","text":"The Gini coefficient and Lorenz curve measure only the SHAPE of the distribution (inequality), never income LEVELS. A rising Gini = more unequal, full stop — it can't tell you whose income rose, or whether living standards rose. Closer to the 45° line / lower Gini = more even. Lorenz curves show SHARES, so absolute incomes across countries can't be compared unless total incomes are stated equal.","qs":[{"id":"DSESP/P1/Q19","q":"(Two Lorenz curves: Country B's curve lies closer to the 45° line of equality than Country A's.) From the diagrams, we can conclude that","opts":["the income distribution of Country A is more even than that of Country B.","the income distribution of Country B is more even than that of Country A.","the high-income group in Country A earns a higher income than that in Country B.","the high-income group in Country B earns a higher income than that in Country A."],"ans":1,"why":"The closer a Lorenz curve lies to the 45° diagonal, the more even the income distribution — so Country B's distribution is more even. Lorenz curves show SHARES of income, not absolute income LEVELS, so nothing about which country's rich earn more in d
