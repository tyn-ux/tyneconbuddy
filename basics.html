ollars (C, D) can be concluded."},{"id":"DSEPP/P1/Q18","q":"Economy A's Gini coefficient: Year 1: 0.534; Year 2: 0.563; Year 3: 0.609; Year 4: 0.614. Which of the following statements is/are correct? (1) The income of high-income households increases while the income of low-income households decreases. (2) The income distribution becomes more uneven. (3) The general living standard declines.","opts":["(1) only","(2) only","(3) only","(1), (2) and (3)"],"ans":1,"why":"A rising Gini coefficient means exactly one thing: the income distribution became more UNEVEN (2). It does NOT reveal absolute income movements — inequality can widen even while everyone's income rises (1 unproven) — and it says nothing about the LEVEL of living standards (3), which needs income-level data."},{"id":"DSE2012/P1/Q20","q":"(Lorenz curves: Country A's curve lies farther from the 45° line than Country B's.) According to the two diagrams,","opts":["Country B has a higher national income than Country A.","the low income group of Country B has a higher income than that of Country A.","Country A has a more even distribution of income than Country B.","Country A has a larger Gini coefficient than Country B."],"ans":3,"why":"A Lorenz curve farther from the diagonal means a larger area of inequality — Country A has the larger Gini coefficient. Lorenz curves show income SHARES only, so absolute national income (A) and absolute group incomes (B) can't be compared, and A's distribution is LESS even, not more (C)."},{"id":"DSE2017/P1/Q21","q":"(Diagram: Hong Kong's Gini coefficient based on ORIGINAL household income rises over time.) Based on the diagram, we can conclude that","opts":["the income level of Hong Kong people increased.","income for high income household increased while income for low income household decreased.","the welfare policy failed to reduce the income inequality.","income gap had been widening."],"ans":3,"why":"A rising Gini coefficient means the income gap widened — that is all it shows. It says nothing about absolute income LEVELS (A), doesn't pin down which group's income rose or fell (B), and since this Gini is based on ORIGINAL (pre-tax, pre-welfare) income, it cannot assess what welfare policy did or didn't achieve (C)."}]},{"id":"in59","ch":"ch14","text":"Equity has two distinct senses: equalizing OUTCOME (cash transfers, subsidies-in-kind that lift the poor's income) and equalizing OPPORTUNITY (education/training subsidies that raise the poor's future earning power). A flat cash gift to everyone barely changes the distribution; a targeted transfer to low-income groups reduces inequality. A regressive burden (a fixed charge, a mask cost) hits the poor as a LARGER % of income. Equity itself is a value judgment — 'fair/unfair' is normative, not a measurement.","qs":[{"id":"CE1990/P2/Q52","q":"Which of the following government measures would lead to more equal distribution of income within a country? (1) an increase in subsidies on basic foodstuffs (2) an increase in the progressivity of the tax system (3) a decrease in property tax rate","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":0,"why":"Subsidising basic foodstuffs (1) helps low-income households proportionally most (food is a bigger share of their spending), and a more progressive tax (2) takes a larger share from high earners — both equalize. Cutting the property tax (3) mainly benefits property OWNERS, who are wealthier — making distribution LESS equal."},{"id":"CE1993/P2/Q48","q":"Which of the following government measures will increase the inequality of wealth distribution in Hong Kong?","opts":["removing the tax on soft drinks","selling more flats under the Home Ownership Scheme at lower prices","increasing fees for medical service in government hospitals","increasing the personal allowance on the salaries tax"],"ans":2,"why":"Public hospital fees fall most heavily on lower-income people, who rely on government medical services — raising those fees widens the gap. Removing a (regressive) soft-drink tax, selling cheaper HOS flats, and raising the personal tax allowance all relieve lower-income groups relatively more, reducing inequality."},{"id":"CE1996/P2/Q43","q":"Which of the following will lead to a more uneven income distribution?","opts":["decreasing the sales tax rate","imposing more indirect taxes on luxuries","increasing the housing allowance of senior civil servants","Increasing the standard tax rate of the salaries tax."],"ans":2,"why":"Senior civil servants are already high earners, so boosting THEIR housing allowance concentrates more income at the top — a more uneven distribution. A sales tax is regressive, so cutting it helps the poor relatively (A); taxing luxuries hits the rich (B); and the STANDARD salaries tax rate binds only the highest earners, so raising it equalizes (D)."},{"id":"DSE2012/P1/Q21","q":"Which of the following are possible causes of income inequality among individuals? (1) difference in race (2) difference in capital ownership (3) difference in health","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"All three can cause income differences: racial discrimination can affect pay and opportunities (1); owning more capital generates more property income (2); and better health allows more work and higher productivity (3)."}]},{"id":"ch1","ch":"ch11","text":"Effectiveness first, always: ceiling binds only BELOW equilibrium; floor only ABOVE. An ineffective control changes NOTHING — price, quantity, TE all stay at equilibrium (CE1998 Q4, CE2010 Q14, CE2011/P1/Q3).","qs":[{"id":"CE1998/P2/Q4","q":"If a price floor is set below the equilibrium price of good X,","opts":["a shortage of good X will occur.","the quantity transacted will decrease.","the total revenue may increase or decrease, depending on the elasticity of demand for good X.","the total revenue will remain unchanged."],"ans":3,"why":"A floor BELOW equilibrium is ineffective: the market stays at equilibrium, so nothing — price, quantity, revenue — changes at all."},{"id":"DSE2013/P1/Q14","q":"See the diagram (supply vertical at Q1; demand cuts it at P1; P2 < P1). If the government raises the price floor from P2 to P1, the total revenue received by the sellers","opts":["will rise.","will fall.","will remain unchanged.","may rise or fall, depending on the price elasticity of demand."],"ans":2,"why":"The equilibrium price is P1 (D meets the vertical S at Q1). A floor at P2 < P1 was ineffective, and raising it exactly TO P1 still binds nothing → no change."},{"id":"CE2004/P2/Q12","q":"Refer to the diagram (P1<P2<P3; Q1<Q2<Q3; equilibrium at (Q2,P2)). Which of the following statements is correct?","opts":["If a price ceiling is set at P1, the quantity transacted is Q1.","If a price floor is set at P1, the quantity transacted is Q2.","If a price floor is set at P3, the quantity transacted is Q2.","If a price ceiling is set at P3, non-price competition will occur."],"ans":1,"why":"A floor at P1 is BELOW equilibrium → ineffective → market stays at (P2, Q2) ✓. Floor at P3 binds → Q = Qd(P3) = Q1. Ceiling at P3 is ineffective → no shortage, no non-price competition. (Per the printed key the credited answer is B.)"},{"id":"CE2010/P2/Q14","q":"The diagram shows the market of Good Z with $Pc marked ABOVE the equilibrium. If the government imposes a maximum price control on Good Z at $Pc per unit, there would be","opts":["an excess demand for Good Z.","an excess supply of Good Z.","no change in consumers' total expenditure on Good Z.","an increase in consumers' total expenditure on Good Z."],"ans":2,"why":"A ceiling ABOVE equilibrium is ineffective: the market stays at equilibrium → no shortage, no surplus, no change in anything."}]},{"id":"ch2","ch":"ch11","text":"Short-side rule: quantity transacted = min(Qd, Qs) at the controlled price. Ceiling → Q = Qs; floor → Q = Qd. Check effectiveness BEFORE applying it (CE2002 Q6, CE2008 Q11, DSE2018 Q18).","qs":[{"id":"CE2002/P2/Q6","q":"Good X — Price $2,4,6,8,10; Qd 20,16,12,8,4; Qs 4,8,12,16,20. If the government raises the price ceiling from $4 per unit to $8 per unit, the quantity transacted will","opts":["increase by 4 units.","increase by 8 units.","decrease by 8 units.","decrease by 4 units."],"ans":0,"why":"At $4: Q = Qs = 8 (short side). At $8: ceiling is above eq ($6) → ineffective → Q = 12. Change: +4."},{"id":"CE2008/P2/Q11","q":"Rice — Price $5,4,3,2,1; Qd 10,12,15,20,27; Qs 25,20,15,10,5. If the controlled price is raised from $2 to $4 per unit, sellers' total revenue will increase from ______ to ______.","opts":["$20 ... $45","$20 ... $48","$40 ... $48","$45 ... $48"],"ans":1,"why":"Short-side rule both times. At $2: Q = Qs = 10 → $20. At $4 (above eq $3): Q = Qd = 12 → $48."},{"id":"DSE2018/P1/Q18","q":"Good X — Price $13,12,11,10,9,8,7; Qd 70,80,90,100,110,120,130; Qs 130,120,110,100,90,80,70. The government increases the price ceiling from $8 to $12. Which statement is correct?","opts":["There would be a shortage of 40 units of Good X.","There would be a surplus of 40 units of Good X.","The total expenditure on Good X would increase by $360.","The quantity transacted of Good X would remain unchanged."],"ans":2,"why":"At $8: Q = Qs = 80, TE = $640. At $12: above eq ($10) → ineffective → P=$10, Q=100, TE=$1 000 → +$360."}]},{"id":"ch3","ch":"ch11","text":"Raising a still-effective CEILING → P↑ and Q↑ together → total expenditure MUST rise, no elasticity needed (CE2009 Q8, CE1996 Q9, CE1992 Q27). Don't import the elasticity reflex from tax questions.","qs":[{"id":"CE1992/P2/Q27","q":"The diagram shows Good X with a price ceiling. The price increases from Pc to Pe after the ceiling is cancelled. As a result, the total expenditure on Good X will","opts":["increase.","decrease.","remain unchanged.","either increase or decrease, depending on its price elasticity of demand."],"ans":0,"why":"Removing a binding ceiling: price rises Pc→Pe AND quantity rises Qs(Pc)→Qe (short side was supply). Both up → TE must rise. No elasticity condition — that's the ceiling special case."},{"id":"CE1996/P2/Q9","q":"The price of a good is fixed below the market equilibrium. Relaxing the price control will lead to (1) an increase in revenue. (2) a decrease in demand. (3) an increase in revenue only if demand is inelastic. (4) an increase in the quantity supplied.","opts":["(1) and (2) only","(1) and (4) only","(2) and (3) only","(3) and (4) only"],"ans":1,"why":"Relaxing a binding ceiling: P↑ and Q(=Qs)↑ → revenue rises unconditionally, no Ed needed ✓(1)(4). Demand (the curve) does not fall."},{"id":"CE2009/P2/Q8","q":"The government imposed an effective price ceiling on good X. If the government raises the effective price ceiling, the total consumer expenditure on good X","opts":["would increase.","would decrease.","would remain unchanged.","may increase, decrease or remain unchanged depending on the elasticity of demand."],"ans":0,"why":"Raising a still-binding ceiling: P↑ and Q=Qs↑ together → TE must rise. Elasticity is irrelevant here — the classic ceiling trap."}]},{"id":"ch4","ch":"ch11","text":"Under a fixed binding ceiling, a demand increase changes NO transaction outcome: Q stays at Qs(ceiling), price frozen, TE frozen — only the shortage widens (CE1995 Q12).","qs":[{"id":"CE1995/P2/Q12","q":"The market price of good X is fixed by the government at P' (below equilibrium). If demand increases from D to D', (1) the excess demand will be greater. (2) the quantity transacted will not change. (3) the sales revenue will increase when the demand is elastic.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":0,"why":"Under a binding ceiling, quantity transacted = Qs(P′), which depends on the SUPPLY side only. A demand rise just widens the shortage; price and revenue are frozen."}]},{"id":"ch5","ch":"ch11","text":"Ceiling side-effects package: shortage → black market (max price = demand price at Qs) + non-price competition (queuing, connections) + quality cuts. And it does NOT ensure the poor get the good (DSE2013 Q15, DSE2017 Q18, DSE2012 Q5a).","qs":[{"id":"CE1994/P2/Q10","q":"Concert tickets (supply vertical at Q1) sold at P2 instead of P1: (1) a black market may occur. (2) sales revenue will be smaller. (3) quantity transacted will be greater. (4) sales revenue may increase or decrease, depending on Ed.","opts":["(1) and (2) only.","(2) and (4) only.","(2) and (3) only.","(3) and (4) only."],"ans":0,"why":"Supply is FIXED at Q1: selling below the market-clearing P1 just cuts revenue (P2×Q1 < P1×Q1) and creates excess demand → touts. Quantity cannot exceed Q1."},{"id":"CE1997/P2/Q56","q":"Suppose the government has put an end to all sorts of rent control in Hong Kong. This measure would NOT","opts":["lead to a wider wealth gap.","increase the property tax revenue.","lead to a shortage in the property market.","increase the quantity supplied of rental accommodation."],"ans":2,"why":"Ending a ceiling REMOVES the shortage (rents rise until the market clears) — it cannot create one. Rents and supply rise; property tax on rental income rises."},{"id":"DSE2013/P1/Q15","q":"The government introduces an effective rent control (maximum rental). Which is correct? (1) There will be a shortage of rental units. (2) Landlords will have less incentive to rent out their flats. (3) Landlords will spend less on maintenance of the rental flats.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"Binding ceiling → shortage, lower quantity supplied, and quality deterioration (maintenance is a cost sellers can cut when price competition is banned). All three."},{"id":"DSE2017/P1/Q18","q":"The government imposed an effective rent control on living units. Which of the following would LEAST likely occur?","opts":["There would be a shortage of living units.","Black market would emerge.","Poor people would be able to rent a living unit more easily.","Landlords would have a lower incentive to renovate their living units for rent."],"ans":2,"why":"Low rent ≠ available flat. The shortage is rationed by connections, queuing, key money… none of which favour the poor. That's the whole DSE2012 Q5a point."}]},{"id":"ch6","ch":"ch11","text":"Floor: Q = Qd. Raising an effective floor → P↑, Q↓ → TE / total wage earnings depend on Ed: elastic → fall, inelastic → rise (CE1999 Q6, DSE2022 Q16, CE1990 LQ).","qs":[{"id":"CE1993/P2/Q27","q":"Filipino maids in Hong Kong receive a minimum wage and usually wait a long time before obtaining employment. They would have a shorter waiting time and more employment opportunities if","opts":["their minimum wage was raised.","the minimum wage legislation was removed.","the Philippines was more politically unstable.","a surcharge was imposed on the Hong Kong employers."],"ans":1,"why":"The waiting queue is the excess supply created by a wage floor above equilibrium. Remove the floor → wage falls → quantity demanded of maids rises → more jobs, shorter queue."},{"id":"CE1999/P2/Q6","q":"Good X — Price $7,6,5,4,3; Qd 8,12,16,20,24; Qs 20,18,16,14,12. The minimum price is $4. What would happen if the government raised it to $6 per unit?","opts":["The shortage of good X would disappear.","The quantity transacted would increase.","Consumer expenditure on good X would decrease.","The surplus of good X would decrease."],"ans":2,"why":"$4 floor was below eq ($5) → ineffective, TE = 5×16 = $80. At $6: Q = Qd = 12, TE = $72 → falls ✓. A surplus (18−12=6) appears; there was never a shortage."},{"id":"CE2005/P2/Q13","q":"The government has fixed the price of agricultural products at P' (above equilibrium — see diagram). If the price of fertilizers falls, what will happen to the agricultural products?","opts":["a larger excess demand","an increase in the quantity transacted","an increase in the sales revenue","a larger excess supply"],"ans":3,"why":"Cheaper fertiliser → supply shifts right. With the price stuck at P', quantity demanded is unchanged → the extra supply simply widens the surplus."},{"id":"DSEPP/P1/Q19","q":"Which of the following is the most likely effect of an effective minimum wage law?","opts":["Income distribution will become more even.","Total wage earnings of workers will rise.","The employed population will increase.","Non-price competition will emerge."],"ans":3,"why":"Excess supply of labour → jobs get rationed by non-wage criteria (experience, connections, interviews…). Earnings depend on Ed; employment falls; distribution effects are ambiguous."}]},{"id":"ch8","ch":"ch11","text":"Effective minimum wage: each EMPLOYED worker's wage must rise (average earnings ↑), but total earnings and employment need not. The D/S curves do NOT shift — quantities move along them (CE2009 Q11). A hiring-cost rise (insurance) shifts DEMAND left (CE2011 Q7).","qs":[{"id":"CE2007/P2/Q7","q":"An imposition of a minimum wage legislation would increase","opts":["the employment opportunities of unskilled workers.","the total wage payment to unskilled workers.","the unemployment of unskilled workers.","the inflow of foreign investment."],"ans":2,"why":"Effective wage floor → quantity of labour demanded falls, quantity supplied rises → unemployment (excess supply) rises. Total wage payment depends on elasticity of labour demand."},{"id":"CE2008/P2/Q12","q":"If the government raises the effective minimum wage of imported workers,","opts":["the employment of imported workers will increase.","the problem of shortage of imported workers will become more serious.","the unemployment rate of local workers will increase.","the total wage earnings of local workers will increase."],"ans":3,"why":"Imported workers become dearer → employers substitute towards LOCAL workers → demand for local labour rises → local wages and employment (and hence earnings) rise."},{"id":"CE2009/P2/Q11","q":"A result of imposing an effective minimum wage across industries is that","opts":["the average wage earnings of employed low-income workers must increase.","the total wage earnings of employed low-income workers must increase.","the demand for low-income workers must decrease.","the supply of low-income workers must increase."],"ans":0,"why":"Everyone still employed is paid the (higher) minimum → average earnings of the EMPLOYED must rise. Total earnings depend on Ed; the D and S curves themselves do not shift."},{"id":"CE2011/P2/Q7","q":"There is excess supply of Filipina domestic helpers at the minimum wage w. Recently employers must buy an additional insurance policy for newly hired helpers. Which diagram reflects this?","opts":["Diagram A","Diagram B","Diagram C","Diagram D"],"ans":0,"why":"Insurance raises the cost of hiring → DEMAND for helpers shifts left (D1→D2) while the wage floor w stays → excess supply widens. A shows exactly this."}]},{"id":"ch9","ch":"ch11","text":"A quota binds only if BELOW the equilibrium quantity. Enlarging a quota beyond the free-market quantity → price falls only to the FREE equilibrium, not to the demand price at the quota (DSE2019 Q16, CE2006 Q10, DSEPP Q11).","qs":[{"id":"CE2006/P2/Q10","q":"In Country A the import quota Q1 gives market price P1. The quota is raised from Q1 to Q3 (see diagram). The new total sales revenue would be","opts":["P1 x Q1","P2 x Q2","P1 x Q3","P3 x Q3"],"ans":1,"why":"The enlarged quota Q3 exceeds the free-market quantity Q2, so it no longer binds: equilibrium is where D meets the upward-sloping supply → (Q2, P2)."},{"id":"DSEPP/P1/Q11","q":"Good X — Price $20,18,16,14,12,10; Qd 500,550,600,650,700,750; Qs 800,750,700,650,600,550. If the government lowers the quota from 700 units to 550 units,","opts":["the market price will drop by $2.","the market price will rise by $2.","the market price will rise by $4.","the market price will rise by $6."],"ans":2,"why":"Eq (Q=650, $14): the 700 quota never bound. At 550 it binds: price = demand price at 550 = $18 → rise of $4."},{"id":"DSE2019/P1/Q16","q":"Good X — Price $18,16,14,12,10,8,4; Qd 100,150,200,250,300,350,400; Qs 400,350,300,250,200,150,100. If the government increases the quota from 200 units to 350 units, the market price will","opts":["increase by $2","increase by $6","decrease by $2","decrease by $6"],"ans":2,"why":"Quota 200 → price $14 (Qd=200). Quota 350 exceeds the free eq quantity 250 → price falls to the free eq $12 → down $2, not to the $8 demand price at 350."}]},{"id":"ch10","ch":"ch11","text":"Effective quota: supply kinks vertical at the quota → price = DEMAND price at the quota; P↑, Q↓ → TE depends on Ed (contrast trap 3). Quota rent = (market price − supply price) × quota.","qs":[{"id":"CE1994/P2/Q12","q":"If the government imposes an effective quota on good Y, the market price of Y will ______ and its quantity transacted will ______.","opts":["increase; increase","increase; decrease","decrease; increase","decrease; decrease"],"ans":1,"why":"An effective quota cuts quantity below the equilibrium → move up the demand curve → price rises, quantity falls."},{"id":"CE1994/P2/Q13","q":"If the government imposes an effective quota on good Y, the consumers' total expenditure on good Y will","opts":["decrease.","increase.","remain unchanged.","increase or decrease, depending on the price elasticity of demand for good Y."],"ans":3,"why":"P↑ and Q↓ pull expenditure in opposite directions → the answer hangs on Ed. (Contrast: raising an effective CEILING raises TE unambiguously.)"},{"id":"CE2005/P2/Q10","q":"Good X — Price $6,9,12,15,18; Qd 60,55,50,45,40; Qs 40,45,50,55,60. If the government fixes the production quota of Good X at 45 units, the market price will be","opts":["$9","$12","$15","$18"],"ans":2,"why":"Quota 45 < eq 50 → binding. Price is read off the DEMAND curve at 45 units: Qd=45 at $15."},{"id":"CE2011/P2/Q13","q":"Good X — Price $100,90,80,70,60,50; Qd 80,100,120,140,160,180; Qs 200,160,120,80,60,40. If the government fixes the production quota at 80 units, consumers' total expenditure will be ______.","opts":["$5 600","$6 400","$8 000","$9 600"],"ans":2,"why":"Free eq: $80 (120). Quota 80 binds → price read off demand: Qd=80 at $100 → TE = 100×80 = $8 000."}]},{"id":"ch11","ch":"ch11","text":"Unused quota: demand falls until D cuts the UPWARD-sloping segment below the kink → the quota stops binding (CE1999 Q45). Multi-shock questions: shift the vertical segment AND the demand curve separately (CE2008 Q9, CE2009 Q12, DSE2016 Q9).","qs":[{"id":"CE1999/P2/Q45","q":"HK's use of the U.S. import quota for garments fell because of competition from other Asian countries, leaving some quota UNUSED for the first time. Which diagram shows HK garment exports in the U.S. market?","opts":["Diagram A","Diagram B","Diagram C","Diagram D"],"ans":0,"why":"Unused quota = demand has fallen so far that D now cuts the UPWARD-SLOPING segment below the kink. A shows D1→D2 crossing the rising portion — the quota no longer binds."},{"id":"CE2008/P2/Q9","q":"Country A reduces an effective quota on clothing imported from Country B; meanwhile imported clothing from OTHER countries becomes cheaper. Which graph shows Country A's market for Country-B clothing? (E1 original, E2 new)","opts":["Diagram A","Diagram B","Diagram C","Diagram D"],"ans":2,"why":"Two forces: the kinked supply's vertical segment shifts LEFT (smaller quota), and demand shifts LEFT (cheaper substitutes). Only C draws a kinked/vertical quota supply with S1→S2 left and D1→D2 down."},{"id":"CE2009/P2/Q12","q":"The government reduced the import quota of fresh chicken; meanwhile many citizens switched from fresh to chilled chicken. Which diagram illustrates this?","opts":["Diagram A","Diagram B","Diagram C","Diagram D"],"ans":1,"why":"Fresh chicken market: quota supply (vertical) shifts left S1→S2 AND demand shifts left D1→D2 (taste change). B shows both. C/D draw the chilled market; A lacks the quota supply."}]},{"id":"ch12","ch":"ch11","text":"Abolishing/loosening a quota: P↓ and Q↑ are CERTAIN; revenue/expenditure 'may increase' (Ed decides). Watch substitute markets: their demand falls → price AND quantity fall → their TE falls for sure (CE2010 Q13, CE2007 Q8, CE2005 Q48).","qs":[{"id":"CE1999/P2/Q7","q":"The abolition of an effective quota on an imported good will result in (1) a fall in its price. (2) an increase in its import volume. (3) an increase in its total sales revenue. (4) an improvement in its quality.","opts":["(1) and (2) only","(1) and (3) only","(1), (3) and (4) only","(2), (3) and (4) only"],"ans":0,"why":"P↓ and Q↑ are certain; revenue depends on Ed. Quality: a binding quota pushes sellers to upgrade quality per unit — abolition removes that incentive."},{"id":"CE2000/P2/Q49","q":"Suppose the US government decreases the quota for HK garments exported to the USA. This will lead to","opts":["a shortage of HK garments in the USA.","an increase in the income of garment producers in the USA.","a surplus in the balance of trade in the USA.","a decrease in the expenditure of US consumers on HK garments."],"ans":1,"why":"HK garments become dearer/scarcer → demand for US-made substitutes rises → US producers' income rises. Price adjusts, so no lasting shortage; expenditure depends on Ed."},{"id":"CE2005/P2/Q48","q":"If the US government cancels the effective import quota on textiles from Hong Kong, the US import price will ______ and US import spending will ______.","opts":["rise ... increase","rise ... be indeterminate","fall ... increase","fall ... be indeterminate"],"ans":3,"why":"Abolition → supply constraint gone → price falls, quantity rises → spending depends on Ed → indeterminate."},{"id":"CE2007/P2/Q8","q":"China abolished the car import quota system in 2005. As a result, ______ in China will increase.","opts":["the price of cars","the sales volume of cars","the income of workers in the car manufacturing industry","the revenue from car sales"],"ans":1,"why":"Quota gone → supply up → P↓, Q↑. Only the sales VOLUME rises for certain; revenue depends on Ed."}]},{"id":"ch13","ch":"ch11","text":"Per-unit tax = PARALLEL upward shift of S by the full $t, but the price rises by LESS than t (burden is shared). Never shift the demand curve for a sales tax on sellers (CE1991 Q58).","qs":[{"id":"CE1991/P2/Q58","q":"Suppose the government raises the first registration tax on newly-imported cars by $10 000. Which of the following is FALSE?","opts":["The market price of all newly-imported cars will increase by $10 000.","The market price of second-hand cars will increase.","The tax burden can be shifted to the consumers.","The number of cars newly imported will decrease."],"ans":0,"why":"With ordinary curves the price rises by LESS than the full $10 000 (burden is shared), so A is false. Second-hand cars are substitutes: their demand and price rise."},{"id":"CE1994/P2/Q8","q":"Demand/supply of wine — Price $30,32,34,36,38,40; Qd 90,80,70,60,50,40; Qs 60,65,70,75,80,85. Initially in equilibrium. If the government imposes a tax of $6 per unit of wine sold, the new equilibrium price will be","opts":["$32","$36","$38","$40"],"ans":1,"why":"Find P where Qd(P) = Qs(P−6). At P=$36: Qd=60, Qs($30)=60. ✓ Price rises $34→$36, i.e. by $2 of the $6 tax."},{"id":"CE2006/P2/Q11","q":"The graph shows the market of Good A when a per-unit sales tax of $30 is charged on it. Suppose the above per-unit sales tax is abolished. The new market price would be","opts":["$100","$120","$140","$160"],"ans":1,"why":"With the tax, eq = ($130, 24). Abolition shifts S down by $30; the new equilibrium price is $120 — consumers had borne only $10 of the $30."},{"id":"CE2008/P2/Q7","q":"Good X — Price $5,4,3,2,1; Qd 10,20,30,40,50; Qs 50,40,30,20,10. If the government imposes a $2 per unit sales tax on Good X, the new equilibrium price will be ______.","opts":["$2","$3","$4","$5"],"ans":2,"why":"Old eq $3. New eq: at P=$4, Qd=20 = Qs($2)=20. Symmetric curves → burden split 1:1."}]},{"id":"ch14","ch":"ch11","text":"Burden split: the LESS elastic side bears more. Consumers' burden = (Pnew−Pold)×Qnew; sellers' = t×Qnew minus that. Always the NEW quantity (CE1996 Q7, CE2009 Q13, DSE2019 Q14).","qs":[{"id":"CE1990/P2/Q51","q":"Suppose the government increases the tax on cigarettes by $2. Consequently, the price of each packet of cigarettes increases by $1.5. Which of the following statements is true?","opts":["The producers bear 1/4 of the tax.","The demand for cigarettes is elastic.","The supply of cigarettes is elastic.","The tax is progressive in nature."],"ans":0,"why":"Price rises $1.5 of the $2 tax, so consumers bear 3/4 and producers 1/4. Consumers bearing more means demand is relatively LESS elastic than supply."},{"id":"CE1993/P2/Q29","q":"A tax is imposed on a commodity. The tax burden on the consumers is relatively smaller if the commodity has an ______ demand and an ______ supply.","opts":["elastic; elastic","elastic; inelastic","inelastic; elastic","inelastic; inelastic"],"ans":1,"why":"The less elastic side bears more. Consumers escape burden when demand is ELASTIC and supply is INELASTIC."},{"id":"CE1996/P2/Q7","q":"Price $6,8,10,12,14; Qd 60,55,50,45,40; Qs 40,45,50,55,60. What will be the consumer tax burden if a per-unit tax of $4 is imposed?","opts":["$90","$100","$110","$180"],"ans":0,"why":"New eq: at P=$12, Qd=45=Qs($8)=45. Price rises $10→$12, so consumers' burden = $2 × 45 = $90 (× new quantity!)."},{"id":"CE1999/P2/Q9","q":"(Same market, $3 tax, price rises $8→$10.) The ratio of the buyers' tax burden to the sellers' tax burden is","opts":["1:1","2:1","1:2","3:0"],"ans":1,"why":"Buyers pay $2 more ($8→$10); sellers keep $10−$3=$7, i.e. $1 less. Ratio 2:1."}]},{"id":"ch15","ch":"ch11","text":"Extremes: Ed=0 or Es=∞ → consumers bear ALL (P rises by full t). Ed=∞ or Es=0 → sellers bear ALL (P unchanged). Q unchanged ⟺ a vertical curve ⟺ revenue moves 1-for-1 with the rate (DSE2018 Q14, DSE2024 Q14, CE2007 Q6).","qs":[{"id":"CE1991/P2/Q26","q":"When the tax on commodity X is doubled, its tax revenue is also doubled. This indicates that","opts":["the demand for X is perfectly elastic.","the demand for X is unitarily elastic.","the supply of X is perfectly elastic.","the supply of X is perfectly inelastic."],"ans":3,"why":"Revenue = t × Q. Revenue moves 1-for-1 with the rate only if Q is unchanged — a vertical curve. Among the options, that is perfectly inelastic supply."},{"id":"CE1995/P2/Q11","q":"Suppose the government imposes a per unit sales tax of $5 on good X. Under what condition will the price increase by $5?","opts":["The supply of X is unitary elastic.","The supply of X is perfectly inelastic.","The demand for X is perfectly inelastic.","The demand for X is unitary elastic."],"ans":2,"why":"Full shifting to consumers requires Ed = 0 (perfectly inelastic demand) — or Es = ∞, which is not offered."},{"id":"CE2002/P2/Q11","q":"Suppose the government imposes a unit sales tax on a good. The producers' revenue after deduction of the sales tax will remain unchanged if","opts":["the demand for the good is perfectly elastic.","the demand for the good is perfectly inelastic.","the supply of the good is perfectly elastic.","the supply of the good is perfectly inelastic."],"ans":1,"why":"Net revenue unchanged needs BOTH Q and net price unchanged: with Ed=0, price rises by the full tax, Q stays, sellers net the original price."},{"id":"CE2004/P2/Q10","q":"Suppose the government imposes a per unit sales tax on good X of which the supply is perfectly inelastic. Only ______ will bear the tax burden, and the quantity transacted will ______.","opts":["sellers ... remain unchanged","sellers ... decrease","buyers ... remain unchanged","buyers ... decrease"],"ans":0,"why":"Vertical supply: price cannot rise, sellers absorb the whole tax, and Q stays at the fixed supply."}]},{"id":"ch16","ch":"ch11","text":"Four money formulas: tax revenue = t×Qnew; TE = Pnew×Qnew; net-of-tax revenue = (Pnew−t)×Qnew (MUST fall with upward S); TR incl. subsidy = (P+s)×Qnew. Label which one the question wants before computing (DSE2012 Q16, DSE2022 Q15).","qs":[{"id":"CE1994/P2/Q9","q":"(Same wine schedules, $6 per-unit tax.) Government revenue from the above tax will be ______.","opts":["$240","$300","$360","$420"],"ans":2,"why":"Revenue = t × Qnew = $6 × 60 = $360. Always use the NEW quantity."},{"id":"CE1998/P2/Q41","q":"Suppose the sales tax rate of a good is raised. Which of the following statements is correct?","opts":["The total expenditure on the good will increase.","There will be inflation.","The total revenue net of tax to sellers will fall if the supply curve is upward sloping.","Income will be redistributed from the poor to the rich."],"ans":2,"why":"Net price received falls AND quantity falls, so net-of-tax revenue must fall. A depends on Ed; a one-good price rise is not inflation."},{"id":"CE1999/P2/Q8","q":"Good Y — Price $12,11,10,9,8,7; Qd 40,60,80,100,120,140; Qs 280,240,200,160,120,80. If the government imposed a $3 per unit tax on Y, what would the new total sales revenue be?","opts":["$360","$800","$960","$1320"],"ans":1,"why":"Old eq $8 (Q=120). New eq: P=$10, Qd=80=Qs($7)=80. Total sales revenue = $10 × 80 = $800."},{"id":"CE2003/P2/Q12","q":"(Same $3 tax.) If the equilibrium price of the good falls back to $12 per unit due to a decrease in production cost,","opts":["the producers will bear all the tax burden.","the total tax burden will be $360.","there will be excess demand.","the total sales revenue net of tax will be $1 260."],"ans":3,"why":"At $12, Qd=140. Net-of-tax revenue = ($12−$3) × 140 = $1 260. Consumers pay the original price, but 'producers bear all' is about the comparison with the no-tax cost fall — the scheme credits D."}]},{"id":"ch17","ch":"ch11","text":"TE after a tax: P↑ vs Q↓ → use Ed between the OLD and NEW prices. %ΔQ vs %ΔP decides — compute, don't guess (CE2003 Q11, DSE2019 Q14(3), CE2007/P1/Q9).","qs":[{"id":"CE2003/P2/Q11","q":"Demand: Price $11,12,13,14; Qd 160,140,120,100. A $3 unit tax raises the equilibrium price from $12 to $13. Which description is correct?","opts":["The consumers bear a larger tax burden than the producers.","The elasticity of demand of the good is greater than 1.","The total tax burden is $120.","The total sales revenue (including tax) has increased."],"ans":1,"why":"Between $12→$13: %ΔQ=(140−120)/140≈14% > %ΔP=1/12≈8% → Ed>1. Consumers bear $1 vs sellers $2; total tax=3×120=$360; TR falls 1680→1560."}]},{"id":"ch18","ch":"ch11","text":"Tariff / import surcharge / anti-dumping duty = per-unit tax on the import market. Same shift, same burden logic, same diagrams (DSESP Q11, DSE2016 Q10, DSE2020 Q10).","qs":[{"id":"DSESP/P1/Q11","q":"Suppose the European Union imposes an import surcharge on China-made leather shoes exported to its member countries. In the member countries of the European Union,","opts":["the price of these goods will rise.","the price of these goods will fall.","the total expenditure on these goods will rise.","the total expenditure on these goods will fall."],"ans":0,"why":"A surcharge is a per-unit tax on the import: supply shifts up, price rises. Expenditure depends on Ed, so only A is certain."}]},{"id":"ch19","ch":"ch11","text":"Subsidy mirrors tax: S shifts DOWN by $s; price falls by less than s; the LESS elastic side captures more benefit. Consumers: (Pold−Pnew)×Qnew; producers: (Pnew+s−Pold)×Qnew (DSE2020 Q15, DSE2015 Q12, CE1996 Q11).","qs":[{"id":"CE1994/P2/Q11","q":"The demand for good X is perfectly inelastic. If the government offers a subsidy of $4 for each unit of X produced, the equilibrium price of X will","opts":["remain unchanged","decrease by $4","decrease by less than $4","decrease by more than $4"],"ans":1,"why":"With vertical demand, S shifts down $4 and the price falls by the FULL $4 — consumers capture the whole benefit."},{"id":"CE1995/P2/Q10","q":"The diagram shows the supply and demand for good X. If the government offers a subsidy of $2 for each unit of output, the market price will","opts":["decrease to $3.","decrease to $4.","increase to $6.","increase to $7"],"ans":1,"why":"Equilibrium is ($5, 4 units) with symmetric slopes. S shifts down $2 → price falls by $1 to $4; the other $1 stays with sellers."},{"id":"CE1996/P2/Q11","q":"The diagram shows the unit price falling from $10 to $8 when the government provides a per-unit subsidy of $5 to suppliers (quantity 40 → 50). What is the total amount of suppliers' benefit from the subsidy?","opts":["$80","$120","$150","$250"],"ans":2,"why":"Sellers now receive $8+$5=$13 vs $10 before → gain $3 per unit × 50 units = $150. Consumers get $2 × 50 = $100. Total = $250 = full subsidy."},{"id":"CE1999/P2/Q4","q":"Case I: price falls by $4 after a $10 per unit subsidy. Case II: price falls by $6 after a $10 per unit subsidy. Compared with Case II, Good X in Case I has a ______ demand or a ______ supply.","opts":["less elastic ... less elastic","more elastic ... more elastic","less elastic ... more elastic","more elastic ... less elastic"],"ans":3,"why":"A smaller price fall = consumers capture less = demand relatively MORE elastic (or supply LESS elastic). Mirror image of tax-burden logic."}]},{"id":"ch20","ch":"ch11","text":"Two revenues: INCLUDING subsidy = (Pnew+s)×Qnew; EXCLUDING = Pnew×Qnew — the latter can FALL (CE2001 Q7). The demand curve does not shift when producers get a subsidy.","qs":[{"id":"CE2001/P2/Q7","q":"The diagram shows supply rising from S1 to S2 due to a per-unit subsidy (price falls $4→$3, quantity 50→60). Suppliers' new total revenue excluding the subsidy ______ their old total revenue.","opts":["is smaller than","is equal to","is larger than","may be larger or smaller than"],"ans":0,"why":"Old: $4×50 = $200. New excluding subsidy: $3×60 = $180 < $200. Read the given numbers — don't assume sellers' market revenue must rise."},{"id":"DSE2014/P1/Q16","q":"Price $1,2,3,4,5; Qd 120,100,80,75,60; Qs 60,75,80,100,120. We can conclude that","opts":["the total sales revenue would be $200 when the price is $2.","there would be a shortage of 25 units when the government imposes a price floor at $4.","when a per unit subsidy of $2 was granted to the seller, the total revenue (including the subsidy) would increase by $160.","when a per unit subsidy of $2 was granted to the seller, the equilibrium price would drop to $1."],"ans":2,"why":"Eq $3 (80). Subsidy $2: at P=$2, Qs($4)=100=Qd($2)=100 → revenue incl. subsidy = ($2+$2)×100 = $400 vs 3×80=240 → +$160 ✓. Floor above eq gives surplus, not shortage."},{"id":"DSE2016/P1/Q19","q":"Price $40,50,60,70,80,90; Qd 14,12,10,8,6,4; Qs 6,8,10,12,14,16. Which is correct when the government provides a per unit subsidy of $20?","opts":["The total revenue including the subsidy is $840.","The total subsidy granted by the government is $200.","Within the range of the original and new market prices, the elasticity of demand is smaller than one.","The change in total revenue of its complements is uncertain."],"ans":0,"why":"Eq $60 (10). Subsidy: at P=$50, Qs($70)=12=Qd($50)=12 → revenue incl. subsidy = ($50+$20)×12 = $840 ✓. Subsidy total = 20×12=$240. Ed between 50–60: %ΔQ=2/10=20% > %ΔP≈17% → elastic."},{"id":"DSE2025/P1/Q20","q":"The diagram shows the market of Good X with a per-unit subsidy of $30 to producers (S0 before, S1 after; price $120→$100, quantity 70→90). Which statement is correct?","opts":["The subsidy benefit enjoyed by consumers is $1400.","The total revenue inclusive of the subsidy is $11700.","Within the price range, the price elasticity of demand is higher than the price elasticity of supply.","Within the price range, the price elasticity of demand is smaller than one."],"ans":1,"why":"Revenue incl. subsidy = ($100+$30) × 90 = $11 700 ✓. Consumers' benefit = $20×90 = $1 800 > producers' $10×90 — so demand is LESS elastic than supply. Ed: %ΔQ=20/70≈29% > %ΔP=20/120≈17% → Ed>1."}]},{"id":"ch21","ch":"ch11","text":"Tax ⟷ quota equivalence: match QUANTITIES. The equivalent tax = demand price minus supply price at the target quantity (CE2005 Q11: $15−$9=$6; DSE2025 Q17: $18−$6=$12).","qs":[{"id":"CE2005/P2/Q11","q":"Good X — Price $6,9,12,15,18; Qd 60,55,50,45,40; Qs 40,45,50,55,60. If the government uses a unit tax to fix the output of Good X at 45 units, the unit tax imposed will be","opts":["$3","$6","$9","$12"],"ans":1,"why":"To transact 45 units: buyers pay $15 (Qd=45), sellers must receive $9 (Qs=45). Tax = 15 − 9 = $6. A tax can replicate a quota."},{"id":"DSE2025/P1/Q17","q":"Good X — Price $18,16,14,12,10,8,6; Qd 100,150,200,250,300,350,400; Qs 400,350,300,250,200,150,100. Suppose the government imposes a quota of 100 units. Which statement is correct?","opts":["If the government increases the quota, the total revenue of Good X may decrease.","If the government increases the quota, the deadweight loss may increase.","Instead of the quota, a per-unit tax of $6 would have an equivalent effect on the price.","Instead of the quota, a per-unit tax of $12 would have an equivalent effect on the quantity transacted."],"ans":3,"why":"Quota 100 → price $18 (Qd=100). A $12 tax: at P=$18, Qd=100 = Qs($6)=100 — same quantity ✓. Raising the quota lowers price toward eq ($12, 250): revenue rises (1800→3000), DWL shrinks."}]},{"id":"ch22","ch":"ch11","text":"Surplus bookkeeping: ceiling → PS must fall, CS ambiguous; floor → CS must fall, PS ambiguous; both shrink TSS (DWL). Subsidy raises CS AND PS yet TSS falls — government pays more than the private gains (DSE2015 Q19, DSE2021 Q17, DSE2023 Q20).","qs":[{"id":"DSE2015/P1/Q19","q":"Refer to the diagram. If the government lowers the price ceiling from Pa to Pb,","opts":["the quantity transacted will increase.","the deadweight loss will decrease.","the producer surplus will decrease.","the consumer surplus will increase."],"ans":2,"why":"A lower ceiling → Q=Qs falls further → sellers sell less at a lower price → PS必跌. DWL grows; CS may rise or fall (gain per unit vs fewer units)."},{"id":"DSE2021/P1/Q17","q":"Refer to the diagram of Good Y. If the government lowers the price ceiling of Good Y from P1 to P2,","opts":["the producer surplus will decrease.","the consumer surplus will increase.","the total social surplus will remain unchanged.","the excess supply of Good Y will be eliminated."],"ans":0,"why":"Lower binding ceiling → price and quantity (=Qs) both fall → PS unambiguously falls. CS is ambiguous, TSS falls (bigger DWL), and a ceiling creates excess DEMAND, not supply."}]},{"id":"ch1","ch":"ch11","text":"Judge progressive/regressive by the AVERAGE tax rate's trend against income, not the absolute tax paid. 'Tax rises with income → progressive' is WRONG (it can be any of the three).","qs":[{"id":"CE2001/P2/Q35","q":"Graph: tax payment vs income, before/after a change. Compared to the old structure, the new structure","opts":["results in a less even income distribution","has a lower tax rate for the same income","has a larger tax allowance","has no effect on work incentive"],"ans":0,"why":"The new structure taxes the low-income relatively more and the high-income relatively less (average rate falls with income) → more uneven distribution."},{"id":"CE2004/P2/Q43","q":"Income tax marginal rates raised across bands (new > old). Under the new system,","opts":["ratio of direct to indirect revenue will decrease","government will have a budget surplus","more people fall into the tax net","the income gap will be reduced"],"ans":3,"why":"More progressive → narrows the rich-poor gap."},{"id":"DSE2013/P1/Q36","q":"Diagram: change in salaries-tax structure (new reaches a higher top rate). Compared to the old structure, the new one","opts":["has a smaller personal allowance","has a lower standard tax rate","will narrow the income gap","will widen the tax base"],"ans":2,"why":"The new structure is more progressive (higher top rate) → narrows the rich-poor gap."},{"id":"DSE2022/P1/Q40","q":"Diagram: tax payment is a straight line through the origin vs taxable income. Which statement is correct?","opts":["It is in line with the equality principle put forth by Adam Smith","There is no tax allowance for the tax","Tax rate increases as taxable income increases","It narrows the income gap"],"ans":0,"why":"A straight line through the origin = proportional, with a constant average rate → satisfies the 'pay in proportion / to ability' equality principle (A); C wrong (rate constant, not rising), D wrong. (B 'no allowance' looks true geometrically but the official key takes A — a debatable judgment item.)"}]},{"id":"ch2","ch":"ch11","text":"Lump-sum / specific indirect taxes (fuel, tobacco, alcohol, HAT, departure tax, GST) = regressive.","qs":[{"id":"CE2003/P2/Q42","q":"Suppose HK introduces a general sales tax. It follows that","opts":["sellers' revenue net of tax will decrease","there will be a persistent increase in price level","income redistributed from rich to poor","HK consumption expenditure will increase"],"ans":0,"why":"A one-off price rise ≠ sustained inflation; a regressive GST does not transfer rich→poor; the seller's after-tax net receipt falls."},{"id":"DSE2020/P1/Q38","q":"Japan raises GST 8%→10%. As a result: (1) income inequality higher (2) fiscal deficit eliminated (3) invisible trade deficit decreases","opts":["(1) only","(2) only","(3) only","(1), (2) and (3)"],"ans":0,"why":"GST is regressive → raises inequality; it does not guarantee eliminating a deficit and has no direct link to services trade."},{"id":"CE1991/P2/Q37","q":"A sales tax on food is a ___ tax.","opts":["direct and regressive","indirect and regressive","direct and proportional","indirect and progressive"],"ans":1,"why":"A sales tax can be shifted = indirect; food is a large share of a low income → regressive."},{"id":"CE1992/P2/Q36","q":"If everyone pays a tax of $100 regardless of income, the tax is","opts":["regressive","proportional","progressive","indirect"],"ans":0,"why":"A lump-sum tax: the same $ is a large share of a low income → average rate falls with income → regressive."}]},{"id":"ch3","ch":"ch11","text":"direct/indirect depends on whether the burden can be shifted. Rates = indirect (shiftable); property tax = direct.","qs":[{"id":"CE1990/P2/Q31","q":"Which of the following are indirect taxes? (1) excise duty (2) property tax (3) rates (4) profits tax","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(3) and (4) only"],"ans":1,"why":"Indirect = burden can be shifted: excise duty & rates. Property tax and profits tax are direct (cannot be shifted)."},{"id":"CE1995/P2/Q45","q":"Direct taxes differ from indirect taxes in that","opts":["direct taxes are collected directly but indirect are not","direct are progressive whereas indirect are regressive","the burden of direct taxes cannot be shifted but indirect can","direct revenue fluctuates with NI but indirect does not"],"ans":2,"why":"The dividing line is always whether the burden can be shifted: direct cannot, indirect can."},{"id":"CE2005/P2/Q40","q":"Which is a difference between a direct and an indirect tax?","opts":["The burden of a direct tax cannot be shifted, but an indirect tax can","Direct → more even, indirect → less even distribution","Tax base of direct is narrower, indirect broader","All of the above"],"ans":0,"why":"The defining difference is whether the burden can be shifted."},{"id":"CE2011/P2/Q42","q":"Which is a direct tax in Hong Kong?","opts":["stamp duty","football betting duty","rates","property tax"],"ans":3,"why":"Property tax is direct (cannot be shifted); stamp duty / betting duty / rates are all indirect."}]},{"id":"ch4","ch":"ch11","text":"Territorial source principle: income earned abroad (Shanghai salary, Mainland factory profit) is not taxed in HK.","qs":[{"id":"CE1997/P2/Q47","q":"Which description of HK's tax system is true?","opts":["Only income derived from HK is liable (territorial)","Rates is a direct tax","Import duties protect local industry","Corporate profits tax rate equals the standard rate"],"ans":0,"why":"Territorial source principle: only income arising in Hong Kong is taxed."},{"id":"DSE2018/P1/Q40","q":"HK resident works in Shenzhen (monthly wage); dividend from Hang Seng; rental from Mongkok flat; flew to Seoul via HKIA. Which DIRECT tax(es) does he pay in HK? (1) property (2) profits (3) salaries (4) air passenger departure","opts":["(1) only","(1) and (4) only","(1), (2) and (3) only","(2), (3) and (4) only"],"ans":0,"why":"Shenzhen salary → territorial source, not taxed as salaries; dividends untaxed; departure tax is indirect → only property (Mongkok rental)."}]},{"id":"ch5","ch":"ch11","text":"HK does NOT levy: capital gains tax, estate duty (abolished 2006), interest tax, dividend tax, GST.","qs":[{"id":"CE1997/P2/Q41","q":"Peter's 1996 income: salary 600k; local deposit interest 4k; rental 300k. He pays","opts":["salaries tax only","salaries tax and interest tax","salaries tax and property tax","salaries tax, interest tax and property tax"],"ans":2,"why":"Hong Kong has no interest tax, so only salaries + property (rental)."},{"id":"CE1998/P2/Q40","q":"Chan's incomes subject to tax: (1) year-end bonus (2) dividend (3) forex capital gain (4) rental income","opts":["(1) and (2) only","(1) and (4) only","(2) and (3) only","(3) and (4) only"],"ans":1,"why":"Bonus = salaries, rental = property; dividends and capital gains are not taxed in HK."},{"id":"CE2001/P2/Q40","q":"John: salary 650k; net rental 250k; money inherited from deceased father 1,000k. He pays","opts":["salaries tax only","salaries tax and estate duty only","salaries tax and property tax only","property tax and estate duty only"],"ans":2,"why":"Inherited estate is not taxed on the beneficiary (and estate duty was abolished in 2006) → only salaries + property."},{"id":"CE2004/P2/Q44","q":"Wong's expenses subject to an indirect tax: (1) hotel room charge (2) football bets (3) cosmetics","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":0,"why":"Hotel accommodation tax + football betting duty are indirect taxes; cosmetics carry no specific indirect tax (HK has no GST)."}]},{"id":"ch6","ch":"ch11","text":"A rate cut ≠ revenue cut (the base reacts, Laffer); a rate rise may not raise revenue either → argue both sides.","qs":[{"id":"CE2006/P2/Q39","q":"Salaries tax changes from A to B with all marginal rates lower (B lower). As a result,","opts":["fewer people fall into the tax net","work incentive of workers increases","income gap is reduced","ratio of direct to indirect revenue increases"],"ans":1,"why":"Lower rate → stronger work incentive; progressivity actually falls, so it does not narrow the gap."},{"id":"DSE2024/Q41","q":"In an open economy the govt raises the income-tax rate. Income-tax revenue ___ and the total value of imports ___.","opts":["rises; may rise or fall","falls; may rise or fall","may rise or fall; rises","may rise or fall; falls"],"ans":3,"why":"↑rate → revenue may rise or fall (base reaction/Laffer); ↑tax → ↓disposable income → ↓imports (falls)."}]},{"id":"ch7","ch":"ch11","text":"Inflation + a fixed allowance → fiscal drag: nominal income↑ → more people in the net → real tax burden↑, revenue↑ (distinguish nominal/real).","qs":[{"id":"CE1990/P2/Q34","q":"During inflation, the ___ of people increase(s) and more people are put into the tax net; given the same allowances, their ___ actually increase(s).","opts":["nominal incomes, tax burden","real incomes, nominal incomes","nominal incomes, real incomes","tax burden, nominal incomes"],"ans":0,"why":"Fiscal drag: inflation raises nominal income while the allowance is fixed, pulling more people into the tax net and raising the real tax burden."},{"id":"CE1996/P2/Q44","q":"Inflation; nominal income rises at the same rate. Under a proportional tax a payer will pay: (1) larger amount of tax (2) same amount (3) more in purchasing power (4) same in purchasing power","opts":["(1) and (3) only","(1) and (4) only","(2) and (3) only","(2) and (4) only"],"ans":1,"why":"A proportional tax = same %, so the nominal tax paid rises but in real (purchasing-power) terms it is unchanged."},{"id":"CE1997/P2/Q45","q":"Allowance +5%; both wage rates and inflation +10%. It follows that","opts":["more people fall into the tax net","ratio of tax to income decreases","revenue rises and distribution more even","real after-tax income unchanged"],"ans":0,"why":"Allowance rises 5% < income rises 10% → fiscal drag pulls more people into the net."},{"id":"CE2002/P2/Q42","q":"Cut salaries-tax allowance 10%; wage rates and price level both fall 5%. It follows that","opts":["tax revenue would increase","more people fall into the tax net","real pre-tax income would generally increase","ratio of tax to nominal income would decrease"],"ans":1,"why":"Allowance falls 10% > income falls 5% → more people pulled into the tax net."}]},{"id":"ch8","ch":"ch11","text":"Raising the allowance → uncertain effect on total revenue, and it does NOT widen the base.","qs":[{"id":"CE1993/P2/Q47","q":"If the government increases the personal allowance on salaries tax, then","opts":["standard-rate payers have higher work incentive","we are not certain how total tax revenue will change","the government must cut its expenditure","the tax base will be widened"],"ans":1,"why":"Raising the allowance lets fewer people pay / pay less; total revenue change is uncertain, and it does not widen the base."},{"id":"CE1998/P2/Q42","q":"If HK raises the tax allowance on salaries tax,","opts":["income distribution becomes more uneven","fewer people fall into the tax net","standard-rate payers' incentive increases","tax bands are widened"],"ans":1,"why":"Raising the allowance takes fewer people into the tax net."}]},{"id":"ch9","ch":"ch11","text":"Don't confuse tax base vs rate vs revenue; GST widens the base and stabilises revenue (consumption is steadier than income).","qs":[{"id":"CE1990/P2/Q59","q":"Which is INCORRECT if a general sales tax is imposed in Hong Kong?","opts":["Revenue fluctuation will be reduced","The proportion of direct tax in revenue will increase","There will be income redistribution","The general price level will increase"],"ans":1,"why":"GST is an indirect tax, so the indirect share rises and the direct share falls — option B is the false statement."},{"id":"CE1994/P2/Q48","q":"The aim of increasing the proportion of indirect taxes to total taxation is to","opts":["increase total tax revenue","stabilize tax revenue over the business cycle","narrow the gap between rich and poor","narrow the tax base"],"ans":1,"why":"Consumption is steadier than income, so an indirect tax gives more stable revenue."},{"id":"CE2001/P2/Q37","q":"Pie charts: 1998 (direct 42%, indirect 30%) vs 1999 (direct 46%, indirect 22%). In 1999,","opts":["the ratio of direct to indirect taxes increased","total tax revenue increased","proportion of tax in total govt revenue increased","revenue from rates decreased by 8%"],"ans":0,"why":"Direct/indirect ratio 42/30 → 46/22, so the proportion rises; a pie chart shows shares only, not totals."},{"id":"CE2001/P2/Q39","q":"Which will widen the tax base of Hong Kong?","opts":["an increase in the tax allowance","a decrease in the standard tax rate","an increase in the profits tax rate","the introduction of a sales tax"],"ans":3,"why":"GST brings more goods/people into the net → widens the base; changing the rate/allowance does NOT change the base."}]},{"id":"ch10","ch":"ch11","text":"Cutting the standard rate only benefits the high-income, lowers progressivity, and does not help the low-income (who don't pay the standard rate).","qs":[{"id":"CE2003/P2/Q39","q":"Salaries-tax allowance decreases, salaries constant. It results that","opts":["some standard-rate payers may pay at a lower rate","the middle-income group pays a larger proportion as tax","fewer people fall into the tax net","after-tax income of ALL taxpayers decreases"],"ans":1,"why":"Standard-rate payers are assessed on net total income (no allowance deducted), so cutting the allowance does not affect them → not 'everyone'; the middle-income share rises → B."},{"id":"CE2005/P2/Q41","q":"Which policy leads to a less even income distribution?","opts":["raising the standard rate of salaries tax","reducing the personal allowance of salaries tax","raising the profits tax rate","lowering the excise tax on tobacco and wine"],"ans":1,"why":"Cutting the allowance makes the low-income pay tax too, taking a large share of their income → more uneven distribution."},{"id":"CE2008/P2/Q44","q":"Salaries-tax bands widened (first $40k etc.), rates unchanged, salaries unchanged. Under the new system,","opts":["fewer people fall into the tax net","fewer people pay at the standard rate","the income gap is unaffected","the government runs a budget deficit"],"ans":1,"why":"Wider tax bands mean fewer people reach the standard rate; the allowance is unchanged → the number in the net is unchanged."},{"id":"CE2009/P2/Q44","q":"Standard rate of salaries tax cut from 16% to 15%. Other things equal, this would","opts":["reduce the number falling into the tax net","increase progressivity of salaries tax","increase consumption expenditure of people in HK","increase after-tax income of low-income people"],"ans":2,"why":"A standard-rate cut affects only high-income standard-rate payers → their after-tax income and consumption rise; the low-income are unaffected."}]},{"id":"ch11","ch":"ch11","text":"An owner-occupied flat has no property tax; a second-hand car has no first-registration tax; a shareholder does not pay profits tax personally (the company does).","qs":[{"id":"CE1995/P2/Q44","q":"Mr Chan bought a new flat in Shatin and moved in. Taxes he pays for 94-95: (1) stamp duty (2) property tax (3) rates","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":1,"why":"Owner-occupied = no rental income = no property tax; buying incurs stamp duty, holding incurs rates."},{"id":"CE2009/P2/Q40","q":"Which statement about HK's tax system is correct?","opts":["Capital gains from stock trading are taxed","Mainland rental income is subject to HK income tax","Gasoline consumption is not taxed","Estimated rental value of owner-occupied flats is NOT subject to property tax"],"ans":3,"why":"An owner-occupied flat has no rental income → no property tax; A/B/C all wrong (no capital-gains tax, territorial source, fuel is taxed)."},{"id":"DSE2016/P1/Q35","q":"Lam: salary 1,000k; dividend 50k; buys a second-hand racing car; flies abroad via HKIA. He pays: (1) salaries tax (2) dividend tax (3) first registration tax (4) air passenger departure tax","opts":["(1) and (4) only","(2) and (3) only","(1), (2) and (4) only","(1), (3) and (4) only"],"ans":0,"why":"Salaries + departure tax; dividends untaxed; a second-hand car has no first-registration tax."},{"id":"DSE2020/P1/Q40","q":"Chan runs a factory in mainland China (profit); bought a flat and a second-hand electric car in HK; received HSBC dividends. Tax(es) to HK: (1) property (2) stamp duty (3) profits (4) first registration","opts":["(2) only","(1) and (4) only","(2) and (3) only","(1), (3) and (4) only"],"ans":0,"why":"Factory on the Mainland → no HK profits tax; owner-occupied flat has no rental → no property tax; dividends untaxed; second-hand car has no first-registration tax → only stamp duty (on the flat purchase)."}]},{"id":"ch12","ch":"ch11","text":"For regressive/conclusion questions: writing only the conclusion with no elaboration = 0 marks.","qs":[{"id":"CE1993/P2/Q45","q":"Which is a correct description of direct tax?","opts":["Direct tax is regressive","Collection cost greater than indirect tax","Revenue will drop in a recession","Raising direct tax rates leads to inflation"],"ans":2,"why":"Direct taxes (salaries/profits) move with income, so revenue falls during a recession."}]},{"id":"ch13","ch":"ch11","text":"Expansionary monetary: ↓RRR, ↓discount, open-market PURCHASE; contractionary: ↑RRR, ↑discount, open-market SALE.","qs":[{"id":"AL2000/Q8","q":"Banks are fully loaned up. Which would DECREASE the money supply? (1) raise the reserve ratio (2) a fall in the public's desire to hold cash (3) an open-market SALE of bonds to the non-bank public","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":1,"why":"↑RRR cuts MS, an open-market SALE cuts MS; (2) a lower desire to hold cash actually RAISES MS."},{"id":"AL2004/Q4","q":"Which is/are expansionary monetary policy? (1) lower the RRR (2) raise the discount rate (3) an open-market PURCHASE of bonds","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":1,"why":"↓RRR and an open-market PURCHASE are expansionary; ↑discount is contractionary."},{"id":"DSESP/Q30","q":"Which would INCREASE the money supply? (1) raise the discount rate (2) lower the RRR (3) the central bank buys bonds from a commercial bank","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":2,"why":"↓RRR and a central-bank purchase are expansionary; ↑discount is contractionary."},{"id":"DSE2017/Q37","q":"Which is most likely to cause a DROP in output?","opts":["the central bank bought bonds and the govt raised the allowance","the central bank sold bonds and the govt reduced transfers to the poor","lowered the RRR and raised progressivity","raised the discount rate and cut profits tax"],"ans":1,"why":"Both are contractionary → ↓AD → lower output."}]},{"id":"ch14","ch":"ch11","text":"A bond trade BETWEEN commercial banks does NOT change MS/base.","qs":[{"id":"AL2006/Q7","q":"Which would INCREASE the money supply? (1) banks lend out their excess reserves (2) lower the RRR (3) a bank buys bonds from another bank","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":0,"why":"(1)(2) raise MS; (3) a trade between banks does NOT change MS/base."}]},{"id":"ch15","ch":"ch11","text":"OMO/discount change the base; RRR changes the supply (not the base). Base flat but MS up → must be ↓RRR.","qs":[{"id":"AL2005/Q17","q":"A rise in the discount rate would","opts":["increase MS and the cash held by the public","decrease MS by reducing the reserves banks borrow from the central bank","increase MS and bank lending","have no effect on MS"],"ans":1,"why":"The discount rate is what the central bank charges banks; a rise → banks borrow fewer reserves → MS falls."},{"id":"DSE2022/Q34","q":"The monetary base is unchanged at 150 but money supply rose from 500 to 800. The explanation is (1) the central bank bought bonds (2) it raised the discount rate (3) it lowered the RRR","opts":["(3) only","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"ans":0,"why":"Base unchanged → not OMO/discount (those change the base); MS up with base flat → multiplier up → must be ↓RRR."}]},{"id":"ch16","ch":"ch11","text":"Fiscal vs monetary: transfers / cash / allowances / vouchers = fiscal; a commercial bank cutting its rate / the linked exchange rate ≠ central-bank monetary policy.","qs":[{"id":"AL2007/Q10","q":"Which is/are contractionary monetary policy? (1) open-market SALE (2) raise the discount rate (3) devalue the currency","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":0,"why":"An open-market sale and ↑discount are contractionary; devaluation is an exchange-rate, not a monetary, tool."},{"id":"DSE2013/Q28","q":"Expansionary monetary policy in China is carried out by which? (1) the Ministry of Finance gives cash subsidies (2) the PBoC lowers the RRR (3) the Bank of China lowers its lending rate to SMEs","opts":["(1) only","(2) only","(3) only","(1),(2),(3)"],"ans":1,"why":"Monetary policy = the central bank (PBoC); (1) is fiscal, (3) is a commercial-bank act, not central-bank policy."},{"id":"DSE2020/Q32","q":"Which is a contractionary monetary policy?","opts":["raise the discount rate","raise salaries tax","lower the RRR","reduce the migration quota"],"ans":0,"why":"↑discount = contractionary monetary; B is fiscal, C is expansionary."},{"id":"DSE2024/Q39","q":"Which is a contractionary monetary policy in China? (1) the PBoC raises the RRR (2) the PBoC lowers its lending rate (3) the govt raises income tax","opts":["(1) only","(3) only","(1) and (2) only","(2) and (3) only"],"ans":0,"why":"Contractionary monetary = ↑RRR (1); (2) ↓rate is expansionary; (3) tax is fiscal."}]},{"id":"ch17","ch":"ch11","text":"Fiscal tools = G + tax; expansionary = ↑G / ↓tax / ↑transfers / rebate / voucher.","qs":[{"id":"AL2008/Q4","q":"Which is/are expansionary policy? (1) cut corporate profits tax (2) exempt rates (3) interest-free loans to SMEs","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":3,"why":"All three stimulate AD/investment → expansionary."},{"id":"CE1990/Q44","q":"Which is a fiscal policy to reduce inflation?","opts":["direct wage control","increase unemployment benefit","increase the reserve ratio","reduce spending on an environmental scheme"],"ans":3,"why":"↓G = contractionary fiscal; A is not a policy, B is expansionary, C is monetary."},{"id":"CE1991/Q40","q":"Which are tools of fiscal policy in Hong Kong? (1) the linked exchange rate (2) govt spending on infrastructure (3) the standard tax rate (4) the minimum cash reserve ratio","opts":["(1) and (3) only","(1) and (4) only","(2) and (3) only","(2) and (4) only"],"ans":2,"why":"Fiscal = G (2) + tax (3); the exchange rate (1) and reserve ratio (4) are not fiscal."},{"id":"CE1992/Q40","q":"Which is an expansionary fiscal policy?","opts":["introduce a new tax","build a new airport","cut spending on a department","increase the purchase of water from China"],"ans":1,"why":"↑G (the airport) = expansionary; D buying water is an import leakage."}]},{"id":"ch18","ch":"ch11","text":"SRAS shifts right = ↑labour supply / ↓cost / appreciation; 'price rises' ≠ a shift — distinguish shift vs movement.","qs":[{"id":"CE1991/Q45","q":"A fall in the inflation rate is most likely caused by","opts":["an increase in money supply","an increase in the interest rate","an increase in govt spending","an increase in indirect tax"],"ans":1,"why":"↑interest → ↓investment/consumption → ↓AD → ↓inflation; D is a one-off price rise, not sustained inflation."},{"id":"DSE2014/Q35","q":"Which can reduce the price level AND unemployment at the same time?","opts":["raise the discount rate","increase subsidies to SMEs","raise salaries tax","increase social welfare spending"],"ans":1,"why":"↑subsidies → ↓production cost → SRAS shifts right → ↓price + ↑output (↓unemployment). A supply-side policy."},{"id":"DSE2015/Q26","q":"Which would shift the AD curve to the right?","opts":["the central bank lowers the discount rate","the minimum wage rises","the price level falls","trading partners enter recession"],"ans":0,"why":"↓discount = expansionary → AD shifts right; C is a movement along the curve."},{"id":"DSE2018/Q26","q":"Which would shift the SRAS curve to the right?","opts":["the govt relaxes the foreign worker quota","raise the profits tax","the central bank sells bonds","the price level rises"],"ans":0,"why":"↑labour supply → ↓cost → SRAS shifts right; D is a movement along the curve."}]},{"id":"ch19","ch":"ch11","text":"Short vs long run: expansion only raises real output in the short run; long-run LRAS is vertical, raising only the price; long-run ↑output requires raising potential output.","qs":[{"id":"DSESP/Q35","q":"During unemployment, an increase in money supply will NOT raise","opts":["real national income","nominal national income","the price level","potential output"],"ans":3,"why":"↑MS affects AD (real/nominal NI, price) but does NOT raise potential output (LRAS)."},{"id":"DSE2017/Q38","q":"To cut a fiscal deficit, compare expansionary monetary policy (printing money) with contractionary fiscal policy. Advantages of the monetary option: (1) higher employment (2) higher purchasing power (3) higher real output","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":1,"why":"Printing money is expansionary → short-run ↑employment & ↑output (1,3); but purchasing power falls (inflation) (so 2 is wrong)."},{"id":"DSE2023/Q30","q":"On an AD-SRAS-LRAS diagram the long-run equilibrium moves to a point with a lower price level but the same potential output. Which caused it?","opts":["an increase in the desire to save","a fall in factor input prices","more retraining programmes","the central bank lowers the RRR"],"ans":0,"why":"↑saving → ↓consumption → AD shifts left permanently → new long-run equilibrium at a lower price, same potential output. B shifts SRAS, C shifts LRAS, D shifts AD right."},{"id":"DSE2025/Q27","q":"Which is most likely to raise SHORT-RUN output?","opts":["a higher savings rate and higher labour productivity","higher income tax and faster trading-partner growth","the central bank lowers the discount rate and the world oil price falls","lower tariffs on imports and a higher skilled-immigration quota"],"ans":2,"why":"↓discount (↑AD) + ↓oil price (↓cost, SRAS right) → short-run ↑output; D raises imports and lowers AD, and skilled immigration is a long-run supply-side factor."}]},{"id":"ch20","ch":"ch11","text":"Gap direction: inflationary gap → contract; deflationary gap → expand. Long-run equilibrium is restored by SRAS moving (factor prices), NOT by 'AD falling'.","qs":[{"id":"DSESP/Q36","q":"Which would help solve an inflationary gap?","opts":["increase taxes","increase the budget deficit","increase transfer payments","increase govt spending"],"ans":0,"why":"Inflationary gap → contractionary → ↑taxes."},{"id":"DSEPP/Q32","q":"Which would help narrow a deflationary gap?","opts":["raise the RRR","the central bank sells bonds","increase govt spending","abolish tariffs on imports"],"ans":2,"why":"↑G = expansionary → narrows the deflationary gap; D raises imports and lowers AD."},{"id":"DSE2013/Q24","q":"The economy is at E0 to the right of LRAS. There is ___ and ___ would restore long-run equilibrium.","opts":["an inflationary gap; increasing transfers","an inflationary gap; raising the discount rate","a deflationary gap; increasing transfers","a deflationary gap; raising the discount rate"],"ans":1,"why":"E0 is to the right of LRAS → inflationary gap → contract (↑discount)."},{"id":"DSE2013/Q31","q":"At full employment with G=T. Which would make a deflationary gap and a budget deficit coexist?","opts":["a decrease in taxes","a decrease in money supply","a decrease in govt spending","a decrease in the desire to import"],"ans":1,"why":"↓MS → ↓AD → deflationary gap; ↓Y → ↓tax revenue → an automatic fiscal deficit."}]},{"id":"ch21","ch":"ch11","text":"Budget = estimated vs actual; a surplus budget can turn into an actual deficit. Deficit budget = expansionary, surplus budget = contractionary.","qs":[{"id":"CE1992/Q41","q":"A surplus budget leads to","opts":["a decrease in govt spending","a fiscal surplus","a balance-of-payments surplus","a contraction of the economy"],"ans":3,"why":"A surplus budget G<T = contractionary → economic contraction."},{"id":"CE1993/Q49","q":"In an economy with unemployment, a deficit budget would generally lead to","opts":["lower unemployment","lower national income","lower consumption","lower govt debt"],"ans":0,"why":"A deficit budget = expansionary → ↑AD → ↓unemployment."},{"id":"CE1994/Q50","q":"A ___ budget means estimated ___ exceeds estimated ___.","opts":["surplus; actual revenue; actual expenditure","surplus; revenue; expenditure","deficit; revenue; expenditure","deficit; expenditure; revenue"],"ans":1,"why":"A budget is stated in estimated terms; a surplus budget = estimated revenue > estimated expenditure."},{"id":"CE1995/Q49","q":"A deficit budget generally","opts":["reduces foreign-exchange reserves","has an expansionary effect","makes income distribution more uneven","increases govt debt"],"ans":1,"why":"A deficit budget = expansionary effect."}]},{"id":"ch22","ch":"ch11","text":"A balanced budget (G=T) is expansionary for AD (balanced-budget multiplier).","qs":[{"id":"DSE2021/Q40","q":"Govt spending is financed entirely by an equal amount of tax (G=T). The effect on aggregate demand is","opts":["expansionary","contractionary","neutral","indeterminate"],"ans":0,"why":"Balanced-budget multiplier > 0: all of G is injected, but the equal tax only cuts the consumption portion → net expansionary."}]},{"id":"ch23","ch":"ch11","text":"Offsetting effects: ↑saving / ↑imports / ↑cash held / ↑RRR / open-market sale can offset an expansion.","qs":[{"id":"AL2007/Q15","q":"Investors become more optimistic (raising the transaction demand for money and pushing the interest rate up). To stabilize the interest rate the govt could","opts":["raise the RRR","change wage payment from monthly to weekly","reduce import demand","increase transfer payments"],"ans":1,"why":"Paying wages more often (monthly→weekly) reduces the transaction demand for money → offsets the upward pressure on interest. (harder)"},{"id":"DSEPP/Q34","q":"An increase in which would OFFSET the effect of expansionary monetary policy on national income? (1) the asset demand for money (2) the desire to save (3) transfer payments","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":0,"why":"↑money held (asset demand) + ↑saving → offset; ↑transfers (3) is expansionary instead."},{"id":"DSE2012/Q30","q":"Online shopping reduces cash needed for transactions. To reduce the effect on the interest rate, the central bank could (1) raise the discount rate (2) raise the RRR (3) make an open-market purchase","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":0,"why":"Lower money demand puts downward pressure on the interest rate; to offset it, contract (↓MS): ↑discount + ↑RRR; an open-market purchase (3) works the opposite way."},{"id":"DSE2012/Q36","q":"Which would OFFSET the effect of a cut in the income tax rate on aggregate demand?","opts":["lower the asset demand for money","lower the desire to import","raise the desire to invest","increase the RRR"],"ans":3,"why":"A tax cut = expansionary; to offset, contract → ↑RRR."}]},{"id":"ch24","ch":"ch11","text":"Twin deficits: ↑income tax + depreciation/tariffs improve both the fiscal and trade balances together.","qs":[{"id":"DSE2016/Q40","q":"Which would help eliminate both a fiscal deficit AND a trade deficit? (1) lower the nominal interest rate (2) currency depreciation (3) raise income tax","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":2,"why":"Depreciation → ↑exports/↓imports (trade); ↑income tax → ↑revenue (fiscal) + ↓imports (trade)."},{"id":"DSE2021/Q29","q":"During the pandemic both employment and exports fell. Which single measure could relieve BOTH?","opts":["the central bank lowers the discount rate","distribute cash to everyone aged 18+","an employment support scheme","devalue the currency"],"ans":3,"why":"Depreciation → ↑exports (rescues exports) + ↑net exports ↑AD ↑employment. One move fixes both."},{"id":"DSE2025/Q38","q":"With both a fiscal deficit and a trade deficit, which would help eliminate BOTH? (1) impose tariffs on imports (2) raise salaries tax (3) devalue the currency","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2),(3)"],"ans":3,"why":"(1) tariffs → ↑revenue + ↓imports; (2) ↑salaries tax → ↑revenue + ↓imports; (3) depreciation → ↑exports ↓imports, and ↑Y → ↑revenue indirectly improves the fiscal balance."}]},{"id":"ch25","ch":"ch11","text":"↓profits tax → ↑incentive to invest (but revenue may rise or fall).","qs":[{"id":"CE1990/Q37","q":"National income tends to increase if there is","opts":["an increase in the budget surplus","an increase in the interest rate","a decrease in the profits tax rate","a decrease in export demand"],"ans":2,"why":"↓profits tax → ↑investment → ↑AD/NI."},{"id":"CE1998/Q38","q":"A cut in the profits tax rate","opts":["reduces govt revenue","reduces govt spending","raises the incentive to invest","raises unemployment"],"ans":2,"why":"↓profits tax → ↑incentive to invest; whether revenue rises or falls is uncertain (so A is not certain)."},{"id":"CE2003/Q40","q":"Raising the profits tax rate","opts":["raises tax revenue","lowers unemployment","lowers the incentive to invest","raises the price level"],"ans":2,"why":"↑profits tax → ↓incentive to invest; revenue may not rise (Laffer)."},{"id":"CE2007/Q43","q":"A cut in the profits tax rate","opts":["raises foreign-exchange reserves","raises the incentive to invest","reduces govt revenue","shrinks the public sector"],"ans":1,"why":"↑incentive to invest; the rest are uncertain."}]},{"id":"ma2","ch":"macro","text":"‘Efficient’ ≠ ‘equitable/fair’. An allocation can be Pareto-efficient yet very unequal. Equity is a separate test.","qs":[{"id":"DSEPP/P1/Q17","q":"Economic efficiency is attained when (1) total benefits to consumers are maximized. (2) all potential gains are fully captured. (3) marginal social benefits are equal to marginal social costs.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":2,"why":"Efficiency means all potential gains are captured (2) and marginal social benefit = marginal social cost (3); maximising consumers' benefit alone (1) ignores costs."},{"id":"DSE2013/P1/Q18","q":"Suppose the market equilibrium output level is greater than the efficient output level. It implies that","opts":["total social surplus will increase if output is reduced towards the efficient output level.","at the equilibrium output level, marginal benefit is greater than marginal cost.","the sum of consumer surplus and producer surplus is maximized as the market output level satisfies the equilibrium condition.","government intervention is necessary to reduce output as there is over-production."],"ans":0,"why":"Output above the efficient level is over-production (MC>MB on the last units), so cutting output back toward it raises total social surplus."},{"id":"DSE2016/P1/Q21","q":"In which of the following situations is efficiency attained?","opts":["Total social benefit is equal to total social cost.","Producer surplus is equal to consumer surplus.","The difference between marginal social benefit and marginal social cost is zero.","The consumer surplus of all consumers in the market is maximised."],"ans":2,"why":"Efficiency is attained where marginal social benefit equals marginal social cost — i.e. their difference (MSB - MSC) is zero."},{"id":"DSE2024/P1/Q22","q":"In recent years, more and more people play videos loudly with their smartphones on public transport, disturbing other passengers. Based on the above information, which of the following statements are correct? (1) Total social surplus may decrease if playing videos loudly with smartphones on public transport is banned by the government. (2) Economic efficiency may improve if suppliers of public transportation services designate quiet zones in their vehicles where passengers are not allowed to play videos loudly with their smartphones. (3) The divergence between private and social costs may decrease if people playing videos loudly with their smartphones on public transport are fined.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"Loud phone videos on public transport are a negative externality that lowers other passengers' welfare, so all three statements about lost social surplus hold."}]},{"id":"ma3","ch":"macro","text":"Deadweight loss appears whenever price ≠ marginal cost: taxes, subsidies, price controls, monopoly, externalities — including a subsidy that over-produces.","qs":[{"id":"DSE2012/P1/Q19","q":"The increase of an effective quota on a good will result in (1) an increase in the quantity transacted of the good. (2) a further improvement in the quality of the good. (3) a smaller deadweight loss.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) an
