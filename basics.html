<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HKDSE Economics &mdash; Basics</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
 --bg:#ebe4d5; --surface:#faf7ef; --surface-2:#efe9db;
 --ink:#211d16; --muted:#6f6455; --line:#cdc3ad;
 --brand:#c9412e; --on-dark:#faf7ef;
 --pos:#3f7a4b; --pos-bg:#eef6ee; --pos-line:#b6d4ba;
 --neg:#c9412e; --neg-bg:#faeee9; --neg-line:#e6bfb4;
 --warn-bg:#f6eccd; --star:#8a5b2a;
 --r-sm:2px; --r-md:3px;
 --shadow-1:3px 3px 0 #dbd2bf;
 --f-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
 --f-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-serif);
 line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;min-height:100vh;background:var(--surface);
 border-left:2px solid var(--brand);border-right:1px solid var(--line);
 box-shadow:0 0 0 1px var(--line);padding:18px 22px 80px}
@media (max-width:640px){.wrap{padding-left:14px;padding-right:14px}}

header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
header .mark{width:40px;height:40px;flex:0 0 auto;border-radius:2px;background:var(--ink);
 color:var(--on-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:13px;font-family:var(--f-sans)}

.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--surface);padding:12px 0 8px;
 z-index:10;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);margin-top:12px}
.tab{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--line);
 background:transparent;color:var(--ink);padding:0 15px;border-radius:2px;font-size:13px;
 cursor:pointer;font-weight:600;font-family:var(--f-sans)}
.tab:hover:not(.on){border-color:var(--ink)}
.tab.on{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.tab .pip{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:2px;
 background:var(--brand);color:#fff;font-size:10px;line-height:17px;text-align:center;font-family:var(--f-mono)}
.acctbtn{margin-left:auto}
.tab-back{text-decoration:none;color:var(--muted);border-color:var(--line)}
.tab-back:hover{color:var(--ink);border-color:var(--ink)}

.panel{display:none;padding-top:16px} .panel.on{display:block}
.card{background:var(--surface);border:1.5px solid var(--ink);box-shadow:var(--shadow-1);
 padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;min-height:40px;border:1.5px solid var(--line);
 background:transparent;padding:0 13px;border-radius:2px;font-size:12.5px;cursor:pointer;
 font-family:var(--f-sans);font-weight:600}
.chip.on{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--ink);
 background:transparent;color:var(--ink);padding:0 15px;border-radius:2px;font-size:13px;
 cursor:pointer;font-weight:600;font-family:var(--f-sans)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--on-dark)}
.btn.primary:hover{background:var(--brand);border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}

.term{font-size:20px;font-weight:700;margin:0 0 3px}
.ask{font-family:var(--f-sans);font-size:12px;color:var(--muted);text-transform:uppercase;
 letter-spacing:.06em;margin:0 0 12px}
.marks{font-family:var(--f-mono);font-size:12px;color:var(--brand);font-weight:600}

.tile{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);
 color:var(--ink);padding:11px 13px;border-radius:2px;margin-bottom:7px;cursor:pointer;
 font:inherit;font-size:14px;min-height:44px}
.tile:hover{border-color:var(--ink)}
.tile.ok{border-color:var(--pos);background:var(--pos-bg);box-shadow:inset 3px 0 0 var(--pos)}
.tile.no{border-color:var(--neg);background:var(--neg-bg);box-shadow:inset 3px 0 0 var(--neg)}
.tile.dim{opacity:.45}
.tile .n{font-family:var(--f-mono);font-size:11px;color:var(--star);margin-right:9px}

.built{background:var(--surface-2);border-left:3px solid var(--pos);padding:12px 14px;margin:12px 0}
.built p{margin:0 0 6px;font-size:14px}
.built p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:104px;border-bottom:2px solid var(--brand);
 text-align:center;font-weight:700;padding:0 6px}
.blank.filled{border-bottom-color:var(--pos);color:var(--pos)}
.fb{margin-top:12px;padding:11px 13px;border-radius:2px;font-size:13.5px;display:none}
.fb.show{display:block}
.fb.r{background:var(--pos-bg);border-left:3px solid var(--pos)}
.fb.w{background:var(--neg-bg);border-left:3px solid var(--neg)}
.official{font-family:var(--f-sans);font-size:12px;color:var(--muted);margin-top:9px}

.nav{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.prog{height:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;
 overflow:hidden;margin:6px 0 16px}
.prog>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1.5px solid var(--ink);box-shadow:var(--shadow-1);
 padding:13px;text-align:center}
.stat b{display:block;font-size:21px;font-family:var(--f-mono)}
.stat span{color:var(--muted);font-size:11.5px;font-family:var(--f-sans)}
.empty{color:var(--muted);padding:26px 0;text-align:center;font-family:var(--f-sans);font-size:14px}
.note{font-family:var(--f-sans);font-size:12.5px;color:var(--muted);line-height:1.7}
.note b{color:var(--ink)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
 font-family:var(--f-sans);font-size:12px;color:var(--muted)}
.day{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.day i{width:26px;height:26px;border:1.5px solid var(--line);border-radius:2px;font-style:normal;
 display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--f-mono)}
.day i.done{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}

textarea{width:100%;min-height:96px;padding:11px 12px;border:1.5px solid var(--line);border-radius:2px;
 background:var(--surface);color:var(--ink);font:inherit;font-size:14px;line-height:1.55;resize:vertical}
textarea:focus{outline:none;border-color:var(--brand)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.key{font-family:var(--f-sans);font-size:12px;font-weight:600;padding:5px 9px;border:1.5px solid var(--line);border-radius:2px}
.key.hit{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.key.gone{background:var(--neg-bg);border-color:var(--neg-line);color:var(--neg)}
.selfrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;
 padding-top:12px;border-top:1px solid var(--line)}
.stage{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stage.s3,.stage.s4,.stage.s5{color:var(--pos)}
.chip.due{border-color:var(--brand);color:var(--brand)}
.chip.due.on{background:var(--brand);border-color:var(--brand);color:var(--on-dark)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
</style>
</head>

rrower)","ch":"ch1","text":"cost paid by the borrower for obtaining goods or resources earlier.","gaps":["obtaining","resources","borrower"]},{"t":"cloze","kind":"definition","term":"Interest (lender)","ch":"ch1","text":"compensation received by the lender for deferring consumption of goods or resources.","gaps":["compensation","consumption","deferring"]},{"t":"cloze","kind":"definition","term":"Free goods","ch":"ch1","text":"people do not prefer more of it.","gaps":["people","prefer"]},{"t":"assemble","kind":"definition","term":"Economic goods","ch":"ch1","text":"1. quantity is insufficient to satisfy all human wants. 2. are produced from scarce resources which have alternative uses.","points":["quantity is insufficient to satisfy all human wants","are produced from scarce resources which have alternative uses"]},{"t":"assemble","kind":"definition","term":"Positive statements","ch":"ch1","text":"1. with no value judgement. 2. They are refutable by facts.","points":["with no value judgement","They are refutable by facts"]},{"t":"assemble","kind":"definition","term":"Normative statements","ch":"ch1","text":"1. involve value judgement. 2. They are not refutable by facts.","points":["involve value judgement","They are not refutable by facts"]},{"t":"cloze","kind":"definition","term":"What to produce","ch":"ch2","text":"about the kinds and quantities of goods to produce.","gaps":["quantities","produce","kinds"]},{"t":"cloze","kind":"definition","term":"How to produce","ch":"ch2","text":"about the methods of production and combination of factor inputs.","gaps":["combination","production","methods"]},{"t":"cloze","kind":"definition","term":"For whom to produce","ch":"ch2","text":"how to distribute goods./allocation method (price competition/non price competition)","gaps":["competition","distribute","allocation"]},{"t":"cloze","kind":"definition","term":"Producer goods / Capital goods","ch":"ch4","text":"use them to help production.","gaps":["production","help"]},{"t":"cloze","kind":"definition","term":"Consumer goods","ch":"ch4","text":"used for self-consumption.","gaps":["self-consumption","used"]},{"t":"cloze","kind":"definition","term":"Non-rival in consumption","ch":"ch4","text":"Consumption of the goods by one person does not reduce the amount available to others.","gaps":["Consumption","available","person"]},{"t":"cloze","kind":"definition","term":"Non-excludable in consumption","ch":"ch4","text":"too costly to exclude others from consuming the goods.","gaps":["consuming","exclude","costly"]},{"t":"cloze","kind":"definition","term":"Primary production","ch":"ch4","text":"extract raw materials from nature rsources.","gaps":["materials","rsources","extract"]},{"t":"cloze","kind":"definition","term":"Secondary production","ch":"ch4","text":"turn raw materials into semi-finished or finished goods.","gaps":["semi-finished","materials","finished"]},{"t":"cloze","kind":"definition","term":"Tertiary production","ch":"ch4","text":"provide different services.","gaps":["different","services","provide"]},{"t":"cloze","kind":"definition","term":"Simple division of labour","ch":"ch4","text":"specialises in producing a particular good.","gaps":["specialises","particular","producing"]},{"t":"cloze","kind":"definition","term":"Complex division of labour","ch":"ch4","text":"specialises in a particular stage of the production of a good.","gaps":["specialises","particular","production"]},{"t":"assemble","kind":"definition","term":"Division of labour increases labour productivity","ch":"ch4","text":"1. Choosing the best people to do the job; 2. Practice makes perfect (learning by doing); 3. Saving time on training; 4. Saving time on moving from one task to another; 5. Stimulus to mechanisation.","points":["Choosing the best people to do the job","Practice makes perfect (learning by doing)","Saving time on training","Saving time on moving from one task to another","Stimulus to mechanisation"]},{"t":"assemble","kind":"definition","term":"Disadvantages of division of labour","ch":"ch4","text":"Work becomes monotonous; Greater risk of unemployment; Greater degree of interdependence.","points":["Work becomes monotonous","Greater risk of unemployment","Greater degree of interdependence"]},{"t":"assemble","kind":"definition","term":"Limitations of division of labour","ch":"ch4","text":"1. Nature of the product: require originality and uniqueness. 2. Size of the market is small.","points":["Nature of the product: require originality and uniqueness","Size of the market is small"]},{"t":"cloze","kind":"definition","term":"Land","ch":"ch5","text":"natural resources used in production. Return: rent.","gaps":["production","resources","natural"]},{"t":"cloze","kind":"definition","term":"Capital","ch":"ch5","text":"man-made resource used in production. Return: interest.","gaps":["production","man-made","resource"]},{"t":"cloze","kind":"definition","term":"Labour","ch":"ch5","text":"the human effort, both mental and physical, used in production. Return: wage.","gaps":["production","physical","effort"]},{"t":"cloze","kind":"definition","term":"Entrepreneurship","ch":"ch5","text":"make decisions and bear production risks. Return: profit (can be negative).","gaps":["production","decisions","negative"]},{"t":"assemble","kind":"definition","term":"Wage payment method (employer)","ch":"ch5","text":"1. cost of monitoring output quality; 2. cost of calculating wages; 3. cost of supervising workers; 4. Labour productivity and workers’ incentive to work.","points":["cost of monitoring output quality","cost of calculating wages","cost of supervising workers","Labour productivity and workers’ incentive to work"]},{"t":"assemble","kind":"definition","term":"Wage payment method (employee)","ch":"ch5","text":"1. earn a more stable income; 2. earn more by working harder; 3. share part of the business risk.","points":["earn a more stable income","earn more by working harder","share part of the business risk"]},{"t":"cloze","kind":"definition","term":"Fixed factors","ch":"ch6","text":"factors of production that do not change in quantity as output changes.","gaps":["production","quantity","factors"]},{"t":"cloze","kind":"definition","term":"The long run","ch":"ch6","text":"a period in which all factors of production are variable factors.","gaps":["production","variable","factors"]},{"t":"cloze","kind":"definition","term":"The law of diminishing marginal returns","ch":"ch6","text":"states that in the short run, as more and more units of a variable factor are added to a given quantity of fixed factor successively, marginal product will decrease eventually, other things being constant.","gaps":["successively","eventually","variable"]},{"t":"cloze","kind":"definition","term":"Horizontal expansion","ch":"ch7","text":"the expansion of a firm into the same stage of production or the production of the same product.","gaps":["production","expansion","product"]},{"t":"cloze","kind":"definition","term":"Vertical backward expansion","ch":"ch7","text":"the expansion of a firm into a previous stage of production.","gaps":["production","expansion","previous"]},{"t":"cloze","kind":"definition","term":"Vertical forward expansion","ch":"ch7","text":"refers to the expansion of a firm into a latter stage of production.","gaps":["production","expansion","refers"]},{"t":"cloze","kind":"definition","term":"Lateral expansion","ch":"ch7","text":"the expansion of a firm into the production of related but not directly competing goods.","gaps":["production","expansion","competing"]},{"t":"cloze","kind":"definition","term":"Conglomerate expansion","ch":"ch7","text":"the expansion of a firm into the production of totally different goods.","gaps":["production","expansion","different"]},{"t":"cloze","kind":"definition","term":"Equality (canon of taxation)","ch":"macro","text":"Taxpayers pay their taxes in proportion to their income.","gaps":["proportion","Taxpayers","income"]},{"t":"cloze","kind":"definition","term":"Certainty (canon of taxation)","ch":"macro","text":"Rules about and procedures of the processing of tax returns and the collection of tax should be clearly defined.","gaps":["procedures","processing","collection"]},{"t":"cloze","kind":"definition","term":"Convenience (canon of taxation)","ch":"macro","text":"The methods of processing tax returns and paying tax should be as convenient as possible for taxpayers and the government.","gaps":["processing","convenient","government"]},{"t":"cloze","kind":"definition","term":"Economy (canon of taxation)","ch":"macro","text":"The cost of administering the tax system should be kept as low as possible.","gaps":["administering","possible","system"]},{"t":"assemble","kind":"definition","term":"Wealth effect (why AD slopes downward)","ch":"macro","text":"As many of the assets in the economy are denominated in nominal values, the higher the price level, the lower the purchasing power of these monetary assets. This reduces the wealth of the economy (in real terms). As a result, consumption decreases and the aggregate quantity of output demanded drops.","points":["As many of the assets in the economy are denominated in nominal values,","the higher the price level, the lower the purchasing power of these monetary assets.","This reduces the wealth of the economy (in real terms).","As a result, consumption decreases and the aggregate quantity of output demanded drops."]},{"t":"assemble","kind":"definition","term":"Interest rate effect (why AD slopes downward)","ch":"macro","text":"As the price level rises, households and firms demand more money to finance their transactions. Given the fixed supply of money, the interest rate would rise. An increase in interest rate would cause a decline in investment and consumption and thus the aggregate quantity of output demanded.","points":["As the price level rises, households and firms demand more money to finance their transactions.","Given the fixed supply of money, the interest rate would rise.","An increase in interest rate would cause a decline in investment and consumption","and thus the aggregate quantity of output demanded."]},{"t":"assemble","kind":"definition","term":"Why SRAS slopes upward","ch":"macro","text":"The adjustment of input prices is imperfect, due to the longer contracts of inputs, so the cost of production in real terms has dropped. Quantities of output supplied will increase.","points":["The adjustment of input prices is imperfect,","due to the longer contracts of inputs,","so the cost of production in real terms has dropped.","Quantities of output supplied will increase."]},{"t":"assemble","kind":"definition","term":"Adjustment from an inflationary gap","ch":"macro","text":"When there is an inflationary gap, there is an excess demand in the factor market (labour) resulting in an upward adjustment pressure on input prices (wages) The cost of production will increase. Short run aggregate supply will decrease, thus restoring output to full employment output level in the long run.","points":["When there is an inflationary gap,","there is an excess demand in the factor market (labour)","resulting in an upward adjustment pressure on input prices (wages)","The cost of production will increase. Short run aggregate supply will decrease,","thus restoring output to full employment output level in the long run."]},{"t":"assemble","kind":"definition","term":"Adjustment from a deflationary gap","ch":"macro","text":"When there is a deflationary gap, there is an excess supply in the factor market (labour) resulting in a downward adjustment pressure on input prices (wages) cost of production decrease and the SRAS will increase thus restoring output to full employment output level in the long run.","points":["When there is a deflationary gap,","there is an excess supply in the factor market (labour)","resulting in a downward adjustment pressure on input prices (wages)","cost of production decrease and the SRAS will increase","thus restoring output to full employment output level in the long run."]},{"t":"assemble","kind":"definition","term":"Process of deposit creation","ch":"macro","text":"Someone deposits an amount of cash in the banking system. The reserves increase by the amount deposited, but the required reserves increase by only a fraction of the amount deposited. There will be excess reserves in the bank. The bank can loan out the excess reserves. These loans end up as deposits in the banking system. The process goes on and on until there are no excess reserves to lend out.","points":["Someone deposits an amount of cash in the banking system.","The reserves increase by the amount deposited, but the required reserves increase by only a fraction of the amount deposited.","There will be excess reserves in the bank.","The bank can loan out the excess reserves.","These loans end up as deposits in the banking system.","The process goes on and on until there are no excess reserves to lend out."]},{"t":"assemble","kind":"definition","term":"Process of deposit contraction","ch":"macro","text":"Someone withdraws an amount of cash from the banking system. Actual reserves held by the banking system are not sufficient to fulfil the minimum reserve requirement. Banks have to call back some of the loans from debtors or sell some of their assets to the public in order to fulfil the reserve requirement. The process of deposit contraction will go on and on until the actual reserves are equal to the required reserves.","points":["Someone withdraws an amount of cash from the banking system.","Actual reserves held by the banking system are not sufficient to fulfil the minimum reserve requirement.","Banks have to call back some of the loans from debtors or sell some of their assets to the public in order to fulfil the reserve requirement.","The process of deposit contraction will go on and on until the actual reserves are equal to the required reserves."]},{"t":"assemble","kind":"definition","term":"CPI vs GDP deflator","ch":"macro","text":"CPI only includes consumer goods while GDP deflators include both consumer goods and producer goods. CPI calculates a fixed basket of goods and the weighting will be revised every 5 years while GDP deflator has variable baskets.","points":["CPI only includes consumer goods while GDP deflators include both consumer goods and producer goods.","CPI calculates a fixed basket of goods and the weighting will be revised every 5 years while GDP deflator has variable baskets."]},{"t":"assemble","kind":"definition","term":"Key points of the definition of GDP","ch":"macro","text":"Total market value Value of production (the production of final goods and services) Production of a country or an economic territory A given period / current year","points":["Total market value","Value of production (the production of final goods and services)","Production of a country or an economic territory","A given period / current year"]},{"t":"cloze","kind":"definition","term":"Scarcity vs Shortage","ch":"ch1","text":"Scarcity is the basic economic condition where human wants exceed the resources available to satisfy them. Shortage is a market disequilibrium where quantity demanded exceeds quantity supplied at the current price.","gaps":["disequilibrium","condition","resources"]},{"t":"cloze","kind":"rule","term":"Scarcity vs Shortage — the test","ch":"ch1","text":"Scarcity is permanent and universal — it exists in every economic system, with or without money or markets. Shortage is temporary and price-specific — it can be eliminated simply by letting the price rise to its equilibrium level.","gaps":["price-specific","equilibrium","eliminated"]},{"t":"cloze","kind":"definition","term":"Opportunity Cost = Highest-Valued Forgone Option","ch":"ch1","text":"The opportunity cost of a choice is the value of the single best alternative that must be given up to make that choice — not the sum of all alternatives, and never a sunk cost.","gaps":["alternatives","opportunity","alternative"]},{"t":"cloze","kind":"rule","term":"Opportunity Cost = Highest-Valued Forgone Option — the test","ch":"ch1","text":"Rank all alternatives by value, identify the best one NOT chosen, and that alone is the opportunity cost. It rises when that forgone alternative becomes more valuable, and falls when it becomes less valuable — changes to the chosen option itself don't affect it.","gaps":["alternatives","opportunity","alternative"]},{"t":"cloze","kind":"definition","term":"Free Good vs Economic Good","ch":"ch1","text":"An economic (scarce) good is one where, at a zero price, people want more of it than is available — it commands a positive price to ration it. A free good is so abundant relative to want that nobody is willing to pay anything for an extra unit.","gaps":["available","economic","commands"]},{"t":"cloze","kind":"rule","term":"Free Good vs Economic Good — the test","ch":"ch1","text":"The test is about MARGINAL benefit and available quantity relative to want — not about whether something is handed out at no charge, or how it was produced.","gaps":["available","something","MARGINAL"]},{"t":"cloze","kind":"definition","term":"Classifying Goods: Public, Private, Consumer, Capital","ch":"ch1","text":"Goods can be classified along two independent dimensions: (1) rivalry/excludability in consumption — public (non-rival, non-excludable) vs private (rival, excludable); and (2) role in the economy — consumer goods (satisfy wants directly) vs capital/producer goods (used as inputs to produce other goods).","gaps":["non-excludable","excludability","independent"]},{"t":"cloze","kind":"rule","term":"Classifying Goods: Public, Private, Consumer, Capital — the test","ch":"ch1","text":"Classify by asking: does one person's use reduce what's left for others (rivalry)? Can non-payers be excluded? Is it consumed directly, or used to make something else?","gaps":["non-payers","something","Classify"]},{"t":"cloze","kind":"definition","term":"Positive vs Normative Statements","ch":"ch1","text":"A positive statement is a claim about facts that CAN be tested and potentially refuted by evidence — regardless of whether it later turns out true or false. A normative statement expresses a value judgment about what OUGHT to happen, using words like 'should', 'better', 'best', or 'appropriate'.","gaps":["appropriate'","potentially","regardless"]},{"t":"cloze","kind":"rule","term":"Positive vs Normative Statements — the test","ch":"ch1","text":"Test: can you imagine gathering data that would prove this statement wrong? If yes, it's positive. If the statement can't be refuted by any data because it's fundamentally an opinion, it's normative.","gaps":["fundamentally","gathering","statement"]},{"t":"cloze","kind":"definition","term":"Private Property Rights: Use, Income, Transfer","ch":"ch2","text":"Private property rights are the exclusive rights to (1) USE an asset, (2) receive INCOME from it, and (3) TRANSFER (sell/lease/give) it to someone else. Any policy that restricts one or more of these three rights weakens private property rights.","gaps":["exclusive","restricts","property"]},{"t":"cloze","kind":"rule","term":"Private Property Rights: Use, Income, Transfer — the test","ch":"ch2","text":"To assess whether a policy weakens property rights, check specifically which of the three rights (use / income / transfer) it restricts — a policy can leave some rights fully intact while restricting only one.","gaps":["specifically","restricting","restricts"]},{"t":"cloze","kind":"definition","term":"Market Economy vs Planned Economy","ch":"ch2","text":"A market economy allocates resources mainly through the PRICE MECHANISM, with most resources privately owned. A planned/command economy allocates resources through GOVERNMENT DIRECTIVES, with most resources state-owned.","gaps":["state-owned","GOVERNMENT","DIRECTIVES"]},{"t":"cloze","kind":"rule","term":"Market Economy vs Planned Economy — the test","ch":"ch2","text":"The defining test is the allocation MECHANISM and OWNERSHIP structure — not outcomes like income distribution, unemployment, inflation, or the degree of competition, none of which are guaranteed to differ in a fixed direction between the two systems.","gaps":["distribution","unemployment","competition"]},{"t":"cloze","kind":"definition","term":"Interest as the Price of Time","ch":"ch1","text":"Interest is the premium/compensation a lender receives (or a borrower pays) for postponing consumption — it reflects the fact that resources are scarce, so giving up their use now has a real opportunity cost.","gaps":["compensation","consumption","opportunity"]},{"t":"cloze","kind":"rule","term":"Interest as the Price of Time — the test","ch":"ch1","text":"Interest requires only two things to exist: scarcity, and someone postponing consumption for another's benefit. It does not require money, banks, or inflation — payment can be made in kind.","gaps":["consumption","postponing","another's"]},{"t":"cloze","kind":"definition","term":"The Three Basic Economic Problems","ch":"ch2","text":"Every economy must decide WHAT to produce (which goods, how much), HOW to produce (which factor combination/method), and FOR WHOM to produce (who receives the output).","gaps":["combination","receives","economy"]},{"t":"cloze","kind":"rule","term":"The Three Basic Economic Problems — the test","ch":"ch2","text":"Read each scenario for which dimension(s) it touches: a decision about quantity/type of output is 'what'; a decision about production method/technology/labour-vs-capital mix is 'how'; a decision about eligibility/distribution/who benefits is 'for whom'. More than one can apply simultaneously.","gaps":["labour-vs-capital","simultaneously","distribution"]},{"t":"cloze","kind":"definition","term":"The Four Factors of Production","ch":"ch5","text":"Land (unmodified gifts of nature), Labour (human physical/mental effort), Capital (man-made resources used in production), and Entrepreneurship (bearing business risk and making key decisions) — each earns a distinct reward: rent, wage, interest, and profit respectively.","gaps":["Entrepreneurship","respectively","unmodified"]},{"t":"cloze","kind":"rule","term":"The Four Factors of Production — the test","ch":"ch5","text":"Classify any resource by asking: is it untouched nature (land)? Man-made and used as an input (capital)? Human effort provided by an employee (labour)? Or does this person bear the residual financial risk of the enterprise (entrepreneurship)?","gaps":["entrepreneurship","enterprise","untouched"]},{"t":"cloze","kind":"definition","term":"Division of Labour & Specialization","ch":"ch4","text":"Division of labour means breaking a production process into narrow, specialized tasks assigned to different workers, rather than each worker doing the whole job. It raises productivity through practice, better person-task matching, and time saved switching between tasks.","gaps":["productivity","specialized","person-task"]},{"t":"cloze","kind":"rule","term":"Division of Labour & Specialization — the test","ch":"ch4","text":"Benefits: practice makes perfect, matching the right person to the right job, saving training time (less to learn per role), saving time lost moving between tasks, and stimulating the use of specialized machinery.","gaps":["stimulating","specialized","machinery"]},{"t":"cloze","kind":"definition","term":"Average Labour Productivity","ch":"ch5","text":"Average labour productivity is output divided by the quantity of labour used — measured either per WORKER or per labour-HOUR, depending on what the question specifies. It rises with better training, more/better capital equipment, improved health, or better work organization.","gaps":["productivity","organization","labour-HOUR"]},{"t":"cloze","kind":"rule","term":"Average Labour Productivity — the test","ch":"ch5","text":"When comparing two firms/scenarios, always compute the actual ratio from the raw numbers (output ÷ workers, or output ÷ total hours) rather than assuming — the firm with fewer total workers can still be less productive per hour, or vice versa, depending on how hours are distributed.","gaps":["distributed","productive","comparing"]},{"t":"cloze","kind":"definition","term":"Geographical vs Occupational Mobility","ch":"ch5","text":"Geographical mobility is how easily a worker can move location for work. Occupational mobility is how easily a worker can switch profession/trade.","gaps":["Geographical","Occupational","profession"]},{"t":"cloze","kind":"rule","term":"Geographical vs Occupational Mobility — the test","ch":"ch5","text":"Anything that lowers the cost/difficulty of relocating (transport links, housing subsidies, commuting infrastructure) raises geographical mobility. Anything that lowers the cost/difficulty of retraining or entering a new profession (education, vocational training, job information, fewer licensing barriers) raises occupational mobility.","gaps":["infrastructure","geographical","occupational"]},{"t":"cloze","kind":"definition","term":"What Changes Labour Supply","ch":"ch5","text":"Labour supply is the total quantity of labour (workers × hours, or total labour-hours) offered to the market. It rises with a larger/older working-age population, lower minimum working age, higher retirement age, more childcare support, and fewer holidays — and falls with the opposite.","gaps":["labour-hours","working-age","population"]},{"t":"cloze","kind":"rule","term":"What Changes Labour Supply — the test","ch":"ch5","text":"Distinguish labour SUPPLY (quantity of labour offered) from labour PRODUCTIVITY (output per unit of labour) and labour DEMAND (how much firms want to hire) — a policy can affect one without affecting the others.","gaps":["PRODUCTIVITY","Distinguish","affecting"]},{"t":"cloze","kind":"definition","term":"Wage Payment Methods: Time Rate, Piece Rate, and Beyond","ch":"ch5","text":"Time rate pays for hours worked (used when output/quality is hard to measure or standardize). Piece rate pays per unit produced (raises incentive/output, but risks quality). Commission, profit-sharing, and tips all tie pay to performance, sharing business risk with the worker and reducing the employer's monitoring burden.","gaps":["profit-sharing","standardize","performance"]},{"t":"cloze","kind":"rule","term":"Wage Payment Methods: Time Rate, Piece Rate, and Beyond — the test","ch":"ch5","text":"Choose the payment method based on: how easily output can be measured/standardized, how much incentive vs. quality control is needed, and how much risk the employer wants to shift onto the worker.","gaps":["standardized","incentive","measured"]},{"t":"cloze","kind":"definition","term":"Consumer Goods vs Capital (Producer) Goods","ch":"ch4","text":"Consumer goods are used directly by households for final satisfaction. Capital (producer) goods are used by firms as inputs to produce other goods and services.","gaps":["satisfaction","households","Consumer"]},{"t":"cloze","kind":"rule","term":"Consumer Goods vs Capital (Producer) Goods — the test","ch":"ch4","text":"Classification follows USE, not the physical item: ask whether the user is producing something for others (capital good) or consuming directly (consumer good). The same object switches category when its use switches.","gaps":["Classification","producing","something"]},{"t":"cloze","kind":"definition","term":"The Three Stages of Production","ch":"ch4","text":"Primary production extracts natural resources (farming, fishing, mining). Secondary production manufactures and processes goods (factories, construction, baking). Tertiary production provides services (retail, transport, finance, teaching, repair).","gaps":["manufactures","construction","production"]},{"t":"cloze","kind":"rule","term":"The Three Stages of Production — the test","ch":"ch4","text":"The three stages are interdependent: primary supplies raw materials, secondary turns them into finished goods, and tertiary supplies the services (transport, banking, marketing) that both other stages rely on. In diagram questions, identify each flow: raw materials out of primary, producer/consumer goods out of secondary, services out of tertiary.","gaps":["interdependent","materials","secondary"]},{"t":"cloze","kind":"definition","term":"Law of Diminishing Marginal Returns","ch":"ch6","text":"Holding technology constant, when more units of a variable factor are added successively to a given quantity of FIXED factors, the marginal product of the variable factor will eventually decrease.","gaps":["successively","technology","eventually"]},{"t":"cloze","kind":"rule","term":"Law of Diminishing Marginal Returns — the test","ch":"ch6","text":"Exam workflow: (1) confirm one factor is fixed while another varies — if all inputs rise together the law does NOT apply (that's a scale question); (2) convert AP tables to totals (TP = AP × units); (3) difference the totals to get MP; (4) find where MP first falls below the previous MP.","gaps":["difference","workflow","together"]},{"t":"cloze","kind":"definition","term":"Short Run, Long Run, Fixed & Variable Costs","ch":"ch6","text":"The short run is the period in which at least one factor of production is fixed (with technology constant); in the long run all factors are variable. Fixed costs do not vary with output; variable costs do.","gaps":["production","technology","constant"]},{"t":"cloze","kind":"rule","term":"Short Run, Long Run, Fixed & Variable Costs — the test","ch":"ch6","text":"Test any cost against the output decision in the question: if producing more (or staying open an extra hour) raises the expense, it's variable; if it's owed regardless, it's fixed. Diminishing returns lives in the short run; economies of scale lives in the long run.","gaps":["Diminishing","regardless","producing"]},{"t":"cloze","kind":"definition","term":"Economies & Diseconomies of Scale","ch":"ch6","text":"Economies of scale: average cost falls as the scale of production (ALL inputs) increases. Diseconomies of scale: average cost rises as scale increases. Both are long-run concepts.","gaps":["Diseconomies","production","Economies"]},{"t":"cloze","kind":"rule","term":"Economies & Diseconomies of Scale — the test","ch":"ch6","text":"Test tables by computing AC = total cost ÷ total output at each scale. Output doubling while cost rises only 80% → economies of scale; cost more than doubling → diseconomies. Sources of internal economies: technical (fuller use of indivisible equipment), managerial (specialisation), financial (cheaper borrowing), marketing (bulk-purchase discounts, advertising spread over more output), R&D and risk-bearing.","gaps":["specialisation","bulk-purchase","diseconomies"]},{"t":"cloze","kind":"definition","term":"Types of Expansion & Integration","ch":"ch7","text":"Horizontal: combining firms making the same product at the same stage. Lateral: different but related products at the same stage. Vertical: different stages of the same chain (backward = towards inputs; forward = towards the consumer). Conglomerate: totally unrelated businesses.","gaps":["Conglomerate","Horizontal","businesses"]},{"t":"cloze","kind":"rule","term":"Types of Expansion & Integration — the test","ch":"ch7","text":"Classify from the acquiring firm's viewpoint, then match motives: horizontal → market share, economies of scale, turning rivals into partners; backward vertical → steady input supply; forward vertical → guaranteed outlets and market information; lateral/conglomerate → diversification to spread risk, brand-name extension.","gaps":["diversification","conglomerate","information"]},{"t":"cloze","kind":"definition","term":"Profit Maximisation under Perfect Competition","ch":"ch6","text":"A price-taking firm maximises profit by producing every unit whose marginal cost is no more than the market price — output settles where MC = P (marginal cost of the last unit equals marginal revenue).","gaps":["price-taking","maximises","producing"]},{"t":"cloze","kind":"rule","term":"Profit Maximisation under Perfect Competition — the test","ch":"ch6","text":"Convert the given table (AC, TVC or TC) to total cost, difference it to get MC, then choose the largest output with MC ≤ P. Profit = P×Q − TC. Producer surplus = TR − TVC, which exceeds profit by exactly the fixed cost.","gaps":["difference","Producer","Convert"]},{"t":"cloze","kind":"rule","term":"Forms of Business Ownership — the test","ch":"ch3","text":"Identify a mystery firm with two tests — liability (unlimited → sole prop/partnership) and transfer of ownership (free → public ltd; consent → partnership or private ltd) — then break ties with legal entity/continuity (companies survive an owner's death or bankruptcy; partnerships dissolve).","gaps":["partnerships","partnership","continuity"]},{"t":"cloze","kind":"definition","term":"Shares vs Bonds (Debentures)","ch":"ch3","text":"A share is a unit of OWNERSHIP: variable dividends, voting rights, paid last on liquidation. A bond/debenture is a LOAN to the company: fixed interest owed regardless of profit, no voting rights, repaid before shareholders, and must be redeemed at maturity.","gaps":["shareholders","liquidation","regardless"]},{"t":"cloze","kind":"rule","term":"Shares vs Bonds (Debentures) — the test","ch":"ch3","text":"Frame every question by viewpoint. Company/existing owners issuing shares: no interest burden and no redemption obligation, but control diluted and takeover risk up. Issuing bonds: control preserved, but fixed interest must be paid even in loss years. Investor buying bonds: stabler return and priority repayment; buying shares: voting rights and price upside.","gaps":["redemption","obligation","viewpoint"]},{"t":"cloze","kind":"definition","term":"Private Goods vs Public Goods","ch":"ch3","text":"A public good is non-rival in consumption — one person's use does not reduce availability to others, so many can consume it concurrently (marginal cost of an extra user is zero). A private good is rival (and typically excludable).","gaps":["availability","concurrently","consumption"]},{"t":"cloze","kind":"rule","term":"Private Goods vs Public Goods — the test","ch":"ch3","text":"Apply the rivalry test to the good ITSELF, ignoring who provides it or whether it's free: can everyone consume it at the same time without diminishing anyone's consumption? Yes → public good; no → private good.","gaps":["diminishing","consumption","ignoring"]},{"t":"cloze","kind":"definition","term":"Demand & Supply: Shifts vs Movements","ch":"ch8","text":"Demand/supply are whole curves relating quantity to the good's own price. A change in the OWN price moves ALONG a curve (change in quantity demanded/supplied); a change in any non-price factor SHIFTS the curve (change in demand/supply).","gaps":["non-price","relating","quantity"]},{"t":"cloze","kind":"rule","term":"Demand & Supply: Shifts vs Movements — the test","ch":"ch8","text":"Diagnose events in two steps: (1) which curve does the event hit? (income, tastes, related goods, expectations, number of buyers → demand; input costs, technology, taxes/subsidies on production, number of sellers → supply); (2) read off P and Q. One shift: both directions certain. Two shifts: one variable certain, the other depends on which shift dominates.","gaps":["expectations","technology","production"]},{"t":"cloze","kind":"definition","term":"Relative Price & the Law of Demand","ch":"ch8","text":"The law of demand operates on RELATIVE prices: adding or removing the same absolute charge on two versions of a good changes their price ratio, and consumption shifts towards whichever became relatively cheaper.","gaps":["consumption","relatively","whichever"]},{"t":"cloze","kind":"rule","term":"Relative Price & the Law of Demand — the test","ch":"ch8","text":"Same per-unit charge added to both qualities → high-quality version becomes relatively cheaper → mix shifts towards quality ('shipping the good apples out'). Charge removed → mix shifts back towards the cheaper version. Percentage (ad valorem) charges leave relative prices — and the mix — unchanged. A fixed charge per trip/visit cuts trip frequency but raises quality/length per trip.","gaps":["high-quality","relatively","Percentage"]},{"t":"cloze","kind":"definition","term":"Price Elasticity of Demand & Supply","ch":"ch10","text":"Elasticity = percentage change in quantity ÷ percentage change in price along a given curve. E > 1 elastic, E < 1 inelastic, E = 1 unitary, E = 0 perfectly inelastic; arc elasticity uses midpoint averages for both changes.","gaps":["Elasticity","percentage","inelastic"]},{"t":"cloze","kind":"rule","term":"Price Elasticity of Demand & Supply — the test","ch":"ch10","text":"Workflow: identify which curve SHIFTED — the data measure the elasticity of the OTHER curve. Then apply the total-revenue test: price and TR moving the same way → inelastic; opposite ways → elastic; TR constant → unitary. From P-TR tables, recover Q = TR ÷ P before concluding.","gaps":["total-revenue","elasticity","concluding"]},{"t":"cloze","kind":"definition","term":"Shortage & Surplus","ch":"ch8","text":"Shortage (excess demand): quantity demanded exceeds quantity supplied at a price HELD BELOW equilibrium. Surplus (excess supply): quantity supplied exceeds quantity demanded at a price held ABOVE equilibrium. Both are disequilibria requiring a stuck price.","gaps":["disequilibria","equilibrium","requiring"]},{"t":"cloze","kind":"rule","term":"Shortage & Surplus — the test","ch":"ch8","text":"Quantity transacted always equals the SHORT side. At a fixed price, demand/supply shifts change the SIZE of the gap: demand up at a fixed low price → bigger shortage; supply up → smaller shortage. Raising a below-equilibrium price cuts the shortage and RAISES total revenue (quantity transacted rises along the supply curve).","gaps":["below-equilibrium","transacted","Quantity"]},{"t":"cloze","kind":"definition","term":"Functions of Price","ch":"ch8","text":"Rationing function: price determines WHO gets the existing quantity of a good — it goes to the highest-valued buyers. Allocative (signalling) function: price movements direct PRODUCTIVE RESOURCES into or out of industries.","gaps":["highest-valued","determines","Allocative"]},{"t":"cloze","kind":"rule","term":"Functions of Price — the test","ch":"ch8","text":"Ask what the price is doing in the scenario: dividing up a FIXED stock among competing buyers (resale markets, auctions, descending-price schemes) → rationing; attracting or repelling PRODUCTION (new factories, more flats built) → allocative.","gaps":["descending-price","attracting","PRODUCTION"]},{"t":"cloze","kind":"definition","term":"Types of Market Structure","ch":"ch12","text":"Four structures ranked by competitiveness: perfect competition (many sellers, homogeneous product, price-takers, free entry, perfect information); monopolistic competition (many sellers, differentiated products, price-searchers, free entry); oligopoly (a few dominant, interdependent sellers); monopoly (a single seller with no close substitutes).","gaps":["competitiveness","price-searchers","differentiated"]},{"t":"cloze","kind":"rule","term":"Types of Market Structure — the test","ch":"ch12","text":"Identify a market by two questions: how many sellers, and are products homogeneous or differentiated? Concentration data (a few firms holding most market share) signals oligopoly; many small differentiated sellers signal monopolistic competition. 'Not perfectly competitive' is proven by heterogeneous products, imperfect information, or non-price competition.","gaps":["differentiated","Concentration","heterogeneous"]},{"t":"cloze","kind":"definition","term":"Efficiency, Surplus & Deadweight Loss","ch":"ch13","text":"Economic efficiency is attained when marginal social benefit equals marginal social cost — equivalently, when total social surplus (consumer surplus + producer surplus) is maximised and no potential gains are left uncaptured. A deadweight loss is the total surplus lost when MB ≠ MC.","gaps":["equivalently","efficiency","uncaptured"]},{"t":"cloze","kind":"rule","term":"Efficiency, Surplus & Deadweight Loss — the test","ch":"ch13","text":"Any wedge between MB and MC creates a deadweight loss. Price ceilings, price floors, minimum wages, taxes, and binding quotas cut quantity below the efficient level (underproduction, MB > MC); subsidies push it above (overproduction, MC > MB). Non-binding controls change nothing. To judge a policy, compare MB and MC at the resulting quantity.","gaps":["underproduction","overproduction","Non-binding"]},{"t":"cloze","kind":"definition","term":"Externalities & Divergence of Private/Social Costs","ch":"ch13","text":"An externality is an uncompensated effect of one party's action on a third party. A negative externality (external cost) makes marginal social cost exceed marginal private cost; a positive externality (external benefit) makes marginal social benefit exceed marginal private benefit.","gaps":["uncompensated","externality","negative"]},{"t":"cloze","kind":"rule","term":"Externalities & Divergence of Private/Social Costs — the test","ch":"ch13","text":"External cost → overproduction/overuse (MSC > MSB at the market quantity) → correct by raising private cost (tax, charge, fine, carbon credit). External benefit → underproduction (MSB > MSC) → correct by a subsidy or a private payment to the actor. Diagnose by asking whether the spillover is a cost or a benefit, then read off the over/under direction.","gaps":["underproduction","overproduction","spillover"]},{"t":"cloze","kind":"definition","term":"Equity & the Measurement of Inequality","ch":"ch14","text":"Equity concerns the fairness of income distribution. The Lorenz curve plots the cumulative share of income against the cumulative share of households; the Gini coefficient (0 = perfect equality, 1 = perfect inequality) measures the area between the Lorenz curve and the 45° line.","gaps":["distribution","coefficient","cumulative"]},{"t":"cloze","kind":"rule","term":"Equity & the Measurement of Inequality — the test","ch":"ch14","text":"Closer to the 45° line / lower Gini = more even distribution. Redistributive policies work two ways: equalizing OUTCOME (cash transfers, subsidies-in-kind that raise the poor's income) and equalizing OPPORTUNITY (education/training subsidies that raise future earning power). Progressive taxes and targeted transfers pull the Lorenz curve towards the diagonal.","gaps":["subsidies-in-kind","Redistributive","distribution"]},{"t":"cloze","kind":"definition","term":"Price ceiling 價格上限 (maximum price)","ch":"ch11","text":"A legal MAXIMUM price sellers may charge. Effective (binding) only when set BELOW the equilibrium price.","gaps":["equilibrium","Effective","MAXIMUM"]},{"t":"cloze","kind":"rule","term":"Price ceiling 價格上限 (maximum price) — the test","ch":"ch11","text":"Binding ceiling → Qd > Qs → shortage. Quantity transacted = Qs at the ceiling (short-side rule). Raising a still-binding ceiling moves P and Q up together → total expenditure must rise.","gaps":["still-binding","expenditure","transacted"]},{"t":"cloze","kind":"definition","term":"Shortage 短缺, black market & non-price competition","ch":"ch11","text":"With price competition banned, the shortage is allocated by other criteria: queuing, rationing, connections — non-price competition (非價格競爭).","gaps":["competition","connections","allocated"]},{"t":"cloze","kind":"rule","term":"Shortage 短缺, black market & non-price competition — the test","ch":"ch11","text":"Maximum black-market price = buyers' willingness to pay at the reduced Qs (read off D). Sellers may also cut quality/maintenance since they can sell all output anyway.","gaps":["black-market","willingness","maintenance"]},{"t":"cloze","kind":"definition","term":"Price floor 價格下限 / minimum wage 最低工資","ch":"ch11","text":"A legal MINIMUM price. Effective only when set ABOVE the equilibrium price; then Qs > Qd → surplus, and quantity transacted = Qd.","gaps":["equilibrium","transacted","Effective"]},{"t":"cloze","kind":"rule","term":"Price floor 價格下限 / minimum wage 最低工資 — the test","ch":"ch11","text":"Raising an effective floor: P↑, Q(=Qd)↓ → TE/total wage earnings rise iff demand is INELASTIC. Employed workers' wage rises, but employment falls.","gaps":["employment","effective","INELASTIC"]},{"t":"cloze","kind":"definition","term":"Quota 配額 & the kinked supply curve","ch":"ch11","text":"A quantity limit on what sellers may sell/import. Effective only if set BELOW the equilibrium quantity. Supply becomes vertical (kinked) at the quota.","gaps":["equilibrium","Effective","quantity"]},{"t":"cloze","kind":"rule","term":"Quota 配額 & the kinked supply curve — the test","ch":"ch11","text":"Binding quota → P rises to the demand price at the quota; Q falls. TE change depends on Ed. Quota rent = (market price − supply price) × quota quantity.","gaps":["quantity","Binding","depends"]},{"t":"cloze","kind":"definition","term":"Per-unit tax 從量稅: the parallel shift","ch":"ch11","text":"A fixed $t collected per unit sold → supply shifts UP by exactly $t (sellers need $t more at every quantity).","gaps":["collected","quantity","exactly"]},{"t":"cloze","kind":"rule","term":"Per-unit tax 從量稅: the parallel shift — the test","ch":"ch11","text":"Schedule technique: new equilibrium is the price P where Qd(P) = Qs(P − t). Market price rises by LESS than t (except extreme elasticities).","gaps":["elasticities","equilibrium","technique"]},{"t":"cloze","kind":"definition","term":"Tax burden 稅負分擔 & relative elasticity","ch":"ch11","text":"Consumers' burden = (Pnew − Pold) × Qnew; sellers' burden = the rest of t × Qnew. The relatively LESS elastic side bears more.","gaps":["Consumers'","relatively","sellers'"]},{"t":"cloze","kind":"rule","term":"Tax burden 稅負分擔 & relative elasticity — the test","ch":"ch11","text":"Extremes: Ed=0 or Es=∞ → consumers bear all (price rises by full t). Ed=∞ or Es=0 → sellers bear all (price unchanged). Q unchanged iff a curve is vertical.","gaps":["consumers","unchanged","Extremes"]},{"t":"cloze","kind":"definition","term":"Tariff 關稅 = per-unit tax on imports","ch":"ch11","text":"A tariff/import surcharge works exactly like a per-unit tax in the import market: supply of imports shifts up by the tariff.","gaps":["surcharge","per-unit","exactly"]},{"t":"cloze","kind":"rule","term":"Tariff 關稅 = per-unit tax on imports — the test","ch":"ch11","text":"Importing-country price rises; import volume falls; expenditure on imports depends on Ed; net-of-tariff value = (P − t) × Q falls.","gaps":["Importing-country","net-of-tariff","expenditure"]},{"t":"cloze","kind":"definition","term":"Per-unit subsidy 從量補貼","ch":"ch11","text":"A fixed $s paid per unit produced → supply shifts DOWN by exactly $s. Price falls by LESS than s (except extremes); quantity rises.","gaps":["produced","extremes","quantity"]},{"t":"cloze","kind":"rule","term":"Per-unit subsidy 從量補貼 — the test","ch":"ch11","text":"Schedule technique: find P where Qd(P) = Qs(P + s). Consumers gain (Pold − Pnew) × Qnew; producers gain (Pnew + s − Pold) × Qnew; total = s × Qnew = government cost.","gaps":["government","technique","Consumers"]},{"t":"cloze","kind":"definition","term":"CS, PS & deadweight loss 無謂損失 under intervention","ch":"ch11","text":"Total social surplus (TSS) = CS + PS (+ government revenue / − subsidy cost) is maximised at the free-market equilibrium quantity.","gaps":["free-market","equilibrium","government"]},{"t":"cloze","kind":"rule","term":"CS, PS & deadweight loss 無謂損失 under intervention — the test","ch":"ch11","text":"Any binding intervention moves Q away from Qe → DWL. Ceiling: PS必跌, CS ambiguous. Floor: CS必跌, PS ambiguous. Tax: both fall, government gains, net DWL. Subsidy: CS and PS both RISE but taxpayers pay more than the gain → TSS falls.","gaps":["intervention","government","ambiguous"]},{"t":"cloze","kind":"definition","term":"Schedule technique 表格快解 (tax / subsidy / quota / controls)","ch":"ch11","text":"One method solves nearly every Unit 11 table question — shift the SCHEDULE, not the drawing.","gaps":["question","SCHEDULE","drawing"]},{"t":"cloze","kind":"rule","term":"Schedule technique 表格快解 (tax / subsidy / quota / controls) — the test","ch":"ch11","text":"Tax $t: find P where Qd(P)=Qs(P−t). Subsidy $s: Qd(P)=Qs(P+s). Quota: P = demand price at the quota. Ceiling/floor: quantity = SHORT side (min of Qd, Qs) at the controlled price.","gaps":["controlled","quantity","Subsidy"]},{"t":"cloze","kind":"definition","term":"Adam Smith's four canons (1776)","ch":"ch11","text":"The test of a good tax: Equity, Certainty, Convenience, Economy.","gaps":["Convenience","Certainty","Economy"]},{"t":"cloze","kind":"rule","term":"Adam Smith's four canons (1776) — the test","ch":"ch11","text":"Equity = tax by ability to pay; Certainty = liability is clear and not arbitrary; Convenience = easy to pay; Economy = collection cost small vs revenue.","gaps":["Convenience","collection","Certainty"]},{"t":"cloze","kind":"definition","term":"Direct vs indirect (tax incidence)","ch":"ch11","text":"The split is whether the tax burden can be SHIFTED to someone else.","gaps":["whether","SHIFTED","someone"]},{"t":"cloze","kind":"rule","term":"Direct vs indirect (tax incidence) — the test","ch":"ch11","text":"Direct (cannot shift): salaries, profits, property tax. Indirect (can shift): rates, stamp duty, duties, HAT, departure tax.","gaps":["departure","salaries","property"]},{"t":"cloze","kind":"definition","term":"Progressive / proportional / regressive","ch":"ch11","text":"Classify by how the AVERAGE tax rate moves as income rises: up = progressive, flat = proportional, down = regressive.","gaps":["proportional","progressive","regressive"]},{"t":"cloze","kind":"rule","term":"Progressive / proportional / regressive — the test","ch":"ch11","text":"Not the dollar amount paid — the share of income. Lump-sum and per-unit indirect taxes take a bigger share of a low income, so they are regressive.","gaps":["regressive","Lump-sum","per-unit"]},{"t":"cloze","kind":"definition","term":"Tax base, allowance & fiscal drag","ch":"ch11","text":"Base = what is taxed; allowance = the slice exempted; fiscal drag = inflation quietly raising real tax.","gaps":["allowance","inflation","exempted"]},{"t":"cloze","kind":"rule","term":"Tax base, allowance & fiscal drag — the test","ch":"ch11","text":"Inflation lifts nominal income while a fixed allowance stays put, so more people enter the net or move into higher bands → real tax burden and revenue rise.","gaps":["Inflation","allowance","nominal"]},{"t":"cloze","kind":"definition","term":"Source principle & what HK does NOT tax","ch":"ch11","text":"HK taxes only income arising IN Hong Kong (territorial source principle).","gaps":["territorial","principle","arising"]},{"t":"cloze","kind":"rule","term":"Source principle & what HK does NOT tax — the test","ch":"ch11","text":"Income earned abroad is outside the net; HK also levies no tax on several common items.","gaps":["outside","several","Income"]},{"t":"cloze","kind":"definition","term":"Tax rate ≠ tax revenue (Laffer)","ch":"ch11","text":"Changing the rate does not change revenue one-for-one, because the tax BASE reacts.","gaps":["one-for-one","Changing","revenue"]},{"t":"cloze","kind":"rule","term":"Tax rate ≠ tax revenue (Laffer) — the test","ch":"ch11","text":"A rate cut can spur work/investment and widen the base, offsetting the per-dollar loss; a rate rise can shrink the base.","gaps":["investment","offsetting","per-dollar"]},{"t":"cloze","kind":"definition","term":"Fiscal policy: G, T and the budget","ch":"ch11","text":"Government spending (G) and taxes (T); a deficit budget is expansionary, a surplus budget contractionary.","gaps":["contractionary","expansionary","Government"]},{"t":"cloze","kind":"rule","term":"Fiscal policy: G, T and the budget — the test","ch":"ch11","text":"↑G or ↓T raises AD; the budget is set in ESTIMATED terms and the actual outcome can differ. Even a balanced budget (G=T) is net expansionary.","gaps":["expansionary","ESTIMATED","balanced"]},{"t":"cloze","kind":"definition","term":"Monetary policy: base vs supply","ch":"ch11","text":"Three levers: required reserve ratio (RRR), discount rate, open-market operations (OMO).","gaps":["open-market","operations","required"]},{"t":"cloze","kind":"rule","term":"Monetary policy: base vs supply — the test","ch":"ch11","text":"OMO and the discount rate change the monetary BASE; the RRR changes the money SUPPLY via the multiplier. Buying bonds / cutting RRR / cutting the discount rate are expansionary.","gaps":["expansionary","multiplier","discount"]},{"t":"cloze","kind":"definition","term":"AD-AS, output gaps & transmission","ch":"ch11","text":"Policy works through a chain to price and output; gaps tell you which way to push.","gaps":["through","Policy","output"]},{"t":"cloze","kind":"rule","term":"AD-AS, output gaps & transmission — the test","ch":"ch11","text":"Chain: MS → interest → investment → AD → output/price (short run). Inflationary gap → contract; deflationary gap → expand.","gaps":["Inflationary","deflationary","investment"]},{"t":"cloze","kind":"definition","term":"🇭🇰 Linked exchange rate → no independent monetary policy","ch":"ch11","text":"Since 1983 the HK dollar is pegged to the US dollar under a currency board.","gaps":["currency","dollar","pegged"]},{"t":"cloze","kind":"rule","term":"🇭🇰 Linked exchange rate → no independent monetary policy — the test","ch":"ch11","text":"To hold the peg, HK interest rates track US rates — it gives up an independent monetary policy and leans on FISCAL policy instead.","gaps":["independent","interest","monetary"]},{"t":"cloze","kind":"definition","term":"Allocative efficiency","ch":"macro","text":"Resources are used to produce the mix of goods society values most — no reallocation can make someone better off without making another worse off (Pareto).","gaps":["reallocation","Resources","produce"]},{"t":"cloze","kind":"rule","term":"Allocative efficiency — the test","ch":"macro","text":"Achieved where marginal social benefit = marginal social cost, i.e. where total social surplus (CS+PS) is maximised.","gaps":["maximised","Achieved","marginal"]},{"t":"cloze","kind":"definition","term":"Externalities & the efficient output","ch":"macro","text":"A cost or benefit falling on a third party not reflected in the market price.","gaps":["reflected","benefit","falling"]},{"t":"cloze","kind":"rule","term":"Externalities & the efficient output — the test","ch":"macro","text":"Negative externality → MSC>MPC → market over-produces; positive externality → MSB>MPB → market under-produces. Efficient output is where MSB=MSC.","gaps":["under-produces","over-produces","externality"]},{"t":"cloze","kind":"definition","term":"Equity vs efficiency","ch":"macro","text":"Efficiency = size of the pie; equity = how fairly it is shared. They are different tests and can conflict.","gaps":["Efficiency","different","conflict"]},{"t":"cloze","kind":"rule","term":"Equity vs efficiency — the test","ch":"macro","text":"Horizontal equity: treat equals equally. Vertical equity: those with greater ability pay more. Redistribution (progressive tax, transfers) can improve equity but may blunt incentives.","gaps":["Redistribution","progressive","Horizontal"]},{"t":"cloze","kind":"definition","term":"The three tax structures","ch":"macro","text":"Progressive / proportional / regressive are defined by how the AVERAGE tax rate moves as income rises.","gaps":["proportional","Progressive","regressive"]},{"t":"cloze","kind":"rule","term":"The three tax structures — the test","ch":"macro","text":"Average rate rises → progressive; constant → proportional; falls → regressive. Judge by average rate, never by the absolute dollars paid.","gaps":["proportional","progressive","regressive"]},{"t":"cloze","kind":"definition","term":"The circular flow & three ways to measure GDP","ch":"macro","text":"Output = Income = Expenditure — three faces of the same flow.","gaps":["Expenditure","Output","Income"]},{"t":"cloze","kind":"rule","term":"The circular flow & three ways to measure GDP — the test","ch":"macro","text":"Expenditure: GDP = C + I + G + (X − M). Leakages (S, T, M) must equal injections (I, G, X) in equilibrium.","gaps":["Expenditure","equilibrium","injections"]},{"t":"cloze","kind":"definition","term":"GDP vs GNP/GNI","ch":"macro","text":"GDP = output produced within the geographic border; GNP/GNI = income earned by residents (factors) wherever located.","gaps":["geographic","residents","produced"]},{"t":"cloze","kind":"definition","term":"Real vs nominal GDP","ch":"macro","text":"Nominal uses current prices; real uses constant (base-year) prices, stripping out inflation.","gaps":["base-year","stripping","inflation"]},{"t":"cloze","kind":"rule","term":"Real vs nominal GDP — the test","ch":"macro","text":"Real = Nominal ÷ price index ×100. %ΔReal ≈ %ΔNominal − %Δprices. GDP deflator = Nominal/Real ×100.","gaps":["deflator","Nominal","prices"]},{"t":"cloze","kind":"definition","term":"AD–AS","ch":"macro","text":"AD = C+I+G+NX plotted against the price level; SRAS slopes up, LRAS is vertical at full-employment output.","gaps":["full-employment","vertical","plotted"]},{"t":"cloze","kind":"rule","term":"AD–AS — the test","ch":"macro","text":"A demand-side rise shifts AD right → higher P and Y in the short run. A supply shock shifts SRAS. Long run returns Y to potential.","gaps":["demand-side","potential","returns"]},{"t":"cloze","kind":"definition","term":"Functions & properties of money","ch":"macro","text":"Money is a medium of exchange, unit of account, store of value and standard of deferred payment.","gaps":["exchange","standard","deferred"]},{"t":"cloze","kind":"rule","term":"Functions & properties of money — the test","ch":"macro","text":"It solves barter's ‘double coincidence of wants’. Good money is durable, portable, divisible, homogeneous, recognisable, stable in value and limited in supply.","gaps":["recognisable","coincidence","homogeneous"]},{"t":"cloze","kind":"definition","term":"Liquidity ladder","ch":"macro","text":"Liquidity = how quickly and cheaply an asset converts to cash at short notice without loss.","gaps":["Liquidity","converts","quickly"]},{"t":"cloze","kind":"rule","term":"Liquidity ladder — the test","ch":"macro","text":"Cash/notes > demand deposits > savings > time deposits > bonds > shares > real estate.","gaps":["deposits","savings","demand"]},{"t":"cloze","kind":"definition","term":"Deposit creation & the multiplier","ch":"macro","text":"Banks create deposits by lending out excess reserves; the system multiplies an injection.","gaps":["multiplies","injection","deposits"]},{"t":"cloze","kind":"rule","term":"Deposit creation & the multiplier — the test","ch":"macro","text":"With required reserve ratio r and no cash leakage, maximum deposit multiplier = 1/r; ΔDeposits = excess reserve ÷ r.","gaps":["multiplier","required","Deposits"]},{"t":"cloze","kind":"definition","term":"Monetary base vs money supply","ch":"macro","text":"Monetary base (H) = currency held by public + banks' reserves. Money supply is the multiple built on it.","gaps":["Monetary","currency","reserves"]},{"t":"cloze","kind":"rule","term":"Monetary base vs money supply — the test","ch":"macro","text":"Money supply = money multiplier × H. HKMA under the Linked Rate expands/contracts H automatically to defend 7.80.","gaps":["automatically","multiplier","contracts"]},{"t":"cloze","kind":"definition","term":"Money-market equilibrium & QTM","ch":"macro","text":"The interest rate is set where money demand (liquidity preference) meets a given money supply.","gaps":["preference","liquidity","interest"]},{"t":"cloze","kind":"rule","term":"Money-market equilibrium & QTM — the test","ch":"macro","text":"Md rises with income and falls with the interest rate. Quantity theory: MV = PY; if V and Y are fixed, ΔM feeds straight into ΔP.","gaps":["interest","Quantity","straight"]},{"t":"cloze","kind":"definition","term":"The business cycle","ch":"macro","text":"Recurring swings of real GDP around trend: expansion → peak → recession → trough.","gaps":["Recurring","expansion","recession"]},{"t":"cloze","kind":"rule","term":"The business cycle — the test","ch":"macro","text":"Two consecutive quarters of falling real GDP = recession. Turning points are peak (top) and trough (bottom).","gaps":["consecutive","recession","quarters"]},{"t":"cloze","kind":"definition","term":"Inflation, deflation & real values","ch":"macro","text":"Inflation = sustained rise in the general price level; deflation = sustained fall.","gaps":["Inflation","sustained","deflation"]},{"t":"cloze","kind":"rule","term":"Inflation, deflation & real values — the test","ch":"macro","text":"It redistributes from lenders/fixed-income to borrowers, erodes the real value of money, and creates menu/shoe-leather costs.","gaps":["redistributes","fixed-income","shoe-leather"]},{"t":"cloze","kind":"definition","term":"Nominal vs real interest rate","ch":"macro","text":"Nominal is the quoted money return; real is the purchasing-power return.","gaps":["purchasing-power","Nominal","quoted"]},{"t":"cloze","kind":"rule","term":"Nominal vs real interest rate — the test","ch":"macro","text":"Real ≈ nominal − expected inflation. A negative real rate means money in the bank loses purchasing power.","gaps":["purchasing","inflation","expected"]},{"t":"cloze","kind":"definition","term":"Types of unemployment","ch":"macro","text":"Frictional (between jobs), structural (skills/industry mismatch), cyclical (deficient demand), seasonal.","gaps":["Frictional","structural","deficient"]},{"t":"cloze","kind":"rule","term":"Types of unemployment — the test","ch":"macro","text":"Unemployment rate = unemployed ÷ labour force ×100. Labour force = employed + unemployed (excludes those not seeking work).","gaps":["Unemployment","unemployed","employed"]},{"t":"cloze","kind":"definition","term":"Comparative advantage","ch":"macro","text":"A country gains by specialising in the good with the lower OPPORTUNITY cost, even if it is worse at everything (no absolute advantage needed).","gaps":["specialising","OPPORTUNITY","everything"]},{"t":"cloze","kind":"rule","term":"Comparative advantage — the test","ch":"macro","text":"Compare opportunity costs (units of the other good given up). Mutually beneficial terms of trade lie between the two countries' opportunity-cost ratios.","gaps":["opportunity-cost","opportunity","beneficial"]},{"t":"cloze","kind":"definition","term":"Trade barriers","ch":"macro","text":"Tariffs (tax on imports), quotas (quantity limit), and other restrictions raise domestic price and cut trade.","gaps":["restrictions","quantity","domestic"]},{"t":"cloze","kind":"rule","term":"Trade barriers — the test","ch":"macro","text":"A tariff earns government revenue; a quota's scarcity gain (‘quota rent’) goes to whoever holds the licence. Both create deadweight loss.","gaps":["government","deadweight","scarcity"]},{"t":"cloze","kind":"definition","term":"Balance of payments","ch":"macro","text":"A record of all transactions between residents and the rest of the world: current account + capital & financial account.","gaps":["transactions","residents","financial"]},{"t":"cloze","kind":"rule","term":"Balance of payments — the test","ch":"macro","text":"Exports/income received are credits (+); imports/income paid are debits (−). A current-account deficit is financed by a financial-account surplus.","gaps":["financial-account","current-account","received"]},{"t":"cloze","kind":"definition","term":"Exchange rate & the Linked Rate","ch":"macro","text":"The price of one currency in terms of another; HK links the HKD to the USD at about 7.80.","gaps":["currency","another","price"]},{"t":"cloze","kind":"rule","term":"Exchange rate & the Linked Rate — the test","ch":"macro","text":"More demand for a currency (exports, capital inflow) appreciates it. Under the Link, arbitrage + HKMA convertibility undertakings hold HKD near 7.75–7.85.","gaps":["convertibility","undertakings","appreciates"]},{"t":"cloze","kind":"definition","term":"The opportunity cost of a choice","ch":"ch1","text":"The opportunity cost of a choice is the value of the single best alternative that must be given up to make that choice — not the sum of all alternatives, and never a sunk cost.","gaps":["alternatives","opportunity","alternative"]},{"t":"cloze","kind":"definition","term":"An economic (scarce) good","ch":"ch1","text":"An economic (scarce) good is one where, at a zero price, people want more of it than is available — it commands a positive price to ration it.","gaps":["available","economic","commands"]},{"t":"cloze","kind":"definition","term":"A free good","ch":"ch1","text":"A free good is so abundant relative to want that nobody is willing to pay anything for an extra unit.","gaps":["abundant","relative","anything"]},{"t":"cloze","kind":"definition","term":"A positive statement","ch":"ch1","text":"A positive statement is a claim about facts that CAN be tested and potentially refuted by evidence — regardless of whether it later turns out true or false.","gaps":["potentially","regardless","statement"]},{"t":"cloze","kind":"definition","term":"Private property rights","ch":"ch2","text":"Private property rights are the exclusive rights to (1) USE an asset, (2) receive INCOME from it, and (3) TRANSFER (sell/lease/give) it to someone else.","gaps":["exclusive","property","TRANSFER"]},{"t":"cloze","kind":"definition","term":"Division of labour","ch":"ch4","text":"Division of labour means breaking a production process into narrow, specialized tasks assigned to different workers, rather than each worker doing the whole job.","gaps":["specialized","production","different"]},{"t":"cloze","kind":"definition","term":"Geographical mobility","ch":"ch5","text":"Geographical mobility is how easily a worker can move location for work.","gaps":["Geographical","mobility","location"]},{"t":"cloze","kind":"definition","term":"Occupational mobility","ch":"ch5","text":"Occupational mobility is how easily a worker can switch profession/trade.","gaps":["Occupational","profession","mobility"]},{"t":"cloze","kind":"definition","term":"Labour supply","ch":"ch5","text":"Labour supply is the total quantity of labour (workers × hours, or total labour-hours) offered to the market.","gaps":["labour-hours","quantity","workers"]},{"t":"cloze","kind":"definition","term":"Capital (producer) goods","ch":"ch4","text":"Capital (producer) goods are used by firms as inputs to produce other goods and services.","gaps":["producer","services","Capital"]},{"t":"cloze","kind":"definition","term":"The short run","ch":"ch6","text":"The short run is the period in which at least one factor of production is fixed (with technology constant); in the long run all factors are variable.","gaps":["production","technology","constant"]},{"t":"cloze","kind":"definition","term":"A share","ch":"ch3","text":"A share is a unit of OWNERSHIP: variable dividends, voting rights, paid last on liquidation.","gaps":["liquidation","OWNERSHIP","dividends"]},{"t":"cloze","kind":"definition","term":"A bond/debenture","ch":"ch3","text":"A bond/debenture is a LOAN to the company: fixed interest owed regardless of profit, no voting rights, repaid before shareholders, and must be redeemed at maturity.","gaps":["shareholders","regardless","debenture"]},{"t":"cloze","kind":"definition","term":"A public good","ch":"ch3","text":"A public good is non-rival in consumption — one person's use does not reduce availability to others, so many can consume it concurrently (marginal cost of an extra user is zero).","gaps":["availability","concurrently","consumption"]},{"t":"cloze","kind":"definition","term":"A private good","ch":"ch3","text":"A private good is rival (and typically excludable).","gaps":["excludable","typically","private"]},{"t":"cloze","kind":"definition","term":"Ask what the price","ch":"ch8","text":"Ask what the price is doing in the scenario: dividing up a FIXED stock among competing buyers (resale markets, auctions, descending-price schemes) → rationing; attracting or repelling PRODUCTION (new factories, more flats built) → allocative.","gaps":["descending-price","attracting","PRODUCTION"]},{"t":"cloze","kind":"definition","term":"Economic efficiency","ch":"ch13","text":"Economic efficiency is attained when marginal social benefit equals marginal social cost — equivalently, when total social surplus (consumer surplus + producer surplus) is maximised and no potential gains are left uncaptured.","gaps":["equivalently","efficiency","uncaptured"]},{"t":"cloze","kind":"definition","term":"A deadweight loss","ch":"ch13","text":"A deadweight loss is the total surplus lost when MB ≠ MC.","gaps":["deadweight","surplus","total"]},{"t":"cloze","kind":"definition","term":"An externality","ch":"ch13","text":"An externality is an uncompensated effect of one party's action on a third party.","gaps":["uncompensated","externality","party's"]},{"t":"cloze","kind":"definition","term":"Diagnose by asking whether the spillover","ch":"ch13","text":"Diagnose by asking whether the spillover is a cost or a benefit, then read off the over/under direction.","gaps":["spillover","direction","Diagnose"]},{"t":"cloze","kind":"definition","term":"With price competition banned, the shortage","ch":"ch11","text":"With price competition banned, the shortage is allocated by other criteria: queuing, rationing, connections — non-price competition (非價格競爭).","gaps":["competition","connections","allocated"]},{"t":"cloze","kind":"definition","term":"Q unchanged iff a curve","ch":"ch11","text":"Q unchanged iff a curve is vertical.","gaps":["unchanged","vertical","curve"]},{"t":"cloze","kind":"definition","term":"The split","ch":"ch11","text":"The split is whether the tax burden can be SHIFTED to someone else.","gaps":["whether","SHIFTED","someone"]},{"t":"cloze","kind":"definition","term":"Income earned abroad","ch":"ch11","text":"Income earned abroad is outside the net; HK also levies no tax on several common items.","gaps":["outside","several","Income"]},{"t":"cloze","kind":"definition","term":"Efficient output","ch":"macro","text":"Efficient output is where MSB=MSC.","gaps":["Efficient","output"]},{"t":"cloze","kind":"definition","term":"Good money","ch":"macro","text":"Good money is durable, portable, divisible, homogeneous, recognisable, stable in value and limited in supply.","gaps":["recognisable","homogeneous","divisible"]},{"t":"cloze","kind":"definition","term":"Money supply","ch":"macro","text":"Money supply is the multiple built on it.","gaps":["multiple","supply","Money"]},{"t":"cloze","kind":"definition","term":"The interest rate","ch":"macro","text":"The interest rate is set where money demand (liquidity preference) meets a given money supply.","gaps":["preference","liquidity","interest"]},{"t":"cloze","kind":"definition","term":"Turning points","ch":"macro","text":"Turning points are peak (top) and trough (bottom).","gaps":["Turning","points","trough"]},{"t":"cloze","kind":"definition","term":"A negative real rate","ch":"macro","text":"A negative real rate means money in the bank loses purchasing power.","gaps":["purchasing","negative","means"]},{"t":"cloze","kind":"definition","term":"Exports/income received","ch":"macro","text":"Exports/income received are credits (+); imports/income paid are debits (−).","gaps":["received","Exports","credits"]},{"t":"cloze","kind":"definition","term":"A current-account deficit","ch":"macro","text":"A current-account deficit is financed by a financial-account surplus.","gaps":["financial-account","current-account","financed"]}],"scaffold":[{"id":"DSEPP/P2/Q1","q":"Peter borrowed a book from Mary and promised to return it with a bookmark a month later at her request. Explain why the bookmark could be regarded as \"interest\" to both Peter and Mary.","marks":4,"cmd":"Explain","ch":"ch1","points":[["To Peter: the bookmark is the price/cost he paid for the
