 earlier availability of the book",2],["To Mary: the bookmark is the premium/compensation she received for deferring consumption",2]]},{"id":"DSE2023/P2/Q2(b)","q":"A postal company introduces a smart chatbot that answers common customer questions, freeing staff for complex queries. Which of the three basic economic problems is this decision related to? Explain.","marks":2,"cmd":"Explain","ch":"ch2","points":[["Identify: 'How to produce'",1],["Explain: replacing labour with capital changes the production method/combination of factor inputs",1]]},{"id":"DSE2013/P2/Q2(a)","q":"The HK government plans an \"Hong Kong Property for Hong Kong Residents\" policy — flats can only be sold to HK permanent residents within 30 years. What are private property rights? Explain why the private property rights over the flats may be weakened under this policy.","marks":4,"cmd":"Define & Explain","ch":"ch2","points":[["Define: private property rights = the exclusive right to use, the exclusive right to receive income from, and the right to transfer a property owned by an individual",2],["Apply: the right to transfer/sell the flats is confined to HK permanent residents only, weakening the flat-owners' right to transfer",2]]},{"id":"CE1994/P1/Q1","q":"The Kowloon-Canton Railway Corporation provides a free shuttle-bus service at some train stations. Explain whether this service is a 'free good' to society or not.","marks":4,"cmd":"Explain","ch":"ch1","points":[["Conclusion: Not a free good",1],["Resources used in providing the bus service have alternative uses / there is a real cost of provision",2],["More of the bus service is preferred to less (positive marginal benefit)",1]]},{"id":"CE2000/P1/Q1","q":"Statement 1: Ice is a free good. Statement 2: Ice is an economic good. Explain one situation in which statement 1 is correct and another situation in which statement 2 is correct.","marks":4,"cmd":"Explain","ch":"ch1","points":[["Free-good situation: e.g. polar ice-fields — quantity available is sufficient to satisfy all wants for it, no sacrifice of resources involved",2],["Economic-good situation: e.g. ice cubes in a drink — quantity available is insufficient to satisfy all wants, a cost must be paid to obtain it",2]]},{"id":"CE2002/P1/Q1","q":"Some job vacancies publications are distributed free of charge in MTR stations. Explain whether these publications are free goods to society.","marks":3,"cmd":"Explain","ch":"ch1","points":[["Conclusion: Not free goods",1],["The resources used to produce them have alternative uses / there is a real cost to society of producing them / quantity available is insufficient to satisfy all wants for them",2]]},{"id":"CE2004/P1/Q1","q":"Hong Kong citizens could use public swimming pools free of charge on Sundays in July 2003. Explain whether the above service was a free good to society.","marks":3,"cmd":"Explain","ch":"ch1","points":[["Conclusion: No, not a free good",1],["Its quantity available is insufficient to satisfy wants / more of it is preferred, OR resources used had alternative uses / there is opportunity cost of provision (any one)",2]]},{"id":"DSE2012/P2/Q1","q":"A good which is free-of-charge is a free good. Do you agree? Explain.","marks":3,"cmd":"Explain (agree/disagree)","ch":"ch1","points":[["Disagree",1],["The good may be produced from scarce resources with alternative uses / more of it may still be preferred",2]]},{"id":"DSE2015/P2/Q1(a)(i)","q":"Most teaching materials in MOOC courses can be accessed online free of charge. Explain whether these materials are free goods.","marks":2,"cmd":"Explain","ch":"ch1","points":[["No, not a free good",1],["It has positive marginal cost of production / it is produced from scarce resources with alternative uses",1]]},{"id":"DSE2020/P2/Q1","q":"A free good must be free of charge. Do you agree? Explain your answer.","marks":3,"cmd":"Explain (agree/disagree)","ch":"ch1","points":[["Agree",1],["More of a free good is not preferred — nobody is willing to pay a price / give up resources to get more of it, so it must be free of charge",2]]},{"id":"DSE2023/P2/Q1(c)","q":"Some economists share their economic analyses on social media free of charge. Explain whether these economic analyses are free goods to society.","marks":2,"cmd":"Explain","ch":"ch1","points":[["No, not a free good",1],["The resources involved in writing these analyses have alternative uses, OR more of these analyses is preferred by some people",1]]},{"id":"CE1990/P1/Q5(c)(i)","q":"The government announced a $127 billion project for a new airport and harbour improvements. An economist argues that the cost of this project to society is higher than $127 billion. Give TWO reasons to support his argument.","marks":4,"cmd":"Give reasons","ch":"ch1","points":[["Reason 1: any valid unlisted cost — e.g. pollution from construction / loss to affected individuals / lost countryside view / higher factor costs elsewhere / sacrificed alternative projects",2],["Reason 2: a second, distinct valid unlisted cost from the same list",2]]},{"id":"CE2005/P1/Q9(b)(ii)","q":"The Western Harbour Crossing has no traffic congestion problem; in July 2004 its tolls increased. Explain how an increase in traffic congestion in the Cross Harbour Tunnel would affect the opportunity cost to its users of crossing the harbour.","marks":2,"cmd":"Explain","ch":"ch1","points":[["The opportunity cost increases",1],["More time (which has alternative uses) is spent in congestion, raising time cost / fuel cost also rises",1]]},{"id":"CE2005/P1/Q9(c)","q":"Explain whether the opportunity cost of crossing the harbour would definitely be the same to every user of the Cross Harbour Tunnel when there is traffic congestion.","marks":3,"cmd":"Explain","ch":"ch1","points":[["No, not necessarily the same",1],["The highest-valued alternative use of time may differ across different tunnel users",2]]},{"id":"CE2009/P1/Q1(b)","q":"\"Mary's opportunity cost of purchasing the Olympic memorial banknote would be the same as John's.\" Explain whether this statement is definitely correct.","marks":2,"cmd":"Explain","ch":"ch1","points":[["No, not definitely correct",1],["Their alternative use of the queuing time may not be the same",1]]},{"id":"DSE2013/P2/Q9(c)","q":"Passengers queue to redeem free MTR tickets under a promotion. Suppose the waiting time is the same for all, is the cost of redeeming the free tickets necessarily the same to these passengers? Explain.","marks":3,"cmd":"Explain","ch":"ch1","points":[["No, not necessarily the same",1],["People have different alternative uses of time, so their time costs differ even with equal waiting time",2]]},{"id":"CE1993/P1/Q5(a)","q":"Mr Chan owns a flat in Mongkok. His order of preference: 1st live in it, 2nd rent it out, 3rd leave it vacant. In terms of opportunity cost, explain whether the costs of the second and third choices are the same for Mr Chan.","marks":4,"cmd":"Explain","ch":"ch1","points":[["The cost of the second choice (renting it out) is giving up the first choice (living in it)",2],["The cost of the third choice (leaving it vacant) is ALSO giving up the first choice — both share the same highest-valued option forgone, so the costs are equal",2]]},{"id":"CE1998/P1/Q1(b)","q":"Suppose the business stream is now not offered in David's school. Explain how David's opportunity cost of choosing the Arts stream would change.","marks":3,"cmd":"Explain","ch":"ch1","points":[["With business stream unavailable, the next-best alternative becomes the (less preferred) science stream instead of business",2],["Since science is valued lower than business, the opportunity cost of choosing Arts falls",1]]},{"id":"CE2006/P1/Q2(a)","q":"Steven is choosing between studying law or medicine at a university. Explain whether his cost of choosing to study law would be affected if the expected salary of jobs in the legal services sector falls.","marks":2,"cmd":"Explain","ch":"ch1","points":[["Not affected",1],["A lower legal-sector salary only changes the value of the CHOSEN option (law), not the value of the forgone alternative (medicine), which is what defines the opportunity cost",1]]},{"id":"CE2006/P1/Q2(b)","q":"Explain whether Steven's cost of choosing to study law would be affected if the expected salary of jobs in the medical services sector falls.","marks":2,"cmd":"Explain","ch":"ch1","points":[["Affected — the opportunity cost decreases",1],["Because the value of the forgone alternative (studying medicine) itself falls",1]]},{"id":"DSE2014/P2/Q1(a)","q":"Serine, a graduate seeking a job, prefers: 1st government admin officer, 2nd accounting trainee, 3rd keep seeking. Analyse whether her opportunity cost of choosing to work as an administrative officer will necessarily remain unchanged if the government reduces the starting salary of administrative officers.","marks":2,"cmd":"Analyse","ch":"ch1","points":[["Yes, unchanged",1],["The salary cut only lowers the value of her CHOSEN option (admin officer), not the value of her forgone alternative (accounting trainee)",1]]},{"id":"DSE2014/P2/Q1(b)","q":"Analyse whether Serine's opportunity cost of choosing to work as an administrative officer will necessarily remain unchanged if the government provides unemployment benefits for all graduates seeking jobs.","marks":3,"cmd":"Analyse","ch":"ch1","points":[["No, not necessarily unchanged",1],["Unemployment benefits could raise the value of her 3rd-ranked option (continuing to seek a job) above her 2nd option, making it the new best forgone alternative and thus changing her opportunity cost",2]]},{"id":"DSE2017/P2/Q1(a)","q":"Serine prefers: 1st work in South Korea, 2nd switch to a local firm without overtime, 3rd stay at current firm. Explain whether the opportunity cost of switching to the local firm will necessarily remain unchanged if the military threat from North Korea to South Korea becomes more intense.","marks":2,"cmd":"Explain","ch":"ch1","points":[["No, not unchanged",1],["The value of her highest-valued forgone option (working in South Korea) falls as the military threat rises, lowering her opportunity cost of switching to the local firm",1]]},{"id":"DSE2017/P2/Q1(b)","q":"Explain whether the opportunity cost of switching to the local firm will necessarily remain unchanged if she wants to enjoy more leisure time.","marks":3,"cmd":"Explain","ch":"ch1","points":[["No, not unchanged",1],["If working hours in South Korea are long, wanting more leisure could make that option less preferred, potentially changing which option is her highest-valued forgone alternative",2]]},{"id":"DSE2024/P2/Q12(c)","q":"Ahmed, unemployed, prefers: 1st Football Academy A, 2nd Football Academy B, 3rd continue seeking jobs. Suppose Academy B offers him a scholarship. Explain whether the opportunity cost for Ahmed to continue seeking jobs would necessarily remain unchanged.","marks":3,"cmd":"Explain","ch":"ch1","points":[["No, not necessarily unchanged",1],["The scholarship raises the value of his 2nd-ranked option (Academy B)",1],["If Academy B's value now exceeds Academy A's, it becomes his new best forgone alternative, changing (raising) the opportunity cost of continuing to seek jobs",1]]},{"id":"CE2007/P1/Q10(c)(i)","q":"During a typhoon, departing passengers at the airport were delayed 24 hours on average. Explain whether their opportunity cost of that visit to Hong Kong would have changed as a result of the delay.","marks":2,"cmd":"Explain","ch":"ch1","points":[["Yes, changed (increased)",1],["Their time cost of the visit rises because of the extra 24 hours delayed",1]]},{"id":"CE2007/P1/Q10(c)(ii)","q":"During the 24-hour delay, passengers were either waiting in the airport or had free hotel accommodation arranged. Explain whether your previous answer depends on which situation they were in.","marks":2,"cmd":"Explain","ch":"ch1","points":[["No, doesn't depend on which situation",1],["Either way their forgone alternative use of that 24 hours is unaffected — free hotel accommodation only changes the VALUE of staying longer, not the time cost itself",1]]},{"id":"CE2004/P1/Q2(b)","q":"Explain whether Mr Chan's and Mr Lee's opportunity cost of being a teacher would definitely be the same.","marks":2,"cmd":"Explain","ch":"ch1","points":[["Not necessarily the same",1],["Their highest-valued option forgone may differ — e.g. they may be giving up different alternative jobs",1]]},{"id":"CE2004/P1/Q2(c)","q":"Explain whether the opportunity cost of quitting their jobs as teachers would definitely be the same.","marks":3,"cmd":"Explain","ch":"ch1","points":[["Not necessarily the same",1],["Although the salary forgone ($30,000) is equal, their non-pecuniary returns (job satisfaction etc.) and other monetary returns from teaching may differ, so their full opportunity cost may differ",2]]},{"id":"DSE2015/P2/Q1(b)","q":"If MOOC and on-campus courses have the same content and teaching hours, will the cost for a person to take a free MOOC be necessarily lower than the cost for another person to take a paid on-campus course? Explain.","marks":3,"cmd":"Explain","ch":"ch1","points":[["No, not necessarily lower",1],["The MOOC student's time cost (or added time for downloading materials, communicating online, or paying for internet access) could exceed the on-campus student's time cost plus course fee combined",2]]},{"id":"DSE2016/P2/Q1","q":"Some people spend hours trying to login a website to buy a new smartphone model. If the resale value of the new model falls, the opportunity cost of buying it through the website will decrease. Do you agree? Explain.","marks":3,"cmd":"Explain (agree/disagree)","ch":"ch1","points":[["Disagree (or agree, with correct reasoning) — full cost = monetary price + time cost of logging in",1],["Either: resale value isn't itself a forgone option so cost is unaffected by it directly; OR a falling resale value lowers speculative demand, reducing the queuing/login time cost and thus lowering the full cost",2]]},{"id":"DSE2019/P2/Q1(a)","q":"A country considers acquiring more land by reclamation for residential flats. Explain whether the opportunity cost of land reclamation will change if the maximum building height on the reclaimed land is limited to two storeys.","marks":2,"cmd":"Explain","ch":"ch1","points":[["Opportunity cost remains unchanged",1],["The height limit only lowers the value of the CHOSEN option (reclaimed land use), not the value of the highest-valued forgone alternative",1]]},{"id":"DSE2019/P2/Q1(b)","q":"Explain whether the opportunity cost of land reclamation will change if there is a shortage of the materials for land reclamation.","marks":3,"cmd":"Explain","ch":"ch1","points":[["The opportunity cost/full cost will increase",1],["A shortage forces the government to spend extra money/resources competing for scarce materials, raising the monetary and non-monetary cost",2]]},{"id":"DSE2018/P2/Q1","q":"Air ticket fares and hotel rates are usually higher during holiday periods, yet many people still travel abroad. Explain, in terms of opportunity cost, why it is not necessarily more expensive to travel abroad during holiday periods than non-holiday periods.","marks":3,"cmd":"Explain","ch":"ch1","points":[["Full cost = monetary cost + time cost, not monetary cost alone",1],["During holidays, the time cost (e.g. income forgone) is often much lower even though monetary cost is higher",1],["If the time cost saved outweighs the extra monetary cost, the full cost during holidays can end up lower",1]]},{"id":"DSE2023/P2/Q11(c)","q":"A housewife queued 10 hours at the official ticketing office instead of buying from touts at a higher price. Explain, in terms of opportunity cost, why she chose to buy at the official ticketing office.","marks":3,"cmd":"Explain","ch":"ch1","points":[["Full cost = time cost + money cost",1],["Her time cost of queuing (value of her best alternative use of that time) was smaller than the extra money cost of buying from touts",2]]},{"id":"DSE2025/P2/Q9(e)","q":"Many hotels in Hong Kong charge a higher room rate during public holidays than on other days. Explain whether the opportunity cost of staying in those hotels is necessarily higher during public holidays than on other days.","marks":3,"cmd":"Explain","ch":"ch1","points":[["No, not necessarily higher",1],["Some people have a lower time cost (e.g. no work) during public holidays",1],["If the time-cost saving exceeds the extra room-rate cost, the full opportunity cost is actually lower during holidays",1]]},{"id":"CE1995/P1/Q11(b)","q":"Mr Ip owns a property agency and hires Mary as a clerk of his firm. Distinguish between the economic roles played by Mr Ip and Mary. Explain your answer.","marks":4,"cmd":"Distinguish & Explain","ch":"ch5","points":[["Mr Ip is an entrepreneur but Mary is not",2],["Mr Ip has to bear the risk of the business/formulate policies, but Mary does not",2]]},{"id":"CE1997/P1/Q1","q":"Peter owns a plot of land for farming in the New Territories. He hires workers to work together with him on his farm. To what TYPES of factors of production does Peter belong? Explain your answer.","marks":4,"cmd":"Explain","ch":"ch5","points":[["Entrepreneurship: he bears risk / makes decisions",2],["Labour: he provides human effort in production (working alongside his hired workers)",2]]},{"id":"CE2004/P1/Q9(e)","q":"Hong Kong is facing a huge fiscal deficit and deflation. Explain which type of factors of production the cars displayed in the showrooms belong to.","marks":2,"cmd":"Explain","ch":"ch5","points":[["Capital",1],["Because those cars are man-made resources used for production",1]]},{"id":"CE2005/P1/Q2","q":"Ka Ming is the owner of an air-conditioner repair company. He also repairs air-conditioners for his customers. To what types of factors of production does Ka Ming belong? Explain.","marks":4,"cmd":"Explain","ch":"ch5","points":[["Entrepreneurship: he bears risks / makes decisions",2],["Labour: he provides human effort in production",2]]},{"id":"DSE2023/P2/Q2(a)","q":"A postal company has decided to introduce its first digital employee, a smart chatbot. The chatbot can answer commonly asked questions from customers, freeing up the customer services team to solve more complex queries. Explain to which type of factor of production the chatbot belongs.","marks":2,"cmd":"Explain","ch":"ch5","points":[["Capital",1],["It is a man-made resource used in production",1]]},{"id":"CE2001/P1/Q1","q":"Give THREE reasons why division of labour can increase labour productivity.","marks":3,"cmd":"Give reasons","ch":"ch4","points":[["Reason 1 (any one): stimulus to mechanization, practice makes perfect, saves time learning the job, saves time moving around jobs, or choosing the best person for the job",1],["Reason 2 (a second, distinct reason)",1],["Reason 3 (a third, distinct reason)",1]]},{"id":"CE2003/P1/Q10(a)","q":"In the production of textbooks, different people perform different duties — editors, typists, proofreaders, etc. What economic principle is illustrated by this practice? Suggest THREE reasons why the application of this principle can increase labour productivity.","marks":4,"cmd":"Identify & suggest reasons","ch":"ch4","points":[["Identify: division of labour",1],["Reason 1 (any one): choosing the most suitable person for the job, practice makes perfect/learning by doing, saving time from training, saving time from moving around tasks, or stimulus to mechanization",1],["Reason 2 (a second, distinct reason)",1],["Reason 3 (a third, distinct reason)",1]]},{"id":"DSEPP/P2/Q11(a)","q":"The prices of textbooks for senior secondary education have increased sharply because textbook publishers have to publish new textbooks for the new curriculum. The production of textbooks involves various experts, including authors, editors, graphic designers, etc. What economic principle is illustrated? Give THREE reasons to explain why this principle can raise labour productivity.","marks":4,"cmd":"Identify & explain","ch":"ch4","points":[["Identify: Division of labour / Specialisation",1],["Reason 1 (any one): practice makes perfect, choosing the most suitable person for the job, saving time in training, or saving time in job rotation",1],["Reason 2 (a second, distinct reason)",1],["Reason 3 (a third, distinct reason)",1]]},{"id":"DSE2013/P2/Q10(a)","q":"There are cooks, waiters, managers and receptionists working in restaurants. What economic principle is illustrated by the above phenomenon? List THREE reasons why the principle can increase labour productivity.","marks":4,"cmd":"Identify & list reasons","ch":"ch4","points":[["Identify: Division of labour",1],["Reason 1 (any one): choosing the most suitable person for the job, practice makes perfect, saving time in training, or stimulus to mechanisation",1],["Reason 2 (a second, distinct reason)",1],["Reason 3 (a third, distinct reason)",1]]},{"id":"DSE2016/P2/Q13(a)","q":"The airport corporation of Country H is a public corporation which hires different people to operate the airport — security guards, technicians, engineers and financial managers. What economic principle is illustrated by this practice? Suggest THREE reasons why the application of this principle can increase labour productivity.","marks":4,"cmd":"Identify & suggest reasons","ch":"ch4","points":[["Identify: Division of labour/specialization",1],["Reason 1 (any one): practice makes perfect, choosing the most suitable person for the job, saving time in training, or stimulus to mechanisation",1],["Reason 2 (a second, distinct reason)",1],["Reason 3 (a third, distinct reason)",1]]},{"id":"DSE2019/P2/Q5(a)","q":"Wong's family and Chan's family live next door to each other. Mr Wong teaches the children from both families English while Mrs Chan teaches them Japanese. State ONE economic concept involved and explain why the arrangement is beneficial to both families.","marks":3,"cmd":"State & explain","ch":"ch4","points":[["Identify: Division of labour / (Principle of) comparative advantage",1],["Explain the benefit: each parent specializes in teaching the subject where their opportunity cost is lower, then the children effectively 'exchange' lessons — both families' children learn both languages better at a lowe",2]]},{"id":"DSE2022/P2/Q10(c)","q":"The Olympic Games attract billions of international television viewers to watch the competitions among thousands of top athletes. Which economic principle is illustrated in the above practice? State TWO reasons why such a practice can increase labour productivity.","marks":3,"cmd":"Identify & state reasons","ch":"ch4","points":[["Identify: Division of labour",1],["Reason 1 (any one): practice makes perfect, choosing the most suitable workers for the job, or saving time in training",1],["Reason 2 (a second, distinct reason)",1]]},{"id":"DSE2025/P2/Q9(c)","q":"There are receptionists, bell boys, room attendants and managers working in hotels. What economic principle is illustrated by the above phenomenon? List THREE reasons why the application of this principle can increase labour productivity.","marks":4,"cmd":"Identify & list reasons","ch":"ch4","points":[["Identify: (Complex) division of labour",1],["Reason 1 (any one): practice makes perfect, assigning the most suitable person for each task, saving time in training, saving time in job rotation, or stimulus to mechanisation",1],["Reason 2 (a second, distinct reason)",1],["Reason 3 (a third, distinct reason)",1]]},{"id":"CE1991/P1/Q2(a)(i)","q":"Define 'opportunity cost' and 'occupational mobility'.","marks":4,"cmd":"Define","ch":"ch5","points":[["Opportunity cost is the highest-valued option (or the best alternative) forgone",2],["Occupational mobility is the ease with which a factor moves from one occupation/trade/industry to another",2]]},{"id":"DSE2015/P2/Q10(c)","q":"Professional football players often retire in their mid-thirties. Although most of them have once been well-paid as footballers, some of them can only find low-paid jobs after retirement. Explain the above phenomenon in terms of labour mobility.","marks":3,"cmd":"Explain","ch":"ch5","points":[["Professional footballers have low occupational mobility",2],["Because their skills are very specific and not easily transferable to other jobs",1]]},{"id":"DSE2017/P2/Q12(a)","q":"Before Brexit, workers from the EU were free to work in Britain and vice versa. British politicians suggested low-skilled EU workers should be required to apply for a visa to work in Britain. Referring to this view, explain how labour mobility of the low-skilled workers from the EU would be affected.","marks":3,"cmd":"Explain","ch":"ch5","points":[["The geographical mobility of low-skilled EU workers would be lowered",1],["Because the visa requirement raises the cost for those workers to go and work in the UK",2]]},{"id":"DSE2019/P2/Q11(a)","q":"The Guangzhou-Shenzhen-Hong Kong Express Rail Link (High Speed Rail) was launched in September 2018. Explain the effect of the launch of High Speed Rail on labour mobility of Hong Kong.","marks":3,"cmd":"Explain","ch":"ch5","points":[["The launch of the High Speed Rail increases the geographical mobility of workers",1],["Because the transportation network / connectivity improves, lowering the cost/time of travelling for work",2]]},{"id":"DSE2022/P2/Q9(a)(ii)","q":"The Mainland government introduced the Targeted Poverty Alleviation Campaign. A village in Yunnan with beautiful natural landscape was promoted to attract more travellers; apart from farming, the villagers also set up hostels to serve travellers. Explain how labour mobility of the villagers would be affected.","marks":3,"cmd":"Explain","ch":"ch5","points":[["There would be an increase in the occupational mobility of the villagers",2],["As they engaged in a new occupation — becoming hostel owners/operators — in addition to farming",1]]},{"id":"CE1990/P1/Q1(a)(iii)","q":"Mrs Wong is a lawyer and is also good at doing housework, but she employs a Filipino maid to do her housework. Give TWO reasons why Filipino maids are paid by time rates instead of piece rates.","marks":4,"cmd":"Give reasons","ch":"ch5","points":[["Reason 1 (any one): output is difficult/costly to measure or work is not standardized, or it is easy to calculate the wage payment",2],["Reason 2 (a second, distinct reason from the same list)",2]]},{"id":"CE1993/P1/Q1(d)","q":"The manager of 'Yummy Yummy' is paid a fixed monthly salary and shares part of the profits. Give ONE advantage of EACH of the above two payment methods to the shop.","marks":4,"cmd":"Give advantages","ch":"ch5","points":[["Time rate (fixed salary) advantage: the manager's output is difficult/costly to measure or work is not standardized, or it is easy to calculate the wage payment",2],["Profit-sharing advantage: the manager has a higher incentive to manage the firm well, has better control of production cost, or is more loyal to the firm",2]]},{"id":"CE1996/P1/Q12(b)","q":"The manufacturing workers in Hong Kong are facing the problem of a rising unemployment rate. Piece rate is a common payment method in the manufacturing industry. From an employer's point of view, explain ONE advantage and ONE disadvantage of this payment method.","marks":4,"cmd":"Explain","ch":"ch5","points":[["Advantage: higher working incentive or lower monitoring cost",2],["Disadvantage: workers are less careful in using the machinery, or better quality control is required",2]]},{"id":"CE1998/P1/Q11(a)","q":"Car agents in general pay their salesmen a commission for each car sold in addition to their basic monthly salary. From the viewpoint of car agents, explain TWO advantages of using such a wage payment method.","marks":4,"cmd":"Explain","ch":"ch5","points":[["Advantage 1 (any one): a basic salary helps maintain a team of staff, or commission increases the incentive to sell",2],["Advantage 2 (a second, distinct advantage: e.g. lower monitoring cost since commission already reflects output, or shares operational risk with the salesmen)",2]]},{"id":"CE2001/P1/Q9(c)","q":"Mr Chan is the owner of a garment factory and pays his workers at piece rate. State ONE advantage and ONE disadvantage to Mr Chan of using this payment method over the time rate method.","marks":2,"cmd":"State","ch":"ch5","points":[["Advantage: higher working incentive, or lower cost of supervision",1],["Disadvantage: higher cost of monitoring product quality, or more costly to calculate the wage payment",1]]},{"id":"CE2002/P1/Q12(b)(i)","q":"Mr Wong runs a bookstore in Hong Kong. In order to cut expenses, Mr Wong reduces the monthly salaries of the staff working in the bookstore. Give ONE advantage and ONE disadvantage to Mr Wong of paying his staff by time rate over piece rate.","marks":4,"cmd":"Give","ch":"ch5","points":[["Advantage: helps maintain a team of staff, or lower cost of measuring the workers' contribution",2],["Disadvantage: lower working incentive, or higher supervising cost",2]]},{"id":"CE2007/P1/Q2(a)","q":"Post A: Typing clerk, 9am-5pm 5 days/week, Wage $8,000/month. Post B: Typing services, transforming documents into WORD files, Payment $4 per A4 paper. What are the wage payment methods for Post A and Post B, respectively?","marks":2,"cmd":"Identify","ch":"ch5","points":[["Post A: time rate",1],["Post B: piece rate",1]]},{"id":"CE2009/P1/Q4(a)","q":"Job A: Distilled water delivery driver, Payment $1 per unit delivered. Job B: Distilled water delivery driver, Wage $300 per day. Identify the wage payment method for Job A and for Job B.","marks":2,"cmd":"Identify","ch":"ch5","points":[["Job A: piece rate",1],["Job B: time rate",1]]},{"id":"CE2009/P1/Q4(b)","q":"Explain ONE advantage and ONE disadvantage to the employer of using the wage payment method for Job A (piece rate) over Job B (time rate).","marks":4,"cmd":"Explain","ch":"ch5","points":[["Advantage: lower cost of supervising workers, higher working incentive, or higher productivity",2],["Disadvantage: higher cost of measuring the output, or higher cost of monitoring the quality of service",2]]},{"id":"CE2010/P1/Q3","q":"The salespersons in many large electrical appliance retailing shops are paid a basic salary plus commission. From the viewpoint of the shop owners, explain ONE advantage of using this wage payment method over a basic salary only, and ONE advantage over a commission only.","marks":4,"cmd":"Explain","ch":"ch5","points":[["Advantage over basic salary only: increases the incentive to sell more, lowers the monitoring cost of work effort, or shares operational risk with the salespersons",2],["Advantage over commission only: helps maintain a team of staff",2]]},{"id":"DSE2015/P2/Q10(b)","q":"Contract A: Player A paid $10,000 per week. Contract B: Player B paid $8,000 per match + $10,000 for each goal scored. Explain TWO advantages of Contract B over Contract A from the viewpoint of the employer.","marks":4,"cmd":"Explain","ch":"ch5","points":[["Advantage 1: the team owner can share business risk with Player B, since less is paid when no match is played or no goal is scored",2],["Advantage 2: lower cost of monitoring performance, since Player B has a higher work incentive in training and matches",2]]},{"id":"DSE2021/P2/Q1(a)","q":"An online food delivery firm advertises for riders: high salary for each delivery, keep 100% tips, riders must bring their own smartphone and motorcycle. From the viewpoint of the riders, state TWO disadvantages of the above arrangements.","marks":2,"cmd":"State","ch":"ch5","points":[["Disadvantage 1 (any one): less job/income stability, self-provision of capital goods (own equipment costs), or tendency to drive fast and ignore road safety",1],["Disadvantage 2 (a second, distinct disadvantage from the same list)",1]]},{"id":"CE1990/P1/Q1(a)(ii)","q":"Mrs Wong is a lawyer and is also good at doing housework, but she employs a Filipino maid to do her housework. To what stage of production does the work done by Filipino maids belong? Explain.","marks":2,"cmd":"Explain","ch":"ch4","points":[["Tertiary production only",1],["It is the provision of a service",1]]},{"id":"CE1996/P1/Q2","q":"'Spaghetti House' is a fast-food shop selling pizzas and other Italian dishes. Name and explain the type(s) of production that the shop is engaged in.","marks":4,"cmd":"Name & Explain","ch":"ch4","points":[["Secondary production — food materials are cooked in the shop and turned into cooked food",2],["Tertiary production — when having meals, customers are served by waiters in the shop",2]]},{"id":"CE2004/P1/Q9(d)","q":"Explain which type of production car agents belong to.","marks":2,"cmd":"Explain","ch":"ch4","points":[["Tertiary production",1],["because they provide services (selling/agency service, not manufacturing the cars)",1]]},{"id":"DSE2015/P2/Q2(a)","q":"Many electronic product retailers are located in Mong Kok. To which type of production do electronic product retailers belong? Explain your answer.","marks":2,"cmd":"Explain","ch":"ch4","points":[["Tertiary production",1],["as they provide retail services",1]]},{"id":"DSE2022/P2/Q9(a)(i)","q":"Under the Targeted Poverty Alleviation Campaign, a village in Yunnan with beautiful natural landscape was promoted to attract travellers. Apart from farming, the villagers also set up hostels to serve travellers to earn more income. In which types of production did the villagers engage after the introduction of the campaign? Explain.","marks":4,"cmd":"Explain","ch":"ch4","points":[["Primary production: as farmers, they directly extract resources from nature",2],["Tertiary production: as hostel owners, they provide catering and accommodation services to visitors",2]]},{"id":"DSE2014/P2/Q2(b)","q":"Ah Wing runs a store selling mobile phone accessories in Mong Kok. Give ONE example of variable cost incurred in Ah Wing's business. Explain your answer.","marks":2,"cmd":"Explain","ch":"ch6","points":[["Cost of buying the accessories, or wages of part-time workers",1],["as expenses on these items would vary (increase) with the output of the shop",1]]},{"id":"DSEPP/P2/Q11(b)","q":"The prices of textbooks for senior secondary education have increased sharply because publishers have to publish new textbooks for the new curriculum. Explain whether the knowledge in the textbooks is a public good.","marks":3,"cmd":"Explain","ch":"ch3","points":[["Yes",1],["Knowledge is non-rival in consumption: a person's consumption will not reduce the amount available to others; it is also non-excludable — too costly to exclude others from consuming it",2]]},{"id":"DSE2015/P2/Q1(a)(ii)","q":"Most of the teaching materials in massive open online courses (MOOC) can be accessed online by anyone free of charge. Explain whether these materials are public goods.","marks":3,"cmd":"Explain","ch":"ch3","points":[["Yes",1],["because a person can download and study the course materials without reducing the availability of those materials to others, i.e. these materials are non-rivalrous in consumption",2]]},{"id":"DSESP/P2/Q9(c)(ii)(iii)","q":"A firm's marginal costs: at outputs 500/600/700/800/900 units, MC is $70/$80/$90/$100/$110 before a technological improvement and $60/$70/$80/$90/$100 after. (ii) If the market price was $80 before the improvement, what is the firm's output? (iii) If the price fell to $70 after the improvement, what is the output?","marks":2,"cmd":"Compute","ch":"ch6","points":[["(ii) 600 units — produce up to where MC = price ($80)",1],["(iii) 600 units — with the lower MC schedule, MC = $70 at 600 units",1]]},{"id":"DSE2024/P2/Q11(b)","q":"The landlord of Ann's coffee shop premises raised the monthly rental from $70,000 to $85,000. Ann said, 'Despite the increase in the monthly rental, the quantity of daily output of my coffee shop remains unchanged.' Explain Ann's output decision with reference to the profit-maximising condition under perfect competition.","marks":3,"cmd":"Explain","ch":"ch6","points":[["To maximise profit, a firm under perfect competition produces up to the point where the marginal cost of the last unit equals its marginal revenue (i.e. the market price)",1],["The monthly rental is a fixed cost as it does not vary with the quantity of output produced in a day",1],["As the rental increase affects neither the marginal cost nor the market price, it does not affect the profit-maximising daily output quantity",1]]},{"id":"CE1999/P1/Q4","q":"In order to raise capital for expansion, a limited company is considering whether to issue new shares or debentures. From the viewpoint of the company, give ONE advantage and ONE disadvantage of issuing shares over debentures.","marks":4,"cmd":"Advantage & Disadvantage","ch":"ch3","points":[["Advantage: no interest burden / no redemption obligation",2],["Disadvantage: easier to be taken over",2]]},{"id":"CE2001/P1/Q10(c)(ii)","q":"Bank A raises capital by issuing shares to the public. State TWO advantages to Bank A of issuing shares over debentures for raising capital.","marks":2,"cmd":"State","ch":"ch3","points":[["No interest burden",1],["No redemption obligation",1]]},{"id":"CE2010/P1/Q10(a)","q":"A large pharmaceutical company in Hong Kong issued shares to the public in order to raise capital. From the viewpoint of the existing shareholders of a public limited company, state ONE advantage and ONE disadvantage of issuing shares over bonds.","marks":4,"cmd":"Advantage & Disadvantage","ch":"ch3","points":[["Advantage: no interest burden / no redemption obligation",2],["Disadvantage: easier to be taken over / interest (control) in the company being diluted",2]]},{"id":"DSE2012/P2/Q10(a)(ii)","q":"Mr. Chan, a retired person, considers investing $6,000 either in shares or bonds issued by a listed company. Explain with TWO reasons why bonds could be a better choice than shares for Mr. Chan.","marks":4,"cmd":"Explain","ch":"ch3","points":[["He can get interest return even if the company does not make any profit that year",2],["Higher priority of getting paid than shareholders if the company is liquidated",2]]},{"id":"DSE2016/P2/Q2(b)","q":"Sure-Star Education Group can issue shares and bonds to the general public to raise capital. From the viewpoint of owners, explain ONE advantage and ONE disadvantage of issuing shares over bonds.","marks":4,"cmd":"Advantage & Disadvantage","ch":"ch3","points":[["Advantage: no interest burden / no redemption obligation",2],["Disadvantage: diluting the control right over the firm / higher risk of being taken over",2]]},{"id":"DSE2020/P2/Q9(c)","q":"Instead of obtaining bank loans to finance infrastructure development, it is suggested that Ocean Park can be listed in the stock market and issue shares to raise capital. State TWO advantages of issuing shares over obtaining loans from banks for raising capital.","marks":2,"cmd":"State","ch":"ch3","points":[["No interest obligation",1],["No repayment obligation",1]]},{"id":"DSE2023/P2/Q10(a)","q":"The nominal interest rate of the Silver Bonds equals the actual inflation rate in Hong Kong, subject to a minimum of 4%. From the viewpoint of senior citizens, explain ONE advantage and ONE disadvantage of holding Silver Bonds over holding cash.","marks":4,"cmd":"Advantage & Disadvantage","ch":"ch3","points":[["Advantage: purchasing power can be better preserved in times of inflation, since the nominal rate of return on Silver Bonds rises with inflation while that of cash remains at zero",2],["Disadvantage: liquidity is lower, since it takes days for Silver Bonds to be redeemed and converted into cash",2]]},{"id":"DSE2024/P2/Q1(a)(ii)","q":"Suppose Hong Kong Telecommunications plans to raise capital for expansion. From the viewpoint of the owners of the company, state ONE advantage and ONE disadvantage of issuing shares over bonds.","marks":2,"cmd":"Advantage & Disadvantage","ch":"ch3","points":[["Advantage: no interest burden / no redemption obligation",1],["Disadvantage: dilution of ownership and reduction in control power over the firm / higher risk of being taken over",1]]},{"id":"DSE2023/P2/Q3(b)","q":"A firm's production data: machinery fixed at 12 units; labour of 10/11/12/13/14 units gives average output of labour of 10/12/15/17/16 units. Explain whether the law of diminishing marginal returns is illustrated by the above data.","marks":3,"cmd":"Explain","ch":"ch6","points":[["Yes",1],["Total product: 100, 132, 180, 221, 224 → the marginal product of labour drops from 48 to 41 units when labour (a variable factor) increases from 12 to 13 units, given a fixed quantity (12 units) of machinery (fixed facto",2]]},{"id":"CE1995/P1/Q10(a)(ii)","q":"A singer volunteers to perform two identical charity shows. Explain TWO economies of scale that may arise from holding two identical shows instead of only one show.","marks":4,"cmd":"Explain","ch":"ch6","points":[["The set-up cost / back-up facilities / expertise required for two shows is the same as that for one — spread over more output",2],["The advertising fee for marketing two shows is the same as that for one / bulk purchase of required materials at a bigger discount",2]]},{"id":"CE1997/P1/Q9(a)","q":"Suppose the government builds a railway in northwest New Territories. If the new railway is to be run by the Kowloon-Canton Railway Corporation (KCRC), give TWO reasons why this can bring down the average cost of KCRC.","marks":4,"cmd":"Explain","ch":"ch6","points":[["Elaboration of one economy of scale in relation to KCRC, e.g. technical economies (fuller use of existing equipment and expertise across a larger network)",2],["Elaboration of a second economy of scale, e.g. financial / managerial / marketing economies, or cost-saving research and development",2]]},{"id":"CE2004/P1/Q11(c)(i)","q":"A famous chain of fashion stores opens a new branch. Explain TWO economies of scale that the chain stores might enjoy due to the expansion.","marks":4,"cmd":"Explain","ch":"ch6","points":[["e.g. Marketing economies of scale: bulk purchase at lower cost / Technical economies: a fuller use of the plants and equipment",2],["e.g. Managerial economies: a wider scope for specialization / Financial economies: easier to raise capital and at a lower interest rate",2]]},{"id":"CE2009/P1/Q9(a)","q":"Textbook publishers usually print textbooks in large amounts in order to reduce their average cost of production. Explain TWO economies of scale that a firm may enjoy when it expands its production scale.","marks":4,"cmd":"Explain","ch":"ch6","points":[["e.g. Technical economies: large firms can utilize machines and plant more fully / Managerial economies: a wider scope of specialization raises efficiency",2],["e.g. Financial economies: obtain capital at lower cost / Marketing economies: bulk purchase discounts or advertising cost spread over larger output / R&D spread / risk-bearing diversification",2]]},{"id":"CE2010/P1/Q9(a)","q":"Ocean Park will expand to double the number of its attractions. Explain TWO economies of scale that it may enjoy after expansion.","marks":4,"cmd":"Explain","ch":"ch6","points":[["e.g. Financial economies: borrowing at a lower interest rate / Managerial economies: wider scope of specialization",2],["e.g. Technical economies: fuller use of machines / Marketing economies: bulk-purchase discounts or advertising cost spread over a larger output",2]]},{"id":"DSE2015/P2/Q2(b)","q":"Many electronic product retailers are located in Mong Kok. Suggest TWO reasons why an electronic product retailer in Mong Kok may enjoy external economies of scale.","marks":4,"cmd":"Suggest","ch":"ch6","points":[["The cluster reduces the cost of marketing and promotion (the district itself attracts buyers)",2],["Reduced transportation cost for suppliers / more related businesses available nearby such as accessories and repair services",2]]},{"id":"DSE2016/P2/Q2(c)","q":"The average cost of providing services decreases when Sure-Star Education Group operates more tutorial classes in different districts. Give THREE reasons to explain why its average cost decreases.","marks":3,"cmd":"Explain","ch":"ch6","points":[["Cost of advertising shared by a larger number of students",1],["Bulk purchase of raw materials in production",1],["More extensive division of labour",1]]},{"id":"DSE2017/P2/Q2(b)","q":"Due to the opening of several new branches, the average cost of production of Steven's restaurant has increased. Explain with TWO reasons why this happens.","marks":4,"cmd":"Explain","ch":"ch6","points":[["The firm may have become too large in scale, so managerial efficiency starts declining",2],["The firm may have large outstanding loans, so the marginal cost of further borrowing increases / the market may have saturated, raising marketing cost",2]]},{"id":"DSE2018/P2/Q3","q":"Shenzhen has become China's 'Silicon Valley' — the headquarters of many high-technology firms such as Tencent, Huawei and BYD are located there. Explain TWO external economies of scale high-technology firms may enjoy in Shenzhen.","marks":4,"cmd":"Explain","ch":"ch6","points":[["Reduction of marketing/promotion costs, as the region attracts more buyers for high-technology products and services",2],["Reduction of transportation cost (infrastructure develops more quickly) / lower cost of recruiting experienced and skilled workers, as more of them are attracted to the region",2]]},{"id":"DSE2019/P2/Q5(b)","q":"On Christmas Eve, the Wong and Chan families buy food ingredients and cook together instead of buying and cooking separately. State ONE economic concept involved and explain why the arrangement is beneficial to both families.","marks":3,"cmd":"State & Explain","ch":"ch6","points":[["Economies of scale",1],["Bulk purchase of ingredients earns discounts, reducing the average cost of producing the dinners / cooking together saves average cooking time and allows a larger variety of food choices",2]]},{"id":"DSE2020/P2/Q2(c)","q":"After the opening of 10 more restaurants, the firm found that its average cost decreased. State TWO possible reasons for this.","marks":2,"cmd":"State","ch":"ch6","points":[["Share of advertising cost by a larger amount of output",1],["Bulk purchase of raw materials / more extensive division of labour",1]]},{"id":"DSE2023/P2/Q11(d)","q":"A concert organiser: 'Had we known that the fans were so supportive, we would have held more shows for the concert. This would help reduce the average cost per show.' Explain with TWO reasons why holding more shows for the same concert may help reduce the average cost per show.","marks":4,"cmd":"Explain","ch":"ch6","points":[["The cost of advertising can be spread over a larger quantity of output (number of shows)",2],["The cost of rehearsal can be spread over a larger quantity of output",2]]},{"id":"DSE2024/P2/Q11(f)","q":"After opening several new coffee shops, Ann found that the average cost of production of her business had decreased. Give TWO reasons for the above change in average cost.","marks":2,"cmd":"State","ch":"ch6","points":[["Discount for bulk purchase of inputs, e.g. coffee beans",1],["Spreading of advertising cost over a larger number of outputs / lower cost of borrowing with more collateral",1]]},{"id":"CE1990/P1/Q4(a)(i)","q":"Lei Sun is a garment manufacturing firm wholly owned by Mr Lee. It will be combined with a garment retailing group to form a public limited company. Explain TWO advantages to Lei Sun of combining with a retailing group.","marks":4,"cmd":"Explain","ch":"ch7","points":[["To secure an outlet for its products / easier to obtain information on consumers' preferences",2],["To enjoy economies of scale / to build up brand name",2]]},{"id":"CE1998/P1/Q3","q":"A television broadcasting company takes over a film production company. Give TWO possible economic motives of the takeover.","marks":4,"cmd":"Explain","ch":"ch7","points":[["(This is vertical backward integration — the film company is at an earlier stage.) To guarantee a stable source of films to be shown / to direct or influence the kind of films shot",2],["Economies of scale (fuller use of expertise, equipment and plant) / diversify investment risk",2]]},{"id":"CE2002/P1/Q11(d)","q":"The tutorial school also publishes textbooks for sale to the public. Give FOUR possible motives of such an expansion.","marks":4,"cmd":"State","ch":"ch7","points":[["To make use of its brand name",1],["To diversify the business / spread risk",1],["To promote its goodwill",1],["To better utilize its resources / to enjoy economies of scale",1]]},{"id":"CE2006/P1/Q3","q":"When it started, the Walt Disney Company produced cartoon movies only. Later it expanded its business to owning and operating Disneyland theme parks and hotels. Explain what type of expansion this is and state TWO possible motives.","marks":4,"cmd":"Identify & State","ch":"ch7","points":[["Conglomerate expansion — movie production and hotel business are two different lines of production (also accepted: lateral, if viewed as related but not competitive)",2],["Motives: product diversification to spread risk; making use of brand name / promoting goodwill; more flexible use of resources; economies of scale (any two)",2]]},{"id":"CE2011/P1/Q11(b)","q":"A local property agency opened more branch offices when expanding its business. Name this type of expansion and give TWO motives for it.","marks":3,"cmd":"Name & State","ch":"ch7","points":[["Horizontal expansion (same product, same stage)",1],["Motives: better utilization of resources; increase market share; economies of scale (any two)",2]]},{"id":"DSE2015/P2/Q9(b)","q":"McDonald's has expanded its business by operating McCafé, which sells premium coffee like other coffeehouses such as Starbucks. To which type of expansion does this belong? Explain.","marks":2,"cmd":"Identify & Explain","ch":"ch7","points":[["Lateral expansion",1],["as fast food and coffee are related but not directly competitive products",1]]},{"id":"DSE2019/P2/Q9(b)","q":"Miss Amy Au sells Japanese cosmetic products on her website. Apart from Japanese cosmetic products, she starts to sell Korean cosmetic products on her website. To what type of expansion does this belong? Give TWO possible reasons for this type of expansion.","marks":3,"cmd":"Identify & State","ch":"ch7","points":[["Horizontal expansion (same type of product — cosmetics — at the same stage)",1],["Reasons: enlarge the market share; enjoy economies of scale; make use of the brand name (any two)",2]]},{"id":"DSE2020/P2/Q2(a)(b)","q":"A chain restaurant providing Chinese cuisine set up a cake shop. (a) Explain which type of expansion this was. (b) List TWO possible motives for the above expansion.","marks":4,"cmd":"Identify & List","ch":"ch7","points":[["(a) Lateral expansion because the firm expanded its production to related but not competitive products",2],["(b) Market/product diversification; economies of scale; use of brand name (any two)",2]]},{"id":"DSE2021/P2/Q3","q":"In 1992, Cathay Pacific Airways acquired an air-catering company, renamed Cathay Pacific Catering Services (CPCS), which provided around thirty million meals for various airlines in 2019. From the viewpoint of Cathay Pacific Airways, name the type of the above integration and give TWO motives for this type of integration.","marks":3,"cmd":"Name & State","ch":"ch7","points":[["Vertical backward integration (the catering company supplies an input — meals — to the airline)",1],["Motives: to ensure a steady supply of raw materials (meals); to diversify sources of income and spread risks; to make use of its brand name (any two)",2]]},{"id":"DSE2023/P2/Q1(a)(b)","q":"An electric car manufacturer took over a social media company. (a) Explain which type of expansion this was. (b) Why did the electric car manufacturer choose to take over a social media company instead of another electric car manufacturer? List TWO possible reasons.","marks":4,"cmd":"Identify & List","ch":"ch7","points":[["(a) Conglomerate integration, because electric car manufacturing and social media operation are totally unrelated businesses",2],["(b) To spread risk through product diversification / to make use of its brand name in other products or services",2]]},{"id":"CE1995/P1/Q1","q":"'Lee, Chau, Lam & Co., Solicitors' — To what type of business ownership does the above firm belong? List THREE features of this type of business ownership.","marks":4,"cmd":"Identify & List","ch":"ch3","points":[["Partnership",1],["Features (any three): 2–20 partners; unlimited liability; each partner fully liable for the firm's debts; an act by one partner binds all other partners; difficult to admit or withdraw partners; easy to set up and dissol",3]]},{"id":"CE1998/P1/Q9(b)","q":"The restaurant is a general partnership. Explain TWO advantages of a general partnership over a sole proprietorship.","marks":4,"cmd":"Explain","ch":"ch3","points":[["Wider source of capital (partners pool funds)",2],["Better division of labour among owners / wider scope of specialization / risk and cost shared among partners",2]]},{"id":"CE2001/P1/Q11(c)","q":"Explain TWO advantages of a public limited company over a private limited company.","marks":4,"cmd":"Explain","ch":"ch3","points":[["Wider source of capital because capital can be raised from the public",2],["Shares are freely transferable (no approval needed) / wider scope of specialization (ownership and management separated) / lasting continuity",2]]},{"id":"CE2003/P1/Q3","q":"John is running a firm with Peter. Since Peter has not been running the firm properly, both of them have had to sell their personal property to cover the firm's debts. To what type of business ownership does the above firm belong? List TWO features of this type of business ownership.","marks":3,"cmd":"Identify & List","ch":"ch3","points":[["Partnership",1],["Features (any two): unlimited liability; each partner fully liable for the firm's debt; all partners bound by other partners' business decisions; 2–20 partners; difficult to admit or withdraw partners; easy to set up and",2]]},{"id":"CE2004/P1/Q4","q":"State THREE features of a public limited company that distinguish it from a private limited company in Hong Kong.","marks":3,"cmd":"State","ch":"ch3","points":[["No upper limit on the number of shareholders",1],["Free transfer of shares",1],["Wider source of capital (can invite the public to be shareholders) / financial accounts open to the public",1]]},{"id":"CE2009/P1/Q2","q":"In 2007, the HKSAR Government bought a quantity of the shares in the Hong Kong Exchanges and Clearing Limited (HKEx) on the stock exchange. To what type of business ownership does the HKEx belong? List TWO features of this type of business ownership.","marks":3,"cmd":"Identify & List","ch":"ch3","points":[["Public limited company",1],["Features (any two): independent legal status; limited liability; separation of ownership and management; lasting continuity; shares freely transferable; issues shares to the public; no upper limit on shareholders; requir",2]]},{"id":"DSESP/P2/Q9(d)","q":"Patrick is one of the owners of ABC Electronic Watches Manufacturing Ltd. He cannot transfer his shares of the company to others in the stock market. (i) What kind of business ownership does the company belong to? (ii) Does Patrick need to use his own property to repay the debts of the company if it goes bankrupt? Explain.","marks":3,"cmd":"Identify & Explain","ch":"ch3","points":[["(i) Limited company (not listed on the stock exchange) — i.e. a private limited company",1],["(ii) No, because his liability is limited only to the amount that he invested or promised to invest",2]]},{"id":"DSE2012/P2/Q12(b)","q":"Chinachem Group does not list its shares on the stock market. State TWO advantages and TWO disadvantages of being a private limited company instead of a listed company.","marks":4,"cmd":"State","ch":"ch3","points":[["Advantages: tighter control of ownership / more difficult to be taken over; no need to disclose accounting information to the public",2],["Disadvantages: cannot issue shares to the general public to raise capital; difficult to transfer its ownership",2]]},{"id":"DSE2015/P2/Q9(a)","q":"McDonald's is a private limited company in Hong Kong. State ONE advantage and ONE disadvantage of forming a private limited company over forming a public limited company.","marks":2,"cmd":"State","ch":"ch3","points":[["Advantage: lower risk of being taken over / no need to disclose accounting information to the public",1],["Disadvantage: owners cannot freely transfer their stocks / the firm cannot raise capital by issuing stocks to the general public",1]]},{"id":"DSE2017/P2/Q10(a)","q":"MTR is a listed company. State TWO differences between such an ownership and a private limited company.","marks":2,"cmd":"State","ch":"ch3","points":[["Shares of a listed company are freely transferable while shares of a private limited company are not",1],["A listed company must disclose its accounting information to the public while a private one need not / a listed company can issue shares and bonds to the general public while a private one cannot",1]]},{"id":"DSE2017/P2/Q10(b)","q":"Some politicians suggest that the government should buy back the shares of MTR so that the company would become wholly owned by the government. Discuss the suggestion by giving ONE argument FOR and ONE argument AGAINST it.","marks":4,"cmd":"Discuss","ch":"ch3","points":[["FOR: the government would have better control of train fares and could freely reduce them to relieve passengers' burden / full government backing makes it easier for MTR to get loans",2],["AGAINST: it may lower the efficiency of MTR's management and reduce its sensitivity to market (price) signals / the substantial money involved may have better alternative uses (e.g. education, medical services)",2]]},{"id":"DSE2018/P2/Q2(a)","q":"Last year, Peter operated a sole proprietorship. Recently he invited Paul and Mary to form a partnership to expand the business to other markets. Suggest TWO reasons why Peter switched his firm's form of business ownership for expansion.","marks":2,"cmd":"Suggest","ch":"ch3","points":[["He wants to invite more investors to get new funds for expansion",1],["He can make use of the different expertise of Paul and Mary in the new markets",1]]},{"id":"DSE2019/P2/Q3","q":"Give ONE example of a public corporation in Hong Kong. With reference to your example, state TWO advantages of providing the service by a public corporation instead of a private enterprise.","marks":3,"cmd":"Give & State","ch":"ch3","points":[["Example: HK Airport Authority / Hong Kong Export Credit Insurance Corporation",1],["Advantages (any two): easier to get information about the general public from the government for decision-making; can provide stable service at a lower price; easier to get loans with government backing",2]]},{"id":"DSE2020/P2/Q11(a)","q":"The Cross-Harbour Tunnel is owned by the government (toll $20) while the Western Harbour Crossing is owned by a private firm (toll $75). State ONE advantage and ONE disadvantage of providing cross-harbour services by a private firm instead of the government.","marks":2,"cmd":"State","ch":"ch3","points":[["Advantage: more efficient management / easier to recruit experts",1],["Disadvantage: higher toll, as a private firm aims at profit maximisation / less information for future planning",1]]},{"id":"DSE2022/P2/Q1(a)","q":"Mary was the major shareholder of a private limited company operating a restaurant chain. She planned to change the form of business ownership to a listed company. List ONE advantage and ONE disadvantage of the change.","marks":2,"cmd":"List","ch":"ch3","points":[["Advantage: ability to raise capital by issuing shares to the general public / easier transfer of ownership",1],["Disadvantage: requirement to disclose the company's accounting information to the public / higher risk of being taken over",1]]},{"id":"DSE2024/P2/Q11(e)","q":"Ann has been operating her coffee shop as a sole proprietorship. Give TWO economic reasons why she does not choose to change the form of business ownership to a partnership.","marks":2,"cmd":"Give","ch":"ch3","points":[["Ann does not want to be legally bound by the business decisions of a partner",1],["Ann prefers making decisions promptly by herself",1]]},{"id":"DSE2025/P2/Q2(b)","q":"Miss Chan and her friends jointly operate a yoga studio in the form of a private limited company. (i) Define 'limited liability'. (ii) Give TWO possible reasons why they chose to set up a private limited company instead of a public limited company.","marks":4,"cmd":"Define & Give","ch":"ch3","points":[["(i) Limited liability means that when a firm liquidates, the liability of an owner is confined to the amount of initial investment in the firm",2],["(ii) Lower risk of being taken over (transfer of ownership requires consent of other owners); no need to disclose financial accounts to the public",2]]},{"id":"DSE2016/P2/Q13(b)(ii)","q":"The airport corporation charges a lump-sum fee on every departing traveller (Proposal B). Discuss the effect on the average flight distance of departing travellers.","marks":4,"cmd":"Discuss","ch":"ch8","points":[["A lump-sum fee charged on both long- and short-distance travellers lowers the price of long-distance flights RELATIVE to short-distance flights",2],["A higher proportion of travellers will take long-distance flights, increasing the average flight distance",2]]},{"id":"DSE2021/P2/Q2","q":"Taxi fare: first 2 km $30, every subsequent 200 m $2. Suppose a late-night surcharge of $20 is added to the original fare on any taxi trip from 1:00 am to 5:59 am. How will this surcharge affect the average travel distance of taxi passengers during late-night? Explain.","marks":4,"cmd":"Explain","ch":"ch8","points":[["The $20 surcharge applies equally to long- and short-distance trips, so the price of long trips RELATIVE to short trips falls",2],["The proportion of passengers travelling long distances rises — the average travel distance of late-night taxi passengers increases",2]]},{"id":"DSE2023/P2/Q11(e)","q":"It is observed that fans from overseas tend to buy higher-priced concert tickets when buying through the official channel. Based on the law of demand, explain this phenomenon.","marks":2,"cmd":"Explain","ch":"ch8","points":[["For overseas fans, the same travelling expenses are added to both higher- and lower-priced tickets",1],["Including these travel costs lowers the RELATIVE price of higher-priced tickets in terms of lower-priced ones — so overseas fans buy proportionally more of the better tickets",1]]},{"id":"DSE2024/P2/Q10(d)","q":"To stimulate tourism, the government of City B ABOLISHES the lump-sum fuel surcharge on flight tickets. Explain how the average flight distance would be affected.","marks":3,"cmd":"Explain","ch":"ch8","points":[["Removing the same lump-sum surcharge from both long- and short-distance flights means the PERCENTAGE decrease in price is smaller for long flights than for short flights",1],["The relative price of long-distance flights (in terms of short ones) therefore RISES, cutting the ratio of long to short flights taken",1],["Average flight distance decreases",1]]},{"id":"DSE2015/P2/Q11(c)","q":"An economist stated, 'Other things being constant, the rise in the tobacco duty rate would not effectively reduce the quantity consumed of duty-paid cigarettes.' Justify his statement WITHOUT using a diagram.","marks":4,"cmd":"Justify","ch":"ch10","points":[["The duty raises the market price of duty-paid cigarettes, reducing quantity demanded",1],["But addicted smokers have INELASTIC demand: the percentage fall in quantity demanded is smaller than the percentage rise in price — so even a large duty increase cuts consumption only a little",3]]},{"id":"DSE2018/P2/Q5(a)","q":"During peak flu seasons there is not enough medical staff in public hospitals. An economist stated, 'Even if the government sharply increases the wage rates of the medical staff, it is still difficult to relieve the problem.' Justify his statement using the concept of elasticity.","marks":3,"cmd":"Justify","ch":"ch10","points":[["The SUPPLY of medical staff is inelastic, because they require special training and qualifications",2],["Even a sharp wage rise raises the quantity supplied of medical staff by a smaller percentage than the wage increase — the staffing gap barely closes",1]]},{"id":"DSE2023/P2/Q12(a)(ii)","q":"US citizens say gasoline is needed for daily routines, and despite trying hard to cut consumption their gasoline bills keep rising. With reference to the crude-oil-driven rise in gasoline prices, explain why consumers' total expenditure on gasoline would increase.","marks":3,"cmd":"Explain","ch":"ch10","points":[["Gasoline is a daily NECESSITY, so demand for it tends to be INELASTIC",2],["The percentage decrease in quantity demanded is smaller than the percentage increase in price — so total expenditure on gasoline rises as its price rises",1]]},{"id":"DSE2024/P2/Q10(c)","q":"Following the government's tourism promotion, many people travel to City B. Flight ticket prices DOUBLE while the quantity transacted changes by 50%. What can we conclude about the price elasticity of demand and/or supply of flight tickets? Explain.","marks":3,"cmd":"Conclude & Explain","ch":"ch10","points":[["The demand for flight tickets increased — the demand curve shifts right, moving the equilibrium UP ALONG THE SAME SUPPLY CURVE",1],["The observed price-quantity changes therefore measure SUPPLY elasticity (demand elasticity cannot be inferred while demand itself shifts)",1],["Since the percentage increase in quantity (50%) is smaller than the percentage increase in price (100%), the supply of flight tickets is INELASTIC",1]]},{"id":"DSE2025/P2/Q11(c)","q":"A PRH applicant thinks the 10% rental increase will have little effect on the waiting time for public rental housing units. Justify this comment.","marks":4,"cmd":"Justify","ch":"ch10","points":[["PRH rental is far below private-market rents, so there are NO close substitutes in the relevant price range",1],["The demand for PRH units is therefore very INELASTIC in that range",1],["A 10% rental increase has a less-than-proportionate effect on quantity demanded",1],["With supply perfectly inelastic (quantity supplied fixed) and quantity demanded falling only slightly, the excess demand — and hence the waiting time — barely changes",1]]},{"id":"CE1993/P1/Q4(b)(ii)","q":"Suppose a large number of Japanese TV sets are smuggled from Hong Kong to China and sold there. With the aid of a diagram, explain how the equilibrium price of the TV sets in China will be affected.","marks":4,"cmd":"Explain & Draw","ch":"ch8","points":[["The smuggled sets add to the SUPPLY of TV sets in China — supply curve shifts right",2],["The equilibrium price of TV sets in China decreases",2]]},{"id":"DSE2023/P2/Q12(a)(i)","q":"Crude oil prices rose sharply from May 2020 to May 2022, and gasoline is made from crude oil. Explain how the change in crude oil prices affects gasoline prices.","marks":3,"cmd":"Explain","ch":"ch8","points":[["Crude oil is an INPUT for producing gasoline: dearer crude raises the cost of producing gasoline",1],["The supply of gasoline decreases (shifts left)",1],["The price of gasoline increases",1]]},{"id":"DSESP/P2/Q4(a)","q":"More customers go to karaoke lounges during weekends, and the services are priced higher than on weekdays. Why may the fact that customers have more free time during weekends result in a higher market price for karaoke services?","marks":4,"cmd":"Explain","ch":"ch8","points":[["With more free time, the TIME COST of consuming karaoke services is lower on weekends",2],["Quantity demanded is higher at every price — demand increases (shifts right), raising the weekend market price",2]]},{"id":"DSE2013/P2/Q2(b)","q":"Flats built under the 'Hong Kong Property for Hong Kong Residents' policy can only be sold to Hong Kong permanent residents within 30 years. Compared with similar unrestricted flats in the same district, would the price of these flats be higher or lower? Explain.","marks":3,"cmd":"Explain","ch":"ch8","points":[["Lower — the reselling restriction cuts the number of potential buyers",2],["A smaller pool of buyers means lower demand for these flats, hence a lower price",1]]},{"id":"DSE2015/P2/Q4(b)","q":"The strong preference for small flats has pushed their prices to a new high. Explain how the SUPPLY of large flats would be affected by the strong preference for small flats.","marks":2,"cmd":"Explain","ch":"ch8","points":[["The supply of large flats would drop",1],["because small flats and large flats are in COMPETITIVE SUPPLY — developers divert land and resources towards building the now-more-profitable small flats",1]]},{"id":"DSE2014/P2/Q10(e)","q":"China considered relaxing the one-child policy to boost the birth rate. WITHOUT using a diagram, explain why the stock price of Goodbaby International (a children's products maker) increased after this news was published.","marks":4,"cmd":"Explain","ch":"ch8","points":[["People expected the birth rate to rise → expected future demand for baby products to increase",1],["Goodbaby was expected to earn bigger profits",1],["and to distribute more dividends per share in the future",1],["The expected higher future dividends raised the demand for the company's shares immediately, pushing up its stock price",1]]},{"id":"DSE2018/P2/Q13(c)","q":"Hong Kong's population projection shows rapid ageing. Susan, a local S6 graduate, is choosing between a programme in primary education and one in nursing. If future income is her major concern, which programme would you recommend? Explain with reference to the projection.","marks":4,"cmd":"Recommend & Explain","ch":"ch8","points":[["Nursing",1],["The ageing population will raise the demand for medical services, and the demand for nurses is DERIVED from medical services — so nurses' future income should be higher; meanwhile fewer children means weaker demand for p",3]]},{"id":"DSE2022/P2/Q2","q":"There are two kinds of food deliverers: 'riders' (self-provided motorbikes) and 'walkers' (on foot). Why do riders usually have a higher income per order than walkers? Suggest ONE demand-side factor and ONE supply-side factor.","marks":4,"cmd":"Suggest & Explain","ch":"ch8","points":[["Supply-side: the supply of riders is smaller — riding requires a licence, and riders bear higher costs (petrol, depreciation)",2],["Demand-side: the demand for riders is larger — they can serve a larger area / deliver food faster",2]]},{"id":"DSE2020/P2/Q11(b)","q":"During peak hours the Cross-Harbour Tunnel (designed capacity 2,600 cars/hour) carries 4,400–4,600 cars/hour with 1,500–3,000 m queues. With a supply-demand diagram, explain this phenomenon.","marks":4,"cmd":"Explain & Draw","ch":"ch8","points":[["The tunnel toll is set BELOW the equilibrium (market-clearing) level, so there is EXCESS DEMAND for tunnel passage — shown by queues",2],["Diagram: vertical (capacity-fixed) supply curve with the toll below the intersection, marking the shortage",2]]},{"id":"DSE2020/P2/Q11(d)(f)","q":"(d) Private cars make up more than half of peak-hour cross-harbour traffic, and carry very few persons per vehicle on average. Explain why private cars may be regarded as a major source of tunnel congestion. (f) Suggest ONE proposal, other than toll adjustment, for relieving the congestion, and briefly explain how it works.","marks":4,"cmd":"Explain & Suggest","ch":"ch8","points":[["(d) Private cars take up most of the tunnel capacity while moving the fewest people per vehicle — high road-space use per person carried",2],["(f) e.g. build a new tunnel (adds capacity/supply); subsidise public transport (cuts private car use); raise the first-registration fee on cars (fewer cars on the road)",2]]},{"id":"DSE2023/P2/Q11(a)","q":"Fans of popular singers often complain that they are unable to buy concert tickets at the official prices. With the aid of a demand-supply diagram, explain this phenomenon.","marks":4,"cmd":"Explain & Draw","ch":"ch8","points":[["The concert ticket price is set BELOW the equilibrium price, so there is an excess demand for tickets",2],["Diagram: price line below the intersection, with the horizontal gap (Qd − Qs) marked as the shortage",2]]},{"id":"DSE2025/P2/Q11(b)(i)","q":"The average waiting time for public rental housing units is 5.7 years. Illustrate the economic phenomenon revealed by this with a supply-demand diagram.","marks":2,"cmd":"Draw","ch":"ch8","points":[["Rental set BELOW the equilibrium level",1],["Excess demand (shortage) marked — the queue shows up as years of waiting time",1]]},{"id":"CE1996/P1/Q5","q":"What is the market structure of shops selling sports shoes in Hong Kong? List THREE ways of competition among firms under this market structure.","marks":4,"cmd":"Identify & List","ch":"ch12","points":[["Monopolistic competition",1],["Three forms of price or non-price competition, e.g. price cuts, advertising, better service, store location",3]]},{"id":"CE1999/P1/Q9(d)","q":"Give TWO features of the market structure of supermarkets in Hong Kong.","marks":2,"cmd":"Give","ch":"ch12","points":[["A few dominating firms with interdependent decisions",1],["Differentiated products / non-price competition / entry barriers",1]]},{"id":"CE2000/P1/Q9(c)","q":"What is the market structure of petroleum companies (e.g. Shell, Mobil) in Hong Kong? Explain your answer.","marks":3,"cmd":"Identify & Explain","ch":"ch12","points":[["Oligopoly",1],["A few dominating firms whose decisions are interdependent, using non-price competition / price leadership",2]]},{"id":"CE2002/P1/Q5","q":"State THREE features of the market structure of stores selling computer hardware in the Golden Computer Centre.","marks":3,"cmd":"State","ch":"ch12","points":[["Many sellers and many buyers",1],["Differentiated products / easy entry and exit",1],["Imperfect information / price and non-price competition",1]]},{"id":"CE2005/P1/Q3(b)","q":"To what type of market structure does the telecommunication industry of Hong Kong belong? State THREE features of this type of market structure.","marks":4,"cmd":"Identify & State","ch":"ch12","points":[["Oligopoly",1],["A few dominating sellers; interdependency",1],["Non-price competition; entry barriers; imperfect information",2]]},{"id":"CE2008/P1/Q3","q":"Nokia, Samsung and Motorola all manufacture mobile phones. What is the market structure of mobile phone manufacturers? State THREE features of this type of market structure.","marks":4,"cmd":"Identify & State","ch":"ch12","points":[["Oligopoly",1],["A few dominating firms; price searchers; interdependence of policies",2],["Heterogeneous products / non-price competition / entry barriers / imperfect information",1]]},{"id":"CE2010/P1/Q4","q":"What is the market structure of mobile phone retailing shops in Hong Kong? State THREE features of this type of market structure.","marks":4,"cmd":"Identify & State","ch":"ch12","points":[["Monopolistic competition",1],["Many sellers; free entry and exit",1],["Heterogeneous products; imperfect information; non-price competition; price searcher",2]]},{"id":"DSEPP/P2/Q11(c)","q":"In Hong Kong, to which type of market structure do textbook publishers belong? State TWO features of this type of market structure.","marks":3,"cmd":"Identify & State","ch":"ch12","points":[["Oligopoly (or monopolistic competition)",1],["Two matching features: a few dominant sellers + interdependence + entry barriers (oligopoly), OR many sellers + heterogeneous goods + free entry (monopolistic competition)",2]]},{"id":"DSE2012/P2/Q12(a)","q":"Most private housing is constructed by several major property developers in Hong Kong. State the market structure of the private housing market and list TWO features of it.","marks":3,"cmd":"Identify & List","ch":"ch12","points":[["Oligopoly",1],["A few dominating firms; price searchers; interdependence of pricing; not easy to enter (any two)",2]]},{"id":"DSE2014/P2/Q2(c)","q":"Identify the market structure of mobile phone accessories retailers in Hong Kong. Give TWO reasons to support your answer.","marks":3,"cmd":"Identify & Explain","ch":"ch12","points":[["Monopolistic competition",1],["Many sellers with no dominant seller; heterogeneous products; free entry (any two)",2]]},{"id":"DSE2016/P2/Q10(a)","q":"The diagram shows the market shares of the top 10 solar PV module manufacturers in 2012 (with no single dominant seller and many producers). What was the market structure of the solar PV module market? List TWO features.","marks":3,"cmd":"Identify & List","ch":"ch12","points":[["Monopolistic competition",1],["Many sellers/price searchers; (slightly) differentiated products; non-price competition; imperfect information (any two)",2]]},{"id":"DSE2017/P2/Q3","q":"(A chart shows a market in 2015 dominated by several large firms.) What was the market structure of the market in 2015? List TWO features.","marks":3,"cmd":"Identify & List","ch":"ch12","points":[["Oligopoly",1],["Several dominant firms; entry barriers; interdependent pricing strategies; imperfect information (any two)",2]]},{"id":"DSE2020/P2/Q9(a)","q":"Ocean Park and Hong Kong Disneyland are the two large theme parks in Hong Kong. What is the market structure of the theme park industry? List TWO features.","marks":3,"cmd":"Identify & List","ch":"ch12","points":[["Oligopoly",1],["A few dominant sellers; interdependency of pricing; price and non-price competition (any two)",2]]},{"id":"DSE2024/P2/Q1(b)(c)","q":"Telecom market shares (2023): Hong Kong Telecommunications 55%, Hong Kong Broadband Network 35%, Others 10%. (b) What was the market structure and TWO distinguishing features? (c) Unlike Hong Kong, City A has only one telecom company — suggest ONE possible source of monopoly power.","marks":4,"cmd":"Identify & Suggest","ch":"ch12","points":[["(b) Oligopoly",1],["(b) A few dominant sellers; interdependent pricing strategy / price rigidity",2],["(c) Government franchise / high set-up cost (natural monopoly) / government ownership",1]]},{"id":"DSE2013/P2/Q1","q":"There are many travel agencies in Hong Kong providing tour groups and air-ticket booking. Give TWO reasons why the market structure of travel agencies is NOT perfect competition.","marks":4,"cmd":"Explain","ch":"ch12","points":[["Sellers provide heterogeneous services, e.g. different tour groups",2],["Market information is imperfect, e.g. about routes and services / both price and non-price competition exist",2]]},{"id":"DSE2018/P2/Q12(a)","q":"A hotel booking site shows two 5-star Tsim Sha Tsui hotels of different size and features at different prices. Give TWO reasons why the market structure of Hong Kong's hotel industry is NOT perfectly competitive.","marks":4,"cmd":"Explain","ch":"ch12","points":[["Sellers provide heterogeneous services, e.g. rooms of different size/features",2],["Market information is imperfect (about service quality) / hotels are price searchers charging different rates for similar rooms",2]]},{"id":"DSE2021/P2/Q4","q":"Give TWO reasons to explain why the smartphone market is NOT perfectly competitive.","marks":4,"cmd":"Explain","ch":"ch12","points":[["Sellers provide heterogeneous goods, e.g. smartphones with different specifications",2],["Non-price competition exists (e.g. advertising) / market information is imperfect (about phone performance)",2]]},{"id":"DSE2022/P2/Q11(c)","q":"Four stored-value facilities (AlipayHK, Octopus, Tap & Go, WeChat Pay HK) differ in the transport they cover and the promotions they offer. Explain with TWO reasons why the market of stored-value facilities in Hong Kong is NOT perfectly competitive.","marks":4,"cmd":"Explain","ch":"ch12","points":[["Heterogeneous goods — some facilities work on most public transport, others do not",2],["Non-price competition — different facilities run different promotions to attract customers",2]]},{"id":"DSE2025/P2/Q2(a)","q":"There are many yoga studios providing yoga classes in Hong Kong. Give
