","free goods; they are used for advertising purposes","economic goods; the passers-by want them","economic goods; they are limited in supply relative to people's wants"],"ans":3,"why":"The samples ran out within an hour — proof that quantity demanded exceeded quantity supplied at the zero price charged, which is exactly the definition of a scarce (economic) good. Being handed out 'free of charge' doesn't make something a free good in the technical sense if it's limited relative to demand."},{"id":"CE1998/P2/Q2","q":"Which of the following statements about goods are correct? (1) Free goods are free of charge. (2) Natural resources are free goods. (3) Inputs are economic goods. (4) Outputs are economic goods.","opts":["(1) and (2) only","(1) and (4) only","(2) and (3) only","(3) and (4) only"],"ans":1,"why":"Free goods are indeed free of charge (1) since nobody will pay for a good they don't want more of. Outputs, being produced using scarce inputs and generally wanted by consumers, are economic goods (4). But natural resources are not automatically free goods — many (like land or minerals) are scarce; and inputs aren't automatically economic goods either — some (like sunlight for a solar farm) can be free."}]},{"id":"in6","ch":"ch1","text":"Classifying a good as public/private hinges on rivalry and excludability of CONSUMPTION — not on who owns it, whether government provides it, or the cost of producing it. A government-run service can still be a private good (e.g. one patient occupying a public hospital bed at a time).","qs":[{"id":"DSE2013/P1/Q6","q":"The television broadcast of European football matches is","opts":["a public good if citizens can enjoy the broadcast of matches in public areas like restaurants and Karaoke lounges.","a private good if a local television broadcasting company has purchased the exclusive right to broadcast in Hong Kong.","a free good because there is no cost in serving an additional viewer.","a producer good if the broadcast is used to teach the children in a football training school."],"ans":3,"why":"A producer (capital) good is one used as an input to produce something else — using the broadcast to teach students in a training school is exactly that. Watching in public venues doesn't make it a 'public good' in the technical non-rivalrous/non-excludable sense, and zero marginal cost for one more viewer doesn't by itself make it a free good if scarcity/exclusivity still applies."},{"id":"DSE2018/P1/Q5","q":"Which of the following statements about the exhibits in the Louvre Museum is correct?","opts":["They are public goods because the Louvre Museum is open to the public.","They are capital because they are man-made resources used in production.","They are consumer goods because more of them are preferred.","They are economic goods because they satisfy human wants."],"ans":1,"why":"The exhibits are used by the museum to produce the 'museum experience' service for visitors — an input into production, making them capital goods. Being open to the public doesn't make something a public good in the strict (non-rivalrous/non-excludable) sense, since museum entry is typically ticketed and limited."},{"id":"DSE2023/P1/Q5","q":"Which of the following statements about the classification of goods is correct?","opts":["Musical instruments used by street performers are public goods because the music performed with these instruments can be enjoyed concurrently by many people.","Textbooks are private goods because the marginal cost of producing an additional unit of textbooks is positive.","Artworks exhibited in the Hong Kong Palace Museum are consumer goods because costs are involved in their production.","Popular free online videos for learning English are economic goods because their quantities are not enough to satisfy human wants."],"ans":3,"why":"The precise test for an economic good is that human wants for it exceed what is freely available. Free online videos still require scarce resources (a teacher's time, production effort) to create, and demand for more/better/updated educational content is never fully satisfied, making them economic goods. B is wrong because rivalry/exclusivity in CONSUMPTION (not marginal cost of PRODUCTION) is the real test for a private good — the two are related but distinct concepts."}]},{"id":"in7","ch":"ch1","text":"A positive statement doesn't have to be TRUE — it only has to be testable/refutable by facts. Don't assume 'positive' means 'correct': a positive statement can turn out factually wrong and still be positive, because what matters is whether evidence COULD settle it.","qs":[{"id":"DSE2012/P1/Q1","q":"Which of the following statements are positive statements? (1) More workers will be employed on a part-time basis after the imposition of a minimum wage. (2) Less low skilled workers will be unemployed after the imposition of a minimum wage. (3) Meal times should be counted as working time in the calculation of a minimum wage. (4) The imposition of a minimum wage widens the income gap between the rich and the poor.","opts":["(2) and (3) only","(1) and (4) only","(1), (2) and (3) only","(1), (2) and (4) only"],"ans":3,"why":"Statements (1), (2), and (4) are all testable factual claims about real-world effects — positive statements, even if some later prove empirically wrong. Statement (3) uses 'should,' expressing an opinion about what ought to happen — a normative statement."},{"id":"DSE2018/P1/Q4","q":"The following statements are adapted from the 2017-18 Budget Speech. Statement (1): The global economy in 2016 recorded the slowest growth since the global financial crisis. Statement (2): For 2016 as a whole, there was a growth of 1.9%, consistent with the 1% to 2% economic growth as forecast in last year's Budget. Statement (3): While recognising the effect of market forces, the Government should play an active role as a facilitator by taking forward appropriate policies with good use of public resources. Which of the above is a normative statement / are normative statements?","opts":["(1) only","(3) only","(1) and (2) only","(2) and (3) only"],"ans":1,"why":"Only statement (3) uses 'should,' prescribing what the government ought to do — a value judgment, making it normative. Statements (1) and (2) report factual economic growth figures, which are testable and therefore positive."},{"id":"DSE2021/P1/Q1","q":"Refer to the following statements made by Peter and Mary. Peter: As a developed economy, Hong Kong’s Gini coefficient is too high. Mary: Hong Kong’s Gini coefficient is the highest in Asia. ______________ statement is ______________ because _________________________.","opts":["Peter’s ... positive ... most people agree with it","Peter’s ... normative ... it is inconsistent with the real world data","Mary’s ... positive ... it can be rejected by fact","Mary’s ... normative ... value judgment is involved in the statement"],"ans":2,"why":"Mary's claim is a testable, factual comparison that can be verified or rejected by comparing actual Gini coefficient data across Asian economies — this refutability-by-fact is the defining test of a positive statement. Peter's claim that the Gini is 'too high' involves a value judgment, making it normative, not positive."}]},{"id":"in8","ch":"ch2","text":"Weakening private property rights specifically means restricting the right to USE, receive INCOME from, or TRANSFER an asset — not any policy that touches the asset. A tax obligation or a high price is not the same as a restricted property right; check which of the three rights is actually being limited.","qs":[{"id":"DSE2016/P1/Q5","q":"Marlene had bought a cookery book from a bookstore. Her friend, Kitman, said to her, “You have private property rights to this cookery book.” Which of the following rights would Marlene have after the purchase of the book? (1) To follow the recipes in the book in preparing a dinner for Kitman (2) To scan and upload the whole book to her blog (3) To leave the book on the bookshelf without reading it (4) To lend the book to Kitman and ask for a dinner in return","opts":["(1), (2) and (3) only","(1), (2) and (4) only","(1), (3) and (4) only","(2), (3) and (4) only"],"ans":2,"why":"Private property rights over the book grant Marlene the right to use it (1), to simply hold/not use it (3), and to transfer/lend it in exchange for something (4). Scanning and uploading the whole book (2) would infringe the author's/publisher's separate copyright — owning a physical copy doesn't grant the right to reproduce and distribute its intellectual content."},{"id":"DSE2019/P1/Q1","q":"Refer to the following suggestion for tackling the housing problem. The government should build a new type of housing, called Easy Living, for which the owners can lease their flats at a controlled rent. If the owners want to sell their flats, they can only sell them back to the government. Compared with owning a private housing unit, __________ will be weakened for those owning an Easy Living housing unit. (1) the right to use (2) the right to receive income (3) the right to transfer","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":2,"why":"The controlled rent limits how much income owners can earn from letting the flat (2), and being forced to sell only back to the government restricts the right to freely transfer it to any buyer (3). The right to use the flat (living in it) isn't restricted by these rules, so (1) doesn't apply."},{"id":"DSE2023/P1/Q3","q":"A band in Hong Kong adopted a real-name registration system for the sale of its concert tickets. These tickets were not transferrable so that the chance of ticket scalping was reduced. Which of the following statements about the above real-name registration system is/are correct? (1) It is a mechanism to tackle the problem of ‘what to produce’. (2) The private property rights over the tickets would be weakened under the system. (3) Non-price competition would not be involved in the allocation of the tickets under the system.","opts":["(1) only","(2) only","(3) only","(1), (2) and (3)"],"ans":1,"why":"Making tickets non-transferable directly removes the holder's right to sell/transfer them — a clear weakening of private property rights (2). The scheme is about who gets to buy tickets, not what's produced, so (1) is wrong; and requiring real-name registration and queuing to buy IS a form of non-price competition, so (3) is also wrong."}]},{"id":"in9","ch":"ch2","text":"The defining test for 'market economy' vs 'planned economy' is which mechanism allocates resources (price mechanism vs. government command) plus who owns most resources. Income distribution, unemployment, inflation, and competition levels are NOT guaranteed to differ in a fixed direction between the two systems — treat any option claiming a market economy 'must' have more/less of some outcome with suspicion.","qs":[{"id":"CE1990/P2/Q3","q":"Basic economic problems in a market economy are mainly solved by","opts":["the government.","the price mechanism.","the entrepreneurs.","the consumers."],"ans":1,"why":"In a market economy, prices adjust to balance quantity demanded and supplied, guiding what/how/for whom to produce — this price mechanism, not any single group of decision-makers, coordinates the economy's basic problems."},{"id":"CE1994/P2/Q5","q":"Hong Kong is considered to be market economy because (1) it has a high per capita real gross domestic product (GDP). (2) Price is used as a means to allocate resources in Hong Kong. (3) It has a system of low taxes. (4) Most of its resources are privately owned.","opts":["(1) and (2) only","(1) and (3) only","(2) and (4) only","(3) and (4) only"],"ans":2,"why":"A market economy is defined by resources being allocated through prices (2) and by resources being predominantly privately owned (4) — the two defining structural features. High GDP (1) and low taxes (3) are separate facts about HK, not what defines an economy as market-oriented."},{"id":"CE1998/P2/Q3","q":"As compared to a market economy, a planned economy","opts":["has a less even income distribution.","must have a lower inflation rate.","must have a lower unemployment rate.","has a smaller proportion of privately-owned resources."],"ans":3,"why":"By definition, a planned economy has the state, not private individuals, owning and controlling most resources — this ownership structure is the defining difference. Inflation and unemployment outcomes aren't guaranteed to differ, and planned economies are generally associated with MORE, not less, even income distribution."}]},{"id":"in10","ch":"ch1","text":"Interest doesn't require money, a banking system, or inflation to exist — it's the reward for POSTPONING consumption, and can be paid in kind. Only the absence of SCARCITY would remove the basis for interest, since without scarcity there'd be nothing of value to compensate for giving up.","qs":[{"id":"AL2006/P1/Q11","q":"Interest exists in the absence of","opts":["money.","risks.","a banking system.","All of the above."],"ans":3,"why":"Interest is fundamentally the reward for postponing consumption — it can exist in a barter economy without money (paid in kind), without formal banks, and even without risk (pure time preference alone justifies it), so it exists in the absence of all three."},{"id":"DSEPP/P1/Q3","q":"Which of the following statements about interest are correct? (1) Interest is a premium received for postponing current consumption. (2) An interest rate does not exist in a barter economy. (3) A fall in the interest rate increases present consumption.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":1,"why":"Interest is indeed the premium for deferring consumption (1), and a lower interest rate makes saving less rewarding, encouraging more consumption now (3). Interest still exists in a barter economy — lending goods and receiving more back later doesn't require money — so (2) is false."},{"id":"DSE2016/P1/Q4","q":"Which of the following statements about interest are correct? (1) Interest is the compensation for deferring consumption. (2) Interest exists because people are impatient to wait. (3) Interest exists in a barter economy.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"All three are correct: interest compensates lenders for deferring their own consumption (1), reflects time preference/impatience (2), and can exist in a barter economy through payment in kind rather than money (3)."}]},{"id":"in11","ch":"ch2","text":"'For whom to produce' means who RECEIVES output; 'how to produce' means the production METHOD/factor combination; 'what to produce' means the type/quantity of output. A single policy can touch more than one question at once — check systematically whether it changes WHO gets it, HOW it's made, or WHAT is made, rather than defaulting to just one.","qs":[{"id":"CE1995/P2/Q20","q":"The Housing Authority is considering whether it should raise the income limits of families for the application of public housing. What basic economic problem(s) is/are involved in this consideration?","opts":["What to produce?","How to produce?","For whom to produce?","What and for whom to produce?"],"ans":2,"why":"Deciding who is eligible to receive public housing based on income limits is squarely a 'for whom to produce' (distribution) decision — it doesn't change what's built or how it's built, just who gets access to it."},{"id":"CE2006/P2/Q1","q":"Since the opening of Hong Kong Disneyland, some people have suggested a reduction of the ticket price. This suggestion is related to the __________ question(s) in Economics.","opts":["‘what to produce’","‘how to produce’","‘for whom to produce’","‘what, how and for whom to produce’"],"ans":2,"why":"Changing the ticket price changes who can afford to attend — a 'for whom to produce' (distribution) issue, not a decision about what is produced or how it's manufactured."},{"id":"CE2009/P2/Q3","q":"A large number of pregnant mainland women give birth to babies in Hong Kong's public hospitals. Some people have suggested imposing an additional surcharge on these women so as to reduce the number of them in Hong Kong's public hospitals. The above suggestion concerning the service of the public hospitals in Hong Kong is the ______ question in Economics.","opts":["'how to produce'","'for whom to produce'","'what to produce'","'how and for whom to produce'"],"ans":1,"why":"The surcharge is aimed at changing who uses the public hospital service by rationing access via price — a 'for whom to produce' issue, not about what services are offered or the production method."}]},{"id":"in12","ch":"ch5","text":"Land is defined as an UNMODIFIED gift of nature — not by whether it's geographically fixed, costly, or able to move. Wild animals, unextracted minerals, and natural rainfall are land; anything reclaimed, farmed, refined, or built is capital, no matter how 'natural' it still looks.","qs":[{"id":"CE1990/P2/Q13","q":"Which of the following is an example of 'land' in economics?","opts":["reservoirs","factories","rubber plantations","mineral deposits"],"ans":3,"why":"Land in economics means unmodified gifts of nature — mineral deposits underground are exactly that. Reservoirs, factories, and rubber plantations are all man-made or man-cultivated resources, making them capital, not land."},{"id":"CE1991/P2/Q10","q":"Which of the following is an example of land in economics?","opts":["reclaimed land","crude oil underground","gasoline stored underground","Victoria Harbour following improvements"],"ans":1,"why":"Crude oil underground is an unmodified natural resource — land. Reclaimed land and an 'improved' harbour both involve human effort/capital investment, and gasoline is a refined, man-made product, not a raw gift of nature."},{"id":"CE1993/P2/Q8","q":"Which of the following belongs to the factor of production 'land'?","opts":["the reclaimed land in West Kowloon","the fishing grounds in the South China Sea","the MacLehose Trail","the killer whale in the Ocean Park"],"ans":1,"why":"Natural fishing grounds are an unmodified gift of nature — land. Reclaimed land involved human effort (capital), the MacLehose Trail is a maintained/built trail (capital), and a captive killer whale in a park is a man-managed asset, not raw nature."}]},{"id":"in13","ch":"ch5","text":"Entrepreneurship is defined by BEARING RESIDUAL FINANCIAL RISK, not by making decisions or working hard. A government employee (e.g. a school principal) who makes decisions but draws a fixed salary and bears no personal business risk is classified as labour, not an entrepreneur — decision-making power alone isn't the test.","qs":[{"id":"CE1992/P2/Q8","q":"The main function of entrepreneurship is","opts":["to design new products.","to bear risks.","to provide technical expertise.","to make routine business decisions."],"ans":1,"why":"The entrepreneur's defining economic role is bearing the uninsurable business risk of the enterprise (profit or loss). Designing products, providing expertise, and routine decisions can all be delegated to hired labour/management."},{"id":"CE1994/P2/Q15","q":"In economics, the covered playground of a government school is classified as ________ while the principal of the school is classified as a(n) ________.","opts":["capital, entrepreneur","capital, laborer","land, entrepreneur","land, laborer"],"ans":1,"why":"The playground is a man-made resource used in producing education — capital. Since this is a GOVERNMENT school, the principal does not personally bear the financial risk of the enterprise (the defining test for entrepreneurship) — as a salaried decision-maker without personal risk exposure, the principal is classified as labour, not entrepreneur."},{"id":"CE1997/P2/Q57","q":"Mrs. Lee is a hawker. She sells fresh flowers in Mong Kok. Which of the following is INCORRECT?","opts":["She is a secondary producer.","She is a tertiary producer.","She provides entrepreneurial skills.","She provides labour service."],"ans":0,"why":"Selling flowers is a distribution/retail activity — tertiary production, not secondary (manufacturing/processing). As a self-employed hawker she both bears the business risk (entrepreneurship) and does the work herself (labour), so B, C, and D are all correct — only A misclassifies her as secondary."}]},{"id":"in14","ch":"ch4","text":"Division of labour raises productivity, but it does NOT raise job satisfaction or occupational mobility — narrow, repetitive tasks tend to make work more monotonous and workers' skills less transferable. Watch for options that sound like benefits but are actually its downsides.","qs":[{"id":"CE1994/P2/Q59","q":"Which of the following is NOT an advantage of division of laour?","opts":["higher work incentive","higher labor productivity","a smaller amount of tools required","the right person doing the right job"],"ans":0,"why":"Division of labour doesn't inherently raise work incentive — in fact repetitive, narrow tasks can make work more monotonous. Higher productivity, fewer tools needed (no need to equip every worker for every task), and matching the right person to the right job are all genuine advantages."},{"id":"CE2000/P2/Q19","q":"When division of labour is practised,","opts":["workers have greater job satisfaction.","machines are used more intensively.","producers produce a greater variety of goods to suit different consumer tastes.","the occupational mobility of workers increases."],"ans":1,"why":"Since each worker/machine repeats the same narrow task continuously rather than switching between tasks, machines get used more intensively/fully. Division of labour tends to REDUCE job satisfaction (repetitive work), narrows (not widens) product variety per worker, and lowers (not raises) occupational mobility since skills become narrowly specialized."},{"id":"CE2001/P2/Q16","q":"Which of the following is an advantage of division of labour?","opts":["A wider choice of goods and services can be provided.","Workers have a greater incentive to work.","Workers have higher occupational mobility.","Less time is required to train workers."],"ans":3,"why":"Since each worker only needs to master one narrow task rather than an entire process, training time is reduced. Division of labour doesn't widen product choice, doesn't raise work incentive, and actually lowers (not raises) occupational mobility."}]},{"id":"in15","ch":"ch5","text":"When comparing two firms from a table, always compute TOTAL LABOUR-HOURS (workers × hours per worker) rather than eyeballing headcount. A firm with fewer workers can still supply MORE total labour, or be MORE productive per hour, once each worker's much longer hours are properly multiplied through.","qs":[{"id":"CE1993/P2/Q19","q":"The following table shows the output of dresses from a factory in 1991 and 1992. Year 1991 1992; Number of workers employed 20 25; Units of dresses produced 90 000 80 000; Number of working hours per worker 3 000 2 000. The factory employed a ______ quantity of labour in 1992 and the average labour productivity was ______ in that year.","opts":["larger; higher","larger; lower","smaller; higher","smaller; lower"],"ans":2,"why":"Total labour input (worker-hours) fell from 20×3000=60,000 in 1991 to 25×2000=50,000 in 1992 — a SMALLER quantity of labour. But output per labour-hour rose from 90,000/60,000=1.5 to 80,000/50,000=1.6 — HIGHER productivity, giving smaller; higher."},{"id":"CE1996/P2/Q13","q":"Firm A Firm B; Number of workers employed 200 120; Number of working hours per worker 1000 1900; Units of output produced 100 000 110 000. Which of the following comparisons is correct?","opts":["Workers in Firm B have a higher productivity.","Firm B employs more labor services.","Firm B enjoys a greater economics of scale.","Production in Firm B is more capital-intensive."],"ans":1,"why":"Total labour-hours: Firm A = 200×1000=200,000; Firm B = 120×1900=228,000 — Firm B actually employs MORE total labour service despite having fewer workers, since each works far more hours."},{"id":"CE1996/P2/Q14","q":"Firm A Firm B; Number of workers employed 200 120; Number of working hours per worker 1000 1900; Units of output produced 100 000 110 000. Which of the following is a possible reason for the difference in labor productivity of Firm A and Firm B?","opts":["Better training of workers in Firm A","Better working environment in Firm B","A larger labor force in Firm A","A higher wage rate in Firm B"],"ans":0,"why":"Output per labour-hour: Firm A = 100,000/200,000=0.5; Firm B = 110,000/228,000≈0.48 — Firm A is actually slightly more productive per hour worked, so better training of Firm A's workers is a plausible explanation."}]},{"id":"in16","ch":"ch5","text":"Geographical mobility = ease of moving LOCATION; occupational mobility = ease of switching PROFESSION. A measure that makes commuting/relocating easier (transport subsidies, new rail lines) raises geographical mobility; a measure that builds transferable skills (training, job information, fewer licence barriers) raises occupational mobility — don't mix the two up.","qs":[{"id":"CE1990/P2/Q9","q":"The ban on the ivory trade in general harms the ______ craftsmen most because of their relatively ______ ______ mobility.","opts":["younger, low, occupational","younger, high, geographical","older, low, occupational","older, high, geographical"],"ans":2,"why":"Older craftsmen with skills specific to ivory carving find it harder to switch to a different trade — low occupational mobility — so they are hit hardest when their trade is banned; younger workers can more easily retrain into other occupations."},{"id":"CE1991/P2/Q6","q":"Suppose the government provides housing subsidies to teachers serving in the same school for over 10 years. Such a measure will tend to ____ the occupational mobility and ____ the geographical mobility of these teachers.","opts":["increase, increase","decrease, decrease","increase, decrease","decrease, increase"],"ans":1,"why":"The subsidy rewards staying in the SAME school long-term, discouraging teachers from switching schools (lower geographical mobility) or careers (lower occupational mobility) to avoid losing the benefit — both forms of mobility decrease."},{"id":"CE1993/P2/Q14","q":"Lawyers generally have a low occupational mobility because","opts":["they enjoy social status.","they are not skilful in other professions.","they have high opportunity cost in changing jobs.","they are members of the Hong Kong Law Society."],"ans":2,"why":"Lawyers have invested heavily in specialized training and earn high incomes, so switching to another profession means giving up a lot — a high opportunity cost — which discourages them from changing jobs, i.e. low occupational mobility."}]},{"id":"in17","ch":"ch5","text":"More education or training mainly raises labour PRODUCTIVITY (skill), not labour SUPPLY (quantity) — and can even reduce PRESENT supply, since students in school aren't in the workforce yet. Only measures that directly change who is available/willing to work right now (retirement age, minimum working age, childcare access, benefits) change labour supply.","qs":[{"id":"CE1994/P2/Q17","q":"Which of the following factors would tend to increase the labor supply in Hong Kong? (1) the government re-employs some retired civil servants. (2) There are more public holidays each year. (3) There is a greater proportion of males in the population. (4) The educational level of workers becomes higher.","opts":["(1) and (3) only","(1) and (4) only","(2) and (3) only","(2) and (4) only"],"ans":0,"why":"Re-employing retirees (1) directly adds workers back into the labour force, and a greater proportion of working-age males (3, historically associated with higher labour force participation) raises the pool willing to work. More public holidays (2) means fewer working days, reducing labour supplied, and higher education (4) mainly raises productivity/skill, not directly the quantity of labour supplied (and can even delay entry into the workforce)."},{"id":"CE1996/P2/Q12","q":"Which of the following will decrease the labor supply of a country?","opts":["fewer job vacancies","more universities places for students","an increase in the retirement age of workers","an increase in the number of immigrants"],"ans":1,"why":"More university places keep more young people in education rather than joining the workforce, reducing labour supply. Fewer job vacancies affects labour DEMAND, not supply; a higher retirement age and more immigrants both ADD to labour supply, not reduce it."},{"id":"DSE2014/P1/Q9","q":"Which of the following will increase the labour supply of an economy?","opts":["More firms allow male employees to take paternity leave.","More companies offer free transport to employees working overtime.","Universities provide more full-time associate degree programmes for secondary school graduates.","The government adopts maximum working hours for the civil servants."],"ans":1,"why":"Free transport for overtime work encourages employees to work MORE hours, raising labour supply. Paternity leave takes fathers OUT of work temporarily (reducing supply), more full-time degree programmes keep graduates in education longer (delaying workforce entry), and maximum working hours caps (rather than raises) hours supplied."}]},{"id":"in18","ch":"ch5","text":"Higher output under piece rate is not free — it typically comes with LOWER quality, since workers rush to maximise units produced rather than take care. When a scenario shows output rising alongside more defects, that's the signature of a switch TO piece rate (or the reverse if output falls and quality improves).","qs":[{"id":"CE1996/P2/Q16","q":"An employer has changed the method of payment to his employees and observed the following results: Old system New System; Output per worker (per day) 200 300; Output with quality below standard 20 50. Most probably the old system is __________ and the new system is __________ .","opts":["Time rate ... piece rate","Piece rate ... time rate","A profit sharing scheme ... time rate","piece rate ... A profit sharing scheme"],"ans":0,"why":"Output rose sharply (200→300) while quality problems also rose (20→50) after the change — the classic signature of switching FROM time rate (steady but less driven output) TO piece rate (higher output incentive, but workers rush and sacrifice quality)."},{"id":"CE2003/P2/Q18","q":"A factory owner has changed the method of payment to his workers and observes a higher labour productivity of his workers, but a lower quality of output. Most probably the old payment system is _______ and the new payment system is _______.","opts":["time rate ... piece rate","piece rate ... time rate","profit sharing scheme ... time rate","piece rate ... profit sharing scheme"],"ans":0,"why":"Higher output but lower quality is the classic effect of switching FROM time rate (steady, less output-driven) TO piece rate (strong incentive to produce more, at the cost of care/quality)."},{"id":"CE2011/P2/Q19","q":"A factory owner observed the following results after changing the method of payment to his workers: Old System New System; Output per worker (per day) 1 000 units 800 units; Output with quality below standard 20 units 5 units. Most probably the old system is ______ and the new system is ______.","opts":["time rate ... piece rate","piece rate ... time rate","a profit sharing scheme ... piece rate","time rate ... a profit sharing scheme"],"ans":1,"why":"Output fell (1000→800) while quality improved (fewer substandard units, 20→5) — the classic effect of moving AWAY from piece rate (which drives high quantity but sacrifices quality) TOWARD time rate (steadier, more careful, lower-pressure output)."}]},{"id":"in19","ch":"ch5","text":"Commission, profit-sharing, and piece rate all shift some business RISK from the employer onto the worker, and all tend to LOWER the employer's need to actively monitor performance, since pay is already tied to results. A fixed salary is the opposite on both counts — lowest risk-sharing, highest monitoring cost.","qs":[{"id":"AL2000/P1/Q16","q":"Inside a firm, paying workers by the hour is chosen because","opts":["workers are not honest.","workers have different levels of productivity.","the activities performed by workers are not easily standardized.","the monitoring cost is low."],"ans":2,"why":"Time rate is chosen precisely when output is hard to measure or tasks aren't standardized, since piece rate requires countable, uniform units of output. Time rate actually has a HIGHER (not lower) monitoring cost since employers must watch that workers stay productive; honesty and productivity differences aren't the defining reason for choosing time rate."},{"id":"CE2006/P2/Q16","q":"Suppose the wage payment system of the salesmen employed in ABC Company changes as follows: Salary: $15 000 per month → Salary: $7 000 per month plus commission. It results in:","opts":["a lower cost of calculating the wage payments.","a lower cost of monitoring the salesmen's performance.","a lower income for the salesmen.","a lower quality of services provided by the salesmen."],"ans":1,"why":"With commission tied to actual sales performance, salesmen are self-motivated to sell well, reducing how much the employer needs to actively monitor/supervise them. Calculating commission is actually MORE complex (not less) than a flat salary, income isn't necessarily lower (could rise with good sales), and service quality tends to improve (not worsen) since salesmen want to close sales."},{"id":"CE2009/P2/Q18","q":"Whose employer would have the highest cost in monitoring the performance of his work?","opts":["an office clerk who is paid with a fixed monthly salary","a property agent who is paid through commission","a tourist guide who is paid with tips","a movie star who shares the profit with his film producer"],"ans":0,"why":"A fixed monthly salary gives the least direct performance-based incentive, so the employer must actively monitor to ensure the clerk stays productive — the highest monitoring cost. Commission, tips, and profit-sharing all build in a self-motivating incentive tied to actual performance, reducing the need for close monitoring."}]},{"id":"in20","ch":"ch4","text":"The SAME physical good can be a consumer good or a capital (producer) good — classification depends on USE, not the item. Flour is a capital good in a TV cooking programme (input to production) but a consumer good in a home birthday cake. Always ask: is it being used by a firm to produce something else, or consumed directly by a household? Watch out for the perspective the question asks about (e.g. USB gifts are producer goods TO THE ORGANISER handing them out for publicity).","qs":[{"id":"CE1992/P2/Q6","q":"Air-conditioners used in restaurants can be classified as (1) capital goods. (2) consumer goods. (3) scarce goods.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2) and (3)"],"ans":1,"why":"AC units used by the restaurant to run its business are an input into production — capital goods — and since they're scarce (real resources with a cost), they're also scarce/economic goods. They are NOT consumer goods here since the restaurant (a producer), not a final household consumer, uses them directly."},{"id":"CE1995/P2/Q14","q":"Electric fans installed in classrooms are classified as (1) consumer goods. (2) capital goods. (3) economic goods.","opts":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"ans":3,"why":"Fans used by a school to deliver its education service are an input into production — capital goods — and since they're scarce, they're economic goods too. They are NOT consumer goods, since the school (a producer), not the end household consumer, uses them directly."},{"id":"CE1999/P2/Q10","q":"Which of the following are capital goods of a school? (1) teacher's knowledge of economics (2) notes taken by the students (3) watch-dogs","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":1,"why":"A teacher's knowledge (embodied human capital) and guard dogs (used to protect the school premises) are both resources the school uses as inputs to produce its education service — capital goods. Students' own notes are not a resource the SCHOOL uses in production; they belong to and are used by the student."},{"id":"CE2007/P2/Q12","q":"Flour is a ________ when ________.","opts":["capital good ... it is used by Mrs Chan to make a cake for her daughter's birthday","consumer good ... it is for sale in the market","capital good ... it is used in a cooking program shown on the television","consumer good ... it is packed for delivery to customers"],"ans":2,"why":"Flour used as an input to produce a TV cooking programme (a broadcast product) is a capital good — an input into producing something else. Flour used directly by a household to bake a birthday cake is a CONSUMER good, not capital, so that option is wrong; flour still awaiting sale or delivery hasn't yet been assigned a final use, so it can't be classified either way at that stage."}]},{"id":"in21","ch":"ch4","text":"Employment-share tables prove only what they show. A rising % share of tertiary employment does NOT let you conclude anything about GDP contribution, living standards, wages, productivity, or actual head-counts (shares can rise while absolute numbers fall if the total labour force shrinks). The one safe conclusion is always about RELATIVE IMPORTANCE IN EMPLOYMENT itself. Similarly, a production-VALUE table says nothing about workers.","qs":[{"id":"CE1993/P2/Q5","q":"Employment in primary, secondary and tertiary industries in 1981 and 1991 is shown in the table. Based on the above information,","opts":["the primary sector employed the same number of workers in 1981 and 1991.","the total value of secondary products was lower in 1991.","tertiary production is becoming more important in terms of its contribution to employment.","real income earned in the tertiary sector was higher in 1991."],"ans":2,"why":"The data track EMPLOYMENT shares only, and show the tertiary sector's share of employment rising over the decade — supporting a growing importance of tertiary production in employment terms. Employment-share data alone can't confirm the exact number of primary workers stayed constant, the VALUE of secondary output, or REAL INCOME levels, since those require price and output data the table doesn't give."},{"id":"CE2004/P2/Q19","q":"% share of total employment: Country A / Country B — Primary production 3 / 1, Secondary production 46 / 25, Tertiary production 51 / 74. From the above table, we can conclude that","opts":["most people in country B enjoy a higher living standard than most people in country A.","most people in each of the countries engage in tertiary production.","more people engage in tertiary production in country B than in country A.","All of the above are correct."],"ans":1,"why":"Both countries show tertiary production employing more than half their workforce (51% in A, 74% in B), so 'most people in each country engage in tertiary production' is directly confirmed. We're given percentage SHARES only, not the size of each country's total labour force, so we can't compare actual head-counts between the two countries (C), and employment shares alone say nothing about income or living standards (A)."},{"id":"CE2007/P2/Q13","q":"The following table shows the employment distribution of Hong Kong. Sector 1985/1997/2005 — Primary 2.2%/0.5%/0.4%, Secondary 43.5%/20.4%/13.7%, Tertiary 54.3%/79.1%/86.0% (Total 100% each year). From the above table, we can conclude that from 1985 to 2005,","opts":["the number of people engaged in the primary and secondary sectors decreased while that in the tertiary sector increased.","the overall unemployment rate remained constant.","the contribution to gross domestic product (GDP) of the tertiary sector increased.","the relative importance of the secondary sector in terms of employment decreased."],"ans":3,"why":"The table gives EMPLOYMENT percentage shares only, and it directly shows the secondary sector's share falling from 43.5% to 13.7% — confirming its relative importance in employment declined. It does NOT give the total labour-force size (so actual headcount changes can't be confirmed, ruling out A), unemployment data (ruling out B), or GDP/output data (ruling out C, since a rising employment share doesn't necessarily mean a rising GDP contribution)."},{"id":"CE2008/P2/Q13","q":"Hong Kong's gross domestic product (GDP) at factor cost was higher in 2005 than in 2001. Charts show the contribution to GDP at factor cost by sectors in 2001 and 2005, respectively. Based on the above information, we can conclude that in the year 2005,","opts":["workers in the tertiary sector on average earned more than those in the secondary sector.","the labour productivity of the secondary sector decreased.","the output value of the primary sector increased.","the number of workers in the tertiary sector increased."],"ans":2,"why":"The charts give each sector's percentage contribution to total GDP at factor cost, and total GDP at factor cost was higher in 2005 than 2001. Multiplying a sector's % share by that year's total GDP gives its absolute output value, so the primary sector's output value can be shown to have risen. Average earnings or labour productivity (A, B) can't be inferred from a GDP-contribution chart, since that needs the number of workers in each sector too, and the chart gives no employment/headcount data (D)."}]},{"id":"in22","ch":"ch4","text":"'Production' in economics is broader than paid work: unpaid, illegal, and self-serving activities all count if they create value (sewing your own dress, selling pirated CDs, students selling charity flags). What does NOT count is pure leisure/consumption (playing with a pet, watching TV). And repair work is a SERVICE (tertiary), not secondary production.","qs":[{"id":"CE1992/P2/Q4","q":"Which of the following is classified as consumption?","opts":["A student saves up unused Christmas cards until next Christmas.","A student helps to clean his classroom.","Mrs. Hong teaches a TV audience how to cook.","A student watches a music TV programme."],"ans":3,"why":"Consumption means using up a good or service purely for direct satisfaction, without creating anything of value for others — watching a TV programme is pure consumption. Saving unused cards involves no economic activity at all (neither production nor consumption); cleaning a classroom and teaching cooking on TV both create value/utility for others, so both count as production even though unpaid."},{"id":"CE1994/P2/Q60","q":"Which of the following activities is NOT classified as production?","opts":["a mother teaching her child to read","a son helping his mother to serve dinner at home","a father repairing a TV set at home","a daughter playing with her cat at home"],"ans":3,"why":"Playing with a pet is pure leisure — a personal consumption activity that creates no value or service for anyone else, so it isn't production. Teaching a child, helping serve dinner, and repairing a TV set all create useful value/services for someone, even when unpaid and done at home — all count as production in economics."},{"id":"CE2002/P2/Q12","q":"Which of the following statements about production is correct?","opts":["Developed countries have no primary production.","Students selling flags for charity organizations are engaging in production.","An Indian restaurant engages in tertiary production only.","The car repair work belongs to secondary production."],"ans":1,"why":"Selling flags to raise money still counts as production in the economic sense — any activity that creates or provides value/utility counts as production, regardless of whether it's paid, and regardless of the purpose. Developed economies still retain some primary production (e.g. agriculture, fishing), just a smaller share; classifying a restaurant as tertiary 'only' overstates the case; and car repair is itself a SERVICE (tertiary), not manufacturing (secondary)."},{"id":"CE2003/P2/Q15","q":"Which of the following activities are classified as production in economics? (1) a man delivering newspapers (2) a girl sewing her own dress (3) a boy selling pirated compact discs (CD)","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":3,"why":"Delivering newspapers (a transport/service activity), sewing one's own dress (creating a good, even for personal, unpaid use), and selling pirated CDs (a distribution activity) all involve creating or providing something of value — meeting the broad economic definition of production, which doesn't require the activity to be legal, paid, or done for someone else, only that value/utility is added."}]},{"id":"in23","ch":"ch6","text":"Diminishing marginal returns requires ONE FIXED FACTOR. If a table shows ALL inputs rising together (machines AND workers), it's a change in SCALE — answer with economies/diseconomies of scale, never with the law of diminishing returns. The reverse trap also appears: if only one input varies with another fixed, never answer 'economies of scale'.","qs":[{"id":"CE2000/P2/Q16","q":"Number of machines / Number of workers / Total output (units): 3/3/90, 3/4/160, 3/5/250, 3/6/360. The above data refer to a ______ situation in which _______.","opts":["short run ... the law of diminishing returns applies","short run ... the law of diminishing returns does not apply","long run ... economies of scale exist","long run ... diseconomies of scale exist"],"ans":1,"why":"With the number of machines held fixed at 3, this is a SHORT-RUN scenario. Marginal output per additional worker is 70, then 90, then 110 units — INCREASING, not diminishing, over this observed range, so the law of diminishing returns does not (yet) apply here."},{"id":"CE2008/P2/Q18","q":"When a firm expands production by only employing more labour,","opts":["the wage rate of its workers will increase.","the average productivity of its workers will increase.","the firm will enjoy economies of scale.","the marginal product of its workers will eventually decrease."],"ans":3,"why":"Since other factors are held fixed while only labour is added, the definition of the law of diminishing returns applies directly: eventually the marginal product of each extra worker will decrease. This doesn't automatically raise the wage rate (set by the labour market, not this decision alone), doesn't guarantee rising average productivity (which typically falls too once diminishing returns set in), and isn't economies of scale, which requires ALL inputs — not just labour — to expand."},{"id":"DSE2015/P1/Q9","q":"The table below shows the total product of Firm A, which employs only capital and labour in production. Labour(units)/Capital(units)/Total Product(units): 12/2/110, 12/3/130, 12/4/160, 12/5/X. Which of the following statements about Firm A is correct?","opts":["If the above data illustrate the law of diminishing marginal returns, the value of X can be equal to 180.","If the above data illustrate the law of diminishing marginal returns, the value of X can be equal to 190.","If the above data illustrate the law of diminishing marginal returns, the value of X can be larger than 200.","The law of diminishing marginal returns does not apply to Firm A because capital is not a fixed factor."],"ans":0,"why":"With labour fixed at 12 and capital as the variable factor, total product rises from 110 to 130 (marginal product 20) then to 160 (marginal product 30). If diminishing marginal returns is now setting in, the marginal product of the 5th unit of capital must be smaller than 30, meaning X must be smaller than 160+30=190. A value of 180 (marginal product =20, smaller than 30) is consistent, so X CAN equal 180; but 190 would mean an unchanged marginal product, and anything above 200 would mean marginal product kept RISING, contradicting diminishing returns. The law doesn't require capital specifically to be the fixed factor — it applies to whichever factor is held fixed while another varies, and here labour is the fixed factor, so D is wrong."},{"id":"DSE2019/P1/Q5","q":"The following table shows the production data of a firm. The only inputs required are capital and labour. Capital(units)/Labour(units)/Total product(units)/Total cost of production($): 2/2/10/100, 3/3/30/270, 4/4/45/360, 5/5/55/385. Based on the above table, we can conclude that","opts":["the law of diminishing returns applies to the firm.","the total fixed cost is $100.","the optimal scale is 45 units.","the firm enjoys economies of scale."],"ans":3,"why":"Capital and labour both scale up together here (2→3→4→5 for each), so this is a pure SCALE change, not a fixed-factor scenario — ruling out the law of diminishing returns (A), which requires one factor held fixed. Since every input is variable, there's no genuinely fixed cost component here either (B). Average cost = total cost/total product is $10, $9, $8, then $7 — falling continuously as scale rises, the very definition of economies of scale (D) — and since AC is still falling at 55 units, we can't say 45 units is the 'optimal' lowest-AC scale (C)."}]},{"id":"in24","ch":"ch6","text":"'Diminishing' means marginal product FALLS compared with the previous unit — it does NOT need to stay positive. MP can legitimately fall into negative territory (total output actually drops) and still illustrate the law. But an UNCHANGED marginal product (e.g. 20 then 20 again) is NOT diminishing.","qs":[{"id":"CE1994/P2/Q21","q":"The law of diminishing returns","opts":["States that firms will keep on adding variable factors to fixed factors.","Implies that firms will eventually operate at a loss.","Implies that marginal product can be negative.","Explains production in the long run."],"ans":2,"why":"As ever more of a variable factor is added to a fixed factor, eventually marginal product can even turn negative if severe overcrowding actually reduces total output. The law doesn't claim firms WILL necessarily keep adding factors (A), doesn't imply losses (B — it's about physical output, not profit or cost), and it's specifically a SHORT-RUN concept requiring a fixed factor, not a long-run one (D)."},{"id":"DSE2021/P1/Q11","q":"The following table shows the production plan of a firm which employs two factors only, namely labour and machinery. Labour(units)/Machinery(units)/Total output(units): 1/2/10, 2/2/25, 3/2/45, 4/2/Q1, 5/2/Q2. Suppose the above data illustrates the law of diminishing marginal returns. Which of the following figures are consistent with the law? (1) Q1 = 60; Q2 = 70 (2) Q1 = 40; Q2 = 30 (3) Q1 = 65; Q2 = 85","opts":["(1) only","(3) only","(1) and (2) only","(2) and (3) only"],"ans":2,"why":"Marginal product through the 3rd unit of labour is 10, 15, then 20 — increasing. For diminishing returns to set in from the 4th unit onward, each subsequent marginal product just needs to keep falling — it doesn't have to stay positive, since the law explicitly allows marginal product to eventually turn negative under severe overcrowding. (1) gives marginal products 15 then 10, both smaller than the previous and still positive — consistent. (2) gives −5 then −10, each smaller again than the one before (20 > −5 > −10) — still a valid (if extreme) case of diminishing marginal product, so also consistent. (3) gives marginal product 20 both times — unchanged from the 3rd worker's marginal product of 20, so returns aren't diminishing at all."}]},{"id":"in25","ch":"ch6","text":"Average product vs marginal product: AP rises whenever MP is ABOVE it (even if MP itself is already falling), and AP peaks where MP crosses it. Given an AP table, always convert to totals (TP = AP × units) and then compute MP — never read 'diminishing returns' straight off a rising or falling AP column.","qs":[{"id":"CE1990/P2/Q6","q":"No. of Workers / Marginal Output: 1/10, 2/12, 3/14, 4/13, 5/12. From the above table, the average output will be the highest when ________ workers are employed.","opts":["2","3","4","5"],"ans":2,"why":"Cumulating marginal output gives total product 10, 22, 36, 49, 61 for 1–5 workers; average output = total/workers is 10, 11, 12, 12.25, 12.2 — highest at exactly 4 workers (12.25), since average output rises as long as the incoming worker's marginal output (13 for the 4th) exceeds the prior average, and only starts falling once the 5th worker's marginal output (12) drops below it."},{"id":"CE1996/P2/Q23","q":"No. of workers: 1 2 3 4 — Average product (units): 2 6 7 4. Refer to the above table. Diminishing marginal return sets in after ______ workers are employed in production.","opts":["1","2","3","4"],"ans":1,"why":"Total product = average product × workers: 2, 12, 21, 16 for 1–4 workers. Marginal product (the change in total product) is 2, 10, 9, then −5 — rising from the 1st to 2nd worker, then falling from the 3rd worker onward. Diminishing marginal returns is said to set in after 2 workers, since adding the 3rd worker is the first to show a smaller marginal product than before."},{"id":"CE1999/P2/Q15","q":"No. of workers / Marginal Output (Units): 1/10, 2/12, 3/11, 4/10, 5/7. From the above table, the average output will start to diminish when the ______ worker is put to work.","opts":["first","second","third","fourth"],"ans":3,"why":"Cumulating marginal output gives total product 10, 22, 33, 43, 50; average output = total/workers is 10, 11, 11, 10.75, 10 for 1–5 workers. Average output holds steady at 11 through the 2nd and 3rd workers, then starts to fall once the 4th worker is put to work (10.75 < 11)."},{"id":"DSE2018/P1/Q10","q":"The following table shows the input-output relationship of a firm. The only inputs required are capital and labour. Capital(units)/Labour(units)/Marginal product of labour(units): 2/1/5, 2/2/7, 2/3/9, 2/4/8, 2/5/6. The average product of labour is at the highest when the quantity of labour is ___ units.","opts":["2","3","4","5"],"ans":2,"why":"Cumulating marginal product of labour (5, 7, 9, 8, 6) gives total product 5, 12, 21, 29, 35 for 1–5 units of labour; average product = total/labour is 5, 6, 7, 7.25, 7 — peaking at exactly 4 units of labour (7.25) before falling back to 7 at the 5th."}]},{"id":"in26","ch":"ch6","text":"Short run vs long run is about FIXED FACTORS, not calendar time. Short run = at least one fixed factor (plus variable ones, technology constant). In the LONG RUN every factor is variable — so 'fixed costs' and diminishing returns exist only in the short run, and economies of scale exist only in the long run.","qs":[{"id":"CE1996/P2/Q22","q":"Short run is a period in which (1) there are fixed factors of production (2) there are variable factors of production. (3) The technology of production is fixed.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1),(2) and (3)"],"ans":3,"why":"The short run is defined by having at least one fixed factor (1) alongside other factors that can still be adjusted (2), with the underlying production technology held constant throughout (3) — all three correctly describe the short run."},{"id":"DSE2016/P1/Q7","q":"A school is a production unit which provides educational services. The following are people and objects that are usually found at a school: (1) the school building (2) teachers (3) students (4) private cars owned by teachers (5) sanitisers in the toilets. In the long run, which of the above items are variable factors of production of the school?","opts":["(1) and (5) only","(1), (2) and (5) only","(2), (3) and (4) only","(1), (2), (3), (4) and (5)"],"ans":1,"why":"In the long run every genuine factor of production the school actually uses — the building, the teaching staff, and consumable supplies like sanitisers — can be adjusted, since nothing is fixed in the long run. Students are recipients of the education service, not a factor of production, and teachers' private cars aren't a resource the school uses in producing education at all, so neither belongs on this list regardless of time frame."}]},{"id":"in27","ch":"ch6","text":"Classify a cost as fixed or variable by asking: does the expense change with the OUTPUT DECISION in the question? Rent, licence fees, registration fees, loan interest and full-time salaries are fixed; ingredients, electricity, overtime pay and part-time wages are variable. The same item can flip: a driver's own lorry depreciation from use is variable, but its licence fee is fixed.","qs":[{"id":"CE1990/P2/Q11","q":"Which of the following is regarded as a fixed cost of a restaurant?","opts":["the water charges","the wages of the part-time workers","the expenditure on meat and vegetables","the rent of the restaurant"],"ans":3,"why":"Rent must be paid regardless of how much the restaurant produces or serves — a fixed cost. Water charges, part-time wages, and ingredient costs all vary with the level of business activity — variable costs."},{"id":"CE2003/P2/Q10","q":"Suppose the MTR extends its service hours on New Year's Eve. Which of the following are the MTR's variable costs of extending the service hours? (1) electricity expense (2) overtime payment to the drivers (3) interest payment for loans from banks","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":0,"why":"Electricity use (1) and overtime pay (2) both rise directly because of the extra hours of operation — variable costs of that specific decision. Interest on existing bank loans (3) is a fixed financial obligation unrelated to how many extra hours are run."},{"id":"DSE2017/P1/Q10","q":"An art centre extends its business hours for one hour in order to offer more painting classes. Which of the following are variable costs involved in the extra hour of operation? (1) salary of the accountant (2) electricity fee (3) expense on paints (4) rental payment","opts":["(1) and (4) only","(2) and (3) only","(1), (2) and (4) only","(1), (2), (3) and (4)"],"ans":1,"why":"Electricity (2) and paint materials (3) used specifically during that extra hour rise directly because of the decision to extend hours — variable costs. The accountant's salary (1) and rental payment (4) are typically fixed obligations that don't change just because the centre stays open one more hour."}]},{"id":"in28","ch":"ch6","text":"Economies of scale = AVERAGE cost falls as SCALE (all inputs) rises. Two traps in one: (1) it is average cost, not total cost — total cost still rises with output, just less than proportionally; (2) it is a long-run concept — never apply it to a table where one factor is fixed. To test a table: compute AC = TC ÷ output at each scale and watch its direction.","qs":[{"id":"CE1994/P2/Q22","q":"A producer increase all his input to double the output. He finds that the total production cost increase by 80%. This can be explained by","opts":["the law of supply.","The law of diminishing returns.","Economies of scale.","Diseconomies of scale."],"ans":2,"why":"Cost rose by only 80% while output doubled (100%) — cost grew LESS than proportionally to output, meaning average cost per unit fell as scale increased. That's the definition of economies of scale, not diminishing returns (a short-run, fixed-factor concept) or the law of supply, which is unrelated."},{"id":"CE1995/P2/Q22","q":"Which of the following about economies of scale is true?","opts":["It applies to short-run as well as long-run production.","It will lead to a decrease in the average cost of production when the output increases.","It occurs only when the scale of production is sufficiently large.","It will lead to a decrease in the total cost of production when the output increases."],"ans":1,"why":"Economies of scale means average (not total) cost per unit falls as output/scale rises — total cost still increases with more output, just less than proportionally. It is specifically a LONG-RUN concept (all inputs variable, unlike the short run), and can occur across a range of scale, not only once a firm is already large."},{"id":"CE2000/P2/Q17","q":"Which of the following implies the existence of economies of scale?","opts":["The total cost of production decreases when output increases.","The average cost of production decreases when the production scale increases.","Profit increases when output increases.","The amount of output increases by a smaller proportion than that of inputs."],"ans":1,"why":"Economies of scale is precisely defined as average cost falling as the scale of production rises. Total cost normally still rises with more output (just less than proportionally); profit changes aren't a direct definition of economies of scale; and output rising by a SMALLER proportion than inputs actually describes diseconomies of scale, the opposite."},{"id":"CE2001/P2/Q17","q":"The table below shows the production of Good X in a firm. Only two inputs are required. Capital,Labour,Total Output,Total Cost: (1,1,20,$100), (2,2,35,$200), (3,3,45,$300), (4,4,50,$400). From the above data,","opts":["the law of diminishing marginal returns applies to the firm.","the firm enjoys economies of scale.","diseconomies of scale exist for the firm.","the firm produces at its optimal scale of production."],"ans":2,"why":"Capital and labour both scale up proportionally here (a pure change in scale, not a fixed-factor scenario), yet output grows less than proportionally to inputs — average cost rises from 100/20=$5 to 200/35≈$5.71 to 300/45≈$6.67 to 400/50=$8 as scale increases — the signature of diseconomies of scale."}]},{"id":"in29","ch":"ch6","text":"INTERNAL vs EXTERNAL economies of scale: internal come from the firm's OWN expansion; external come from the growth or clustering of the whole industry/district (flower street, foodie building, government-trained nurses). If the benefit would arrive without the firm itself growing, it's external.","qs":[{"id":"DSE2013/P1/Q5","q":"In order to increase the number of nurses for expanding medical services, the government has allocated more resources to expand the nursing programme in universities. In this case, private hospitals will","opts":["enjoy internal economies of scale.","suffer internal diseconomies of scale.","enjoy external economies of scale.","suffer external diseconomies of scale."],"ans":2,"why":"The benefit (more trained nurses available) comes from the government/industry-wide expansion of training capacity, not from any individual hospital expanding its own scale of operation — the defining test of an external economy of scale, distinct from an internal one which comes from a firm's own growth."},{"id":"DSE2020/P1/Q7","q":"Tai On Building in eastern Hong Kong Island is well-known as a 'foodie paradise'. A variety of street snacks are sold by numerous small vendors. Customers from different districts fill their stomachs at Tai On Building. Based on the above information, street snack vendors at Tai On Building can _________.","opts":["enjoy internal economies of scale","enjoy external economies of scale","suffer internal diseconomies of scale","suffer external diseconomies of scale"],"ans":1,"why":"The vendors benefit from being clustered together, drawing more customers collectively than any one small vendor could alone — a benefit arising from the group/location, not from any individual vendor's own expansion — the defining test of an external economy of scale."},{"id":"DSE2025/P1/Q11","q":"Miss Chan plans to open a flower shop. She is considering whether to open at Flower Market Road, a district famous for having lots of flower shops, or at another location with no flower shops nearby. Based on the above information, an advantage for Miss Chan to open at Flower Market Road is that she may be able to _____. (1) enjoy internal economies of scale in terms of lower transportation costs (2) enjoy external economies of scale in terms of lower marketing costs (3) sell flowers at a higher price due to keener competition among sellers","opts":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"ans":1,"why":"Being part of a recognized flower district lets all nearby shops benefit from shared reputation and foot traffic, lowering each seller's individual marketing costs — a genuine EXTERNAL economy of scale, arising from the cluster rather than Miss Chan's own firm growth. Any transportation savings (1) would also stem from the shared location, so labelling them 'internal' is wrong; and keener competition among many nearby sellers would typically push prices DOWN, not up, so (3) is wrong too."}]},{"id":"in30","ch":"ch7","text":"Type-of-expansion decision tree: same product & same stage → HORIZONTAL; different but related products at the same stage → LATERAL; earlier/later stage of the SAME production chain → VERTICAL (backward = towards raw materials/inputs, forward = towards the consumer); totally unrelated business → CONGLOMERATE. Anchor the answer to the acquiring firm's viewpoint.","qs":[{"id":"CE1990/P2/Q18","q":"Which of the following is an example of lateral integration?","opts":["a flour mill combines with a bakery","a jeans factory combines with a swimwear factory","a jewelry manufacturer combines with a noodle factory","a furniture factory combines with a lumbering plant"],"ans":1,"why":"Lateral integration combines two firms producing DIFFERENT but RELATED products at the SAME stage of production — a jeans factory and a swimwear factory are both garment manufacturers using similar cutting/sewing skills and equipment, just for different products. Flour mill+bakery and furniture+lumbering are vertical (input-supplier relationships across different stages), while jewelry+noodles are totally unrelated (conglomerate), not related enough to count as lateral."},{"id":"CE1991/P2/Q21","q":"Cathay Pacific Airways Ltd. took over Hong Kong Dragon Airlines Ltd. This is an example of","opts":["horizontal integration.","lateral integration.","forward vertical integration.","backward vertical integration."],"ans":0,"why":"Cathay Pacific and Dragonair were both airlines providing the same type of service (air transport) at the same stage of production — combining two direct competitors at the same stage is horizontal integration."},{"id":"CE1993/P2/Q24","q":"Which of the following is an example of lateral expansion of a firm?","opts":["A telephone company combines with a telegram company.","A restaurant combines with a supermarket.","A hospital sets up a school to train student nurses.","A furniture company combines with another furniture company."],"ans":0,"why":"A telephone company and a telegram company are both communication service providers at the same stage, offering different but related products — the defining test of lateral expansion. Restaurant+supermarket are unrelated (conglomerate); hospital+nursing school is a backward vertical link (securing its own future labour supply); and two furniture companies combining is horizontal (identical product), not lateral."},{"id":"CE1994/P2/Q27","q":"A travel agent takes over a real estate firm. What kind of integration is this?","opts":["conglomerate integration","lateral integration","vertical integration","horizontal integration."],"ans":0,"why":"Travel services and real estate are entirely unrelated industries with no shared production stage or product line — combining them is pure diversification, the defining test of conglomerate integration."}]},{"id":"in31","ch":"ch7","text":"Match the MOTIVE to the type: 'steady supply of inputs' → backward vertical only; 'guaranteed market outlet' → forward vertical only; 'larger market share / turn rival into partner' → horizontal only; 'spread risk by diversification' → conglomerate (and lateral), but NOT horizontal (same market = same risk). 'Higher profit' is never a safe answer — no expansion guarantees profit.","qs":[{"id":"CE1994/P2/Q28","q":"In Hong Kong, when a commercial bank takes over another commercial bank,","opts":["it has greater influence on deposit rates.","It is able to diversify risk in its business.","Its market share is enlarged.","It will suffer from diseconomies of scale."],"ans":2,"why":"Combining with a DIRECT competitor in the same industry and stage of production is a horizontal merger, and enlarging market share is virtually definitional here, since the combined firm now directly holds the customer base of both banks. Diversifying risk (B) doesn't apply since the two firms are in the SAME line of business; and while a larger bank MIGHT gain more pricing influence (A) or face diseconomies of scale (D), neither is a certain, guaranteed consequence the way enlarged market share is."},{"id":"CE1995/P2/Q28","q":"Which of the following is the greatest benefit from conglomerate integration?","opts":["diversification of product","economies of scale","ensuring the markets for its output","larger market share"],"ans":0,"why":"Since conglomerate integration combines firms in entirely UNRELATED industries, its defining advantage is diversification — spreading business risk across unrelated product lines. Economies of scale (B) requires related/similar production processes that conglomerates lack by definition; ensuring markets for output (C) is a forward-vertical-integration benefit; and larger market share (D) is a horizontal-integration benefit."},{"id":"CE1997/P2/Q20","q":"When a cake shop takes over a coffee shop, which of the following are correct? (1) This can provide an outlet for its products. (2) The resources can be better utilized. (3) The risk of the business is reduced through diversification. (4) The profit will increase.","opts":["(1), (2) and (3) only","(1), (2) and (4) only","(1), (3) and (4) only","(2), (3) and (4) only"],"ans":0,"why":"Adding a coffee shop gives the cake shop's own products a new sales outlet (1), lets it share premises, staff, and equipment more efficiently across the two related businesses (2), and diversifies it into a related but distinct product line, spreading business risk (3). A higher profit (4) is not guaranteed just because a firm expands — success still depends on execution and costs, so it isn't a certain outcome."},{"id":"CE1998/P2/Q21","q":"When a shampoo manufacturer introduces a new product – shampoo for children, it aims at (1) diversifying its market. (2) gaining the economies of scale. (3) ensuring a market outlet for its products.","opts":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"ans":0,"why":"Introducing a children's variant reaches a new customer segment, diversifying the shampoo maker's market (1), and lets it spread the cost of its existing manufacturing, R&D, and distribution infrastructure over a wider product range — economies of scale (2). 'Ensuring a market outlet' (3) describes the benefit of acquiring a RETAIL/distribution business (forward vertical integration) — but simply launching a new product variant doesn't acquire any new outlet, so that motive doesn't apply here."}]},{"id":"in32","ch":"ch6","text":"A change in FIXED cost (rent, registration fee, machine rental) never changes marginal cost, so it never changes the profit-maximising output — it only changes the profit level. Only changes to VARIABLE/marginal cost (wages, materials, utilities) or to price move the P = MC output choice.","qs":[{"id":"DSE2014/P1/Q6","q":"The following table shows the cost-output relationship of a price taker. Output: 1,2,3,4,5; Total cost: $20,$45,$75,$110,$150. Given that the profit maximizing output of the firm is 3 units. If the fixed cost increases by $5, the price of the good and the output will be ________ and ________ respectively.","opts":["$25 ... 2 units","$30 ... 2 units","$30 ... 3 units","$75 ... 3 units"],"ans":2,"why":"Marginal cost per unit: $20 (or from 0), $25, $30, $35, $40. Since output=3 is optimal, price must equal MC(3)=$30 (the boundary where producing the 4th unit at MC=$35 would no longer be worthwhile). A change in FIXED cost never shifts marginal cost, so it doesn't affect the P=MC output decision — price stays $30 and output stays 3 units."},{"id":"DSE2015/P1/Q5","q":"The schedule below shows the marginal cost of a firm in a perfectly competitive market. Output: 3,4,5,6,7,8,9; Marginal cost: $5,$5.5,$6,$6.5,$7,$8,$9.5. Suppose the rental of the machine hired, a fixed cost, increases by $2 while the marginal cost for each unit of the output is reduced by $0.5. As a result, the profit-maximising output of the firm ____________ while the profit of the firm ____________.","opts":["increases ... decreases","increases ... may increase or decrease","decreases ... decreases","decreases ... may increase or decrease"],"ans":1,"why":"With marginal cost lower at every output level, the firm now reaches MC=P at a HIGHER output than before (the lower MC curve takes more units to climb back up to the same price) — output increases. Profit is pulled two ways: lower MC/higher output tends to raise profit, while the extra $2 fixed cost tends to lower it — the net effect is ambiguous without exact figures, so profit may increase or decrease."},{"id":"DSE2019/P1/Q4","q":"If the fixed cost of a price-taking firm decreases by $200 and the marginal cost of each unit of output increases by $10, the profit-maximising output will ______ and the profit ______.","opts":["increase ... will decrease","increase ... may increase or decrease","decrease ... will increase","decrease ... may increase or decrease"],"ans":3,"why":"A uniformly higher marginal cost curve reaches any given price at a SMALLER output than before, so output decreases. Profit is pulled two ways: the $200 lower fixed cost raises profit, while the higher marginal cost (and now-smaller output) tends to lower it — the net effect is ambiguous, so profit may increase or decrease."},{"id":"DSE2022/P1/Q11","q":"Winnie operates a café in Sham Shui Po. To maximise her profit, Winnie will produce more output if","opts":["water charges for commercial use fall.","business registration fee falls.","the monthly rental payment of the café rises.","the wage rate of part-time waiters increases."],"ans":0,"why":"Only a change to a VARIABLE (marginal) cost shifts the profit-maximising output, since that decision follows price=marginal cost. Falling water charges (a variable input cost) lower marginal cost, letting the firm profitably produce more at the same price. Registration fees and rent are fixed costs — they affect profit level but not the output decision — and a higher wage rate would raise, not lower, marginal cost, reducing output instead."}]},{"id":"in33","ch":"ch6","text":"Table technique: convert whatever you're given (AC or TVC or TC) into TOTAL cost, take differences for MC, then pick the largest Q with MC ≤ P (the marginal unit must not cost more than it sells for). Profit = P×Q − TC; producer surplus = TR − TVC (excludes fixed cost) — the exam loves making profit and surplus differ by exactly the fixed cost.","qs":[{"id":"DSEPP/P1/Q12","q":"The following table shows the total cost schedule of a price-taking firm which has a fixed cost equal to $20. Quantity: 1,2,3,4,5; Total cost: $40,$65,$95,$130,$170. Suppose the market price is $35. At the profit-maximizing output level, the firm's profit and total producer surplus are ______ and ______ respectively.","opts":["$10 ... $10","$10 ... $30","$30 ... $10","$30 ... $30"],"ans":1,"why":"Marginal cost per unit: $20,$25,$30,$35,$40. At P=$35, the firm produces up to where MC=P, i.e. Q=4 (MC(4)=$35). TC(4)=$130, so profit = 35×4−130 = $10. Producer surplus = TR−TVC = 140−(130−20) = $30."},{"id":"DSE2012/P1/Q9","q":"Refer to the following table showing the production costs of a price-taking firm. Total output: 2,3,4,5,6; Marginal cost: $4,$6,$8,$10,$12; Average variable cost: $3,$4,$5,$6,$7; Fixed cost: $1 (constant). If the product price is $6,","opts":["the firm will produce 5 units of output to maximize its profit.","the maximum profit the firm can make is $5.","the average variable cost is $5 when the firm maximizes its profit.","the minimum total cost of the firm is $13."],"ans":1,"why":"At P=$6, the firm produces where MC=P, i.e. Q=3 (MC=$6). TC(3) = AVC×Q + FC = 4×3+1 = $13. Profit = 6×3−13 = $5."},{"id":"DSE2013/P1/Q3","q":"The following table shows the cost-output relationship of a firm. Outputs: 0,1,2,3,4,5; Total cost: $10,$28,$42,$52,$60,$72. Based on the above table, we can conclude that","opts":["the firm enjoys the benefits of economies of scale.","the firm's optimal scale of production is 5 units of outputs.","the average variable cost is increasing.","the total fixed cost is $10."],"ans":3,"why":"At zero output, total cost equals total fixed cost (no variable cost is incurred) — TC(0) = $10 directly gives total fixed cost = $10. Checking average variable cost = (TC−10)/Q gives 18, 16, 14, 12.5, 12.4 — actually DECREASING, not increasing, so that option is wrong; 'scale' and 'economies of scale' are long-run concepts not determinable from a single short-run cost table."},{"id":"DSE2016/P1/Q12","q":"The following table shows the cost-output relationship of a price-taker. Output: 2,3,4,5,6,7; Average cost: $20,$21,$22,$23,$24,$25. Suppose the market price is $25. What are the profit-maximising output and profit respectively?","opts":["4 units and $0","4 units and $12","7 units and $0","7 units and $12"],"ans":1,"why":"Total cost = AC×Q: $40,$63,$88,$115,$144,$175. Marginal cost per unit: $23,$25,$27,$29,$31. At P=$25, MC=$25 exactly at Q=4. TC(4)=$88, so profit = 25×4−88 = $12."}]},{"id":"in34","ch":"ch3","text":"Identify ownership types by TWO tests: (1) liability — unlimited → sole proprietorship/partnership; limited → any limited company; (2) transfer of ownership — needs others' consent → partnership or PRIVATE limited company; freely transferable → PUBLIC limited company. Add legal entity/continuity as the tiebreaker: partnerships dissolve on a partner's death/bankruptcy; companies don't.","qs":[{"id":"CE1990/P2/Q21","q":"Mr Chan was one of the owners of a trading firm which recently went bankrupt. The court then took over his personal property. To what kind of business ownership did this trading firm belong?","opts":["sole-proprietorship","partnership","private limited company","public limited company"],"ans":1,"why":"The court seizing an owner's PERSONAL property to cover the firm's debts shows unlimited liability — ruling out private/public limited companies, which have limited liability. Since Mr Chan was described as 'one of the owners' (implying multiple owners), this points to a partnership rather than a sole proprietorship."},{"id":"CE1995/P2/Q23","q":"Fanny and Estella are the only owners of a firm. They must obtain the other's consent before they can transfer their ownership to other people. Besides, their liability to the firm is confined to their individual investment in the firm. Based on this information, the firm is a","opts":["sole proprietorship.","partnership.","private limited company.","public limited company."],"ans":2,"why":"Liability confined to their own investment means LIMITED liability, ruling out sole proprietorship and partnership (both unlimited liability). Needing the other owner's consent before transferring ownership rules out a public limited company, whose shares are freely transferable without such consent — leaving private limited company as the only fit."},{"id":"CE1997/P2/Q19","q":"Refer to the following information concerning Firm A and Firm B: Firm A — Number of owners 6, Transfer of ownership needs the consent of other owners, Legal status legal entity. Firm B — Number of owners 7, Transfer of ownership needs the consent of other owners, Legal status not a legal entity. The type of ownership of Firm A and Firm B is ______ and ______ respectively.","opts":["public limited company ... private
