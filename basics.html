 TWO reasons why the market of yoga classes is NOT perfectly competitive.","marks":4,"cmd":"Explain","ch":"ch12","points":[["Studios provide heterogeneous services, e.g. different class types / teaching styles",2],["Market information is imperfect (prices and quality not readily known) / non-price competition (advertising)",2]]},{"id":"CE1998/P1/Q10(c)","q":"Personal computers of the same type are sold in many Hong Kong shops at slightly different prices. (i) Explain with an example why there is such a price difference. (ii) Identify the market structure of these shops.","marks":3,"cmd":"Explain & Identify","ch":"ch12","points":[["(i) Differentiated products/services or imperfect information or different production costs — e.g. different after-sales maintenance services",2],["(ii) Monopolistic competition",1]]},{"id":"DSE2015/P2/Q9(c)","q":"The price of an Espresso in McCafé is lower than in Starbucks. Suggest TWO possible reasons for this price difference.","marks":4,"cmd":"Suggest","ch":"ch12","points":[["Lower-quality coffee / lower production cost",2],["Less pleasant environment / less attractive brand name",2]]},{"id":"DSE2023/P2/Q4","q":"Smartphones of the same model are sold in different shops at different prices. Explain with TWO reasons why some customers buy from shops selling at higher prices.","marks":4,"cmd":"Explain","ch":"ch12","points":[["Imperfect market information — some buyers don't know about cheaper shops (high search costs)",2],["Heterogeneous services — some pay a premium for better service, e.g. longer warranty or better product descriptions",2]]},{"id":"DSEPP/P2/Q12(b)(ii)","q":"600,000 exhibition tickets sold out at $10 each; touts resell at $200. 'The government should raise the ticket price so as to kick out touts.' Evaluate this proposal.","marks":4,"cmd":"Evaluate","ch":"ch13","points":[["For: a higher price reduces ticket-touting and raises the exhibition's total revenue; less queuing time lowers the efficiency loss; a smaller shortage makes tickets easier to get",2],["Against: a higher price lowers consumers' surplus for those who now pay more (evaluate both sides)",2]]},{"id":"DSE2017/P2/Q11(b)","q":"The government of Country X introduces a per-unit subsidy to private-university education. 'The subsidy causes inefficiency even though both students and universities benefit.' Defend the statement by comparing marginal cost and marginal benefit in Figure 3.","marks":3,"cmd":"Defend & Draw","ch":"ch13","points":[["At the subsidised quantity Q1, marginal cost exceeds marginal benefit",1],["The subsidy pushes output beyond the efficient level (where MB = MC), so a deadweight loss arises — mark MB and MC positions on the diagram",2]]},{"id":"DSE2018/P2/Q10(c)","q":"Foreign domestic helpers are paid an effective minimum wage. With the aid of Figure 2, explain how it may result in economic inefficiency.","marks":4,"cmd":"Explain & Draw","ch":"ch13","points":[["The effective minimum wage is above equilibrium, so the quantity of labour employed (Q1) is below the efficient level",2],["At Q1, marginal benefit exceeds marginal cost, creating a deadweight loss — mark the minimum wage, Q1, and the DWL",2]]},{"id":"DSE2019/P2/Q11(b)","q":"During non-holidays there are many empty seats on some High Speed Rail trains. With the aid of Figure 1, explain why this situation may be inefficient.","marks":4,"cmd":"Explain & Draw","ch":"ch13","points":[["The fare is set above the market-clearing level, so quantity transacted is below the efficient level (empty seats = excess supply)",2],["Marginal benefit of the train service exceeds marginal cost, so a deadweight loss exists — mark P, Q, and the DWL",2]]},{"id":"DSE2023/P2/Q5","q":"Teacher: 'If the marginal cost for producing each unit of a good increases, the total social surplus will decrease.' (a) Illustrate the teacher's statement with a diagram. Student: 'Then the increase in marginal cost will lead to economic inefficiency.' (b) Do you agree with the student?","marks":4,"cmd":"Draw & Evaluate","ch":"ch13","points":[["(a) Diagram: the MC (supply) curve shifts up/left, and total social surplus decreases",2],["(b) No — efficiency is still attained, because at the NEW equilibrium quantity marginal benefit still equals marginal cost (a smaller surplus is not the same as inefficiency)",2]]},{"id":"DSE2020/P2/Q10(c)","q":"Economists argue that a tariff may harm both consumers and producers (of the exporting side). With reference to the supply-demand diagram, complete the before/after-tariff table for consumers' surplus and producers' surplus.","marks":3,"cmd":"Complete","ch":"ch13","points":[["A tariff raises the price paid and lowers the quantity traded, SHRINKING consumers' surplus after the tariff",1],["Producers' surplus also changes to the smaller post-tariff area, reflecting reduced trade",1],["Both surpluses are smaller after the tariff than before — read the correct areas off the diagram",1]]},{"id":"DSE2015/P2/Q12(d)","q":"Some residents complained that the large number of mainland tourists overloaded the public transport system, greatly increasing travel time for all passengers. Explain, in terms of externality, why inefficiency may exist when the transport system is overcrowded.","marks":4,"cmd":"Explain","ch":"ch13","points":[["Negative externality / divergence between private and social costs",1],["When the system is at full capacity, each extra passenger raises the time cost of all other passengers without compensating them — marginal social cost exceeds marginal social benefit, so the number of passengers exceeds",3]]},{"id":"DSE2019/P2/Q4","q":"Getting vaccinated prevents infection and protects oneself from flu. Using the concept of externality, explain why a government subsidy on Seasonal Influenza Vaccination may improve economic efficiency.","marks":4,"cmd":"Explain","ch":"ch13","points":[["Vaccination lowers the chance of OTHERS being infected, but the vaccinated person isn't compensated — an external benefit, so marginal social benefit exceeds marginal social cost and vaccinations are below the efficient ",2],["A subsidy raises the quantity of vaccination towards the efficient level, narrowing the gap between marginal social benefit and marginal social cost",2]]},{"id":"DSE2021/P2/Q10(d)","q":"Wearing a surgical mask reduces one's own chance of contracting diseases and also prevents spreading them to others. In terms of externality, explain how a subsidy could improve economic efficiency.","marks":4,"cmd":"Explain","ch":"ch13","points":[["Mask-wearing lowers others' infection risk without the wearer being compensated — an external benefit, so marginal social benefit exceeds marginal social cost and mask use is below the efficient level (under-consumption)",2],["A subsidy lowers the marginal private cost, raising mask use towards the efficient level and narrowing the MSB–MSC gap",2]]},{"id":"DSE2025/P2/Q3","q":"A tutorial teacher shares short teaching videos on social media free of charge; many benefit without paying him. Explain why externality is NOT necessarily involved in the above situation.","marks":3,"cmd":"Explain","ch":"ch13","points":[["The teacher may gain income indirectly — e.g. advertising revenue or more tutorial-class enrolment from the rise in his popularity",2],["If this indirect gain equals the benefits enjoyed by viewers at the margin (marginal private benefit = marginal social benefit), there is no externality",1]]},{"id":"DSESP/P2/Q2","q":"Give two reasons for the existence of income inequality in an economy.","marks":4,"cmd":"Give","ch":"ch14","points":[["Differences in human capital: better-educated people may earn higher income",2],["Discrimination: people of a certain gender or race may earn lower income due to discrimination",2]]},{"id":"DSE2018/P2/Q4","q":"Apart from the difference in education level, explain TWO factors that may lead to income inequality.","marks":4,"cmd":"Explain","ch":"ch14","points":[["Race — racial discrimination may cause some ethnic-minority groups to earn a lower wage for the same job",2],["Gender — sex discrimination may cause women to earn a lower wage for the same rank (OR physical attributes affecting productivity in certain jobs)",2]]},{"id":"DSEPP/P2/Q11(d)","q":"Under the School Textbook Assistance Scheme (STAS), needy students receive subsidies covering textbook and school-related costs. Explain how STAS can enhance equity in Hong Kong society.","marks":4,"cmd":"Explain","ch":"ch14","points":[["Equalize income: STAS raises the income of needy students' families, a benefit the rich cannot enjoy",2],["Equalize opportunity: it helps needy students continue their studies, and education can raise their future income, narrowing the income gap over time",2]]},{"id":"DSE2012/P2/Q10(b)","q":"In 2011 the government's 'Scheme $6000' gave $6,000 to each permanent resident aged 18 or above. Do you think the government should introduce it to improve equity in Hong Kong? Explain.","marks":4,"cmd":"Evaluate","ch":"ch14","points":[["Equity is a subjective, value-laden concept — different people apply different standards",1],["Yes: $6,000 is a larger PERCENTAGE increase in the income of the poor, narrowing the gap; OR No: it doesn't equalize opportunities (the poor get no extra productivity-raising resources) / doesn't equalize outcome (non-pe",3]]},{"id":"DSE2017/P2/Q11(c)","q":"Country X introduces a per-unit subsidy to private-university education. Explain whether subsidising education can help improve equality.","marks":3,"cmd":"Evaluate","ch":"ch14","points":[["Yes — subsidising education equalizes opportunities, so the poor are not deprived of university education by financial constraints",2],["Education raises their future income, reducing income inequality across generations",1]]},{"id":"DSE2019/P2/Q2(b)","q":"The Li Ka Shing Foundation gave an unconditional $5,000 to each 2018 HKDSE candidate living in Yuen Long, Tuen Mun and Islands districts. Justify the statement 'The project can improve equity in Hong Kong.'","marks":4,"cmd":"Justify","ch":"ch14","points":[["Equalize income: these districts have lower average household income, so the cash helps narrow the income gap",2],["Equalize opportunity: the money spent on education enhances the poor's chance of higher education without being hindered by their background",2]]},{"id":"DSE2022/P2/Q3(b)","q":"Country A: Gini on household income rose 0.51→0.56 (2019→2020), but Gini on household DISPOSABLE income fell 0.51→0.44. Based on disposable income, did income inequality improve or worsen in 2020? Suggest ONE policy that may have caused the change.","marks":2,"cmd":"Evaluate & Suggest","ch":"ch14","points":[["Income inequality (on disposable income) IMPROVED in 2020",1],["Policy: an increase in government transfer payments to low-income groups / greater progressivity of the income tax system",1]]},{"id":"CE2006/P1/Q1(a)","q":"The government lowered the price ceiling from PA to PB (Figure: PA above equilibrium). Explain whether the initial price ceiling PA is effective or not.","marks":2,"cmd":"Explain","ch":"ch11","points":[["No — not effective",1],["because PA is above the equilibrium price",1]]},{"id":"CE1998/P1/Q2","q":"The government increases an import quota and the increased quota is STILL effective. Explain whether the market price of the import would increase or not.","marks":4,"cmd":"With the aid of a diagram, explain","ch":"ch11","points":[["Quota increases → the vertical segment of supply shifts right",1],["Supply of imports increases",1],["Price falls along the demand curve (quota still below eq quantity)",1],["Diagram: two vertical segments, new lower price marked",1]]},{"id":"DSE2016/P2/Q9","q":"EU dairy: (i) the EU abolished the effective production quota; (ii) Russia imposed an import embargo on EU dairy. Show both effects on EU dairy price in ONE supply-demand diagram.","marks":4,"cmd":"Illustrate with ONE diagram","ch":"ch11","points":[["Original kinked supply S0 with vertical segment at quota Q0",1],["Embargo: demand shifts LEFT (D0 → D1)",1],["Quota abolished: supply becomes the ordinary upward-sloping S1 (overlapping below Q0)",1],["New equilibrium D1 ∩ S1 → price falls",1]]},{"id":"DSE2019/P2/Q12(a)(i)","q":"US tariffs on Chinese goods (trade war, 2018). Indicate the change in the total market value (net-of-tariff) of Chinese exports to the US.","marks":3,"cmd":"Indicate in a diagram","ch":"ch11","points":[["Supply shifts UP by the per-unit tariff",1],["Net-of-tariff value = (P1 − t) × Q1 — show it is LOWER than P0 × Q0",2]]},{"id":"Archetype · canon of a flat rate","q":"Name the Adam Smith canon that a flat standard tax rate best satisfies, and explain.","marks":2,"cmd":"Identify + explain","ch":"ch11","points":[["Equality — everyone pays the same proportion of income",1],["one line of elaboration tying rate to ability/proportion",1]]},{"id":"CE1993/Q5(b)","q":"Property tax is charged at a fixed rate on rental income. Classify it (progressive/proportional/regressive) and name ONE canon it satisfies.","marks":4,"cmd":"Classify + justify","ch":"ch11","points":[["Proportional — the average rate is constant",2],["satisfies equality / certainty / convenience (any one)",1],["one line of elaboration",1]]},{"id":"Drill · rates vs property tax","q":"State whether property tax and rates are direct or indirect, and explain the difference in tax incidence.","marks":4,"cmd":"Explain (incidence)","ch":"ch11","points":[["Property tax = direct — burden cannot be shifted",2],["Rates = indirect — owner can shift the burden onto the tenant",2]]},{"id":"CE1999/Q8","q":"Average tax rates are 10%, 9.5%, 9% as income rises. Is the tax progressive? Explain.","marks":3,"cmd":"Identify from data","ch":"ch11","points":[["No — not progressive",1],["the average rate FALLS as income rises",1],["therefore regressive (don't be fooled by tax paid rising)",1]]},{"id":"CE2008/Q8","q":"A fixed excise duty is levied on each bottle of red wine. Classify it (direct/indirect; progressive/proportional/regressive).","marks":4,"cmd":"Classify + explain","ch":"ch11","points":[["Indirect — the burden can be shifted to consumers",2],["Regressive — the fixed amount is a larger share of a low income, so the average rate falls with income",2]]},{"id":"DSE2024/Q12(d)","q":"A footballer pays a flat 20% income tax. Classify it (i) direct/indirect and (ii) progressive/proportional/regressive.","marks":2,"cmd":"Classify","ch":"ch11","points":[["Direct — burden cannot be shifted",1],["Proportional — average rate constant at 20%",1]]},{"id":"DSE2025/Q9","q":"The Hotel Accommodation Tax charges a fixed % of room price. Classify it and state its effect on indirect-tax revenue.","marks":4,"cmd":"Classify + effect","ch":"ch11","points":[["Indirect — can be shifted to guests",1],["Regressive — a larger share of a low income; average rate falls with income",2],["indirect-tax revenue rises",1]]},{"id":"DSE2012/Q4(b)","q":"Explain how raising the standard rate of salaries tax affects the post-tax Gini coefficient.","marks":3,"cmd":"Explain","ch":"ch11","points":[["the high-income group's after-tax income falls",2],["the low-income group is unchanged → gap narrows → post-tax Gini falls",1]]},{"id":"Archetype · raising the allowance & Gini","q":"Explain how raising the salaries-tax allowance affects the post-tax Gini coefficient.","marks":3,"cmd":"Explain","ch":"ch11","points":[["more low/middle earners pay less or leave the net → their after-tax income rises",2],["gap narrows → post-tax Gini falls",1]]},{"id":"CE1998/Q7(b)","q":"The salaries-tax allowance is unchanged. Explain why total salaries-tax revenue rises during inflation.","marks":3,"cmd":"Explain (mechanism)","ch":"ch11","points":[["inflation raises nominal income",1],["with a fixed allowance, more people enter the net / move into higher bands",1],["assessable income rises → revenue rises (fiscal drag)",1]]},{"id":"Archetype · raising allowance & revenue","q":"Explain the effect of raising the basic allowance on total tax revenue and on the tax base.","marks":3,"cmd":"Explain","ch":"ch11","points":[["fewer people pay / pay less → revenue change uncertain (likely falls)",2],["it does NOT widen the tax base",1]]},{"id":"CE1999/Q10","q":"A person earns profit from a business operated on the Mainland. Taxable in HK? A $50 airport departure tax — which canon does it best satisfy?","marks":4,"cmd":"Apply principle","ch":"ch11","points":[["Not taxed — territorial source principle: income not arising in HK is untaxed",2],["departure tax satisfies convenience / economy",1],["elaboration: simple to collect, low cost",1]]},{"id":"Archetype · foreign salary","q":"Is a salary earned in Shanghai taxable in Hong Kong? Explain.","marks":2,"cmd":"Apply principle","ch":"ch11","points":[["No",1],["under the territorial source principle, income not arising in HK is not taxed",1]]},{"id":"DSE2018/Q6","q":"Evaluate the claim that cutting the profits-tax rate must reduce tax revenue. Refer to ONE canon.","marks":4,"cmd":"Evaluate (both sides)","ch":"ch11","points":[["Not necessarily — a cut can spur investment / widen the taxable base, offsetting the loss",1],["but if the base reacts little, revenue can still fall (argue both sides)",1],["net effect depends on the base reaction (Laffer)",1],["Equality: two-tier scheme taxes high profit at a higher rate — argue consistent / not",1]]},{"id":"DSE2013/Q8","q":"To cut a budget deficit the government raises the income-tax rate. Evaluate whether this will necessarily raise revenue.","marks":4,"cmd":"Evaluate (both sides)","ch":"ch11","points":[["May rise — a higher rate collects more per dollar",1],["May fall — disincentive → work/investment falls → taxable base shrinks",1],["net effect depends on the base reaction (Laffer)",1],["conclusion: indeterminate, depends on elasticity",1]]},{"id":"DSE2017/Q6","q":"Explain how introducing a GST could stabilise tax revenue, and name a canon a flat standard rate satisfies.","marks":4,"cmd":"Explain effect","ch":"ch11","points":[["consumption is steadier than income",1],["so revenue fluctuates less over the cycle",1],["GST also widens the base → more stable revenue",1],["a flat rate satisfies equality (in proportion)",1]]},{"id":"DSE-SP/Q7(b)","q":"Explain the effect of expansionary fiscal policy on real output in the short run and the long run.","marks":4,"cmd":"Explain SR vs LR","ch":"ch11","points":[["SR: ↑G → ↑AD → along upward-sloping SRAS → ↑real output",2],["LR: LRAS is vertical → output returns to potential, only the price rises",1],["unless potential output is raised (infrastructure / human capital)",1]]},{"id":"Archetype · why expansion is temporary","q":"Explain why expansionary fiscal policy raises output only temporarily.","marks":3,"cmd":"Explain","ch":"ch11","points":[["SR ↑AD raises output above potential",1],["rising factor prices shift SRAS left",1],["output returns to potential; only the price level is permanently higher",1]]},{"id":"DSE2013/Q12(c)","q":"Using an AD-AS diagram, explain how a rise in the RRR affects price and output.","marks":4,"cmd":"Explain with diagram","ch":"ch11","points":[["↑RRR → multiplier falls → MS falls",1],["→ ↑interest → ↓investment → ↓AD",1],["AD shifts left → ↓price ↓output",1],["diagram: AD₁→AD₂ leftward + new equilibrium, referred to in words",1]]},{"id":"DSE2025/Q10","q":"Explain how a cut in the discount rate transmits to the price level and output. Note HK's institutional constraint.","marks":4,"cmd":"Explain transmission","ch":"ch11","points":[["↓discount → banks' cost of borrowing reserves falls → ↑lending → ↑MS",1],["→ ↓interest → ↑investment/consumption → ↑AD",1],["→ short-run ↑price ↑output",1],["HK's linked exchange rate → no independent monetary policy; use a generic central bank",1]]},{"id":"Archetype · lowering RRR","q":"Explain how lowering the required reserve ratio raises output.","marks":4,"cmd":"Explain","ch":"ch11","points":[["↓RRR → ↑money multiplier → ↑MS",2],["↓interest → ↑investment → ↑AD → short-run ↑output",2]]},{"id":"DSE2019/Q10","q":"An economy faces a deflationary gap. Explain how raising income tax would worsen it, and suggest a monetary alternative.","marks":4,"cmd":"Apply + alternative","ch":"ch11","points":[["↑income tax → ↓disposable income → ↓consumption → ↓AD → gap widens",2],["alternative: ↓RRR → ↑MS → ↓interest → ↑investment → ↑AD → narrows the gap",2]]},{"id":"Archetype · close an inflationary gap","q":"An economy has an inflationary gap. Explain one policy that would restore long-run equilibrium.","marks":3,"cmd":"Explain a policy","ch":"ch11","points":[["identify: contractionary policy needed (e.g. ↑tax or ↑RRR)",1],["mechanism: ↓AD",1],["output returns toward potential; price pressure eases",1]]},{"id":"DSE2024/Q13(a)","q":"Explain how an economic downturn affects the government's fiscal balance.","marks":3,"cmd":"Explain","ch":"ch11","points":[["revenue: direct taxes fall with income → revenue falls",1],["spending: unemployment/welfare spending rises",1],["→ fiscal balance worsens / turns to deficit",1]]},{"id":"Archetype · surplus budget → actual deficit","q":"Explain how a surplus budget can end up as an actual fiscal deficit.","marks":3,"cmd":"Explain","ch":"ch11","points":[["a budget is stated in ESTIMATED terms (estimated rev > estimated exp)",1],["if the economy underperforms, actual revenue falls / actual spending rises",1],["actual revenue < actual expenditure → actual deficit",1]]},{"id":"Archetype · twin deficits","q":"Explain how raising income tax can improve both a fiscal deficit and a trade deficit.","marks":4,"cmd":"Explain (two channels)","ch":"ch11","points":[["fiscal: ↑income tax → ↑tax revenue → smaller fiscal deficit",2],["trade: ↓disposable income → ↓imports → smaller trade deficit",2]]},{"id":"DSE2017/Q11(c)","q":"Explain whether subsidising education can help improve equality.","marks":3,"cmd":"Explain (equalise opportunity)","ch":"ch11","points":[["Yes — it equalises OPPORTUNITY: the poor are not deprived of higher education by their background",2],["education raises future income → reduces inequality across generations",1]]},{"id":"DSE2019/Q2(b)","q":"An unconditional cash gift to candidates in lower-income districts — justify that it improves equity.","marks":4,"cmd":"Justify","ch":"ch11","points":[["equalises INCOME — districts have lower average income, so the cash narrows the gap",2],["equalises OPPORTUNITY — if spent on education, raises the poor's chance without background hindrance",2]]},{"id":"DSE2012/Q10(b)","q":"Should the government introduce a universal cash handout to improve equity? Explain.","marks":4,"cmd":"Evaluate (value judgment)","ch":"ch11","points":[["equity is subjective / different people use different standards",1],["Yes — the same $ is a higher % gain for the poor",1],["No — it does not equalise opportunity (no extra productivity for the poor)",1],["No — not everyone is eligible / universal so the gap may not narrow (any relevant point)",1]]},{"id":"Archetype · disincentive effects","q":"Explain why heavy taxes and large transfers can create disincentive effects.","marks":4,"cmd":"Explain","ch":"ch11","points":[["high salaries tax → ↓net income from working → incentive to work harder falls",2],["generous unemployment/CSSA benefits → incentive to be employed falls, esp. for low-paid workers",2]]},{"id":"DSE2018/P2/Q9","q":"The Express Rail Link (XRL) project (Hong Kong Section) is expected to be completed in 2018. It will shorten the estimated journey time between Hong Kong and various Mainland cities. Below are some opinions on the XRL project. Government officials With better infrastructure, the overall economic development of Hong Kong will be enhanced. Small medium enterprise owners We expect that the XRL could bring more Mainland travellers to Hong Kong. Suppose the Hong Kong economy operates at E1. With reference to the above opinions, show why the price level of Hong Kong may rise in the long run after th","marks":3,"cmd":"Complete & Show","ch":"m:adas","points":[["Illustrate in the diagram: - Rightward shift of AD (due to more visitors from the Mainland)",1],["- Rightward shift of LRAS (due to faster development of the HK economy)",1],["- Correct position of P2 (at E2), with a bigger horizontal shift in AD than in LRAS",1]]},{"id":"CE2006/P1/Q6","q":"The following is the balance sheet of a banking system. Assets ($mn) Liabilities ($mn) Deposits 1 500 Cash 500 Loans 1 000 (a) Suppose the excess reserve of the banks is $350. What is the required reserve ratio? The required reserve ratio is _______________ %. (1 mark) (b) Suppose there is a cash withdrawal of $350 from the banks. Explain whether the banks still have excess reserves immediately after the withdrawal. (3 marks)","marks":4,"cmd":"Explain","ch":"m:balsheet","points":[["(a) 10%",1],["(b) Yes,",1],["because when total deposits reduce to $1150 (= $1500 - $350), it only needs a reserve of $115 (= $1150 x 10%) to back up the deposits. Since the reserve assets only reduce to $150 (= $500 - $350), there is still an exces",2]]},{"id":"CE2007/P1/Q7","q":"Study the following balance sheet of a banking system: Assets ($mn) Liabilities ($mn) Deposits 7 500 Cash 1 700 Loans 5 800 Suppose the legal reserve ratio is 20%. (a) The excess reserve of the banking system is $____________________. (1 mark) Suppose Mr Chan withdraws $100 from the banking system, of which 70% is held as cash and the rest is remitted overseas. (b)(i) The immediate change in total deposits of the banking system is _______________. (1 mark) (b)(ii) Therefore, the immediate change in the overall amount of the money supply is _______________ (2 marks)","marks":4,"cmd":"Explain","ch":"m:balsheet","points":[["(a) 200",1],["(b)(i) $100",1],["(b)(ii) $30",2]]},{"id":"DSESP/P2/Q5","q":"The following is the balance sheet of a banking system. Assets ($) Liabilities ($) Deposits 1 500 Cash 500 Loans 1 000 (a) Suppose the excess reserves of the banks are $275. What is the required reserve ratio? (1 mark) (b) Suppose there is a cash withdrawal of $300 from the banks. Explain whether the banks still have excess reserves immediately after the withdrawal. (3 marks)","marks":4,"cmd":"Explain","ch":"m:balsheet","points":[["(a) The required reserve ratio = $225 / $1 500 = 0.15",1],["(b) The required reserve after withdrawal = $1 200 × 0.15 = $180. There will be an excess reserve of $20.",3]]},{"id":"DSE2017/P2/Q8","q":"The following table shows the balance sheet of a banking system which has excess reserves of $250. Assets ($million) Liabilities ($million) Deposits 3 000 Cash 1 000 Loans 2 000 (a) Find the required reserve ratio. (1 mark) (b) Suppose the banks lend out all excess reserves and the public does not hold cash. Calculate the change in deposits after credit creation. Show your working. (2 marks)","marks":3,"cmd":"Show & Calculate","ch":"m:balsheet","points":[["(a) RRR = ($1000–$250)/$3000 = 0.25",1],["(b) The change in deposits = $250 × (1/0.25) = $1000",2]]},{"id":"DSE2021/P2/Q6","q":"The following table shows the balance sheet of a banking system. Assets ($million) Liabilities ($million) Deposits 1 500 Cash 600 Loans 1 200 Initially the banks hold excess reserves of $300 million and the public always holds $100 million cash. (a) Find the required reserve ratio. (1 mark) (b) Suppose the required reserve ratio is reduced by 5% and banks lend out all excess reserves. Calculate the new money supply after the credit creation/contraction. Show your workings. (3 marks)","marks":4,"cmd":"Show & Calculate","ch":"m:balsheet","points":[["(a) Required reserve ratio = (600–300)/1500 = 20%.",1],["(b) New required reserve ratio = 20–5 = 15 (%) New deposit = 1500 + (600–0.15×1500)/0.15 = 4000 ($million) New money supply = 4000 + 100 = 4100 ($million)",3]]},{"id":"DSE2022/P2/Q8","q":"The following table shows the balance sheet of a banking system. Assets ($million) Liabilities ($million) Deposits 4 000 Cash 1 000 Loans 3 000 The public initially holds $1 000 million cash and the banks are fully loaned up. (a) Calculate the required reserve ratio. (1 mark) (b) Suppose the public only wants to hold $400 million cash and deposits the remaining cash into the banks. Calculate the maximum change in money supply. Show your workings. (3 marks)","marks":4,"cmd":"Show & Calculate","ch":"m:balsheet","points":[["(a) 25%.",1],["(b) Original money supply = 4 000 + 1 000 = 5 000 ($ million) New deposit = (1 000 + 600) × 1/25% = 6 400 ($ million) New money supply = 6 400 + 400 = 6 800 ($ million) Change in Ms = 6 800 – 5 000 = 1 800 ($ million)",3]]},{"id":"DSE2024/P2/Q8","q":"Suppose in an economy, the public increases their cash holding by withdrawing bank deposits. Immediately after the withdrawal, the banking system of the economy faces a reserve shortage of $100 million. The following table shows the balance sheet of the banking system immediately after the withdrawal. Assets ($million) Liabilities ($million) Deposits 3 500 Cash 600 Loans 2 900 (a) Find the required reserve ratio. (1 mark) (b) Suppose the required reserve ratio is reduced by 5 percentage points. Calculate the maximum possible change in deposits after deposit creation/contraction. Show your work","marks":4,"cmd":"Show & Calculate","ch":"m:balsheet","points":[["(a) The required reserve ratio = [($600 million + $100 million) / $3 500 million] × 100% = 20%",1],["(b) The new required reserve ratio = 20% - 5% = 15%",1],["The maximum amount of deposits after deposit creation = $600 million / 15% = $4 000 million",1],["The maximum change in deposits = $4 000 million - $3 500 million = $500 million",1]]},{"id":"CE1997/P1/Q11","q":"Suppose $1 million worth of seafood is imported to Hong Kong. Half of it is sold to local households at $0.8 million and half to local restaurants at $0.7 million. These restaurants cook and sell the seafood to their customers at $1.6 million of which $0.6 million is tourist spending. Explain whether the above transactions together will improve Hong Kong's (a)(i)(I) balance of visible trade. (a)(i)(II) balance of payments. (4 marks)","marks":4,"cmd":"Explain","ch":"m:bop","points":[["(a)(i)(I) No.",1],["because there is no export of goods but an import of $1m. / because there is an import.",1],["(a)(i)(II) No.",1],["because total payments (= $1m.) > total receipts ($0.6m.)",1]]},{"id":"CE1998/P1/Q8","q":"Refer to the table below: Year Imports ($mn) Domestic Exports ($mn.) Re-exports ($mn.) 1996 1 535 582 212 160 1 185 758 Source: HONG KONG 1997 Based on the above information, explain whether we can come to the conclusion that Hong Kong suffered from a balance of payments deficit in 1996. (3 marks)","marks":3,"cmd":"Explain","ch":"m:bop","points":[["No.",1],["There is no information on the capital account / invisible trade account.",2]]},{"id":"CE2004/P1/Q8","q":"The following information shows the trade statistics of an economy in a certain year: $ million Visible trade surplus 40 Domestic exports of 10 goods Import of goods 30 Import of services 50 Export of services 25 Calculate the value of re-exports of the economy. (3 marks)","marks":3,"cmd":"Show & Calculate","ch":"m:bop","points":[["Re-exports = visible trade surplus + imports of goods - domestic exports",1],["= (40 + 30 - 10) m",1],["= $60 m",1]]},{"id":"CE2008/P1/Q11","q":"Trade deficit is a concern of many countries. (c) Explain whether the visible trade balance of a country would definitely be improved when the value of its imported goods decreases. (4 marks)","marks":4,"cmd":"Explain","ch":"m:bop","points":[["(c) Visible trade balance = value of exported goods − value of imported goods",1],["No, because",1],["there may also be a fall in the value of exported goods",1],["which is larger than the fall in the value of imported goods.",1]]},{"id":"CE2009/P1/Q8","q":"Suppose the balance of payments account of Hong Kong in a certain year is as follows: $ billion 1. Current Account R Goods S P 300 Income flow 30 Current transfers -20 2. Q Account -180 Total sum = 0 (a) The name of the component P of the current account is (1 mark) (b) In the balance of payments account, the name of the Q account is Account. (1 mark) In the above table, R and S stand for the current account balance and the visible trade balance respectively. Suppose there are no errors and omissions. (c)(i) The visible trade balance = ____________ billion dollars. (1 mark) (c)(ii) The domesti","marks":4,"cmd":"Name","ch":"m:bop","points":[["(a) P is services.",1],["(b) Q Account is Capital and Financial Account.",1],["(c)(i) Visible trade balance = −130 billion dollars",1],["(c)(ii) Re-export of goods = 2,323 billion dollars",1]]},{"id":"CE2011/P1/Q10","q":"Exchange rates have become a popular issue nowadays. (b) Suppose the total value (in terms of US$) of US imported goods from China increases. Explain whether it is possible that the US visible trade balance with China would be improved. (4 marks)","marks":4,"cmd":"Explain","ch":"m:bop","points":[["(b) Show understanding of the following concept: visible trade balance = total value of exported goods – total value of imported goods",1],["It is possible when",1],["there is a rise in the value of exported goods to China",1],["which is larger than the rise in the value of imported goods from China.",1]]},{"id":"DSE2012/P2/Q5","q":"Country A has imposed an effective price ceiling on Good X. (b) After the imposition of the price ceiling, many citizens in Country B travel to Country A to purchase Good X. Will the balance of invisible trade of Country A be affected? Explain. (3 marks)","marks":3,"cmd":"Explain","ch":"m:bop","points":[["(b) Yes, because",1],["transportation and other tourist-related expenses, which are regarded as export of service, increases so the invisible trade account increases.",2]]},{"id":"DSE2013/P2/Q6","q":"The table below shows the items of the balance of payments of Country A in a certain year: Debit ($ million) Credit ($ million) Export of goods 35 Import of goods 50 Export of services 47 Import of services 27 Capital inflow 70 Capital outflow 85 Foreign exchange and reserves 10 assets Total 162 162 (a) Calculate the current account balance of Country A. (1 mark) (b) \"Country A has a balance of payments surplus because there is an increase in foreign exchange reserves in that year.\" Explain whether you agree with this statement. (3 marks)","marks":4,"cmd":"Show & Calculate","ch":"m:bop","points":[["(a) Balance of current account = 35-50+47-27 = $5 million",1],["(b) No, because the BOP balance is -$10 million, which implies a BOP deficit.",3]]},{"id":"DSE2015/P2/Q12","q":"Research shows that the \"Individual Visit Scheme\" of mainland tourists has brought economic benefits to Hong Kong. However, more and more Hong Kong residents have called on the government to reduce the number of mainland tourists to Hong Kong under the Scheme. (a) How would the current account of Hong Kong be affected if the government limited the scale of the Scheme so that the number of tourists from the mainland would drop? Explain your answer. (2 marks)","marks":2,"cmd":"Show & Explain","ch":"m:bop","points":[["(a) A drop in the export of services to mainland tourists",1],["would reduce HK's current account surplus (or enlarge its deficit).",1]]},{"id":"DSE2020/P2/Q10","q":"The following source shows the current account data of the US in 2017 and 2018. (a)(i) Describe the changes of current account data of the US in the above source. (2 marks) (a)(ii) ‘Based on the above source, we can conclude that the current account deficit of the US in 2018 necessarily increased.’ Do you agree? Explain. (2 marks)","marks":4,"cmd":"Show & Describe","ch":"m:bop","points":[["(a)(i) Trade deficit increased while invisible trade surplus slightly increased.",2],["(a)(ii) No. We also need the information of external factor income flow (i.e. net income from abroad) and current transfers to draw the conclusion.",2]]},{"id":"DSE2024/P2/Q11","q":"Ann is the owner of a coffee shop in Hong Kong. (d) Suppose more and more Mainland visitors consume at Ann’s coffee shop. Thus, Ann purchases more coffee beans from Brazil to cater for the increased business. Explain why these transactions may increase the current account balance of Hong Kong’s balance of payments. (3 marks)","marks":3,"cmd":"Explain","ch":"m:bop","points":[["(d) As more Mainland visitors consume at Ann's coffee shop, the value of HK's exports of services increases.",1],["As Ann buys more coffee beans from Brazil, the value of HK's imports of goods increases.",1],["As there is value-added by Ann's coffee shop, the increase in the value of HK's exports of services (due to the increase in the sales revenue of Ann's coffee shop) would be greater than the increase in the value of HK's ",1]]},{"id":"DSE2025/P2/Q8","q":"A small open economy imports agricultural products from other countries although agricultural products are also produced by domestic farmers in the economy. To protect the domestic farmers, the government of the economy imposes a per-unit tariff on imported agricultural products. The economy remains to be an importer of agricultural products after the imposition of the tariff. (b) Explain the effect of the imposition of the tariff on the economy's trade balance. (Hint: the tariff revenue is not included in the calculation of trade balance.) (3 marks) Marking Scheme","marks":3,"cmd":"Explain","ch":"m:bop","points":[["(b) As import volume decreases while the world price remains unchanged, the economy's total import value of agricultural products decreases.",1],["Import of goods decreases.",1],["Trade balance increases.",1]]},{"id":"CE1992/P1/Q2","q":"(c) Some garment manufacturers in Hong Kong import raw materials from Japan. Explain how a depreciation of the Hong Kong dollar against the Japanese yen affects the unit cost of production of these firms. (4 marks)","marks":4,"cmd":"Explain","ch":"m:fx","points":[["(c) depreciation of HK$ ⇒ import prices/cost of imported raw materials (in HK$) ↑",2],["⇒ unit cost of production ↑",2]]},{"id":"CE2010/P1/Q8","q":"Suppose from 2008 to 2009, the price of jeans exported to Japan from Hong Kong in terms of Hong Kong dollars (HK$) remained unchanged. In the same period of time, the price of computers exported to Hong Kong from Japan in terms of Japanese Yen (¥) also remained unchanged. However, there was a change in the exchange rate between HK$ and ¥ as follows: Date Exchange rate 18 August 2008 HK$7.1 = ¥100 18 August 2009 HK$8.2 = ¥100 What would be the effect of the above change in the exchange rate on the following items (a), (b) and (c)? For each item, fill in the blank by selecting the correct answer","marks":3,"cmd":"Compute","ch":"m:fx","points":[["(a) increased",1],["(b) uncertain",1],["(c) increased",1]]},{"id":"DSEPP/P2/Q10","q":"Suppose the US dollar depreciates against the Euro. Under the linked exchange rate system, how will the following items be affected? (a) The total number of Hong Kong tourists travelling to European countries (1 mark) (b) The prices (in Euro) of Hong Kong toys exported to Europe (1 mark) (c) The total expenditure (in Hong Kong dollar) of Hong Kong on imported European automobiles (1 mark)","marks":3,"cmd":"Explain","ch":"m:fx","points":[["(a) Decrease (as the price of the trip to Europe will increase)",1],["(b) Decrease (as HKD will depreciate against Euro)",1],["(c) Uncertain (as price in terms of HKD will increase and quantity will drop)",1]]},{"id":"DSE2024/P2/Q13","q":"Hong Kong experienced an economic downturn because of the Covid-19 pandemic. It still faces various challenges on its path to resumption of normalcy after the pandemic. Source B: Exchange rate of US dollar (USD) to Renminbi (RMB) before and after the pandemic Date Exchange Rate 1 April 2019 USD 1 = RMB 6.71 1 November 2023 USD 1 = RMB 7.32 (b) Refer to Source B. Under the Linked Exchange Rate System of Hong Kong, how would the change in the exchange rate shown in Source B affect the number of Hong Kong residents visiting the Mainland during the period? Explain your answer. (3 marks) Marking Sc","marks":3,"cmd":"Show & Explain","ch":"m:fx","points":[["(b) Source B shows that the USD appreciated against the RMB during the period. Under the Linked Exchange Rate System of Hong Kong, HKD would also appreciate against RMB.",1],["As HKD appreciated against RMB, prices of goods and services in the Mainland dropped in terms of HKD (assuming that their prices in RMB remained unchanged). The money cost for Hong Kong residents to visit the Mainland wo",1],["As a result, the number of Hong Kong residents visiting the Mainland would increase.",1]]},{"id":"DSE2012/P2/Q4","q":"According to a report of the United Nations in 2008, the Gini coefficients of Hong Kong and Beijing were 0.53 and 0.22 respectively. (b) Explain how an increase in the standard tax rate of salaries tax will affect the post-tax Gini coefficient of Hong Kong. (3 marks)","marks":3,"cmd":"Explain","ch":"m:policy","points":[["(b) Lower, because",1],["higher income group has a lower post-tax income while the income of lower income group remains unchanged.",2]]},{"id":"DSE2013/P2/Q11","q":"The government has launched the “Work Incentive Transport Subsidy Scheme”, with the following objectives: (1) To relieve the burden of travelling expenses commuting to and from work on the part of low-income households with employed members (2) To promote sustained employment Applicants must meet the monthly income and asset limits of the household (e.g. for a single person, the monthly income cannot exceed $7 300 and the assets cannot exceed $72 000) and work no less than 72 hours per month in order to apply for a subsidy of $600 per month. (a) Do you think that the scheme can achieve the abo","marks":4,"cmd":"Explain","ch":"m:policy","points":[["(a) Objective (1): Yes, as it provides cash subsidies relieving the burden on travelling expenses.",2],["Objective (2): Yes, if the WITSS continues to subsidize the workers on travelling expenses. OR Objective (2): No, as employment (as well as unemployment) largely depends on the aggregate demand and supply of the economy ",2]]},{"id":"DSE2025/P2/Q9","q":"In the 2024-25 Budget, the Financial Secretary proposed to adjust the rate of the hotel accommodation tax (HAT) from 0% to 3% with effect from 1 January 2025. Hotels and guesthouses would be required to pay the HAT at the rate of 3% on accommodation charges. (b) An economist comments, 'Both the indirect tax revenue and the direct tax revenue of the Government may be affected by the above proposed HAT.' Justify the economist's comment. (4 marks)","marks":4,"cmd":"Comment & Justify","ch":"m:policy","points":[["(b) The proposed HAT is an indirect tax. As the tax rate is adjusted from 0% to 3%, the indirect tax revenue from the HAT will increase (from zero to some positive number).",2],["The re-imposition of the HAT may marginally reduce the profits of the hotels and guesthouses, reducing the direct tax revenue from profits tax.",2]]},{"id":"CE1998/P1/Q9","q":"Mr Wong received a remittance of HK$1 million from abroad and deposited the entire sum in a bank in Hong Kong. Later he used part of the money to buy shares and the rest to set up a restaurant. (d) Mr Wong paid a commission of $1 000 to the broker who helped him buy $200 000 worth of shares. Explain whether these two items of payment would affect Hong Kong’s gross domestic product (GDP). (4 marks)","marks":4,"cmd":"Explain","ch":"m:gni","points":[["(d) - The commission to the broker must be added to Hong Kong's GDP. It is an income to the broker / a payment for the broker's service / involves provision of service in this current year.",2],["- The payment for the shares should not be taken into account. It does not relate to any current production / it is just a transfer of ownership of existing assets.",2]]},{"id":"CE1999/P1/Q7","q":"Explain whether the following items should be included in the calculation of Hong Kong's gross national product. (a) the funds raised from the Millionwalk (2 marks) (b) the part of the public assistance which the needy spent on transport (2 marks)","marks":4,"cmd":"Explain","ch":"m:gni","points":[["(a) Not included.",1],["∴ charity donation is not a production.",1],["(b) Included.",1],["∴ it is in exchange for certain service rendered in the current year.",1]]},{"id":"CE2001/P1/Q6","q":"Explain whether each of the following should be included in the calculation of Hong Kong's gross domestic product (GDP). (a) the salary of a Hong Kong citizen employed by a foreign airline (b) the rent paid by a foreign airline for using the premises owned by a Hong Kong company (4 marks)","marks":4,"cmd":"Explain","ch":"m:gni","points":[["(a) The answer is 'included' or 'excluded' depending on whether the firm he works for is a resident producing unit of HK or not.",2],["(b) The answer is 'included' or 'excluded' depending on whether the rental income of a resident producer of HK is earned in HK or not. Explanation of why the rental income is or is not earned in HK: e.g. 1 Included: The ",2]]},{"id":"CE2008/P1/Q9","q":"The stock market of an economy is overheated. Many people withdraw money from their bank deposits to buy shares. (a) Harry bought the shares of a company at a value of $2 000 at the beginning of the year and sold them at $10 000 three months later. He has a capital gain of $8 000. Explain whether this amount of $8 000 should be included in the calculation of the GDP of the economy. (2 marks)","marks":2,"cmd":"Explain","ch":"m:gni","points":[["(a) No, because",1],["an increase in the capital value does not involve production.",1]]},{"id":"CE2011/P1/Q11","q":"In 2010, there was a boom in the property market of Hong Kong. (e) Trading of second-hand properties was very active and the total value of these transactions rose. Explain whether Hong Kong’s GDP will be affected by these transactions. (2 marks)","marks":2,"cmd":"Explain","ch":"m:gni","points":[["(e) It will be affected, because",1],["the service of the property agents, banks, lawyers and the government (e.g. registration of ownership) adds value to the GDP.",1]]},{"id":"DSEPP/P2/Q5","q":"Mr. Richardson, a British civil engineer, has worked for a large Hong Kong construction company for the past few years. He is earning an annual income of HK$800 000 and he remits part of his income to his family in Britain. Is Mr. Richardson’s income counted in HK’s gross domestic product (GDP)? Explain your answer. (3 marks)","marks":3,"cmd":"Explain","ch":"m:gni","points":[["His income is counted in HK's GDP",1],["because it is derived from the current production carried out by a resident producing unit in Hong Kong.",2]]},{"id":"DSE2012/P2/Q10","q":"In 2011, the Financial Secretary announced the “Scheme $6000” which provides $6000 to each Hong Kong permanent resident who is 18 years old or above. Mr. Chan is a retired person and received $6000 through the scheme in 2011. (a)(i) Should this item of payment by the government be included in the calculation of Gross Domestic Product of Hong Kong in 2011? Explain. (2 marks)","marks":2,"cmd":"Explain","ch":"m:gni","points":[["(a)(i) No, because",1],["there is no corresponding production.",1]]},{"id":"DSE2023/P2/Q10","q":"(d) The government issued $45 billion worth of Silver Bonds in 2022. Explain whether this $45 billion was included in the calculation of Hong Kong’s GDP in 2022. (2 marks)","marks":2,"cmd":"Explain","ch":"m:gni","points":[["(d) No, because",1],["no current production is involved.",1]]},{"id":"CE2002/P1/Q10","q":"(d) Bank A runs its business in Hong Kong. Tom is a consultant from Japan who will work for Bank A for nine months. Afterwards he will return to Japan. Explain whether Tom's salary for these nine months should be included in the calculation of Hong Kong's gross domestic product and gross national product. (4 marks)","marks":4,"cmd":"Explain","ch":"m:gni","points":[["(d) Included in HK's GDP",1],["∴ Bank A is a resident producing unit of HK.",1],["Excluded from HK's GNP",1],["∴ Tom is not a resident of HK / Tom's salary is an income to abroad.",1]]},{"id":"DSE2024/P2/Q11","q":"Ann is the owner of a coffee shop in Hong Kong. (c) Ann invited a famous barista from Japan to provide a workshop for her customers. The barista received a remuneration of $30 000 from Ann’s coffee shop and stayed in Hong Kong for a week. Explain how this $30 000 would affect Hong Kong’s net factor income from abroad. (3 marks)","marks":3,"cmd":"Explain","ch":"m:gni","points":[["(c) As the barista stays in Hong Kong for only one week, he is not regarded as a Hong Kong resident.",1],["His income from Ann's coffee shop (a Hong Kong resident producing unit) is therefore regarded as factor income paid abroad which is to be deducted in the calculation of Hong Kong's net factor income from abroad.",1],["Therefore, Hong Kong's net factor income from abroad would decrease.",1]]},{"id":"CE1993/P1/Q4","q":"Suppose a large number of Japanese TV sets are smuggled from Hong Kong to China and sold for HK$40 million. (b)(i) Explain whether the whole amount of this HK$40 million will be included in Hong Kong's GDP. Suggest TWO reasons. (4 marks)","marks":4,"cmd":"Explain & Suggest","ch":"m:gni","points":[["(b)(i) Not included. - (part of) it is not produced in Hong Kong",2],["- (part of) it is an unreported transaction",2]]},{"id":"DSE2015/P2/Q9","q":"(d) In July 2014, McDonald’s was accused of using expired meat as an ingredient for its food. Later, the related products were destroyed. Explain whether the value of these destroyed products would be included in the calculation of Hong Kong’s gross domestic product. (2 marks) Marking Scheme","marks":2,"cmd":"Explain","ch":"m:gni","points":[["(d) No,",1],["- because it is not sold to the market and thus not counted in production [Output Approach] - because it is neither counted in consumption nor investment [Expenditure Approach]",1]]},{"id":"CE2005/P1/Q7","q":"Per capita GDP at current Year Implicit price deflator of GDP market prices (HK$) 2001 98.1 188 835 2002 94.6 183 790 2003 89.6 179 333 Suppose people did not expect any change in the price level. Explain whether the following persons would gain or lose when the change in the price level indicated in Table 1 occurred. (a) a businessman who obtained a bank loan in 2001 at a fixed interest rate for 2 years (b) a businessman whose premises were let in 2001 at a fixed rent for 2 years (4 marks)","marks":4,"cmd":"Explain & Indicate","ch":"m:inflation","points":[["(a) He would lose as he repays a fixed amount of money, the purchasing power of which has increased because of unexpected deflation.",2],["(b) He would gain as he receives a fixed amount of money, the purchasing power of which has increased because of unexpected deflation.",2]]},{"id":"CE2011/P1/Q9","q":"In 2010, many Hong Kong people bought high definition television (HDTV) sets to watch the football World Cup. (a) Mr Chan has subscribed to a 2-year service plan offered by Cable TV at a fixed monthly fee. Explain whether Mr Chan would gain or lose if unexpected inflation occurs in these two years. (3 marks)","marks":3,"cmd":"Explain","ch":"m:inflation","points":[["(a) He would gain",1],["because the real purchasing power of his fixed monthly payment decreases.",2]]},{"id":"DSE2019/P2/Q6","q":"Study Tables 1 and 2 and answer the following questions. Table 1: Change in composite consumer price index (CCPI) Year 2016 Year 2017 +2.3% +1.7% Table 2: Minimum wage rates per hour Year 2016 Year 2017 $32.5 $34.5 (a) Based on Table 1, state the change in the general price level in 2017. (1 mark) (c) Kitman has been receiving the minimum wage rate per hour. With reference to Tables 1 and 2, explain how her real wage rate would change in 2017. (3 marks)","marks":4,"cmd":"State & Explain","ch":"m:inflation","points":[["(a) Increased (+1.7%).",1],["(c) Real wage rates increased because the increase in the nominal wage rate 6.2% was higher than the inflation rate 1.7%.",3]]},{"id":"CE1998/P1/Q6","q":"One prediction about future commercial cities is: ‘... with technological advancement, trading of goods and services will be done without cash. There will be no cash in these advanced economies.’ John said, ‘Money will not exist in these economies as there is no cash.’ Explain whether John’s comment is correct. (4 marks)","marks":4,"cmd":"Explain & Comment","ch":"m:money","points":[["Wrong. Money still exists because a generally accepted medium of exchange is still needed.",3],["It may be in other forms such as electronic money / explanation.",1]]},{"id":"CE2004/P1/Q9","q":"Hong Kong is facing a huge fiscal deficit and deflation. (b) Which function of money does cash perform better in times of deflation than in times of inflation? Explain. (3 marks)","marks":3,"cmd":"Explain","ch":"m:money","points":[["(b) Store of value / store of wealth.",1],["This is because the purchasing power / real value of cash continues to decrease in times of inflation (but continues to increase in times of deflation).",2]]},{"id":"CE2004/P1/Q11","q":"A famous chain of fashion stores opens a new branch. (c)(ii) To celebrate the new opening, the chain stores issue cash coupons to their customers who can use them as cash in these stores. Explain why the cash coupons are not money. (2 marks)","marks":2,"cmd":"Explain","ch":"m:money","points":[["(c)(ii) Not generally accepted.",1],["∴ cannot use them to buy things in other shops.",1]]},{"id":"CE2007/P1/Q6","q":"Many shops in Macau accept payment in Hong Kong dollars. Banks in Macau also accept Hong Kong dollar deposits. Name TWO functions of money performed by the Hong Kong dollar as illustrated in the above situation. Explain these functions. (4 marks)","marks":4,"cmd":"Name & Illustrate","ch":"m:money","points":[["- Accept payment: medium of exchange / means of payment",1],["- HK$ deposit: store of value / store of wealth",1],["[Mark the FIRST TWO points only.] Medium of exchange: The Hong Kong dollar serves as a medium to facilitate people's buying and selling of goods and services in these shops in Macau.",1],["Store of value: Hong Kong dollar deposits enable people to store up the purchasing power for future spending on goods and services.",1]]},{"id":"DSEPP/P2/Q8","q":"Demand deposits can be regarded as money. Explain which TWO functions of money they can perform. (4 marks)","marks":4,"cmd":"Explain","ch":"m:money","points":[["Medium of exchange: Cheques serve as a medium to facilitate people's buying and selling of goods and services.",2],["Store of value: Demand deposits enable people to store up the purchasing power for future spending on goods and services.",2]]},{"id":"DSE2024/P2/Q6","q":"Refer to the following conversation between two villagers in a barter economy. Villager A: I want to exchange my beans for your pork. Villager B: But what I want now is rice. (a) A problem that hinders exchanges in a barter economy is revealed in the above situation. Identify the problem. (1 mark) (b)(i) What is money? (1 mark) (b)(ii) Explain how the use of money can facilitate exchanges. (2 marks)","marks":4,"cmd":"Identify & Explain","ch":"m:money","points":[["(a) The lack of double coincidence of wants.",1],["(b)(i) Money is anything that is generally accepted as a medium of exchange.",1],["(b)(ii) The use of money allows the acts of buying and selling to be separated, so that exchange no longer requires double coincidence of wants. For example, Villager A may sell his beans for money and use the money to p",2]]},{"id":"DSE2014/P2/Q5","q":"Study the following information about an economy. Year Consumer price index (CPI) 2012 120 2013 126 Suppose people did not expect any change in the price level from 2012 to 2013. Explain whether each of the following persons would gain or lose when the change in the price level in the above table occurred. (c)(ii) In 2012, Marlene invested in a project with an expected nominal rate of return of 12% per year. In 2013, she discovered that the actual nominal rate of return was 15% per year. (3 marks)","marks":3,"cmd":"Explain","ch":"m:realint","points":[["(c)(ii) Marlene would lose",1],["because, given the 15% rate of actual nominal return and the 5% rate of actual inflation, her actual real rate of return equals 10% (= 15%-5%), which falls short of her expected real rate of return (12%).",2]]},{"id":"DSE2020/P2/Q5","q":"(a) What is the opportunity cost of holding money? Explain. (2 marks)","marks":2,"cmd":"Explain","ch":"m:realint","points":[["(a) Nominal interest (rate)",1],["because, while holding money, one has to give up the opportunity to earn interest income by depositing the sum into banks or by using the sum to purchase interest-earning assets like bonds.",1]]},{"id":"DSE2023/P2/Q10","q":"In 2022, the Hong Kong Financial Secretary announced the issuance of Silver Bonds for citizens aged 60 or above to subscribe. The nominal interest rate of the Silver Bonds is equal to the actual inflation rate in Hong Kong, subject to a minimum of 4%. Suppose the expected inflation rate is 4.5% and there turns out to be an actual deflation of 1%. (b)(i) Calculate the expected and the actual real rates of return on the Silver Bonds. (2 marks) (b)(ii) Based on your answer in (b)(i), explain whether holders of the Silver Bonds would gain or lose. (2 marks) Marking Scheme","marks":4,"cmd":"Calculate & Explain","ch":"m:realint","points":[["(b)(i) Expected real rate of return = 4.5% – 4.5% = 0%",1],["Actual real rate of return = 4% – (–1%) = 5%",1],["(b)(ii) Gain, because",1],["the actual real rate of return is higher than the expected real rate of return.",1]]},{"id":"DSEPP/P2/Q14","q":"(c) According to the quantity theory of money, explain how the increase in money supply affects the general price level in the long run. (4 marks)","marks":4,"cmd":"Explain","ch":"m:qtm","points":[["(c) QTM: MV = PY, where M = money stock, V = velocity of circulation of money, P = general price level and Y = real output",1],["Assuming Y is constant in long run,",1],["an increase in M will result in a rise in P by the same percentage.",2]]},{"id":"DSE2020/P2/Q4","q":"(c) 'The continuous open market purchase of government bonds by the central bank is the cause of inflation in the economy.' Justify the statement with reference to the classical quantity theory of money. (4 marks)","marks":4,"cmd":"Justify & State","ch":"m:qtm","points":[["(c) MV = PY, where M: money supply, V: velocity of circulation of money, P: price level and Y: output Assume V and Y being constant.",2],["A continuous increase in M (caused by the open market purchase) would result in a continuous increase in P, i.e. inflation.",2]]},{"id":"DSE2023/P2/Q12","q":"Inflation is a concern in the US. Different causes of inflation have been suggested, including rising crude oil prices, expansionary monetary policy, and high import tariffs. Source C: Money supply in the US May 2020 May 2021 Money supply (USD Billion) 17 766.9 20 319.6 (b) Refer to Source C. According to the quantity theory of money, explain under what condition the change in money supply as shown in the source would result in an increase in the general price level in the short run. (3 marks)","marks":3,"cmd":"Suggest & Explain","ch":"m:qtm","points":[["(b) Quantity Theory of Money: MV = PY",1],["M = money supply V = velocity of circulation of money P = price level Y = real output Assuming V to be constant,",1],["as M increases, P increases if the growth rate of M exceeds that of Y.",1]]},{"id":"DSE2025/P2/Q10","q":"The monetary policy of the US receives much attention. (a) The table below shows some data on the US economy. May 2022 May 2023 Money supply (USD Billion) 21 691.3 20 837.4 Inflation rate (measured by year-on-year percentage change in implicit 7.0% 3.6% price deflator of GDP) (a)(i) Calculate the money supply growth rate in the US from May 2022 to May 2023. (1 mark) (a)(ii) Based on the above data, what was the real output growth rate in the US from May 2022 to May 2023 as implied by the quantity theory of money? Explain your answer. (3 marks) Marking Scheme","marks":4,"cmd":"Show & Calculate","ch":"m:qtm","points":[["(a)(i) Money supply growth rate = (20 837.4 – 21 691.3) / 21 691.3 × 100% = -3.94%",1],["(a)(ii) QTM: MV = PY, where M is money supply, V is velocity of circulation of money, P is general price level, Y is real output, assuming V to be constant.",2],["Growth rate of Y ≈ growth rate of M – growth rate of P = -3.94 – 3.6 = -7.54%",1]]},{"id":"CE1998/P1/Q7","q":"(b) Suppose the salaries tax allowance in Hong Kong remains unchanged. Explain why the total tax revenue from this tax would increase at times of inflation. (3 marks)","marks":3,"cmd":"Explain","ch":"m:mtax","points":[["(b) During inflation, the nominal income of people increases.",2],["With no change in tax allowance, more people are put into the tax net or into higher tax brackets.",1]]},{"id":"CE1999/P1/Q10","q":"There is a serious unemployment problem in Hong Kong. Mr Ng is a Hong Kong citizen. He sets up a firm in Mainland China and earns profits. (c)(i) Explain whether Mr Ng needs to pay profits tax to the government of Hong Kong. (2 marks) (c)(ii) Mr Ng uses the Hong Kong International Airport when he flies to Mainland China. What tax does he have to pay to the government of Hong Kong? Which taxation principle is applied in this case? (2 marks)","marks":4,"cmd":"Explain","ch":"m:mtax","points":[["(c)(i) No. The source principle applies — the income earned is not derived from Hong Kong.",2],["(c)(ii) Airport departure tax.",1],["The equity principle / certainty principle / convenience principle / economy principle.",1]]},{"id":"CE2004/P1/Q10","q":"(e) In Hong Kong, the air passenger departure tax is $120 per adult passenger. Explain whether the tax is a progressive tax, a proportional tax or a regressive tax. (3 marks)","marks":3,"cmd":"Explain","ch":"m:mtax","points":[["(e) Regressive tax. This is because",1],["same tax payment relative to different incomes",1],["⇒ decreasing tax rate as income rises.",1]]},{"id":"DSE2014/P2/Q6","q":"Karen, a Hong Kong resident, works as a photographer in a media group in Shanghai. (a) Would Karen’s salary earned in Shanghai be taxed in Hong Kong? Explain your answer. (2 marks) (b) Is salaries tax a direct or an indirect tax? Explain your answer. (2 marks)","marks":4,"cmd":"Explain","ch":"m:mtax","points":[["(a) No,",1],["because, according to the source principle, income not derived from HK would not be taxed by the HK government.",1],["(b) Direct tax,",1],["because the tax burden cannot be shifted by these tax-payers to someone else.",1]]},{"id":"DSE2024/P2/Q12","q":"Since the 2010s, the government of Saudi Arabia has been actively promoting football development. Neymar is a famous Brazilian footballer. He has been recruited by a football club in Saudi Arabia recently. Suppose he is required to pay an income tax of 20% on his taxable income to the Government of Saudi Arabia. Explain whether the income tax paid by Neymar is (d)(i) a direct tax or an indirect tax. (2 marks) (d)(ii) progressive, proportional or regressive. (2 marks)","marks":4,"cmd":"Explain","ch":"m:mtax","points":[["(d)(i) Direct tax, because the tax burden cannot be shifted by the tax-payer (Neymar) to someone else.",2],["(d)(ii) Proportional tax, because the average tax rate remains unchanged (20%) when the taxable income changes.",2]]},{"id":"DSE2025/P2/Q9","q":"In the 2024-25 Budget, the Financial Secretary proposed to adjust the rate of the hotel accommodation tax (HAT) from 0% to 3% with effect from 1 January 2025. Hotels and guesthouses would be required to pay the HAT at the rate of 3% on accommodation charges. (a) Explain whether the proposed HAT is a progressive tax, a proportional tax or a regressive tax. (3 marks)","marks":3,"cmd":"Explain","ch":"m:mtax","points":[["(a) It is a regressive tax, because",1],["the same amount of tax needs to be paid when living in a hotel room of the same price regardless of income.",1],["Therefore, the average tax rate decreases as income increases.",1]]},{"id":"CE2004/P1/Q9","q":"Hong Kong is facing a huge fiscal deficit and deflation. Explain how government expenditure and government revenue are affected by Hong Kong's (a)(i) economic downturn. (4 marks)","marks":4,"cmd":"Explain","ch":"m:mtax","points":[["(a)(i) economic downturn ⇒ ↑ expenditure on public assistance, unemployment benefits",1],["⇒ government expenditure ↑",1],["economic downturn ⇒ more people become unemployed ⇒ salaries ↓, profits ↓, rental income ↓",1],["⇒ government revenue ↓",1]]},{"id":"DSE2021/P2/Q9","q":"A small open economy imports junk food from other countries although such food is also produced by local manufacturers. During economic recession, local people consume more junk food. To improve public health, the government imposes an effective quota on the imported junk food. (b) With respect to the imposition of an effective quota during economic recession, indicate the amount of quota as QA and the final equilibrium point as EA in Figure 1. (4 marks)","marks":4,"cmd":"Indicate","ch":"m:barrier","points":[["(b) Illustrate in Figure 1: - correct position of the quota (QA)",1],["- rightward shift of demand curve",1],["- a new kinked supply curve (Swith quota)",1],["- correct position of the final equilibrium point (EA)",1]]},{"id":"DSE2025/P2/Q8","q":"A small open economy imports agricultural products from other countries although agricultural products are also produced by domestic farmers in the economy. To protect the domestic farmers, the government of the economy imposes a per-unit tariff on imported agricultural products. The economy remains to be an importer of agricultural products after the imposition of the tariff. Figure 1: Market of agricultural products in the small open economy In Figure 1, indicate the following after the imposition of the tariff: (a)(i) the quantity of domestic production as Q1, (2 marks) (a)(ii) the import v","marks":4,"cmd":"Indicate","ch":"m:barrier","points":[["(a)(i) Indicate in the diagram: - correct position of Pw+t",1],["- correct position of Q1",1],["(a)(ii) Indicate in the diagram: - correct position of QM",1],["(a)(iii) Indicate in the diagram: - correct position of tariff revenue",1]]},{"id":"CE2006/P1/Q9","q":"(c) In the summer of last year, the growing business of many retail shops led to an increase in the employed population in Hong Kong. However, the unemployment rate during the same period of time remained unchanged. Explain why the unemployment rate can still remain unchanged in spite of an increase in the employed population. (4 marks)","marks":4,"cmd":"Explain","ch":"m:unemp","points":[["(c) unemployment rate = unemployed population / labour force * 100%",1],["The unemployed population increased, AND both the labour force and the unemployed population increased at the same rate / same percentage.",3]]},{"id":"CE2007/P1/Q8","q":"Suppose these top-quality Mainland students stay and work in Hong Kong after their graduation and the total number of job positions in Hong Kong remains unchanged. (b)(i) Explain how this situation would affect the unemployment rate of Hong Kong. (4 marks)","marks":4,"cmd":"Explain","ch":"m:unemp","points":[["(b)(i) Total labour force increases (Mainland students join HK labour force after graduation).",1],["Unemployed population increases (total job positions remain unchanged).",1],["Increase in total labour force = increase in unemployed population, OR % increase in the unemployed population > % increase in the labour force.",1],["As a result, unemployment rate increases.",1]]},{"id":"DSEPP/P2/Q6","q":"The following is a news report about Economy A. Skilled construction workers are in great demand after the launch of the construction project of a new high-speed railway system. A government official has announced the introduction of a labour importation scheme to meet the need for skilled workers. Suppose the imported workers do not replace any of the domestic workers. Explain how the unemployment rate will be affected by the scheme. (4 marks)","marks":4,"cmd":"Explain","ch":"m:unemp","points":[["Unemployment rate = number of unemployed ÷ labour force × 100%",1],["Labour force increases",1],["while the number of unemployed remains unchanged",1],["and the unemployment rate will decrease.",1]]},{"id":"DSE2023/P2/Q6","q":"Study the following statistical data of Hong Kong. Year Labour Force (thousand persons) 202 3 918.5 0 202 3 870.4 1 'The above change in labour force necessarily implies a rise in the unemployment rate in 2021 in Hong Kong'. Do you agree? Explain your answer. (4 marks)","marks":4,"cmd":"Explain","ch":"m:unemp","points":[["No. Unemployment rate = (unemployed population / labour force) × 100%.",2],["Despite the decrease in the size of HK's labour force, the unemployment rate would fall (or remain unchanged) if the percentage decrease in the unemployed population was greater than (or equal to) that in the labour forc",2]]}],"traps":[{"id":"in1","ch":"ch1","text":"Scarcity ≠ shortage. Scarcity means resources are limited relative to unlimited wants — it exists even when prices have already adjusted to clear the market (no shortage). A shortage is a market DISEQUILIBRIUM (quantity demanded > quantity supplied at the current price); it only ever happens to a good that is already scarce, but scarcity itself doesn't require an actual shortage.","qs":[{"id":"AL2002/P1/Q17","q":"Which of the following statements about scarcity and shortage is correct?","opts":["Scarcity implies shortage.","The existence of market prices implies scarcity.","Shortages are caused by reduction in supply.","There is no scarcity in a one-man economy."],"ans":1,"why":"Only scarce (economic) goods carry a positive market price — free goods have no price. So a market price is proof the good is scarce. Scarcity itself doesn't guarantee a shortage (price can adjust to clear the market), and even a one-man economy still faces scarcity since his wants exceed his own resources/time."},{"id":"AL2004/P1/Q1","q":"Scarcity implies","opts":["everything is not enough.","there is a shortage, and without a shortage there will be no price.","that an individual is willing to sacrifice something for something else.","a market will emerge."],"ans":2,"why":"Scarcity means resources can't satisfy all wants, so choosing one option requires giving up (sacrificing) another — this is the essence of opportunity cost. Not everything is scarce (free goods exist), scarcity doesn't require an actual shortage, and it doesn't guarantee a market will emerge (non-market rationing is possible)."},{"id":"AL2009/P1/Q1","q":"Which of the following statements about scarcity and shortage is correct?","opts":["Whenever there is shortage, there must be scarcity.","In a one-man economy, there may be shortage.","Whenever there is scarcity, there must be shortage.","Scarcity necessarily implies competition."],"ans":0,"why":"A shortage (quantity demanded exceeding quantity supplied at the going price) can only happen to a good that is scarce to begin with — an unlimited free good can never be in shortage. But scarcity doesn't always cause shortage (prices can adjust), a one-man economy has no market so 'shortage' doesn't apply, and scarcity doesn't strictly require active competition (e.g. a lone user)."}]},{"id":"in2","ch":"ch1","text":"Scarcity doesn't disappear in a one-person economy, a barter economy, or a planned economy. It only requires that wants exceed available resources for at least one person — no market, money, or private ownership is needed for scarcity to exist.","qs":[{"id":"AL2006/P1/Q24","q":"In a one-man economy, there will still be","opts":["property rights.","shortage.","exchange.","scarcity."],"ans":3,"why":"Scarcity only requires that one person's wants exceed the resources/time available to him — this holds even alone on a desert island. Property rights, exchange, and shortage are all concepts that require interaction between two or more economic agents, so none apply in a one-man economy."},{"id":"CE1997/P2/Q1","q":"Which of the following statements about scarcity is true?","opts":["Once a choice is made, the problem of scarcity is solved.","A good is scarce if not everyone has it.","Scarcity means unlimited human wants.","Both rich people and poor people face the problem of scarcity."],"ans":3,"why":"Scarcity comes from wants exceeding resources — this applies to everyone, since even the wealthiest person cannot have everything they want. Making a choice is a response to scarcity, not a solution that removes it; 'not everyone has it' isn't the definition of scarcity; and scarcity needs both unlimited wants AND limited resources, not unlimited wants alone."},{"id":"CE1999/P2/Q1","q":"The existence of scarcity implies that","opts":["the economy is planned economy.","there is competition for the good.","effective price control is imposed on that good.","wealth is not evenly distributed."],"ans":1,"why":"Because a scarce good cannot satisfy every claimant, people must compete for the limited amount available — this holds under any economic system, with or without price controls, and regardless of how wealth is distributed."}]},{"id":"in3","ch":"ch1","text":"Sunk costs (already paid, unrecoverable) are never part of an opportunity cost calculation. Only forward-looking, forgone alternatives count. If a question mentions money spent in the past on the item under discussion, that figure is almost always a distractor.","qs":[{"id":"CE1991/P2/Q2","q":"Susan is choosing between two jobs: being a teacher and being a singer. If she chooses to be a singer, her opportunity cost will include","opts":["the income from being a teacher.","the income from being a singer.","the tuition fee she paid for her training as a teacher.","the tuition fee she paid for her training as a singer."],"ans":0,"why":"Opportunity cost of choosing to be a singer is the value of the next-best alternative given up — the teaching income she forgoes. Her own singer's income is what she gains, not a cost, and both tuition fees are sunk costs already paid regardless of her current choice, so they don't enter the opportunity cost of this decision."},{"id":"CE2002/P2/Q3","q":"Mr Lee lives in his own house. He bears an opportunity cost from living in that house because (1) he could earn rental income from letting the house to others. (2) he has to pay property tax to the government. (3) he has paid a sum of money to buy the house.","opts":["(1) only","(1) and (2) only","(1) and (3) only","(2) and (3) only"],"ans":0,"why":"His opportunity cost of living in the house himself is specifically the rental income he forgoes by not letting it out (1). Property tax (2) is a direct ongoing expense, not a forgone alternative, and the purchase price (3) is a sunk cost already paid regardless of whether he lives in it or rents it out, so neither belongs in the opportunity cost of his current choice."},{"id":"DSEPP/P1/Q2","q":"Mr. Chan spent $5,000 on buying a new mobile phone which can be sold for $7,000 in the second-hand market. Mr. Chan’s cost of keeping the mobile phone is __________.","opts":["$0","$2 000","$5 000","$7 000"],"ans":3,"why":"His opportunity cost of keeping the phone is the amount he gives up by not selling it — the full $7,000 second-hand market price. The original $5,000 purchase price is a sunk cost, irrelevant to the current decision of whether to keep or sell."}]},{"id":"in4","ch":"ch1","text":"Opportunity cost is the value of the SINGLE highest-valued alternative forgone — not the sum of every rejected option. It changes when the value of that FORGONE alternative changes, not when the value of the CHOSEN option changes: a pay cut/raise on the option you actually picked doesn't touch its own opportunity cost.","qs":[{"id":"CE1990/P2/Q1","q":"Tommy was asked to choose one birthday present from the following three thins: a model spaceship, a walkman and a jacket. He liked the model spaceship the most and the walkman second. What would be his opportunity cost if he chose the model spaceship?","opts":["a walkman","a walkman and a jacket","the price of a model spaceship","no opportunity cost since it was a present"],"ans":0,"why":"Opportunity cost is the value of the single best forgone alternative, not all alternatives combined. Since Tommy ranked the walkman as his second choice, that is what he gives up by choosing the spaceship — the jacket (his least preferred) is irrelevant, and being a 'present' doesn't remove the cost of forgoing his next-best option."},{"id":"CE1995/P2/Q5","q":"Fanny can choose among three different jobs. Her choice of preference is as follows: First priority: being a teacher in School X Second priority: being a secretary in Company Y Third priority: being a sales representative in Firm Z Assuming her choice of preference remains unchanged, which of the following will increase Fanny’s opportunity cost of being a teacher in School X?","opts":["The students in School X are becoming more naughty.","Company Y requires its secretaries to work longer hours.","Company Y decides to increase the salaries of its secretaries.","Firm Z decides to increase the bonuses for its sales representatives."],"ans":2,"why":"Fanny's opportunity cost of teaching is the value of her next-best alternative — being a secretary at Company Y. If Company Y raises secretary salaries, that forgone alternative becomes more valuable, raising her opportunity cost. Changes to School X itself (A) or to Firm Z (D, her third choice, not the relevant alternative) don't affect the cost of her chosen option; longer hours (B) without a pay change doesn't clearly raise the job's value."},{"id":"CE1998/P2/Q50","q":"May is considering accepting one of the following job offers: (1) a clerk in an import-export firm. (2) a salesgirl in a department store. Which of the following changes will NOT affect her opportunity cost of choosing to work as a clerk?","opts":["The import-export firm increases its staff's welfare.","The department store offers a higher salary.","There is a third offer paying a higher salary than the original two offers.","The department store announces that their business will terminate one year later."],"ans":0,"why":"Opportunity cost of taking the clerk job is the value of her best forgone alternative — currently the salesgirl job (or a better third offer, if one exists). Improving the CHOSEN option itself (the clerk job's welfare) doesn't change the value of what's given up, so it leaves opportunity cost unaffected; changes to the salesgirl job's pay, or a new higher-paying third option, would change the best alternative's value."}]},{"id":"in5","ch":"ch1","text":"Being 'free of charge' is NOT the same as being a 'free good'. A free good is defined by zero marginal benefit — nobody wants any MORE of it even at a zero price. Something can be given away for free by a shop, government, or friend and still be an economic good, because the resources behind it are scarce and have alternative uses.","qs":[{"id":"AL2001/P1/Q19","q":"A free good","opts":["is less preferable than an economic good.","has zero marginal benefit.","is a good that has no demand.","is a good provided by a generous person free of charge."],"ans":1,"why":"A free good yields zero marginal benefit — people don't want any more of it even at a zero price, because supply already exceeds desired quantity. It isn't inherently 'less preferable', it can still have demand (just fully satisfied at zero price), and being 'free of charge' by a generous giver doesn't make something a free good in the economic sense if it's still scarce."},{"id":"CE1993/P2/Q16","q":"In Nathan Road one day, samples of a new brand of shampoo were given away free to passers-by. Within an hour, all available samples were gone. These free samples are ______ because ______.","opts":["free goods; they are free of charge
