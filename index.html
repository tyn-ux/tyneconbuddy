<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<script>
/* ===== 班級模式設定 Class mode =====
   貼上 Google Apps Script Web app URL（見 GUIDE.md）。留空 = 單機模式，唔使登入。
   Paste your Apps Script Web app URL here. Leave empty for offline mode. */
window.ECONMON_API = '';
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EconMon 經濟獸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --ground:#e3eef0; --ink:#1f2b33; --muted:#5d6c75;
  --shell:#2f7f86; --shell-dark:#1f5a60; --bezel:#162a2e;
  --paper:#fdfcf7; --frame:#4f6f7a; --line:#d3dde0;
  --red:#e0503c; --blue:#2f6fb0; --gold:#f2c230; --ok:#2f8a5a; --bad:#c0392b;
  --pix:"Press Start 2P", ui-monospace, monospace;
  --txt:"Noto Sans HK", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
}
body{background:var(--ground);background-image:radial-gradient(#cbdde0 1px,transparent 1px);background-size:14px 14px;color:var(--ink);font-family:var(--txt)}
.wrap{max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));height:100dvh;min-height:420px;display:flex;flex-direction:column;box-sizing:border-box}
html,body{margin:0;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex:none}
.musicbtn{font:700 12px var(--txt);background:#fff;border:2px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--ink)}.musicbtn.on{border-color:var(--shell);color:var(--shell)}
.logo{font-family:var(--pix);font-size:18px;color:var(--shell);letter-spacing:1px;text-shadow:2px 2px 0 var(--gold)}
.sub{font-size:13px;color:var(--muted);font-weight:700}
.console{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#3a9aa2,var(--shell) 40%,var(--shell-dark));border-radius:18px 18px 36px 18px;padding:10px;box-shadow:0 10px 0 #184a4f,0 18px 30px rgba(20,60,70,.3)}
.bezel{background:var(--bezel);border-radius:10px;padding:8px;position:relative;flex:none}
.bezel canvas{display:block;width:min(100%,calc(40dvh * 1.48));height:auto;aspect-ratio:34/23;margin:0 auto;image-rendering:pixelated;border-radius:3px;background:#000}
.led{position:absolute;left:4px;top:50%;width:4px;height:4px;border-radius:50%;background:#ff5a5a;box-shadow:0 0 6px #ff5a5a}
.panel{margin-top:8px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border:3px solid var(--frame);border-radius:10px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #cfdadd;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ptext{font-size:16px;line-height:1.65;font-weight:500;min-height:3.3em;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.ptext .hint{color:var(--muted);font-size:14px}
.ptext .place{font-weight:900;color:var(--blue)}
.more{display:inline-block;color:var(--red);margin-left:4px;animation:blink 1s steps(2) infinite;font-size:12px}
@keyframes blink{50%{opacity:0}}
.pchoices{display:grid;grid-template-columns:1fr;gap:6px}
.pchoices.g2{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-radius:7px;padding:8px 10px 8px 26px;font:500 15px/1.45 var(--txt);color:var(--ink);cursor:pointer}
.opt:hover{border-color:#9fb7bd}
.opt.sel{border-color:var(--red);background:#fff6f3}
.opt.sel::before{content:"▶";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--red);font-size:11px}
.opt.right{border-color:var(--ok);background:#eef8f1}
.opt.wrong{border-color:var(--bad);background:#fdf0ee}
.opt:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* question */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:-10px;z-index:3;background:var(--paper);padding:6px 0 4px;margin-top:-4px;box-shadow:0 2px 0 var(--paper)}
.coin{font-weight:900;color:#8a5a10}
.qtype{font:700 12px var(--txt);color:#fff;background:var(--blue);border-radius:10px;padding:2px 9px}
.timer{flex:1;min-width:120px;height:10px;background:#e4eaec;border-radius:6px;overflow:hidden;position:relative}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:6px}
.secs{font-family:var(--pix);font-size:10px;color:var(--muted);min-width:34px;text-align:right}
.hintbtn{font:700 12px var(--txt);background:#fff8e1;border:2px solid var(--gold);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--ink)}
.hintbtn:disabled{opacity:.45;cursor:default}
.qprompt{font-size:16px;line-height:1.6;font-weight:700}
.qhint{font-size:14px;background:#fff8e1;border-left:4px solid var(--gold);padding:6px 10px;border-radius:4px}
.bi .en{display:block}.bi .zh{display:block;color:#35606e;font-weight:600;font-size:.93em;margin-top:1px}
.opt .bi{display:inline}.opt .bi .en{display:inline}.fillzh{font-size:14px;color:#35606e;font-weight:600;line-height:1.5;margin-top:-4px}
.fb .bi{margin-top:2px}.fb .bi .zh{font-size:.95em}
.fillline{font-size:16px;line-height:2.2;font-weight:700}
.slot{display:inline-block;min-width:74px;padding:2px 10px;margin:0 3px;border:2px dashed #9fb7bd;border-radius:8px;background:#f5f9fa;text-align:center;font:700 14px var(--txt);color:var(--ink);cursor:pointer;vertical-align:middle;line-height:1.6}
.slot.filled{border-style:solid;border-color:var(--blue);background:#eaf2fb}
.slot.hot{border-color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 14px var(--txt);background:#fff;border:2px solid #b9c9ce;border-radius:18px;padding:6px 12px;cursor:grab;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.chip.used{opacity:.3;pointer-events:none}
.chip.pick{border-color:var(--red);background:#fff1ee;box-shadow:0 0 0 3px rgba(224,80,60,.2)}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:translate(-50%,-50%);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bin{border:2px dashed #9fb7bd;border-radius:10px;padding:8px;min-height:64px;background:#f5f9fa;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.bin.hot{border-color:var(--red);background:#fff6f3}
.bin b{font-size:13px;color:var(--blue)}
.bin .chip{align-self:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;padding:6px;border-radius:10px;background:#f0f4f5}
.oslots{display:grid;gap:6px}
.oslot{display:flex;align-items:center;gap:8px;border:2px dashed #9fb7bd;border-radius:10px;padding:6px 10px;min-height:40px;background:#f5f9fa;cursor:pointer;font:700 14px var(--txt)}
.oslot.filled{border-style:solid;border-color:var(--blue);background:#eaf2fb}
.oslot.hot{border-color:var(--red)}
.oslot em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.submit{align-self:flex-start;font:700 15px var(--txt);background:var(--red);color:#fff;border:0;border-radius:10px;padding:8px 18px;cursor:pointer}
.submit:disabled{background:#c9cfd1;cursor:default}
.fb{border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6}
.fb.ok{background:#eef8f1;border:2px solid var(--ok)}
.fb.bad{background:#fdf0ee;border:2px solid var(--bad)}
.fb strong{display:block;margin-bottom:2px}
.points{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.points li{background:#eef5fb;border-left:4px solid var(--blue);padding:6px 10px;border-radius:4px;font-size:14px}
.points b{font-family:var(--pix);font-size:10px;color:var(--red);margin-right:6px}
/* pad */
.pad{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:8px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}
.dpad button{background:#15343a;border:0;color:#7fa6ad;font-size:12px;cursor:pointer}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}.dpad .c{grid-area:2/2;background:#15343a}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.mid{display:flex;justify-content:center;gap:10px}
.pbtn{font-family:var(--pix);font-size:8px;letter-spacing:1px;color:#d2eef0;background:#1a4a50;border:0;border-radius:10px;padding:7px 12px;cursor:pointer}
.ab{display:flex;gap:10px;transform:rotate(-18deg)}
.ab button{width:50px;height:50px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f07a8a,#c83a4a);color:#fff;font-family:var(--pix);font-size:13px;box-shadow:0 4px 0 #8a2030;cursor:pointer}
.ab button:active,.dpad button:active,.pbtn:active{transform:translateY(2px)}
.keys{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.6}
.keys kbd{font-family:var(--pix);font-size:9px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px}
.toast{position:absolute;right:26px;top:22px;background:var(--gold);color:var(--ink);font:700 12px var(--txt);padding:4px 10px;border-radius:12px;z-index:5}
/* modal */
.modal{position:fixed;inset:max(8px,env(safe-area-inset-top,0px)) 8px 8px;max-width:760px;margin:0 auto;background:#f4f8f8;border-radius:20px 20px 40px 20px;z-index:10;display:flex;flex-direction:column;overflow:hidden;border:4px solid var(--shell)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--shell);color:#fff}
.mhead h2{margin:0;font-family:var(--pix);font-size:13px;letter-spacing:1px}
.mbtn{font:700 14px var(--txt);background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.mbtn.ghostb{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.mbody{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted);background:#fff;border:1px dashed #c3d2d6;border-radius:8px;padding:8px 10px;line-height:1.6}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:700 13px var(--txt);background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--shell);border-color:var(--shell);color:#fff}
.dexrow{display:grid;grid-template-columns:34px 52px 1fr auto;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;text-align:left;font:inherit;color:inherit;width:100%}
.dexrow.click{cursor:pointer}.dexrow.click:hover{border-color:#9fb7bd}
.dexnum{font-family:var(--pix);font-size:9px;color:var(--muted)}
.thumb{width:48px;height:48px;background:#e9f1f2;border-radius:6px;display:grid;place-items:center;font-family:var(--pix);font-size:12px;color:#a9bcc0;overflow:hidden}
.thumb canvas{width:48px;height:48px;image-rendering:pixelated}
.dexname{font-weight:700;font-size:15px;line-height:1.35}
.dexname small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.st{font-size:12px;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.st.c{color:var(--ok)}
.card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .big{width:128px;height:128px;image-rendering:pixelated;align-self:center;background:#e9f1f2;border-radius:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;line-height:1.55}
.kv dt{font-weight:900;color:var(--muted)}
.kv dd{margin:0}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
/* tiers */
.tier{display:inline-block;font:700 10px var(--txt);color:#fff;border-radius:8px;padding:1px 7px;vertical-align:middle;letter-spacing:.5px}
.tier.basic{background:#3fae5a}.tier.rare{background:#2f7fd0}.tier.epic{background:linear-gradient(90deg,#7b3fc4,#b56cf0,#7b3fc4);background-size:200% 100%;animation:shine 2.2s linear infinite}
.tier.legendary{background:linear-gradient(90deg,#e2711c,#ffd24a,#e2711c);background-size:200% 100%;color:#4a2400;animation:shine 1.6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.dexrow.t-basic{border-left:5px solid #3fae5a}.dexrow.t-rare{border-left:5px solid #2f7fd0}
.dexrow.t-epic{border-left:5px solid #9b4fd8;background:linear-gradient(100deg,#fff 40%,#f3e8ff 50%,#fff 60%);background-size:250% 100%;animation:shine 3s linear infinite}
.dexrow.t-legendary{border:2px solid #f0a020;border-left:5px solid #f08a1c;background:linear-gradient(100deg,#fffaf0 40%,#ffe9a8 50%,#fffaf0 60%);background-size:250% 100%;animation:shine 2.2s linear infinite}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px}
.stats b{font-family:var(--pix);font-size:8px;color:var(--muted)}
.sbar{height:8px;background:#e4eaec;border-radius:4px;overflow:hidden}.sbar i{display:block;height:100%;border-radius:4px}
.xpbar{height:6px;background:#e4eaec;border-radius:3px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--gold)}
.prow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.prow.lead{border-color:var(--shell);box-shadow:0 0 0 2px rgba(47,127,134,.25)}
.prow .pname{font-weight:700;font-size:14px;line-height:1.35}
.prow .pmeta{font-size:12px;color:var(--muted)}
.items{display:flex;gap:6px;flex-wrap:wrap}
.itm{font:700 12px var(--txt);background:#eef6f7;border:2px solid #b9d6da;border-radius:12px;padding:2px 8px;cursor:pointer;color:var(--ink)}
.itm:disabled{opacity:.4;cursor:default}
.dse{display:grid;gap:6px}
.dcard{text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:7px 10px;font:500 14px/1.45 var(--txt);color:var(--ink);cursor:pointer}
.dcard.on{border-color:var(--blue);background:#eaf2fb}.dcard.right{border-color:var(--ok);background:#eef8f1}.dcard.wrong{border-color:var(--bad);background:#fdf0ee}
.dsehint{font-size:13px;color:var(--muted);font-weight:700}
.marks{font-weight:900;margin-top:4px}
.scheme{margin:6px 0 0;padding-left:0;list-style:none;font-size:14px}.scheme li{margin:3px 0}.scheme b{color:var(--red);margin-right:4px}
.bagrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.bagrow .ic{font-size:24px;text-align:center}
.diagbox{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:4/3;background:#fbfdfd;border:2px solid var(--line);border-radius:10px}
.diagbox svg{position:absolute;inset:0;width:100%;height:100%}
.dslot{position:absolute;transform:translate(-50%,-50%);min-width:30%;max-width:48%;min-height:28px;border:2px dashed #9fb7bd;border-radius:10px;background:rgba(245,249,250,.92);display:flex;align-items:center;justify-content:center;padding:2px;font-size:11px;color:var(--muted)}
.dslot.hot{border-color:var(--red)}.dslot .chip{font-size:10.5px;padding:2px 6px;line-height:1.25;white-space:normal;text-align:center}
.shiftrow{display:grid;grid-template-columns:auto 42px minmax(96px,auto) 42px;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.shiftrow button{font:700 16px var(--txt);width:42px;height:36px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer}
.tired{display:inline-block;font-size:11px;font-weight:700;color:#8a5a10;background:#fff3d6;border:1px solid #f0c060;border-radius:8px;padding:0 6px}
.jmap{width:100%;max-width:640px;margin:0 auto;display:block;background:#fbfdfd;border:2px solid var(--line);border-radius:12px}
.jlist{display:grid;gap:6px}.jlist div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5}
@media print{body *{visibility:hidden}#modal,#modal *{visibility:visible}#modal{position:absolute;inset:0;border:0}.mhead,.tabs,.noprint{display:none!important}}
.login{position:fixed;inset:0;z-index:40;background:rgba(22,42,46,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.login .lbox{background:var(--paper);border:4px solid var(--shell);border-radius:16px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.login h2{margin:0;font-family:var(--pix);font-size:14px;color:var(--shell)}
.login label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700}
.login input{font:500 16px var(--txt);padding:8px 10px;border:2px solid var(--line);border-radius:8px}
.login .err{color:var(--bad);font-size:13px;font-weight:700;min-height:1em}
.login .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board{display:grid;gap:4px}.board div{display:grid;grid-template-columns:34px 1fr auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;align-items:center}
.board .me{border:2px solid var(--shell);background:#eaf6f7}
@media (hover:none),(max-height:900px),(max-width:700px){.keys{display:none}}
body.qmode .bezel canvas{width:min(100%,calc(22dvh * 1.48))}
@media (orientation:landscape) and (min-width:700px){body.qmode .bezel canvas{width:min(100%,calc((100dvh - 190px) * 1.48))}}
@media (orientation:landscape) and (min-width:700px){
 .wrap{max-width:1200px}
 .console{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px}
 .bezel{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;min-height:0}
 .bezel canvas{width:min(100%,calc((100dvh - 190px) * 1.48))}
 .panel{grid-column:2;grid-row:1 / span 2;margin:0}
 .pad{grid-column:1;grid-row:2;margin:0}
}
@media (orientation:landscape) and (max-height:520px){
 .wrap{padding-top:4px}.top{margin-bottom:2px}.logo{font-size:13px}.sub{display:none}
 .console{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,1fr);grid-template-rows:minmax(0,1fr) auto;gap:6px;padding:6px}
 .bezel{grid-column:1;grid-row:1;padding:4px;display:flex;align-items:center;justify-content:center;min-height:0}
 .bezel canvas{width:min(100%,calc((100dvh - 120px) * 1.48))}
 .panel{grid-column:2;grid-row:1 / span 2;margin:0}.pad{grid-column:1;grid-row:2;margin:0}
 .dpad{grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px)}.ab button{width:38px;height:38px}
}
@media (max-width:420px){.ptext{min-height:2.4em}.logo{font-size:15px}.dpad{grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px)}.ab button{width:44px;height:44px}.ptext,.qprompt,.fillline{font-size:15px}}
</style>
</head>
<body style="margin:0">


<div class="wrap">
  <div class="top"><div class="logo">EconMon</div><div class="sub">大澳・深水埗・試場 · Ch.1–5 · 0.8</div><button class="musicbtn" id="musicbtn" type="button" aria-label="背景音樂">♪ BGM</button></div>
  <div class="console" id="console">
    <div class="bezel"><span class="led"></span><canvas id="screen" width="272" height="184" aria-label="遊戲畫面"></canvas></div>
    <div class="panel" id="panel" aria-live="polite">
      <div class="ptext" id="ptext">載入緊……</div>
      <div class="pchoices" id="pchoices"></div>
      <div id="qarea" hidden></div>
    </div>
    <div class="pad">
      <div class="dpad">
        <button class="u" data-k="up" aria-label="上">▲</button><button class="l" data-k="left" aria-label="左">◀</button><span class="c"></span><button class="r" data-k="right" aria-label="右">▶</button><button class="d" data-k="down" aria-label="下">▼</button>
      </div>
      <div class="mid"><button class="pbtn" data-k="start">START</button></div>
      <div class="ab"><button data-k="b" aria-label="B">B</button><button data-k="a" aria-label="A">A</button></div>

wantlet-01,wantlet,tf,,,"As long as a person is rich enough, all of his wants will be satisfied.",只要一個人夠有錢，佢嘅 wants 就會全部被滿足。,,,,,F,"Once one want is satisfied, does a new one appear?",滿足咗一個 want 之後，會唔會又有新嘅 want？,"When one want is satisfied, new wants appear – like a hermit crab that finds a bigger shell and then wants an even bigger one.",滿足咗一個 want，又會有新嘅 want。就好似寄居蟹換咗大殼，又想要更大嘅。
wantlet-02,wantlet,tf,,,Time and land are both limited resources.,時間同土地都係 limited resources。,,,,,T,How many hours does everyone have in a day?,每人每日有幾多個鐘？,"Everyone has only 24 hours a day, and flat land in Tai O is limited too.",每人每日只有 24 小時，大澳嘅平地亦都有限。
wantlet-03,wantlet,mc,,,The core of economics is the study of:,Economics 研究嘅核心係：,how to earn the most money|how to allocate limited resources to satisfy unlimited wants|how to manage shares|how to reduce wants,點樣賺最多錢|點樣分配有限資源去滿足無限 wants|點樣管理股票|點樣減少 wants,,,B,Think about the words 'limited' and 'unlimited'.,諗吓「有限」同「無限」兩個字。,Economics studies how individuals and organisations make choices about the allocation of limited resources to satisfy unlimited wants.,經濟學研究個人同機構點樣分配有限資源去滿足無限 wants。
wantlet-04,wantlet,mc,,,Which example best shows that wants are unlimited?,邊個例子最能說明 wants 係無限？,"A hermit crab gets a bigger shell, then wants an even bigger one|After a full meal, a person has no wants at all|A fisherman who has caught enough fish wants nothing else|Rich people never need to make choices",寄居蟹換咗大殼之後又想要更大嘅殼|一個人食飽飯就唔再有任何 wants|漁民捉夠魚就唔想要其他嘢|有錢人唔使做選擇,,,A,In which example does a new want appear after one is satisfied?,邊個例子入面，滿足咗之後又出現新嘅想要？,The other options assume wants can run out. A full person stops wanting food but still wants other things.,其他選項都假設 wants 會完。食飽咗唔想食，但仲會想要其他嘢。
wantlet-05,wantlet,fill,,,Economics studies how people make choices about the allocation of ____ resources to satisfy ____ wants.,經濟學研究人點樣分配 ① 嘅資源去滿足 ② 嘅 wants。,limited|unlimited|free|equal,有限|無限|免費|相等,,,limited|unlimited,"Which is limited, resources or wants?",資源同 wants，邊樣有限、邊樣無限？,"The starting point of the subject: resources are limited, wants are unlimited.",整個科目嘅起點：資源有限，wants 無限。
wantlet-06,wantlet,fill,,,"A Tai O salt worker has only 24 hours a day, so time is a ____ resource.",大澳鹽工每日只有 24 小時，時間係一種 ① resource。,limited|free|unlimited|public,有限|免費|無限|公共,,,limited,"If time is spent drying salt, can it also be spent mending nets?",時間用咗喺曬鹽，仲可唔可以同時用喺補網？,Time used for one thing cannot be used for something else at the same time.,時間用咗喺一樣嘢，就唔可以同時用喺其他嘢上面。
wantlet-07,wantlet,sort,,,Sort the cards:,將卡片分類：,wants|resources,想要|資源,wanting a motorised boat|fishing nets|salt pans|wanting to move to the city|salt workers' labour|wanting to eat yellow croaker,想買機動船|漁網|鹽田|想搬出市區住|鹽工嘅勞力|想食黃花魚,1|2|2|1|2|1,"Is it something people want, or a tool used to produce?",「想要」定係「用嚟做嘢嘅工具」？,Wants are what people desire; resources are the tools used to satisfy wants.,Wants 係「想要」，resources 係用嚟滿足 wants 嘅工具。
wantlet-08,wantlet,mc,,,Studying how one salt worker decides whether to dry salt or go fishing belongs to:,研究一個鹽工點決定曬鹽定打魚，屬於：,microeconomics|macroeconomics|neither|both,微觀經濟學|宏觀經濟學|兩者都唔係|兩者都係,,,A,Is it about one person or the whole economy?,研究嘅係一個人，定係成個經濟體？,Microeconomics studies how individual economic units make decisions.,Microeconomics 研究個別經濟單位點樣做決定。
wantlet-09,wantlet,tf,,,"Once Tai O residents have tap water, they will have no other wants.",大澳居民有咗自來水之後，就唔會再有其他 wants。,,,,,F,"After getting water, will they want other things?",有咗食水之後，佢哋會唔會想要其他嘢？,One want being satisfied does not end the others – wants are unlimited.,一個 want 被滿足，其他 wants 仍然存在，wants 係無限嘅。
wantlet-10,wantlet,mc,,,Which of the following is NOT a resource?,以下邊樣唔係 resource？,salt workers' labour|a fishing boat|the wish to travel|salt pans,鹽工嘅勞力|漁船|想去旅行嘅願望|鹽田,,,C,Which one is a 'want' rather than something used to produce?,邊一樣係「想要」，唔係用嚟生產嘅嘢？,"The wish to travel is a want, not a resource.",想去旅行係 want，唔係 resource。
wantlet-11,wantlet,sort,,,Limited or unlimited?,「limited」定「unlimited」？,limited|unlimited,有限|無限,hours in a day|human wants|area of salt pans|fishermen's energy,一日嘅時間|人嘅 wants|鹽田面積|漁民嘅體力,1|2|1|1,Which one will never be fully satisfied?,邊一樣永遠唔會有滿足晒嘅一日？,Only wants are unlimited; everything else is a limited resource.,只有 wants 係無限，其他全部係有限資源。
wantlet-12,wantlet,fill,,,"Wants are ____, but resources are ____.",Wants 係 ①，但資源係 ②。,unlimited|limited|free|equal,無限|有限|免費|相等,,,unlimited|limited,These are the two ingredients of scarcity.,呢句就係 scarcity 嘅兩個成分。,Unlimited wants plus limited resources together create scarcity.,Wants 無限、資源有限，兩者一齊先產生 scarcity。
wantlet-S1,wantlet,mc,scen,,"(Fictional) Kelly, an office worker in Mong Kok, gets a pay rise and buys the new phone she wanted. A month later she wants a bigger flat. This best shows that:",（虛構）喺旺角返工嘅 Kelly 加咗人工，買咗佢一直想要嘅新手機。一個月之後，佢又想搬去大啲嘅單位。呢件事最能說明：,human wants are unlimited|Kelly's resources are unlimited|a pay rise removes all wants|phones are free goods,人嘅 wants 係無限嘅|Kelly 嘅 resources 係無限嘅|加人工會令所有 wants 消失|手機係 free good,,,A,"After one want was satisfied, what happened next?",一個 want 被滿足咗之後，跟住發生咗咩事？,"When one want is satisfied, a new want appears, so wants are unlimited even when income rises.",滿足咗一個 want，又會出現新嘅 want，所以就算收入增加，wants 都係無限嘅。
wantlet-S2,wantlet,sort,scen,,(Fictional) The Wong family runs a small restaurant in Tai O. Sort each card:,（虛構）黃家喺大澳開咗間細餐廳。將卡片分類：,wants|limited resources,wants|limited resources,"wanting to open a second branch in Tung Chung|the cook's working hours|the shop space in their stilt house|wanting air-conditioning for customers|their savings of $50,000","想喺東涌開分店|廚師嘅工作時間|棚屋入面嘅舖位|想為客人裝冷氣|佢哋 $50,000 嘅積蓄",1|2|2|1|2,"Is it something they desire, or something they can use to produce?",係佢哋「想要」嘅嘢，定係可以用嚟生產嘅嘢？,"Wants are desires; time, space and money are limited resources used to satisfy them.",Wants 係想要嘅嘢；時間、空間同金錢係用嚟滿足 wants 嘅 limited resources。
wantlet-S3,wantlet,fill,scen,,"(Fictional) The Chan family in Sha Tin earns $10,000 a month. They want to spend $6,000 on rent, $3,000 on food and $2,500 on tutoring. Their wants exceed their income by $____, so their money is ____.","（虛構）住沙田嘅陳家每月收入 $10,000。佢哋想用 $6,000 交租、$3,000 買餸、$2,500 補習。佢哋嘅 wants 比收入多出 $①，所以佢哋嘅錢係 ②。",1500|500|limited|unlimited,1500|500|limited|unlimited,,,1500|limited,"Add up what they want to spend, then compare with income.",將佢哋想使嘅錢加埋，再同收入比較吓？,"6,000 + 3,000 + 2,500 = 11,500, which is 1,500 more than income: resources (money) are limited relative to wants.","6,000 + 3,000 + 2,500 = 11,500，比收入多 1,500：相對 wants 嚟講，resources（錢）係有限嘅。"
wantlet-S4,wantlet,tf,scen,,"(Fictional) Mr Lau, a banker in Central, earns $5 million a year. He therefore faces no limited resources.",（虛構）喺中環做銀行嘅劉生每年賺 $500 萬，所以佢冇任何 limited resources。,,,,,F,How many hours does Mr Lau have in a day?,劉生每日有幾多個鐘？,"Even a rich person has limited resources such as time (24 hours a day), so wants still exceed resources.",有錢人都有 limited resources，例如時間（每日 24 小時），所以 wants 仍然多過 resources。
wantlet-S5,wantlet,mc,scen,,"(Fictional) A Tung Chung secondary school has one hall. The drama club, the basketball team and the choir all want to use it every Friday afternoon. The basic problem here is that:",（虛構）東涌一間中學得一個禮堂。戲劇學會、籃球隊同合唱團都想每個禮拜五下晝用。呢度嘅基本問題係：,the clubs have too few wants|the hall is a limited resource but wants for it are many|the hall is a free good|the school has unlimited resources,啲學會嘅 wants 太少|禮堂係 limited resource，但想用佢嘅 wants 好多|禮堂係 free good|學校有無限 resources,,,B,Can the hall be used by all three clubs at the same time?,三個學會可唔可以同一時間用個禮堂？,"The hall (and the time slot) is limited while the wants to use it are many, so not all wants can be satisfied.",禮堂（同時段）有限，但想用嘅 wants 好多，所以唔可以滿足晒所有 wants。
scarcroaker-01,scarcroaker,tf,,,Scarcity means that the quantity of a resource is very small.,Scarcity 即係資源數量好少。,,,,,F,Can a large amount of resources still be insufficient for unlimited wants?,資源好多，會唔會都唔夠滿足無限 wants？,Scarcity is relative: resources are insufficient to satisfy unlimited wants. Plentiful resources can still be scarce.,Scarcity 係相對嘅：資源唔夠滿足無限 wants。資源多都可以 scarce。
scarcroaker-02,scarcroaker,tf,,,Rich societies also face scarcity.,富裕社會都有 scarcity。,,,,,T,Do the wants of a rich society ever end?,富裕社會嘅 wants 會唔會有盡頭？,Every society has unlimited wants.,任何社會嘅 wants 都無限。
scarcroaker-03,scarcroaker,mc,,,"Tai O's yellow croaker catch was 10,920 piculs in 1954 and fell to 402 piculs in 1958. Which statement is most accurate?","大澳黃花魚漁獲 1954 年係 10,920 擔，1958 年跌到 402 擔。邊句最準確？","Scarcity only appeared in 1958|There were many fish in 1954, so there was no scarcity|Both years had scarcity; in 1958 resources were even less able to satisfy wants|Scarcity has nothing to do with the catch",scarcity 只係 1958 年先出現|1954 年魚多，所以冇 scarcity|兩年都有 scarcity，1958 年資源更加唔夠滿足 wants|scarcity 同漁獲無關,,,C,"In 1954, were there enough fish to satisfy everyone's unlimited wants?",1954 年魚多，夠唔夠滿足所有人無限嘅 wants？,"Even with many fish, wants are unlimited, so both years had scarcity. Figures: Tai O Heritage Hotel, 'History of Tai O'.",就算魚多，wants 都無限，所以兩年都有 scarcity。數字來源：大澳文物酒店「大澳往昔」。
scarcroaker-04,scarcroaker,mc,,,Scarcity directly leads to:,Scarcity 會直接導致：,choice|free goods|unlimited resources|no opportunity cost,選擇|免費物品|無限資源|冇機會成本,,,A,"If resources are not enough, what must you do?",資源唔夠用，你要做啲咩？,With insufficient resources we must choose. Scarcity also leads to competition (Ch.2).,資源唔夠，就要揀。Scarcity 亦導致 competition（Ch.2）。
scarcroaker-05,scarcroaker,fill,,,Scarcity arises when ____ resources are ____ to satisfy unlimited human wants.,當 ① 嘅資源 ② 滿足無限嘅人類 wants，就出現 scarcity。,limited|insufficient|sufficient|unlimited,有限|不足以|足以|無限,,,limited|insufficient,Resources are limited – are they enough or not?,資源有限，夠定唔夠？,This is the textbook glossary definition.,課本 glossary 定義。
scarcroaker-06,scarcroaker,fill,,,"Because of scarcity, people must make a ____; after that there is always an ____.",因為 scarcity，人要做 ①；做咗之後就一定有 ②。,choice|opportunity cost|interest|discrimination,選擇|機會成本|利息|歧視,,,choice|opportunity cost,Not enough → must choose → choosing means giving something up.,資源唔夠 → 要揀 → 揀咗就要放棄。,Scarcity → choice → opportunity cost.,Scarcity → choice → opportunity cost。
scarcroaker-07,scarcroaker,order,,,Put in order:,排次序：,,,unlimited wants + limited resources|scarcity|choice|opportunity cost,無限 wants 加有限資源|稀少性|選擇|機會成本,,Go from cause to result.,由原因排到結果。,Each step is the result of the one before.,每一步都係上一步嘅結果。
scarcroaker-08,scarcroaker,mc,,,Which situation does NOT involve scarcity?,邊個情況唔涉及 scarcity？,A fisherman choosing between fishing and mending nets|Allocating supply hours during water rationing|The air you breathe freely by the sea|Using a plot of land for salt or for vegetables,漁民揀出海定補網|制水時分配供水時間|海邊隨便呼吸嘅空氣|一塊地用嚟曬鹽定種菜,,,C,Which one is available in large enough quantity for everyone?,邊一樣嘅數量夠晒所有人用？,Air is sufficient to satisfy everyone – it is a free good.,空氣數量夠滿足所有人，係 free good。
scarcroaker-09,scarcroaker,tf,,,"If something costs no money, it cannot be scarce.",如果一樣嘢唔使錢，佢就一定唔 scarce。,,,,,F,Were free masks enough for everyone who wanted them?,免費派嘅口罩，夠唔夠所有人想要嘅數量？,"Scarcity depends on whether the quantity satisfies wants, not on the price.",Scarce 與否睇數量夠唔夠滿足 wants，唔係睇收唔收錢。
scarcroaker-10,scarcroaker,mc,,,"When the yellow croaker catch collapsed in 1958, the most direct effect on Tai O fishermen was:",1958 年黃花魚漁獲大跌，對大澳漁民最直接嘅影響係：,"they had to make more trade-offs, e.g. catch other fish or change jobs|scarcity disappeared|yellow croaker became a free good|they no longer needed to choose",要作出更多取捨，例如轉捕其他魚或者轉行|scarcity 消失|黃花魚變成 free good|唔再需要做選擇,,,A,"With fewer resources, are there more or fewer hard choices?",資源更少，選擇會多咗定少咗？,"With even fewer resources, fishermen must make new choices.",資源更加唔夠，漁民要重新作出 choice。
scarcroaker-11,scarcroaker,tf,,,Scarcity is the reason economics exists.,Scarcity 係經濟學存在嘅原因。,,,,,T,"If resources were unlimited, would we need to study allocation?",如果資源無限，仲需唔需要研究點分配？,Without scarcity there would be no need to study how to allocate resources.,冇 scarcity，就唔需要研究點樣分配資源。
scarcroaker-12,scarcroaker,sort,,,Scarce or not scarce?,「scarce」定「not scarce」？,scarce|not scarce,稀少|唔稀少,yellow croaker|seawater in the ocean|salt pans|fishermen's time|air,黃花魚|大海嘅海水|鹽田|漁民嘅時間|空氣,1|2|1|1|2,Is the quantity enough to satisfy everyone's wants?,數量夠唔夠滿足所有人嘅 wants？,Seawater and air are sufficient; the rest cannot satisfy all wants.,海水同空氣數量夠晒，其餘都唔夠滿足所有 wants。
scarcroaker-S1,scarcroaker,mc,scen,,"In 1963, Hong Kong households had water supplied for only 4 hours every 4 days. This best shows that water was:",1963 年，香港家庭每 4 日先有 4 個鐘供水。呢件事最能說明當時嘅水係：,"a free good|scarce, because the quantity available could not satisfy all wants|not wanted by households|unlimited",free good|scarce，因為可用嘅數量唔夠滿足所有 wants|家庭唔想要嘅嘢|無限嘅,,,B,Was there enough water for everyone to use as much as they wanted?,當時啲水夠唔夠畀每個人想用幾多就用幾多？,A good is scarce when the quantity available is insufficient to satisfy all wants; rationing shows water was scarce.,當可用數量唔夠滿足所有 wants，嗰樣嘢就係 scarce；制水正正反映水係 scarce。
scarcroaker-S2,scarcroaker,tf,scen,,"(Fictional) The Tung Chung public library lends books free of charge, so the books are not scarce.",（虛構）東涌公共圖書館免費借書，所以啲書唔係 scarce。,,,,,F,Were resources used to produce the books? Can everyone borrow any book at any time?,啲書係咪用咗 resources 生產？係咪人人隨時都借到想借嘅書？,"Zero price does not mean not scarce: the books use resources and are not enough to satisfy all wants, so they are scarce.",免費唔等於唔 scarce：書要用 resources 生產，數量亦唔夠滿足所有 wants，所以係 scarce。
scarcroaker-S3,scarcroaker,sort,scen,,Scarce good or free good?,Scarce good 定 free good？,scarce good|free good,scarce good|free good,seats on an MTR Tung Chung line train in rush hour|fresh air on a Lantau hilltop|a Ngong Ping 360 cable car ride|a stilt house in Tai O|seawater in the open sea off Tai O,繁忙時間 MTR 東涌綫嘅座位|大嶼山山頂嘅新鮮空氣|坐 Ngong Ping 360 纜車|大澳嘅棚屋|大澳對開大海嘅海水,1|2|1|1|2,Is the quantity enough for everyone's wants without any production cost?,數量係咪夠晒滿足所有人嘅 wants，而且唔使生產成本？,A free good is sufficient to satisfy all wants with no production cost; anything else is scarce.,Free good 嘅數量足夠滿足所有 wants，亦冇生產成本；其餘都係 scarce。
scarcroaker-S4,scarcroaker,fill,scen,,"(Fictional) A Tai O dolphin-watching boat has 20 seats, but 35 tourists want to board. ____ tourists cannot get a seat, which shows ____.",（虛構）大澳一隻睇 Chinese white dolphin 嘅船有 20 個位，但有 35 個遊客想上船。有 ① 個遊客冇位，呢個反映 ②。,15|55|scarcity|a free good,15|55|scarcity|free good,,,15|scarcity,Compare the number of seats with the number of people who want them.,比較吓座位數目同想坐嘅人數？,"35 - 20 = 15. The seats are insufficient to satisfy all wants, so they are scarce.",35 - 20 = 15。座位唔夠滿足所有 wants，所以係 scarcity。
scarcroaker-S5,scarcroaker,mc,scen,,"After Typhoon Hato (2017) flooded Tai O, many shops needed repair workers at the same time. Why could not all shops be repaired at once?",Typhoon Hato（2017）令大澳水浸之後，好多舖頭同一時間要搵維修師傅。點解唔可以一次過維修晒所有舖頭？,repair workers were scarce relative to the wants for repairs|shop owners had no wants|repair work is a free good|floods make resources unlimited,相對維修嘅 wants，維修師傅係 scarce|舖頭老闆冇 wants|維修係 free good|水浸會令 resources 變成無限,,,A,Was the number of workers enough for every shop's wants?,師傅嘅數目夠唔夠滿足每間舖嘅 wants？,"Labour is a limited resource; when wants for it exceed what is available, it is scarce.",勞動力係 limited resource；當 wants 多過可用數量，就係 scarce。
choicefin-01,choicefin,tf,,,Choice is the process of deciding which wants to satisfy and which to give up.,Choice 係決定滿足邊啲 wants、放棄邊啲 wants 嘅過程。,,,,,T,"If you pick one, what happens to the other?",揀咗一樣，另一樣會點？,Glossary: ... given limited resources.,Glossary：given limited resources。
choicefin-02,choicefin,tf,,,"If resources were unlimited, people would not need to make choices.",如果資源無限，人就唔使做 choice。,,,,,T,"Without scarcity, is there any trade-off?",冇 scarcity 仲使唔使取捨？,No scarcity means no need for trade-offs.,冇 scarcity 就冇需要取捨。
choicefin-03,choicefin,mc,,,Which of these is a choice?,邊個係 choice？,A salt worker deciding to dry salt or mend nets today|Rain falling|The tide rising and falling|Yellow croaker swimming away,鹽工決定今日曬鹽定去補網|落雨|潮水漲退|黃花魚游走,,,A,Which one is a human decision?,邊一樣係人嘅決定？,Only human decisions are choices.,只有人嘅決定先係 choice。
choicefin-04,choicefin,mc,,,Why must a salt worker make choices?,點解鹽工要做 choice？,because of scarcity|because the government says so|because salt is a free good|because they like to,因為有 scarcity|因為政府規定|因為鹽係 free good|因為佢哋鍾意,,,A,Are his time and salt pans enough to do everything?,佢嘅時間同鹽田夠唔夠做晒所有嘢？,His time and salt pans are limited.,時間同鹽田有限。
choicefin-05,choicefin,fill,,,"Choice is the process of deciding which wants to ____ and which to ____ up, given limited resources.",Choice 係喺有限資源下，決定 ① 邊啲 wants、② 邊啲 wants 嘅過程。,satisfy|give|create|save,滿足|放棄|創造|儲起,,,satisfy|give,Satisfying some means giving up others.,有滿足，就有放棄。,Every choice satisfies some wants and gives up others.,有滿足就有放棄。
choicefin-06,choicefin,fill,,,"After choosing, the highest-valued option given up is called the ____.",揀咗之後，放棄咗嘅最高價值選項叫 ①。,opportunity cost|money cost|interest|scarcity,機會成本|金錢成本|利息|稀少性,,,opportunity cost,This is the next EconMon's concept.,呢個概念係下一隻 EconMon。,This leads to Oppcostra.,為 Oppcostra 鋪路。
choicefin-07,choicefin,sort,,,Choice or not a choice?,「係 choice」定「唔係 choice」？,a choice|not a choice,係 choice|唔係 choice,a fisherman picking when to go out|a typhoon hitting|parents choosing school or helping at sea for their child|the tide|a tourist choosing salted fish or shrimp paste|the sun shining,漁民揀出海時間|颱風吹襲|家長揀送仔女讀書定出海幫手|潮汐|遊客揀買鹹魚定蝦醬|太陽曬,1|2|1|2|1|2,Which are human decisions and which are nature?,邊啲係人決定，邊啲係大自然？,Natural events are not human decisions.,自然現象唔係人嘅決定。
choicefin-08,choicefin,tf,,,"After choosing something, the options given up have zero value.",揀咗一樣嘢之後，放棄咗嘅選擇價值係零。,,,,,F,"If the other options had no value, would choosing be hard?",如果放棄咗嘅選擇冇價值，仲會唔會難揀？,The options given up have value – that is why opportunity cost exists.,放棄咗嘅選擇有價值，所以先有 opportunity cost。
choicefin-09,choicefin,mc,,,"As Tai O's salt industry declined in the 1950s–60s, salt workers considered changing jobs. This decision best shows:",1950–1960 年代大澳鹽業式微，鹽工考慮轉行。呢個決定最能說明：,choice|free good|interest|barter,選擇|免費物品|利息|以物易物,,,A,What must workers do among several possible paths?,鹽工要喺幾個出路之間做咩？,Deciding which job to do with limited resources is a choice.,喺有限資源下決定做邊行，就係 choice。
choicefin-10,choicefin,tf,,,Every choice involves an opportunity cost.,每一個 choice 背後都有 opportunity cost。,,,,,T,"When you choose one thing, do you give up something else?",揀咗一樣，有冇放棄其他？,"Having a choice means giving something up, so there is always an opportunity cost.",有得揀就一定有放棄，所以一定有 opportunity cost。
choicefin-11,choicefin,fill,,,Choice arises because of ____.,Choice 嘅出現係因為 ①。,scarcity|interest|money|tradition,稀少性|利息|金錢|傳統,,,scarcity,Why can't we have everything?,點解唔可以樣樣都要？,"Resources are insufficient, so we must choose.",資源唔夠，先要揀。
choicefin-12,choicefin,order,,,Put the steps of making a decision in order:,排出做決定嘅次序：,,,realise resources are not enough|list possible options|compare the value of each option|make the choice,發現資源唔夠|列出可行選項|比較每個選項嘅價值|作出選擇,,"First the problem, then the options, then the choice.",先有問題，再有選項，最後先揀。,Choice starts from scarcity and ends with choosing one and giving up the rest.,Choice 由 scarcity 開始，最後揀一個、放棄其他。
choicefin-S1,choicefin,mc,scen,,"(Fictional) After the MTR Tung Chung line opened in 1998, Ah Keung, a young Tai O fisherman, had to decide whether to work in Tung Chung or keep fishing. Why must he choose?",（虛構）1998 年 MTR 東涌綫開通之後，大澳年輕漁民阿強要決定去東涌返工定繼續打魚。點解佢一定要揀？,because his time is limited and he cannot do both full-time|because the MTR forced him to|because fishing is a free good|because his wants are limited,因為佢時間有限，唔可以兩份都做全職|因為 MTR 逼佢|因為打魚係 free good|因為佢嘅 wants 有限,,,A,Can one person work two full-time jobs at once?,一個人可唔可以同時做兩份全職？,"Choice arises from scarcity: his limited time must be allocated to one use, giving up the other.",Choice 源於 scarcity：佢有限嘅時間只可以用喺一個用途，要放棄另一個。
choicefin-S2,choicefin,mc,scen,,(Fictional) The Hong Kong government has one site in Tung Chung and must decide whether to build public housing or a sports centre on it. This shows that:,（虛構）香港政府喺東涌有一幅地，要決定起公屋定體育館。呢件事說明：,only poor people need to make choices|governments also face scarcity and must make choices|land is a free good|governments have unlimited resources,只有窮人先要做選擇|政府都面對 scarcity，要做選擇|土地係 free good|政府有無限 resources,,,B,Can the same piece of land be used for both at once?,同一幅地可唔可以同時用嚟起兩樣嘢？,"All economic units, including governments, have limited resources, so they must choose.",所有經濟單位，包括政府，都有 limited resources，所以要做選擇。
choicefin-S3,choicefin,sort,scen,,Who is making the choice?,邊個喺度做選擇？,individual or household|firm|government,個人或家庭|firm|政府,(Fictional) a Tai O student chooses between tutoring and a part-time job|(Fictional) a Tai O shrimp paste factory chooses between hiring a worker or buying a machine|(Fictional) the government chooses to spend money on a hospital or a new road|(Fictional) a family chooses to rent a flat in Tung Chung or in Sha Tin|(Fictional) a ferry company chooses which route to run,（虛構）大澳學生揀補習定做兼職|（虛構）大澳蝦醬廠揀請人定買機器|（虛構）政府揀用錢起醫院定起新路|（虛構）一家人揀租東涌定沙田嘅單位|（虛構）渡輪公司揀行邊條航線,1|2|3|1|2,"Is the decision-maker a person, a business or the government?",做決定嘅係一個人、一間公司，定係政府？,"Every economic unit faces scarcity, so individuals, firms and governments all make choices.",每個經濟單位都面對 scarcity，所以個人、firm 同政府都要做選擇。
choicefin-S4,choicefin,fill,scen,,"(Fictional) Mei has $200. A ferry trip costs $50 and a concert ticket costs $180. Together they cost $____, more than she has, so she must make a ____.",（虛構）阿美有 $200。坐一程船要 $50，一張演唱會飛要 $180。兩樣加埋要 $①，多過佢有嘅錢，所以佢要做一個 ②。,230|130|choice|profit,230|130|choice|profit,,,230|choice,Add the two prices and compare with $200.,將兩個價錢加埋，再同 $200 比較吓？,"50 + 180 = 230 > 200. With limited money she cannot have both, so she must choose.",50 + 180 = 230 > 200。錢有限，唔可以兩樣都要，所以要做 choice。
choicefin-S5,choicefin,tf,scen,,"(Fictional) Ah Kit's parents chose his secondary school for him. Since Ah Kit did not decide himself, no choice was made.",（虛構）阿傑嘅父母幫佢揀咗中學。因為唔係阿傑自己決定，所以冇做過任何 choice。,,,,,F,Was one school picked and the others given up? Who decided?,係咪揀咗一間、放棄咗其他？邊個做決定？,"A choice was still made, by the household: one option was selected and the others were given up.",仍然有做 choice，只係由家庭做：揀咗一個選項，放棄咗其他。
oppcostra-01,oppcostra,tf,,,Opportunity cost is the total value of all the options given up.,Opportunity cost 係所有被放棄選擇嘅價值總和。,,,,,F,Could you do all the options you gave up at the same time?,你可唔可以同時做晒所有放棄咗嘅嘢？,Only the highest-valued option forgone counts – you could never do all of them at once.,只計 highest-valued option forgone。你唔可能同時做晒所有放棄咗嘅嘢。
oppcostra-02,oppcostra,tf,,,Opportunity cost does not have to be money.,Opportunity cost 可以唔係金錢。,,,,,T,Do time and enjoyment have value?,時間、享受有冇價值？,"Time, enjoyment and opportunities all have value.",時間、享受、機會都有價值。
oppcostra-03,oppcostra,mc,,,"(Fictional) After school Ming can: help dry salt (worth $30), carry cargo at the pier ($50), or study (he values it at $40). He chooses to study. His opportunity cost is:",（虛構）阿明放學可以：幫屋企曬鹽（值 $30）、去碼頭搬貨（$50）、溫書（佢覺得值 $40）。佢揀咗溫書，opportunity cost 係：,$30|$50|$80|$120,$30|$50|$80|$120,,,B,Which two did he give up? Which is higher?,佢放棄咗邊兩樣？邊樣最高？,"Of the two options given up, carrying cargo ($50) is the highest.",被放棄嘅兩個選項入面，搬貨 $50 最高。
oppcostra-04,oppcostra,mc,,,"Same situation: if Ming chooses to carry cargo, his opportunity cost is:",同一情境，如果阿明揀咗搬貨，opportunity cost 係：,$30|$40|$70|$50,$30|$40|$70|$50,,,B,Which two does he give up this time?,今次放棄咗邊兩樣？,He gives up drying salt ($30) and studying ($40); studying is higher.,放棄嘅係曬鹽 $30 同溫書 $40，最高係溫書。
oppcostra-05,oppcostra,fill,,,Opportunity cost refers to the value of the ____-valued option ____.,Opportunity cost 係指 ① 價值嘅 ② 選項嘅價值。,highest|forgone|lowest|chosen,最高|被放棄|最低|被選擇,,,highest|forgone,"Two keys: highest, and given up.",兩個關鍵：最高、放棄。,Key words: highest and forgone.,兩個關鍵詞：最高、放棄。
oppcostra-06,oppcostra,fill,,,"You chose Oppcostra and gave up Saltling and Tradiphin. If your second favourite is Tradiphin, your opportunity cost is ____.",開場揀咗 Oppcostra，放棄咗 Saltling 同 Tradiphin。如果你第二最想要 Tradiphin，你嘅 opportunity cost 係 ①。,Tradiphin|Saltling|both added together|nothing,Tradiphin|Saltling|兩隻加埋|冇,,,Tradiphin,"Among those given up, which did you want most?",放棄咗嘅入面，你最想要邊隻？,It is the highest-valued option among those given up.,放棄咗嘅選項入面價值最高嗰個。
oppcostra-07,oppcostra,mc,,,In the 1950s a Tai O salt worker decided to keep drying salt instead of working in the city. His opportunity cost is most likely:,1950 年代一個大澳鹽工決定繼續曬鹽，唔出市區打工。佢嘅 opportunity cost 最可能係：,"the money earned from drying salt|the highest-valued option he gave up, e.g. city income and other benefits|the cost of building the salt pans years ago|zero",曬鹽賺嘅錢|佢放棄嘅最高價值選擇，例如市區打工嘅收入同其他得益|當年起鹽田嘅費用|零,,,B,"Is opportunity cost what you chose, or what you gave up?",Opportunity cost 係揀咗嗰樣，定係放棄咗嗰樣？,A is the value of the chosen option; C is a historical cost.,A 係被揀選項嘅價值，C 係 historical cost。
oppcostra-08,oppcostra,sort,,,Counted in opportunity cost or not?,「計入 opportunity cost」定「唔計」？,counted|not counted,計入|唔計,"the highest-valued option forgone|the value of the chosen option|a third, lower-valued option|the salt pan building cost already paid",被放棄嘅最高價值選項|被揀選項本身嘅價值|第三個較低價值選項|已經付咗嘅鹽田建造費,1|2|2|2,Only one fits the definition.,只有一樣符合定義。,None of the other three is the highest-valued option forgone.,其餘三項都唔係「最高價值嘅放棄選項」。
oppcostra-09,oppcostra,tf,,,"If something costs no money, there is no opportunity cost.",如果唔使俾錢，就冇 opportunity cost。,,,,,F,Going to the beach is free – what do you give up?,免費去沙灘玩，你放棄咗啲咩？,"Even without paying money you give up other uses, e.g. your time.",唔使俾錢都要放棄其他用途，例如時間。
oppcostra-10,oppcostra,mc,,,"(Fictional) At the weekend Ting can: help at the shrimp paste factory ($200), give tutoring ($150), or go to the beach with friends (she values it at $100). She goes to the beach. Her opportunity cost is:",（虛構）阿婷週末可以：去蝦醬工場幫手（$200）、補習（$150）、同朋友去沙灘（佢覺得值 $100）。佢揀咗去沙灘，opportunity cost 係：,$100|$150|$200|$450,$100|$150|$200|$450,,,C,Which two did she give up?,佢放棄咗邊兩樣？,She gave up the factory ($200) and tutoring ($150); the highest is $200.,放棄咗工場 $200 同補習 $150，最高係 $200。
oppcostra-11,oppcostra,mc,,,"Same situation: if Ting chooses the shrimp paste factory, her opportunity cost is:",同一情境，如果阿婷揀咗去蝦醬工場，opportunity cost 係：,$100|$150|$250|$200,$100|$150|$250|$200,,,B,She gives up tutoring and the beach – which is higher?,今次放棄咗補習同沙灘，邊樣最高？,She gives up tutoring ($150) and the beach ($100); the highest is $150.,放棄咗補習 $150 同沙灘 $100，最高係 $150。
oppcostra-12,oppcostra,fill,,,Choosing to dry salt means giving up fishing ($150) and factory work ($180). The opportunity cost is ____.,揀咗曬鹽，放棄咗打魚（$150）同工廠打工（$180），opportunity cost 係 ①。,$180|$150|$330|$0,$180|$150|$330|$0,,,$180,Count only one: the highest.,只計一個：最高嗰個。,Only the highest-valued option forgone: $180.,只計最高價值嘅放棄選項：$180。
oppcostra-S1,oppcostra,mc,scen,,"(Fictional) On Sunday, Siu Man, a Tai O boat owner, can run a dolphin-watching tour ($800), go fishing ($600) or repair his stilt house (he values it at $500). He runs the tour. His opportunity cost is:",（虛構）大澳船主小文禮拜日可以做睇 dolphin 團（$800）、出海打魚（$600）或者維修棚屋（佢認為值 $500）。佢揀做睇 dolphin 團。佢嘅 opportunity cost 係：,"$800|$1,100 (fishing + repair)|$600 (fishing)|$500 (repair)","$800|$1,100（打魚 + 維修）|$600（打魚）|$500（維修）",,,C,"Among the options he gave up, which has the highest value?",喺佢放棄咗嘅選項入面，邊個價值最高？,"Opportunity cost is the value of the highest-valued option forgone only: fishing, $600.",Opportunity cost 只係放棄咗嘅選項之中價值最高嗰個：打魚，$600。
oppcostra-S2,oppcostra,mc,scen,,"(Fictional) Lok paid $200 last month for a non-refundable Ngong Ping 360 ticket for Saturday. On Saturday a friend offers him a one-day job paying $300. If he rides the cable car, his opportunity cost is:",（虛構）阿樂上個月用 $200 買咗張唔可以退嘅禮拜六 Ngong Ping 360 飛。禮拜六有朋友搵佢做一日工，人工 $300。如果佢去坐纜車，佢嘅 opportunity cost 係：,$200|$300|$500|$0,$200|$300|$500|$0,,,B,Can the $200 be recovered whatever he does on Saturday?,無論禮拜六做咩，嗰 $200 攞唔攞得返？,The $200 is a historical cost and is not a cost of the decision. The highest-valued option forgone is the $300 job.,$200 係 historical cost，唔係今次決定嘅 cost。放棄咗價值最高嘅選項係 $300 份工。
oppcostra-S3,oppcostra,order,scen,,"(Fictional) Kwan, a Tai O snack stall owner, can spend an afternoon: selling fish balls ($400), making shrimp paste ($550), resting (values at $300), tutoring ($450). Rank from highest to lowest value.",（虛構）大澳小食檔主阿群一個下晝可以：賣魚蛋（$400）、整蝦醬（$550）、休息（佢認為值 $300）、補習（$450）。由價值最高排到最低。,,,making shrimp paste ($550)|tutoring ($450)|selling fish balls ($400)|resting ($300),整蝦醬（$550）|補習（$450）|賣魚蛋（$400）|休息（$300）,,"If she chooses the top option, which one becomes her opportunity cost?",如果佢揀最高價值嗰個，邊個會成為佢嘅 opportunity cost？,"Ranking shows the choice and its opportunity cost: choosing shrimp paste gives up tutoring ($450), the highest-valued option forgone.",排好次序就睇到：揀整蝦醬，opportunity cost 係補習（$450），即放棄咗價值最高嘅選項。
oppcostra-S4,oppcostra,fill,scen,,"(Fictional) A site in Tung Chung could be a car park (worth $5 million a year), a sports ground ($8 million) or a market ($6 million). The government builds the sports ground. Its opportunity cost is the ____, worth $____ million a year.",（虛構）東涌一幅地可以做停車場（每年值 $500 萬）、運動場（$800 萬）或者街市（$600 萬）。政府起咗運動場。佢嘅 opportunity cost 係 ①，每年值 $② 百萬。,market|car park|6|11,街市|停車場|6|11,,,market|6,"Only the best option given up counts, not the sum.",只計放棄咗最好嗰個，唔係加埋所有。,"The options forgone are the car park ($5M) and market ($6M); the highest-valued is the market, $6 million.",放棄咗停車場（$500 萬）同街市（$600 萬）；價值最高係街市，$600 萬。
oppcostra-S5,oppcostra,tf,scen,,(Fictional) Ah Hung gets a free ticket to a concert at the Hong Kong Coliseum. Going to the concert has no opportunity cost.,（虛構）阿雄攞到一張香港體育館演唱會嘅免費飛。去睇演唱會冇 opportunity cost。,,,,,F,Could he use those hours for something else?,嗰幾個鐘佢可唔可以用嚟做其他嘢？,"Even if the ticket is free, his time could be used elsewhere, so the best alternative use of that time is his opportunity cost.",就算飛係免費，佢嘅時間可以用喺其他地方，嗰段時間最好嘅另一個用途就係佢嘅 opportunity cost。
fullcrab-01,fullcrab,tf,,,Full cost = money cost + non-money cost.,Full cost = money cost + non-money cost。,,,,,T,The fiddler crab has two claws.,隻招潮蟹有兩隻鉗。,This is the textbook formula.,課本公式。
fullcrab-02,fullcrab,tf,,,The full cost of taking a bus from Tai O to Tung Chung is just the bus fare.,搭巴士由大澳出東涌嘅 full cost 只係車費。,,,,,F,What else could you have done during the ride?,搭車嗰段時間本來可以做乜？,You must also count the time cost of the journey.,仲要計車程時間嘅 time cost。
fullcrab-03,fullcrab,mc,,,(Fictional) Fen spends $20 on fares and 1 hour going to Tung Chung. In that hour she could have earned $50 selling shrimp paste (best alternative). Full cost =,（虛構）小芬用 $20 車費同 1 個鐘出東涌。嗰 1 個鐘佢本來可以幫手賣蝦醬賺 $50（最好用途）。Full cost =,$20|$50|$70|$30,$20|$50|$70|$30,,,C,Money cost plus non-money cost.,Money cost 加 non-money cost。,$20 money cost + $50 non-money cost.,$20 money cost + $50 non-money cost。
fullcrab-04,fullcrab,mc,,,Money cost refers to:,Money cost 係：,the money expenses of the chosen option|the highest-valued option forgone|the value of time|interest,所揀選項嘅金錢開支|放棄嘅最高價值選擇|時間嘅價值|利息,,,A,How do money cost and non-money cost differ?,Money cost 同 non-money cost 點分？,Money cost refers to the money expenses of the chosen option.,Money cost 係所揀選項嘅金錢開支。
fullcrab-05,fullcrab,fill,,,Full cost = ____ cost + ____ cost.,Full cost = ① cost + ② cost。,money|non-money|historical|fixed,金錢|非金錢|歷史|固定,,,money|non-money,"One claw is money, the other is not.",一隻鉗係錢，一隻鉗唔係錢。,Historical cost is not a cost.,Historical cost 唔係 cost。
fullcrab-06,fullcrab,fill,,,Non-money cost refers to the value of the best alternative use of the ____ resources spent.,Non-money cost 係所用 ① 資源嘅最佳其他用途嘅價值。,non-money|money|public|free,非金錢|金錢|公共|免費,,,non-money,What kind of resource is time?,例如時間係邊一類資源？,"For example, time.",例如時間。
fullcrab-07,fullcrab,mc,,,Which is a non-money cost?,邊個係 non-money cost？,a $10 ferry ticket|2 hours queuing that could have been spent mending nets|money spent buying salt|interest income,船票 $10|花咗 2 個鐘排隊，本來可以補網|買鹽嘅錢|利息收入,,,B,Which one involves no payment?,邊一樣冇涉及付錢？,It is the value of the best alternative use of time.,時間嘅最佳其他用途嘅價值。
fullcrab-08,fullcrab,sort,,,Money cost or non-money cost?,「money cost」定「non-money cost」？,money cost|non-money cost,金錢成本|非金錢成本,$20 bus fare|time spent queuing|school fees|time taken from mending nets|$300 for a fishing net|using your own house as a shop (could be rented out),車費 $20|排隊時間|學費|放棄補網嘅時間|買漁網 $300|用自己間屋開檔（本來可以租出）,1|2|1|2|1|2,Was money actually paid out?,有冇真係俾錢出去？,"Using your own house costs no payment but gives up rent, so it is a non-money cost.",用自己間屋冇付錢，但放棄咗租金，所以係 non-money cost。

fullcrab-12,fullcrab,sort,,,Counted in the full cost of taking a boat to the city?,計唔計入搭船出市區嘅 full cost？,counted|not counted,計|唔計,the ferry fare|time on the boat|the boat bought last month|net-mending income given up,船票錢|坐船嘅時間|上個月買嘅船|放棄嘅補網收入,1|1|2|1,Which was already paid and cannot be recovered?,邊樣係已經付咗、拎唔返嘅？,Money spent on a boat last month is a historical cost – not counted.,上個月買船嘅錢係 historical cost，唔計。
fullcrab-S1,fullcrab,mc,scen,,(Fictional) Chloe travels from Tai O to Central by bus and MTR. Fares total $40 and the trip takes 2 hours. Her best alternative use of that time is tutoring at $150 an hour. Full cost =,（虛構）Chloe 由大澳坐巴士同 MTR 去中環，車費共 $40，要 2 個鐘。嗰段時間最好嘅另一個用途係補習，每個鐘 $150。Full cost =,$40|$300|$340|$190,$40|$300|$340|$190,,,C,Money cost plus the value of the time spent: how much is 2 hours worth to her?,Money cost 加埋時間嘅價值：2 個鐘對佢值幾多？,Full cost = money cost $40 + non-money cost (2 x $150 = $300) = $340.,Full cost = money cost $40 + non-money cost（2 x $150 = $300）= $340。
fullcrab-S2,fullcrab,mc,scen,,"(Fictional) Mr Ho can go to Zhuhai by Route A (fare $70, 2 hours) or Route B (fare $160, 1 hour). His time is worth $100 an hour. Which route has the lower full cost?",（虛構）何生去珠海可以揀路線 A（車費 $70，2 個鐘）或者路線 B（車費 $160，1 個鐘）。佢嘅時間每個鐘值 $100。邊條路線嘅 full cost 較低？,"Route A, by $90|Route A, by $10|Route B, by $10|Both are the same",路線 A，平 $90|路線 A，平 $10|路線 B，平 $10|兩條一樣,,,C,Work out money cost + time cost for each route.,逐條路線計 money cost + 時間成本。,Route A: 70 + 200 = $270. Route B: 160 + 100 = $260. Route B is $10 lower in full cost despite the higher fare.,路線 A：70 + 200 = $270。路線 B：160 + 100 = $260。雖然車費貴啲，路線 B 嘅 full cost 平 $10。
fullcrab-S3,fullcrab,sort,scen,,"(Fictional) Sam quits a Tung Chung job ($12,000 a month) to open a snack stall in his own Tai O stilt house, which he could rent out for $3,000 a month. Sort his monthly items:","（虛構）阿 Sam 辭咗東涌份工（月薪 $12,000），喺自己大澳嘅棚屋開小食檔；間屋本來可以每月租 $3,000。將佢每月嘅項目分類：",money cost|non-money cost|not a cost,money cost|non-money cost|唔係 cost,"ingredients bought|electricity bill|the $3,000 rent he gives up|the $12,000 salary he gives up|the price of a fridge he bought five years ago","買食材嘅錢|電費|放棄咗嘅 $3,000 租金|放棄咗嘅 $12,000 人工|五年前買雪櫃嘅錢",1|1|2|2|3,"Is money actually paid out now, is a benefit given up, or is it already spent and unrecoverable?",係而家真係要俾錢、係放棄咗嘅得益，定係早已使咗、攞唔返嘅錢？,Money cost is actual payment; non-money cost is the best alternative use of non-money resources; historical cost is not a cost.,Money cost 係實際支付；non-money cost 係非金錢資源最好嘅另一用途；historical cost 唔係 cost。
fullcrab-S4,fullcrab,fill,scen,,"(Fictional) Wing queues 2 hours for a free food coupon. He could have earned $60 an hour. The full cost of the coupon is $____, all of which is ____ cost.",（虛構）阿榮排咗 2 個鐘隊攞免費食物券。佢本來每個鐘可以賺 $60。張券嘅 full cost 係 $①，全部都係 ② cost。,120|0|non-money|money,120|0|non-money|money,,,120|non-money,"The coupon costs no money, but what did he give up while queuing?",張券唔使錢，但排隊嗰陣佢放棄咗咩？,"Money cost = $0; non-money cost = 2 x $60 = $120, so full cost = $120.",Money cost = $0；non-money cost = 2 x $60 = $120，所以 full cost = $120。

tickmud-04,tickmud,mc,,,"Before the bridge opened in 1996, Tai O residents crossed the creek by rope ferry. If walking over the bridge takes less time, the full cost of crossing will:",1996 年大橋落成前，大澳居民要坐橫水渡過河。如果行橋過河用少咗時間，過河嘅 full cost 會：,fall|rise|stay the same|become zero,下降|上升|不變|變成零,,,A,"With less time used, what happens to the non-money cost?",用少咗時間，non-money cost 點變？,Less time means a lower non-money cost. The value of each hour is unchanged; the number of hours falls.,用少咗時間，non-money cost 下降。留意：每個鐘嘅 time cost 冇變，變嘅係用咗幾多個鐘。

tickmud-11,tickmud,mc,,,Why do some people pay more for a fast boat rather than take a slow one?,點解有啲人寧願俾多啲錢坐快船，都唔坐慢船？,their time cost is higher|they ignore money cost|fast boats are free goods|they have no choice,佢哋嘅 time cost 較高|佢哋唔理 money cost|快船係 free good|佢哋冇 choice,,,A,The slow boat saves money but wastes what?,慢船慳錢但嘥咩？,"For people with a high time cost, saving time is worth more than saving money.",Time cost 高嘅人，慳時間比慳錢更划算。

tickmud-S1,tickmud,mc,scen,,(Fictional) Siu Wai queues 2 hours in Tsim Sha Tsui for free concert tickets. Instead he could tutor at $200/hour or work in a café at $60/hour. His time cost of queuing is:,（虛構）小偉喺尖沙咀排咗 2 個鐘隊攞免費音樂會門票。佢本來可以補習，每個鐘 $200，或者喺 café 做嘢，每個鐘 $60。佢排隊嘅 time cost 係：,$120|$260|$400|$520,$120|$260|$400|$520,,,C,Which alternative use of those 2 hours is the best one? Do you add both alternatives?,嗰 2 個鐘最好嘅另一個用途係邊個？兩個選擇要唔要加埋？,Time cost = value of the best alternative use of time only: $200 x 2 = $400. The café job is not counted.,Time cost = 時間最好嘅另一個用途嘅價值：$200 x 2 = $400。Café 工作唔計。
tickmud-S2,tickmud,order,scen,,(Fictional) Three people each queue 1 hour in Mong Kok for a new phone. Assume working is each person's best alternative. Order their time cost from lowest to highest.,（虛構）三個人喺旺角各排 1 個鐘隊買新手機。假設返工係每人最好嘅另一個選擇。將佢哋嘅 time cost 由低至高排列。,,,"a student whose part-time job pays $60/hour|a delivery rider earning $120/hour|a lawyer earning $1,500/hour","兼職時薪 $60 嘅學生|時薪 $120 嘅外賣車手|時薪 $1,500 嘅律師",,Whose best alternative use of that hour is worth the most?,邊個嗰個鐘最好嘅另一個用途最值錢？,"Time cost depends on the value of each person's best alternative use of time, so it differs between people: $60 < $120 < $1,500.","Time cost 取決於每人時間最好嘅另一個用途嘅價值，所以因人而異：$60 < $120 < $1,500。"
tickmud-S3,tickmud,tf,scen,,"(Fictional) A surgeon earning $3,000/hour and a student earning $70/hour both queue 30 minutes for the Ngong Ping 360 cable car. They bear the same time cost.","（虛構）一個時薪 $3,000 嘅外科醫生同一個時薪 $70 嘅學生，一齊排咗 30 分鐘隊搭昂坪 360 纜車。佢哋承擔嘅 time cost 一樣。",,,,,F,"Same 30 minutes, but is the best alternative use of that time worth the same to both?",同樣係 30 分鐘，但嗰段時間最好嘅另一個用途對兩個人嚟講一樣值錢咩？,"Time cost is the value of the best alternative use of time, which differs between people. The surgeon's time cost ($1,500) is far higher than the student's ($35).","Time cost 係時間最好嘅另一個用途嘅價值，因人而異。醫生嘅 time cost（$1,500）遠高過學生（$35）。"
tickmud-S4,tickmud,mc,scen,,"(Fictional) Mr Chan, a busy consultant, pays more for a direct coach across the Hong Kong–Zhuhai–Macao Bridge instead of a cheaper but much slower route. The best explanation is:",（虛構）陳生係個好忙嘅顧問，佢寧願俾多啲錢搭經港珠澳大橋嘅直通巴士，都唔揀平啲但慢好多嘅路線。最好嘅解釋係：,"His time cost is high, so the faster option has a lower full cost for him|Money is not scarce for rich people|Only poor people bear time cost|The slower route has no time cost",佢嘅 time cost 高，所以對佢嚟講快啲嘅選擇 full cost 較低|有錢人嘅錢唔 scarce|只有窮人先有 time cost|慢啲嘅路線冇 time cost,,,A,Full cost = money cost + what else? Is Mr Chan's time valuable?,Full cost = money cost + 咩？陳生嘅時間值唔值錢？,"Full cost includes money cost and time cost. With a high value of time, the saving in time cost outweighs the extra fare.",Full cost 包括 money cost 同 time cost。佢時間價值高，慳返嘅 time cost 多過額外車費。
tickmud-S5,tickmud,fill,scen,,(Fictional) Kelly spends 3 hours queuing for a free museum exhibition. Her best alternative is tutoring at $150/hour; her second best is shop work at $80/hour. Her time cost is ____.,（虛構）Kelly 排咗 3 個鐘隊睇免費博物館展覽。佢最好嘅另一個選擇係補習，時薪 $150；第二好係喺舖頭做嘢，時薪 $80。佢嘅 time cost 係 ①。,$450|$240|$690|$0,$450|$240|$690|$0,,,$450,"The exhibition is free of charge, but is her time free?",展覽唔使錢，但佢嘅時間係咪免費？,Time cost = value of the best alternative use of time = $150 x 3 = $450. A zero money price does not mean zero time cost.,Time cost = 時間最好嘅另一個用途嘅價值 = $150 x 3 = $450。唔使錢唔等於冇 time cost。
shiftide-01,shiftide,tf,,,"(Fictional: Ming chose to study, giving up carrying cargo $50 (highest) and drying salt $30.) If cargo pay rises from $50 to $70, Ming's opportunity cost of studying rises.",（虛構：阿明揀咗溫書，放棄搬貨 $50（最高）同曬鹽 $30。）搬貨工錢由 $50 升到 $70，阿明溫書嘅 opportunity cost 會上升。,,,,,T,Is carrying cargo the highest-valued option forgone?,搬貨係唔係被放棄嘅最高價值選項？,The value of the highest-valued option forgone has risen.,被放棄嘅最高價值選項價值上升。
shiftide-02,shiftide,tf,,,"If studying becomes more valuable to Ming, his opportunity cost of studying also rises.",溫書對阿明嘅價值上升，佢溫書嘅 opportunity cost 都會上升。,,,,,F,Does opportunity cost look at what you chose or what you gave up?,Opportunity cost 睇揀咗嗰樣，定係放棄咗嗰樣？,The value of the chosen option does not affect opportunity cost.,被揀選項本身嘅價值唔影響 opportunity cost。
shiftide-03,shiftide,mc,,,"(Ming) Drying salt rises from $30 to $40, still below cargo at $50. Opportunity cost:",（阿明情境）曬鹽嘅價值由 $30 升到 $40，仍然低過搬貨 $50，opportunity cost：,rises|falls|is unchanged|cannot be determined,上升|下降|不變|無法判斷,,,C,Did drying salt become the highest?,曬鹽有冇變成最高？,Drying salt did not replace cargo as the highest-valued option.,曬鹽冇取代搬貨成為最高價值選項。
shiftide-04,shiftide,mc,,,(Ming) Drying salt rises from $30 to $60. Opportunity cost becomes:,（阿明情境）曬鹽嘅價值由 $30 升到 $60，opportunity cost 變成：,$50|$60|$110|$30,$50|$60|$110|$30,,,B,Which is the highest now?,而家邊個先係最高？,Drying salt replaced cargo as the new highest-valued option forgone.,曬鹽取代咗搬貨，成為新嘅最高價值放棄選項。
shiftide-05,shiftide,mc,,,Which change does NOT affect opportunity cost?,以下邊個改變唔會影響 opportunity cost？,the highest-valued option forgone becomes more valuable|the chosen option takes more time|the chosen option itself becomes more valuable|the chosen option costs more money,被放棄嘅最高價值選項價值上升|被揀選項要用嘅時間增加|被揀選項本身價值上升|被揀選項要用嘅錢增加,,,C,Which one has nothing to do with what is given up?,邊一樣同「放棄咗乜」無關？,More time or money means more alternatives given up; the chosen option's value has no effect.,用多咗時間或錢，會令放棄嘅其他用途增加；被揀選項價值就唔影響。
shiftide-06,shiftide,fill,,,"A rise in the value of another, non-highest option affects opportunity cost only if it ____ the original highest-valued option.",另一個非最高價值嘅選項價值上升，只有當佢 ① 原本最高價值選項時，先會影響 opportunity cost。,replaces|equals|stays below|ignores,取代|等於|低過|無關,,,replaces,It must become the new 'highest'.,佢要變成新嘅「最高」先得。,Textbook: 'if it replaces the original highest-valued option forgone'.,課本：if it replaces the original highest-valued option forgone。
shiftide-07,shiftide,tf,,,"If the risk of going to sea (e.g. storms) increases, the opportunity cost of going to sea rises.",出海嘅風險（例如遇到風浪）增加，出海嘅 opportunity cost 會上升。,,,,,F,Is the risk an option that you gave up?,風險係唔係一個被放棄嘅選項？,Textbook: the risk of undesired events arising from choosing an option does not affect opportunity cost.,課本：選擇某選項而帶來嘅風險，唔影響 opportunity cost。
shiftide-08,shiftide,sort,,,Effect on opportunity cost:,以下改變對 opportunity cost 嘅影響：,affected|not affected|uncertain,影響|唔影響|未必影響,highest-valued option forgone becomes more valuable|chosen option takes more time|chosen option becomes more valuable|a third option becomes more valuable|chosen option becomes riskier,被放棄最高價值選項價值上升|被揀選項所用時間增加|被揀選項本身價值上升|第三選項價值上升|被揀選項風險上升,1|1|2|3|2,Check the textbook table 'Changes in opportunity cost'.,對照課本「Changes in opportunity cost」表。,Matches the textbook table 'Changes in opportunity cost'.,對照課本「Changes in opportunity cost」表。
shiftide-09,shiftide,tf,,,"If the highest-valued option forgone becomes less valuable but is still the highest, opportunity cost falls.",放棄選項入面最高價值嗰個跌價，但仍然係最高，opportunity cost 會下降。,,,,,T,How much is the highest one worth now?,最高嗰個嘅價值變咗幾多？,"Opportunity cost is that option's value, so when it falls, opportunity cost falls.",Opportunity cost 就係嗰個選項嘅價值，佢跌，opportunity cost 就跌。
shiftide-10,shiftide,mc,,,(Ming) Cargo pay falls to $20. Opportunity cost becomes:,（阿明情境）搬貨工錢跌到 $20，opportunity cost 變成：,$20|$30|$50|$0,$20|$30|$50|$0,,,B,"After cargo falls, which is the highest?",搬貨跌咗之後，邊個先係最高？,Drying salt ($30) becomes the highest-valued option forgone.,曬鹽 $30 變成最高價值嘅放棄選項。
shiftide-11,shiftide,mc,,,"If studying takes more time, the opportunity cost:",溫書要用嘅時間增加，opportunity cost：,rises|falls|is unchanged|becomes zero,上升|下降|不變|變零,,,A,More time used – more or fewer alternatives given up?,用多咗時間，放棄咗嘅其他用途多咗定少咗？,Using more time gives up more alternative uses.,用多咗時間，放棄咗更多其他用途。
shiftide-12,shiftide,fill,,,"If the chosen option itself becomes more valuable, opportunity cost is ____.",被揀選項本身嘅價值上升，opportunity cost ①。,unchanged|higher|lower|zero,不變|上升|下降|變零,,,unchanged,Which side does opportunity cost look at?,Opportunity cost 睇嘅係邊一邊？,Opportunity cost only looks at the options given up.,Opportunity cost 只睇放棄咗嘅選項。
shiftide-S1,shiftide,mc,scen,,"(Fictional) Joyce attends a Saturday tuition class in Tung Chung. She gives up café work ($400, highest) and helping at her family's shop ($250). Café pay rises to $500. Her opportunity cost becomes:",（虛構）Joyce 星期六喺東涌上補習班，放棄咗喺 café 做嘢（$400，最高）同幫屋企舖頭（$250）。Café 人工加到 $500。佢嘅 opportunity cost 變成：,$250|$400|$500|$750,$250|$400|$500|$750,,,C,Which option is the highest-valued option forgone now?,而家被放棄嘅最高價值選擇係邊個？,Opportunity cost = value of the highest-valued option forgone. The café job is still the highest and now worth $500. Options are not added.,Opportunity cost = 被放棄嘅最高價值選擇嘅價值。Café 工作仍然最高，而家值 $500。唔會將選擇加埋。
shiftide-S2,shiftide,mc,scen,,(Fictional) Joyce's highest-valued option forgone is café work ($400). A new option appears: guiding tourists at Ngong Ping for $350. Her opportunity cost of attending tuition:,（虛構）Joyce 被放棄嘅最高價值選擇係 café 工作（$400）。而家多咗一個新選擇：喺昂坪做導遊，$350。佢上補習班嘅 opportunity cost：,rises to $750|falls to $350|stays at $400|becomes zero,升到 $750|跌到 $350|維持 $400|變成零,,,C,Does the new option replace the highest-valued one?,新選擇有冇取代到最高價值嗰個？,"A third option matters only if it replaces the highest-valued option forgone. $350 < $400, so opportunity cost is unchanged.",第三個選擇只有取代咗被放棄嘅最高價值選擇先有影響。$350 < $400，所以 opportunity cost 不變。
shiftide-S3,shiftide,sort,scen,,(Fictional) A Kwun Tong restaurant owner chooses to open on Sunday. Does each change affect his opportunity cost of opening?,（虛構）觀塘一個餐廳老闆揀咗星期日開舖。以下每個變化會唔會影響佢開舖嘅 opportunity cost？,changes it|does not change it,會改變|唔會改變,Renting the shop out for a private party (his best alternative) now pays more|Opening on Sunday now needs more money for staff wages|He expects Sunday profit to be higher|The risk of heavy rain on Sunday increases|A new option worth less than his best alternative appears,將間舖租俾人開私人派對（佢最好嘅另一個選擇）而家收多咗錢|星期日開舖而家要俾多啲人工|佢預計星期日利潤會高啲|星期日落大雨嘅風險增加|出現一個價值低過佢最好選擇嘅新選擇,1|1|2|2|2,"Does the change affect the highest-valued option forgone, or the money/time the chosen option needs?",個變化有冇影響被放棄嘅最高價值選擇，或者所揀選擇需要嘅錢／時間？,Opportunity cost changes when the value of the highest-valued option forgone changes or the money/time needed by the chosen option changes. The chosen option's own value and risk do not change it.,當被放棄嘅最高價值選擇嘅價值改變，或者所揀選擇需要嘅錢／時間改變，opportunity cost 先會變。所揀選擇本身嘅價值同風險唔會改變佢。
shiftide-S4,shiftide,tf,scen,,"(Fictional) Kit chooses to take the MTR Tung Chung line to work instead of a bus. If the MTR fare rises, his opportunity cost of taking the MTR rises.",（虛構）阿傑揀咗搭港鐵東涌綫返工而唔搭巴士。如果港鐵車費加價，佢搭港鐵嘅 opportunity cost 會上升。,,,,,T,"If the chosen option needs more money, what else is given up with that money?",如果所揀嘅選擇要用多啲錢，嗰啲錢本來可以用嚟做咩？,"When the chosen option requires more money, more alternatives must be forgone, so opportunity cost rises.",所揀選擇需要更多錢，就要放棄更多其他選擇，所以 opportunity cost 上升。
shiftide-S5,shiftide,fill,scen,,(Fictional) Ben chooses to revise for the DSE on Sunday. His best alternative was a $600 part-time job. A new job offer paying $800 appears. His opportunity cost ____ because the new option ____ the highest-valued one.,（虛構）阿 Ben 揀咗星期日溫書準備 DSE。佢最好嘅另一個選擇本來係 $600 嘅兼職。而家多咗一份 $800 嘅工。佢嘅 opportunity cost ①，因為新選擇 ② 最高價值嗰個。,rises|replaces|falls|does not replace,上升|取代|下降|冇取代,,,rises|replaces,Is $800 higher than the old highest-valued option forgone?,$800 高唔高過原本被放棄嘅最高價值選擇？,"The $800 job replaces the $600 job as the highest-valued option forgone, so opportunity cost rises from $600 to $800.",$800 嘅工取代咗 $600 嗰份，成為被放棄嘅最高價值選擇，所以 opportunity cost 由 $600 升到 $800。
sunkshell-01,sunkshell,tf,,,No choice implies no cost.,No choice implies no cost（冇選擇就冇成本）。,,,,,T,"With no choice, is anything given up?",冇得揀，有冇放棄任何選項？,"With no choice, no option is given up.",冇得揀，就冇放棄任何選項。
sunkshell-02,sunkshell,tf,,,The cost of building the salt pans years ago should be counted in today's opportunity cost of drying salt.,已經建好嘅鹽田建造費，應該計入今日繼續曬鹽嘅 opportunity cost。,,,,,F,"Whatever you choose today, can that money be recovered?",今日點揀，嗰筆錢拎唔拎得返？,"Historical cost is not a cost: whatever you choose today, that money is gone.",Historical cost is not a cost：無論今日揀咩，嗰筆錢都拎唔返。
sunkshell-03,sunkshell,mc,,,(Fictional) Salt worker Fook spent a lot building salt pans in the 1940s. In the 1960s he considers whether to continue. Which should NOT affect his decision?,（虛構）鹽工阿福 1940 年代花大錢起鹽田。1960 年代佢考慮應唔應該繼續曬鹽。以下邊樣唔應該影響佢嘅決定？,income from working in the city|the price of imported salt|the cost of building the salt pans back then|the value of other uses of the salt pans,市區打工收入|入口鹽嘅價格|當年起鹽田嘅費用|鹽田改作其他用途嘅價值,,,C,Which one was paid in the past?,邊一樣係過去已經付咗嘅？,Money already paid is a historical cost.,已付嘅費用係 historical cost。
sunkshell-04,sunkshell,mc,,,Why is historical cost not a cost?,點解 historical cost 唔係 cost？,"It has been paid and cannot be recovered whatever you choose, so nothing is given up by any choice|The amount is too small|It is a free good|It is a non-money cost",因為已經付咗，無論揀咩都拎唔返，唔係任何選擇下放棄嘅嘢|因為金額太細|因為佢係 free good|因為佢係 non-money cost,,,A,A cost is something given up because of this choice.,Cost 係因為今次選擇而放棄嘅嘢。,A cost is what you give up because of the current choice.,Cost 係「因為今次選擇而放棄」嘅嘢。
sunkshell-05,sunkshell,fill,,,"Historical cost is ____ a cost, because it cannot be ____ whatever choice is made.",Historical cost ① 係 cost，因為無論點揀都 ②。,not|recovered|always|increased,唔|拎唔返|一定|增加,,,not|recovered,Can that money be got back?,嗰筆錢拎唔拎得返？,The money is already spent and does not change with the current choice.,錢已經用咗，唔會因為今次選擇而改變。
sunkshell-06,sunkshell,mc,,,In which case does the resource used have NO opportunity cost?,以下邊個情況，用嘅資源冇 opportunity cost？,using a salt pan that can only dry salt and has no other use|using your own time to dry salt|using money to buy salt|renting a boat to go fishing,一塊鹽田只可以曬鹽、冇任何其他用途，用佢曬鹽|用自己時間曬鹽|用錢買鹽|租船出海,,,A,Which resource has no other use?,邊一樣資源冇其他用途？,"No other use means no choice, so no cost.",冇其他用途，即係冇選擇，所以冇 cost。
sunkshell-07,sunkshell,tf,,,"A fishing boat's purchase price is a historical cost, but using it now still has an opportunity cost, e.g. the rent from leasing it out.",一艘漁船已經買咗，買船錢係 historical cost；但而家用佢出海，仍然有 opportunity cost，例如放棄咗租船俾人嘅租金。,,,,,T,Does the boat have other uses now?,而家用艘船，有冇其他用途？,"Past money is not counted, but today's choice still has a cost.",過去嘅錢唔計，但今日嘅選擇仍然有 cost。
sunkshell-08,sunkshell,sort,,,A cost or not a cost?,「係 cost」定「唔係 cost」？,a cost|not a cost,係 cost|唔係 cost,money spent on nets last year|cargo income given up by fishing today|salt pan building cost already paid|rent given up by using the boat to fish,去年買漁網嘅錢|今日出海放棄嘅搬貨收入|已付嘅鹽田建造費|用漁船出海而放棄嘅租金收入,2|1|2|1,Separate 'already paid' from 'being given up today'.,分辨「已經付咗」同「今日放棄緊」。,Only what is given up by today's choice is a cost.,分辨「已經付咗」同「今日放棄緊」。
sunkshell-09,sunkshell,mc,,,(Fictional) Last year Fook spent $500 repairing the sluice gate. Now he is thinking of changing jobs. The $500:,（虛構）福伯上年花 $500 修補鹽田水閘。今年佢考慮應唔應該轉行，呢 $500：,is a historical cost and should not affect the decision|should be added to the cost of changing jobs|should be added to the cost of continuing|is a time cost,係 historical cost，唔應影響決定|應該加入轉行嘅 cost|應該加入繼續曬鹽嘅 cost|係 time cost,,,A,Can the $500 be recovered today?,呢 $500 今日仲拎唔拎得返？,"Whether he changes jobs or not, the $500 is already spent.",無論轉唔轉行，$500 都已經用咗。
sunkshell-10,sunkshell,tf,,,"Since a lot of money was spent building the salt pans, we should keep drying salt so as not to waste it.",因為已經花咗好多錢起鹽田，所以應該繼續曬鹽，唔好浪費。,,,,,F,Will past spending come back if you keep drying salt?,過去花嘅錢，會唔會因為你繼續曬鹽而返嚟？,A common mistake: deciding by historical cost. Compare gains and losses from today onwards.,呢個係常見錯誤：用 historical cost 做決定。應該比較今日開始嘅得失。
sunkshell-11,sunkshell,fill,,,No ____ implies no cost.,冇 ① 就冇 cost。,choice|money|time|interest,選擇|金錢|時間|利息,,,choice,Without what is there no cost?,冇咗乜就冇 cost？,"No choice means nothing is given up, so no cost.",冇選擇就冇放棄，所以冇 cost。
sunkshell-12,sunkshell,mc,,,An old boat can no longer be rented or sold and has no other use. The opportunity cost of using it to fish (boat only) is:,一艘舊船已經冇人肯租、冇人肯買，亦冇其他用途。用佢出海嘅 opportunity cost（只計艘船）係：,zero|its original price|repair costs|the price of a new boat,零|當年買船價|維修費|新船價,,,A,Does the boat have any other use?,艘船仲有冇其他用途？,"No other use means no choice, so the boat's opportunity cost is zero.",冇其他用途即係冇選擇，所以艘船嘅 opportunity cost 係零。
sunkshell-S1,sunkshell,mc,scen,,"(Fictional) Winnie paid a $3,000 non-refundable fee for a 10-week cooking course. Now she is deciding whether to attend tonight's class or work a $500 shift. Which should NOT affect her decision?","（虛構）Winnie 俾咗 $3,000 唔退款嘅學費報咗 10 星期烹飪班。而家佢諗緊今晚去上堂定係返一更 $500 嘅工。以下邊樣唔應該影響佢嘅決定？","The $3,000 fee already paid|The $500 wage forgone|How much she values tonight's class|The travelling time to class","已經俾咗嘅 $3,000 學費|放棄咗嘅 $500 人工|佢有幾重視今晚堂課|去上堂嘅交通時間",,,A,"Can the $3,000 be recovered whichever option she chooses?","無論佢揀邊樣，嗰 $3,000 攞唔攞得返？","The fee is a historical cost: it cannot be recovered whatever choice is made, so it is not a cost of tonight's decision.",學費係 historical cost：無論點揀都攞唔返，所以唔係今晚決定嘅 cost。
sunkshell-S2,sunkshell,tf,scen,,"(Fictional) A family bought a flat in Tai Po for $2 million in 1995. It could now be rented out for $15,000 a month. The cost of living in it themselves is the $2 million paid in 1995.","（虛構）一家人 1995 年用 $200 萬喺大埔買咗層樓。而家層樓可以每月租 $15,000。佢哋自己住嘅 cost 係 1995 年俾嘅 $200 萬。",,,,,F,Is the 1995 price something they can still avoid? What do they give up by living there now?,1995 年嘅樓價而家仲避唔避得到？佢哋而家自己住放棄咗咩？,"The purchase price is a historical cost, not a cost. The cost of living there now is the highest-valued option forgone, e.g. $15,000 rent a month.","買樓價係 historical cost，唔係 cost。而家自己住嘅 cost 係被放棄嘅最高價值選擇，例如每月 $15,000 租金。"
sunkshell-S3,sunkshell,sort,scen,,"(Fictional) Kwok, a Sham Shui Po shop owner, is deciding whether to keep his shop open this month. Is each item a cost of that decision?",（虛構）深水埗舖頭老闆郭生諗緊今個月繼續開舖定唔開。以下每項係唔係呢個決定嘅 cost？,a cost|not a cost,係 cost|唔係 cost,Rent he could get by subletting the shop|Renovation paid five years ago|Wage he could earn working elsewhere|A machine bought last year with no resale value or other use|A non-refundable licence fee already paid,將間舖分租出去可以收嘅租|五年前俾咗嘅裝修費|佢去第度打工可以賺嘅人工|舊年買咗、冇得轉賣又冇其他用途嘅機器|已經俾咗、唔可以退嘅牌照費,1|2|1|2|2,Can the item still be avoided or gained by choosing differently now?,而家揀唔同選擇，呢項仲可唔可以避免或者賺到？,Only forgone options count. Money already spent and unrecoverable is historical cost; a resource with no alternative use has no opportunity cost.,只有被放棄嘅選擇先算 cost。已經用咗又攞唔返嘅錢係 historical cost；冇其他用途嘅資源冇 opportunity cost。
sunkshell-S4,sunkshell,mc,scen,,(Fictional) Tom paid $200 for a concert ticket that cannot be refunded or resold. On concert night his best alternative is a $150 helper job. His opportunity cost of going to the concert is:,（虛構）阿 Tom 用 $200 買咗張唔可以退又唔可以轉賣嘅音樂會飛。音樂會當晚佢最好嘅另一個選擇係一份 $150 嘅幫手工。佢去音樂會嘅 opportunity cost 係：,$0|$150|$200|$350,$0|$150|$200|$350,,,B,"On the night, can the $200 be changed by his choice?",當晚無論佢點揀，嗰 $200 會唔會改變？,The $200 is a historical cost and cannot be recovered. The opportunity cost is the highest-valued option forgone: the $150 job.,$200 係 historical cost，攞唔返。Opportunity cost 係被放棄嘅最高價值選擇：$150 嘅工。
sunkshell-S5,sunkshell,mc,scen,,(Fictional) Kai must attend a one-hour school assembly; he cannot leave or do anything else during it. The cost to Kai of attending is:,（虛構）阿啟一定要出席一個鐘嘅學校週會，期間佢唔可以離開亦做唔到其他嘢。對阿啟嚟講，出席嘅 cost 係：,"zero, because he has no choice|the value of his best use of one hour|his tuition fee|the wages of the teachers",零，因為佢冇得揀|佢一個鐘最好用途嘅價值|佢嘅學費|老師嘅人工,,,A,"If there is nothing else he could do, is anything given up?",如果佢冇其他嘢可以做，佢有冇放棄到任何嘢？,"No choice implies no cost: without an alternative, no option is forgone.",No choice implies no cost：冇其他選擇，就冇被放棄嘅選擇。
saltling-01,saltling,tf,,,A free good is a good that costs no money.,Free good 即係唔使俾錢嘅物品。,,,,,F,Is the classification about price or about quantity?,分類睇收唔收錢，定睇數量夠唔夠？,"The classification depends on whether the quantity satisfies everyone, not on the price.",分類睇數量夠唔夠滿足所有人，唔係睇收唔收錢。
saltling-02,saltling,tf,,,Sun-dried salt is an economic good.,曬好嘅鹽係 economic good。,,,,,T,Does drying salt need workers and salt pans?,曬鹽要唔要用人手同鹽田？,"It needs scarce resources like labour and salt pans, and people pay for it.",要用人手同鹽田等 scarce resources 生產，人願意俾錢買。
saltling-03,saltling,mc,,,Which is most likely a free good?,以下邊個最可能係 free good？,seawater in the ocean|masks handed out free by the government|free school lunches|sun-dried salt,大海入面嘅海水|政府免費派嘅口罩|學校免費午餐|曬好嘅鹽,,,A,Which is available in enough quantity for everyone?,邊一樣數量夠晒所有人？,Ocean seawater satisfies everyone. The others are free of charge but use scarce resources.,大海嘅海水數量夠滿足所有人。其他雖然免費，但要用 scarce resources 生產。
saltling-04,saltling,mc,,,Items given out free by the government are:,政府免費派發嘅物品屬於：,free goods|economic goods|depends on whether a price is charged|neither,free good|economic good|睇收唔收錢|唔屬於任何一類,,,B,Does producing them use resources?,生產呢啲物品要唔要用資源？,The quantity cannot satisfy everyone and there is a production cost.,數量唔夠滿足所有人，而且有 production cost。
saltling-05,saltling,fill,,,A free good is a good for which the quantity available is ____ to satisfy all human wants for it. More of it is ____ preferred.,Free good 嘅數量 ① 滿足所有人對佢嘅 wants。更多 ② 更好。,sufficient|insufficient|not|always,足以|不足以|唔係|一定係,,,sufficient|not,Is a free good's quantity enough?,Free good 嘅數量夠唔夠？,This is the textbook definition.,課本定義。
saltling-06,saltling,fill,,,Providing an economic good involves a ____ cost because it uses scarce resources with alternative uses.,Economic good 嘅提供涉及 ① cost，因為要用有其他用途嘅 scarce resources。,production|historical|time|interest,生產|歷史|時間|利息,,,production,Production uses resources.,生產要用資源。,A free good has no production cost.,Free good 就冇 production cost。
saltling-07,saltling,mc,,,Which is a feature of an economic good?,以下邊個係 economic good 嘅特徵？,more of it is not preferred|no one is willing to pay for it|people are willing to pay a price to compete for it|it has no production cost,更多唔係更好|冇人願意俾錢|人願意付價錢去競爭佢|冇 production cost,,,C,Which type do the other three describe?,其餘三個屬於邊一類？,The other three are features of free goods.,其餘都係 free good 嘅特徵。
saltling-08,saltling,sort,,,Economic good or free good?,「economic good」定「free good」？,economic good|free good,經濟物品|免費物品,sun-dried salt|seawater in the ocean|free newspapers|sunlight by the sea|salted fish|air,曬好嘅鹽|大海嘅海水|免費派發嘅報紙|海邊陽光|鹹魚|空氣,1|2|1|2|1|2,Do free newspapers need paper and labour?,免費報紙要唔要紙張同人手？,"Free newspapers are a trap: they need paper and labour, so they are economic goods.",免費報紙係陷阱：要紙張同人手，係 economic good。
saltling-09,saltling,tf,,,"In a desert, water may be an economic good; in the ocean, seawater is a free good.",喺沙漠，水可能係 economic good；喺大海，海水係 free good。,,,,,T,Compare quantity with wants.,分類睇數量同 wants 嘅比較。,The same thing can be sufficient in one place and insufficient in another.,同一樣嘢，喺唔同環境下數量夠唔夠滿足 wants 可以唔同。
saltling-10,saltling,mc,,,Why will people pay for dried salt but not for seawater?,點解曬好嘅鹽有人願意俾錢買，但海水冇？,salt is not enough for everyone; seawater is|salt is saltier|seawater belongs to the government|no reason,鹽嘅數量唔夠滿足所有人，海水夠|鹽比較鹹|海水係政府嘅|冇原因,,,A,Think about quantity and wants.,諗吓數量同 wants。,"An economic good is insufficient, so people pay to compete for it.",Economic good 數量唔夠，所以人願意付價錢競爭。
saltling-11,saltling,tf,,,"For an economic good, more of it is preferred.",Economic good 係 more is preferred（更多係更好）。,,,,,T,Would more salt make you happier?,鹽多啲，你會唔會更開心？,Economic good: more is preferred; free good: more is not preferred.,Economic good：更多係更好；free good：更多唔係更好。
