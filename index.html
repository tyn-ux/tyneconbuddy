triactiv-S1,triactiv,sort,scen,,"(Fictional) Production, exchange or consumption?",（虛構）Production、exchange 定 consumption？,production|exchange|consumption,production|exchange|consumption,a Tung Chung hairdresser cutting a customer's hair|a van driver delivering parcels|a passenger paying the bus fare with an Octopus card|a family watching a film they bought|a customer handing $30 to a stall for fish balls|a child eating the fish balls,東涌髮型師幫客人剪頭髮|貨車司機送貨|乘客用八達通俾巴士車費|一家人睇佢哋買返嚟嘅電影|客人俾 $30 小販買魚蛋|小朋友食魚蛋,1|1|2|3|2|3,"Is it making a good or service, trading, or using it to satisfy a want directly?",係製造貨品或服務、進行交易，定係直接用嚟滿足 wants？,Services such as hairdressing and delivery are production; trading goods for money is exchange; using goods to satisfy wants directly is consumption.,剪髮、送貨等服務都係 production；用錢換貨係 exchange；直接用貨品滿足 wants 係 consumption。
triactiv-S2,triactiv,mc,scen,,(Fictional) Ah Lok works as a chef in a Tai O restaurant by day and eats dinner at home with his family at night. Which is correct?,（虛構）阿樂日頭喺大澳一間餐廳做廚師，夜晚返屋企同家人食飯。以下邊句啱？,The restaurant is a production unit; Ah Lok's family is a consumption unit|The restaurant is a consumption unit; Ah Lok's family is a production unit|Both are production units|Both are consumption units,餐廳係 production unit；阿樂屋企係 consumption unit|餐廳係 consumption unit；阿樂屋企係 production unit|兩者都係 production unit|兩者都係 consumption unit,,,A,"What is the main role of a firm, and of a household?",Firm 同 household 嘅主要角色分別係乜？,Firms are production units; households are consumption units.,Firms 係 production units；households 係 consumption units。
triactiv-S3,triactiv,mc,scen,,(Fictional) Which of these activities on Lantau is NOT production?,（虛構）以下邊項大嶼山嘅活動唔係 production？,a tourist eating an egg waffle|a guide explaining the history of stilt houses|a boatman taking visitors to see dolphins|a teacher teaching at a Tung Chung school,遊客食雞蛋仔|導遊講解棚屋歷史|船家載遊客睇海豚|老師喺東涌學校教書,,,A,Which one uses up a good to satisfy a want directly?,邊一項係直接用咗件貨品嚟滿足 wants？,"Guiding, boat trips and teaching are services, which are production. Eating the waffle satisfies a want directly, so it is consumption.",導遊、船程、教書都係服務，屬 production。食雞蛋仔直接滿足 wants，係 consumption。
triactiv-S4,triactiv,order,scen,,(Fictional) Put the life of a packet of Lantau tea in order:,（虛構）將一包大嶼山茶葉嘅過程排好：,,,a farmer grows and picks tea leaves|a workshop dries and packs the leaves|a shop sells the packet to a tourist for money|the tourist brews and drinks the tea at home,農夫種茶、採茶|工場將茶葉烘乾、包裝|商店將茶葉賣畀遊客收錢|遊客返屋企沖茶飲,,"Which activity must happen before goods can be sold, and which comes last?",邊個活動要喺賣之前發生？邊個係最後？,"Growing and processing are production, selling is exchange, and drinking is consumption.",種茶同加工係 production，出售係 exchange，飲茶係 consumption。
triactiv-S5,triactiv,fill,scen,,"(Fictional) A Yuen Long bakery turns flour into cakes (____), sells a cake to Mrs Ho for $50 (____), and her son eats it at home (____).",（虛構）元朗一間餅店將麵粉整成蛋糕（①），以 $50 賣一個畀何太（②），佢個仔喺屋企食咗（③）。,production|exchange|consumption|distribution,production|exchange|consumption|distribution,,,production|exchange|consumption,"Which step turns inputs into output, which is trading, and which satisfies a want directly?",邊步係將投入變成產出？邊步係交易？邊步直接滿足 wants？,"Turning inputs into output is production; trading is exchange; eating satisfies wants directly, so it is consumption.",將投入變成產出係 production；交易係 exchange；食嘢直接滿足 wants 係 consumption。
flowray-01,flowray,tf,,,"In the circular flow, households provide factor services in the factor market.",喺 circular flow，households 喺 factor market 提供 factor services。,,,,,T,In which market do workers offer their labour?,工人喺邊個市場出賣勞力？,E.g. labour and land.,例如勞力、土地。
flowray-02,flowray,tf,,,"In a simple circular flow, households' expenditure equals firms' revenue.",喺簡單 circular flow，households' expenditure 就係 firms' revenue。,,,,,T,The same money seen from two sides.,同一筆錢由兩邊睇。,It is the same money seen from both sides.,同一筆錢，由兩邊睇。
flowray-03,flowray,mc,,,A salt worker providing labour to a salt pan owner is:,鹽工向鹽田老闆提供勞力，屬於：,"real flow, in the factor market|money flow, in the product market|real flow, in the product market|money flow, in the factor market",real flow，喺 factor market|money flow，喺 product market|real flow，喺 product market|money flow，喺 factor market,,,A,Is labour goods or money? Which market?,勞力係實物定錢？喺邊個市場？,Labour is a factor service; no money is flowing.,勞力係 factor service，冇錢流動。
flowray-04,flowray,mc,,,A tourist paying for salted fish – that money is:,遊客俾錢買鹹魚，嗰筆錢係：,"money flow, in the product market|real flow, in the product market|money flow, in the factor market|real flow, in the factor market",money flow，喺 product market|real flow，喺 product market|money flow，喺 factor market|real flow，喺 factor market,,,A,Money or goods? Buying a product or a factor?,錢定實物？買嘅係產品定生產要素？,It is expenditure on goods.,買物品嘅支出。
flowray-05,flowray,fill,,,The real flow refers to the flow of factor ____ as well as ____ and services.,Real flow 係指生產要素 ① 同埋 ② 同服務嘅流動。,services|goods|income|money,服務|物品|收入|金錢,,,services|goods,The real flow is the non-money one.,Real flow 係實物嗰條。,The real flow is the 'real things' flow.,Real flow 係「實物」嗰條。
flowray-06,flowray,fill,,,The money flow refers to the flow of money ____ and money ____.,Money flow 係指貨幣 ① 同貨幣 ② 嘅流動。,income|expenditure|services|goods,收入|支出|服務|物品,,,income|expenditure,The money flow is the money one.,Money flow 係錢嗰條。,The money flow is the 'money' flow.,Money flow 係「錢」嗰條。
flowray-07,flowray,sort,,,Place the four labels on the four arrows of the circular flow:,將四個標籤放去 circular flow 圖嘅四支箭：,households→firms (factor market)|firms→households (factor market)|firms→households (product market)|households→firms (product market),住戶→廠商（生產要素市場）|廠商→住戶（生產要素市場）|廠商→住戶（產品市場）|住戶→廠商（產品市場）,factor services|factor income|goods and services|households' expenditure,生產要素服務|要素收入|物品與服務|住戶支出,1|2|3|4,"Each market has one real flow and one money flow, in opposite directions.",每個 market 一條實物、一條錢，方向相反。,Each market has a real flow and a money flow going in opposite directions.,每個 market 都有一條 real flow 同一條 money flow，方向相反。
flowray-08,flowray,mc,,,Which is a factor market transaction?,邊個屬於 factor market 嘅交易？,a stilt house owner renting the house to a shrimp paste factory as a warehouse|a tourist buying salted fish|a tourist taking a sightseeing boat|a child buying ice cream,棚屋業主將屋租俾蝦醬廠做倉|遊客買鹹魚|遊客坐觀光船|小朋友買雪糕,,,A,Who is providing a factor of production?,邊個提供緊生產要素？,Renting out a house provides a factor service (land).,租出屋即係提供 factor service（land）。
flowray-09,flowray,mc,,,A shrimp paste factory paying wages to workers is:,蝦醬工場付人工俾工人，屬於：,"money flow, in the factor market|real flow, in the factor market|money flow, in the product market|real flow, in the product market",money flow，喺 factor market|real flow，喺 factor market|money flow，喺 product market|real flow，喺 product market,,,A,Wages are payment for what?,人工係乜嘅報酬？,Wages are factor income.,人工係 factor income。
flowray-10,flowray,tf,,,The product market is a market for exchanging goods and services.,Product market 係交換物品同服務嘅市場。,,,,,T,Glossary definition.,Glossary 定義。,Glossary: a market for exchanging goods and services.,Glossary：交換物品同服務嘅市場。
flowray-11,flowray,fill,,,The factor market is a market for exchanging factor ____.,Factor market 係交換生產要素 ① 嘅市場。,services|goods|prices|rights,服務|物品|價格|權利,,,services,What do labour and land provide?,勞力、土地提供嘅係乜？,Glossary: factors or factor services.,Glossary：生產要素或要素服務。
flowray-12,flowray,sort,,,Real flow or money flow?,Real flow 定 money flow？,real flow|money flow,實質流程|貨幣流程,workers providing labour|factory paying wages|tourists paying for shrimp paste|factory supplying shrimp paste,工人提供勞力|工場付人工|遊客買蝦醬付錢|工場提供蝦醬,1|2|2|1,Is it money or real things?,係錢定係實物？,Money moving is money flow; labour and goods are real flow.,錢嘅流動係 money flow，勞力同物品係 real flow。
flowray-S1,flowray,mc,scen,,"(Fictional) Ah Yan works at a Tsim Sha Tsui hotel and receives a monthly wage of $15,000. In the circular flow, this wage is:","（虛構）阿欣喺尖沙咀一間酒店返工，每月人工 $15,000。喺 circular flow 入面，呢份人工係：",a money flow from firms to households in the factor market|a money flow from households to firms in the product market|a real flow from firms to households in the product market|a real flow from households to firms in the factor market,喺 factor market 由 firms 流去 households 嘅 money flow|喺 product market 由 households 流去 firms 嘅 money flow|喺 product market 由 firms 流去 households 嘅 real flow|喺 factor market 由 households 流去 firms 嘅 real flow,,,A,"Is a wage money or a service? Who pays it, and for what?",人工係錢定係服務？邊個俾、為咗買乜？,"Wages are factor payments: money paid by firms to households for labour services, in the factor market.",人工係 factor payment：firms 喺 factor market 俾錢畀 households，換取勞動服務。
flowray-S2,flowray,mc,scen,,"(Fictional) Mr Lee, a household member, rents his farmland in Yuen Long to a vegetable-farming firm. The use of the land that he provides is:",（虛構）李先生（household）將佢喺元朗嘅農地租畀一間種菜公司。佢提供嘅土地使用權係：,a real flow of factor services from households to firms|a money flow of factor payments from firms to households|a real flow of goods from firms to households|consumption expenditure,由 households 流去 firms 嘅 factor services real flow|由 firms 流去 households 嘅 factor payments money flow|由 firms 流去 households 嘅貨品 real flow|consumption expenditure,,,A,Is the land use a service or money? Which way does it flow?,土地使用權係服務定係錢？流向邊度？,Providing land is a factor service: a real flow from households to firms in the factor market. The rent he receives would be the money flow.,提供土地係 factor service，係喺 factor market 由 households 流去 firms 嘅 real flow。收返嘅租金先係 money flow。
flowray-S3,flowray,mc,scen,,"(Fictional) In a simple circular flow, firms pay households $500 in wages, $200 in rent, $100 in interest and $200 in profit. Households spend all their income. What is total household expenditure on goods and services?",（虛構）喺簡單 circular flow，firms 俾 households 人工 $500、租金 $200、利息 $100、利潤 $200。Households 將全部收入用晒。Households 喺貨品同服務嘅總支出係幾多？,"$1,000|$500|$800|$1,200","$1,000|$500|$800|$1,200",,,A,Add up all factor payments. Where does all that income go?,將全部 factor payments 加埋。呢啲收入最後去咗邊？,"Factor income = 500 + 200 + 100 + 200 = $1,000. In a simple circular flow households spend all income, so expenditure = firms' revenue = $1,000.","Factor income = 500 + 200 + 100 + 200 = $1,000。簡單 circular flow 入面 households 用晒收入，所以支出 = firms 收入 = $1,000。"
flowray-S4,flowray,sort,scen,,(Fictional) Factor market or product market?,（虛構）Factor market 定 product market？,factor market|product market,factor market|product market,a café in Tai O hires a waiter|a family buys a fridge in Mong Kok|a firm pays interest to a household that lent it money|a tourist buys a Ngong Ping 360 ticket|a household leases a shop space to a firm,大澳一間 café 請侍應|一家人喺旺角買雪櫃|公司俾利息畀借錢畀佢嘅 household|遊客買昂坪 360 門票|一個 household 將舖位租畀公司,1|2|1|2|1,"Is a factor service (labour, land, capital) or a final good or service being traded?",交易嘅係 factor services（勞動、土地、資本），定係貨品同服務？,The factor market exchanges factor services and factor payments; the product market exchanges goods and services.,Factor market 交換 factor services 同 factor payments；product market 交換貨品同服務。
flowray-S5,flowray,tf,scen,,"(Fictional) When a Tung Chung household buys a pair of shoes, the shoes moving from the shop to the household are a money flow.",（虛構）東涌一個 household 買一對鞋，對鞋由商店去到 household 係 money flow。,,,,,F,"Are the shoes money, or a good?",對鞋係錢，定係貨品？,Goods and services moving from firms to households form the real flow; the payment for the shoes is the money flow.,由 firms 流去 households 嘅貨品同服務屬 real flow；買鞋俾嘅錢先係 money flow。
flowray-D1,flowray,diag,diag,circular_flow,Drag each label onto the correct arrow of the circular flow diagram.,將每張標籤拖去 circular flow 圖正確嘅箭咀。,Households → firms (factor market)|Firms → households (factor market)|Firms → households (product market)|Households → firms (product market),住戶 → 廠商（factor market）|廠商 → 住戶（factor market）|廠商 → 住戶（product market）|住戶 → 廠商（product market）,factor services|factor income|goods and services|households' expenditure,生產要素服務|要素收入|物品及服務|住戶開支,1|2|3|4,"Each market has one real flow and one money flow, going in opposite directions.",每個 market 有一條實物流、一條金錢流，方向相反。,"Real flows: factor services (households → firms), goods and services (firms → households). Money flows run the opposite way: factor income and households' expenditure.",Real flow：factor services（住戶→廠商）、goods and services（廠商→住戶）；money flow 方向相反：factor income 同 households' expenditure。
flowray-D2,flowray,diag,diag,circular_flow,(Fictional) Ah Sang works in a Tai O shrimp paste factory and buys shrimp paste from it. Put each flow on the diagram.,（虛構）阿生喺大澳蝦醬廠打工，又向工廠買蝦醬。將每個流向放上圖。,Households → firms (factor market)|Firms → households (factor market)|Firms → households (product market)|Households → firms (product market),住戶 → 廠商（factor market）|廠商 → 住戶（factor market）|廠商 → 住戶（product market）|住戶 → 廠商（product market）,Ah Sang's labour|Ah Sang's $150 monthly wage|jars of shrimp paste|the $30 Ah Sang pays for shrimp paste,阿生嘅勞力|阿生每月 $150 人工|一樽樽蝦醬|阿生買蝦醬俾嘅 $30,1|2|3|4,"Is it labour, a wage, a good, or spending? Which market is it in?",係勞力、人工、物品，定係開支？喺邊個 market？,Labour is a factor service; the wage is factor income; shrimp paste is a good; the $30 is household expenditure in the product market.,勞力係 factor service；人工係 factor income；蝦醬係 goods；$30 係 product market 嘅住戶開支。
flowray-D3,flowray,diag,diag,circular_flow,(Fictional) Mr Lee rents his land in Yuen Long to a vegetable farm. Put each flow on the diagram.,（虛構）李先生將元朗塊地租俾菜場。將每個流向放上圖。,Households → firms (factor market)|Firms → households (factor market)|Firms → households (product market)|Households → firms (product market),住戶 → 廠商（factor market）|廠商 → 住戶（factor market）|廠商 → 住戶（product market）|住戶 → 廠商（product market）,the use of Mr Lee's land|rent paid to Mr Lee|vegetables sold to families|money families pay for vegetables,李先生塊地嘅使用|付俾李先生嘅租金|賣俾家庭嘅蔬菜|家庭買菜俾嘅錢,1|2|3|4,Land is a factor of production. Rent is a payment for which service?,土地係生產要素。租金係俾邊種服務嘅報酬？,The land's use is a factor service; rent is factor income; vegetables are goods; the families' payment is expenditure in the product market.,土地使用係 factor service；租金係 factor income；蔬菜係 goods；家庭俾嘅錢係 product market 開支。
normafly-01,normafly,tf,,,Positive statements can be refuted by facts.,Positive statements 可以用事實推翻。,,,,,T,Glossary definition.,Glossary 定義。,This is the glossary definition.,Glossary 定義。
normafly-02,normafly,tf,,,A sentence with numbers must be a positive statement.,有數字嘅句子一定係 positive statement。,,,,,F,"'The government should give each salt worker $1,000' – does it have a number?","「政府應該俾每個鹽工 $1,000」有冇數字？",A sentence with numbers can still be a value judgement.,有數字都可以係價值判斷。
normafly-03,normafly,mc,,,Which is a positive statement?,邊句係 positive statement？,Tai O's yellow croaker catch in 1958 was 402 piculs|The government should protect the salt pans|Tai O should develop tourism|Fishermen should change jobs,1958 年大澳黃花魚漁獲係 402 擔|政府應該保育鹽田|大澳應該發展旅遊|漁民應該轉行,,,A,Which can be checked against records?,邊句可以用紀錄核對？,It can be checked against records.,可以用紀錄核對。
normafly-04,normafly,mc,,,Which is a normative statement?,邊句係 normative statement？,The government should subsidise Tai O fishermen|A bridge across Tai O's creek was completed in 1996|A higher interest rate increases willingness to save|Competition from imported salt was fierce after WWII,政府應該資助大澳漁民|大澳一條跨河大橋喺 1996 年落成|利率上升會令儲蓄意願上升|二戰後入口鹽競爭激烈,,,A,Which is a value judgement?,邊句係價值判斷？,'Should' is usually a sign of a value judgement – but check the content.,「應該」通常係價值判斷嘅訊號，但要睇內容。
normafly-05,normafly,fill,,,Normative statements are statements about value ____. They ____ be refuted by facts.,Normative statements 係關於價值 ① 嘅陳述，② 用事實推翻。,judgements|cannot|can|facts,判斷|唔可以|可以|事實,,,judgements|cannot,Can a value judgement be refuted by facts?,價值判斷可唔可以用事實推翻？,This is the glossary definition.,Glossary 定義。
normafly-06,normafly,tf,,,A positive statement can be wrong.,一句 positive statement 可以係錯嘅。,,,,,T,Does positive mean 'correct'?,Positive 即係「啱」咩？,"Positive means it can be tested by facts, not that it is true.",Positive 即係可以用事實檢驗，唔代表一定啱。
normafly-07,normafly,sort,,,Positive or normative?,Positive 定 normative？,positive|normative,實證性|規範性,The Tai O road was built in 1969–1970|Tai O should keep its stilt houses|A higher interest rate lowers willingness to borrow|The government should give out free rice|Tai O's population began falling in the 1970s|Salt workers are pitiful and deserve subsidies,1969–1970 年興建大澳公路|大澳應該保留棚屋|利率上升，借錢意願會下降|政府應該免費派米|大澳人口喺 1970 年代開始下降|鹽工好慘，應該有補助,1|2|1|2|1|2,Ask: can facts prove it wrong?,問自己：可唔可以用事實證明佢錯？,Ask: can facts prove it wrong?,問自己：可唔可以用事實證明佢錯？
normafly-08,normafly,mc,,,'Tai O's stilt houses are the most beautiful buildings in Hong Kong.' This is:,「大澳棚屋係香港最靚嘅建築。」屬於：,a normative statement|a positive statement|both|neither,規範性陳述|實證性陳述|兩者都係|兩者都唔係,,,A,Can 'most beautiful' be refuted by facts?,「最靚」可唔可以用事實推翻？,'Most beautiful' is a value judgement and cannot be refuted by facts.,「最靚」係價值判斷，冇得用事實推翻。
normafly-09,normafly,tf,,,A normative statement must contain the word 'should'.,Normative statement 入面一定有「應該」兩個字。,,,,,F,Does 'stilt houses are the most beautiful buildings' contain 'should'?,「棚屋係最靚嘅建築」有冇「應該」？,Without 'should' it can still be a value judgement.,冇「應該」都可以係價值判斷。
normafly-10,normafly,mc,,,Which is a positive statement?,邊句係 positive statement？,Tai O's salt industry declined in the 1950s–60s|Tai O should revive salt making|Salt workers deserve sympathy|The government is not doing enough,大澳嘅鹽業喺 1950–1960 年代日漸式微|大澳應該恢復鹽業|鹽工值得同情|政府做得唔夠,,,A,Which can be checked against historical records?,邊句可以用歷史紀錄核對？,It can be checked against historical records.,可以用歷史紀錄核對。
normafly-11,normafly,fill,,,Positive statements are statements about ____. They ____ be refuted by facts.,Positive statements 係關於 ① 嘅陳述，② 用事實推翻。,facts|can|cannot|values,事實|可以|唔可以|價值,,,facts|can,The opposite of normative.,同 normative 相反。,This is the glossary definition.,Glossary 定義。
normafly-12,normafly,mc,,,'The fall in yellow croaker lowered fishermen's income.' This is:,「黃花魚減少令漁民收入下降。」屬於：,a positive statement|a normative statement|both|neither,實證性陳述|規範性陳述|兩者都係|兩者都唔係,,,A,Can it be checked with data?,可唔可以用數據驗證？,"It can be tested with data – even if it turned out false, it is still positive.",可以用數據驗證，就算最後發現唔啱，都係 positive。
normafly-S1,normafly,sort,scen,,Positive or normative statement?,Positive 定 normative statement？,positive|normative,positive|normative,Hong Kong's statutory minimum wage started on 1 May 2011.|The minimum wage is unfair to small firms.|The Hong Kong-Zhuhai-Macao Bridge opened in 2018.|The government ought to do more to protect Chinese white dolphins.|The Octopus card was launched in 1990.|Ngong Ping 360 is the best attraction for tourists.,香港法定最低工資喺 2011 年 5 月 1 日開始實施。|最低工資對細公司唔公平。|港珠澳大橋喺 2018 年開通。|政府應該做多啲嘢保護中華白海豚。|八達通喺 1990 年推出。|昂坪 360 係最好嘅旅遊景點。,1|2|1|2|1|2,"Can it be checked against facts, even if it turns out wrong?",可唔可以用事實驗證，就算最後發現係錯？,"Positive statements can be refuted by facts (the Octopus date is wrong, it was 1997, but it is still positive). Normative statements are value judgements.",Positive statement 可以用事實驗證（八達通其實係 1997 年推出，句子錯但仍係 positive）。Normative statement 係 value judgement。
normafly-S2,normafly,mc,scen,,"(Fictional) A student writes: 'Typhoon Hato flooded Tai O in 2017, so the government should build higher sea walls.' Which is correct?",（虛構）一個學生寫：「颱風天鴿喺 2017 年令大澳水浸，所以政府應該起更高嘅防波堤。」以下邊句啱？,The first part is positive; the second part is normative|The whole sentence is positive because it contains a date|The whole sentence is normative|The first part is normative; the second part is positive,前半句係 positive；後半句係 normative|成句都係 positive，因為有日期|成句都係 normative|前半句係 normative；後半句係 positive,,,A,"Which part can be checked with records, and which part is an opinion about what ought to be done?",邊部分可以查紀錄核實？邊部分係「應該點做」嘅意見？,That Hato flooded Tai O in 2017 can be verified by facts (positive). 'Should build higher sea walls' is a value judgement (normative).,天鴿 2017 年令大澳水浸可以用事實驗證（positive）；「應該起更高防波堤」係 value judgement（normative）。
normafly-S3,normafly,tf,scen,,'The MTR Tung Chung line opened in 2005' is a normative statement because it is false.,「港鐵東涌綫喺 2005 年通車」係 normative statement，因為佢係錯嘅。,,,,,F,Does being wrong change whether a statement can be tested by facts?,句子錯咗，會唔會改變佢可唔可以用事實驗證？,"It can be refuted by facts (the line opened in 1998), so it is a positive statement. A positive statement can be wrong.",佢可以被事實推翻（東涌綫 1998 年通車），所以係 positive statement。Positive statement 可以係錯嘅。
normafly-S4,normafly,mc,scen,,(Fictional) A survey finds: '70% of visitors think Tai O is the most charming village in Hong Kong.' This statement is:,（虛構）一個調查發現：「70% 遊客認為大澳係全港最有魅力嘅漁村。」呢句係：,"positive, because the survey result can be checked|normative, because it contains an opinion|normative, because it contains a percentage|neither positive nor normative",Positive，因為調查結果可以核實|Normative，因為入面有意見|Normative，因為有百分比|兩樣都唔係,,,A,"Is the statement itself judging Tai O, or reporting what visitors said?",呢句本身係評價大澳，定係報告遊客講咗乜？,"It reports a fact about people's opinions, which can be verified by checking the survey data, so it is positive.",佢係報告「遊客點諗」呢個事實，可以翻查調查數據驗證，所以係 positive。
normafly-S5,normafly,fill,scen,,"Statement A: 'In 1963, water was supplied 4 hours every 4 days in Hong Kong.' is ____. Statement B: 'Rationing was the fairest way to share water.' is ____.",陳述 A：「1963 年，香港每 4 日供水 4 小時。」係 ①。陳述 B：「制水係分配食水最公平嘅方法。」係 ②。,positive|normative|scarce|free,positive|normative|scarce|free,,,positive|normative,Which one can be checked with historical records? Which uses the value word 'fairest'?,邊句可以用歷史紀錄核實？邊句用咗「最公平」呢類價值字眼？,"A can be verified by facts, so it is positive. B is a value judgement about fairness, so it is normative.",A 可以用事實驗證，係 positive；B 係對公平與否嘅 value judgement，係 normative。
boss_fubak-01,boss_fubak,mc,,,"Grandpa chooses to keep drying salt ($120/month) instead of factory work ($180, plus $20 fares) or fishing ($150). His opportunity cost is:",阿爺揀繼續曬鹽（每月 $120），放棄工廠打工（$180，另加車費 $20）同打魚（$150），opportunity cost 係：,$180 (factory work)|$150 (fishing)|$330 (both together)|$120 (salt),$180（工廠打工）|$150（打魚）|$330（兩樣加埋）|$120（曬鹽）,,,A,"Which two are given up? Even after fares, is the factory still highest?",放棄咗邊兩樣？就算扣埋車費，工廠仲係咪最高？,"Only the highest-valued option forgone counts. Even net of fares, the factory ($160) beats fishing ($150).",只計最高價值嘅放棄選項。就算扣埋車費，工廠淨值 $160 仍然高過打魚 $150。
boss_fubak-02,boss_fubak,fill,,,"Grandpa's father spent $3,000 building the salt pans in the 1940s. That money is a ____ cost and should not affect the decision.","阿爺嘅阿爸 1940 年代起鹽田用咗 $3,000，呢筆錢係 ① cost，唔應該影響決定。",historical|money|time|full,歷史|金錢|時間|全部,,,historical,Can that money be recovered whatever he chooses today?,嗰筆錢今日點揀都拎唔拎得返？,Historical cost is not a cost.,Historical cost 唔係 cost。
boss_fubak-03,boss_fubak,mc,,,"If Grandpa chooses factory work instead, the full cost is:",如果阿爺改揀工廠打工，full cost 係：,$170|$20|$150|$200,$170|$20|$150|$200,,,A,Money cost is the fare; non-money cost is the best alternative use of his time – which is?,Money cost 係車費；non-money cost 係佢時間嘅最佳其他用途，即係邊樣？,Money cost $20 + non-money cost $150 (best alternative use of time: fishing) = $170.,Money cost $20 + non-money cost $150（時間最佳其他用途：打魚）= $170。
boss_fubak-04,boss_fubak,tf,,,"If factory pay rises to $220, Grandpa's opportunity cost of drying salt rises.",工廠人工升到 $220，阿爺繼續曬鹽嘅 opportunity cost 會上升。,,,,,T,Is the factory the highest-valued option forgone?,工廠係咪被放棄嘅最高價值選項？,"The highest-valued option forgone became more valuable, so opportunity cost rises.",被放棄嘅最高價值選項價值上升，opportunity cost 上升。
boss_fubak-05,boss_fubak,mc,,,"Grandpa wants to borrow to buy a motorised boat. If the interest rate rises, his willingness to borrow will:",阿爺想借錢買機動船出海。利率上升，佢借錢嘅意願會：,fall|rise|stay the same|cannot be determined,下降|上升|不變|無法判斷,,,A,Does the cost of earlier availability rise or fall?,提早得到資源嘅成本變高定變低？,Higher interest rate → higher cost of earlier availability → lower willingness to borrow.,利率上升 → 提早得到資源嘅成本上升 → 借錢意願下降。
boss_fubak-06,boss_fubak,sort,,,Last question: free good or economic good?,最後一題：free good 定 economic good？,free good|economic good,免費物品|經濟物品,seawater in the ocean|sun-dried salt|sunlight|salted fish,大海嘅海水|曬好嘅鹽|陽光|鹹魚,1|2|1|2,Is the quantity enough for everyone?,數量夠唔夠滿足所有人？,Seawater and sunlight are sufficient; salt and salted fish need scarce resources.,海水同陽光數量夠晒；鹽同鹹魚要用 scarce resources 生產。
boss_hoitse-01,boss_hoitse,sort,,,Which basic economic problem does each villager proposal belong to?,村民嘅提議屬於邊個基本經濟問題？,what|how|for whom,生產咩|點生產|為誰生產,switch to vegetables or oysters|by hand or by machine|share the catch by highest bid or by seniority,改種菜定養蠔|用人手定用機器|漁獲按價高者得定按輩份分,1|2|3,"What, how, or for whom?",揀緊生產咩、點生產，定係俾邊個？,"The three problems: what, how, for whom.",三個問題：生產咩、點生產、俾邊個。
boss_hoitse-02,boss_hoitse,mc,,,Cheaper imported salt made Tai O's salt industry decline. This reflects which method?,入口鹽較平，令大澳鹽業式微，反映邊種解決方法？,market mechanism|government command|customs and traditions|barter,市場機制|政府指令|習俗與傳統|以物易物,,,A,Did anyone order salt workers to stop?,有冇人下命令叫鹽工停手？,Price signals moved resources away; no one gave orders.,價格訊號令資源流走，冇人下令。
boss_hoitse-03,boss_hoitse,order,,,Put in order:,排出次序：,,,private property rights|exchange|specialisation,私有產權|交換|專門化,,Which makes which possible?,邊個令邊個成為可能？,Clear ownership → confident exchange → confident specialisation.,業權清楚 → 放心交換 → 放心專門化。
boss_hoitse-04,boss_hoitse,sort,,,Complete the circular flow:,完成 circular flow 圖：,households→firms (factor market)|firms→households (factor market)|firms→households (product market)|households→firms (product market),住戶→廠商（生產要素市場）|廠商→住戶（生產要素市場）|廠商→住戶（產品市場）|住戶→廠商（產品市場）,factor services|factor income|goods and services|households' expenditure,生產要素服務|要素收入|物品與服務|住戶支出,1|2|3|4,"Each market: one real flow, one money flow.",每個市場一條實物、一條錢。,Each market has a real flow and a money flow going in opposite directions.,每個市場都有一條 real flow 同一條 money flow，方向相反。
boss_hoitse-05,boss_hoitse,sort,,,Villagers' remarks: positive or normative?,村民講嘅說話：positive 定 normative？,positive|normative,實證性|規範性,A road into Tai O was built in 1969–1970|Salt workers should get subsidies|Tai O's population began falling in the 1970s|Stilt houses are the most beautiful buildings|Imported salt is cheaper than local salt,1969–1970 年大澳要起公路|鹽工應該有補助|大澳人口喺 1970 年代開始下降|棚屋係最靚嘅建築|入口鹽比本地鹽平,1|2|1|2|1,Can facts refute it?,可唔可以用事實推翻？,Positive can be refuted by facts; normative is a value judgement.,Positive 可以用事實推翻；normative 係價值判斷。
boss_hoitse-06,boss_hoitse,mc,,,"With fewer yellow croakers, the fish stall switches to first come first served. This is:",黃花魚少咗，魚檔改做排隊先到先得，屬於：,non-price competition|price competition|government command|exchange,非價格競爭|價格競爭|政府指令|交換,,,A,Is price the criterion?,準則係價格嗎？,"The criterion is order of arrival, not price.",準則係時間先後，唔係價格。
hard_fubak-01,hard_fubak,dse,dse,,"(Fictional) Grandpa keeps drying salt ($120/month). He gave up factory work ($180/month, $20 monthly fares) and fishing ($150/month). As Tai O's yellow croaker catch fell, fishing income drops to $100. Explain whether his opportunity cost of drying salt changes. (3 marks)",（虛構）阿爺繼續曬鹽（每月 $120），放棄咗工廠打工（每月 $180，車費每月 $20）同打魚（每月 $150）。大澳黃花魚漁獲下跌，打魚收入跌到 $100。解釋阿爺曬鹽嘅 opportunity cost 會唔會改變。（3 分）,"Opportunity cost is the value of the highest-valued option forgone when a choice is made.|Even after the $20 fares, factory work is still the highest-valued option forgone, worth more than fishing at $150 or $100.|So the fall in fishing income does not change his opportunity cost of drying salt, which is still the value of factory work.|His opportunity cost falls from $330 to $280, because both forgone options must be added together.|His opportunity cost falls, because one of the options he gave up has become less valuable.|His opportunity cost is $120, the income he earns from drying salt.|Fishing is his opportunity cost because, unlike factory work, it needs no fares.",Opportunity cost 係作出選擇時，被放棄嘅最高價值選項嘅價值。|就算扣埋 $20 車費，工廠打工仍然係被放棄嘅最高價值選項，高過打魚嘅 $150 或 $100。|所以打魚收入下跌唔會改變佢曬鹽嘅 opportunity cost，仍然係工廠打工嘅價值。|佢嘅 opportunity cost 由 $330 跌到 $280，因為兩個被放棄嘅選項要加埋一齊計。|佢嘅 opportunity cost 下降，因為其中一個被放棄嘅選項價值下跌咗。|佢嘅 opportunity cost 係 $120，即係曬鹽賺到嘅收入。|打魚先係佢嘅 opportunity cost，因為唔似工廠打工，打魚唔使俾車費。,,,1|2|3,"Which option forgone is worth the most, before and after the change?",改變之前同之後，被放棄嘅選項之中邊個價值最高？,"1 mark for the definition (highest-valued option forgone only), 1 mark for applying it (factory work is still highest), 1 mark for the conclusion (no change). Adding options together is a classic error.",定義 1 分（只計最高價值嘅放棄選項）、應用 1 分（工廠打工仍然最高）、結論 1 分（唔變）。將選項加埋一齊係典型錯誤。
hard_fubak-02,hard_fubak,dse,dse,,"(Fictional) Grandpa decides to take the factory job ($180/month, $20 monthly fares). His other options were drying salt ($120) and fishing ($150). Calculate and explain the full cost of taking the factory job. (4 marks)",（虛構）阿爺決定出市區工廠打工（每月 $180，車費每月 $20）。佢其他選擇係曬鹽（$120）同打魚（$150）。計算並解釋揀工廠打工嘅 full cost。（4 分）,"Full cost is money cost plus non-money cost.|The money cost is the $20 monthly fare he pays to get to the factory.|The non-money cost is the best alternative use of his time: fishing at $150, which is higher than salt at $120.|So the full cost of taking the factory job is $20 + $150 = $170 per month.|The non-money cost is $270, the income from salt and fishing added together.|The full cost is $200, the factory wage plus the fares.|The fare is not a cost, because the factory wage is high enough to cover it.",Full cost = money cost + non-money cost。|Money cost 係佢每月返工要俾嘅 $20 車費。|Non-money cost 係佢時間嘅最佳其他用途：打魚 $150，高過曬鹽 $120。|所以揀工廠打工嘅 full cost 係 $20 + $150 = 每月 $170。|Non-money cost 係 $270，即係曬鹽同打魚收入加埋。|Full cost 係 $200，即係工廠人工加車費。|車費唔算 cost，因為工廠人工夠高，抵銷得到。,,,1|2|3|4,"What does Grandpa pay in money, and what is the best thing he could have done with that time?",阿爺要俾咩錢？嗰段時間佢最好可以用嚟做咩？,"Marks: formula, money cost ($20), non-money cost = best alternative use of time ($150, not $120 or $270), and the $170 total. The factory wage is the benefit of the choice, not its cost.",評分：公式、money cost（$20）、non-money cost = 時間最佳其他用途（$150，唔係 $120 或 $270），同埋總數 $170。工廠人工係選擇嘅得益，唔係 cost。
hard_fubak-03,hard_fubak,dse,dse,,"(Fictional) Last month Grandpa paid $80 for new salt rakes, which cannot be resold. Now he is thinking of switching to fishing. His grandson says: 'Switching would waste the $80, so keep drying salt.' Explain whether the grandson is correct. (2 marks)",（虛構）上個月阿爺用 $80 買咗新鹽耙，呢啲鹽耙賣唔返出去。而家佢諗緊轉去打魚。個孫話：「轉行就嘥咗嗰 $80，所以繼續曬鹽啦。」解釋個孫講得啱唔啱。（2 分）,"The $80 is a historical cost: it was spent in the past and cannot be recovered whatever Grandpa chooses now.|With no choice involved, there is no cost, so the $80 should not affect his decision and the grandson is incorrect.|The $80 should be added to the cost of switching to fishing.|The $80 should be added to the cost of continuing to dry salt.|The $80 is the opportunity cost of continuing to dry salt.|The grandson is correct, because wasting resources always raises the cost of a choice.|Even if the rakes could be resold for $50, that $50 would still be a historical cost.",嗰 $80 係 historical cost：已經喺過去用咗，而家阿爺點揀都拎唔返。|冇選擇就冇 cost，所以 $80 唔應該影響佢嘅決定，個孫講得唔啱。|嗰 $80 應該加入轉去打魚嘅 cost 度。|嗰 $80 應該加入繼續曬鹽嘅 cost 度。|嗰 $80 係繼續曬鹽嘅 opportunity cost。|個孫講得啱，因為嘥資源一定會令選擇嘅 cost 上升。|就算鹽耙可以賣返 $50，嗰 $50 都仍然係 historical cost。,,,1|2,Can the $80 be recovered whichever option Grandpa picks today?,無論阿爺今日揀邊樣，嗰 $80 拎唔拎得返？,"1 mark for identifying historical cost (spent and unrecoverable), 1 mark for 'no choice, no cost' leading to the conclusion. A resale value would be recoverable, so it would be an opportunity cost, not a historical cost.",指出 historical cost（已用咗、拎唔返）1 分；「冇選擇就冇 cost」並得出結論 1 分。如果可以轉賣，轉賣價值拎得返，就係 opportunity cost，唔係 historical cost。
hard_fubak-04,hard_fubak,dse,dse,,"(Fictional) Grandpa borrows $1,000 from Uncle Wing to buy a motorised fishing boat now, and repays $1,100 one year later. Explain what the $100 interest means to each of them. (3 marks)","（虛構）阿爺向榮叔借 $1,000，即刻買一隻機動漁船，一年後還 $1,100。解釋呢 $100 interest 對佢哋兩個分別有咩意思。（3 分）","For Grandpa, the borrower, interest is the cost of earlier availability: he gets the boat now instead of after saving up.|For Uncle Wing, the lender, interest is the compensation for postponing his consumption of $1,000 for a year.|The interest rate is $100 / $1,000 = 10% per year.|For Grandpa, interest is the compensation for postponing his consumption.|For Uncle Wing, interest is the cost of earlier availability of the boat.|The interest rate is 11%, because Grandpa repays $1,100.|Once the loan is signed, the $100 interest is a historical cost to Grandpa.","對借款人阿爺嚟講，interest 係提早得到資源嘅 cost：佢而家就有船，唔使儲夠錢先買。|對貸款人榮叔嚟講，interest 係佢延遲一年使用嗰 $1,000 嘅補償。|Interest rate 係 $100 / $1,000 = 每年 10%。|對阿爺嚟講，interest 係延遲消費嘅補償。|對榮叔嚟講，interest 係提早得到漁船嘅 cost。|Interest rate 係 11%，因為阿爺要還 $1,100。|一簽咗借據，嗰 $100 interest 對阿爺嚟講就係 historical cost。",,,1|2|3,"Who enjoys the resources earlier, and who waits?",邊個提早享用資源？邊個要等？,Borrower: cost of earlier availability. Lender: compensation for postponing consumption. Rate = interest / principal. Swapping the two roles is the common mistake.,借款人：提早得到資源嘅 cost。貸款人：延遲消費嘅補償。利率 = interest / 本金。調轉兩個角色係常見錯誤。
hard_hoitse-01,hard_hoitse,dse,dse,,"(Fictional) After WWII, cheaper imported salt competed with Tai O salt. Salt pan owners turned their pans into fish ponds without any government order. Explain which basic economic problem this solves and how. (3 marks)",（虛構）二戰後，平價入口鹽同大澳鹽競爭。鹽田主喺冇政府命令之下，將鹽田改做魚塘。解釋呢件事解決緊邊個基本經濟問題，同埋點樣解決。（3 分）,"It concerns the 'what to produce' problem: whether the land produces salt or fish.|It is solved by the market mechanism: cheaper imported salt lowered the price and profit of local salt, sending a signal.|Owners, as private property owners, voluntarily moved their resources to the more profitable use, fish ponds.|It concerns the 'how to produce' problem, because the land is now used in a different way.|It concerns the 'for whom' problem, because fish ponds decide who gets to eat fish.|It is solved by command, because the decline of the salt industry forced owners to change.|It is solved by tradition, because villagers follow what their ancestors did.",呢件事關於「生產咩」（what）問題：塊地用嚟生產鹽定魚。|佢由 market mechanism 解決：入口鹽較平，令本地鹽嘅價格同利潤下跌，發出訊號。|鹽田主作為私有產權擁有人，自願將資源轉去利潤較高嘅用途，即係魚塘。|呢件事關於「點生產」（how）問題，因為塊地而家用法唔同咗。|呢件事關於「為誰生產」（for whom）問題，因為魚塘決定邊個有魚食。|佢由 command 解決，因為鹽業式微迫使鹽田主轉變。|佢由 tradition 解決，因為村民跟返祖先嘅做法。,,,1|2|3,"Is the decision about which good, which method, or who gets it? Who gave the signal?",個決定係關於生產邊樣、用咩方法，定俾邊個？邊個發出訊號？,"1 mark for the correct problem (what), 1 mark for price as the signal, 1 mark for owners responding voluntarily. Being 'forced' by prices is not command, which requires government orders.",指出正確問題（what）1 分、價格做訊號 1 分、業主自願回應 1 分。俾價格「迫」唔等於 command，command 要有政府命令。
hard_hoitse-02,hard_hoitse,dse,dse,,"(Fictional) Ah Kei owns a fishing boat and Ah Lan owns a shrimp paste workshop, both with clear ownership. Explain how private property rights enable them to specialise. (3 marks)",（虛構）阿琦擁有一隻漁船，阿蘭擁有一間蝦醬工場，兩個業權都清清楚楚。解釋 private property rights 點樣令佢哋可以 specialise。（3 分）,"Private property rights give owners the exclusive right to use, to receive income from, and to transfer their resources.|With clear ownership, Ah Kei can confidently exchange his shrimps for Ah Lan's shrimp paste or money, without fear of seizure.|Since they can rely on exchange, each specialises in one job, fishing or making shrimp paste, and trades for the rest.|Specialisation comes first; private property rights appear only after people have specialised.|Private property rights mean the government decides who may use the boat and the workshop.|Exchange only happens when money is used, so bartering shrimps for shrimp paste is not exchange.|Private property rights let owners use their property in any way, even if it harms others.",Private property rights 俾擁有人專有使用權、專有收益權同轉讓權。|業權清楚，阿琦可以放心用佢嘅銀蝦同阿蘭交換蝦醬或者錢，唔怕俾人搶。|因為可以靠交換，佢哋各自專門做一樣嘢，打魚或者整蝦醬，其餘嘅靠交換得到。|先有 specialisation，大家專門化咗之後先出現 private property rights。|Private property rights 即係由政府決定邊個可以用隻船同間工場。|用錢先算交換，所以用銀蝦換蝦醬唔算 exchange。|Private property rights 令擁有人可以任意使用財產，就算傷害到其他人都得。,,,1|2|3,What would happen to trade if anyone could take Ah Kei's catch?,如果人人都可以攞走阿琦嘅漁獲，交易會點？,"The chain is: private property rights (1 mark) → confident exchange (1 mark) → specialisation (1 mark). Barter is also exchange, and property rights are not unlimited.",因果鏈：private property rights（1 分）→ 放心 exchange（1 分）→ specialisation（1 分）。以物易物都係 exchange，而產權唔係冇限制。
hard_hoitse-03,hard_hoitse,dse,dse,,"(Fictional) Only 30 kg of yellow croaker reach Hoi Tse's stall, but buyers want 50 kg. She can either raise the price or sell to regular customers first. Explain why competition implies discrimination here and classify each method. (4 marks)",（虛構）海姐個檔只得 30 kg 黃花魚，但買家想要 50 kg。佢可以加價，或者先賣俾熟客。解釋點解呢度 competition 意味住 discrimination，並將兩個方法分類。（4 分）,"Yellow croaker is scarce: the quantity is not enough for all buyers, so they must compete for it.|Competition implies discrimination: some criterion must be used to decide who gets the fish and who does not.|Raising the price is price competition: the buyers who are willing to pay the most get the fish.|Selling to regular customers first is non-price competition: the criterion is the relationship, not the price paid.|Selling to regular customers first is price competition, because they still pay for the fish.|Discrimination only happens when the criterion is unfair, such as a buyer's race.|If Hoi Tse does not raise the price, there is no competition among buyers.",黃花魚係 scarce：數量唔夠滿足所有買家，所以佢哋要競爭。|Competition 意味住 discrimination：一定要用某個準則決定邊個有魚、邊個冇。|加價係 price competition：願意俾最多錢嘅買家得到條魚。|先賣俾熟客係 non-price competition：準則係關係，唔係俾幾多錢。|先賣俾熟客都係 price competition，因為佢哋一樣要俾錢買魚。|要準則唔公平，例如睇買家種族，先算 discrimination。|如果海姐唔加價，買家之間就冇 competition。,,,1|2|3|4,"With not enough fish for everyone, how is the winner chosen in each method?",條魚唔夠分，兩個方法分別用咩準則揀邊個得到？,"Scarcity → competition (1), competition → discrimination by a criterion (1), price as criterion = price competition (1), any other criterion = non-price competition (1). In economics, discrimination is neutral, not necessarily unfair.",Scarcity → competition（1 分）；competition → 用準則 discrimination（1 分）；以價格做準則 = price competition（1 分）；其他準則 = non-price competition（1 分）。經濟學嘅 discrimination 係中性，唔一定唔公平。
hard_hoitse-04,hard_hoitse,dse,dse,,(Fictional) Ah Sang works in a Tai O shrimp paste factory for $150 a month and spends $30 buying shrimp paste from it. Explain these four flows using the circular flow model. (4 marks),（虛構）阿生喺大澳一間蝦醬廠打工，每月人工 $150，又用 $30 向間廠買蝦醬。用 circular flow 模型解釋呢四條流向。（4 分）,"Ah Sang's labour is a real flow of factor services from households to firms in the factor market.|His $150 wage is a money flow of factor income from firms to households in the factor market.|The shrimp paste is a real flow of goods from firms to households in the product market.|His $30 is a money flow of household expenditure from households to firms in the product market.|His wage is paid in the product market, because it comes from the factory's shrimp paste sales.|His labour is a money flow, because he is paid money for it.|The shrimp paste and the $30 flow in the same direction, as both go through the product market.",阿生嘅勞力係 real flow：factor services 喺 factor market 由 households 流去 firms。|佢嘅 $150 人工係 money flow：factor income 喺 factor market 由 firms 流去 households。|蝦醬係 real flow：物品喺 product market 由 firms 流去 households。|佢嘅 $30 係 money flow：household expenditure 喺 product market 由 households 流去 firms。|佢嘅人工喺 product market 支付，因為錢嚟自間廠賣蝦醬嘅收入。|佢嘅勞力係 money flow，因為佢做嘢有錢收。|蝦醬同 $30 流向一樣，因為兩樣都經過 product market。,,,1|2|3|4,For each flow: real or money? Which market? Which direction?,每條流向：real 定 money？邊個市場？咩方向？,"1 mark per flow, each needing real or money, the correct market and the correct direction. In each market the real flow and the money flow go in opposite directions.",每條流向 1 分，要講啱 real 定 money、邊個市場同方向。每個市場入面，real flow 同 money flow 方向相反。

</script>
<script>
const META = {"mons": [{"id": "wantlet", "en": "Wantlet", "zh": "慾望寄居蟹", "proto": "寄居蟹", "concept": "unlimited wants、limited resources", "ch": 1, "zone": "beach", "loc": "沙灘", "definition": "人嘅 wants 係無限，但資源（時間、土地、勞力、資本）係有限。", "tier": "basic", "atk": 40, "dfn": 70, "hp": 50}, {"id": "scarcroaker", "en": "Scarcroaker", "zh": "稀缺黃花", "proto": "大黃魚（黃花魚）", "concept": "scarcity", "ch": 1, "zone": "beach", "loc": "沙灘近岸", "definition": "Scarcity arises when limited resources are insufficient to satisfy unlimited human wants.", "tier": "rare", "atk": 60, "dfn": 55, "hp": 85}, {"id": "choicefin", "en": "Choicefin", "zh": "抉擇魚", "proto": "鯔魚（烏頭）", "concept": "choice", "ch": 1, "zone": "mud", "loc": "紅樹林", "definition": "Choice is the process of deciding which wants to satisfy and which to give up, given limited resources.", "tier": "basic", "atk": 55, "dfn": 40, "hp": 60}, {"id": "oppcostra", "en": "Oppcostra", "zh": "機會成本鱟", "proto": "中華鱟", "concept": "opportunity cost", "ch": 1, "zone": "salt", "loc": "鹽田", "definition": "Opportunity cost refers to the value of the highest-valued option forgone (or the best alternative forgone).", "tier": "rare", "atk": 65, "dfn": 75, "hp": 70}, {"id": "fullcrab", "en": "Fullcrab", "zh": "全成本蟹", "proto": "招潮蟹", "concept": "full cost", "ch": 1, "zone": "reed", "loc": "棚屋區（西）", "definition": "Full cost = money cost + non-money cost。Money cost 係所揀選項嘅金錢開支；non-money cost 係所用非金錢資源（例如時間）嘅最佳其他用途嘅價值。", "tier": "rare", "atk": 80, "dfn": 75, "hp": 55}, {"id": "tickmud", "en": "Tickmud", "zh": "時鐘彈塗魚", "proto": "彈塗魚", "concept": "time cost", "ch": 1, "zone": "mud", "loc": "紅樹林", "definition": "Time cost is the value of the best alternative use of time。Time cost 因人而異。", "tier": "basic", "atk": 60, "dfn": 45, "hp": 60}, {"id": "shiftide", "en": "Shiftide", "zh": "潮變蝦", "proto": "沙蝦", "concept": "changes in opportunity cost", "ch": 1, "zone": "reed", "loc": "棚屋區（西）", "definition": "被放棄最高價值選項嘅價值、被揀選項所用嘅錢同時間改變 → opportunity cost 改變；被揀選項本身嘅價值、選項風險 → 唔影響；第三選項只有取代最高價值選項時先影響。", "tier": "epic", "atk": 90, "dfn": 60, "hp": 80}, {"id": "sunkshell", "en": "Sunkshell", "zh": "沉沒蚶", "proto": "泥蚶", "concept": "no choice no cost、historical cost", "ch": 1, "zone": "salt", "loc": "鹽田舊水閘", "definition": "No choice implies no cost。Historical cost is not a cost：已經付咗、無論點揀都拎唔返。", "tier": "epic", "atk": 50, "dfn": 100, "hp": 90}, {"id": "saltling", "en": "Saltling", "zh": "鹽精", "proto": "鹵蟲（鹽水蝦）", "concept": "economic good 對 free good", "ch": 1, "zone": "salt", "loc": "鹽田", "definition": "Economic good：數量唔夠滿足所有人、more is preferred、人願意付價錢競爭、有 production cost。Free good：數量夠滿足所有人、more is not preferred、冇人願意俾錢、冇 production cost。", "tier": "rare", "atk": 70, "dfn": 60, "hp": 75}, {"id": "interoyster", "en": "Interoyster", "zh": "利息蠔", "proto": "蠔", "concept": "interest", "ch": 1, "zone": "reed", "loc": "棚屋碼頭", "definition": "因為人冇耐性，願意付 premium 提早得到物品。借方：interest 係提早得到資源嘅成本；貸方：interest 係延遲消費嘅補償。可以用 real goods 或 money 表示。利率上升 → 借錢意願下降、儲蓄意願上升、現在消費減少、將來消費增加。", "tier": "rare", "atk": 40, "dfn": 100, "hp": 70}, {"id": "tripliq", "en": "Tripliq", "zh": "三問鷺", "proto": "小白鷺", "concept": "three basic economic problems", "ch": 2, "zone": "plaza", "loc": "關帝古廟前", "definition": "What to produce（生產咩、幾多）、how to produce（用咩生產方法）、for whom to produce（用咩準則決定邊個享用）。", "tier": "basic", "atk": 70, "dfn": 40, "hp": 55}, {"id": "tradiphin", "en": "Tradiphin", "zh": "傳統白海豚", "proto": "中華白海豚", "concept": "traditional economy", "ch": 2, "zone": "pier", "loc": "海邊觀景台", "definition": "A traditional economy mainly uses customs and traditions to solve the three basic economic problems。", "tier": "rare", "atk": 75, "dfn": 60, "hp": 80}, {"id": "commandra", "en": "Commandra", "zh": "指令鳶", "proto": "黑鳶（麻鷹）", "concept": "planned economy", "ch": 2, "zone": "plaza", "loc": "舊警署前", "definition": "A planned economy (or command economy) mainly uses government commands to solve the three basic economic problems。資源主要由 the state 擁有，決策主要由政府做。", "tier": "rare", "atk": 95, "dfn": 45, "hp": 70}, {"id": "marketail", "en": "Marketail", "zh": "市場斑", "proto": "石斑", "concept": "market economy", "ch": 2, "zone": "crowd", "loc": "大澳街市", "definition": "A market economy mainly uses the market mechanism (or price system) to solve the three basic economic problems。Market price 係分配資源嘅訊號；資源主要由私人擁有。", "tier": "rare", "atk": 70, "dfn": 70, "hp": 80}, {"id": "deedtle", "en": "Deedtle", "zh": "業權龜", "proto": "綠海龜", "concept": "private property rights", "ch": 2, "zone": "pier", "loc": "大澳碼頭", "definition": "Private property rights refer to the exclusive right to use, the exclusive right to receive income from, and the right to transfer a private property。", "tier": "legendary", "atk": 65, "dfn": 100, "hp": 100}, {"id": "swapgull", "en": "Swapgull", "zh": "交換鷗", "proto": "黑尾鷗", "concept": "exchange、specialisation", "ch": 2, "zone": "crowd", "loc": "大澳街市", "definition": "Exchange can take place with or without the use of money（barter）。Specialisation：不同人或經濟體專注生產不同物品或同一物品嘅不同生產階段。Private property rights enable exchange；exchange enables specialisation。", "tier": "basic", "atk": 65, "dfn": 45, "hp": 60}, {"id": "queuepus", "en": "Queuepus", "zh": "排隊八爪魚", "proto": "八爪魚", "concept": "competition、discrimination", "ch": 2, "zone": "crowd", "loc": "大澳街市", "definition": "Scarcity → competition → discrimination。Competition 決定邊個得到物品同得到幾多；輸咗嘅人被 discriminated against。Price competition 以價格做準則；non-price competition 用其他準則。", "tier": "rare", "atk": 85, "dfn": 50, "hp": 75}, {"id": "triactiv", "en": "Triactiv", "zh": "三活蝦醬精", "proto": "銀蝦", "concept": "production、exchange、consumption", "ch": 2, "zone": "yard", "loc": "蝦醬曬場", "definition": "Production：turning inputs into output；exchange：買賣或以物易物；consumption：the activity to satisfy human wants directly。Firms 係 production units，households 係 consumption units。", "tier": "basic", "atk": 55, "dfn": 40, "hp": 65}, {"id": "flowray", "en": "Flowray", "zh": "循環鯆魚", "proto": "鯆魚", "concept": "circular flow", "ch": 2, "zone": "pier", "loc": "大澳碼頭", "definition": "Households 喺 factor market 提供 factor services，收取 factor income；firms 喺 product market 提供 goods and services，收取 households' expenditure。Real flow：factor services、goods and services；money flow：money income、money expenditure。", "tier": "legendary", "atk": 95, "dfn": 80, "hp": 100}, {"id": "normafly", "en": "Normafly", "zh": "判斷蜻蜓", "proto": "蜻蜓", "concept": "positive 對 normative statements", "ch": 2, "zone": "plaza", "loc": "關帝古廟前", "definition": "Positive statements are statements about facts. They can be refuted by facts。Normative statements are statements about value judgements. They cannot be refuted by facts。", "tier": "basic", "atk": 80, "dfn": 30, "hp": 45}], "duels": [["oppcostra", "fullcrab", [["only the highest-valued option forgone", "只計放棄咗嘅最高價值選項", 0], ["= money cost + non-money cost", "= money cost + non-money cost", 1], ["chose to study, gave up $50 cargo work", "揀咗溫書，放棄搬貨 $50", 0], ["$20 fare plus the value of travel time", "車費 $20 加車程時間嘅價值", 1]]], ["wantlet", "scarcroaker", [["human desires never end", "人嘅慾望冇盡頭", 0], ["limited resources can't satisfy unlimited wants", "有限資源唔夠滿足無限 wants", 1], ["hermit crab wants an even bigger shell", "寄居蟹換咗大殼又想要更大", 0], ["not enough yellow croaker for everyone", "黃花魚漁獲唔夠所有人食", 1]]], ["tickmud", "sunkshell", [["value of the best alternative use of time", "時間嘅最佳其他用途嘅價值", 0], ["money already paid that can't be recovered", "已經付咗、拎唔返嘅錢", 1], ["boat owner queuing gives up $300", "船主排隊一個鐘，放棄 $300", 0], ["cost of building the salt pans years ago", "當年起鹽田嘅建造費", 1]]], ["commandra", "marketail", [["government sets output", "政府規定產量", 0], ["price acts as the signal", "價格做訊號", 1], ["resources mainly owned by the state", "資源主要由 the state 擁有", 0], ["resources mainly owned by private individuals", "資源主要由私人擁有", 1]]], ["swapgull", "deedtle", [["focus on different goods, then exchange", "專注生產唔同物品再交換", 0], ["exclusive right to use", "專有使用權", 1], ["trading salt for rice", "鹽換米", 0], ["can sell the fishing boat", "可以將漁船賣俾人", 1]]], [ /* ============ pixel art helpers ============ */
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function outline(c,x,col){const w=c.width,h=c.height;const im=x.getImageData(0,0,w,h),d=im.data;for(let i=3;i<d.length;i+=4)d[i]=d[i]>110?255:0;const A=(X,Y)=>X<0||Y<0||X>=w||Y>=h?0:d[(Y*w+X)*4+3];const out=[];for(let y=0;y<h;y++)for(let X=0;X<w;X++)if(!A(X,y)&&(A(X-1,y)||A(X+1,y)||A(X,y-1)||A(X,y+1)))out.push((y*w+X)*4);const [r,g,b]=col;for(const o of out){d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255;}x.putImageData(im,0,0);}
function draw(x){return{E:(a,b,rx,ry,col)=>{x.fillStyle=col;x.beginPath();x.ellipse(a,b,Math.max(.5,rx),Math.max(.5,ry),0,0,Math.PI*2);x.fill();},P:(pts,col)=>{x.fillStyle=col;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();},Ln:(pts,w,col)=>{x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();},Rc:(a,b,w,h,col)=>R(x,a,b,w,h,col)};}

function flw(x,fx,fy,col){R(x,fx-1,fy,3,1,col);R(x,fx,fy-1,1,3,col);R(x,fx,fy,1,1,'#fff4b0');R(x,fx,fy+2,1,2,'#4f9a40');}

/* ============ music (generated, no files) ============ */
const MUSIC=(()=>{let ac=null,master=null,dly=null,nb=null,timer=null,step=0,next=0,mode='town',on=false;
 const N=n=>440*Math.pow(2,(n-69)/12);
 const SONGS={town:{bpm:76,ch:[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],sc:[72,74,76,79,81,84],p:.3},battle:{bpm:98,ch:[[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,64]],sc:[69,72,74,76,79,81],p:.45}};
 function init(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.3;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;master.connect(lp);lp.connect(ac.destination);
  dly=ac.createDelay();dly.delayTime.value=.34;const fb=ac.createGain();fb.gain.value=.3;const dg=ac.createGain();dg.gain.value=.3;dly.connect(fb);fb.connect(dly);dly.connect(dg);dg.connect(master);
  nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
 function tone(f,t,dur,type,vol,att,echo){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);if(echo)g.connect(dly);o.start(t);o.stop(t+dur+.05);}
 function noise(t,dur,vol,hp){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
 function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);}
 function sched(){if(!on)return;const so=SONGS[mode];const q=60/so.bpm/4;
  while(next<ac.currentTime+.2){const s=step%16,bar=Math.floor(step/16)%4,ch=so.ch[bar];
   if(s===0){ch.forEach(n=>{tone(N(n),next,q*16,'triangle',.035,.35);tone(N(n)*1.005,next,q*16,'sine',.025,.5);});tone(N(ch[0]-12),next,q*7,'sine',.14,.02);}
   if(s===8)tone(N(ch[2]-12),next,q*7,'sine',.11,.02);
   if(s===0||s===10)kick(next);if(s===4||s===12)noise(next,.1,.05,1500);if(s%2===0)noise(next,.025,mode==='battle'?.03:.018,7000);if(s%4===0)noise(next,.4,.004,300);
   const r=Math.sin((step+1)*12.9898+bar)*43758.5453,fr=r-Math.floor(r);if(s%2===0&&fr<so.p){const note=so.sc[Math.floor(fr*997)%so.sc.length];tone(N(note),next,q*3,'sine',.06,.01,true);}
   next+=q*(s%2===0?1.1:.9);step++;}}
 return {start(){try{if(!ac)init();ac.resume();if(on)return;on=true;next=ac.currentTime+.1;timer=setInterval(sched,40);}catch(e){}},stop(){on=false;clearInterval(timer);if(ac)ac.suspend();},mode(m){mode=m;},get on(){return on;}};})();

addEventListener('pointerdown',firstGesture,true);addEventListener('keydown',firstGesture,true);
syncMusicBtn();

function loop(){G.tick++;for(let i=G.timers.length-1;i>=0;i--){if(--G.timers[i].t<=0){const r=G.timers[i].r;G.timers.splice(i,1);r();}}
 if(G.flash>0)G.flash--;if(G.B){const B=G.B;B.mHpD+=(curHP()-B.mHpD)*.12;B.eHPD+=(B.eHP-B.eHPD)*.15;if(B.eShake)B.eShake--;if(B.mShake)B.mShake--;}
 G.floats.forEach(f=>{f.y-=.35;f.life--;});G.floats=G.floats.filter(f=>f.life>0);

 makeTiles();makeMons();BUILD.forEach(b=>b.img=b.mk());BOATS.forEach(b=>b.img=bBoat(b.ferry));requestAnimationFrame(loop);await ensureLogin();runScript(titleFlow);}
