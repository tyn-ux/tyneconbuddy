<script>
const META = {"mons": [{"id": "wantlet", "en": "Wantlet", "zh": "慾望寄居蟹", "proto": "寄居蟹", "concept": "unlimited wants、limited resources", "ch": 1, "zone": "beach", "loc": "沙灘", "definition": "人嘅 wants 係無限，但資源（時間、土地、勞力、資本）係有限。", "tier": "basic", "atk": 40, "dfn": 70, "hp": 50}, {"id": "scarcroaker", "en": "Scarcroaker", "zh": "稀缺黃花", "proto": "大黃魚（黃花魚）", "concept": "scarcity", "ch": 1, "zone": "beach", "loc": "沙灘近岸", "definition": "Scarcity arises when limited resources are insufficient to satisfy unlimited human wants.", "tier": "rare", "atk": 60, "dfn": 55, "hp": 85}, {"id": "choicefin", "en": "Choicefin", "zh": "抉擇魚", "proto": "鯔魚（烏頭）", "concept": "choice", "ch": 1, "zone": "mud", "loc": "紅樹林", "definition": "Choice is the process of deciding which wants to satisfy and which to give up, given limited resources.", "tier": "basic", "atk": 55, "dfn": 40, "hp": 60}, {"id": "oppcostra", "en": "Oppcostra", "zh": "機會成本鱟", "proto": "中華鱟", "concept": "opportunity cost", "ch": 1, "zone": "salt", "loc": "鹽田", "definition": "Opportunity cost refers to the value of the highest-valued option forgone (or the best alternative forgone).", "tier": "rare", "atk": 65, "dfn": 75, "hp": 70}, {"id": "fullcrab", "en": "Fullcrab", "zh": "全成本蟹", "proto": "招潮蟹", "concept": "full cost", "ch": 1, "zone": "reed", "loc": "棚屋區（西）", "definition": "Full cost = money cost + non-money cost。Money cost 係所揀選項嘅金錢開支；non-money cost 係所用非金錢資源（例如時間）嘅最佳其他用途嘅價值。", "tier": "rare", "atk": 80, "dfn": 75, "hp": 55}, {"id": "tickmud", "en": "Tickmud", "zh": "時鐘彈塗魚", "proto": "彈塗魚", "concept": "time cost", "ch": 1, "zone": "mud", "loc": "紅樹林", "definition": "Time cost is the value of the best alternative use of time。Time cost 因人而異。", "tier": "basic", "atk": 60, "dfn": 45, "hp": 60}, {"id": "shiftide", "en": "Shiftide", "zh": "潮變蝦", "proto": "沙蝦", "concept": "changes in opportunity cost", "ch": 1, "zone": "reed", "loc": "棚屋區（西）", "definition": "被放棄最高價值選項嘅價值、被揀選項所用嘅錢同時間改變 → opportunity cost 改變；被揀選項本身嘅價值、選項風險 → 唔影響；第三選項只有取代最高價值選項時先影響。", "tier": "epic", "atk": 90, "dfn": 60, "hp": 80}, {"id": "sunkshell", "en": "Sunkshell", "zh": "沉沒蚶", "proto": "泥蚶", "concept": "no choice no cost、historical cost", "ch": 1, "zone": "salt", "loc": "鹽田舊水閘", "definition": "No choice implies no cost。Historical cost is not a cost：已經付咗、無論點揀都拎唔返。", "tier": "epic", "atk": 50, "dfn": 100, "hp": 90}, {"id": "saltling", "en": "Saltling", "zh": "鹽精", "proto": "鹵蟲（鹽水蝦）", "concept": "economic good 對 free good", "ch": 1, "zone": "salt", "loc": "鹽田", "definition": "Economic good：數量唔夠滿足所有人、more is preferred、人願意付價錢競爭、有 production cost。Free good：數量夠滿足所有人、more is not preferred、冇人願意俾錢、冇 production cost。", "tier": "rare", "atk": 70, "dfn": 60, "hp": 75}, {"id": "interoyster", "en": "Interoyster", "zh": "利息蠔", "proto": "蠔", "concept": "interest", "ch": 1, "zone": "reed", "loc": "棚屋碼頭", "definition": "因為人冇耐性，願意付 premium 提早得到物品。借方：interest 係提早得到資源嘅成本；貸方：interest 係延遲消費嘅補償。可以用 real goods 或 money 表示。利率上升 → 借錢意願下降、儲蓄意願上升、現在消費減少、將來消費增加。", "tier": "rare", "atk": 40, "dfn": 100, "hp": 70}, {"id": "tripliq", "en": "Tripliq", "zh": "三問鷺", "proto": "小白鷺", "concept": "three basic economic problems", "ch": 2, "zone": "plaza", "loc": "關帝古廟前", "definition": "What to produce（生產咩、幾多）、how to produce（用咩生產方法）、for whom to produce（用咩準則決定邊個享用）。", "tier": "basic", "atk": 70, "dfn": 40, "hp": 55}, {"id": "tradiphin", "en": "Tradiphin", "zh": "傳統白海豚", "proto": "中華白海豚", "concept": "traditional economy", "ch": 2, "zone": "pier", "loc": "海邊觀景台", "definition": "A traditional economy mainly uses customs and traditions to solve the three basic economic problems。", "tier": "rare", "atk": 75, "dfn": 60, "hp": 80}, {"id": "commandra", "en": "Commandra", "zh": "指令鳶", "proto": "黑鳶（麻鷹）", "concept": "planned economy", "ch": 2, "zone": "plaza", "loc": "舊警署前", "definition": "A planned economy (or command economy) mainly uses government commands to solve the three basic economic problems。資源主要由 the state 擁有，決策主要由政府做。", "tier": "rare", "atk": 95, "dfn": 45, "hp": 70}, {"id": "marketail", "en": "Marketail", "zh": "市場斑", "proto": "石斑", "concept": "market economy", "ch": 2, "zone": "crowd", "loc": "大澳街市", "definition": "A market economy mainly uses the market mechanism (or price system) to solve the three basic economic problems。Market price 係分配資源嘅訊號；資源主要由私人擁有。", "tier": "rare", "atk": 70, "dfn": 70, "hp": 80}, {"id": "deedtle", "en": "Deedtle", "zh": "業權龜", "proto": "綠海龜", "concept": "private property rights", "ch": 2, "zone": "pier", "loc": "大澳碼頭", "definition": "Private property rights refer to the exclusive right to use, the exclusive right to receive income from, and the right to transfer a private property。", "tier": "legendary", "atk": 65, "dfn": 100, "hp": 100}, {"id": "swapgull", "en": "Swapgull", "zh": "交換鷗", "proto": "黑尾鷗", "concept": "exchange、specialisation", "ch": 2, "zone": "crowd", "loc": "大澳街市", "definition": "Exchange can take place with or without the use of money（barter）。Specialisation：不同人或經濟體專注生產不同物品或同一物品嘅不同生產階段。Private property rights enable exchange；exchange enables specialisation。", "tier": "basic", "atk": 65, "dfn": 45, "hp": 60}, {"id": "queuepus", "en": "Queuepus", "zh": "排隊八爪魚", "proto": "八爪魚", "concept": "competition、discrimination", "ch": 2, "zone": "crowd", "loc": "大澳街市", "definition": "Scarcity → competition → discrimination。Competition 決定邊個得到物品同得到幾多；輸咗嘅人被 discriminated against。Price competition 以價格做準則；non-price competition 用其他準則。", "tier": "rare", "atk": 85, "dfn": 50, "hp": 75}, {"id": "triactiv", "en": "Triactiv", "zh": "三活蝦醬精", "proto": "銀蝦", "concept": "production、exchange、consumption", "ch": 2, "zone": "yard", "loc": "蝦醬曬場", "definition": "Production：turning inputs into output；exchange：買賣或以物易物；consumption：the activity to satisfy human wants directly。Firms 係 production units，households 係 consumption units。", "tier": "basic", "atk": 55, "dfn": 40, "hp": 65}, {"id": "flowray", "en": "Flowray", "zh": "循環鯆魚", "proto": "鯆魚", "concept": "circular flow", "ch": 2, "zone": "pier", "loc": "大澳碼頭", "definition": "Households 喺 factor market 提供 factor services，收取 factor income；firms 喺 product market 提供 goods and services，收取 households' expenditure。Real flow：factor services、goods and services；money flow：money income、money expenditure。", "tier": "legendary", "atk": 95, "dfn": 80, "hp": 100}, {"id": "normafly", "en": "Normafly", "zh": "判斷蜻蜓", "proto": "蜻蜓", "concept": "positive 對 normative statements", "ch": 2, "zone": "plaza", "loc": "關帝古廟前", "definition": "Positive statements are statements about facts. They can be refuted by facts。Normative statements are statements about value judgements. They cannot be refuted by facts。", "tier": "basic", "atk": 80, "dfn": 30, "hp": 45}, {"id": "bobbinix", "en": "Bobbinix", "zh": "線轆精", "proto": "車衣線轆", "concept": "goods vs services、consumer vs producer goods", "ch": 3, "zone": "fabric", "loc": "布行街", "definition": "Goods 係有形（tangible），services 係無形（intangible）。按用途分：直接滿足 wants 嘅係 consumer goods；用嚟生產其他物品嘅係 producer（capital）goods，同一件物品可以兩樣都係。", "tier": "basic", "atk": 45, "dfn": 55, "hp": 60}, {"id": "rivalrow", "en": "Rivalrow", "zh": "爭食麻雀", "proto": "樹麻雀", "concept": "private goods vs public goods", "ch": 3, "zone": "roof", "loc": "唐樓天台", "definition": "Private goods：rival（一個人用咗會減少其他人可用嘅數量）同 excludable（排除唔俾錢嘅人成本唔高）。Public goods：non-rival 同 non-excludable。分類睇性質，唔係睇邊個提供、收唔收錢。", "tier": "rare", "atk": 75, "dfn": 55, "hp": 70}, {"id": "silkstage", "en": "Silkstage", "zh": "三產蠶", "proto": "家蠶", "concept": "primary、secondary、tertiary production", "ch": 3, "zone": "fabric", "loc": "布行街", "definition": "Primary production 直接由大自然攞資源；secondary production 將原料變成半製成品或製成品（包括建造）；tertiary production 提供服務。", "tier": "basic", "atk": 40, "dfn": 60, "hp": 65}, {"id": "antsembly", "en": "Antsembly", "zh": "分工蟻", "proto": "螞蟻", "concept": "simple、complex、regional division of labour", "ch": 3, "zone": "factory", "loc": "長沙灣工廠", "definition": "Simple：唔同工人專門生產唔同物品；complex：唔同工人專門做同一物品嘅唔同工序；regional：唔同地區專門生產唔同物品或工序。", "tier": "rare", "atk": 70, "dfn": 65, "hp": 70}, {"id": "sewtron", "en": "Sewtron", "zh": "衣車獸", "proto": "衣車（縫紉機）", "concept": "advantages, disadvantages and limits of division of labour", "ch": 3, "zone": "factory", "loc": "長沙灣工廠", "definition": "好處：提高 labour productivity（善用 capital、揀最合適嘅人、熟能生巧、慳轉工序時間、慳訓練時間、促進機械化）同改善生活水平。壞處：沉悶、失去工作滿足感、失業風險、互相依賴、產品過度標準化。限制：產品性質（要創意）、市場太細。", "tier": "epic", "atk": 90, "dfn": 70, "hp": 80}, {"id": "factorgeck", "en": "Factorgeck", "zh": "要素壁虎", "proto": "壁虎", "concept": "four factors of production and their returns", "ch": 4, "zone": "lane", "loc": "唐樓後巷", "definition": "Labour（wages）、capital（interest）、land（rent）、entrepreneurship（profits）。Land 創造冇成本但使用有成本，供應唔可以靠人力增加但唔係固定。Capital formation > capital depreciation → capital accumulation。", "tier": "legendary", "atk": 85, "dfn": 90, "hp": 100}, {"id": "hourat", "en": "Hourat", "zh": "工時鼠", "proto": "溝鼠", "concept": "labour supply", "ch": 4, "zone": "lane", "loc": "唐樓後巷", "definition": "Labour supply = 總工作時數（man-hours）= 工人數目 × 每人平均工作時數，唔係以人頭計。", "tier": "basic", "atk": 60, "dfn": 40, "hp": 60}, {"id": "webrate", "en": "Webrate", "zh": "效率蜘蛛", "proto": "家隅蛛", "concept": "labour productivity", "ch": 4, "zone": "lane", "loc": "唐樓後巷", "definition": "Labour productivity = total output ÷ total number of working hours（每工時產量），唔係每個工人嘅產量。", "tier": "rare", "atk": 85, "dfn": 50, "hp": 70}, {"id": "hopcat", "en": "Hopcat", "zh": "流動貓", "proto": "唐樓街貓", "concept": "occupational vs geographical mobility of labour", "ch": 4, "zone": "roof", "loc": "唐樓天台", "definition": "Occupational mobility：轉職業嘅意願同容易程度；geographical mobility：轉工作地點嘅意願同容易程度。", "tier": "basic", "atk": 70, "dfn": 45, "hp": 55}, {"id": "paymyna", "en": "Paymyna", "zh": "工資八哥", "proto": "八哥", "concept": "wage payment methods", "ch": 4, "zone": "fabric", "loc": "布行街", "definition": "Piece rate（按件）、time rate（按時間）、commission（銷售收入嘅一部分）、profit-sharing（利潤嘅一部分）、tips（客人俾嘅打賞）。", "tier": "rare", "atk": 80, "dfn": 50, "hp": 65}, {"id": "runtle", "en": "Runtle", "zh": "長短龜", "proto": "巴西龜", "c function buildBank(text){text=text.replace(/^﻿/,'');const rows=parseCSV(text.trim());const head=rows.shift().map(h=>h.trim().toLowerCase());const ix=k=>head.indexOf(k);const bank={};let n=0;const sp=s=>s?s.split('|').map(x=>x.trim()):[];

 return n?bank:null;}

function worldUpdate(){const P=G.p;

 const held=keys.up?'up':keys.down?'down':keys.left?'left':keys.right?'right':null;const tap=pressed.up?'up':pressed.down?'down':pressed.left?'left':pressed.right?'right':null;

 const d=held||tap;if(!d)return;P.dir=d;const [dx,dy]=DIRS[d];const nx=P.x+dx,ny=P.y+dy;const door=DOORS[nx+','+ny];if(door){runScript(()=>doorFlow(door));return;}

 if(G.flash>0)G.flash--;if(G.B){const B=G.B;B.mHpD=curHP();B.eHPD=B.eHP;if(B.eShake)B.eShake--;if(B.mShake)B.mShake--;}
 G.floats.forEach(f=>{f.y-=.35;f.life--;});G.floats=G.floats.filter(f=>f.life>0);
 if(!G.modal){if(UI.kind)updateUI();else if(G.mode==='world')worldUpdate();}
 render();pressed={};requestAnimationFrame(loop);}
async function boot(){try{await Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('700 10px "Noto Sans HK"','經濟獸大澳篇慾望寄居蟹稀缺黃花抉擇魚機會成本鱟全成本蟹時鐘彈塗魚潮變蝦沉沒蚶鹽精利息蠔三問鷺傳統白海豚指令鳶市場斑業權龜交換鷗排隊八爪魚三活蝦醬精循環鯆魚判斷蜻蜓福伯墟市海姐理解')]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
 makeTiles();makeMons();setRegion('taio');requestAnimationFrame(loop);await ensureLogin();runScript(titleFlow);}
boot();
})();
