saltling-12,saltling,fill,,,"Providing a free good does not use ____ resources, so it has no production cost.",提供 free good 唔需要用 ① resources，所以冇 production cost。,scarce|free|human|natural,稀少|免費|人力|天然,,,scarce,What kind of resources does an economic good use?,生產 economic good 要用邊種資源？,A free good does not use scarce resources with alternative uses.,Free good 唔使用有其他用途嘅 scarce resources。
saltling-S1,saltling,sort,scen,,Economic good or free good?,Economic good 定 free good？,economic good|free good,economic good|free good,Sunlight on a beach at Big Wave Bay|Free newspapers handed out at an MTR station|Air on a Lantau hiking trail|A free flu vaccine given by the government|Seawater in the open sea off Lantau|Bottled water sold at Ngong Ping,大浪灣沙灘上嘅陽光|港鐵站派嘅免費報紙|大嶼山行山徑上嘅空氣|政府免費提供嘅流感疫苗|大嶼山對開大海嘅海水|昂坪賣嘅樽裝水,2|1|2|1|2|1,Is the quantity enough for everyone's wants without using scarce resources to produce it?,數量係咪夠晒所有人要，而且唔使用 scarce resources 去生產？,"A free good is sufficient to satisfy all wants and has no production cost. Items given free of charge still use scarce resources, so they are economic goods.",Free good 數量足以滿足所有 wants，冇生產成本。免費派嘅嘢仍然用咗 scarce resources，所以係 economic goods。
saltling-S2,saltling,mc,scen,,(Fictional) A hotel in Tsim Sha Tsui gives guests Wi-Fi without charge. The Wi-Fi is:,（虛構）尖沙咀一間酒店俾住客免費用 Wi-Fi。呢個 Wi-Fi 係：,"an economic good, because providing it uses scarce resources|a free good, because guests pay nothing|a free good, because it is plentiful|neither kind of good",economic good，因為提供佢要用 scarce resources|free good，因為住客唔使俾錢|free good，因為好充足|兩樣都唔係,,,A,Does the hotel need equipment and staff to provide it?,酒店要唔要用設備同人手去提供？,"Whether a good is free depends on scarcity, not price. Providing Wi-Fi has a production cost, so it is an economic good.",係咪 free good 睇 scarcity，唔係睇價錢。提供 Wi-Fi 有生產成本，所以係 economic good。
saltling-S3,saltling,tf,scen,,"In 1963, Hong Kong's water supply was cut to 4 hours every 4 days. Fresh water in Hong Kong at that time was a free good.",1963 年，香港制水至每 4 日供水 4 個鐘。當時香港嘅淡水係 free good。,,,,,F,Was the quantity of fresh water enough to satisfy everyone's wants?,當時淡水數量夠唔夠滿足所有人嘅 wants？,"A free good must be sufficient to satisfy all wants. Water was rationed, so it was scarce: an economic good.",Free good 一定要夠滿足所有 wants。當時要制水，即係 scarce，所以係 economic good。
saltling-S4,saltling,mc,scen,,(Fictional) Sand on a remote Lantau beach is a free good. Which change would most likely make it an economic good?,（虛構）大嶼山一個偏僻沙灘嘅沙係 free good。以下邊個變化最有可能令佢變成 economic good？,"Builders want huge amounts, so it must be dug and transported and is no longer enough for all wants|The government says it is free of charge|A few more hikers walk on it|It appears in a travel photo",建築商要大量用，要挖要運，數量唔再夠滿足所有 wants|政府話佢免費|多咗幾個行山客行過|佢出現喺一張旅遊相入面,,,A,What condition must hold for a good to be free?,一樣嘢要係 free good，要符合咩條件？,"Once the quantity is insufficient to satisfy all wants and scarce resources are used to provide it, it becomes an economic good.",當數量唔夠滿足所有 wants，而且要用 scarce resources 去提供，就變成 economic good。
saltling-S5,saltling,fill,scen,,"(Fictional) A Tai O stall gives out free shrimp-paste samples. The samples are an ____ good, because making them uses ____ resources.",（虛構）大澳一個檔口免費派蝦醬試食。試食品係 ① good，因為製造佢哋要用 ② resources。,economic|scarce|free|unlimited,economic|scarce|free|unlimited,,,economic|scarce,A zero price does not decide the answer. What is used to make the samples?,唔使錢唔代表答案。整試食品用咗咩？,"Production uses scarce resources with alternative uses, so there is a cost: it is an economic good even though it is given free of charge.",生產用咗有其他用途嘅 scarce resources，所以有成本：雖然免費派，仍然係 economic good。
interoyster-01,interoyster,tf,,,People are willing to pay interest because they are impatient and want goods earlier.,人願意付利息，係因為人冇耐性，想早啲得到物品。,,,,,T,Would you rather have it now or in a year?,你寧願而家有，定一年後有？,Textbook: people are impatient.,課本：people are impatient。
interoyster-02,interoyster,tf,,,"For a borrower, interest is the compensation for postponing consumption.",對借方嚟講，利息係延遲消費嘅補償。,,,,,F,"Who postpones consumption, the borrower or the lender?",延遲消費嘅係借方定貸方？,"That is the lender's view. For a borrower, interest is the cost of earlier availability.",呢個係貸方嘅角度。借方付嘅係提早得到資源嘅成本。
interoyster-03,interoyster,mc,,,(Fictional) A fisherman borrows money to buy a motorised boat. The interest he pays is:,（虛構）一個漁民借錢買機動船，佢付嘅利息係：,the cost of earlier availability of resources|compensation for postponing consumption|a historical cost|a free good,提早得到資源嘅成本|延遲消費嘅補償|historical cost|free good,,,A,Is he the borrower or the lender?,佢係借方定貸方？,The borrower pays interest to have the boat now.,借方用利息換「而家就有船用」。
interoyster-04,interoyster,mc,,,"If the interest rate rises, which is most likely?",利率上升，以下邊項最可能發生？,willingness to borrow rises|willingness to save rises|present consumption rises|future consumption falls,借錢意願上升|儲蓄意願上升|現在消費增加|將來消費減少,,,B,Does saving pay more or less?,存錢嘅回報變高定變低？,"Compensation for postponing consumption rises, so people save more.",延遲消費嘅補償增加，人更願意儲蓄。
interoyster-05,interoyster,fill,,,"For a lender, interest is the ____ for postponing ____ of goods or resources.",對貸方嚟講，利息係延遲 ② 物品或資源嘅 ①。,compensation|consumption|cost|production,補償|消費|成本|生產,,,compensation|consumption,The lender gives up using it now.,貸方放棄咗「而家用」。,"The lender gives up present use, so needs compensation.",貸方放棄咗而家用，所以要補償。
interoyster-06,interoyster,fill,,,Interest can be expressed in terms of real goods or ____.,利息可以用 real goods 或者 ① 表示。,money|time|labour|land,金錢|時間|勞力|土地,,,money,Borrowing rice and repaying rice is real goods; the other is?,借米還米係 real goods，另一種係？,"E.g. borrow rice, repay rice; or borrow money, repay money.",例如借米還米，或者借錢還錢。
interoyster-07,interoyster,tf,,,"Borrow 10 catties of rice, repay 11 catties a year later: the extra catty is interest.",借咗 10 斤米，一年後還 11 斤米，多出嚟嗰 1 斤米都係利息。,,,,,T,Must interest be money?,利息一定要係錢咩？,Interest can be expressed in terms of real goods.,利息可以用實物表示。
interoyster-08,interoyster,sort,,,After the interest rate rises:,利率上升後，以下各項點變？,rises|falls,上升|下降,willingness to borrow|willingness to save|present consumption|future consumption|cost of earlier availability,借錢意願|儲蓄意願|現在消費|將來消費|提早得到資源嘅成本,2|1|2|1|1,Borrowing costs more; saving pays more.,借錢貴咗、存錢回報高咗。,Matches the textbook 'Effect of changes in interest rate'.,對照課本「Effect of changes in interest rate」。
interoyster-09,interoyster,mc,,,"(Fictional) A fisherman borrows $1,000 for nets and repays $1,100 a year later. The interest is:","（虛構）漁民借 $1,000 買網，一年後還 $1,100。利息係：","$100|$1,000|$1,100|$0","$100|$1,000|$1,100|$0",,,A,How much extra is repaid?,還多咗幾多？,The extra $100 repaid is the interest.,多還嘅 $100 就係利息。
interoyster-10,interoyster,tf,,,"If the interest rate falls, willingness to borrow to buy a motorised boat rises.",利率下降，借錢買機動船嘅意願會上升。,,,,,T,Does borrowing become cheaper or dearer?,借錢嘅成本變高定變低？,"The cost of earlier availability falls, so willingness to borrow rises.",提早得到資源嘅成本下降，借錢意願上升。
interoyster-11,interoyster,fill,,,"For a borrower, interest is the ____ for the earlier ____ of goods or resources.",對借方嚟講，利息係提早 ② 物品或資源嘅 ①。,cost|availability|compensation|consumption,成本|得到|補償|消費,,,cost|availability,Does the borrower pay or receive?,借方係付出定收取？,The borrower pays interest to get resources earlier.,借方付利息，換取提早得到資源。
interoyster-12,interoyster,mc,,,Why do savers receive interest?,點解存錢會收到利息？,they postpone consumption and are compensated|banks give away money|money is a free good|the government requires it,因為存款人延遲消費，要得到補償|因為銀行送錢|因為錢係 free good|因為政府規定,,,A,What does a saver give up?,存錢嘅人放棄咗啲咩？,The lender postpones consumption; interest is the compensation.,貸方延遲消費，利息係補償。
interoyster-S1,interoyster,mc,scen,,"(Fictional) Amy borrows $20,000 from a bank for a course and repays $21,200 one year later. The interest rate is:","（虛構）Amy 向銀行借 $20,000 讀課程，一年後還 $21,200。Interest rate 係：",1.2%|5.7%|6%|106%,1.2%|5.7%|6%|106%,,,C,Interest = repayment minus the amount borrowed. Divide by what?,Interest = 還款減借款。之後除以咩？,"Interest = $21,200 - $20,000 = $1,200. Interest rate = $1,200 / $20,000 = 6% per year.","Interest = $21,200 - $20,000 = $1,200。Interest rate = $1,200 / $20,000 = 每年 6%。"
interoyster-S2,interoyster,mc,scen,,"(Fictional) Uncle Wah lends 50 catties of dried shrimp to a neighbour and gets 55 catties back a year later. For Uncle Wah, the extra 5 catties are:",（虛構）華叔借咗 50 斤蝦乾俾隔籬，一年後攞返 55 斤。對華叔嚟講，多出嚟嘅 5 斤係：,"compensation for postponing consumption|the cost of earlier availability|not interest, because it is not money|a historical cost",延遲消費嘅補償|提早擁有嘅成本|唔係 interest，因為唔係錢|historical cost,,,A,Uncle Wah is the lender. What does he give up by lending?,華叔係借出嗰個。借出去佢放棄咗咩？,"For a lender, interest is compensation for postponing consumption. Interest can be in real goods or money.",對 lender 嚟講，interest 係延遲消費嘅補償。Interest 可以係實物或者錢。
interoyster-S3,interoyster,sort,scen,,(Fictional) Interest rates in Hong Kong rise. What happens to each?,（虛構）香港 interest rate 上升。以下每項會點？,rises|falls,上升|下降,Amount people borrow to buy flats|Saving in bank deposits|Present consumption|Future consumption|Borrowers' cost of earlier availability,市民借錢買樓嘅金額|銀行存款儲蓄|現在消費|將來消費|借款人提早擁有嘅成本,2|1|2|1|1,"Is borrowing more costly, and is saving more rewarding?",借錢貴咗，儲錢係咪著數咗？,A higher interest rate raises the cost of earlier availability and the reward for postponing consumption: borrowing and present consumption fall; saving and future consumption rise.,Interest rate 上升，提早擁有嘅成本同延遲消費嘅回報都上升：借貸同現在消費下降；儲蓄同將來消費上升。
interoyster-S4,interoyster,tf,scen,,"(Fictional) Jason borrows from his sister to buy a new phone now instead of saving for six months. For Jason, the interest he pays is the cost of having the phone earlier.",（虛構）Jason 問家姐借錢即刻買新手機，唔再儲六個月錢先買。對 Jason 嚟講，佢俾嘅 interest 係提早擁有手機嘅成本。,,,,,T,Jason is the borrower. What does he gain by borrowing?,Jason 係借款人。借錢令佢得到咩？,"For a borrower, interest is the cost of earlier availability of goods or resources.",對 borrower 嚟講，interest 係提早擁有貨物或資源嘅成本。
interoyster-S5,interoyster,fill,scen,,"(Fictional) Mei deposits $10,000 in a bank at 3% interest a year. After one year she receives ____ interest, which is her ____ for postponing consumption.","（虛構）阿美將 $10,000 存入銀行，年利率 3%。一年後佢收到 ① interest，呢個係佢延遲消費嘅 ②。","$300|compensation|$3,000|cost","$300|補償|$3,000|成本",,,$300|compensation,"Calculate 3% of $10,000. Mei is lending her money to the bank: is she paying or being paid?","計吓 $10,000 嘅 3%。阿美將錢借俾銀行，佢係俾錢定收錢？","Interest = $10,000 x 3% = $300. For a lender (saver), interest is compensation for postponing consumption.","Interest = $10,000 x 3% = $300。對 lender（儲蓄者）嚟講，interest 係延遲消費嘅補償。"
tripliq-01,tripliq,tf,,,'Using workers or machines to dry salt' is a 'how to produce' problem.,「用人手定用機器曬鹽」屬於 how to produce。,,,,,T,Is this choosing what to produce or the method?,呢個係揀生產咩，定係揀生產方法？,How to produce is the choice of production methods.,How to produce 係揀生產方法。
tripliq-02,tripliq,tf,,,'Should Tai O dry more salt or catch more fish' is a 'for whom to produce' problem.,「大澳應該多曬鹽定多打魚」屬於 for whom to produce。,,,,,F,Is this choosing what to produce or who gets it?,呢個係揀生產咩，定係揀俾邊個？,Choosing what and how much to produce is 'what to produce'.,揀生產咩、生產幾多，係 what to produce。
tripliq-03,tripliq,mc,,,'Which families get the yellow croaker' belongs to:,「邊啲家庭可以分到黃花魚」屬於：,what to produce|how to produce|for whom to produce|not an economic problem,生產咩|點生產|為誰生產|唔係經濟問題,,,C,Is it about who receives it?,係分配俾邊個嘅問題？,For whom is the choice of criteria for who can enjoy the goods.,For whom 係揀邊個可以享用嘅準則。
tripliq-04,tripliq,mc,,,The three basic economic problems arise from:,三個基本經濟問題源自：,scarcity|interest|the market|the government,稀少性|利息|市場|政府,,,A,Why must we choose what to produce?,點解要揀生產咩？,"Resources are insufficient, so we must choose what, how and for whom.",資源唔夠，所以要揀生產咩、點生產、俾邊個。
tripliq-05,tripliq,fill,,,The problem of 'for whom to produce' refers to the choice about the ____ for who can enjoy the goods and services.,「為誰生產」係指揀邊個可以享用物品同服務嘅 ①。,criteria|methods|types|quantities,準則|方法|種類|數量,,,criteria,"Highest bidder, first come first served – what are these?",價高者得、先到先得，呢啲叫乜？,"E.g. highest bidder, first come first served, need.",例如價高者得、先到先得、按需要分配。
tripliq-06,tripliq,fill,,,What to produce is the choice of the ____ and ____ of goods and services to produce.,What to produce 係揀生產嘅物品同服務嘅 ① 同 ②。,types|quantities|methods|criteria,種類|數量|方法|準則,,,types|quantities,'What' and 'how much'.,生產「咩」同「幾多」。,The choice of the types and quantities of goods and services to produce.,揀生產嘅種類同數量。
tripliq-07,tripliq,sort,,,Sort into the three basic economic problems:,分入三個基本經濟問題：,what|how|for whom,生產咩|點生產|為誰生產,how much salt to dry|bamboo raft or wooden boat to carry salt|lottery or bidding to decide who buys shrimp paste|grow vegetables or rice|peel shrimp by hand or by machine|first come first served for drinking water,曬幾多鹽|用竹排定木船運鹽|抽籤定出價決定邊個買到蝦醬|種菜定種稻|用人手定機器剝蝦|先到先得分配食水,1|2|3|1|2|3,"Ask: am I choosing what, how, or for whom?",問自己：揀緊「生產咩」、「點生產」，定係「俾邊個」？,"Ask: what to produce, how to produce, or for whom?",問自己：揀緊「生產咩」、「點生產」，定係「俾邊個」？
tripliq-08,tripliq,mc,,,Which economic systems face the three basic economic problems?,邊個經濟體系要面對三個基本經濟問題？,only market economies|only planned economies|all economic systems|only traditional economies,只有市場經濟|只有計劃經濟|所有經濟體系|只有傳統經濟,,,C,Which society has no scarcity?,邊個社會冇 scarcity？,All societies face scarcity; they differ only in how they solve it.,所有社會都有 scarcity，分別只係用咩方法解決。
tripliq-09,tripliq,mc,,,"During Hong Kong's 1963 water rationing, the government decided how to share limited water among residents. This mainly solves:",1963 年香港制水，政府決定點樣分配有限嘅食水俾全港市民。呢個主要解決：,for whom to produce|what to produce|how to produce|no problem,為誰生產|生產咩|點生產|冇解決任何問題,,,A,"The question is who gets water, and when.",問題係「邊個」幾時有水用。,Deciding who gets water and when is 'for whom'.,決定邊個、幾時得到食水，屬於 for whom。
tripliq-10,tripliq,tf,,,Without scarcity there would be no three basic economic problems.,如果冇 scarcity，就唔會有三個基本經濟問題。,,,,,T,"With unlimited resources, would we need to choose?",資源無限，仲使唔使揀？,All three problems come from scarcity.,三個問題都源自 scarcity。
tripliq-11,tripliq,fill,,,How to produce is the choice of ____ methods.,How to produce 係指揀 ① 嘅方法。,production|distribution|consumption|exchange,生產|分配|消費|交換,,,production,Which process does 'how' ask about?,How 問嘅係邊個過程？,How to produce: the choice of production methods.,How to produce：揀生產方法。
tripliq-12,tripliq,mc,,,Tai O fishermen decide whether to fish with trawl nets or hand lines. This is:,大澳漁民決定用拖網定用手釣捕魚，屬於：,how to produce|what to produce|for whom to produce|none of these,點生產|生產咩|為誰生產|三者都唔係,,,A,Are they choosing a method or a product?,佢哋揀緊方法定揀緊產品？,Choosing a fishing method is 'how to produce'.,揀捕魚方法，係 how to produce。
tripliq-S1,tripliq,mc,scen,,(Fictional) A Tung Chung bakery buys an automatic dough machine instead of hiring two more bakers. Which basic economic problem is it solving?,（虛構）東涌一間餅店買咗部自動搓粉機，唔再請多兩個師傅。佢解決緊邊個 basic economic problem？,what to produce|how to produce|for whom to produce|none of them,what to produce|how to produce|for whom to produce|全部都唔係,,,B,"Is the bakery choosing the product, the method, or the buyer?",餅店揀緊產品、生產方法，定係邊個享用？,"Choosing between labour and machines is a choice of production method, so it is 'how to produce'.",揀人手定機器，係揀生產方法，所以係 how to produce。
tripliq-S2,tripliq,mc,scen,,(Fictional) A Mui Wo guesthouse owner turns two bedrooms into a small café. Which problem is this?,（虛構）梅窩一個民宿老闆將兩間房改做細細間 café。呢個係邊個問題？,for whom to produce|how to produce|what to produce|whether scarcity exists,for whom to produce|how to produce|what to produce|有冇 scarcity,,,C,Did the kind of service he offers change?,佢提供嘅服務種類有冇改變？,"Producing café drinks instead of room nights changes the kinds and quantities of output, so it is 'what to produce'.",由租房改為賣飲品，改變咗產品嘅種類同數量，所以係 what to produce。
tripliq-S3,tripliq,sort,scen,,(Fictional) Sort these decisions of a Tai O dried-seafood shop:,（虛構）將大澳一間海味舖嘅決定分類：,what to produce|how to produce|for whom to produce,what to produce|how to produce|for whom to produce,make more dried squid and less salted fish|dry fish with an electric dryer instead of sunlight|keep the best fish maw for regular customers|start selling shrimp paste gift boxes|hire family members rather than outside workers|sell only to those who pay the highest price,多做魷魚乾、少做鹹魚|用電乾機代替曬太陽嚟整乾魚|將最靚嘅花膠留俾熟客|開始賣蝦醬禮盒|請屋企人而唔請外人做|只賣俾出價最高嘅人,1|2|3|1|2|3,"Ask: is it about the product, the method, or who gets it?",問自己：講緊產品、方法，定係邊個得到？,What = kinds and quantities of output; how = production methods; for whom = who can enjoy the output.,What 係產品種類同數量；how 係生產方法；for whom 係邊個享用。
tripliq-S4,tripliq,fill,scen,,"(Fictional) A Tai O boatyard has 60 worker-hours a week. A sampan takes 20 hours and a repair job takes 5 hours. If it builds 2 sampans, it can do ____ repair jobs. Choosing this output mix is a ____ problem.",（虛構）大澳一個船廠每星期有 60 個工時。整一隻舢舨要 20 個鐘，做一單維修要 5 個鐘。如果整 2 隻舢舨，仲可以做 ① 單維修。揀呢個產品組合係 ② 問題。,4|8|what to produce|how to produce,4|8|what to produce|how to produce,,,4|what to produce,How many hours are left after 2 sampans? Is the yard choosing products or methods?,整完 2 隻舢舨仲剩幾多個鐘？船廠揀緊產品定方法？,60 - 2 x 20 = 20 hours; 20 / 5 = 4 repair jobs. Deciding the kinds and quantities of output is 'what to produce'.,60 - 2 x 20 = 20 個鐘；20 / 5 = 4 單維修。決定產品種類同數量係 what to produce。
tripliq-S5,tripliq,tf,scen,,(Fictional) A Tai O noodle stall sells its last 10 bowls of the day only to regular customers. This is a 'how to produce' problem.,（虛構）大澳一個麵檔將當日最後 10 碗麵只賣俾熟客。呢個係 how to produce 問題。,,,,,F,"Is the stall deciding how to cook, or who gets the noodles?",麵檔決定緊點樣煮，定係邊個食到？,"Deciding who can enjoy the output is 'for whom to produce', not 'how to produce'.",決定邊個享用產品係 for whom to produce，唔係 how to produce。
tradiphin-01,tradiphin,tf,,,A traditional economy mainly uses customs and traditions to solve the three basic economic problems.,Traditional economy 主要用 customs and traditions 解決三個基本經濟問題。,,,,,T,What does 'traditional' rely on?,Traditional 即係靠乜？,This is the textbook glossary definition.,課本 glossary 定義。
tradiphin-02,tradiphin,tf,,,"In a traditional economy, production methods are mainly decided by market prices.",喺 traditional economy，生產方法主要由市場價格決定。,,,,,F,Does it rely on prices or customs?,Traditional economy 靠價格定係靠習俗？,It mainly follows customs and traditions.,主要跟習俗同傳統。
tradiphin-03,tradiphin,mc,,,"(Fictional) 'The father is a salt worker, so the son becomes a salt worker too' best reflects:",（虛構）「父親係鹽工，兒子長大都做鹽工」最能反映：,traditional economy|planned economy|market economy|circular flow,傳統經濟|計劃經濟|市場經濟|循環流程,,,A,What decides the son's job?,邊個決定個仔做邊行？,The job is decided by tradition.,職業由傳統決定。
tradiphin-04,tradiphin,mc,,,Which uses customs and traditions to solve 'for whom'?,以下邊個做法係用 customs and traditions 解決 for whom？,sharing the catch by seniority and custom|highest bidder wins|government rationing|auction,按輩份同習俗分配漁獲|價高者得|政府配給|拍賣,,,A,Which one relies on custom?,邊一個靠習俗？,Highest bidder and auction are market; rationing is government command.,價高者得同拍賣係 market，配給係 government command。
tradiphin-05,tradiphin,fill,,,A traditional economy mainly uses ____ and ____ to solve the three basic economic problems.,Traditional economy 主要用 ① 同 ② 解決三個基本經濟問題。,customs|traditions|commands|prices,習俗|傳統|命令|價格,,,customs|traditions,"Not commands, not prices.",唔係命令，唔係價格。,Compare the other two methods: commands and prices.,對照另外兩種方法：commands、prices。
tradiphin-06,tradiphin,sort,,,Three methods of solving the problems:,三種解決方法：,customs and traditions|government command|market mechanism,習俗與傳統|政府指令|市場機制,"inherited skills decide how shrimp paste is made|the government fixes each household's rice ration|salted fish price rises, more people make it|the eldest son inherits the father's boat|highest bidder wins|the government orders factory output",祖傳手藝決定點做蝦醬|政府規定每戶配給幾多米|鹹魚價錢升，多咗人曬鹹魚|長子繼承父親嘅船|價高者得|政府指令工廠生產幾多,1|2|3|1|3|2,"Each method has its own 'signal': tradition, command, price.",三種方法各有一個「訊號」：傳統、命令、價格。,"Each method has its own signal: tradition, command or price.",三種方法各有一個「訊號」：傳統、命令、價格。
tradiphin-07,tradiphin,tf,,,The textbook definitions say 'mainly' because real economies usually mix several methods.,課本定義用「mainly」，因為現實經濟體多數混合使用幾種方法。,,,,,T,Is the classification about 'all' or 'mainly'?,分類睇嘅係「全部」定「主要」？,Classify by the method mainly used.,分類睇「主要」用邊種方法。
tradiphin-08,tradiphin,mc,,,Which best describes 'how to produce' in a traditional economy?,邊個描述最似 traditional economy 嘅 how to produce？,dry salt the way the previous generation did|use the lowest-cost method|follow the government plan|follow consumer preferences,跟上一代嘅方法曬鹽|用成本最低嘅方法|按政府計劃|按消費者喜好,,,A,Where does the method come from?,方法由邊度嚟？,The method is handed down by tradition.,方法由傳統傳落嚟。
tradiphin-09,tradiphin,tf,,,"In a traditional economy, 'for whom to produce' can be decided by custom, e.g. by seniority.",Traditional economy 入面，for whom to produce 可以由習俗決定，例如按輩份分配。,,,,,T,Can custom decide distribution?,習俗可唔可以決定分配？,"Customs and traditions can solve all three problems, including for whom.",Customs and traditions 可以解決三個問題，包括 for whom。
tradiphin-10,tradiphin,mc,,,Which is LEAST like a traditional economy?,以下邊個最唔似 traditional economy？,salt price falls and salt workers switch jobs immediately|son follows father's trade|drying salt by ancestral methods|sharing by clan rules,鹽價跌，鹽工即刻轉行|子承父業|按祖傳方法曬鹽|按族規分配,,,A,Which one responds to a price signal?,邊一個係跟價格訊號行動？,Switching jobs because of prices is the market mechanism.,跟價格轉行係 market mechanism。
tradiphin-11,tradiphin,fill,,,An economic system that uses customs and traditions to solve the three basic economic problems is a ____ economy.,用 customs and traditions 解決三個基本經濟問題嘅經濟體系叫 ① economy。,traditional|planned|market|barter,傳統|計劃|市場|以物易物,,,traditional,The first half of Tradiphin's name.,Tradiphin 個名嘅前半部。,Traditional economy.,傳統經濟。
tradiphin-12,tradiphin,sort,,,By custom or by price?,按習俗定按價格？,customs and traditions|market mechanism,習俗與傳統|市場機制,inherited skills|highest bidder wins|eldest son inherits|more people join when price rises,祖傳手藝|價高者得|長子繼承|價錢升就多人做,1|2|1|2,Which ones follow price changes?,邊啲跟價格變化？,Price is the market's signal; custom is the traditional economy's signal.,價格係市場嘅訊號；習俗係傳統經濟嘅訊號。
tradiphin-S1,tradiphin,mc,scen,,"(Fictional) By village custom, a Tai O boat's catch of 80 catties is split: the owner's family takes half, and 4 crew share the rest equally. How much does each crew member get, and what decides 'for whom'?",（虛構）按村中習俗，大澳一條船捉到 80 斤魚：船主一家攞一半，其餘由 4 個船員平分。每個船員分到幾多？「for whom」由乜嘢決定？,10 catties; customs and traditions|20 catties; customs and traditions|10 catties; market prices|20 catties; government command,10 斤；customs and traditions|20 斤；customs and traditions|10 斤；market prices|20 斤；government command,,,A,"Half of 80 is left for the crew. Was the rule set by price, government, or custom?",80 斤一半留俾船員。規矩係價格、政府定係習俗定落嘅？,80 / 2 = 40; 40 / 4 = 10 catties each. Sharing by an inherited rule means customs and traditions solve 'for whom'.,80 / 2 = 40；40 / 4 = 10 斤。按傳落嚟嘅規矩分配，即係用 customs and traditions 解決 for whom。
tradiphin-S2,tradiphin,mc,scen,,"(Fictional) Tai O villagers keep making shrimp paste by hand the way their grandparents did, although a faster machine is available. 'How to produce' here is solved mainly by:",（虛構）大澳村民雖然有更快嘅機器，但仍然好似阿爺阿嫲咁用人手整蝦醬。呢度嘅 how to produce 主要靠乜嘢解決？,market prices|customs and traditions|government command|private property rights,market prices|customs and traditions|government command|private property rights,,,B,Why do they ignore the faster machine?,佢哋點解唔用更快嘅機器？,"The method is copied from past generations, so 'how to produce' is solved by customs and traditions.",生產方法沿用上一代，所以 how to produce 係由 customs and traditions 解決。
tradiphin-S3,tradiphin,sort,scen,,(Fictional) Which method is mainly used in each case?,（虛構）每個情況主要用邊種方法？,customs and traditions|government command|market price,customs and traditions|government command|market price,a walled-village clan passes farmland to sons by clan rules|a state planning bureau sets a steel output target|a Mong Kok phone shop raises prices when demand rises|fishermen fish only on days chosen by old festival practice|workers are assigned jobs by a government office,圍村按族規將田地傳俾仔|國家計劃部門定鋼鐵產量指標|旺角手機舖喺需求上升時加價|漁民只喺舊節慶習俗揀嘅日子出海|工人由政府部門分配工作,1|2|3|1|2,Who or what makes the decision in each case?,每個情況係邊個或乜嘢做決定？,Inherited practices = tradition; orders from government = command; changes in price = market.,傳統做法 = tradition；政府命令 = command；價格變動 = market。
tradiphin-S4,tradiphin,tf,scen,,(Fictional) A young fisherman in a traditional fishing community switches to a new type of net because fish prices rose. This shows custom solving 'how to produce'.,（虛構）一個傳統漁村嘅後生漁民因為魚價上升而改用新款漁網。呢個反映習俗解決 how to produce。,,,,,F,What made him change his method: custom or price?,令佢改變方法嘅係習俗定價格？,"He responds to a price change, so this is the market mechanism, not customs and traditions.",佢係回應價格變動，所以係 market mechanism，唔係 customs and traditions。
tradiphin-S5,tradiphin,fill,scen,,"(Fictional) Ah Fong's family has made salted fish for five generations, so she makes salted fish too. 'What to produce' is decided by ____, a feature of a ____ economy.",（虛構）阿芳屋企五代都整鹹魚，所以佢都整鹹魚。What to produce 由 ① 決定，呢個係 ② economy 嘅特徵。,custom|price|traditional|planned,習俗|價格|traditional|planned,,,custom|traditional,"Did anyone order her, or did a price attract her?",有冇人命令佢？定係價格吸引佢？,"Following the family's past practice means custom decides, which marks a traditional economy.",跟隨家族以往做法即係習俗決定，屬 traditional economy 嘅特徵。
commandra-01,commandra,tf,,,"In a planned economy, resources are mainly owned by the state.",Planned economy 入面，資源主要由 the state 擁有。,,,,,T,Check the textbook comparison table.,對照課本比較表。,This matches the textbook comparison table.,對照課本比較表。
commandra-02,commandra,tf,,,"In a planned economy, economic decisions are mainly made by private individuals.",Planned economy 入面，經濟決策主要由私人做。,,,,,F,Who does the planning?,Planned 係邊個計劃？,They are mainly made by the government.,主要由政府做。
commandra-03,commandra,mc,,,A planned economy mainly allocates resources by:,Planned economy 主要用咩分配資源？,government command|market prices|customs|lottery,政府指令|市場價格|習俗|抽籤,,,A,Look at Commandra's name.,Commandra 個名。,Resource allocation is guided by government command.,資源分配由政府指令引導。
commandra-04,commandra,mc,,,'Command economy' is another name for:,Command economy 係邊個嘅另一個名稱？,planned economy|market economy|traditional economy|barter economy,計劃經濟|市場經濟|傳統經濟|以物易物經濟,,,A,Command means order.,Command 即係命令。,Glossary: command economy – refer to planned economy.,Glossary：command economy 即 planned economy。
commandra-05,commandra,fill,,,A planned economy (or ____ economy) mainly uses government ____ to solve the three basic economic problems.,Planned economy（又叫 ① economy）主要用政府 ② 解決三個基本經濟問題。,command|commands|market|customs,指令（名稱）|指令|市場|習俗,,,command|commands,Watch singular and plural.,留意單數同複數。,Note: 'command economy' but 'government commands'.,留意單數同複數。
commandra-06,commandra,sort,,,Market economy or planned economy?,Market economy 定 planned economy？,market economy|planned economy,市場經濟|計劃經濟,resources mainly owned by private individuals|economic decisions mainly made by the government|resource allocation guided by market prices|distribution guided by government command,資源主要由私人擁有|經濟決策主要由政府做|資源分配由市場價格引導|物品分配由政府指令引導,1|2|1|2,The four rows of the textbook comparison table.,課本比較表四行。,These are the four rows of the textbook comparison table.,課本比較表四行。
commandra-07,commandra,mc,,,Which is a government command?,邊個係 government command？,"(Fictional) The government orders a factory to produce 10,000 tonnes of salt this year|salt price rises, workers dry more salt|father passes the trade to son|customers bargain",（虛構）政府規定工廠今年生產 1 萬噸鹽|鹽價升，鹽工多曬鹽|父傳子|顧客講價,,,A,Which one is an order from the government?,邊個係由政府下命令？,The output quantity is decided by the government.,生產數量由政府決定。
commandra-08,commandra,tf,,,"In a planned economy, goods and services are mainly distributed by government command.",喺 planned economy，物品同服務嘅分配主要靠 government command。,,,,,T,Who decides 'for whom'?,For whom 由邊個決定？,So 'for whom' is also decided by the government.,所以 for whom 亦由政府決定。
commandra-09,commandra,tf,,,A command economy and a planned economy are the same thing.,Command economy 同 planned economy 係同一樣嘢。,,,,,T,What does the glossary say?,Glossary 點寫？,Both names refer to the same economic system.,兩個名稱指同一種經濟體系。
commandra-10,commandra,mc,,,"In a planned economy, 'what to produce' is mainly decided by:",喺 planned economy，what to produce 主要由邊個決定？,the government|consumers|elders|lottery,政府|消費者|長輩|抽籤,,,A,Who gives the orders?,邊個下指令？,The government decides what to produce by command.,政府用指令決定生產咩。
commandra-11,commandra,fill,,,"In a planned economy, resources are mainly owned by ____.",喺 planned economy，資源主要由 ① 擁有。,the state|private individuals|elders|firms,國家|私人|長輩|廠商,,,the state,The opposite of a market economy.,同 market economy 相反。,Textbook table: resources mainly owned by the state.,課本比較表：資源主要由國家擁有。
commandra-12,commandra,mc,,,"During the 1963 water rationing, the government fixed water supply hours. This way of allocating is most like:",1963 年香港制水時，政府規定供水時間。呢個分配方法最似：,government command|market mechanism|customs and traditions|barter,政府指令|市場機制|習俗與傳統|以物易物,,,A,Who decided when there was water?,邊個決定幾時有水？,"Allocation by government order, not by price.",由政府命令分配，唔係價格。
commandra-S1,commandra,mc,scen,,"(Fictional) In a planned economy, the state allocates 1,000 tonnes of rice to a region of 50,000 people as equal rations. How much does each person get, and what decides 'for whom'?","（虛構）喺一個 planned economy，國家將 1,000 噸米平均配給一個有 50,000 人嘅地區。每人分到幾多？for whom 由乜嘢決定？",20 kg; government command|50 kg; government command|20 kg; market prices|2 kg; customs and traditions,20 公斤；government command|50 公斤；government command|20 公斤；market prices|2 公斤；customs and traditions,,,A,"1 tonne = 1,000 kg. Who decided the ration?","1 噸 = 1,000 公斤。配給係邊個決定？","1,000,000 kg / 50,000 = 20 kg each. Rations set by the state mean government command solves 'for whom'.","1,000,000 公斤 / 50,000 = 每人 20 公斤。國家定配給，即係 government command 解決 for whom。"
commandra-S2,commandra,mc,scen,,"(Fictional) In a planned economy, a factory manager sees long queues for bicycles but must still produce exactly the 5,000 bicycles in the state plan. What decides 'what to produce'?","（虛構）喺 planned economy，一個廠長見到買單車要排長龍，但仍然要按國家計劃只生產 5,000 架。What to produce 由乜嘢決定？",consumers' willingness to pay|the manager's own choice|the government's plan|village customs,消費者願意付嘅價錢|廠長自己嘅選擇|政府嘅計劃|村中習俗,,,C,Can the manager act on the queue?,廠長可唔可以因應條人龍而改變產量？,"Output follows the state plan, not consumer demand, so government command decides 'what to produce'.",產量跟國家計劃，唔跟消費者需求，所以係 government command 決定 what to produce。
commandra-S3,commandra,order,scen,,(Fictional) Put these steps of a planned economy in order:,（虛構）將 planned economy 嘅步驟排好次序：,,,the planning bureau sets output targets|state-owned factories are assigned raw materials and workers|factories produce according to their quotas|goods are distributed to people by government ration,計劃部門定產量指標|國營工廠獲分配原料同工人|工廠按配額生產|貨品按政府配給分俾市民,,What must be decided before resources can be assigned?,分配資源之前要先決定啲乜？,"The government decides what, then how (assigning resources), then for whom (distribution) – all by command.",政府先決定 what，再決定 how（分配資源），最後決定 for whom（分配產品），全部靠命令。
commandra-S4,commandra,tf,scen,,"(Fictional) In a planned economy, a farmer may sell the state-owned farmland he works on to his neighbour.",（虛構）喺 planned economy，一個農民可以將佢耕緊嘅國有農地賣俾鄰居。,,,,,F,Who owns the land in a planned economy?,Planned economy 入面土地屬於邊個？,"Resources are mainly owned by the state, so the farmer has no right to transfer the land.",資源主要屬國家所有，農民冇 right to transfer 嗰塊地。
commandra-S5,commandra,sort,scen,,(Fictional) Planned economy or market economy?,（虛構）Planned economy 定 market economy？,planned economy|market economy,planned economy|market economy,a state-owned steel mill meets a tractor quota|a graduate is assigned a job by the government|a family noodle shop sets its own prices|consumers choose which phone to buy with their own money|housing is allocated by a government office,國營鋼廠完成拖拉機配額|畢業生由政府分配工作|家庭麵舖自己定價|消費者用自己嘅錢揀買邊部手機|住屋由政府部門分配,1|1|2|2|1,Is the decision made by the state or by private individuals?,決定係由國家定係私人做？,State ownership and commands mark a planned economy; private decisions guided by price mark a market economy.,國家擁有資源同發命令係 planned economy；私人按價格做決定係 market economy。
marketail-01,marketail,tf,,,"Under the market mechanism, the market price is the signal to guide the allocation of resources.",喺 market mechanism 下，market price 係分配資源嘅訊號。,,,,,T,What does a price change tell producers?,價格升跌話俾生產者知啲咩？,Glossary: the market price is the signal to guide the allocation of resources.,Glossary：市場價格係引導資源分配嘅訊號。
marketail-02,marketail,tf,,,"In a market economy, resources are mainly owned by the government.",Market economy 入面，資源主要由政府擁有。,,,,,F,Compare with a planned economy.,對照 planned economy。,They are mainly owned by private individuals.,主要由私人擁有。
marketail-03,marketail,mc,,,"After WWII, competition from imported salt grew, and Tai O's salt industry declined in the 1950s–60s. This best reflects:",二戰後入口鹽競爭太大，大澳鹽業喺 1950–1960 年代日漸式微。呢個過程最能反映：,market mechanism|government command|customs and traditions|historical cost,市場機制|政府指令|習俗與傳統|歷史成本,,,A,Did anyone order salt workers to change jobs?,有冇人下命令叫鹽工轉行？,Price signals moved resources away; no one gave orders. Sources: The Mango Road; Tai O Heritage Hotel.,價格訊號令資源流走，冇人下令。來源：The Mango Road、大澳文物酒店。
marketail-04,marketail,mc,,,The market mechanism is also called:,Market mechanism 又叫：,price system|command system|tradition|barter,價格制度|指令制度|傳統|以物易物,,,A,What is the signal?,訊號係乜？,Glossary: market mechanism (or price system).,Glossary：market mechanism（或 price system）。
marketail-05,marketail,fill,,,"Under the market mechanism, the market ____ is the ____ to guide the allocation of resources.",喺市場機制下，市場 ① 係引導資源分配嘅 ②。,price|signal|command|custom,價格|訊號|指令|習俗,,,price|signal,A rise or fall in price is a…,價格升跌就係一個……,Price changes are the signal.,價格升跌就係訊號。
marketail-06,marketail,fill,,,"In a market economy, economic decisions are mainly made by ____.",Market economy 入面，經濟決策主要由 ① 做。,private individuals|the government|elders|the state,私人|政府|長輩|國家,,,private individuals,The opposite of a planned economy.,同 planned economy 相反。,Compare: in a planned economy the government decides.,對照 planned economy 由政府做。
marketail-07,marketail,sort,,,Three methods:,三種解決方法：,market|command|customs,市場|指令|習俗,"shrimp paste price rises, more people make it|1963 water rationing: government supplies water once every four days|elders decide who uses the pier",大澳蝦醬價升，多咗人做蝦醬|1963 年香港制水，政府規定每四日供水一次|按長輩決定邊個用碼頭位,1|2|3,"Which signal: price, command or tradition?",邊個訊號：價格、命令、傳統？,Water rationing was allocation by government command.,制水係政府用命令分配食水。
marketail-08,marketail,tf,,,"In a market economy, 'for whom to produce' is mainly decided by willingness and ability to pay.",喺 market economy，for whom to produce 主要由願唔願意同有冇能力付價錢決定。,,,,,T,Who gets to buy?,邊個買得到？,Distribution is mainly guided by market prices.,分配主要由 market prices 引導。
marketail-09,marketail,tf,,,The market mechanism is also called the price system.,Market mechanism 又叫 price system。,,,,,T,What does the glossary say?,Glossary 點寫？,Both names refer to the same thing.,兩個名稱指同一樣嘢。
marketail-10,marketail,mc,,,"If the price of Tai O shrimp paste rises, most likely:",大澳蝦醬價錢上升，最可能出現：,more people start making shrimp paste|the government sets output|it is shared by seniority|nobody reacts,更多人投入做蝦醬|政府規定產量|按輩份分配|冇人理,,,A,What signal does a higher price send?,價格上升係咩訊號？,A higher price attracts resources.,價格上升吸引資源流入。
marketail-11,marketail,fill,,,A market economy mainly uses the market ____ to solve the three basic economic problems.,Market economy 主要用市場 ① 解決三個基本經濟問題。,mechanism|command|tradition|barter,機制|指令|傳統|以物易物,,,mechanism,Another name for the price system.,Price system 嘅另一個名。,Market mechanism.,市場機制。
marketail-12,marketail,sort,,,Market or planned?,Market 定 planned？,market economy|planned economy,市場經濟|計劃經濟,private individuals decide what shop to open|government decides factory output|highest bidder wins|rationing by the government,私人決定開咩舖|政府決定工廠產量|價高者得|按政府配給,1|2|1|2,Who decides: private individuals or government?,邊個做決定：私人定政府？,Private decisions and price allocation = market; government decisions and rationing = planned.,私人決策、價格分配係 market；政府決策、配給係 planned。
marketail-S1,marketail,mc,scen,,"(Fictional) As more tourists visit Tai O, the price of a pack of dried squid rises from $80 to $100. By what percentage did the price rise, and what does it signal?",（虛構）遊客多咗去大澳，一包魷魚乾由 $80 升到 $100。價格升咗幾多個百分比？佢發出咩 signal？,20%; producers should make less|25%; producers should make more|25%; the government should set a quota|20%; producers should make more,20%；生產者應該少做|25%；生產者應該多做|25%；政府應該定配額|20%；生產者應該多做,,,B,Divide the rise by the original price. Does a higher price attract or repel producers?,用升幅除以原價。價格高咗會吸引定趕走生產者？,"(100 - 80) / 80 = 25%. Under the market mechanism, a higher price signals producers to shift more resources to that good.",(100 - 80) / 80 = 25%。喺 market mechanism 下，價格上升係 signal，引導生產者將更多資源轉去生產呢樣嘢。
marketail-S2,marketail,mc,scen,,"(Fictional) Only 30 seats are left on a weekend dolphin-watching boat trip in Tai O. The operator raises the fare, and the seats go to those willing and able to pay. This mainly shows the price system solving:",（虛構）大澳週末睇中華白海豚嘅船程只剩 30 個位。船家加價，個位就去咗願意又有能力俾錢嘅人。呢個主要反映 price system 解決：,what to produce|how to produce|for whom to produce|whether dolphins are scarce,what to produce|how to produce|for whom to produce|白海豚係咪稀少,,,C,The trip already exists. What is being decided about the seats?,船程已經有咗，而家決定緊啲位嘅乜嘢？,Allocating output to those willing and able to pay is how the market solves 'for whom to produce'.,將產品分俾願意又有能力付款嘅人，就係市場解決 for whom to produce 嘅方法。
marketail-S3,marketail,fill,scen,,"(Fictional) Shop rents near Tung Chung MTR station rise. A clothing shop moves out and a pharmacy that can pay more moves in. The shop space goes to the ____-paying user, and the decisions are made by ____.",（虛構）東涌港鐵站附近舖租上升，一間時裝店搬走，一間俾得起更高租金嘅藥房搬入。舖位去咗出價 ① 嘅使用者，而決定係由 ② 做。,higher|lower|private individuals|the government,較高|較低|private individuals|政府,,,higher|private individuals,"Who moved in, and did anyone order the move?",邊個搬入？有冇人命令佢哋搬？,"The price (rent) guides the resource to the user willing to pay more, through private decisions – the market mechanism at work.",價格（租金）引導資源去願意付更多嘅使用者，全靠私人決定，即係 market mechanism 運作。
marketail-S4,marketail,sort,scen,,"(Fictional) In a market economy, which problem does each price-driven change solve?",（虛構）喺 market economy，每個由價格帶動嘅改變解決邊個問題？,what to produce|how to produce|for whom to produce,what to produce|how to produce|for whom to produce,farmers grow more choy sum after its price rises|a restaurant switches to frozen fish as fresh fish gets dearer|concert tickets go to fans who pay the most|a factory replaces workers with machines after wages rise|shops stock more umbrellas when their price rises|a sea-view flat goes to the highest bidder,菜心價升，農夫種多啲菜心|鮮魚貴咗，餐廳改用急凍魚|演唱會飛去咗出價最高嘅 fans|工資上升，工廠用機器取代工人|雨遮價升，舖頭入多啲貨|海景單位賣咗俾出價最高嘅人,1|2|3|2|1|3,"Is the change about output, method, or who gets it?",改變係關於產品、方法，定係邊個得到？,"In the market, price changes guide output (what), input choices (how) and distribution by willingness and ability to pay (for whom).",市場入面，價格變動引導產出 (what)、投入選擇 (how)，同按意願及能力付款分配 (for whom)。
marketail-S5,marketail,tf,scen,,"(Fictional) In a market economy, a Tai O bakery owner must get government approval before deciding how many egg tarts to bake each day.",（虛構）喺 market economy，大澳一個餅店老闆要先得到政府批准，先可以決定每日焗幾多個蛋撻。,,,,,F,Who makes production decisions in a market economy?,Market economy 入面邊個做生產決定？,"In a market economy, economic decisions are mainly made by private individuals guided by prices, not by government approval.",喺 market economy，經濟決定主要由私人按價格做，唔使政府批准。
deedtle-01,deedtle,tf,,,"A complete set of private property rights includes the exclusive right to use, the exclusive right to receive income, and the right to transfer.",一套完整嘅 private property rights 包括 exclusive right to use、exclusive right to receive income 同 right to transfer。,,,,,T,Three rights.,三種權利。,All three rights are needed.,三種權利缺一不可。
deedtle-02,deedtle,tf,,,"If a salt pan owner cannot sell the salt pan, he still has complete private property rights.",如果一個鹽田業主唔可以將鹽田賣俾人，佢仍然擁有完整嘅 private property rights。,,,,,F,Which right is missing?,缺咗邊種權利？,The right to transfer is missing.,少咗 right to transfer。
deedtle-03,deedtle,mc,,,A stilt house owner rents the house to tourists. Which right is being used?,棚屋業主將間屋租俾遊客收租，行使緊邊種權利？,exclusive right to receive income|right to transfer|exclusive right to use|none,專有收益權|轉讓權|專有使用權|冇,,,A,What is rent?,租金係乜？,Rent is income.,租金係收入。
deedtle-04,deedtle,mc,,,An owner sells his fishing boat. He is using:,業主將漁船賣俾人，行使緊：,right to transfer|exclusive right to use|exclusive right to receive income|none,轉讓權|專有使用權|專有收益權|冇,,,A,Who does the ownership pass to?,擁有權轉咗俾邊個？,Ownership is transferred to someone else.,將擁有權轉俾其他人。
deedtle-05,deedtle,fill,,,"Private property rights enable ____, and exchange enables ____.",Private property rights 令 ① 成為可能，而 exchange 令 ② 成為可能。,exchange|specialisation|scarcity|command,交換|專門化|稀少性|指令,,,exchange|specialisation,Property rights → ? → ?,業權 → ？ → ？,This is the textbook relationship diagram.,課本關係圖。
deedtle-06,deedtle,sort,,,Match the action to the right:,行為配權利：,exclusive right to use|exclusive right to receive income|right to transfer,專有使用權|專有收益權|轉讓權,living in your own stilt house|renting out your boat|selling your salt pan|stopping strangers using your net,自己住棚屋|將船租出收租|將鹽田賣出|阻止陌生人用你張網,1|2|3|1,"Use, income, transfer.",用、收入、轉讓。,'Exclusive' means you can exclude others.,「exclusive」即係可以排除其他人。
deedtle-07,deedtle,mc,,,"Without private property rights, the most likely problem is:",冇 private property rights，最可能出現咩問題？,people are unwilling to trade because ownership is unclear|prices must rise|no scarcity|no interest,人唔願意交易，因為唔肯定件嘢屬於邊個|價格一定上升|冇 scarcity|冇 interest,,,A,Would you buy something when you are not sure it belongs to the seller?,你會唔會買一樣唔知係咪佢嘅嘢？,Clear ownership lets people trade with confidence.,業權清楚先可以放心交易。
deedtle-08,deedtle,tf,,,'Exclusive' in private property rights means others can be excluded from using it or receiving its income.,Private property rights 入面嘅「exclusive」即係可以排除其他人使用或者收取收入。,,,,,T,What does exclusive mean?,Exclusive 即係？,See the exclusive right to use and the exclusive right to receive income.,對照 exclusive right to use 同 exclusive right to receive income。
deedtle-09,deedtle,mc,,,A stilt house owner lives in the house himself. He is using:,棚屋業主自己住，行使緊：,exclusive right to use|right to transfer|exclusive right to receive income|none,專有使用權|轉讓權|專有收益權|冇,,,A,He uses it himself.,自己用。,The right to use.,使用權。
deedtle-10,deedtle,tf,,,"If the government bans the transfer of fishing boats, fishermen still have complete private property rights.",如果政府規定漁船唔可以轉讓，漁民仍然擁有完整嘅 private property rights。,,,,,F,Which right is missing?,缺咗邊種？,"Without the right to transfer, the set is incomplete.",少咗 right to transfer，唔完整。
deedtle-11,deedtle,fill,,,"The three rights: exclusive right to ____, exclusive right to receive ____, right to ____.",三種權利：專有 ① 權、專有收取 ② 權、③ 權。,use|income|transfer|vote,使用|收益|轉讓|投票,,,use|income|transfer,"Use, income, transfer.",用、收入、轉讓。,This is the textbook definition.,課本定義。
deedtle-12,deedtle,mc,,,"Without the right to transfer, the most direct effect is on:",冇 right to transfer，最直接影響：,exchange (buying and selling)|scarcity|the weather|interest,exchange（買賣）|scarcity|天氣|interest,,,A,"If it cannot be transferred, can it be sold?",唔可以轉讓，仲可唔可以賣？,"Without transfer rights, trading is difficult.",唔可以轉讓就難以交易。
deedtle-S1,deedtle,mc,scen,,"(Fictional) Mr Lee owns a flat in Tung Chung and rents it out for $15,000 a month. What is his rental income for one year, and which right does it come from?","（虛構）李生喺東涌有個單位，每月租 $15,000。佢一年租金收入係幾多？來自邊種權利？","$180,000; exclusive right to receive income|$150,000; exclusive right to receive income|$180,000; right to transfer|$180,000; exclusive right to use","$180,000；exclusive right to receive income|$150,000；exclusive right to receive income|$180,000；right to transfer|$180,000；exclusive right to use",,,A,"Multiply by 12. Is he using, selling, or earning from the flat?",乘 12。佢係自己用、賣咗，定係靠個單位收錢？,"$15,000 x 12 = $180,000. Earning rent from property is the exclusive right to receive income.","$15,000 x 12 = $180,000。靠物業收租係 exclusive right to receive income。"
deedtle-S2,deedtle,mc,scen,,"(Fictional) A rule says an owner of a Lantau village house may live in it and rent it out, but may not sell it for 10 years. Which statement is correct?",（虛構）有條規定話大嶼山村屋業主可以自住同出租，但 10 年內唔准賣。以下邊句啱？,"His right to use is restricted|His right to transfer is restricted, so his private property rights are incomplete|He still has complete private property rights|His right to receive income is removed",佢嘅 right to use 受限制|佢嘅 right to transfer 受限制，所以 private property rights 唔完整|佢仍然有完整嘅 private property rights|佢嘅 right to receive income 被取消,,,B,Which of the three rights is missing?,三種權利之中，邊種冇咗？,Complete private property rights need all three rights; banning sale removes the right to transfer.,完整嘅 private property rights 要有齊三種權利；唔准賣即係冇咗 right to transfer。
deedtle-S3,deedtle,sort,scen,,(Fictional) Ms Chan owns several assets. Which right is she exercising?,（虛構）陳小姐擁有幾樣資產，佢行使緊邊種權利？,exclusive right to use|exclusive right to receive income|right to transfer,exclusive right to use|exclusive right to receive income|right to transfer,she drives her own car to work|she stops others parking in her private parking space|she collects rent from her shop in Mui Wo|she receives dividends from shares she owns|she gives her flat to her daughter as a gift|she sells her old camera to a friend,佢揸自己架車返工|佢唔俾其他人泊佢嘅私人車位|佢收梅窩舖位嘅租|佢收自己持有股票嘅股息|佢將層樓送俾個女|佢將部舊相機賣俾朋友,1|1|2|2|3|3,"Is she using it, earning from it, or handing it to someone else?",佢係自己用、靠佢賺錢，定係交俾第二個？,Using or excluding others = right to use; rent and dividends = right to receive income; selling or giving away = right to transfer.,自己用或排除他人 = right to use；租金同股息 = right to receive income；賣出或送出 = right to transfer。
deedtle-S4,deedtle,fill,scen,,"(Fictional) Ah Kei owns 5 plots of farmland in Pui O and leases 2 of them at $3,000 per plot per month. His monthly rental income is $____, from his exclusive right to receive ____.","（虛構）阿基喺貝澳有 5 幅農地，將其中 2 幅出租，每幅每月 $3,000。佢每月租金收入係 $①，來自佢嘅 exclusive right to receive ②。",6000|15000|income|transfer,6000|15000|income|transfer,,,6000|income,How many plots are actually leased?,實際租出咗幾多幅？,"2 x $3,000 = $6,000. Only leased plots earn rent, through the exclusive right to receive income.","2 x $3,000 = $6,000。只有租出嘅地先有租金，來自 exclusive right to receive income。"
deedtle-S5,deedtle,tf,scen,,"(Fictional) Squatters use Mr Wong's empty land in Mui Wo without permission, and he has no legal way to stop them. His exclusive right to use the land is well protected.",（虛構）有人未經許可佔用黃生喺梅窩嘅空地，而佢冇法律途徑阻止。佢對呢塊地嘅 exclusive right to use 受到充分保障。,,,,,F,What does 'exclusive' mean?,「exclusive」係咩意思？,"Exclusive means the owner can exclude others; if he cannot stop the squatters, the right is not protected.",Exclusive 即係業主可以排除其他人；佢阻止唔到佔用者，即係權利冇受保障。
swapgull-01,swapgull,tf,,,Exchange must use money.,Exchange 一定要用錢。,,,,,F,Does barter use money?,以物易物用唔用錢？,Exchange can take place with or without the use of money.,交換可以用錢，亦可以唔用錢。
swapgull-02,swapgull,tf,,,Barter means direct exchange of goods without the use of money.,Barter 即係唔用錢，直接以物易物。,,,,,T,Glossary definition.,Glossary 定義。,Glossary: direct exchange of goods without the use of money.,Glossary：唔用錢嘅直接以物易物。
swapgull-03,swapgull,mc,,,(Fictional) Salt workers trade salt for rice; fishermen focus on fishing and trade fish for salt. This shows:,（虛構）鹽工用鹽換米，漁民專心打魚再用魚換鹽。呢個情況反映：,exchange makes specialisation possible|specialisation removes scarcity|government command|historical cost,exchange 令 specialisation 成為可能|specialisation 令 scarcity 消失|government command|historical cost,,,A,"Without exchange, would they dare to do only one thing?",冇得交換，佢哋敢唔敢淨做一樣？,Being able to exchange lets people specialise.,可以交換，先放心專做一樣嘢。
swapgull-04,swapgull,mc,,,Specialisation means:,Specialisation 係指：,different people or economies focus on producing different goods or different production stages of a good|everyone produces everything themselves|the government assigns everyone's job|no trade,不同人或經濟體專注生產不同物品，或者同一物品嘅不同生產階段|每個人自己生產所有嘢|政府指定每個人做乜|冇交易,,,A,Glossary definition.,Glossary 定義。,Glossary definition.,Glossary 定義。
swapgull-05,swapgull,fill,,,Specialisation occurs when different people focus on producing different ____ or different production ____ of a good.,Specialisation 係指不同人專注生產不同 ①，或者同一物品嘅不同生產 ②。,goods|stages|prices|rights,物品|階段|價格|權利,,,goods|stages,"One product, or one step.",專做一樣物品，或者一個工序。,Two ways to specialise.,兩種專注方式。
swapgull-06,swapgull,order,,,Put in order:,排次序：,,,private property rights|exchange|specialisation,私有產權|交換|專門化,,Which makes which possible?,邊個令邊個成為可能？,"Without property rights, exchange is hard; without exchange, no one dares to specialise.",冇業權就難交換，冇交換就唔敢專門化。
swapgull-07,swapgull,tf,,,"If exchange were impossible, a person who only dried salt would find it hard to live.",如果唔可以交換，一個人淨係專做曬鹽會好難生活。,,,,,T,What would he eat and wear?,佢食乜、住乜？,He needs to trade salt for other necessities.,佢需要用鹽換其他生活所需。
swapgull-08,swapgull,mc,,,"In Tai O some make shrimp paste, some salted fish, some fish. How do they mainly get other things they need?",大澳有人專做蝦醬、有人專做鹹魚、有人專打魚，佢哋之間主要靠咩取得其他所需？,exchange|scarcity|interest|discrimination,交換|稀少性|利息|歧視,,,A,"If you only make one thing, where do the others come from?",專做一樣，其他嘢點嚟？,Specialisation relies on exchange.,Specialisation 要靠 exchange 支撐。
swapgull-09,swapgull,mc,,,Fishermen trade fish for rice without money. This is called:,漁民用魚換米，冇用錢，呢種交易叫：,barter|command|interest|specialisation,以物易物|指令|利息|專門化,,,A,Exchange without money.,唔用錢嘅交換。,Barter is direct exchange of goods.,Barter 係直接以物易物。
swapgull-10,swapgull,tf,,,Specialisation can mean focusing on different production stages of the same good.,Specialisation 可以係專注生產同一物品嘅唔同生產階段。,,,,,T,Peeling and drying shrimp – same good?,剝蝦、曬蝦，係咪同一物品？,"E.g. one person only peels shrimp, another only dries them.",例如有人專剝蝦、有人專曬，都係 specialisation。
swapgull-11,swapgull,fill,,,Exchange can take place ____ or ____ the use of money.,交換可以 ① 或者 ② 使用金錢。,with|without|only|never,有|唔|只|永不,,,with|without,With money or without both work.,用錢同唔用錢都得。,Barter is exchange without money.,Barter 就係唔用錢。
swapgull-12,swapgull,sort,,,Specialisation or not?,有冇 specialisation？,specialisation|no specialisation,專門化|冇專門化,"some make shrimp paste, some fish|each family grows rice, fishes and dries salt itself|some only peel shrimp, some only dry them|doing everything yourself",有人專做蝦醬、有人專打魚|每家人自己種米、打魚、曬鹽|有人專責剝蝦、有人專責曬|自己做晒所有嘢,1|2|1|2,Does each person focus on one thing or do everything?,每個人係專做一樣，定乜都做？,Focusing on one good or one stage is specialisation.,專注生產某樣物品或某個階段先係 specialisation。
swapgull-S1,swapgull,mc,scen,,"(Fictional) Mei, a tailor in Sham Shui Po, sews shirts all day and never cooks. She buys all her meals from a cha chaan teng. What makes it possible for her to specialise like this?",（虛構）深水埗裁縫阿美成日淨係車恤衫，從來唔煮飯，三餐都喺茶餐廳買。佢可以咁樣 specialise，最主要係因為乜嘢？,She can exchange her shirts (or the money earned) for food|She has no wants for food|Food is a free good in Sham Shui Po|The government gives her meals for free,佢可以用恤衫（或者賺返嚟嘅錢）exchange 食物|佢對食物冇 wants|食物喺深水埗係 free good|政府免費派飯畀佢,,,A,"If she could not trade, where would her food come from?",如果佢唔可以交易，佢啲食物會喺邊度嚟？,Exchange enables specialisation: a person can focus on one good only if she can exchange it for the other goods she needs.,Exchange enables specialisation：一個人可以透過 exchange 攞到其他所需物品，先可以專注生產一樣嘢。
swapgull-S2,swapgull,tf,scen,,(Fictional) Ah Fai rents a flat in Tsuen Wan from a landlord. He cannot sell the flat to a buyer because he does not have the right to transfer it.,（虛構）阿輝喺荃灣向業主租咗一個單位。佢唔可以將個單位賣畀人，因為佢冇 right to transfer。,,,,,T,Which of the three private property rights does a tenant usually lack?,租客通常冇咗 private property rights 三種權利入面邊一種？,"A tenant has the right to use but not the right to transfer. Without the right to transfer, he cannot exchange (sell) the flat: private property rights enable exchange.",租客有 right to use，但冇 right to transfer，所以唔可以 exchange（賣）個單位。Private property rights enable exchange。
swapgull-S3,swapgull,sort,scen,,(Fictional) Classify each exchange in Tai Po:,（虛構）將以下大埔嘅交易分類：,barter (no money)|exchange with money,barter（冇用錢）|用錢嘅 exchange,a farmer swaps 3 kg of choi sum for 10 eggs|a student pays $20 for a bowl of noodles|a neighbour fixes a bike in return for a haircut|a tourist taps an Octopus card to buy a drink|two collectors swap stamps,農夫用 3 kg 菜心換 10 隻雞蛋|學生俾 $20 買一碗麵|鄰居幫人整單車，換返對方幫佢剪頭髮|遊客拍八達通買飲品|兩個集郵迷互相交換郵票,1|2|1|2|1,Is money used as the medium of exchange?,有冇用錢做交易媒介？,Barter is the direct exchange of goods or services without money; paying with cash or an Octopus card is exchange with money.,Barter 係唔用錢、直接以物易物（或服務）；用現金或八達通付款就係用錢嘅 exchange。
swapgull-S4,swapgull,mc,scen,,"(Fictional) In a Kwun Tong workshop, 3 workers each made whole toys: 30 toys a day in total. They then split the work into cutting, sewing and packing, and made 45 toys a day. Which is correct?",（虛構）觀塘一間工場有 3 個工人，以前每人由頭到尾整成件玩具，每日合共 30 件。後來分工做剪裁、車縫、包裝，每日整到 45 件。以下邊句啱？,Output rose by 15 toys (50%); this is specialisation in different production stages|Output rose by 15 toys (50%); this is specialisation in different goods|Output rose by 45 toys; this is barter|Output rose by 15 toys (33%); this is specialisation in different production stages,產量增加 15 件（50%）；呢個係喺不同 production stages 嘅 specialisation|產量增加 15 件（50%）；呢個係生產不同 goods 嘅 specialisation|產量增加 45 件；呢個係 barter|產量增加 15 件（33%）；呢個係喺不同 production stages 嘅 specialisation,,,A,"Compute 45 minus 30, then divide by the original 30. Are they making different goods or different steps of the same toy?",計吓 45 減 30，再除返原本嘅 30。佢哋係整唔同貨品，定係同一件玩具嘅唔同步驟？,"Increase = 45 - 30 = 15 toys, i.e. 15/30 = 50%. Each worker focuses on one stage of producing the same good: specialisation in different production stages.",增加 = 45 - 30 = 15 件，即 15/30 = 50%。每個工人專注同一貨品嘅其中一個步驟，係不同 production stages 嘅 specialisation。
swapgull-S5,swapgull,order,scen,,(Fictional) Put the chain of reasoning for a Lamma Island fishing village in order:,（虛構）將南丫島漁村嘅推理次序排好：,,,"Each fisherman has exclusive ownership of his catch|He can transfer the catch to others, so exchange takes place|Knowing he can get rice and oil by exchange, he fishes full-time|Specialisation raises the village's total output",每個漁民對自己嘅漁獲有 exclusive ownership|佢可以將漁獲 transfer 畀人，所以出現 exchange|知道可以透過 exchange 換到米同油，佢就全職打魚|Specialisation 令成條村嘅總產量增加,,What must exist before anyone can sell something?,要賣嘢之前，先要有乜嘢？,"Private property rights enable exchange, and exchange enables specialisation, which raises output.",Private property rights enable exchange，exchange enables specialisation，令產量增加。
queuepus-01,queuepus,tf,,,Scarcity leads to competition.,Scarcity 令 competition 出現。,,,,,T,"If there isn't enough, how do we decide who gets it?",唔夠分，點決定邊個有？,"When resources are not enough, we must decide who gets them.",資源唔夠分，就要決定邊個得到。
queuepus-02,queuepus,tf,,,"In economics, discrimination only means racial discrimination.",經濟學入面嘅 discrimination 只係指種族歧視。,,,,,F,What happens to losers in competition?,Competition 輸咗嘅人會點？,It refers to the losers in competition not getting the goods.,泛指 competition 入面輸咗嘅人得唔到物品。
queuepus-03,queuepus,mc,,,'Highest bidder wins' is:,價高者得屬於：,price competition|non-price competition|government command|barter,價格競爭|非價格競爭|政府指令|以物易物,,,A,What is the criterion?,準則係乜？,Price is the criterion.,以價格做準則。
queuepus-04,queuepus,mc,,,Queuing first come first served for yellow croaker is:,排隊先到先得買黃花魚屬於：,non-price competition|price competition|no competition|exchange,非價格競爭|價格競爭|冇競爭|交換,,,A,Is the criterion price or time?,準則係價格定時間？,"The criterion is order of arrival, not price.",準則係時間先後，唔係價格。
queuepus-05,queuepus,fill,,,Competition implies ____. Only winners can get the goods or resources.,Competition 意味住 ①。只有贏家先得到物品或資源。,discrimination|cooperation|scarcity|specialisation,歧視|合作|稀少性|專門化,,,discrimination,Losers don't get it.,輸咗嘅人得唔到。,Losers are 'discriminated against' – they do not get the goods.,輸咗嘅人被「歧視」，即係得唔到。
queuepus-06,queuepus,fill,,,The purpose of competition is to determine who can obtain the goods or resources and ____ they can get.,Competition 嘅目的係決定邊個得到物品或資源，同埋得到 ①。,how much|how|why|when,幾多|點樣|點解|幾時,,,how much,"Who, and…",邊個，同……,It decides 'who' and 'how much'.,決定「邊個」同「幾多」。
queuepus-07,queuepus,sort,,,Price or non-price competition?,Price 定 non-price competition？,price competition|non-price competition,價格競爭|非價格競爭,"the highest bidder buys it|queuing, first come first served|lottery|school admission by exam results|auctioning the catch|choosing by personal connections",出價最高嘅買家買到|排隊先到先得|抽籤|按考試成績收生|拍賣漁獲|按關係揀人,1|2|2|2|1|2,Is the criterion price?,準則係咪價格？,Check whether the criterion is price.,睇準則係咪價格。
queuepus-08,queuepus,mc,,,"During Hong Kong's 1963 water rationing, people queued with buckets for water. This is:",1963 年香港制水期間，市民拎住水桶排隊輪水。呢個係：,non-price competition|price competition|no competition|specialisation,非價格競爭|價格競爭|冇競爭|專門化,,,A,What decided who got water?,邊個攞到水靠乜？,"The criterion was queuing time and effort, not price.",準則係排隊時間同體力，唔係價格。
queuepus-09,queuepus,tf,,,Non-price competition also involves discrimination.,Non-price competition 都會有 discrimination。,,,,,T,What happens to those who don't get through the queue?,排隊排唔到嘅人會點？,"Every competition has losers, and losers are discriminated against.",任何 competition 都有輸家，輸家就被 discriminated against。
queuepus-10,queuepus,mc,,,Selling fresh catch by auction is:,用拍賣方式賣新鮮漁獲，屬於：,price competition|non-price competition|barter|government command,價格競爭|非價格競爭|以物易物|政府指令,,,A,What decides an auction?,拍賣靠乜決定？,The highest bid wins – price is the criterion.,出價最高者得，以價格做準則。
queuepus-11,queuepus,fill,,,Scarcity → ____ → discrimination.,Scarcity → ① → discrimination。,competition|exchange|specialisation|consumption,競爭|交換|專門化|消費,,,competition,Not enough → compete → some miss out.,唔夠分 → 爭 → 有人得唔到。,This is the textbook relationship diagram.,課本關係圖。
queuepus-12,queuepus,mc,,,Allocating stilt house spaces by lottery is:,按抽籤分配棚屋位屬於：,non-price competition|price competition|exchange|no competition,非價格競爭|價格競爭|交換|冇競爭,,,A,Does a lottery depend on price?,抽籤靠唔靠價格？,A lottery is a criterion other than price.,抽籤係價格以外嘅準則。
queuepus-S1,queuepus,mc,scen,,"(Fictional) A concert at the Hong Kong Coliseum has 10,000 seats but 80,000 fans apply online. Tickets are given by lucky draw at a fixed price. What is the criterion of discrimination here?","（虛構）紅館一場演唱會有 10,000 個位，但有 80,000 個 fans 網上申請，門票以固定價錢抽籤分配。呢度 discrimination 嘅準則係乜嘢？",luck|willingness and ability to pay the highest price|being first in the queue|age,運氣|願意兼有能力俾最高價|排頭位|年齡,,,A,Does paying more or arriving earlier help you win a lucky draw?,俾多啲錢或者早啲到，會唔會令你抽中？,"A lucky draw is non-price competition; the winners are chosen by luck, so luck is the criterion of discrimination.",抽籤係 non-price competition，靠運氣決定邊個得到，所以 discrimination 嘅準則係運氣。
queuepus-S2,queuepus,sort,scen,,(Fictional) Price or non-price competition among buyers?,（虛構）以下買家之間係 price 定 non-price competition？,price competition|non-price competition,price competition|non-price competition,a rare car plate goes to the highest bidder at auction|free flu shots at a clinic go to the first 100 people in line|a Sai Kung sea-view flat is sold to the buyer offering the most|a school picks students by interview performance|free seats on a harbour tour are drawn by lottery,一個罕有車牌拍賣，出價最高者得|診所免費流感針，排頭 100 個先有|西貢海景單位賣畀出價最高嘅買家|學校按面試表現揀學生|維港遊免費座位以抽籤分配,1|2|1|2|2,"Is the winner decided by who pays the most, or by something else?",決定邊個得到嘅，係邊個俾錢最多，定係其他準則？,"Price competition: the good goes to those who pay the highest price. Non-price competition uses other criteria such as queuing, luck or merit.",Price competition：俾最高價者得。Non-price competition 用其他準則，例如排隊、運氣、表現。
queuepus-S3,queuepus,mc,scen,,"(Fictional) A Central restaurant has one table left for Christmas Eve. Three customers bid for it: A $500, B $800, C $650. Under price competition, who gets it and how many customers are discriminated against?",（虛構）中環一間餐廳平安夜淨返一張枱，三個客人出價：A $500、B $800、C $650。用 price competition，邊個得到？有幾多個客人被 discriminate？,B gets it; 2 customers are discriminated against|A gets it; 2 customers are discriminated against|B gets it; no one is discriminated against|C gets it; 1 customer is discriminated against,B 得到；2 個客人被 discriminate|A 得到；2 個客人被 discriminate|B 得到；冇人被 discriminate|C 得到；1 個客人被 discriminate,,,A,"Under price competition, which bid wins? Are the losers excluded?",Price competition 之下，邊個出價會贏？輸咗嘅人係咪被排除？,"The highest bidder (B, $800) wins; A and C are excluded, so 2 are discriminated against. Competition implies discrimination.",出價最高嘅 B（$800）得到，A 同 C 被排除，即 2 人被 discriminate。Competition implies discrimination。
queuepus-S4,queuepus,fill,scen,,"(Fictional) Only 50 free Ngong Ping 360 tickets are offered but 300 people want them. Because of ____, people ____ for them, and the rule 'first 50 in line' is the basis of ____.",（虛構）只有 50 張免費昂坪 360 門票，但有 300 人想要。因為 ①，大家要 ②，而「排頭 50 個先有」就係 ③ 嘅準則。,scarcity|compete|discrimination|production,scarcity|競爭|discrimination|production,,,scarcity|compete|discrimination,What is the chain that starts when wants exceed the quantity available?,想要嘅數量多過可以提供嘅數量，會引發咩連鎖關係？,"Scarcity leads to competition; competition implies discrimination, here by queuing (non-price competition).",Scarcity 引致 competition，competition implies discrimination；呢度用排隊（non-price competition）做準則。
queuepus-S5,queuepus,tf,scen,,"(Fictional) A Mong Kok toy shop sells a hot new toy only to those who pay $2,000. Since anyone can pay, no one is discriminated against.","（虛構）旺角一間玩具舖將一款熱門新玩具以 $2,000 出售，俾得起就買到。因為人人都可以俾錢，所以冇人被 discriminate。",,,,,F,"Can everyone afford or be willing to pay $2,000?","係咪人人都俾得起、或者願意俾 $2,000？",Price competition also discriminates: people unwilling or unable to pay the price are excluded. Every form of competition implies discrimination.,Price competition 都有 discrimination：唔願意或冇能力俾錢嘅人被排除。任何 competition 都 implies discrimination。
triactiv-01,triactiv,tf,,,Consumption refers to the activity to satisfy human wants directly.,Consumption 係直接滿足人類 wants 嘅活動。,,,,,T,Glossary definition.,Glossary 定義。,This is the glossary definition.,Glossary 定義。
triactiv-02,triactiv,tf,,,Turning silver shrimp into shrimp paste is consumption.,將銀蝦曬成蝦醬係 consumption。,,,,,F,Is this turning inputs into output?,呢個係將 inputs 變成 output 嗎？,Turning inputs into output is production.,將 inputs 變成 output，係 production。
triactiv-03,triactiv,mc,,,A tourist buying shrimp paste at Tai O market is:,遊客喺大澳街市買蝦醬屬於：,exchange|production|consumption|none of these,交換|生產|消費|以上皆非,,,A,What kind of activity is buying and selling?,買賣係邊種活動？,Buying and selling is exchange.,買賣即係交換。
triactiv-04,triactiv,mc,,,A tourist eating shrimp paste fried rice is:,遊客食蝦醬炒飯屬於：,consumption|production|exchange|none of these,消費|生產|交換|以上皆非,,,A,It satisfies wants directly.,直接滿足 wants。,It satisfies wants directly.,直接滿足 wants。
triactiv-05,triactiv,fill,,,Production refers to the activity of turning ____ into ____.,Production 係將 ① 變成 ② 嘅活動。,inputs|output|wants|money,投入|產出|慾望|金錢,,,inputs|output,Inputs become output.,投入變產出。,This is the glossary definition.,Glossary 定義。
triactiv-06,triactiv,sort,,,"Production, exchange or consumption?",Production、exchange 定 consumption？,production|exchange|consumption,生產|交換|消費,fishermen catching silver shrimp|drying shrimp paste|buying and selling at the market|a tourist eating shrimp paste fried rice|trading salt for rice|a tour guide explaining to a group,漁民捉銀蝦|曬蝦醬|街市買賣|遊客食蝦醬炒飯|鹽換米|導遊帶團講解,1|1|2|3|2|1,Is guiding a tour providing a service?,導遊講解係咪提供服務？,Trap: providing services is also production.,陷阱：提供服務都係 production。
triactiv-07,triactiv,tf,,,Providing services (e.g. a tour guide explaining) is also production.,提供服務（例如導遊講解）都係 production。,,,,,T,Is a service an output?,服務係唔係 output？,Services are output too.,服務都係 output。
triactiv-08,triactiv,mc,,,Firms are ____ units and households are ____ units:,Firms 係 ____ 單位，households 係 ____ 單位：,"production, consumption|consumption, production|exchange, production|consumption, exchange",生產、消費|消費、生產|交換、生產|消費、交換,,,A,"Who produces, who consumes?",邊個生產、邊個消費？,Glossary: firms are production units; households are consumption units.,Glossary：firms 係生產單位；households 係消費單位。
triactiv-09,triactiv,tf,,,Exchange can take place without money.,Exchange 可以唔用錢。,,,,,T,Does barter use money?,Barter 用唔用錢？,Barter is exchange without money.,Barter 就係唔用錢嘅交換。
triactiv-10,triactiv,mc,,,Fishermen selling silver shrimp to a shrimp paste factory is:,漁民將銀蝦賣俾蝦醬工場，屬於：,exchange|production|consumption|none of these,交換|生產|消費|以上皆非,,,A,Is this step buying/selling or producing?,呢一步係買賣定生產？,Selling is exchange.,賣出係交換。
triactiv-11,triactiv,fill,,,"Firms are ____ units, and households are ____ units.",Firms 係 ① 單位，households 係 ② 單位。,production|consumption|exchange|government,生產|消費|交換|政府,,,production|consumption,What do factories and families each do?,工場同家庭各做乜？,This is the glossary definition.,Glossary 定義。
