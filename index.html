clusterswift-04,clusterswift,mc,,,Which of the following is an example of external economies of scale for a garment factory?,以下邊項係製衣廠嘅 external economies of scale 例子？,"It buys cloth in bulk at a discount.|It gets a lower interest rate because it is large.|Its managers cannot coordinate its many floors.|Many garment factories cluster in the district, so it is easier and cheaper to recruit experienced workers.",佢大量買布，有折扣。|佢規模大，借錢利率較低。|佢嘅管理層協調唔到咁多層廠房。|好多製衣廠聚集喺區內，所以請熟手工人更容易、更平。,,,D,Which benefit comes from the growth of the whole industry around the firm?,邊個好處係來自 firm 周圍成個行業嘅擴張？,A pool of experienced workers forms when the industry grows: an external economy. Bulk-buying and low interest rates are internal economies; poor coordination is an internal diseconomy.,行業擴張令區內有一班熟手工人，係 external economy。大量採購同低利率係 internal economies；協調差係 internal diseconomy。
clusterswift-05,clusterswift,mc,,,What is the key difference between internal and external economies of scale?,Internal 同 external economies of scale 最主要嘅分別係乜？,Internal economies are short run; external economies are long run.|Internal economies depend on the firm's own scale; external economies depend on the industry's scale.|Internal economies raise LRAC; external economies lower LRAC.|Only large firms enjoy external economies.,Internal economies 係 short run；external economies 係 long run。|Internal economies 取決於 firm 自己嘅規模；external economies 取決於行業嘅規模。|Internal economies 令 LRAC 上升；external economies 令 LRAC 下跌。|只有大 firm 先享有 external economies。,,,B,Whose expansion causes the lower cost in each case?,每種情況入面，係邊個擴張令成本下降？,Both are long-run concepts and both lower LRAC. The difference is the source: the firm's own scale (internal) or the industry's scale (external).,兩者都係 long run 概念，亦都令 LRAC 下跌。分別在於來源：firm 自己嘅規模（internal）定行業嘅規模（external）。
clusterswift-06,clusterswift,mc,,,Which of the following is an example of external diseconomies of scale?,以下邊項係 external diseconomies of scale 嘅例子？,"Too many factories crowd into the district, so rents and wages of skilled workers are bid up.|A firm's head office becomes slow in making decisions.|Suppliers of buttons open shops near the factories.|A firm hires more workers for its fixed machines and MP falls.",太多工廠擠入區內，租金同熟手工人工資被推高。|一間 firm 嘅總部決策變慢。|鈕扣供應商喺工廠附近開舖。|firm 為固定機器請多啲工人，MP 下跌。,,,A,Which problem is caused by the industry growing too much?,邊個問題係因為行業擴張得太過份而引起？,Excessive industry expansion raises input costs for every firm: external diseconomies. Slow head office is internal; nearby suppliers are an external economy; the last is the short-run law.,行業過度擴張令每間 firm 嘅投入成本上升：external diseconomies。總部慢係 internal；供應商聚集係 external economy；最後一個係 short run 定律。
clusterswift-07,clusterswift,mc,,,"As more garment factories open, suppliers of zips, buttons and cloth set up nearby. For each garment factory, this:",製衣廠越開越多，拉鏈、鈕扣同布料供應商都喺附近開舖。對每間製衣廠嚟講，呢個：,raises LRAC through internal diseconomies|has no effect because the factory did not expand|lowers sourcing costs: an external economy of scale|lowers MP through the law of diminishing marginal returns,透過 internal diseconomies 令 LRAC 上升|冇影響，因為工廠冇擴充|降低採購成本：external economy of scale|透過 law of diminishing marginal returns 令 MP 下降,,,C,Is it cheaper or dearer to buy inputs when suppliers are next door?,供應商喺隔籬，買投入會平啲定貴啲？,"Suppliers clustering near an expanding industry lower each firm's sourcing costs, even if the firm itself did not expand: an external economy.",供應商聚集喺擴張中嘅行業附近，降低每間 firm 嘅採購成本，即使 firm 本身冇擴充：external economy。
clusterswift-08,clusterswift,fill,,,"When the ____ expands and each firm's LRAC ____, firms enjoy external economies of scale.",當 ① 擴張而每間 firm 嘅 LRAC ②，firms 就享有 external economies of scale。,industry|firm|falls|rises,行業|firm|下跌|上升,,,industry|falls,Whose expansion does 'external' refer to? Are economies good or bad for cost?,「External」指邊個嘅擴張？Economies 對成本係好事定壞事？,External economies: industry expansion lowers each firm's LRAC.,External economies：行業擴張令每間 firm 嘅 LRAC 下跌。
clusterswift-09,clusterswift,fill,,,External ____ of scale occur when the industry expands excessively and input costs ____.,當行業過度擴張，投入成本 ②，就出現 external ① of scale。,diseconomies|economies|rise|fall,diseconomies|economies|上升|下跌,,,diseconomies|rise,"When too many firms compete for the same inputs, what happens to their prices?",太多 firm 爭同一啲投入，佢哋嘅價格會點？,"Excessive industry expansion bids up input costs, raising each firm's LRAC: external diseconomies.",行業過度擴張推高投入成本，令每間 firm 嘅 LRAC 上升：external diseconomies。
clusterswift-10,clusterswift,sort,,,"For a Cheung Sha Wan garment factory, sort each cost-saving:",對長沙灣一間製衣廠嚟講，將每個節省成本嘅原因分類：,internal economies of scale|external economies of scale,internal economies of scale|external economies of scale,"it buys cloth in bulk because it has grown larger|cloth stalls cluster nearby, so fabric is cheaper to source|it gets a lower interest rate as a large firm|many experienced sewing workers live in the district|better roads are built to serve the growing industry|its own R&D cost is spread over a larger output",佢規模大咗，大量買布|附近聚集咗好多布檔，搵布更平|佢係大 firm，借錢利率較低|區內有好多熟手車衣工人|為咗服務擴張中嘅行業，興建咗更好嘅道路|佢自己嘅 R&D 成本攤喺更大嘅產量上,1|2|1|2|2|1,Is the saving due to the firm's own growth or the industry's growth?,節省成本係因為 firm 自己擴張，定係行業擴張？,"Internal: bulk-buying, lower interest rate, R&D spread over own output. External: supplier clustering, pool of skilled workers, better transport as the industry grows.",Internal：大量採購、較低利率、R&D 攤喺自己嘅產量。External：供應商聚集、熟手工人、行業擴張帶嚟更好嘅交通。
clusterswift-11,clusterswift,sort,,,The garment industry in a district keeps expanding. Sort each effect on a firm there:,某區嘅製衣業不斷擴張。將對區內 firm 嘅每個影響分類：,external economies of scale|external diseconomies of scale,external economies of scale|external diseconomies of scale,"it is cheaper to recruit experienced workers|suppliers nearby lower sourcing costs|buyers know the district, so marketing costs fall|too many factories compete for space, so rents soar|wages of skilled workers are bid up|traffic congestion raises delivery costs",請熟手工人更平|附近嘅供應商降低採購成本|買家都識呢區，宣傳成本下降|太多工廠爭地方，租金飆升|熟手工人嘅工資被推高|交通擠塞令運輸成本上升,1|1|1|2|2|2,Does each effect lower or raise the firm's LRAC?,每個影響會令 firm 嘅 LRAC 下跌定上升？,Industry growth first lowers each firm's LRAC (external economies); excessive growth raises input and transport costs (external diseconomies).,行業擴張起初令每間 firm 嘅 LRAC 下跌（external economies）；過度擴張會推高投入同運輸成本（external diseconomies）。
clusterswift-12,clusterswift,mc,,,How do external economies of scale affect a firm's LRAC curve?,External economies of scale 對 firm 嘅 LRAC 曲線有咩影響？,The firm moves down along its own LRAC curve.|The whole LRAC curve shifts downward.|The whole LRAC curve shifts upward.|The firm moves up along its LRAC curve past the optimal scale.,Firm 沿住自己嘅 LRAC 曲線向下移動。|成條 LRAC 曲線向下移。|成條 LRAC 曲線向上移。|Firm 沿住 LRAC 曲線向上移動，超過 optimal scale。,,,B,Does the firm change its own scale when the industry grows?,行業擴張嘅時候，firm 有冇改變自己嘅規模？,"A change in the firm's own scale is a movement along its LRAC (internal). An outside factor such as industry growth lowers cost at every scale, so the LRAC curve shifts downward.",Firm 自己規模改變係沿 LRAC 移動（internal）。行業擴張呢類外在因素令每個規模嘅成本都下降，所以 LRAC 曲線向下移。
clusterswift-S1,clusterswift,mc,scen,,"(Fictional) In the 1970s, more and more cloth stalls open on one street in Sham Shui Po. Mrs Lee's small garment workshop stays the same size, but she can now buy fabric more cheaply and quickly. This is:",（虛構）1970 年代，深水埗一條街開咗越來越多布檔。李太嘅細製衣工場規模冇變，但佢而家買布平咗又快咗。呢個係：,an internal economy of scale|the law of diminishing marginal returns|an external economy of scale|an external diseconomy of scale,internal economy of scale|law of diminishing marginal returns|external economy of scale|external diseconomy of scale,,,C,"Did Mrs Lee's workshop grow, or did something around it grow?",李太嘅工場擴大咗，定係佢周圍嘅嘢擴大咗？,Her own scale did not change. The cost saving comes from suppliers clustering as the industry grows: an external economy.,佢自己嘅規模冇變。成本下降係因為行業擴張令供應商聚集：external economy。
clusterswift-S2,clusterswift,sort,scen,,(Fictional) Many design studios move into one Hong Kong district. Sort each effect on a studio there:,（虛構）好多設計工作室搬入香港某一區。將對區內工作室嘅每個影響分類：,external economy|internal economy|external diseconomy,external economy|internal economy|external diseconomy,"it can hire experienced designers easily because many live and work in the district|printing shops open nearby, lowering its sourcing costs|it grows larger and buys software licences in bulk at a lower average cost|rents in the district soar as too many studios move in|designers' wages are bid up by the crowd of studios",區內好多有經驗嘅設計師，佢容易請到人|附近開咗印刷舖，採購成本下降|佢規模變大，大量買軟件授權，平均成本較低|太多工作室搬入，區內租金飆升|工作室太多，設計師工資被推高,1|1|2|3|3,"For each effect: whose scale matters, and does cost fall or rise?",每個影響：係邊個嘅規模起作用？成本下跌定上升？,Industry growth lowering cost = external economy; the studio's own growth lowering cost = internal economy; excessive industry growth raising input costs = external diseconomy.,行業擴張令成本下降 = external economy；工作室自己擴張令成本下降 = internal economy；行業過度擴張推高投入成本 = external diseconomy。
clusterswift-S3,clusterswift,fill,scen,,"(Fictional) Mrs Lee's LRAC was $50 per dozen garments. After the district's garment industry expanded, and without any change in her own scale, it fell to $44. Her LRAC fell by $____, which is an example of external ____ of scale.",（虛構）李太每打衫嘅 LRAC 原本係 $50。區內製衣業擴張之後，佢自己規模冇變，LRAC 跌到 $44。佢嘅 LRAC 跌咗 $①，係 external ② of scale 嘅例子。,6|94|economies|diseconomies,6|94|economies|diseconomies,,,6|economies,Subtract the new LRAC from the old one. Did cost fall or rise?,將舊 LRAC 減新 LRAC，成本係跌咗定升咗？,"50 − 44 = 6. LRAC fell because the industry expanded, not her own firm: external economies of scale.",50 − 44 = 6。LRAC 下跌係因為行業擴張，唔係佢自己擴充：external economies of scale。
clusterswift-S4,clusterswift,mc,scen,,"(Fictional) Later, so many factories crowd into the district that rents and wages soar. Mrs Lee's LRAC rises from $44 to $48 although her scale is unchanged. This is caused by:",（虛構）後來太多工廠擠入區內，租金同工資飆升。李太規模冇變，但佢嘅 LRAC 由 $44 升到 $48。呢個係因為：,external diseconomies of scale|internal diseconomies of scale|internal economies of scale|a fall in MC,external diseconomies of scale|internal diseconomies of scale|internal economies of scale|MC 下跌,,,A,"Whose expansion caused the higher cost, and did cost rise or fall?",係邊個嘅擴張令成本上升？成本係升定跌？,"The industry expanded excessively, bidding up input costs, so her LRAC rose even though her own scale did not change: external diseconomies.",行業過度擴張推高投入成本，所以即使佢自己規模冇變，LRAC 都上升：external diseconomies。
clusterswift-S5,clusterswift,tf,scen,,"(Fictional) Mr Chow enlarged his own factory and his LRAC fell. His neighbour Mrs Lee did not expand, but her LRAC also fell because the industry grew. Mr Chow enjoyed internal economies and Mrs Lee enjoyed external economies of scale.",（虛構）周生擴大自己嘅工廠，佢嘅 LRAC 下跌。隔籬嘅李太冇擴充，但因為行業擴張，佢嘅 LRAC 都下跌。周生享有 internal economies，李太享有 external economies of scale。,,,,,T,"For each person, whose scale changed?",對每個人嚟講，係邊個嘅規模改變咗？,Own-scale expansion lowering LRAC = internal economies (Mr Chow). Industry expansion lowering LRAC = external economies (Mrs Lee).,自己規模擴大令 LRAC 下跌 = internal economies（周生）。行業擴張令 LRAC 下跌 = external economies（李太）。
boss_fubak-01,boss_fubak,mc,,,"Grandpa chooses to keep drying salt ($120/month) instead of factory work ($180, plus $20 fares) or fishing ($150). His opportunity cost is:",阿爺揀繼續曬鹽（每月 $120），放棄工廠打工（$180，另加車費 $20）同打魚（$150），opportunity cost 係：,$180 (factory work)|$150 (fishing)|$330 (both together)|$120 (salt),$180（工廠打工）|$150（打魚）|$330（兩樣加埋）|$120（曬鹽）,,,A,"Which two are given up? Even after fares, is the factory still highest?",放棄咗邊兩樣？就算扣埋車費，工廠仲係咪最高？,"Only the highest-valued option forgone counts. Even net of fares, the factory ($160) beats fishing ($150).",只計最高價值嘅放棄選項。就算扣埋車費，工廠淨值 $160 仍然高過打魚 $150。
boss_fubak-02,boss_fubak,fill,,,"Grandpa's father spent $3,000 building the salt pans in the 1940s. That money is a ____ cost and should not affect the decision.","阿爺嘅阿爸 1940 年代起鹽田用咗 $3,000，呢筆錢係 ① cost，唔應該影響決定。",historical|money|time|full,歷史|金錢|時間|全部,,,historical,Can that money be recovered whatever he chooses today?,嗰筆錢今日點揀都拎唔拎得返？,Historical cost is not a cost.,Historical cost 唔係 cost。
boss_fubak-03,boss_fubak,mc,,,"If Grandpa chooses factory work instead, the full cost is:",如果阿爺改揀工廠打工，full cost 係：,$170|$20|$150|$200,$170|$20|$150|$200,,,A,Money cost is the fare; non-money cost is the best alternative use of his time – which is?,Money cost 係車費；non-money cost 係佢時間嘅最佳其他用途，即係邊樣？,Money cost $20 + non-money cost $150 (best alternative use of time: fishing) = $170.,Money cost $20 + non-money cost $150（時間最佳其他用途：打魚）= $170。
boss_fubak-04,boss_fubak,tf,,,"If factory pay rises to $220, Grandpa's opportunity cost of drying salt rises.",工廠人工升到 $220，阿爺繼續曬鹽嘅 opportunity cost 會上升。,,,,,T,Is the factory the highest-valued option forgone?,工廠係咪被放棄嘅最高價值選項？,"The highest-valued option forgone became more valuable, so opportunity cost rises.",被放棄嘅最高價值選項價值上升，opportunity cost 上升。
boss_fubak-05,boss_fubak,mc,,,"Grandpa wants to borrow to buy a motorised boat. If the interest rate rises, his willingness to borrow will:",阿爺想借錢買機動船出海。利率上升，佢借錢嘅意願會：,fall|rise|stay the same|cannot be determined,下降|上升|不變|無法判斷,,,A,Does the cost of earlier availability rise or fall?,提早得到資源嘅成本變高定變低？,Higher interest rate → higher cost of earlier availability → lower willingness to borrow.,利率上升 → 提早得到資源嘅成本上升 → 借錢意願下降。
boss_fubak-06,boss_fubak,sort,,,Last question: free good or economic good?,最後一題：free good 定 economic good？,free good|economic good,免費物品|經濟物品,seawater in the ocean|sun-dried salt|sunlight|salted fish,大海嘅海水|曬好嘅鹽|陽光|鹹魚,1|2|1|2,Is the quantity enough for everyone?,數量夠唔夠滿足所有人？,Seawater and sunlight are sufficient; salt and salted fish need scarce resources.,海水同陽光數量夠晒；鹽同鹹魚要用 scarce resources 生產。
boss_hoitse-01,boss_hoitse,sort,,,Which basic economic problem does each villager proposal belong to?,村民嘅提議屬於邊個基本經濟問題？,what|how|for whom,生產咩|點生產|為誰生產,switch to vegetables or oysters|by hand or by machine|share the catch by highest bid or by seniority,改種菜定養蠔|用人手定用機器|漁獲按價高者得定按輩份分,1|2|3,"What, how, or for whom?",揀緊生產咩、點生產，定係俾邊個？,"The three problems: what, how, for whom.",三個問題：生產咩、點生產、俾邊個。
boss_hoitse-02,boss_hoitse,mc,,,Cheaper imported salt made Tai O's salt industry decline. This reflects which method?,入口鹽較平，令大澳鹽業式微，反映邊種解決方法？,market mechanism|government command|customs and traditions|barter,市場機制|政府指令|習俗與傳統|以物易物,,,A,Did anyone order salt workers to stop?,有冇人下命令叫鹽工停手？,Price signals moved resources away; no one gave orders.,價格訊號令資源流走，冇人下令。
boss_hoitse-03,boss_hoitse,order,,,Put in order:,排出次序：,,,private property rights|exchange|specialisation,私有產權|交換|專門化,,Which makes which possible?,邊個令邊個成為可能？,Clear ownership → confident exchange → confident specialisation.,業權清楚 → 放心交換 → 放心專門化。
boss_hoitse-04,boss_hoitse,sort,,,Complete the circular flow:,完成 circular flow 圖：,households→firms (factor market)|firms→households (factor market)|firms→households (product market)|households→firms (product market),住戶→廠商（生產要素市場）|廠商→住戶（生產要素市場）|廠商→住戶（產品市場）|住戶→廠商（產品市場）,factor services|factor income|goods and services|households' expenditure,生產要素服務|要素收入|物品與服務|住戶支出,1|2|3|4,"Each market: one real flow, one money flow.",每個市場一條實物、一條錢。,Each market has a real flow and a money flow going in opposite directions.,每個市場都有一條 real flow 同一條 money flow，方向相反。
boss_hoitse-05,boss_hoitse,sort,,,Villagers' remarks: positive or normative?,村民講嘅說話：positive 定 normative？,positive|normative,實證性|規範性,A road into Tai O was built in 1969–1970|Salt workers should get subsidies|Tai O's population began falling in the 1970s|Stilt houses are the most beautiful buildings|Imported salt is cheaper than local salt,1969–1970 年大澳要起公路|鹽工應該有補助|大澳人口喺 1970 年代開始下降|棚屋係最靚嘅建築|入口鹽比本地鹽平,1|2|1|2|1,Can facts refute it?,可唔可以用事實推翻？,Positive can be refuted by facts; normative is a value judgement.,Positive 可以用事實推翻；normative 係價值判斷。
boss_hoitse-06,boss_hoitse,mc,,,"With fewer yellow croakers, the fish stall switches to first come first served. This is:",黃花魚少咗，魚檔改做排隊先到先得，屬於：,non-price competition|price competition|government command|exchange,非價格競爭|價格競爭|政府指令|交換,,,A,Is price the criterion?,準則係價格嗎？,"The criterion is order of arrival, not price.",準則係時間先後，唔係價格。
boss_maytse-01,boss_maytse,mc,,,"(Fictional) In May's line, one worker cuts cloth, one sews sleeves, one irons and one packs the same shirts. This is:",（虛構）May 姐條線：一個工人剪布、一個車袖、一個熨衫、一個包裝，全部都係同一款恤衫。呢個係：,simple division of labour|regional division of labour|complex division of labour|no division of labour,simple division of labour|regional division of labour|complex division of labour|冇分工,,,C,"Are the workers making different goods, or different stages of one good?",佢哋做緊唔同物品，定係同一件物品嘅唔同工序？,Different workers specialise in different production stages of one good: complex division of labour.,唔同工人專門做同一物品嘅唔同工序，係 complex division of labour。
boss_maytse-02,boss_maytse,sort,,,(Fictional) The factory's things: public good or private good?,（虛構）以下嘢屬 public good 定 private good？,private good|public good,private good|public good,the shirts sewn for export|a lighthouse guiding cargo ships|a public housing flat for May's family|a street lamp outside the factory,出口嘅恤衫|為貨船導航嘅燈塔|May 姐一家住嘅公屋單位|工廠門外嘅街燈,1|2|1|2,Is it rival and excludable? Does it matter who provides it?,佢係咪 rival 同 excludable？邊個提供重唔重要？,"Public goods are non-rival and non-excludable; a government-provided flat is still rival and excludable, so it is a private good.",Public goods 係 non-rival 同 non-excludable；政府提供嘅單位仍然 rival 同 excludable，所以係 private good。
boss_maytse-03,boss_maytse,fill,,,"(Fictional) The line has 12 machinists, each working 9 hours a day, and they sew 540 shirts a day. Labour supply is ____ man-hours and labour productivity is ____ shirts per man-hour.",（虛構）條線有 12 個車衣女工，每人每日做 9 個鐘，每日車 540 件恤衫。Labour supply 係 ① man-hours，labour productivity 係每工時 ② 件。,108|5|45|12,108|5|45|12,,,108|5,Multiply workers by hours first. Then divide output by what?,先將工人數目乘平均工時。之後產量要除以乜？,Labour supply = 12 × 9 = 108 man-hours; productivity = 540 ÷ 108 = 5 shirts per man-hour (not per worker).,Labour supply = 12 × 9 = 108 man-hours；productivity = 540 ÷ 108 = 每工時 5 件（唔係每個工人）。
boss_maytse-04,boss_maytse,mc,,,"(Fictional) Machinists are paid $1 per shirt. Why does the factory like this method, and what must it watch?",（虛構）車衣女工每件恤衫 $1。點解工廠鍾意呢個方法？佢要留意乜？,Time rate; it must watch punctuality|Piece rate; it must check the quality of output|Commission; it must watch sales|Profit-sharing; it must publish profits,Time rate；要留意準時|Piece rate；要檢查產品質素|Commission；要留意銷售額|Profit-sharing；要公開利潤,,,B,Is pay linked to output or to time? What might workers sacrifice to sew faster?,人工同產量掛鈎，定同時間掛鈎？工人為咗車快啲，可能犧牲乜？,"Pay per unit of output is piece rate: strong incentive, but a higher cost of monitoring quality.",按件計係 piece rate：誘因強，但監察質素嘅成本較高。
boss_maytse-05,boss_maytse,fill,,,"(Fictional) The factory rents its floor for $3,000 a month. TVC is $4,000 for 1,000 shirts and $4,800 for 1,200 shirts. AC at 1,200 shirts is $____ and the MC of each of the extra 200 shirts is $____.","（虛構）工廠每月租金 $3,000。車 1,000 件恤衫嘅 TVC 係 $4,000，車 1,200 件係 $4,800。1,200 件時嘅 AC 係 $①，多出嚟 200 件每件嘅 MC 係 $②。",6.5|4|2.5|19,6.5|4|2.5|19,,,6.5|4,AC needs TC. Does the rent affect the extra cost of more shirts?,計 AC 要用 TC。租金會唔會影響多車啲恤衫嘅額外成本？,"TC = 3,000 + 4,800 = 7,800, so AC = 7,800 ÷ 1,200 = $6.5. MC = (4,800 − 4,000) ÷ 200 = $4 per shirt; the rent is a fixed cost and does not affect MC.","TC = 3,000 + 4,800 = 7,800，所以 AC = 7,800 ÷ 1,200 = $6.5。MC = (4,800 − 4,000) ÷ 200 = 每件 $4；租金係 fixed cost，唔影響 MC。"
boss_maytse-06,boss_maytse,sort,,,(Fictional) Which concept explains each change in the factory?,（虛構）以下每個變化用邊個概念解釋？,law of diminishing marginal returns|internal economies of scale|external economies of scale,law of diminishing marginal returns|internal economies of scale|external economies of scale,adding a 13th machinist to the same 12 machines adds fewer shirts|the factory moves to three floors and buys cloth in bulk|more button and zip suppliers open nearby as the industry grows,同樣 12 部衣車加第 13 個女工，多出嘅恤衫少咗|工廠擴到三層樓，大量入布|行業擴張，附近開多咗鈕扣同拉鏈供應商,1|2|3,Is there a fixed factor? Is it the firm or the whole industry that grows?,有冇 fixed factor？擴張嘅係廠商自己，定係成個行業？,Short run with a fixed factor → diminishing marginal returns; own scale → internal; industry scale → external.,有 fixed factor 嘅 short run → diminishing marginal returns；自己規模 → internal；行業規模 → external。
hard_fubak-01,hard_fubak,dse,dse,,"(Fictional) Grandpa keeps drying salt ($120/month). He gave up factory work ($180/month, $20 monthly fares) and fishing ($150/month). As Tai O's yellow croaker catch fell, fishing income drops to $100. Explain whether his opportunity cost of drying salt changes. (3 marks)",（虛構）阿爺繼續曬鹽（每月 $120），放棄咗工廠打工（每月 $180，車費每月 $20）同打魚（每月 $150）。大澳黃花魚漁獲下跌，打魚收入跌到 $100。解釋阿爺曬鹽嘅 opportunity cost 會唔會改變。（3 分）,"Opportunity cost is the value of the highest-valued option forgone when a choice is made.|Even after the $20 fares, factory work is still the highest-valued option forgone, worth more than fishing at $150 or $100.|So the fall in fishing income does not change his opportunity cost of drying salt, which is still the value of factory work.|His opportunity cost falls from $330 to $280, because both forgone options must be added together.|His opportunity cost falls, because one of the options he gave up has become less valuable.|His opportunity cost is $120, the income he earns from drying salt.|Fishing is his opportunity cost because, unlike factory work, it needs no fares.",Opportunity cost 係作出選擇時，被放棄嘅最高價值選項嘅價值。|就算扣埋 $20 車費，工廠打工仍然係被放棄嘅最高價值選項，高過打魚嘅 $150 或 $100。|所以打魚收入下跌唔會改變佢曬鹽嘅 opportunity cost，仍然係工廠打工嘅價值。|佢嘅 opportunity cost 由 $330 跌到 $280，因為兩個被放棄嘅選項要加埋一齊計。|佢嘅 opportunity cost 下降，因為其中一個被放棄嘅選項價值下跌咗。|佢嘅 opportunity cost 係 $120，即係曬鹽賺到嘅收入。|打魚先係佢嘅 opportunity cost，因為唔似工廠打工，打魚唔使俾車費。,,,1|2|3,"Which option forgone is worth the most, before and after the change?",改變之前同之後，被放棄嘅選項之中邊個價值最高？,"1 mark for the definition (highest-valued option forgone only), 1 mark for applying it (factory work is still highest), 1 mark for the conclusion (no change). Adding options together is a classic error.",定義 1 分（只計最高價值嘅放棄選項）、應用 1 分（工廠打工仍然最高）、結論 1 分（唔變）。將選項加埋一齊係典型錯誤。
hard_fubak-02,hard_fubak,dse,dse,,"(Fictional) Grandpa decides to take the factory job ($180/month, $20 monthly fares). His other options were drying salt ($120) and fishing ($150). Calculate and explain the full cost of taking the factory job. (4 marks)",（虛構）阿爺決定出市區工廠打工（每月 $180，車費每月 $20）。佢其他選擇係曬鹽（$120）同打魚（$150）。計算並解釋揀工廠打工嘅 full cost。（4 分）,"Full cost is money cost plus non-money cost.|The money cost is the $20 monthly fare he pays to get to the factory.|The non-money cost is the best alternative use of his time: fishing at $150, which is higher than salt at $120.|So the full cost of taking the factory job is $20 + $150 = $170 per month.|The non-money cost is $270, the income from salt and fishing added together.|The full cost is $200, the factory wage plus the fares.|The fare is not a cost, because the factory wage is high enough to cover it.",Full cost = money cost + non-money cost。|Money cost 係佢每月返工要俾嘅 $20 車費。|Non-money cost 係佢時間嘅最佳其他用途：打魚 $150，高過曬鹽 $120。|所以揀工廠打工嘅 full cost 係 $20 + $150 = 每月 $170。|Non-money cost 係 $270，即係曬鹽同打魚收入加埋。|Full cost 係 $200，即係工廠人工加車費。|車費唔算 cost，因為工廠人工夠高，抵銷得到。,,,1|2|3|4,"What does Grandpa pay in money, and what is the best thing he could have done with that time?",阿爺要俾咩錢？嗰段時間佢最好可以用嚟做咩？,"Marks: formula, money cost ($20), non-money cost = best alternative use of time ($150, not $120 or $270), and the $170 total. The factory wage is the benefit of the choice, not its cost.",評分：公式、money cost（$20）、non-money cost = 時間最佳其他用途（$150，唔係 $120 或 $270），同埋總數 $170。工廠人工係選擇嘅得益，唔係 cost。
hard_fubak-03,hard_fubak,dse,dse,,"(Fictional) Last month Grandpa paid $80 for new salt rakes, which cannot be resold. Now he is thinking of switching to fishing. His grandson says: 'Switching would waste the $80, so keep drying salt.' Explain whether the grandson is correct. (2 marks)",（虛構）上個月阿爺用 $80 買咗新鹽耙，呢啲鹽耙賣唔返出去。而家佢諗緊轉去打魚。個孫話：「轉行就嘥咗嗰 $80，所以繼續曬鹽啦。」解釋個孫講得啱唔啱。（2 分）,"The $80 is a historical cost: it was spent in the past and cannot be recovered whatever Grandpa chooses now.|With no choice involved, there is no cost, so the $80 should not affect his decision and the grandson is incorrect.|The $80 should be added to the cost of switching to fishing.|The $80 should be added to the cost of continuing to dry salt.|The $80 is the opportunity cost of continuing to dry salt.|The grandson is correct, because wasting resources always raises the cost of a choice.|Even if the rakes could be resold for $50, that $50 would still be a historical cost.",嗰 $80 係 historical cost：已經喺過去用咗，而家阿爺點揀都拎唔返。|冇選擇就冇 cost，所以 $80 唔應該影響佢嘅決定，個孫講得唔啱。|嗰 $80 應該加入轉去打魚嘅 cost 度。|嗰 $80 應該加入繼續曬鹽嘅 cost 度。|嗰 $80 係繼續曬鹽嘅 opportunity cost。|個孫講得啱，因為嘥資源一定會令選擇嘅 cost 上升。|就算鹽耙可以賣返 $50，嗰 $50 都仍然係 historical cost。,,,1|2,Can the $80 be recovered whichever option Grandpa picks today?,無論阿爺今日揀邊樣，嗰 $80 拎唔拎得返？,"1 mark for identifying historical cost (spent and unrecoverable), 1 mark for 'no choice, no cost' leading to the conclusion. A resale value would be recoverable, so it would be an opportunity cost, not a historical cost.",指出 historical cost（已用咗、拎唔返）1 分；「冇選擇就冇 cost」並得出結論 1 分。如果可以轉賣，轉賣價值拎得返，就係 opportunity cost，唔係 historical cost。
hard_fubak-04,hard_fubak,dse,dse,,"(Fictional) Grandpa borrows $1,000 from Uncle Wing to buy a motorised fishing boat now, and repays $1,100 one year later. Explain what the $100 interest means to each of them. (3 marks)","（虛構）阿爺向榮叔借 $1,000，即刻買一隻機動漁船，一年後還 $1,100。解釋呢 $100 interest 對佢哋兩個分別有咩意思。（3 分）","For Grandpa, the borrower, interest is the cost of earlier availability: he gets the boat now instead of after saving up.|For Uncle Wing, the lender, interest is the compensation for postponing his consumption of $1,000 for a year.|The interest rate is $100 / $1,000 = 10% per year.|For Grandpa, interest is the compensation for postponing his consumption.|For Uncle Wing, interest is the cost of earlier availability of the boat.|The interest rate is 11%, because Grandpa repays $1,100.|Once the loan is signed, the $100 interest is a historical cost to Grandpa.","對借款人阿爺嚟講，interest 係提早得到資源嘅 cost：佢而家就有船，唔使儲夠錢先買。|對貸款人榮叔嚟講，interest 係佢延遲一年使用嗰 $1,000 嘅補償。|Interest rate 係 $100 / $1,000 = 每年 10%。|對阿爺嚟講，interest 係延遲消費嘅補償。|對榮叔嚟講，interest 係提早得到漁船嘅 cost。|Interest rate 係 11%，因為阿爺要還 $1,100。|一簽咗借據，嗰 $100 interest 對阿爺嚟講就係 historical cost。",,,1|2|3,"Who enjoys the resources earlier, and who waits?",邊個提早享用資源？邊個要等？,Borrower: cost of earlier availability. Lender: compensation for postponing consumption. Rate = interest / principal. Swapping the two roles is the common mistake.,借款人：提早得到資源嘅 cost。貸款人：延遲消費嘅補償。利率 = interest / 本金。調轉兩個角色係常見錯誤。
hard_hoitse-01,hard_hoitse,dse,dse,,"(Fictional) After WWII, cheaper imported salt competed with Tai O salt. Salt pan owners turned their pans into fish ponds without any government order. Explain which basic economic problem this solves and how. (3 marks)",（虛構）二戰後，平價入口鹽同大澳鹽競爭。鹽田主喺冇政府命令之下，將鹽田改做魚塘。解釋呢件事解決緊邊個基本經濟問題，同埋點樣解決。（3 分）,"It concerns the 'what to produce' problem: whether the land produces salt or fish.|It is solved by the market mechanism: cheaper imported salt lowered the price and profit of local salt, sending a signal.|Owners, as private property owners, voluntarily moved their resources to the more profitable use, fish ponds.|It concerns the 'how to produce' problem, because the land is now used in a different way.|It concerns the 'for whom' problem, because fish ponds decide who gets to eat fish.|It is solved by command, because the decline of the salt industry forced owners to change.|It is solved by tradition, because villagers follow what their ancestors did.",呢件事關於「生產咩」（what）問題：塊地用嚟生產鹽定魚。|佢由 market mechanism 解決：入口鹽較平，令本地鹽嘅價格同利潤下跌，發出訊號。|鹽田主作為私有產權擁有人，自願將資源轉去利潤較高嘅用途，即係魚塘。|呢件事關於「點生產」（how）問題，因為塊地而家用法唔同咗。|呢件事關於「為誰生產」（for whom）問題，因為魚塘決定邊個有魚食。|佢由 command 解決，因為鹽業式微迫使鹽田主轉變。|佢由 tradition 解決，因為村民跟返祖先嘅做法。,,,1|2|3,"Is the decision about which good, which method, or who gets it? Who gave the signal?",個決定係關於生產邊樣、用咩方法，定俾邊個？邊個發出訊號？,"1 mark for the correct problem (what), 1 mark for price as the signal, 1 mark for owners responding voluntarily. Being 'forced' by prices is not command, which requires government orders.",指出正確問題（what）1 分、價格做訊號 1 分、業主自願回應 1 分。俾價格「迫」唔等於 command，command 要有政府命令。
hard_hoitse-02,hard_hoitse,dse,dse,,"(Fictional) Ah Kei owns a fishing boat and Ah Lan owns a shrimp paste workshop, both with clear ownership. Explain how private property rights enable them to specialise. (3 marks)",（虛構）阿琦擁有一隻漁船，阿蘭擁有一間蝦醬工場，兩個業權都清清楚楚。解釋 private property rights 點樣令佢哋可以 specialise。（3 分）,"Private property rights give owners the exclusive right to use, to receive income from, and to transfer their resources.|With clear ownership, Ah Kei can confidently exchange his shrimps for Ah Lan's shrimp paste or money, without fear of seizure.|Since they can rely on exchange, each specialises in one job, fishing or making shrimp paste, and trades for the rest.|Specialisation comes first; private property rights appear only after people have specialised.|Private property rights mean the government decides who may use the boat and the workshop.|Exchange only happens when money is used, so bartering shrimps for shrimp paste is not exchange.|Private property rights let owners use their property in any way, even if it harms others.",Private property rights 俾擁有人專有使用權、專有收益權同轉讓權。|業權清楚，阿琦可以放心用佢嘅銀蝦同阿蘭交換蝦醬或者錢，唔怕俾人搶。|因為可以靠交換，佢哋各自專門做一樣嘢，打魚或者整蝦醬，其餘嘅靠交換得到。|先有 specialisation，大家專門化咗之後先出現 private property rights。|Private property rights 即係由政府決定邊個可以用隻船同間工場。|用錢先算交換，所以用銀蝦換蝦醬唔算 exchange。|Private property rights 令擁有人可以任意使用財產，就算傷害到其他人都得。,,,1|2|3,What would happen to trade if anyone could take Ah Kei's catch?,如果人人都可以攞走阿琦嘅漁獲，交易會點？,"The chain is: private property rights (1 mark) → confident exchange (1 mark) → specialisation (1 mark). Barter is also exchange, and property rights are not unlimited.",因果鏈：private property rights（1 分）→ 放心 exchange（1 分）→ specialisation（1 分）。以物易物都係 exchange，而產權唔係冇限制。
hard_hoitse-03,hard_hoitse,dse,dse,,"(Fictional) Only 30 kg of yellow croaker reach Hoi Tse's stall, but buyers want 50 kg. She can either raise the price or sell to regular customers first. Explain why competition implies discrimination here and classify each method. (4 marks)",（虛構）海姐個檔只得 30 kg 黃花魚，但買家想要 50 kg。佢可以加價，或者先賣俾熟客。解釋點解呢度 competition 意味住 discrimination，並將兩個方法分類。（4 分）,"Yellow croaker is scarce: the quantity is not enough for all buyers, so they must compete for it.|Competition implies discrimination: some criterion must be used to decide who gets the fish and who does not.|Raising the price is price competition: the buyers who are willing to pay the most get the fish.|Selling to regular customers first is non-price competition: the criterion is the relationship, not the price paid.|Selling to regular customers first is price competition, because they still pay for the fish.|Discrimination only happens when the criterion is unfair, such as a buyer's race.|If Hoi Tse does not raise the price, there is no competition among buyers.",黃花魚係 scarce：數量唔夠滿足所有買家，所以佢哋要競爭。|Competition 意味住 discrimination：一定要用某個準則決定邊個有魚、邊個冇。|加價係 price competition：願意俾最多錢嘅買家得到條魚。|先賣俾熟客係 non-price competition：準則係關係，唔係俾幾多錢。|先賣俾熟客都係 price competition，因為佢哋一樣要俾錢買魚。|要準則唔公平，例如睇買家種族，先算 discrimination。|如果海姐唔加價，買家之間就冇 competition。,,,1|2|3|4,"With not enough fish for everyone, how is the winner chosen in each method?",條魚唔夠分，兩個方法分別用咩準則揀邊個得到？,"Scarcity → competition (1), competition → discrimination by a criterion (1), price as criterion = price competition (1), any other criterion = non-price competition (1). In economics, discrimination is neutral, not necessarily unfair.",Scarcity → competition（1 分）；competition → 用準則 discrimination（1 分）；以價格做準則 = price competition（1 分）；其他準則 = non-price competition（1 分）。經濟學嘅 discrimination 係中性，唔一定唔公平。
hard_hoitse-04,hard_hoitse,dse,dse,,(Fictional) Ah Sang works in a Tai O shrimp paste factory for $150 a month and spends $30 buying shrimp paste from it. Explain these four flows using the circular flow model. (4 marks),（虛構）阿生喺大澳一間蝦醬廠打工，每月人工 $150，又用 $30 向間廠買蝦醬。用 circular flow 模型解釋呢四條流向。（4 分）,"Ah Sang's labour is a real flow of factor services from households to firms in the factor market.|His $150 wage is a money flow of factor income from firms to households in the factor market.|The shrimp paste is a real flow of goods from firms to households in the product market.|His $30 is a money flow of household expenditure from households to firms in the product market.|His wage is paid in the product market, because it comes from the factory's shrimp paste sales.|His labour is a money flow, because he is paid money for it.|The shrimp paste and the $30 flow in the same direction, as both go through the product market.",阿生嘅勞力係 real flow：factor services 喺 factor market 由 households 流去 firms。|佢嘅 $150 人工係 money flow：factor income 喺 factor market 由 firms 流去 households。|蝦醬係 real flow：物品喺 product market 由 firms 流去 households。|佢嘅 $30 係 money flow：household expenditure 喺 product market 由 households 流去 firms。|佢嘅人工喺 product market 支付，因為錢嚟自間廠賣蝦醬嘅收入。|佢嘅勞力係 money flow，因為佢做嘢有錢收。|蝦醬同 $30 流向一樣，因為兩樣都經過 product market。,,,1|2|3|4,For each flow: real or money? Which market? Which direction?,每條流向：real 定 money？邊個市場？咩方向？,"1 mark per flow, each needing real or money, the correct market and the correct direction. In each market the real flow and the money flow go in opposite directions.",每條流向 1 分，要講啱 real 定 money、邊個市場同方向。每個市場入面，real flow 同 money flow 方向相反。
hard_maytse-01,hard_maytse,dse,dse,,"(Fictional) In 1975 a Cheung Sha Wan factory splits shirt-making into cutting, sewing, ironing and packing. Explain TWO reasons why labour productivity rises. (4 marks)",（虛構）1975 年長沙灣一間工廠將整恤衫分成剪布、車衣、熨衫同包裝。解釋兩個令 labour productivity 上升嘅原因。（4 分）,"Each worker repeats one simple task, so she becomes more skilful at it (practice makes perfect).|So more shirts are produced per working hour.|Workers no longer move between tasks and tools, so time is saved.|With the same working hours, total output rises, so output per man-hour rises.|Labour productivity rises because the factory hires more workers.|Workers find the job more interesting, so they work harder.|Productivity rises because each worker earns a higher wage.",每個工人重複做一個簡單工序，愈做愈熟練（熟能生巧）。|所以每個工時生產嘅恤衫增加。|工人唔使喺唔同工序同工具之間轉來轉去，慳返時間。|工時不變而總產量上升，所以每工時產量上升。|Labour productivity 上升係因為工廠請多咗人。|工人覺得份工更有趣，所以更落力。|因為每個工人人工高咗，所以 productivity 上升。,,,1|2|3|4,"For each reason: what changes for the worker, and how does that link to output per working hour?",每個原因：工人有咩改變？點樣連到每工時產量？,"2 marks per reason: 1 for the reason, 1 for linking it to more output per working hour. Hiring more workers raises output, not productivity; boredom is a disadvantage.",每個原因 2 分：原因 1 分，連繫到每工時產量上升 1 分。請多人令產量上升但唔係 productivity；沉悶係壞處。
hard_maytse-02,hard_maytse,dse,dse,,"(Fictional) A garment factory has 10 sewing machines on a rented floor. Output with 8, 9 and 10 machinists is 400, 430 and 450 dozen. Explain, with calculation, whether the law of diminishing marginal returns is shown. (3 marks)",（虛構）一間製衣廠喺租嚟嘅樓層有 10 部衣車。8、9、10 個女工嘅產量係 400、430、450 打。用計算解釋有冇顯示 law of diminishing marginal returns。（3 分）,"The machines and the floor are fixed factors, so the factory is in the short run.|The MP of the 9th and 10th machinists is 30 and 20 dozen.|As more machinists are added to fixed machines, MP falls, so the law is shown.|The law is not shown because TP is still rising.|The MP of the 10th machinist is 45 dozen, i.e. 450 ÷ 10.|The law applies because the factory can change the number of machines.|It shows internal diseconomies of scale.",衣車同樓層係 fixed factors，所以工廠處於 short run。|第 9 同第 10 個女工嘅 MP 係 30 同 20 打。|將更多女工加落固定數量嘅衣車，MP 下降，所以顯示咗呢條定律。|因為 TP 仲上升緊，所以冇顯示呢條定律。|第 10 個女工嘅 MP 係 45 打，即係 450 ÷ 10。|呢條定律適用，因為工廠可以改變衣車數目。|呢個顯示 internal diseconomies of scale。,,,1|2|3,"Which factor is fixed? Work out MP, not AP.",邊個係 fixed factor？計 MP，唔好計 AP。,1 mark: short run with fixed factors; 1 mark: correct MPs (430 − 400 = 30; 450 − 430 = 20); 1 mark: MP falls → law shown. TP can rise while MP falls.,1 分：有 fixed factors 嘅 short run；1 分：MP 計啱（430 − 400 = 30；450 − 430 = 20）；1 分：MP 下降 → 顯示定律。MP 跌嘅時候 TP 仍可上升。
hard_maytse-03,hard_maytse,dse,dse,,"(Fictional) Many garment factories cluster in Cheung Sha Wan. Mrs Lee's small workshop has not expanded, yet its LRAC falls. Explain. (3 marks)",（虛構）好多製衣廠集中喺長沙灣。李太嘅細工場冇擴張，但佢嘅 LRAC 下降。解釋。（3 分）,"This is an external economy of scale: it comes from the expansion of the industry, not of her own firm.|With many factories nearby, it is easier and cheaper to recruit experienced machinists.|Cloth, button and zip suppliers cluster nearby, so her sourcing and transport costs fall.|This is an internal economy of scale because her LRAC falls.|Her LRAC falls because of the law of diminishing marginal returns.|Her LRAC falls because she bulk-buys cloth as a large firm.|External economies mean rents and wages in the district rise.",呢個係 external economy of scale：嚟自行業擴張，唔係佢自己廠擴張。|附近工廠多，請有經驗嘅車衣女工更容易、更平。|布、鈕扣同拉鏈供應商聚集附近，佢嘅採購同運輸成本下降。|因為佢嘅 LRAC 下降，所以係 internal economy of scale。|佢嘅 LRAC 下降係因為 law of diminishing marginal returns。|佢嘅 LRAC 下降係因為佢係大廠，可以大量入布。|External economies 即係區內租金同人工上升。,,,1|2|3,"Did her own scale change, or the industry's? Name concrete cost savings.",佢自己規模有冇變，定係行業規模變？講出具體慳咗咩成本。,"1 mark for identifying external economies (industry expansion), 1 mark per relevant source (max 2). Bulk-buying is internal; rising rents are external diseconomies.",指出 external economies（行業擴張）1 分，每個相關來源 1 分（最多 2 分）。大量入貨係 internal；租金上升係 external diseconomies。
hard_maytse-04,hard_maytse,dse,dse,,(Fictional) The factory switches machinists from time rate to piece rate. Explain ONE advantage and ONE disadvantage for the employer. (4 marks),（虛構）工廠將車衣女工由 time rate 改為 piece rate。解釋對僱主嘅一個好處同一個壞處。（4 分）,"Advantage: pay is linked to output, so workers have a stronger incentive to sew more.|So labour productivity rises and the employer spends less on monitoring workers' effort.|Disadvantage: workers may rush and sew poorly, so the employer must spend more on checking quality.|Also, workers' income becomes unstable, so it may be harder to recruit and retain workers.|Advantage: workers' income becomes more stable.|Disadvantage: the employer must pay a share of profits to workers.|Advantage: output quality is guaranteed to rise.",好處：人工同產量掛鈎，工人更有誘因車多啲。|所以 labour productivity 上升，僱主監察工人勤力程度嘅成本減少。|壞處：工人可能趕貨、車得差，僱主要花更多成本檢查質素。|另外，工人收入唔穩定，可能更難請到同留住工人。|好處：工人收入更穩定。|壞處：僱主要將部分利潤分俾工人。|好處：產品質素一定會上升。,,,1|2|3|4,"Look from the employer's side. What happens to incentives, and what new cost appears?",由僱主角度睇：誘因點變？會多咗咩成本？,2 marks each: identify (1) + explain the effect on the employer (1). Stable income is a feature of time rate; profit-sharing is a different method.,每點 2 分：指出 1 分＋解釋對僱主嘅影響 1 分。收入穩定係 time rate 嘅特點；profit-sharing 係另一種方法。
pp1-1-01,pp1,mc,pp,,"(Fictional) Ah Man can spend one whole Sunday on exactly one activity: helping at a Tuen Mun herbal tea stall for $260, giving a tutorial in Yuen Long for $300, or handing out leaflets in Tsuen Wan for $180. She chooses the tutorial. Which of the following is her opportunity cost of giving the tutorial?",（虛構）阿敏一個星期日只可以做一樣嘢：去屯門涼茶舖幫手賺 $260、喺元朗補習賺 $300，或者喺荃灣派傳單賺 $180。佢揀咗補習。以下邊項係佢補習嘅 opportunity cost？,"$180, the lowest-valued option she gave up|$260, the highest-valued option she gave up|$440, the two options she gave up added together|$300, the income she earns from the tutorial",$180，即係佢放棄咗嘅選項之中價值最低嗰個|$260，即係佢放棄咗嘅選項之中價值最高嗰個|$440，即係佢放棄咗嘅兩個選項加埋一齊|$300，即係佢補習賺到嘅收入,,,B,"Among the options she did NOT take, which one is worth the most?",喺佢冇揀嘅選項之中，邊個價值最高？,"Opportunity cost counts one option only, the highest-valued option forgone. Adding forgone options together, picking the lowest one, or quoting the income from the chosen option are the three standard errors.",Opportunity cost 只計一個選項，就係被放棄嘅最高價值選項。將放棄嘅選項加埋、揀最低嗰個、或者講返所揀選項嘅收入，就係三個典型錯誤。
pp1-1-02,pp1,mc,pp,,"(Fictional) On a hot morning at a Sai Kung pier, a shop gives chilled water to anyone who walks in and charges nothing. A queue forms and the shop runs out before noon. Which of the following best explains why the chilled water is still an economic good?",（虛構）一個大熱天嘅朝早，西貢碼頭有間舖頭免費派凍水，唔收錢。好快就排晒隊，未到中午就派完。以下邊項最能解釋點解啲凍水仍然係 economic good？,"Its money price is zero, and any good with a zero price is an economic good|A shop rather than the government hands it out|It turns into a free good again as soon as the queue disappears|Scarce resources are needed to provide it and the quantity is not enough for all the wants for it",佢嘅 money price 係零，而凡係零價錢嘅物品都係 economic good|係舖頭派而唔係政府派|一排完隊佢就會變返 free good|提供佢要用 scarce resources，而數量唔夠滿足所有人對佢嘅慾望,,,D,"Does someone have to use up scarce resources to put that water there, and is there enough for everyone who wants it?",要唔要有人用 scarce resources 先有嗰啲水？夠唔夠所有想要嘅人分？,"A good is economic when scarce resources are needed for it and it is not enough to satisfy all wants. A zero money price does not make a good free, and who provides it is irrelevant.",一件物品要用 scarce resources 而又唔夠滿足所有慾望，就係 economic good。零價錢唔等於 free good，邊個提供亦都唔相干。
pp1-1-03,pp1,mc,pp,,"(Fictional) A Chai Wan noodle shop paid $9,000 last year for a fitted signboard that cannot be resold or taken away. The owner is now deciding whether to close the shop at the end of this month. Which statement about the $9,000 is correct?","（虛構）柴灣一間麵舖舊年用咗 $9,000 訂造咗個招牌，拆唔到亦賣唔返出去。老闆而家諗緊今個月尾結唔結業。以下關於嗰 $9,000 嘅講法，邊項啱？","It is the opportunity cost of staying open for another month|It should be added to the cost of closing, because closing wastes it|It is a historical cost and should not affect the decision, because it cannot be recovered whichever option is chosen|It is a cost of closing but not a cost of staying open",佢係再開多個月嘅 opportunity cost|佢應該加落結業嘅 cost 度，因為結業就嘥咗佢|佢係 historical cost，唔應該影響個決定，因為無論揀邊樣都拎唔返|佢係結業嘅 cost，但唔係繼續開嘅 cost,,,C,"Whichever the owner picks today, can any of that $9,000 come back?","無論老闆今日揀邊樣，嗰 $9,000 拎唔拎得返？","A historical cost is already spent and unrecoverable, so it is the same under every option and is not a cost of any choice. If the signboard could be resold, the resale value would be recoverable and would become an opportunity cost.",Historical cost 已經用咗又拎唔返，喺每個選項之下都一樣，所以唔係任何選擇嘅 cost。如果個招牌賣得返，嗰筆賣返嘅錢就拎得返，會變成 opportunity cost。
pp1-1-04,pp1,tf,pp,,"(Fictional) Ka Yan skips a $90 part-time shift and a $40 badminton session to attend a free revision class, so the opportunity cost of the class is $130.",（虛構）家欣放棄咗一份 $90 嘅兼職更同一場價值 $40 嘅羽毛球，去上一堂免費溫習班，所以呢堂嘅 opportunity cost 係 $130。,,,,,F,How many forgone options does opportunity cost count?,Opportunity cost 計幾多個被放棄嘅選項？,"Opportunity cost is the value of the highest-valued option forgone only, so it is $90, not the $130 sum. Adding every option given up is the most common Ch.1 error.",Opportunity cost 只計被放棄選項之中價值最高嗰個，所以係 $90，唔係加埋嘅 $130。將所有放棄嘅選項加埋，係第一章最常見嘅錯。
pp1-1-05,pp1,fill,pp,,"(Fictional) Fill in the blanks. Full cost = money cost + ____ cost; and when the resource given up is time, that second item is valued at the ____ alternative use of the time.",（虛構）填空。Full cost = money cost + ① cost；而當放棄嘅資源係時間，第二部分就要用嗰段時間嘅 ② alternative use 嚟計。,non-money|best|historical|average,non-money（非金錢）|best（最佳）|historical（歷史）|average（平均）,,,non-money|best,"What do you pay in money, and what is the best thing that time could otherwise have done?",你要用錢俾咩？嗰段時間本來最好可以用嚟做咩？,"Full cost = money cost + non-money cost, and the non-money part is valued at the BEST alternative use of the resource, not at an average of the alternatives and not at a past payment.",Full cost = money cost + non-money cost，而 non-money 嗰部分要用資源嘅最佳（best）其他用途嚟計，唔係啲選項嘅平均數，亦唔係過去俾咗嘅錢。
pp1-2-06,pp1,mc,pp,,"(Fictional) A Tai Po bakery replaces two counter staff with a self-service ordering screen, and keeps selling exactly the same buns to exactly the same customers. Which basic economic problem is the bakery dealing with?",（虛構）大埔一間餅店用自助落單機取代咗兩個櫃枱員工，賣嘅麵包同賣俾邊啲客都一模一樣。呢間餅店處理緊邊個 basic economic problem？,"What to produce, because the bakery changed its business|How to produce, because it changed the combination of factors used to make the same output|For whom to produce, because fewer staff now share the bakery's income|None of the three, because the bakery is a private firm rather than the government",生產咩（what），因為間餅店改變咗做生意嘅方式|點生產（how），因為佢改變咗生產同樣產出所用嘅生產要素組合|為誰生產（for whom），因為而家少咗員工分間舖嘅收入|三個都唔係，因為間餅店係私人企業而唔係政府,,,B,"Did the goods change, did the buyers change, or did the method change?",改變咗嘅係啲貨、啲買家，定係生產方法？,"The 'how' problem is about the method and the combination of factors used. The output and the buyers are unchanged, so it is not 'what' or 'for whom'. All three problems apply to firms as well as governments.",How 嘅問題係關於生產方法同生產要素組合。產出同買家都冇變，所以唔係 what 或 for whom。三個問題對企業同政府一樣適用。
pp1-2-07,pp1,mc,pp,,"(Fictional) In a fictional territory, a central committee issues written orders every January telling each workshop what to make, how much, and which district to send it to. Workshops that disobey are fined. Which of the following best describes how this territory answers the basic economic problems?",（虛構）喺一個虛構地方，中央委員會每年一月都會出書面命令，指定每間工場要做咩、做幾多、送去邊區。唔跟就要罰錢。以下邊項最能形容呢個地方點解決基本經濟問題？,"Tradition, because the same orders are issued every January|The market mechanism, because workshops still respond to shortages in each district|Command, because a central authority decides and enforces the answers|A market economy, because money is still used to pay the fines",Tradition，因為每年一月都出同樣嘅命令|Market mechanism，因為啲工場都係回應緊各區嘅短缺|Command，因為由中央機關決定答案並強制執行|Market economy，因為罰錢都仲係用緊錢,,,C,"Who decides what gets made here, and what happens if you say no?",喺呢度邊個決定生產咩？唔跟會點？,"Command means a central authority decides and enforces the answers to what, how and for whom. Repetition alone is not tradition, and the use of money does not make an economy a market economy.",Command 即係由中央機關決定並強制執行 what、how、for whom 嘅答案。重複做同一件事唔等於 tradition，用錢亦唔等於 market economy。
pp1-2-08,pp1,mc,pp,,"(Fictional) Ah Ying works at a Kwun Tong print shop for $14,000 a month and spends $900 there on printing her own name cards. In the circular flow model, which of the following is a real flow in the factor market?","（虛構）阿英喺觀塘一間印刷舖返工，月薪 $14,000，又喺嗰度用 $900 印自己嘅名片。喺 circular flow 模型入面，以下邊項係 factor market 嘅 real flow？","The printing labour Ah Ying supplies to the print shop|The $14,000 wage the print shop pays Ah Ying|The $900 Ah Ying pays for her name cards|The finished name cards Ah Ying takes home","阿英提供俾印刷舖嘅勞力|印刷舖俾阿英嘅 $14,000 人工|阿英俾嘅 $900 名片錢|阿英攞返屋企嘅名片成品",,,A,"Which item is a service rather than money, and which market are factor services traded in?",邊樣嘢係服務而唔係錢？Factor services 喺邊個市場交易？,Factor services flowing from households to firms are a real flow in the factor market. The wage is a money flow in the same market; the name cards and the $900 both belong to the product market.,由 households 流去 firms 嘅 factor services 係 factor market 嘅 real flow。人工係同一市場嘅 money flow；名片同 $900 都屬於 product market。
pp1-2-09,pp1,sort,pp,,(Fictional) Sort each statement about a fictional Yuen Long market into positive or normative.,（虛構）將以下關於一個虛構元朗街市嘅句子，分做 positive 定 normative。,Positive statement|Normative statement,Positive statement（實證陳述）|Normative statement（規範陳述）,Last year a rise in stall rents cut the number of stalls in this fictional market by ten.|The government ought to cap the stall rents in this fictional market.|Stallholders in this fictional market work an average of nine hours a day.|It is unfair that some stallholders in this fictional market earn far more than others.|Free parking at this fictional market would raise the number of shoppers by thirty per cent.,舊年呢個虛構街市嘅檔租上升，令檔口數目少咗十個。|政府應該喺呢個虛構街市設檔租上限。|呢個虛構街市嘅檔主平均每日做九個鐘。|呢個虛構街市有啲檔主賺得多過人好多，係唔公平嘅。|喺呢個虛構街市免費泊車會令顧客人數增加三成。,1|2|1|2|1,"Can the sentence be checked against facts, or does it tell us what should be done?",呢句嘢可唔可以攞事實去驗證？定係講緊應該點做？,"A positive statement describes what is, was or will be and can be tested against facts, even when it turns out to be wrong. A normative statement contains a value judgement such as 'ought', 'should' or 'unfair' and cannot be tested.",Positive statement 描述係咩、曾經係咩或者將會係咩，可以攞事實驗證，就算最後證實錯咗都仍然係 positive。Normative statement 帶有價值判斷，例如「應該」、「唔公平」，驗證唔到。
pp1-2-10,pp1,tf,pp,,"(Fictional) A Tuen Mun bakery sells its last ten egg tarts to whoever arrives first, so no discrimination takes place.",（虛構）屯門一間餅店將最後十個蛋撻賣俾最早到嘅人，所以冇發生 discrimination。,,,,,F,"When there is not enough to go round, does some criterion have to decide who gets it?",貨唔夠分嘅時候，係咪一定要有個準則決定邊個攞到？,"Scarcity forces competition, and competition implies discrimination: a criterion must separate those who get the good from those who do not. 'First come, first served' is such a criterion, so this is non-price discrimination. In economics discrimination is neutral, not necessarily unfair.",Scarcity 引致 competition，而 competition 意味住 discrimination：一定要有準則分邊個攞到、邊個攞唔到。「先到先得」就係一個準則，所以呢個係 non-price discrimination。經濟學嘅 discrimination 係中性，唔一定唔公平。
pp1-3-11,pp1,mc,pp,,"(Fictional) The very same model of electric sewing machine is bought by Mrs Ho, who mends her own family's clothes with it, and by a Fanling workshop, which sews uniforms for sale with it. Which of the following is correct?",（虛構）同一款電動衣車，何太買返屋企補自己一家人嘅衫，粉嶺一間工場就買咗嚟車校服出售。以下邊項啱？,"It is a consumer good for Mrs Ho and a producer good for the workshop, because the classification depends on the use|It is a producer good in both cases, because a machine is always capital|It is a consumer good in both cases, because a household bought one of them|It is neither, because a sewing machine produces no new output",對何太嚟講係 consumer good，對工場嚟講係 producer good，因為分類睇用途|兩個情況都係 producer good，因為機器一定係 capital|兩個情況都係 consumer good，因為其中一部係住戶買嘅|兩者都唔係，因為衣車冇生產新嘅產出,,,A,"Is the machine being used to satisfy a want directly, or to make something that will be sold?",部機係直接滿足慾望，定係用嚟整啲賣出去嘅嘢？,"A consumer good satisfies wants directly; a producer good is used to produce other goods or services. The same physical item can be either, so the classification must be made from its use, not from what it looks like.",Consumer good 直接滿足慾望；producer good 用嚟生產其他物品或服務。同一件實物可以係任何一種，所以要睇用途嚟分類，唔係睇件嘢個樣。
pp1-3-12,pp1,mc,pp,,"(Fictional) A fictional district council pays a contractor to run an indoor pool. Swimmers must buy a ticket at the door, non-payers are turned away by a gate, and each session has a limited number of places. Which of the following best explains the pool's classification?",（虛構）一個虛構區議會出錢請承辦商營運一個室內泳池。入場要喺門口買飛，唔俾錢嘅會喺閘口俾人攔住，每節仲有名額上限。以下邊項最能解釋呢個泳池嘅分類？,"It is a public good, because a district council pays for it|It is not a public good, because the places are rival and non-payers are cheaply excluded|It is not a public good, because a contractor rather than the government runs it|It is a public good, because every resident of the district is allowed to apply",佢係 public good，因為由區議會出錢|佢唔係 public good，因為名額有 rivalry，而且好容易將唔俾錢嘅人排除喺外|佢唔係 public good，因為係承辦商而唔係政府營運|佢係 public good，因為全區居民都可以申請,,,B,"Does one swimmer's place leave less for others, and is it cheap to keep non-payers out?",一個人佔咗個位，係咪就少咗個位俾人？攔住唔俾錢嘅人使唔使好大成本？,"A public good must be both non-rival and non-excludable. Here the limited places are rival and the gate makes exclusion cheap, so it is a private good. Who pays for or runs a good never decides the classification.",Public good 一定要同時 non-rival 同 non-excludable。呢度名額有限就係 rival，有閘就排除得平，所以係 private good。邊個出錢或者營運從來唔決定分類。
pp1-3-13,pp1,mc,pp,,"(Fictional) In a Ngau Tau Kok umbrella workshop one worker cuts the cloth, a second fixes the ribs, a third fits the handle and a fourth packs the finished umbrellas. Which of the following best describes this arrangement?",（虛構）牛頭角一間遮廠，第一個工人裁布、第二個裝傘骨、第三個裝手柄、第四個包裝。以下邊項最能形容呢種安排？,"Simple division of labour, because each worker does a different job|Regional division of labour, because the workshop is in one district|No division of labour, because all four workers are in the same workshop|Complex division of labour, because each worker does a different stage of the same good",Simple division of labour，因為每個工人做唔同工作|Regional division of labour，因為間廠喺同一區|冇 division of labour，因為四個工人都喺同一間廠|Complex division of labour，因為每個工人做同一件產品嘅唔同工序,,,D,"Are these four workers making four different goods, or four stages of one good?",呢四個工人係整緊四件唔同嘅產品，定係一件產品嘅四個工序？,"Simple division of labour means different workers produce different finished goods; complex division of labour means they perform different stages of one good. Regional division of labour compares different regions, not workers inside one workshop.",Simple division of labour 係唔同工人生產唔同嘅製成品；complex division of labour 係佢哋做同一件產品嘅唔同工序。Regional division of labour 比較嘅係唔同地區，唔係一間廠入面嘅工人。
pp1-3-14,pp1,sort,pp,,(Fictional) Sort each fictional activity into the stage of production it belongs to.,（虛構）將以下每項虛構活動，分入佢所屬嘅 stage of production。,Primary production|Secondary production|Tertiary production,Primary production（初級生產）|Secondary production（次級生產）|Tertiary production（第三級生產）,A fish farm off a fictional island raising grouper in floating cages|A fictional Tuen Mun mill turning raw cotton into rolls of cloth|A fictional Mong Kok accountant auditing a firm's books|A fictional Sai Kung quarry cutting granite out of a hillside|A fictional Kwai Chung workshop sewing cloth into school shirts|A fictional courier carrying the finished shirts to retail shops,一個虛構小島對開嘅魚排養石斑|一間虛構屯門紗廠將原棉紡織成布匹|一位虛構旺角會計師幫公司核數|一個虛構西貢石礦場喺山邊開採花崗岩|一間虛構葵涌工場將布車成校服恤衫|一位虛構速遞員將製成嘅恤衫送去零售舖,1|2|3|1|2|3,"Is the activity taking something out of nature, changing materials into goods, or providing a service?",呢項活動係從大自然攞資源、將原料變成貨品，定係提供服務？,"Primary production extracts from nature, secondary production turns raw materials into semi-finished or finished goods, and tertiary production provides services. Farming and fish farming count as extraction from nature even though people tend the stock.",Primary production 從大自然提取資源，secondary production 將原料變成半製成品或製成品，tertiary production 提供服務。務農同養魚就算有人打理，都當係從大自然提取。
pp1-3-15,pp1,order,pp,,"(Fictional) Put these five fictional stages of making and selling a cotton shirt in order, from the earliest stage of production to the last.",（虛構）將以下五個虛構嘅棉恤衫生產同銷售階段，由最早排到最尾。,,,Cotton is grown and picked on a fictional farm|A fictional mill spins and weaves the raw cotton into cloth|A fictional workshop cuts the cloth and sews it into shirts|A fictional logistics firm delivers the shirts to retailers|A fictional shop sells a shirt to a customer,喺一個虛構農場種棉花同採收|一間虛構紗廠將原棉紡紗織成布|一間虛構工場將布裁開車成恤衫|一間虛構物流公司將恤衫送去零售商|一間虛構舖頭將恤衫賣俾顧客,,Which step has to happen before the next one has anything to work on?,邊一步要做完，下一步先有嘢可以處理？,"The chain runs primary (growing cotton), then secondary (spinning and weaving, then cutting and sewing), then tertiary (delivery, then retailing). Delivery and retailing are services and always come after the goods exist.",順序係 primary（種棉花）→ secondary（紡織，然後裁車）→ tertiary（運送，然後零售）。運送同零售係服務，一定喺貨品出現之後先發生。
pp1-4-16,pp1,mc,pp,,"(Fictional) Ah Kuen owns a Tai Po orchard, decides every season what to plant, bears the loss if the harvest fails, and hires two pickers to do the picking. Which of the following is correct?",（虛構）阿娟擁有大埔一個果園，每造自己決定種咩，收成失敗就自己蝕，另外請咗兩個採摘工人。以下邊項啱？,"Her decision-making and risk-bearing is labour, and its return is wages|Her decision-making and risk-bearing is entrepreneurship, and its return is profits|The orchard land is capital, because it is used in production|The pickers' effort is entrepreneurship, because they decide how fast to pick",佢嘅決策同承擔風險係 labour，回報係 wages|佢嘅決策同承擔風險係 entrepreneurship，回報係 profits|個果園嘅土地係 capital，因為用咗喺生產度|採摘工人嘅勞力係 entrepreneurship，因為佢哋決定採幾快,,,B,"Who takes the loss if the harvest fails, and what is that function called?",收成失敗嘅時候邊個蝕錢？嗰個功能叫咩？,"Entrepreneurship is bearing business risk and making production decisions, and its return is profits. Labour earns wages, land earns rent, and capital earns interest. Land is a natural resource, not capital, even when used in production.",Entrepreneurship 係承擔營商風險同做生產決策，回報係 profits。Labour 收 wages，land 收 rent，capital 收 interest。土地係自然資源，就算用喺生產都唔係 capital。
pp1-4-17,pp1,mc,pp,,"(Fictional) A Chai Wan bakery has 6 bakers, each working 160 hours a month, and produces 19,200 loaves a month. The next month it keeps the same 6 bakers, each now works 200 hours, and total output rises to 22,000 loaves. What happened to labour productivity?","（虛構）柴灣一間麵包廠有 6 個師傅，每人每月做 160 個鐘，月產 19,200 個包。下個月仲係嗰 6 個師傅，每人做 200 個鐘，總產量升到 22,000 個包。Labour productivity 有咩變化？","It rose, because total output rose from 19,200 to 22,000 loaves|It rose, because output per worker rose from 3,200 to about 3,667 loaves|It fell, from 20 loaves per hour to about 18.3 loaves per hour|It stayed the same, because the number of bakers did not change","上升咗，因為總產量由 19,200 個升到 22,000 個|上升咗，因為每個工人嘅產量由 3,200 個升到大約 3,667 個|下跌咗，由每個鐘 20 個包跌到大約每個鐘 18.3 個包|冇變，因為師傅人數冇變",,,C,What exactly is the denominator in the labour productivity formula?,Labour productivity 條公式嘅分母到底係咩？,"Labour productivity = total output divided by total working HOURS. Hours rose from 960 to 1,200 while output rose from 19,200 to 22,000, so productivity fell from 20 to about 18.3. Output per worker and total output are not productivity.","Labour productivity = 總產量 ÷ 總工作時數。工時由 960 升到 1,200，產量由 19,200 升到 22,000，所以生產力由 20 跌到大約 18.3。每個工人嘅產量同總產量都唔係 productivity。"
pp1-4-18,pp1,mc,pp,,"(Fictional) A Kowloon City workshop pays its glass engravers by the hour rather than by the number of pieces finished, because every piece is engraved by hand and a small flaw ruins it. Which of the following best explains this choice of wage payment method?",（虛構）九龍城一間工場用時薪而唔係計件俾錢俾玻璃雕刻師傅，因為每件都係人手雕，少少瑕疵就報廢。以下邊項最能解釋呢個 wage payment method 嘅選擇？,"Time rate suits work where quality matters and rushing would be costly|Piece rate is impossible here, because the number of finished pieces cannot be counted|Time rate always gives a worker a stronger incentive to work quickly than piece rate|The workshop is using commission, which is a share of the firm's sales revenue",Time rate 適合重視質素、趕工代價大嘅工作|呢度用唔到 piece rate，因為數唔到完成咗幾多件|Time rate 一定比 piece rate 更能推動工人做快啲|間工場用緊 commission，即係公司銷售收入嘅一份,,,A,"If you paid by the piece here, what would workers be tempted to do to the quality?",如果呢度計件俾錢，工人會有咩誘因去犧牲質素？,"Piece rate suits standardised output that is easy to measure; time rate suits work where quality matters or output is hard to measure. The pieces here can be counted, so the reason is quality, not measurement. Piece rate, not time rate, pushes speed.",Piece rate 適合標準化、易量度嘅產出；time rate 適合重視質素或者產出難量度嘅工作。呢度數得到件數，所以原因係質素而唔係量度。推動速度嘅係 piece rate，唔係 time rate。
pp1-4-19,pp1,tf,pp,,"(Fictional) A Tsuen Wan herbal tea shop owns the ground-floor shop it trades in and pays rent to nobody, yet the land it uses still earns a return, measured by the rent that space could otherwise fetch.",（虛構）荃灣一間涼茶舖自己擁有間地舖，唔使俾租俾任何人，但佢用嘅土地仍然有回報，即係嗰個舖位本來可以收到嘅租。,,,,,T,"If the owner did not trade there, what could that shop space have earned?",如果老闆唔喺度做生意，嗰個舖位可以賺到咩？,"The return to land is rent whether or not a cheque changes hands. An owner-occupier forgoes the rent the space could fetch, so the rent is implicit rather than absent. The same logic gives an owner-manager an implicit wage.",土地嘅回報係 rent，唔理有冇真係俾錢。自用業主放棄咗個舖位可以收到嘅租，所以嗰筆租係隱含（implicit）而唔係冇。同樣道理，自己做老闆兼打理嘅人亦有 implicit wage。
pp1-4-20,pp1,fill,pp,,"(Fictional) Fill in the blanks. Labour supply equals the number of workers multiplied by average working hours, and is measured in ____ ; labour productivity equals total output divided by total working ____ .",（虛構）填空。Labour supply = 工人數目 × 平均工作時數，單位係 ①；labour productivity = 總產量 ÷ 總工作 ②。,man-hours|hours|workers|dollars,man-hours（工時）|hours（小時）|workers（工人）|dollars（元）,,,man-hours|hours,"Both formulae measure labour by time, not by headcount. Which unit says so?",兩條公式都係用時間量度勞動，唔係人頭。邊個單位表達到？,"Labour supply is a quantity of man-hours, and labour productivity is output per working hour. Dividing by the number of workers instead of hours is the standard error, because it hides changes in hours worked.",Labour supply 嘅單位係 man-hours，labour productivity 係每個工作小時嘅產量。用工人數目代替工時嚟除，係典型錯誤，因為會掩蓋咗工時嘅變化。
pp1-5-21,pp1,mc,pp,,"(Fictional) A Tuen Mun dumpling workshop has TFC of $800 a day. At 40 trays a day its TVC is $1,200; at 41 trays a day its TVC is $1,235. What is the marginal cost of the 41st tray?","（虛構）屯門一間餃子工場每日 TFC 係 $800。日產 40 盤時 TVC 係 $1,200；日產 41 盤時 TVC 係 $1,235。第 41 盤嘅 marginal cost 係幾多？","$50, the average cost at 40 trays|$49.63, the average cost at 41 trays|$835, the fixed cost plus the extra variable cost|$35, the rise in total cost caused by the extra tray",$50，即係 40 盤時嘅 average cost|$49.63，即係 41 盤時嘅 average cost|$835，即係 fixed cost 加埋多出嘅 variable cost|$35，即係多做一盤令 total cost 上升嘅金額,,,D,How much MORE does the workshop spend in total when output goes from 40 to 41 trays?,產量由 40 盤加到 41 盤，總支出多咗幾多？,"MC is the change in total cost from one more unit. TFC is unchanged, so MC = $1,235 - $1,200 = $35. Confusing MC with AC, or adding the whole fixed cost to MC, are the two classic errors: fixed cost never affects MC.","MC 係多生產一單位令 total cost 嘅變化。TFC 冇變，所以 MC = $1,235 - $1,200 = $35。將 MC 當成 AC，或者將成筆 fixed cost 加落 MC，係兩個典型錯誤：fixed cost 永遠唔影響 MC。"
pp1-5-22,pp1,mc,pp,,"(Fictional) A Cheung Chau dried-seafood workshop has one drying yard, which it cannot enlarge. With 1, 2, 3, 4 and 5 workers its total product per day is 10, 24, 42, 54 and 60 units. From which worker onwards do diminishing marginal returns set in?",（虛構）長洲一間海味工場得一個曬場，擴大唔到。請 1、2、3、4、5 個工人時，每日 total product 分別係 10、24、42、54、60 單位。由第幾個工人開始出現 diminishing marginal returns？,"The 2nd worker, because marginal product is already below average product|The 3rd worker, because total product grows fastest at that point|The 5th worker, because total product starts to fall|The 4th worker, because marginal product falls from 18 to 12 units",第 2 個工人，因為 marginal product 已經低過 average product|第 3 個工人，因為嗰度 total product 升得最快|第 5 個工人，因為 total product 開始下跌|第 4 個工人，因為 marginal product 由 18 跌到 12 單位,,,D,"Work out the extra output each worker adds, then find the first one that adds less than the worker before.",計一計每個工人額外帶嚟幾多產量，然後搵第一個加得少過前一個嘅工人。,"MP is 10, 14, 18, 12, 6. Diminishing marginal returns begin at the first worker whose MP falls, the 4th. MP rising up to the 3rd worker is normal because the fixed yard is under-used, and total product is still rising at the 5th worker.",MP 依次係 10、14、18、12、6。Diminishing marginal returns 由 MP 第一次下跌嗰個工人開始，即第 4 個。MP 升到第 3 個係正常，因為個固定曬場未用盡；而第 5 個工人時 total product 仍然係升緊。
pp1-5-23,pp1,mc,pp,,"(Fictional) As more and more watch-strap workshops move into one Kwun Tong industrial building, a nearby training centre starts running strap-stitching courses. Every workshop in the building now finds skilled staff more easily, and each one's LRAC falls. This is best described as:",（虛構）越嚟越多錶帶工場搬入觀塘同一幢工業大廈，附近一間培訓中心開始開辦錶帶車縫課程。而家大廈入面每間工場都更容易請到熟手工人，每間嘅 LRAC 都下跌。呢個情況最適合形容為：,"Internal economies of scale, because each workshop's own costs fell|Internal diseconomies of scale, because the building is getting crowded|External economies of scale, because the expansion of the industry lowered each firm's LRAC|Diminishing marginal returns, because more workers are crowded into the same building",Internal economies of scale，因為每間工場自己嘅成本跌咗|Internal diseconomies of scale，因為幢大廈越嚟越迫|External economies of scale，因為行業擴張令每間公司嘅 LRAC 下跌|Diminishing marginal returns，因為多咗工人迫喺同一幢大廈,,,C,"Whose expansion caused the fall in cost: one firm's, or the whole industry's?",令成本下跌嘅係邊個嘅擴張：一間公司，定係成個行業？,"External economies of scale arise when the INDUSTRY expands and every firm's LRAC falls, for example through an easier supply of trained workers. Internal economies require the firm's own scale to rise, and diminishing returns is a short-run idea needing a fixed factor.",External economies of scale 係成個行業擴張令每間公司嘅 LRAC 下跌，例如更易請到受過訓練嘅工人。Internal economies 要公司自己嘅規模擴大，而 diminishing returns 係短期概念，要有固定生產要素。
pp1-5-24,pp1,mc,pp,,"(Fictional) A Ma On Shan soap maker doubles its floor space, installs more mixers and hires more staff, all at once. Its LRAC falls. Which of the following is correct?",（虛構）馬鞍山一間番梘廠一次過將廠房面積加大一倍、裝多幾部攪拌機、又請多咗人。佢嘅 LRAC 下跌。以下邊項啱？,"It is a long-run change in which all factors vary, so it shows internal economies of scale|It is a short-run change, because the firm's output rises|It shows increasing marginal returns to the fixed factor|It shows external economies of scale, because the firm's cost per unit fell",呢個係所有生產要素都變嘅長期變化，所以顯示 internal economies of scale|呢個係短期變化，因為間廠嘅產量上升|呢個顯示固定生產要素出現 increasing marginal returns|呢個顯示 external economies of scale，因為間廠嘅單位成本跌咗,,,A,Is anything still fixed here? And whose scale changed?,呢度仲有冇嘢係固定嘅？係邊個嘅規模改變咗？,"When every factor including floor space is varied, the firm is operating in the long run, so falling unit cost is internal economies of scale. Diminishing or increasing marginal returns require at least one fixed factor, and external economies come from the industry's expansion, not the firm's.",當連廠房面積喺內嘅所有生產要素都變，間廠就係喺長期運作，所以單位成本下跌係 internal economies of scale。Diminishing 或 increasing marginal returns 一定要有至少一個固定生產要素，而 external economies 嚟自行業擴張，唔係一間公司自己。
hard_pp1-1-01,hard_pp1,dse,dse,,"(Fictional) Sisters Ah Ching and Ah Wai run a Cheung Chau fish-ball stall. Working alone, each can make 40 bowls a day. If Ah Ching does only the boiling and Ah Wai does only the serving, together they make 110 bowls a day. Ah Ching could instead work at a bakery for $400 a day, or mind her nephew, which she values at $250 a day. Explain her opportunity cost of staying at the stall, and why splitting the work raises output. (4 marks)",（虛構）阿晶同阿慧兩姊妹喺長洲開魚蛋檔。各自單獨做，每人每日做到 40 碗。如果阿晶淨係負責烚，阿慧淨係負責落單上菜，兩個夾埋每日做到 110 碗。阿晶本來可以去餅店返工，日薪 $400，又或者睇住個姨甥，佢自己覺得值日日 $250。解釋佢留喺檔口嘅 opportunity cost，以及點解分工會令產量上升。（4 分）,"Opportunity cost is the value of the highest-valued option forgone, so only one forgone option is counted.|Her opportunity cost of staying at the stall is $400, the bakery income, because it is worth more than the $250 she places on minding her nephew.|Splitting the work is complex division of labour: the two sisters do different stages of producing the same good.|Output per sister rises from 40 to 55 bowls a day because each repeats one task, gains practice and wastes less time switching between jobs.|Her opportunity cost is $650, the bakery income plus the value she places on minding her nephew.|Her opportunity cost is the value of the fish balls she produces at the stall.|Splitting the work is simple division of labour, because the two sisters do different jobs.|The rise in output from 80 to 110 bowls is an example of the law of diminishing marginal returns.",Opportunity cost 係被放棄選項之中最高價值嗰個嘅價值，所以只計一個被放棄嘅選項。|佢留喺檔口嘅 opportunity cost 係 $400 嘅餅店收入，因為高過佢對睇姨甥所估嘅 $250。|呢種分工係 complex division of labour：兩姊妹做緊同一件產品嘅唔同工序。|每人每日產量由 40 碗升到 55 碗，因為各自重複做一樣嘢，熟能生巧，又少咗轉換工作嘥嘅時間。|佢嘅 opportunity cost 係 $650，即係餅店收入加埋睇姨甥嘅價值。|佢嘅 opportunity cost 係佢喺檔口整到嘅魚蛋嘅價值。|呢種分工係 simple division of labour，因為兩姊妹做緊唔同嘅工作。|產量由 80 碗升到 110 碗係 law of diminishing marginal returns 嘅例子。,,,1|2|3|4,Which single option forgone is worth the most? And what exactly changed about how the two sisters work?,被放棄嘅選項之中，邊一個價值最高？另外，兩姊妹嘅工作方式究竟改變咗啲咩？,"Marks: the definition (one highest-valued option only), the correct figure $400, naming complex division of labour with the reason that the sisters do different STAGES of one good, and one valid productivity reason such as practice or less switching time. Adding $400 and $250 together, and calling stage-splitting 'simple', are the two errors examiners see most.",評分：定義（只計最高價值嗰一個）、正確數字 $400、指出 complex division of labour 並講明兩姊妹做同一件產品嘅唔同「工序」、以及一個有效嘅生產力理由（例如熟能生巧或者少咗轉換工作嘅時間）。將 $400 同 $250 加埋，同埋將分工序叫做 simple，係最常見嘅兩個錯。
hard_pp1-4-02,hard_pp1,dse,dse,,"(Fictional) A Fanling tofu workshop rents its premises for $12,000 a month. Each tray of tofu uses $5 of soybeans and $3 of hired labour. In a month when it makes 2,000 trays, identify the fixed and variable costs and calculate the average cost per tray. (3 marks)","（虛構）粉嶺一間豆腐工場每月租廠房俾 $12,000。每盤豆腐用 $5 黃豆同 $3 請人工。喺一個生產 2,000 盤嘅月份，指出邊啲係 fixed cost、邊啲係 variable cost，並計出每盤嘅 average cost。（3 分）","The premises are land, and the $12,000 paid for using them is rent, a fixed cost in the short run because it does not change with the number of trays.|The soybeans and the hired labour are variable costs, so TVC = 2,000 x $8 = $16,000.|TC = $12,000 + $16,000 = $28,000, so AC = $28,000 divided by 2,000 = $14 a tray.|AC is $8 a tray, because only the costs that change with output belong in average cost.|The rent is a variable cost, because the workshop could always move to smaller premises.|TC = $12,000 + $5 + $3 = $12,008 for the month.|The rent must be shared into marginal cost, so MC is also $14 a tray.","廠房係 land，俾嚟用佢嘅 $12,000 係 rent，喺短期係 fixed cost，因為唔會隨住做幾多盤而變。|黃豆同請返嚟嘅人工係 variable cost，所以 TVC = 2,000 x $8 = $16,000。|TC = $12,000 + $16,000 = $28,000，所以 AC = $28,000 ÷ 2,000 = 每盤 $14。|AC 係每盤 $8，因為只有會隨產量變嘅成本先計入 average cost。|租金係 variable cost，因為間工場隨時可以搬去細啲嘅廠房。|嗰個月嘅 TC = $12,000 + $5 + $3 = $12,008。|租金要攤分落 marginal cost，所以 MC 都係每盤 $14。",,,1|2|3,Which payment would still have to be made if the workshop made no tofu at all this month?,如果今個月一盤豆腐都唔做，邊筆錢仲係要俾？,"Marks: identifying the rent as the fixed cost paid for land, computing TVC by multiplying the per-unit variable costs by output, and completing TC = TFC + TVC then AC = TC divided by Q. Leaving fixed cost out of AC, and putting fixed cost into MC, are the two standard slips.",評分：指出租金係俾土地嘅 fixed cost、用每單位 variable cost 乘產量計 TVC、再用 TC = TFC + TVC 同 AC = TC ÷ Q 完成計算。將 fixed cost 漏出 AC，同埋將 fixed cost 塞入 MC，係兩個常見失誤。
hard_pp1-2-03,hard_pp1,dse,dse,,"(Fictional) In a fictional Hong Kong district, buyers start paying much more for ready-to-eat salted duck eggs than for raw ones. Within a year several duck farms there add a small curing and packing workshop, and two of them open their own online shops. Explain how the market mechanism directs this change, and classify the new activities by stage of production. (4 marks)",（虛構）喺一個虛構香港地區，買家開始肯出高好多嘅價錢買即食鹹鴨蛋，而唔係買生蛋。一年之內，嗰度有幾個鴨場加設咗細規模嘅醃製同包裝工場，其中兩個仲自己開網店。解釋 market mechanism 點樣引導呢個轉變，並將新活動按 stage of production 分類。（4 分）,"The higher price of ready-to-eat eggs is a signal that buyers value them more, so curing offers a higher profit than selling raw eggs.|Because the farms are privately owned, the farmers voluntarily move their own resources into curing and packing, so the market mechanism answers the what-to-produce question.|Raising the ducks and collecting the eggs is primary production, because output is taken from nature.|Curing and packing the eggs is secondary production, while running the online shop is tertiary production because it provides a service.|This is an example of command, because the higher price forces the farmers to switch.|Curing and packing is tertiary production, because it adds value instead of growing anything.|Running the online shop is secondary production, because a shop handles physical goods.|The market mechanism is answering the for-whom question here, because it decides who is allowed to buy the eggs.",即食蛋價錢較高係一個訊號，表示買家更重視佢，所以醃製嘅利潤高過賣生蛋。|因為啲鴨場係私人擁有，農戶自願將自己嘅資源轉去醃製同包裝，所以 market mechanism 解決咗 what to produce 嘅問題。|養鴨同收蛋係 primary production，因為產出係從大自然攞返嚟。|醃製同包裝鴨蛋係 secondary production，而經營網店係 tertiary production，因為提供緊服務。|呢個係 command 嘅例子，因為高價逼住啲農戶轉型。|醃製同包裝係 tertiary production，因為佢增值而唔係種嘢。|經營網店係 secondary production，因為舖頭處理緊實物。|呢度 market mechanism 解決緊 for whom 嘅問題，因為佢決定邊個可以買到啲蛋。,,,1|2|3|4,"What message does the price gap send, and who acted on it? Then ask of each activity: from nature, from materials, or a service?",個價格差距傳達緊咩訊息？邊個回應咗佢？然後逐項問：由大自然攞、將原料加工、定係提供服務？,"Marks: price and profit as the signal, private owners responding voluntarily so this is the market mechanism answering 'what', and the correct stage for each activity. Being 'forced' by a price is still the market, not command, which requires orders backed by authority.",評分：價格同利潤做訊號、私人擁有者自願回應所以係 market mechanism 解決 what、以及每項活動嘅正確階段。俾價格「逼」都仍然係市場，唔係 command，command 要有權力機關嘅命令。
hard_pp1-5-04,hard_pp1,dse,dse,,"(Fictional) A Tsuen Wan mooncake bakery has one oven and cannot fit another in its present shop. Adding a 5th baker raises daily output by fewer boxes than the 4th baker did. The owner says: 'This proves our bakery is already too big, so we must never expand.' Explain whether the owner is right. (3 marks)",（虛構）荃灣一間月餅舖得一個焗爐，而家間舖擺唔落第二個。請第 5 個師傅所增加嘅日產量，少過第 4 個師傅所增加嘅。老闆話：「呢個證明我哋間舖已經太大，所以永遠都唔應該擴張。」解釋老闆講得啱唔啱。（3 分）,"The falling marginal product is the law of diminishing marginal returns, a short-run result of adding a variable factor to a fixed factor, here the single oven.|Expanding the bakery is a long-run decision in which every factor, including the number of ovens, can be varied, so a short-run law says nothing about it.|If a larger scale lowers the bakery's LRAC, through bulk buying of ingredients or more division of labour, the firm enjoys internal economies of scale, so the owner is not right.|The falling marginal product shows internal diseconomies of scale, which is just another name for diminishing marginal returns.|Diminishing marginal returns proves the bakery has passed its optimal scale.|Because marginal product is falling, total output must be falling as well.|Buying a second oven would be an external economy of scale, since it lowers costs in the industry.",Marginal product 下跌就係 law of diminishing marginal returns，係短期將 variable factor 加落 fixed factor（呢度係嗰個焗爐）嘅結果。|擴張間舖係長期決定，連焗爐數目在內嘅所有生產要素都可以變，所以短期定律講唔到呢件事。|如果規模大咗令間舖嘅 LRAC 下跌，例如大手入貨或者有更多 division of labour，間舖就享有 internal economies of scale，所以老闆講得唔啱。|Marginal product 下跌顯示 internal diseconomies of scale，即係 diminishing marginal returns 嘅另一個叫法。|Diminishing marginal returns 證明咗間舖已經超越咗 optimal scale。|因為 marginal product 下跌，總產量一定都跟住跌。|買第二個焗爐係 external economy of scale，因為令行業成本下跌。,,,1|2|3,Is the oven fixed or variable in the owner's expansion plan? Does a law about one fixed factor apply when nothing is fixed?,喺老闆嘅擴張計劃入面，個焗爐係固定定可變？一條關於固定生產要素嘅定律，喺乜都唔固定嘅時候仲適用嗎？,"Marks: naming diminishing marginal returns and its short-run condition of a fixed factor, distinguishing the long run where all factors vary, and linking expansion to internal economies of scale with one valid source. Treating diminishing returns and diseconomies of scale as the same thing is the error this question tests, and falling MP still means rising total output while MP stays positive.",評分：指出 diminishing marginal returns 同佢嘅短期條件（有固定生產要素）、區分所有要素可變嘅長期、以及將擴張連繫到 internal economies of scale 並舉出一個有效來源。將 diminishing returns 同 diseconomies of scale 當成同一樣嘢，就係呢題考緊嘅錯誤；而 MP 仲係正數嘅時候，MP 下跌總產量仍然上升。
