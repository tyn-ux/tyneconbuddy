webrate-05,webrate,mc,,,Which of the following is most likely to raise labour productivity?,以下邊項最有可能提高 labour productivity？,hiring more workers with the same skills and machines|lengthening working hours to 14 hours a day|providing job training for workers|cutting the lighting in the workshop to save money,請多啲同樣技術、用同樣機器嘅工人|將工時延長到每日 14 個鐘|為工人提供在職培訓|減少工場照明以節省開支,,,C,"Which option makes each hour of work produce more, rather than simply adding hours?",邊個選項係令每個鐘生產多啲，而唔係淨係加多啲鐘？,"Better education and training raise output per man-hour. Hiring more or working longer raises labour supply, not productivity; a poor environment lowers productivity.",更好嘅教育同培訓提高每個 man-hour 嘅產量。多請人或加長工時增加嘅係 labour supply，唔係 productivity；工作環境差會降低 productivity。
webrate-06,webrate,mc,,,How does division of labour raise labour productivity?,Division of labour 點樣提高 labour productivity？,It makes workers work longer hours|It increases the number of workers|It lowers wages|Workers repeat a simple task and become more skilful at it,佢令工人做更長工時|佢增加工人數目|佢降低工資|工人重複做簡單工序，變得更熟練,,,D,What happens when you do the same small task again and again?,重複做同一個細工序，會有咩效果？,"Division of labour lets each worker specialise and become more skilful, raising output per man-hour.",Division of labour 令每個工人專門做一樣嘢、更熟練，提高每個 man-hour 嘅產量。
webrate-07,webrate,mc,,,"Firm X: 1,000 units from 250 man-hours. Firm Y: 1,200 units from 400 man-hours. Which is correct?","X 公司：用 250 man-hours 生產 1,000 件。Y 公司：用 400 man-hours 生產 1,200 件。以下邊句正確？",Y has higher productivity because it produces more|X has higher productivity: 4 vs 3 units per man-hour|They have equal productivity|Productivity cannot be compared without the number of workers,Y 產量較多，所以 productivity 較高|X 嘅 productivity 較高：每個 man-hour 4 件對 3 件|兩者 productivity 相同|唔知工人數目就無法比較 productivity,,,B,"Compare output per man-hour, not total output.",比較每個 man-hour 嘅產量，唔係總產量？,"X: 1,000 ÷ 250 = 4; Y: 1,200 ÷ 400 = 3. Higher total output does not mean higher productivity.","X：1,000 ÷ 250 = 4；Y：1,200 ÷ 400 = 3。總產量高唔代表 productivity 高。"
webrate-08,webrate,fill,,,Labour productivity = total ____ ÷ total number of working ____.,Labour productivity = 總 ① ÷ 總工作 ②。,output|hours|workers|wages,output|hours|workers|wages,,,output|hours,"What is on top, and is the bottom measured in people or time?",分子係咩？分母用人定用時間量度？,Productivity is output per man-hour: total output ÷ total working hours.,Productivity 係每個 man-hour 嘅產量：總產量 ÷ 總工作時數。
webrate-09,webrate,fill,,,"A team of 5 workers each works 8 hours and makes 200 bags. Total working hours are ____, so labour productivity is ____ bags per man-hour.",一隊 5 個工人每人做 8 個鐘，整咗 200 個袋。總工作時數係 ①，所以 labour productivity 係每個 man-hour ② 個袋。,40|5|25|13,40|5|25|13,,,40|5,"First find the man-hours, then divide output by them.",先計 man-hours，再用產量除佢？,5 × 8 = 40 man-hours; 200 ÷ 40 = 5 bags per man-hour. Dividing output by the number of workers is the common mistake.,5 × 8 = 40 man-hours；200 ÷ 40 = 每個 man-hour 5 個袋。用工人數去除係常見錯誤。
webrate-10,webrate,sort,,,Will each change raise or lower labour productivity?,以下每個轉變會提高定降低 labour productivity？,raise|lower,提高|降低,introducing performance-based pay|a hot and poorly ventilated workshop|better management and work planning|workers often falling sick|replacing old machines with advanced ones,引入按表現計薪|工場又熱又唔通風|更好嘅管理同工作安排|工人經常生病|用先進機器取代舊機器,1|2|1|2|1,Does it make each working hour produce more or less?,佢令每個工作小時生產多啲定少啲？,"Incentives, good management and advanced capital raise output per man-hour; a poor environment and poor health lower it.",誘因、良好管理同先進 capital 提高每個 man-hour 嘅產量；惡劣環境同健康差會降低佢。
webrate-11,webrate,sort,,,Does each change affect labour supply or labour productivity?,以下每個轉變影響嘅係 labour supply 定 labour productivity？,labour supply|labour productivity,labour supply|labour productivity,workers receive better training|the retirement age is raised|more immigrants join the workforce|the factory adopts division of labour|workers get healthier diets,工人接受更好培訓|提高退休年齡|更多移民加入勞動人口|工廠採用 division of labour|工人飲食更健康,2|1|1|2|2,"Does it change the number of hours, or what each hour produces?",佢改變嘅係鐘數，定係每個鐘嘅產量？,"Labour supply is total hours; productivity is output per hour. Training, health and division of labour work on output per hour.",Labour supply 係總鐘數；productivity 係每個鐘嘅產量。培訓、健康同 division of labour 影響每個鐘嘅產量。
webrate-12,webrate,order,,,Put the steps for calculating labour productivity in order:,排出計算 labour productivity 嘅步驟：,,,find the number of workers and average working hours|multiply them to get total man-hours|find the total output|divide total output by total man-hours,搵出工人數目同平均工時|相乘得出總 man-hours|搵出總產量|用總產量除以總 man-hours,,What do you need before you can divide?,要除之前，你需要先有咩數字？,Man-hours = workers × average hours; productivity = total output ÷ man-hours.,Man-hours = 工人數目 × 平均工時；productivity = 總產量 ÷ man-hours。
webrate-S1,webrate,mc,scen,,"(Fictional) In a Cheung Sha Wan factory, 10 machinists work 8 hours a day and sew 400 shirts. After new machines arrive, the same workers sew 560 shirts in the same hours. Labour productivity rises from:",（虛構）長沙灣一間工廠有 10 個車衣女工，每日做 8 個鐘，車到 400 件恤衫。新機器到咗之後，同一班人喺同樣時數車到 560 件。Labour productivity 由：,40 to 56 shirts per worker|400 to 560 shirts per man-hour|5 to 7 shirts per man-hour|50 to 70 shirts per man-hour,每個工人 40 件升到 56 件|每個 man-hour 400 件升到 560 件|每個 man-hour 5 件升到 7 件|每個 man-hour 50 件升到 70 件,,,C,First find the man-hours: 10 × 8.,先計 man-hours：10 × 8？,Man-hours = 80. 400 ÷ 80 = 5; 560 ÷ 80 = 7 shirts per man-hour. Per-worker figures are not labour productivity.,Man-hours = 80。400 ÷ 80 = 5；560 ÷ 80 = 7 件每 man-hour。用每個工人計唔係 labour productivity。
webrate-S2,webrate,fill,scen,,"(Fictional) A Kwun Tong bakery uses 6 workers working 5 hours each to make 1,200 buns. Total man-hours are ____ and labour productivity is ____ buns per man-hour.","（虛構）觀塘一間餅店用 6 個工人，每人做 5 個鐘，整咗 1,200 個包。總 man-hours 係 ①，labour productivity 係每個 man-hour ② 個包。",30|40|200|240,30|40|200|240,,,30|40,"Man-hours first, then output ÷ man-hours.",先計 man-hours，再用產量除 man-hours？,"6 × 5 = 30 man-hours; 1,200 ÷ 30 = 40 buns per man-hour. 200 is output per worker, a common mistake.","6 × 5 = 30 man-hours；1,200 ÷ 30 = 每個 man-hour 40 個包。200 係每個工人嘅產量，係常見錯誤。"
webrate-S3,webrate,mc,scen,,"(Fictional) Workshop A: 20 workers × 10 hours, 1,000 bags. Workshop B: 25 workers × 6 hours, 900 bags. Which workshop has higher labour productivity?","（虛構）A 工場：20 個工人 × 10 個鐘，1,000 個袋。B 工場：25 個工人 × 6 個鐘，900 個袋。邊間工場 labour productivity 較高？","A, because it produces more bags|A, because each worker makes 50 bags|They are equal|B: 6 vs 5 bags per man-hour",A，因為佢生產較多袋|A，因為每個工人整 50 個袋|兩者相同|B：每個 man-hour 6 個對 5 個,,,D,Find the man-hours of each workshop.,計吓每間工場嘅 man-hours？,"A: 1,000 ÷ 200 = 5; B: 900 ÷ 150 = 6 bags per man-hour. B has higher productivity despite lower total output.","A：1,000 ÷ 200 = 5；B：900 ÷ 150 = 6 個袋每 man-hour。B 總產量較少，但 productivity 較高。"
webrate-S4,webrate,sort,scen,,(Fictional) The owner of a Sham Shui Po garment workshop tries these measures. Which raise labour productivity?,（虛構）深水埗一間製衣工場老闆試咗以下措施。邊啲會提高 labour productivity？,raises productivity|does not raise productivity,提高 productivity|唔會提高 productivity,"installing fans and better lighting|splitting shirt-making into cutting, sewing and ironing|hiring 5 extra workers with the same output per hour|extending the working day by 2 hours|giving a reward for each defect-free batch",裝風扇同改善照明|將整恤衫拆成剪裁、車衣同熨衫工序|多請 5 個每個鐘產量一樣嘅工人|每日工時延長 2 個鐘|每批冇瑕疵貨品都有獎勵,1|1|2|2|1,Does the measure change output per man-hour or only the number of man-hours?,措施改變嘅係每個 man-hour 嘅產量，定只係 man-hours 數目？,"A better environment, division of labour and better rewards raise output per man-hour; more workers or longer hours only add man-hours.",改善環境、division of labour 同更好獎勵提高每個 man-hour 嘅產量；多請人或加長工時只係增加 man-hours。
webrate-S5,webrate,tf,scen,,"(Fictional) A Tsuen Wan factory keeps the same 10 workers but raises their working day from 8 to 10 hours; output rises from 8,000 to 9,000 units. Labour productivity therefore rose.","（虛構）荃灣一間工廠維持同一班 10 個工人，但將每日工時由 8 個鐘加到 10 個鐘，產量由 8,000 件升到 9,000 件。所以 labour productivity 上升咗。",,,,,F,"Work out the man-hours before and after, then compare output per man-hour.",計吓前後嘅 man-hours，再比較每個 man-hour 嘅產量？,"Before: 8,000 ÷ 80 = 100; after: 9,000 ÷ 100 = 90. Output rose, yet output per man-hour fell, so productivity fell.","之前：8,000 ÷ 80 = 100；之後：9,000 ÷ 100 = 90。產量上升，但每個 man-hour 嘅產量下降，所以 productivity 下降。"
hopcat-01,hopcat,tf,,,Occupational mobility refers to the willingness and ease of workers changing from one occupation to another.,Occupational mobility 係指工人由一種職業轉去另一種職業嘅意願同難易程度。,,,,,T,Is it about changing the type of job or the place of work?,講緊嘅係轉工種，定係轉工作地點？,Occupational mobility is about changing occupation; geographical mobility is about changing work location.,Occupational mobility 係轉職業；geographical mobility 係轉工作地點。
hopcat-02,hopcat,tf,,,A cook who moves from a restaurant in Tai O to a restaurant in Mong Kok shows occupational mobility.,一個廚師由大澳嘅餐廳轉去旺角嘅餐廳做，呢個係 occupational mobility。,,,,,F,"Did the job type change, or only the location?",工種有冇變，定係只係地點變咗？,"He is still a cook; only the work location changed, so this is geographical mobility.",佢仍然係廚師，只係工作地點變咗，所以係 geographical mobility。
hopcat-03,hopcat,tf,,,A bigger gap in rewards between two occupations tends to raise occupational mobility.,兩種職業之間嘅回報差距越大，occupational mobility 通常越高。,,,,,T,"If the other job pays much more, are workers more willing to switch?",如果另一份工人工高好多，工人會唔會更願意轉？,"A larger reward gap increases the willingness to change occupations, raising occupational mobility.",回報差距越大，轉職業嘅意願越高，occupational mobility 上升。
hopcat-04,hopcat,mc,,,Which of the following shows geographical mobility?,以下邊項係 geographical mobility？,a machinist becomes a sales clerk in the same district|a teacher becomes a social worker|a fisherman from Tai O moves to fish from Aberdeen|a clerk retrains as a nurse,車衣女工喺同一區轉做售貨員|老師轉做社工|大澳漁民搬去香港仔繼續捕魚|文員再培訓做護士,,,C,In which case does only the place of work change?,邊個情況只係工作地點改變？,Geographical mobility is changing work location; the fisherman keeps his occupation but moves place.,Geographical mobility 係轉工作地點；漁民職業不變，只係地點改變。
hopcat-05,hopcat,mc,,,Which change will RAISE occupational mobility?,以下邊個轉變會提高 occupational mobility？,higher skill requirements for the new occupation|more licensing restrictions to enter the occupation|less information about job vacancies|government-funded retraining programmes,新職業技術要求提高|入行牌照限制增加|職位空缺資訊減少|政府資助嘅再培訓課程,,,D,What makes it easier to learn the skills for a new job?,咩可以令人更容易學到新工作嘅技能？,"Retraining lowers the difficulty of changing occupation; higher skill requirements, entry restrictions and poor information lower occupational mobility.",再培訓降低轉職業嘅難度；技術要求高、入行限制多同資訊差都會降低 occupational mobility。
hopcat-06,hopcat,mc,,,Which change will RAISE geographical mobility?,以下邊個轉變會提高 geographical mobility？,a new railway line with cheaper fares to the city|stricter immigration policies|higher transport costs|more retraining courses,一條車費較平、通往市區嘅新鐵路|收緊移民政策|交通成本上升|更多再培訓課程,,,A,What makes it easier and cheaper to work in another place?,咩令人更容易、更平咁去第二個地方做嘢？,Better transport and lower transport costs make changing work location easier. Retraining mainly affects occupational mobility.,更好嘅交通同更低嘅交通成本令轉工作地點更容易。再培訓主要影響 occupational mobility。
hopcat-07,hopcat,mc,,,Why is the occupational mobility of surgeons lower than that of fast-food shop assistants?,點解外科醫生嘅 occupational mobility 低過快餐店店員？,surgeons earn lower wages|becoming a surgeon requires high skills and a professional licence|fast-food work has no reward|surgeons work in fewer locations,外科醫生人工較低|做外科醫生需要高技術同專業牌照|快餐店工作冇回報|外科醫生工作地點較少,,,B,How hard is it for someone from another occupation to become a surgeon?,其他行業嘅人要轉做外科醫生有幾難？,"High skill requirements and entry restrictions such as licensing make it hard to move into the occupation, so mobility is low.",高技術要求同牌照等入行限制令人難以轉入呢個職業，所以 mobility 低。
hopcat-08,hopcat,mc,,,Political instability in a worker's home place most directly raises his:,工人所在地政局不穩，最直接會提高佢嘅：,occupational mobility|labour productivity|geographical mobility|piece rate,occupational mobility|labour productivity|geographical mobility|piece rate,,,C,"Would he want to change job type, or leave the place?",佢會想轉工種，定係想離開嗰個地方？,"Instability at the current place makes workers more willing to work elsewhere, raising geographical mobility.",現居地唔穩定令工人更願意去其他地方工作，geographical mobility 上升。
hopcat-09,hopcat,fill,,,"Changing from one occupation to another is ____ mobility, while changing from one work location to another is ____ mobility.",由一種職業轉去另一種係 ① mobility，由一個工作地點轉去另一個係 ② mobility。,occupational|geographical|capital|social,occupational|geographical|capital|social,,,occupational|geographical,Which word is about jobs and which is about places?,邊個字關於職業、邊個字關於地方？,Occupational mobility concerns occupations; geographical mobility concerns work locations.,Occupational mobility 關於職業；geographical mobility 關於工作地點。
hopcat-10,hopcat,fill,,,"Better market ____ about vacancies raises both kinds of mobility, while ____ immigration policies raise geographical mobility.",有關空缺嘅市場 ① 更好會提高兩種 mobility，而 ② 嘅移民政策會提高 geographical mobility。,information|relaxed|strict|restrictions,information|relaxed|strict|restrictions,,,information|relaxed,Can workers move to jobs they do not know exist?,工人可唔可以轉去一份佢唔知道存在嘅工？,Market information helps workers find jobs in other occupations and places; relaxed immigration policies make it easier to work in another place.,市場資訊幫工人搵到其他職業同地方嘅工作；放寬移民政策令去其他地方工作更容易。
hopcat-11,hopcat,sort,,,Occupational or geographical mobility?,Occupational 定 geographical mobility？,occupational|geographical,occupational|geographical,a hawker becomes a bus driver|a nurse moves from a Kowloon hospital to one in the New Territories|a factory worker becomes a security guard|an engineer moves to work overseas as an engineer|a tailor becomes a tour guide,小販轉做巴士司機|護士由九龍嘅醫院轉去新界嘅醫院|工廠工人轉做保安|工程師移居海外繼續做工程師|裁縫轉做導遊,1|2|1|2|1,"Did the job type change, or only the place?",工種變咗，定只係地點變咗？,A change of job type is occupational mobility; the same job in a new place is geographical mobility.,轉工種係 occupational mobility；同一份工轉地點係 geographical mobility。
hopcat-12,hopcat,sort,,,Which kind of mobility does each factor mainly raise?,以下每個因素主要提高邊種 mobility？,occupational|geographical,occupational|geographical,lower skill requirements of a job|lower transport costs|fewer entry restrictions such as licences|relaxed immigration policies|retraining programmes,工作技術要求降低|交通成本下降|牌照等入行限制減少|放寬移民政策|再培訓課程,1|2|1|2|1,Does the factor make it easier to switch job type or to switch place?,呢個因素令轉工種定係轉地點更容易？,"Skills, entry restrictions and retraining affect occupational mobility; transport costs and immigration policies affect geographical mobility.",技術、入行限制同再培訓影響 occupational mobility；交通成本同移民政策影響 geographical mobility。
hopcat-S1,hopcat,mc,scen,,"(Fictional) Ah Kei, a young fisherman from Tai O, moves to Cheung Sha Wan to work as a machinist in a garment factory. This shows:",（虛構）大澳年輕漁民阿琪搬去長沙灣，喺製衣廠做車衣工。呢個反映：,occupational mobility only|geographical mobility only|neither kind of mobility|both occupational and geographical mobility,只有 occupational mobility|只有 geographical mobility|兩種 mobility 都冇|occupational 同 geographical mobility 都有,,,D,Did his job type change? Did his place of work change?,佢嘅工種有冇變？工作地點有冇變？,"He changed from fishing to sewing (occupational) and from Tai O to Cheung Sha Wan (geographical), so both apply.",佢由捕魚轉做車衣（occupational），又由大澳搬去長沙灣（geographical），兩種都有。
hopcat-S2,hopcat,sort,scen,,"(Fictional) Mrs Chan, a garment worker in Sham Shui Po, is thinking of becoming a caretaker. Sort each factor by its effect on her occupational mobility:",（虛構）深水埗製衣女工陳太諗緊轉做護理員。按對佢 occupational mobility 嘅影響將以下因素分類：,raises it|lowers it,提高|降低,a free government retraining course for caretakers|caretakers now need a two-year diploma|caretakers earn much more than garment workers|she cannot find any information about caretaker jobs|a new licence is needed to work as a caretaker,政府免費護理員再培訓課程|護理員而家要兩年文憑|護理員人工比製衣工高好多|佢搵唔到任何護理員職位資訊|做護理員要新牌照,1|2|1|2|2,"Does each factor make switching easier and more attractive, or harder?",每個因素令轉行更容易、更吸引，定更難？,"Retraining and bigger reward gaps raise occupational mobility; higher skill requirements, entry restrictions and poor information lower it.",再培訓同更大回報差距提高 occupational mobility；技術要求高、入行限制同資訊不足會降低佢。
hopcat-S3,hopcat,mc,scen,,(Fictional) A new ferry from Tai O to Tung Chung cuts the fare from $40 to $15. Tai O residents who keep their jobs as waiters but now work in Tung Chung show a rise in:,（虛構）一條新嘅大澳往東涌渡輪將船費由 $40 減到 $15。大澳居民繼續做侍應，但而家去咗東涌做，反映邊樣上升？,"geographical mobility, due to lower transport costs|occupational mobility, due to lower transport costs|labour productivity|capital accumulation",geographical mobility，因為交通成本下降|occupational mobility，因為交通成本下降|labour productivity|capital accumulation,,,A,Did their job type change?,佢哋嘅工種有冇變？,"Same occupation, new location: geographical mobility, raised by lower transport costs.",職業不變，地點改變：geographical mobility，因交通成本下降而上升。
hopcat-S4,hopcat,tf,scen,,(Fictional) An old master tailor in Sham Shui Po refuses to change jobs even though tailoring pay falls. Her low willingness to switch means her occupational mobility is low.,（虛構）深水埗一位老裁縫師傅就算裁縫收入下跌都唔肯轉行。佢轉行意願低，即係佢嘅 occupational mobility 低。,,,,,T,"Does mobility include willingness, or only ability?",Mobility 包唔包括意願，定只係能力？,Mobility covers both the willingness and the ease of changing; low willingness means low occupational mobility.,Mobility 包括轉換嘅意願同難易程度；意願低即係 occupational mobility 低。
hopcat-S5,hopcat,mc,scen,,"(Fictional) Jobs in Kwun Tong pay $3,000 more a month than similar jobs in Tai O, but the trip takes 3 hours each way. Which policy would MOST raise Tai O workers' geographical mobility?","（虛構）觀塘嘅工作每月比大澳同類工作多 $3,000，但單程要 3 個鐘。以下邊項政策最能提高大澳工人嘅 geographical mobility？",raising the skill requirements of Kwun Tong jobs|building a faster transport link|cutting wages in Kwun Tong|extending annual leave in Tai O,提高觀塘職位嘅技術要求|興建更快嘅交通連接|降低觀塘嘅工資|延長大澳嘅年假,,,B,What is stopping them from working in Kwun Tong?,係咩阻住佢哋去觀塘做嘢？,"Better transport makes changing work location easier, raising geographical mobility. Cutting the reward gap would lower it.",更好嘅交通令轉工作地點更容易，提高 geographical mobility。縮窄回報差距反而會降低佢。
paymyna-01,paymyna,tf,,,Commission is a share of the firm's profits paid to workers.,Commission 係將公司利潤嘅一部分分畀工人。,,,,,F,"Is commission based on how much the worker sells, or on what is left after costs?",Commission 係按工人賣咗幾多，定按扣除成本後剩低幾多計？,Commission is a percentage of sales revenue; a share of profits is profit-sharing.,Commission 係按 sales revenue 嘅百分比計；按利潤分成係 profit-sharing。
paymyna-02,paymyna,tf,,,"Under a piece rate, a worker's income tends to be less stable than under a time rate.",Piece rate 之下，工人收入通常冇 time rate 咁穩定。,,,,,T,What happens to a piece-rate worker's pay when orders are few?,訂單少嘅時候，按件計工嘅工人收入會點？,"Piece-rate pay depends on output, which varies with orders and ability, so income is unstable; time-rate pay depends on hours.",Piece rate 收入取決於產量，會隨訂單同能力變，所以唔穩定；time rate 按時間計。
paymyna-03,paymyna,tf,,,"Under a time rate, the employer's cost of monitoring workers' effort is higher than under a piece rate.",Time rate 之下，僱主監察工人努力程度嘅成本高過 piece rate。,,,,,T,"If pay does not depend on output, do workers have an incentive to work hard?",如果人工唔取決於產量，工人仲有冇誘因做得落力？,"Time-rate pay does not reward output, so workers may shirk and employers must spend more monitoring effort.",Time rate 唔按產量獎勵，工人可能卸膊，僱主要花更多成本監察努力程度。
paymyna-04,paymyna,mc,,,Piece rate is most suitable for jobs where:,Piece rate 最適合以下邊種工作？,quality matters most and output is hard to measure|each worker's contribution cannot be identified|output is standardised and easy to measure|workers provide direct services to customers,質素最重要，產量難以量度|無法分辨每個工人嘅貢獻|產品標準化、產量容易量度|工人直接為顧客提供服務,,,C,"To pay by output, what must the employer be able to do?",要按產量出糧，僱主一定要做到咩？,"Piece rate pays by output, so it suits standardised output that is easy to count.",Piece rate 按產量出糧，所以適合標準化、容易點算嘅產品。
paymyna-05,paymyna,mc,,,"Under a piece rate, the employer must spend more on monitoring:",Piece rate 之下，僱主要花更多成本監察：,workers' punctuality|the quality of output|the number of hours worked|workers' tips,工人有冇準時|產品質素|工作時數|工人收到嘅小費,,,B,"If workers rush to make more pieces, what might suffer?",如果工人趕住做多啲件數，邊方面可能受影響？,"Piece-rate workers have an incentive to rush for quantity, so employers bear a higher cost of monitoring quality.",Piece rate 工人有誘因趕量，所以僱主要承擔較高嘅質素監察成本。
paymyna-06,paymyna,mc,,,A restaurant waiter receives money directly from customers for good service. This is:,餐廳侍應因為服務好而直接收到客人畀嘅錢。呢個係：,commission|profit-sharing|piece rate|tips,commission|profit-sharing|piece rate|tips,,,D,"Who pays this money, the employer or the customer?",呢筆錢係僱主畀定係客人畀？,Tips are paid by customers to workers providing direct services.,Tips 係客人畀提供直接服務嘅工人。
paymyna-07,paymyna,mc,,,Why is time rate often used for teachers?,點解老師通常用 time rate 計薪？,quality matters and each teacher's contribution is hard to measure|teachers' output is standardised and easy to count|it gives teachers the strongest incentive to produce more|teachers sell goods to customers,質素重要，而且每位老師嘅貢獻難以量度|老師嘅產出標準化、容易點算|佢畀老師最強嘅誘因去生產更多|老師向顧客賣貨,,,A,Can you count a teacher's output like counting shirts?,你可唔可以好似數恤衫咁數老師嘅產出？,Time rate suits work where quality matters or contribution is hard to measure.,Time rate 適合重視質素或貢獻難以量度嘅工作。
paymyna-08,paymyna,fill,,,"A salesperson paid a percentage of her ____ revenue receives commission, while a worker paid a share of the firm's ____ receives profit-sharing.",按 ① revenue 嘅百分比收錢嘅售貨員收 commission，而按公司 ② 分成嘅工人收 profit-sharing。,sales|profits|wages|tips,sales|profits|wages|tips,,,sales|profits,Which is before costs are deducted and which is after?,邊個係扣除成本之前，邊個係之後？,Commission is based on sales revenue; profit-sharing is based on profits.,Commission 按 sales revenue 計；profit-sharing 按利潤計。
paymyna-09,paymyna,fill,,,"A machinist paid $2 per shirt sews 150 shirts a day. Her daily wage is $____, and this method is called ____.",一個車衣女工每件恤衫收 $2，每日車 150 件。佢每日工資係 $①，呢種方法叫做 ②。,300|152|piece rate|time rate,300|152|piece rate|time rate,,,300|piece rate,Pay per unit times the number of units?,每件工錢乘件數？,2 × 150 = $300. Paying by output is piece rate.,2 × 150 = $300。按產量出糧係 piece rate。
paymyna-10,paymyna,sort,,,Piece rate or time rate? Sort each feature.,Piece rate 定 time rate？將每個特點分類。,piece rate|time rate,piece rate|time rate,higher incentive to raise output|more stable income for workers|higher cost of monitoring quality|easier to recruit workers|higher cost of monitoring effort|suits standardised output,增加產量嘅誘因較大|工人收入較穩定|監察質素成本較高|較容易請人|監察努力程度成本較高|適合標準化產品,1|2|1|2|2|1,Is pay tied to output or to time?,人工同產量掛鈎，定同時間掛鈎？,"Piece rate: strong incentive, unstable income, high quality-monitoring cost. Time rate: stable income, easier recruitment, high effort-monitoring cost.",Piece rate：誘因強、收入唔穩、質素監察成本高。Time rate：收入穩定、較易請人、監察努力程度成本高。
paymyna-11,paymyna,sort,,,Which wage payment method is shown?,以下顯示嘅係邊種工資計算方法？,commission|profit-sharing|tips,commission|profit-sharing|tips,"an estate agent gets 1% of the property price sold|a hairdresser receives $20 from a happy customer|staff share 10% of the company's annual profit|a car salesman gets $5,000 for each car sold","地產經紀收成交樓價 1%|髮型師收到滿意顧客畀嘅 $20|員工分公司全年利潤 10%|汽車推銷員每賣一架車收 $5,000",1|3|2|1,"Is it based on sales, on profits, or given by the customer?",係按銷售、按利潤，定係客人直接畀？,"Pay tied to sales is commission, pay tied to profits is profit-sharing, and money from customers for direct services is tips.",按銷售計係 commission，按利潤計係 profit-sharing，客人因直接服務畀嘅錢係 tips。
paymyna-12,paymyna,mc,,,"An employer wants workers to care about the whole firm's performance, not just their own sales. Which method fits best?",僱主想員工關心成間公司嘅表現，而唔只係自己嘅銷售額。邊種方法最適合？,piece rate|commission|profit-sharing|time rate,piece rate|commission|profit-sharing|time rate,,,C,Which method links pay to the firm's overall result?,邊種方法將人工同公司整體成果掛鈎？,"Profit-sharing pays a share of the firm's profits, so workers gain when the whole firm does well.",Profit-sharing 按公司利潤分成，公司整體做得好，工人先得益。
paymyna-S1,paymyna,fill,scen,,"(Fictional) Ah Lan, an outworker in a Sham Shui Po tong lau, is paid $0.8 for each collar she sews. She sews 250 collars a day, so she earns $____ a day under a ____.",（虛構）深水埗唐樓外發工阿蘭每車一個衫領收 $0.8。佢每日車 250 個，所以每日賺 $①，呢種係 ②。,200|250.8|piece rate|time rate,200|250.8|piece rate|time rate,,,200|piece rate,Rate per piece times the number of pieces?,每件工錢乘件數？,"0.8 × 250 = $200; paying by output is piece rate, which suits standardised, easily counted work like collars.",0.8 × 250 = $200；按產量出糧係 piece rate，適合好似衫領咁標準化、容易點算嘅工作。
paymyna-S2,paymyna,mc,scen,,"(Fictional) A mobile phone shop in Mong Kok pays each salesperson 3% of the sales revenue she brings in. Kiki sells $200,000 of phones this month. Her pay from this method is:","（虛構）旺角一間手機舖按每個售貨員帶嚟嘅 sales revenue 畀 3%。Kiki 今個月賣咗 $200,000 手機。佢由呢個方法得到：","$600 of profit-sharing|$6,000 of profit-sharing|$600 of commission|$6,000 of commission","$600 profit-sharing|$6,000 profit-sharing|$600 commission|$6,000 commission",,,D,Is the 3% taken from sales or from profits?,個 3% 係由銷售額定由利潤計？,"3% × 200,000 = $6,000; a share of sales revenue is commission, not profit-sharing.","3% × 200,000 = $6,000；按 sales revenue 分成係 commission，唔係 profit-sharing。"
paymyna-S3,paymyna,mc,scen,,(Fictional) A Cheung Sha Wan garment factory switches its machinists from time rate to piece rate. What is the most likely result?,（虛構）長沙灣一間製衣廠將車衣女工由 time rate 改成 piece rate。最可能出現咩結果？,"output per worker rises, but the factory must check quality more carefully|workers' incomes become more stable|the factory must monitor effort more closely|workers produce less because pay no longer depends on output",每個工人產量上升，但工廠要更仔細檢查質素|工人收入變得更穩定|工廠要更緊密監察工人努力程度|工人生產少咗，因為人工唔再取決於產量,,,A,What do workers do when every extra piece means extra pay?,每多做一件就多一份錢，工人會點做？,"Piece rate gives a strong incentive to raise output, but workers may rush, so the cost of monitoring quality rises; income becomes less stable.",Piece rate 提供強烈誘因增加產量，但工人可能趕貨，所以質素監察成本上升；收入亦會冇咁穩定。
paymyna-S4,paymyna,sort,scen,,(Fictional) Sort each worker in a Sham Shui Po street by the main payment method:,（虛構）按主要計薪方法，將深水埗一條街上嘅工人分類：,piece rate|time rate|tips,piece rate|time rate|tips,"a button-sewer paid per 100 buttons|a security guard paid $60 an hour|a porter given $10 by a shopper for carrying cloth|a shop assistant paid $12,000 a month|a worker paid per bundle of cloth cut","每釘 100 粒鈕收錢嘅釘鈕工|時薪 $60 嘅保安員|幫客搬布收到客人 $10 嘅搬運工|月薪 $12,000 嘅店員|每剪一紮布收錢嘅剪布工",1|2|3|2|1,"Is the pay based on output, on time, or given by customers?",人工係按產量、按時間，定係客人畀？,Pay per unit of output is piece rate; pay per hour or month is time rate; money from customers for direct services is tips.,按產量單位計係 piece rate；按鐘或按月計係 time rate；客人因直接服務畀嘅錢係 tips。
paymyna-S5,paymyna,tf,scen,,"(Fictional) A Kwun Tong trading company pays all staff 5% of its annual profit. In a year when the company makes a loss, staff receive nothing from this scheme even if sales were high.",（虛構）觀塘一間貿易公司將全年利潤嘅 5% 分畀全體員工。如果公司某年蝕錢，就算銷售額好高，員工喺呢個計劃都收唔到錢。,,,,,T,Is this scheme based on sales or on profits?,呢個計劃係按銷售額定按利潤計？,"This is profit-sharing: it depends on profits, not sales revenue, so a loss means no share even when sales are high.",呢個係 profit-sharing：取決於利潤而唔係 sales revenue，所以蝕錢就冇得分，就算銷售額高都一樣。
runtle-01,runtle,tf,,,The short run is any period shorter than one year.,Short run 即係任何少過一年嘅時期。,,,,,F,"Is the short run defined by the calendar, or by whether some factor is fixed?",Short run 係用日曆長短去界定，定係睇有冇 factor 係固定？,The short run is a period with at least one fixed factor. It is not defined by calendar length; its length differs from firm to firm.,Short run 嘅定義係至少有一種 fixed factor，唔係用日曆時間界定；每間 firm 嘅長短都唔同。
runtle-02,runtle,tf,,,"In the long run, all factors of production are variable.",喺 long run，所有生產要素都係 variable。,,,,,T,"In the long run, is there any factor the firm cannot change?",喺 long run，仲有冇 firm 改變唔到嘅 factor？,The long run is a period in which there are no fixed factors: all factors can be varied.,Long run 係一段冇 fixed factor 嘅時期：所有 factors 都可以改變。
runtle-03,runtle,tf,,,"During a two-year lease, the sewing machines a factory has leased are a fixed factor.",喺兩年租約期內，工廠租返嚟嘅衣車係 fixed factor。,,,,,T,Can the number of leased machines change when the factory produces a bit more or less?,工廠生產多啲或者少啲，租咗嘅衣車數目會唔會跟住變？,A fixed factor is one whose quantity does not vary with output. Machines under lease stay the same whatever the output.,Fixed factor 嘅數量唔會隨產量改變。租約內嘅衣車，無論產量幾多都係咁多部。
runtle-04,runtle,mc,,,The short run refers to a period in which:,Short run 係指一段時期，喺呢段時期：,all factors of production are variable|the firm produces for less than one year|there is at least one fixed factor|there are no variable factors,所有生產要素都係 variable|firm 生產唔夠一年|至少有一種 fixed factor|冇任何 variable factor,,,C,What makes the short run different from the long run?,Short run 同 long run 嘅分別喺邊度？,Short run: at least one fixed factor. Long run: no fixed factors. Calendar time is not the criterion.,Short run：至少有一種 fixed factor。Long run：冇 fixed factor。準則唔係日曆時間。
runtle-05,runtle,mc,,,"For a garment factory, which of the following is a variable factor?",對一間製衣廠嚟講，以下邊樣係 variable factor？,the rented factory floor|the cloth used to make shirts|the machines under a three-year lease|the factory's signboard,租返嚟嘅廠房|用嚟做恤衫嘅布料|三年租約嘅機器|工廠嘅招牌,,,B,Which input must increase if the factory makes more shirts?,如果工廠做多啲恤衫，邊樣投入一定要增加？,A variable factor's quantity varies with output. More shirts need more cloth; the floor and leased machines stay unchanged.,Variable factor 嘅數量隨產量改變。做多啲恤衫就要多啲布；廠房同租咗嘅機器就唔變。
runtle-06,runtle,mc,,,A factory owner wants to move to a bigger factory building. He can do this only in:,一個廠東想搬去一幢更大嘅工廠大廈。佢只可以喺以下邊個時期做到？,"the short run|the market period, when output is fixed|any period of less than one month|the long run",short run|產量固定嘅 market period|任何少過一個月嘅時期|long run,,,D,"In which period can every factor, including the premises, be changed?",喺邊個時期，包括廠房在內，所有 factors 都可以改變？,"Changing the premises means the premises are variable. When all factors can vary, the firm is in the long run.",改變廠房即係廠房都變成 variable。所有 factors 都可以改變，就係 long run。
runtle-07,runtle,mc,,,Which statement about the short run and the long run is correct?,以下邊句有關 short run 同 long run 嘅講法係正確？,"A hawker's long run may be much shorter in calendar time than a power company's long run.|The long run of every firm is exactly five years.|In the short run, all factors are fixed.|In the long run, there is still one fixed factor.",一個小販嘅 long run 以日曆時間計，可能比一間電力公司嘅 long run 短好多。|每間 firm 嘅 long run 都係啱啱好五年。|喺 short run，所有 factors 都係固定。|喺 long run，仍然有一種 fixed factor。,,,A,"How long does it take a hawker, compared with a power company, to change all its inputs?",小販同電力公司要改變所有投入，各自要幾耐？,"The runs are defined by fixed factors, not calendar time. A hawker can change all inputs quickly; a power plant takes years. In the short run only at least one factor is fixed, not all.",Run 係用 fixed factor 界定，唔係日曆時間。小販好快就改變到所有投入，電廠就要好多年。Short run 只係至少一種 factor 固定，唔係全部固定。
runtle-08,runtle,fill,,,"In the ____ run, there is at least one ____ factor.",喺 ① run，至少有一種 ② factor。,short|long|fixed|variable,short|long|fixed|variable,,,short|fixed,Which run still has something the firm cannot change?,邊個 run 仲有 firm 改變唔到嘅嘢？,Definition: short run = at least one fixed factor; long run = no fixed factors.,定義：short run = 至少一種 fixed factor；long run = 冇 fixed factor。
runtle-09,runtle,fill,,,"A factor whose quantity varies with output is a ____ factor. In the long run, there are ____ fixed factors.",數量隨產量改變嘅 factor 係 ① factor。喺 long run，有 ② fixed factors。,variable|fixed|no|some,variable|fixed|冇|一啲,,,variable|no,"If a factor changes with output, is it fixed? And can anything stay fixed in the long run?",隨產量改變嘅 factor 算唔算固定？喺 long run 又有冇嘢要保持固定？,"Variable factor: quantity varies with output. Long run: all factors are variable, so there are no fixed factors.",Variable factor：數量隨產量改變。Long run：所有 factors 都係 variable，所以冇 fixed factor。
runtle-10,runtle,sort,,,Sort the inputs of a Cheung Sha Wan garment factory in the short run:,將長沙灣製衣廠喺 short run 嘅投入分類：,fixed factor|variable factor,fixed factor|variable factor,the rented factory floor|sewing machines under a one-year lease|piece-rate workers|cloth|thread,租返嚟嘅廠房|一年租約嘅衣車|計件工人|布料|線,1|1|2|2|2,Does the quantity of this input change when output changes?,產量改變嘅時候，呢樣投入嘅數量會唔會跟住變？,"Fixed factors stay the same whatever the output (premises, leased machines). Variable factors change with output (piece-rate workers, cloth, thread).",Fixed factor 無論產量幾多都唔變（廠房、租咗嘅機器）。Variable factor 隨產量改變（計件工人、布料、線）。
runtle-11,runtle,sort,,,Is each firm operating in the short run or the long run?,以下每間 firm 係喺 short run 定 long run 運作？,short run|long run,short run|long run,"A workshop hires three more workers but keeps the same floor and machines.|A firm moves to a bigger building and changes the number of machines and workers.|A tailor buys more cloth and works overtime with the same sewing machine.|A new firm plans the size of its factory, machines and workforce from scratch.",工場請多三個工人，但廠房同機器唔變。|firm 搬去大啲嘅大廈，機器同工人數目都改變。|裁縫買多啲布、用同一部衣車開 OT。|新 firm 由零開始計劃廠房大細、機器同人手。,1|2|1|2,Is at least one factor unchanged in each case?,每個情況入面，係咪至少有一種 factor 冇變？,"If at least one factor is kept fixed, it is the short run. If every factor can be changed, including premises and machines, it is the long run.",只要至少一種 factor 保持固定，就係 short run。如果所有 factors，包括廠房同機器，都可以改變，就係 long run。
runtle-12,runtle,mc,,,Whether a factor is fixed or variable depends on whether:,一種 factor 係 fixed 定 variable，取決於：,it is expensive or cheap|it is a machine or a person|its quantity varies with output|it lasts more than one year,佢貴定平|佢係機器定係人|佢嘅數量會唔會隨產量改變|佢可唔可以用超過一年,,,C,Think of a worker on a long contract. Is a person always a variable factor?,諗吓一個簽咗長約嘅員工，人係咪一定係 variable factor？,"The criterion is whether the quantity varies with output, not the price, the type of input or its lifespan.",準則係數量會唔會隨產量改變，唔係價錢、投入種類或者可用幾耐。
runtle-S1,runtle,mc,scen,,"(Fictional) In the 1970s, Mr Ho rents one floor in Cheung Sha Wan under a three-year lease and has 20 sewing machines. He gets a big order and hires 10 more piece-rate workers. Mr Ho is operating in:",（虛構）1970 年代，何生喺長沙灣租咗一層廠房，租約三年，有 20 部衣車。佢接到一張大單，請多 10 個計件工人。何生係喺邊個時期運作？,"the long run, because he changed the number of workers|the short run, because the floor and machines are fixed|the long run, because the lease is longer than one year|neither, because workers are fixed factors",long run，因為佢改變咗工人數目|short run，因為廠房同衣車係固定|long run，因為租約長過一年|兩者都唔係，因為工人係 fixed factor,,,B,"Did he change every factor, or only some?",佢改變咗所有 factors，定係只係改變咗一部分？,Only the variable factor (workers) changed; the premises and machines remain fixed. At least one fixed factor means the short run.,只係 variable factor（工人）改變咗，廠房同衣車仍然固定。至少有一種 fixed factor 即係 short run。
runtle-S2,runtle,sort,scen,,(Fictional) Auntie Lan runs a dai pai dong in Sham Shui Po with one licensed stall and two stoves. Sort her inputs for this month:,（虛構）蘭姐喺深水埗開咗個大牌檔，有一個牌照檔位同兩個爐頭。將佢今個月嘅投入分類：,fixed factor|variable factor,fixed factor|variable factor,the licensed stall space|the two stoves|noodles|eggs|helpers paid by the hour,牌照檔位|兩個爐頭|麵|雞蛋|按鐘數計人工嘅幫工,1|1|2|2|2,"If she sells more bowls tonight, which inputs rise?",如果佢今晚賣多啲碗，邊啲投入會增加？,"Inputs that rise with output (noodles, eggs, hourly helpers) are variable. The stall and stoves stay the same this month, so they are fixed.",隨產量增加嘅投入（麵、雞蛋、按鐘幫工）係 variable。檔位同爐頭今個月唔變，所以係 fixed。
runtle-S3,runtle,tf,scen,,"(Fictional) Five years later, Mr Ho's lease ends. He moves to a bigger building and chooses new numbers of machines and workers. He is now making a long-run decision.",（虛構）五年後，何生嘅租約完咗。佢搬去一幢大啲嘅大廈，重新決定機器同工人數目。佢而家係做緊一個 long-run 決定。,,,,,T,Is any factor still fixed for him at this point?,喺呢個時候，佢仲有冇 factor 係固定？,"When premises, machines and workers can all be changed, there are no fixed factors, so it is the long run.",廠房、機器同工人全部都可以改變，冇 fixed factor，所以係 long run。
runtle-S4,runtle,mc,scen,,(Fictional) A milk tea stall can change all its inputs within one month. A power company needs eight years to build a new plant. Which statement is correct?,（虛構）一個奶茶檔一個月內可以改變所有投入。一間電力公司要八年先起到一間新電廠。以下邊句正確？,"Both firms have the same long run, because the long run is always one year.|The milk tea stall has no short run.|The power company is always in the long run.|The long run is longer in calendar time for the power company, because the runs are not defined by calendar time.",兩間 firm 嘅 long run 一樣，因為 long run 一定係一年。|奶茶檔冇 short run。|電力公司永遠都係喺 long run。|以日曆時間計，電力公司嘅 long run 長啲，因為 run 唔係用日曆時間界定。,,,D,How long does each firm need before all its factors become variable?,每間 firm 要幾耐先可以令所有 factors 變成 variable？,The long run is the period in which all factors are variable. That takes about a month for the stall but years for the power company.,Long run 係所有 factors 都 variable 嘅時期。奶茶檔大約一個月就做到，電力公司就要好多年。
runtle-S5,runtle,fill,scen,,"(Fictional) A Kwun Tong bakery has two ovens under a two-year lease and six workers. To bake more bread next week, it can hire more workers, but the ovens are ____ factors, so the bakery is in the ____ run.",（虛構）觀塘一間餅店有兩個焗爐（兩年租約）同六個員工。下個禮拜想焗多啲麵包，可以請多啲人，但焗爐係 ① factors，所以餅店係喺 ② run。,fixed|variable|short|long,fixed|variable|short|long,,,fixed|short,Can the number of leased ovens change within a week?,租咗嘅焗爐數目，一個禮拜內改唔改到？,"The ovens do not vary with output during the lease, so they are fixed factors. With at least one fixed factor, it is the short run.",租約期內焗爐唔會隨產量改變，所以係 fixed factor。至少有一種 fixed factor，就係 short run。
abacost-01,abacost,tf,,,Total cost (TC) equals total fixed cost (TFC) plus total variable cost (TVC).,Total cost (TC) 等於 total fixed cost (TFC) 加 total variable cost (TVC)。,,,,,T,What two kinds of cost does a firm have in the short run?,喺 short run，firm 有邊兩類成本？,"In the short run, TC = TFC + TVC.",喺 short run，TC = TFC + TVC。
abacost-02,abacost,tf,,,"If a factory's rent rises, the marginal cost (MC) of each unit of output rises.",如果工廠租金上升，每單位產量嘅 marginal cost (MC) 都會上升。,,,,,F,Does the rent change when the factory produces one more unit?,工廠多生產一單位，租金會唔會改變？,"Rent is a fixed cost. MC = TC(x) − TC(x−1) = TVC(x) − TVC(x−1), so fixed cost cancels out and MC is not affected.",租金係 fixed cost。MC = TC(x) − TC(x−1) = TVC(x) − TVC(x−1)，fixed cost 會抵銷，所以 MC 唔受影響。
abacost-03,abacost,tf,,,"When output is zero in the short run, total cost equals total fixed cost.",喺 short run，產量係零嘅時候，total cost 等於 total fixed cost。,,,,,T,"If nothing is produced, is there any variable cost?",如果乜都冇生產，仲有冇 variable cost？,"At zero output, TVC = 0, so TC = TFC + 0 = TFC. Fixed costs must be paid even with no output.",產量係零，TVC = 0，所以 TC = TFC + 0 = TFC。冇生產都要付 fixed cost。
abacost-04,abacost,mc,,,"A workshop has TFC = $100. When output is 4 units, TVC = $160. What is the average cost (AC) at 4 units?",一個工場 TFC = $100。產量係 4 單位嘅時候，TVC = $160。4 單位嘅 average cost (AC) 係幾多？,$40|$65|$25|$260,$40|$65|$25|$260,,,B,"Find TC first, then divide by output.",先搵 TC，再除以產量？,"TC = 100 + 160 = 260. AC = TC ÷ Q = 260 ÷ 4 = 65. ($40 is AVC, $25 is average fixed cost, $260 is TC.)",TC = 100 + 160 = 260。AC = TC ÷ Q = 260 ÷ 4 = 65。（$40 係 AVC，$25 係 average fixed cost，$260 係 TC。）
abacost-05,abacost,mc,,,TC is $190 when output is 2 units and $220 when output is 3 units. What is the MC of the 3rd unit?,產量係 2 單位時 TC 係 $190，3 單位時 TC 係 $220。第 3 單位嘅 MC 係幾多？,$220|$410|$30|$73.3,$220|$410|$30|$73.3,,,C,MC is the change in TC when one more unit is produced.,MC 係多生產一單位時 TC 嘅改變，你會點計？,"MC(3) = TC(3) − TC(2) = 220 − 190 = 30. $73.3 is AC (220 ÷ 3), not MC.",MC(3) = TC(3) − TC(2) = 220 − 190 = 30。$73.3 係 AC（220 ÷ 3），唔係 MC。
abacost-06,abacost,mc,,,Which of the following is a fixed cost for a garment factory?,以下邊樣係製衣廠嘅 fixed cost？,the cost of cloth|wages of piece-rate workers|the cost of thread|the monthly rent of the factory floor,布料成本|計件工人嘅工資|線嘅成本|廠房每月租金,,,D,"Which cost stays the same whether the factory makes 100 or 1,000 shirts?","無論工廠做 100 件定 1,000 件恤衫，邊樣成本都唔變？","A fixed cost does not vary with output. Rent is paid in full whatever the output; cloth, thread and piece-rate wages rise with output.",Fixed cost 唔會隨產量改變。無論產量幾多都要交足租；布、線同計件工資就隨產量增加。
abacost-07,abacost,mc,,,TVC at an output of 3 units equals:,產量係 3 單位時嘅 TVC 等於：,"the MC of the 3rd unit|the sum of the MC of the 1st, 2nd and 3rd units|TC at 3 units plus TFC|AVC at 3 units divided by 3",第 3 單位嘅 MC|第 1、2、3 單位 MC 嘅總和|3 單位嘅 TC 加 TFC|3 單位嘅 AVC 除以 3,,,B,Each MC is the extra variable cost of one more unit. What happens if you add them up?,每個 MC 都係多一單位嘅額外 variable cost，將佢哋加埋會得到咩？,"TVC = ΣMC: adding the MC of each unit gives the total variable cost. TVC = TC − TFC (not plus), and TVC = AVC × Q (not ÷).",TVC = ΣMC：將每單位嘅 MC 加埋就係 TVC。TVC = TC − TFC（唔係加），TVC = AVC × Q（唔係除）。
abacost-08,abacost,fill,,,AVC = TVC ÷ ____. MC is the change in ____ when one more unit is produced.,AVC = TVC ÷ ①。MC 係多生產一單位時 ② 嘅改變。,output|TC|TFC|price,產量|TC|TFC|價格,,,output|TC,What do we divide by to get an 'average'? Which total changes when output rises by one?,計「平均」要除以乜？產量加一，邊個總數會改變？,"AVC = TVC ÷ Q. MC = TC(x) − TC(x−1), which equals TVC(x) − TVC(x−1). TFC does not change with output.",AVC = TVC ÷ Q。MC = TC(x) − TC(x−1)，亦即 TVC(x) − TVC(x−1)。TFC 唔會隨產量改變。
abacost-09,abacost,fill,,,"The MC of the 1st, 2nd and 3rd units are $50, $40 and $30. TFC is $100. TVC at 3 units is $____ and TC at 3 units is $____.",第 1、2、3 單位嘅 MC 分別係 $50、$40 同 $30。TFC 係 $100。3 單位嘅 TVC 係 $①，TC 係 $②。,120|220|100|320,120|220|100|320,,,120|220,Add up the MCs first. Then what must you add to get TC?,先將 MC 加埋，之後要再加乜先得到 TC？,TVC = ΣMC = 50 + 40 + 30 = 120. TC = TFC + TVC = 100 + 120 = 220.,TVC = ΣMC = 50 + 40 + 30 = 120。TC = TFC + TVC = 100 + 120 = 220。
abacost-10,abacost,sort,,,Sort the costs of a Cheung Sha Wan garment factory:,將長沙灣製衣廠嘅成本分類：,fixed cost|variable cost,fixed cost|variable cost,rent of the factory floor|lease payment for sewing machines|fire insurance premium for the factory|piece-rate wages|cost of cloth|cost of thread,廠房租金|衣車租金|工廠火險保費|計件工資|布料成本|線嘅成本,1|1|1|2|2|2,Does the cost go up when the factory makes more garments?,工廠做多啲衫，呢樣成本會唔會上升？,"Fixed costs do not vary with output (rent, lease payment, insurance). Variable costs rise with output (piece-rate wages, cloth, thread).",Fixed cost 唔隨產量改變（租金、衣車租、保險）。Variable cost 隨產量上升（計件工資、布、線）。
abacost-11,abacost,sort,,,A factory's TFC rises while everything else is unchanged. Sort each cost measure (at the same output):,一間工廠嘅 TFC 上升，其他不變。將以下各項成本分類（喺同一產量）：,rises|unchanged,上升|不變,TC|AC|MC|AVC|TVC,TC|AC|MC|AVC|TVC,1|1|2|2|2,Which measures include TFC in their calculation?,邊啲成本計法入面有包括 TFC？,"TC = TFC + TVC and AC = TC ÷ Q both include TFC, so they rise. TVC, AVC and MC depend only on variable cost, so they are unchanged.",TC = TFC + TVC 同 AC = TC ÷ Q 都包括 TFC，所以上升。TVC、AVC 同 MC 只取決於 variable cost，所以不變。
abacost-12,abacost,order,,,Put the steps in order to find AC at a given output from a table of TFC and TVC:,由一個列出 TFC 同 TVC 嘅表計某產量嘅 AC，將步驟排好次序：,,,Read TFC and TVC at that output|Add them to get TC|Divide TC by the output,睇返嗰個產量嘅 TFC 同 TVC|將兩者加埋得到 TC|將 TC 除以產量,,What must you know before you can divide by output?,除以產量之前，你要先知道乜？,"AC = TC ÷ Q, and TC = TFC + TVC, so TC must be found before dividing.",AC = TC ÷ Q，而 TC = TFC + TVC，所以要先計 TC 再除。
abacost-S1,abacost,mc,scen,,"(Fictional) A 1970s Cheung Sha Wan shirt workshop pays $300 rent a month (its only fixed cost). TVC is $200 for 1 dozen shirts, $350 for 2 dozen and $480 for 3 dozen. What is the AC per dozen at 3 dozen?",（虛構）1970 年代長沙灣一間恤衫工場每月租金 $300（唯一嘅 fixed cost）。做 1 打恤衫 TVC 係 $200，2 打係 $350，3 打係 $480。做 3 打時每打嘅 AC 係幾多？,$160|$100|$260|$780,$160|$100|$260|$780,,,C,What is TC at 3 dozen?,做 3 打嘅 TC 係幾多？,TC = 300 + 480 = 780. AC = 780 ÷ 3 = 260. ($160 is AVC = 480 ÷ 3; $100 is average fixed cost = 300 ÷ 3.),TC = 300 + 480 = 780。AC = 780 ÷ 3 = 260。（$160 係 AVC = 480 ÷ 3；$100 係 average fixed cost = 300 ÷ 3。）
abacost-S2,abacost,fill,scen,,"(Fictional) Same shirt workshop: TVC is $200 for 1 dozen, $350 for 2 dozen and $480 for 3 dozen. The MC of the 2nd dozen is $____ and the MC of the 3rd dozen is $____.",（虛構）同一間恤衫工場：做 1 打 TVC 係 $200，2 打係 $350，3 打係 $480。第 2 打嘅 MC 係 $①，第 3 打嘅 MC 係 $②。,150|130|350|480,150|130|350|480,,,150|130,How much does TVC rise each time one more dozen is made?,每多做一打，TVC 升咗幾多？,MC = TVC(x) − TVC(x−1). MC(2) = 350 − 200 = 150. MC(3) = 480 − 350 = 130.,MC = TVC(x) − TVC(x−1)。MC(2) = 350 − 200 = 150。MC(3) = 480 − 350 = 130。
abacost-S3,abacost,mc,scen,,(Fictional) The landlord raises the workshop's rent from $300 to $400 a month. What happens to the MC of the 3rd dozen (previously $130)?,（虛構）業主將工場租金由每月 $300 加到 $400。第 3 打嘅 MC（原本 $130）會點？,It rises to $230.|It stays at $130.|It rises by about $33.|It falls to $30.,升到 $230。|維持 $130。|升大約 $33。|跌到 $30。,,,B,Does the extra rent depend on how many dozens are made?,加咗嘅租金同做幾多打有冇關係？,Rent is a fixed cost. MC = TVC(3) − TVC(2) = 480 − 350 = 130 either way; only TC and AC rise.,租金係 fixed cost。MC = TVC(3) − TVC(2) = 480 − 350 = 130，冇變；只有 TC 同 AC 上升。
abacost-S4,abacost,sort,scen,,(Fictional) Sort the monthly costs of a small café in Mong Kok:,（虛構）將旺角一間細咖啡店每月嘅成本分類：,fixed cost|variable cost,fixed cost|variable cost,shop rent|payment for a coffee machine under a two-year lease|coffee beans|milk|wages of part-timers paid by the hour,舖租|兩年租約咖啡機嘅租金|咖啡豆|牛奶|按鐘數計嘅兼職人工,1|1|2|2|2,"If the café sells more cups this month, which costs rise?",如果咖啡店今個月賣多啲杯，邊啲成本會上升？,"Costs that do not vary with output are fixed (rent, lease payment). Costs that rise with output are variable (beans, milk, hourly wages).",唔隨產量改變嘅係 fixed cost（舖租、租機費）。隨產量上升嘅係 variable cost（咖啡豆、牛奶、鐘點人工）。
abacost-S5,abacost,fill,scen,,"(Fictional) A dai pai dong in Sham Shui Po has a fixed cost of $500 a day. TC is $1,300 for 100 bowls of noodles and $1,306 for 101 bowls. AVC at 100 bowls is $____ and the MC of the 101st bowl is $____.","（虛構）深水埗一個大牌檔每日 fixed cost 係 $500。煮 100 碗麵 TC 係 $1,300，101 碗係 $1,306。100 碗時嘅 AVC 係 $①，第 101 碗嘅 MC 係 $②。",8|13|6|1306,8|13|6|1306,,,8|6,"For AVC, remove the fixed cost first. For MC, compare the two TCs.",計 AVC 要先減走 fixed cost；計 MC 就比較兩個 TC，你會點做？,"TVC = 1,300 − 500 = 800, so AVC = 800 ÷ 100 = 8 ($13 is AC = 1,300 ÷ 100). MC(101) = 1,306 − 1,300 = 6.","TVC = 1,300 − 500 = 800，AVC = 800 ÷ 100 = 8（$13 係 AC = 1,300 ÷ 100）。MC(101) = 1,306 − 1,300 = 6。"
margifish-01,margifish,tf,,,The marginal product (MP) of the nth worker equals TP(n) − TP(n−1).,第 n 個工人嘅 marginal product (MP) 等於 TP(n) − TP(n−1)。,,,,,T,What extra output does one more worker bring?,多請一個工人，會帶嚟幾多額外產量？,MP is the change in TP when one more unit of the variable factor is added: MP(n) = TP(n) − TP(n−1).,MP 係多用一單位 variable factor 時 TP 嘅改變：MP(n) = TP(n) − TP(n−1)。
margifish-02,margifish,tf,,,"Whenever MP falls, average product (AP) must also fall.",只要 MP 下跌，average product (AP) 就一定下跌。,,,,,F,"Does AP depend on whether MP is falling, or on whether MP is above or below AP?",AP 升定跌，係睇 MP 有冇下跌，定係睇 MP 高過定低過 AP？,"AP rises when MP > AP and falls when MP < AP. MP can be falling yet still above AP, so AP keeps rising.",MP > AP 時 AP 上升；MP < AP 時 AP 下跌。MP 可以喺下跌緊但仍然高過 AP，咁 AP 仍然上升。
margifish-03,margifish,tf,,,Total product (TP) equals the sum of the MP of all the units of the variable factor employed.,Total product (TP) 等於所有已僱用 variable factor 單位嘅 MP 總和。,,,,,T,"If each worker adds his MP to output, what do all the MPs add up to?",如果每個工人都為產量加上佢嘅 MP，全部 MP 加埋會係乜？,"TP = ΣMP: adding the MP of the 1st, 2nd, ... nth worker gives TP.",TP = ΣMP：將第 1、2 ⋯⋯ n 個工人嘅 MP 加埋就係 TP。
margifish-04,margifish,mc,,,Three workers produce a total of 36 shirts a day. What is the AP of labour?,三個工人每日一共做 36 件恤衫。勞工嘅 AP 係幾多？,36 shirts|108 shirts|3 shirts|12 shirts,36 件|108 件|3 件|12 件,,,D,AP is output per unit of the variable factor.,AP 係每單位 variable factor 嘅產量，你會點計？,AP = TP ÷ number of workers = 36 ÷ 3 = 12.,AP = TP ÷ 工人數目 = 36 ÷ 3 = 12。
margifish-05,margifish,mc,,,TP is 36 with 3 workers and 44 with 4 workers. What is the MP of the 4th worker?,3 個工人 TP 係 36，4 個工人 TP 係 44。第 4 個工人嘅 MP 係幾多？,44|11|8|80,44|11|8|80,,,C,How much did TP change when the 4th worker joined?,第 4 個工人加入之後，TP 改變咗幾多？,MP(4) = TP(4) − TP(3) = 44 − 36 = 8. 11 is AP at 4 workers (44 ÷ 4).,MP(4) = TP(4) − TP(3) = 44 − 36 = 8。11 係 4 個工人時嘅 AP（44 ÷ 4）。
margifish-06,margifish,mc,,,"If the MP of the next worker is lower than the current AP, then when he is hired, AP will:",如果下一個工人嘅 MP 低過現時嘅 AP，請咗佢之後，AP 會：,fall|rise|stay unchanged|become zero,下跌|上升|不變|變成零,,,A,"If a new student scores below the class average, what happens to the class average?",如果一個新同學考試分數低過全班平均分，全班平均分會點？,"When MP < AP, the extra worker pulls the average down, so AP falls.",MP < AP 時，新工人會拉低平均數，所以 AP 下跌。
margifish-07,margifish,mc,,,"The MPs of the 1st, 2nd and 3rd workers are 10, 14 and 12. What is the TP of 3 workers?",第 1、2、3 個工人嘅 MP 分別係 10、14 同 12。3 個工人嘅 TP 係幾多？,36|12|14|10,36|12|14|10,,,A,How can you build TP from the MPs?,點樣用 MP 砌返出 TP？,TP = ΣMP = 10 + 14 + 12 = 36. 12 is only the MP of the 3rd worker (and also AP = 36 ÷ 3).,TP = ΣMP = 10 + 14 + 12 = 36。12 只係第 3 個工人嘅 MP（亦係 AP = 36 ÷ 3）。
margifish-08,margifish,fill,,,AP = TP ÷ number of units of the ____ factor. TP = the sum of ____.,AP = TP ÷ ① factor 嘅單位數目。TP = ② 嘅總和。,variable|fixed|MP|AP,variable|fixed|MP|AP,,,variable|MP,Which factor is being added unit by unit? Which product adds up to TP?,邊種 factor 係逐個單位加入？邊種 product 加埋會等於 TP？,AP and MP are measured per unit of the variable factor (e.g. workers). TP = ΣMP.,AP 同 MP 都係以 variable factor（例如工人）嘅單位計。TP = ΣMP。
margifish-09,margifish,fill,,,TP is 44 with 4 workers and 48 with 5 workers. The MP of the 5th worker is ____ and AP at 5 workers is ____.,4 個工人 TP 係 44，5 個工人 TP 係 48。第 5 個工人嘅 MP 係 ①，5 個工人時嘅 AP 係 ②。,4|9.6|48|11,4|9.6|48|11,,,4|9.6,"Use the change in TP for MP, and TP ÷ workers for AP.",MP 用 TP 嘅改變，AP 用 TP ÷ 工人數目，你計到幾多？,MP(5) = 48 − 44 = 4. AP(5) = 48 ÷ 5 = 9.6. (11 is AP at 4 workers.),MP(5) = 48 − 44 = 4。AP(5) = 48 ÷ 5 = 9.6。（11 係 4 個工人時嘅 AP。）
margifish-10,margifish,sort,,,"When the next worker is hired, what happens to AP?",請多下一個工人之後，AP 會點？,AP rises|AP falls|AP unchanged,AP 上升|AP 下跌|AP 不變,"current AP = 10, MP of next worker = 14|current AP = 11, MP of next worker = 4|current AP = 12, MP of next worker = 12|current AP = 20, MP of next worker = 25|current AP = 15, MP of next worker = 5",現時 AP = 10，下一個工人 MP = 14|現時 AP = 11，下一個工人 MP = 4|現時 AP = 12，下一個工人 MP = 12|現時 AP = 20，下一個工人 MP = 25|現時 AP = 15，下一個工人 MP = 5,1|2|3|1|2,Compare MP with AP each time. Which is bigger?,每次比較 MP 同 AP，邊個大啲？,MP > AP: AP rises. MP < AP: AP falls. MP = AP: AP is unchanged.,MP > AP：AP 上升。MP < AP：AP 下跌。MP = AP：AP 不變。
margifish-11,margifish,sort,,,"A table shows TP = 10, 24, 36, 44, 48 for 1 to 5 workers. Is each calculation finding AP or MP?",一個表顯示 1 至 5 個工人嘅 TP = 10、24、36、44、48。以下每條計數係計緊 AP 定 MP？,AP|MP,AP|MP,36 ÷ 3 = 12|36 − 24 = 12|44 − 36 = 8|48 ÷ 5 = 9.6|24 − 10 = 14|10 ÷ 1 = 10,36 ÷ 3 = 12|36 − 24 = 12|44 − 36 = 8|48 ÷ 5 = 9.6|24 − 10 = 14|10 ÷ 1 = 10,1|2|2|1|2|1,"Is the calculation dividing TP, or taking the difference between two TPs?",條數係將 TP 除開，定係計兩個 TP 嘅差？,AP = TP ÷ number of workers. MP = TP(n) − TP(n−1).,AP = TP ÷ 工人數目。MP = TP(n) − TP(n−1)。
margifish-12,margifish,mc,,,"TP for 1 to 5 workers is 10, 24, 36, 44 and 48. At which number of workers is AP highest?",1 至 5 個工人嘅 TP 係 10、24、36、44 同 48。幾多個工人時 AP 最高？,"1 worker|2 and 3 workers|5 workers, where TP is highest|only 2 workers, where MP is highest",1 個工人|2 個同 3 個工人|5 個工人，因為 TP 最高|只有 2 個工人，因為 MP 最高,,,B,Work out TP ÷ workers for each row.,逐行計 TP ÷ 工人數目，你得到乜？,"AP = 10, 12, 12, 11, 9.6. AP is highest (12) at 2 and 3 workers; the 3rd worker's MP (12) equals AP, so AP is unchanged. Highest TP or MP does not mean highest AP.",AP = 10、12、12、11、9.6。AP 喺 2 個同 3 個工人時最高（12）；第 3 個工人 MP（12）等於 AP，所以 AP 不變。TP 或 MP 最高唔代表 AP 最高。
margifish-S1,margifish,mc,scen,,"(Fictional) A 1970s Sham Shui Po knitting workshop has 4 knitting machines. With 1, 2, 3 and 4 workers it makes 20, 50, 72 and 88 sweaters a day. What is the MP of the 3rd worker?",（虛構）1970 年代深水埗一間織冷衫工場有 4 部織機。1、2、3、4 個工人每日分別做到 20、50、72、88 件冷衫。第 3 個工人嘅 MP 係幾多？,72 sweaters|24 sweaters|22 sweaters|50 sweaters,72 件|24 件|22 件|50 件,,,C,How much did TP rise when the 3rd worker came?,第 3 個工人嚟咗之後，TP 升咗幾多？,MP(3) = TP(3) − TP(2) = 72 − 50 = 22. 24 is AP at 3 workers (72 ÷ 3).,MP(3) = TP(3) − TP(2) = 72 − 50 = 22。24 係 3 個工人時嘅 AP（72 ÷ 3）。
margifish-S2,margifish,fill,scen,,(Fictional) Same knitting workshop: TP is 50 with 2 workers and 88 with 4 workers. AP at 2 workers is ____ and AP at 4 workers is ____.,（虛構）同一間織冷衫工場：2 個工人 TP 係 50，4 個工人 TP 係 88。2 個工人時 AP 係 ①，4 個工人時 AP 係 ②。,25|22|16|88,25|22|16|88,,,25|22,Divide TP by the number of workers each time.,每次將 TP 除以工人數目，你得到乜？,AP(2) = 50 ÷ 2 = 25. AP(4) = 88 ÷ 4 = 22. (16 is MP of the 4th worker = 88 − 72.),AP(2) = 50 ÷ 2 = 25。AP(4) = 88 ÷ 4 = 22。（16 係第 4 個工人嘅 MP = 88 − 72。）
margifish-S3,margifish,mc,scen,,"(Fictional) In the knitting workshop, AP falls from 25 (2 workers) to 24 (3 workers). Why?",（虛構）喺織冷衫工場，AP 由 25（2 個工人）跌到 24（3 個工人）。點解？,because TP fell|because the 3rd worker's MP is negative|because the number of machines fell|because the 3rd worker's MP (22) is lower than the AP of 2 workers (25),因為 TP 下跌|因為第 3 個工人嘅 MP 係負數|因為織機數目減少|因為第 3 個工人嘅 MP（22）低過 2 個工人時嘅 AP（25）,,,D,Compare the 3rd worker's MP with the AP before he joined.,比較第 3 個工人嘅 MP 同佢加入之前嘅 AP？,"When MP < AP, AP falls. TP still rose (50 to 72) and MP is positive; the machines stayed at 4.",MP < AP 時，AP 下跌。TP 仍然上升（50 升到 72），MP 係正數；織機仍然係 4 部。
margifish-S4,margifish,sort,scen,,"(Fictional) A Kwun Tong drinks shop has one counter. With 1 to 5 staff it makes 30, 70, 105, 128 and 140 cups an hour. When each staff member below is added, what happens to AP?",（虛構）觀塘一間飲品店得一個櫃位。1 至 5 個員工每小時分別做到 30、70、105、128、140 杯。加入以下每個員工時，AP 會點？,AP rises|AP unchanged|AP falls,AP 上升|AP 不變|AP 下跌,the 2nd staff member|the 3rd staff member|the 4th staff member|the 5th staff member,第 2 個員工|第 3 個員工|第 4 個員工|第 5 個員工,1|2|3|3,Work out each MP and compare it with the AP before that person joined.,計出每個 MP，再同嗰個員工加入之前嘅 AP 比較？,"MP = 30, 40, 35, 23, 12; AP = 30, 35, 35, 32, 28. 2nd: MP 40 > AP 30, AP rises. 3rd: MP 35 = AP 35, unchanged. 4th: 23 < 35, falls. 5th: 12 < 32, falls.",MP = 30、40、35、23、12；AP = 30、35、35、32、28。第 2 個：MP 40 > AP 30，AP 上升。第 3 個：MP 35 = AP 35，不變。第 4 個：23 < 35，下跌。第 5 個：12 < 32，下跌。
margifish-S5,margifish,tf,scen,,"(Fictional) In the drinks shop, TP rises from 128 to 140 cups when the 5th staff member joins. Since TP is rising, MP must also be rising.",（虛構）喺飲品店，第 5 個員工加入之後，TP 由 128 杯升到 140 杯。既然 TP 上升緊，MP 一定都上升緊。,,,,,F,Compare the MP of the 4th and the 5th staff members.,比較第 4 個同第 5 個員工嘅 MP？,"MP(4) = 128 − 105 = 23 and MP(5) = 140 − 128 = 12. TP rises as long as MP is positive, even while MP falls.",MP(4) = 128 − 105 = 23，MP(5) = 140 − 128 = 12。只要 MP 係正數，TP 就會上升，即使 MP 下跌緊。
dimdove-01,dimdove,tf,,,The law of diminishing marginal returns states that total product will eventually fall.,Law of diminishing marginal returns 指 total product 最終會下跌。,,,,,F,Which product does the law talk about: total or marginal?,呢條定律講嘅係 total 定 marginal product？,"The law is about MP eventually diminishing, not TP falling. TP keeps rising while MP is positive.",定律講嘅係 MP 最終遞減，唔係 TP 下跌。只要 MP 係正數，TP 仍然上升。
dimdove-02,dimdove,tf,,,The law of diminishing marginal returns applies only in the short run.,Law of diminishing marginal returns 只適用於 short run。,,,,,T,Does the law need a fixed factor?,呢條定律需唔需要有 fixed factor？,"The law describes adding a variable factor to fixed factors. With no fixed factors (long run), it does not apply.",定律描述將 variable factor 加落 fixed factors 度。冇 fixed factor（long run）就唔適用。
dimdove-03,dimdove,tf,,,"According to the law of diminishing marginal returns, the MP of labour falls from the very first worker.",根據 law of diminishing marginal returns，勞工嘅 MP 由第一個工人開始就下跌。,,,,,F,What does the word 'eventually' in the law mean?,定律入面「最終」(eventually) 呢個字係咩意思？,The law says MP will eventually decrease. MP may rise at first when the fixed factor is under-utilised.,定律話 MP 最終會下降。一開始 fixed factor 未用盡，MP 可能會上升。
dimdove-04,dimdove,mc,,,Which is the correct statement of the law of diminishing marginal returns?,以下邊句正確表述 law of diminishing marginal returns？,"When all factors are increased, output increases by a smaller proportion.|When more workers are hired, TP will eventually fall.|In the short run, when more units of a variable factor are added to fixed factors, the MP of the variable factor will eventually decrease, technology unchanged.|The MP of every worker is lower than that of the worker before.",所有 factors 一齊增加，產量增加嘅比例較細。|請越多工人，TP 最終會下跌。|喺 short run，將越來越多單位嘅 variable factor 加落 fixed factors，variable factor 嘅 MP 最終會下降（技術不變）。|每個工人嘅 MP 都低過前一個工人。,,,C,Check each option: short run or long run? MP or TP? 'Eventually' or 'always'?,逐個選項檢查：short run 定 long run？MP 定 TP？「最終」定「一直」？,"Key points: short run (fixed factors), more units of a variable factor, MP eventually decreases, technology constant.",要點：short run（有 fixed factor）、加入更多 variable factor、MP 最終下降、技術不變。
dimdove-05,dimdove,mc,,,Why may the MP of workers rise at first when a few workers are added to a factory with ten sewing machines?,一間有十部衣車嘅工廠，開始時加入幾個工人，點解工人嘅 MP 可能會上升？,"The machines are under-utilised, so extra workers make better use of them.|Technology improves each time a worker is hired.|The factory is in the long run.|Later workers are always more skilful.",衣車未被充分利用，多啲工人可以更好咁利用佢哋。|每請一個工人，技術就進步。|工廠喺 long run。|遲啲請嘅工人一定叻啲。,,,A,"With only two workers, how many of the ten machines are being used?",得兩個工人嘅時候，十部衣車用緊幾多部？,"When the fixed factor is under-utilised, adding workers lets it be used more fully (and allows some division of labour), so MP may rise.",Fixed factor 未用盡時，加人可以更充分利用佢（亦可以分工），所以 MP 可能上升。
dimdove-06,dimdove,mc,,,Why does the MP of workers eventually diminish when more and more are added to the same ten sewing machines?,喺同樣十部衣車上不斷加工人，點解工人嘅 MP 最終會遞減？,Workers become lazier over time.|Each extra worker has less of the fixed factor to work with.|The wage rate rises.|The factory moves to a bigger building.,工人越嚟越懶。|每個新增工人可以用嘅 fixed factor 越嚟越少。|工資率上升。|工廠搬去更大嘅大廈。,,,B,"Once all machines are in use, what does the next worker have to work with?",所有衣車都有人用緊之後，下一個工人有乜嘢可以用？,"The fixed factor becomes relatively scarce: each extra worker has less machine time to work with, so the extra output falls. Wages concern cost, not MP.",Fixed factor 相對變得稀少：每個新增工人可用嘅機器越嚟越少，額外產量下跌。工資係成本問題，唔係 MP。
dimdove-07,dimdove,mc,,,Which of the following is NOT a condition of the law of diminishing marginal returns?,以下邊項唔係 law of diminishing marginal returns 嘅條件？,Technology is held constant.|At least one factor is fixed.|More and more units of a variable factor are added.|All factors of production are increased together.,技術保持不變。|至少有一種 factor 固定。|不斷加入更多單位嘅 variable factor。|所有生產要素一齊增加。,,,D,"If every factor is increased, is any factor still fixed?",如果所有 factors 都增加，仲有冇 factor 係固定？,"Increasing all factors together is a long-run change in scale, which is about economies or diseconomies of scale, not this short-run law.",所有 factors 一齊增加係 long run 嘅規模改變，屬於 economies 或 diseconomies of scale，唔係呢條 short run 定律。
dimdove-08,dimdove,fill,,,"The law of diminishing marginal returns is about ____ product, which will eventually ____.",Law of diminishing marginal returns 講嘅係 ① product，佢最終會 ②。,marginal|total|decrease|increase,marginal|total|下降|上升,,,marginal|decrease,Look at the name of the law. What diminishes?,睇吓定律個名，係乜嘢遞減？,The law states that the MP of the variable factor will eventually decrease. It does not say TP falls.,定律指 variable factor 嘅 MP 最終會下降，冇話 TP 會下跌。
dimdove-09,dimdove,fill,,,"When MP is diminishing but still positive, TP ____ at a ____ rate.",當 MP 遞減但仍然係正數，TP 以 ② 嘅速度 ①。,rises|falls|decreasing|increasing,上升|下跌|遞減|遞增,,,rises|decreasing,"If each extra worker still adds some output, but less than before, what happens to TP?",如果每個新增工人仍然會增加產量，但加得少過之前，TP 會點？,"A positive MP adds to TP, so TP rises; a smaller MP each time means TP rises at a decreasing rate.",MP 係正數就會令 TP 增加，所以 TP 上升；MP 每次細咗，即係 TP 以遞減速度上升。
dimdove-10,dimdove,sort,,,"Is each statement consistent with the law of diminishing marginal returns, or a misunderstanding of it?",以下每句符合 law of diminishing marginal returns，定係誤解咗佢？,consistent with the law|misunderstanding,符合定律|誤解,"With the same 5 machines, the 4th worker adds less output than the 3rd.|As soon as MP falls, TP falls.|The law applies when a firm doubles all its inputs.|MP may rise for the first few workers.|The law says MP must fall from the first worker.|The law assumes technology is unchanged.",用同樣 5 部機器，第 4 個工人增加嘅產量少過第 3 個。|MP 一下跌，TP 就下跌。|firm 將所有投入加倍時，定律都適用。|頭幾個工人嘅 MP 可能上升。|定律話 MP 一定由第一個工人開始下跌。|定律假設技術不變。,1|2|2|1|2|1,Check: MP or TP? Short run or long run? 'Eventually' or 'immediately'?,檢查吓：MP 定 TP？short run 定 long run？「最終」定「即刻」？,"The law: short run, fixed factors, MP eventually diminishes, technology constant. It is not about TP falling, not about the long run, and MP need not fall from the start.",定律：short run、有 fixed factor、MP 最終遞減、技術不變。唔係講 TP 下跌，唔係講 long run，MP 亦唔一定由開始就跌。
dimdove-11,dimdove,sort,,,Which concept explains each case?,以下每個情況用邊個概念解釋？,law of diminishing marginal returns (short run)|economies or diseconomies of scale (long run),law of diminishing marginal returns（short run）|economies 或 diseconomies of scale（long run）,"With the same 10 machines, more workers are hired and MP falls.|A firm builds a bigger factory with more machines and workers, and LRAC falls.|A farmer adds more fertiliser to the same plot and the extra harvest falls.|A firm grows so large that managers cannot coordinate, and LRAC rises.|A stall with one wok hires a 4th cook and the extra bowls cooked fall.",同樣 10 部機器，請多啲工人，MP 下跌。|firm 起咗更大嘅工廠，機器同工人都增加，LRAC 下跌。|農夫喺同一塊田落多啲肥料，額外收成下跌。|firm 大到管理層協調唔到，LRAC 上升。|得一個鑊嘅檔口請第 4 個廚師，額外煮到嘅碗數下跌。,1|2|1|2|1,"In each case, is some factor kept fixed, or are all factors changed?",每個情況入面，有冇 factor 保持固定，定係所有 factors 都改變？,"A fixed factor with a variable factor added is the short-run law. When all factors change, it is a change in scale, explained by economies or diseconomies of scale.",有 fixed factor、加入 variable factor，就係 short run 定律。所有 factors 都改變就係規模改變，用 economies 或 diseconomies of scale 解釋。
dimdove-12,dimdove,order,,,Put the stages in order as more and more workers are added to a fixed number of sewing machines:,喺固定數目嘅衣車上不斷加入工人，將各階段排好次序：,,,"Few workers: the machines are under-utilised.|Extra workers make better use of the machines, so MP may rise.|The machines are fully used; each extra worker has less machine to work with, so MP diminishes.",工人好少：衣車未被充分利用。|新增工人更好咁利用衣車，MP 可能上升。|衣車已經用盡；每個新增工人可用嘅機器越嚟越少，MP 遞減。,,What happens to the machines as the factory gets more and more crowded?,工廠越嚟越多人，衣車嘅使用情況會點變？,"MP may rise while the fixed factor is under-utilised, then eventually diminishes as the fixed factor becomes relatively scarce.",Fixed factor 未用盡時 MP 可能上升；之後 fixed factor 相對變得稀少，MP 最終遞減。
dimdove-S1,dimdove,mc,scen,,"(Fictional) A 1970s Cheung Sha Wan workshop has 4 sewing machines on a rented floor. With 1 to 6 workers, it makes 8, 20, 36, 48, 56 and 60 dozen garments a week. Diminishing marginal returns set in when the ____ worker is added.",（虛構）1970 年代長沙灣一個工場喺租返嚟嘅廠房有 4 部衣車。1 至 6 個工人每星期分別做到 8、20、36、48、56、60 打衫。加入第幾個工人時開始出現 diminishing marginal returns？,2nd|4th|6th|1st,第 2 個|第 4 個|第 6 個|第 1 個,,,B,Work out the MP of each worker. When does it start to fall?,計出每個工人嘅 MP，佢幾時開始下跌？,"MP = 8, 12, 16, 12, 8, 4. MP rises up to the 3rd worker and starts to fall with the 4th (16 to 12).",MP = 8、12、16、12、8、4。MP 升到第 3 個工人，由第 4 個開始下跌（16 跌到 12）。
dimdove-S2,dimdove,fill,scen,,"(Fictional) Same workshop: TP is 48 dozen with 4 workers and 56 dozen with 5 workers. The MP of the 5th worker is ____ dozen, and TP ____ when he is added.",（虛構）同一個工場：4 個工人 TP 係 48 打，5 個工人 TP 係 56 打。第 5 個工人嘅 MP 係 ① 打，加入佢之後 TP ②。,8|56|rises|falls,8|56|上升|下跌,,,8|rises,Find the change in TP. Is it positive?,搵出 TP 嘅改變，係咪正數？,"MP(5) = 56 − 48 = 8, lower than MP(4) = 12, but still positive, so TP still rises.",MP(5) = 56 − 48 = 8，低過 MP(4) = 12，但仍然係正數，所以 TP 仍然上升。
dimdove-S3,dimdove,tf,scen,,"(Fictional) The boss, Mr Tsang, says: 'The 5th worker's MP is lower than the 4th's, so hiring him reduces our total output.'",（虛構）老闆曾生話：「第 5 個工人嘅 MP 低過第 4 個，所以請佢會令我哋嘅總產量減少。」,,,,,F,Is the 5th worker's MP negative or just smaller?,第 5 個工人嘅 MP 係負數，定只係細咗？,"Diminishing MP means a smaller addition to TP, not a fall in TP. TP rises from 48 to 56.",MP 遞減即係對 TP 嘅增加變少，唔係 TP 下跌。TP 由 48 升到 56。
dimdove-S4,dimdove,mc,scen,,"(Fictional) Years later, Mr Tsang moves to a floor twice as big and doubles both machines and workers. Which concept should be used to analyse the change in his average cost?",（虛構）幾年後，曾生搬去一層大一倍嘅廠房，機器同工人都加倍。應該用邊個概念分析佢平均成本嘅改變？,"the law of diminishing marginal returns, because he hired more workers|TFC, because the rent is fixed forever|the law of diminishing marginal returns, because MP always falls|economies or diseconomies of scale, because all factors changed (long run)",law of diminishing marginal returns，因為佢請多咗工人|TFC，因為租金永遠固定|law of diminishing marginal returns，因為 MP 一定下跌|economies 或 diseconomies of scale，因為所有 factors 都改變咗（long run）,,,D,Is any factor still fixed after the move?,搬咗之後，仲有冇 factor 係固定？,"With all factors changed, there is no fixed factor, so it is the long run. The law of diminishing marginal returns applies only in the short run.",所有 factors 都改變咗，冇 fixed factor，所以係 long run。Law of diminishing marginal returns 只適用於 short run。
dimdove-S5,dimdove,mc,scen,,"(Fictional) A Sham Shui Po dessert shop has one small kitchen. The 2nd helper adds 40 bowls an hour, but the 3rd helper adds only 25 because they keep getting in each other's way. This is best explained by:",（虛構）深水埗一間糖水舖得一個細廚房。第 2 個幫工每小時多做 40 碗，但第 3 個幫工只係多做 25 碗，因為大家成日阻住對方。呢個情況最適合用乜解釋？,"internal economies of scale|a fall in TP|the law of diminishing marginal returns, as the kitchen is a fixed factor|external diseconomies of scale",internal economies of scale|TP 下跌|law of diminishing marginal returns，因為廚房係 fixed factor|external diseconomies of scale,,,C,"Which factor is fixed, and which is being added?",邊種 factor 固定，邊種係不斷加入？,"A variable factor (helpers) is added to a fixed factor (kitchen) in the short run, and MP falls from 40 to 25. TP still rises.",喺 short run 將 variable factor（幫工）加落 fixed factor（廚房），MP 由 40 跌到 25。TP 仍然上升。
scalecarp-01,scalecarp,tf,,,Internal economies of scale arise when a firm expands its own scale of production and its long-run average cost (LRAC) falls.,Internal economies of scale 係指 firm 擴大自己嘅生產規模，令 long-run average cost (LRAC) 下跌。,,,,,T,Whose scale is growing: the firm's own or the whole industry's?,擴大嘅係 firm 自己嘅規模，定係成個行業嘅規模？,Internal economies of scale come from the firm's own expansion and lower its LRAC.,Internal economies of scale 源自 firm 自己擴充，令佢嘅 LRAC 下跌。
scalecarp-02,scalecarp,tf,,,Internal economies of scale are a short-run concept.,Internal economies of scale 係 short run 嘅概念。,,,,,F,Can a firm change its scale while some factors are fixed?,有 factor 固定嘅時候，firm 改唔改到規模？,"Changing the scale of production means changing all factors, so economies of scale are a long-run concept.",改變生產規模即係改變所有 factors，所以 economies of scale 係 long run 嘅概念。
scalecarp-03,scalecarp,tf,,,"If a firm expands beyond its optimal scale, its LRAC rises because of internal diseconomies of scale.",如果 firm 擴充超過 optimal scale，佢嘅 LRAC 會因為 internal diseconomies of scale 而上升。,,,,,T,What happens to management when a firm becomes very large?,Firm 變得好大嘅時候，管理會出現咩問題？,"Beyond the optimal scale (minimum LRAC), internal diseconomies such as managerial inefficiency raise LRAC.",超過 optimal scale（LRAC 最低點）之後，管理效率下降等 internal diseconomies 會令 LRAC 上升。
scalecarp-04,scalecarp,mc,,,The optimal scale of a firm is the scale at which:,一間 firm 嘅 optimal scale 係指：,total output is largest|LRAC is at its minimum|TC is at its minimum|the firm has the most workers,總產量最大|LRAC 最低|TC 最低|firm 嘅工人最多,,,B,Which cost measure tells you the cost of each unit in the long run?,邊個成本指標反映 long run 每單位嘅成本？,"Optimal scale = the scale with the lowest LRAC. TC is lowest at zero output, so it is not the criterion.",Optimal scale = LRAC 最低嘅規模。TC 喺零產量時最低，所以唔係準則。
scalecarp-05,scalecarp,mc,,,Which of the following is an example of internal economies of scale?,以下邊項係 internal economies of scale 嘅例子？,"More garment factories open in the district, so skilled workers are easier to find.|The government builds a new road to the industrial area.|A large firm gets a lower interest rate on its bank loans.|A firm hires one more worker to its fixed machines and MP falls.",區內開多咗製衣廠，所以容易搵到熟手工人。|政府起咗條新路通往工業區。|一間大 firm 向銀行借錢可以得到較低利率。|firm 喺固定機器上多請一個工人，MP 下跌。,,,C,Which benefit comes from the firm's own large size?,邊個好處係因為 firm 自己規模大而得到？,Large firms are seen as less risky and can borrow at a lower interest rate: an internal economy. The first two come from industry growth (external); the last is the short-run law.,大 firm 風險被視為較低，可以用較低利率借錢，係 internal economy。頭兩個來自行業擴張（external）；最後一個係 short run 定律。
scalecarp-06,scalecarp,mc,,,Which of the following is an example of internal diseconomies of scale?,以下邊項係 internal diseconomies of scale 嘅例子？,The firm has so many layers of managers that decisions become slow and coordination is poor.|The firm buys cloth in bulk at a discount.|The firm spreads one advertisement over a larger output.|Rents in the whole district rise as the industry expands excessively.,firm 管理層級太多，決策變慢，協調變差。|firm 大量買布，有折扣。|firm 將一個廣告嘅成本攤喺更大嘅產量上。|行業過度擴張，成區租金上升。,,,A,Which problem comes from the firm itself growing too large?,邊個問題係因為 firm 自己變得太大而出現？,Managerial inefficiency in an over-large firm raises its LRAC: an internal diseconomy. Bulk-buying and advertising are internal economies; district-wide rent rises are external diseconomies.,Firm 過大導致管理效率下降，令 LRAC 上升，係 internal diseconomy。大量採購同廣告係 internal economies；成區租金上升係 external diseconomies。
scalecarp-07,scalecarp,mc,,,"A large firm spends the same amount on research and development (R&D) as a small firm, but spreads it over a much larger output. This is:",一間大 firm 同一間細 firm 用同樣嘅錢做研發 (R&D)，但大 firm 將佢攤喺大得多嘅產量上。呢個係：,external economies of scale|the law of diminishing marginal returns|internal diseconomies of scale|internal economies of scale,external economies of scale|law of diminishing marginal returns|internal diseconomies of scale|internal economies of scale,,,D,What happens to R&D cost per unit when output is larger?,產量大咗，每單位嘅 R&D 成本會點？,Lower average R&D cost from the firm's own larger output lowers LRAC: an internal economy of scale.,Firm 自己產量大咗，令平均 R&D 成本下降，LRAC 下跌，係 internal economy of scale。
scalecarp-08,scalecarp,fill,,,"When a firm enlarges its ____ scale of production and its LRAC falls, it enjoys internal ____ of scale.",當 firm 擴大 ① 嘅生產規模而 LRAC 下跌，佢享有 internal ② of scale。,own|industry's|economies|diseconomies,自己|行業|economies|diseconomies,,,own|economies,'Internal' means inside what? Does falling LRAC mean economies or diseconomies?,「Internal」係指乜嘢嘅內部？LRAC 下跌係 economies 定 diseconomies？,Internal = the firm's own scale. Falling LRAC = economies; rising LRAC = diseconomies.,Internal = firm 自己嘅規模。LRAC 下跌 = economies；LRAC 上升 = diseconomies。
scalecarp-09,scalecarp,fill,,,"At the optimal scale, LRAC is at its ____. Beyond it, ____ of scale set in.",喺 optimal scale，LRAC 處於 ①。超過之後，就會出現 ② of scale。,minimum|maximum|internal diseconomies|external economies,最低點|最高點|internal diseconomies|external economies,,,minimum|internal diseconomies,What happens to LRAC after the lowest point when the firm keeps expanding?,Firm 繼續擴充，過咗最低點之後 LRAC 會點？,"Optimal scale = minimum LRAC. Further expansion of the firm's own scale brings internal diseconomies, so LRAC rises.",Optimal scale = LRAC 最低。Firm 自己再擴充就會出現 internal diseconomies，LRAC 上升。
scalecarp-10,scalecarp,sort,,,A garment firm expands its own scale. Sort the effects:,一間製衣 firm 擴大自己嘅規模。將以下影響分類：,internal economies of scale|internal diseconomies of scale,internal economies of scale|internal diseconomies of scale,"workers specialise in cutting, sewing and ironing|bulk-buying of cloth at a lower average cost|lower average marketing cost per garment|large machines can be fully used|the boss can no longer supervise all the branches|messages pass through too many layers and decisions are slow",工人分工做裁剪、車衣同熨衫|大量買布，平均成本較低|每件衫嘅平均宣傳成本較低|大型機器可以充分利用|老闆無法再監督晒所有分廠|訊息要經過太多層級，決策好慢,1|1|1|1|2|2,Does each effect lower or raise the firm's LRAC?,每個影響會令 firm 嘅 LRAC 下跌定上升？,"Division of labour, bulk-buying, lower average marketing cost and full use of machines lower LRAC (economies). Managerial inefficiency raises LRAC (diseconomies).",分工、大量採購、較低平均宣傳成本同充分利用機器會降低 LRAC（economies）。管理效率下降會令 LRAC 上升（diseconomies）。
scalecarp-11,scalecarp,sort,,,Is each concept a short-run or a long-run concept?,以下每個概念屬於 short run 定 long run？,short run|long run,short run|long run,law of diminishing marginal returns|fixed factor|TFC and TVC|internal economies of scale|optimal scale|LRAC,law of diminishing marginal returns|fixed factor|TFC 同 TVC|internal economies of scale|optimal scale|LRAC,1|1|1|2|2|2,"Does the concept need a fixed factor, or can all factors change?",呢個概念需唔需要有 fixed factor，定係所有 factors 都可以改變？,"Concepts based on fixed factors are short run. Scale, LRAC and optimal scale involve changing all factors, so they are long run.",建基於 fixed factor 嘅概念屬 short run。規模、LRAC 同 optimal scale 涉及改變所有 factors，屬 long run。
scalecarp-12,scalecarp,order,,,Put the stages in order as a firm keeps expanding its own scale:,Firm 不斷擴大自己嘅規模，將各階段排好次序：,,,Small scale: LRAC is high.|The firm expands and enjoys internal economies: LRAC falls.|Optimal scale: LRAC is at its minimum.|The firm expands further and suffers internal diseconomies: LRAC rises.,規模細：LRAC 高。|Firm 擴充，享有 internal economies：LRAC 下跌。|Optimal scale：LRAC 最低。|Firm 再擴充，出現 internal diseconomies：LRAC 上升。,,What shape does the LRAC curve have as scale increases?,規模增加時，LRAC 曲線係咩形狀？,"LRAC first falls (internal economies), reaches its minimum at the optimal scale, then rises (internal diseconomies).",LRAC 先下跌（internal economies），喺 optimal scale 到達最低點，然後上升（internal diseconomies）。
scalecarp-S1,scalecarp,mc,scen,,"(Fictional) In the late 1970s, Mr Chow expands his garment factory from one floor to three. Each worker now specialises in one task such as cutting, sewing or ironing, and his LRAC falls. This is mainly because of:",（虛構）1970 年代尾，周生將佢嘅製衣廠由一層擴充到三層。而家每個工人專做一樣工序，例如裁剪、車衣或熨衫，佢嘅 LRAC 下跌。呢個主要係因為：,internal economies of scale from more extensive division of labour|external economies of scale|the law of diminishing marginal returns|a fall in TFC,更細緻分工帶嚟嘅 internal economies of scale|external economies of scale|law of diminishing marginal returns|TFC 下跌,,,A,"Whose scale grew, and what changed inside the factory?",邊個嘅規模擴大咗？工廠入面有咩改變？,"Mr Chow enlarged his own scale, allowing more extensive division of labour, which lowers LRAC: an internal economy of scale.",周生擴大自己嘅規模，可以更細緻咁分工，令 LRAC 下跌，係 internal economy of scale。
scalecarp-S2,scalecarp,fill,scen,,"(Fictional) At a small scale, Mr Chow's TC is $60,000 for 1,000 shirts. At a larger scale, his TC is $100,000 for 2,500 shirts. LRAC is $____ at the small scale and $____ at the larger scale.","（虛構）細規模時，周生做 1,000 件恤衫 TC 係 $60,000。擴大規模後，做 2,500 件 TC 係 $100,000。細規模嘅 LRAC 係 $①，大規模嘅 LRAC 係 $②。",60|40|25|100,60|40|25|100,,,60|40,Divide each TC by its output.,將每個 TC 除以佢嘅產量，你得到乜？,"60,000 ÷ 1,000 = 60; 100,000 ÷ 2,500 = 40. LRAC falls as the firm expands: internal economies of scale.","60,000 ÷ 1,000 = 60；100,000 ÷ 2,500 = 40。Firm 擴充後 LRAC 下跌：internal economies of scale。"
scalecarp-S3,scalecarp,sort,scen,,(Fictional) A Hong Kong noodle chain grows from 5 to 30 branches. Sort each effect:,（虛構）一間香港麵舖連鎖店由 5 間分店擴充到 30 間。將每個影響分類：,internal economies of scale|internal diseconomies of scale,internal economies of scale|internal diseconomies of scale,it buys flour in bulk at a lower average cost|the machines in its central kitchen are fully used|one advertisement is spread over 30 branches|its bank offers a lower interest rate on loans|head office is slow to respond to problems at branches|managers cannot monitor food quality in every branch,大量買麵粉，平均成本較低|中央廚房嘅機器可以充分利用|一個廣告嘅成本攤喺 30 間分店|銀行貸款利率較低|總部處理分店問題好慢|管理層監察唔到每間分店嘅食物質素,1|1|1|1|2|2,Does each effect lower or raise the chain's LRAC?,每個影響會令連鎖店嘅 LRAC 下跌定上升？,"Bulk-buying, full use of machines, lower average marketing cost and cheaper loans lower LRAC. Slow decisions and poor supervision (managerial inefficiency) raise LRAC.",大量採購、充分利用機器、較低平均宣傳成本同較平嘅貸款會降低 LRAC。決策慢同監督差（管理效率下降）會令 LRAC 上升。
scalecarp-S4,scalecarp,mc,scen,,"(Fictional) The noodle chain's LRAC per bowl is $18 with 10 branches, $12 with 30 branches and $15 with 60 branches. Among these, which is closest to the optimal scale, and why does LRAC rise at 60 branches?",（虛構）麵舖連鎖店每碗嘅 LRAC：10 間分店時 $18，30 間時 $12，60 間時 $15。喺呢三個之中，邊個最接近 optimal scale？點解 60 間時 LRAC 會上升？,60 branches; external economies|10 branches; internal economies|30 branches; internal diseconomies set in beyond it|60 branches; the law of diminishing marginal returns,60 間；external economies|10 間；internal economies|30 間；超過之後出現 internal diseconomies|60 間；law of diminishing marginal returns,,,C,Which scale gives the lowest LRAC? What happens when the firm grows beyond it?,邊個規模嘅 LRAC 最低？Firm 再擴大會點？,"Optimal scale = minimum LRAC, here 30 branches ($12). Growing to 60 raises LRAC to $15 because of internal diseconomies of scale.",Optimal scale = LRAC 最低，即 30 間（$12）。擴到 60 間，LRAC 升到 $15，因為 internal diseconomies of scale。
scalecarp-S5,scalecarp,tf,scen,,"(Fictional) Mrs Lee does not expand her small garment workshop, but as the whole Cheung Sha Wan garment industry grows, her LRAC falls. This is an internal economy of scale.",（虛構）李太冇擴充佢嘅細製衣工場，但長沙灣成個製衣業擴張，佢嘅 LRAC 下跌。呢個係 internal economy of scale。,,,,,F,"Did Mrs Lee's own scale change, or the industry's?",改變咗嘅係李太自己嘅規模，定係行業嘅規模？,Internal economies come from the firm's own expansion. A fall in LRAC caused by the industry's expansion is an external economy of scale.,Internal economies 源自 firm 自己擴充。因為行業擴張而令 LRAC 下跌，係 external economy of scale。
clusterswift-01,clusterswift,tf,,,External economies of scale arise when the industry expands and each firm's LRAC falls.,External economies of scale 係指行業擴張，令每間 firm 嘅 LRAC 下跌。,,,,,T,'External' means outside what?,「External」係指乜嘢嘅外部？,"External economies come from the growth of the industry, outside the individual firm, and lower each firm's LRAC.",External economies 來自行業擴張（個別 firm 以外），令每間 firm 嘅 LRAC 下跌。
clusterswift-02,clusterswift,tf,,,A firm can enjoy external economies of scale only if it enlarges its own scale.,一間 firm 一定要擴大自己嘅規模，先可以享有 external economies of scale。,,,,,F,Can a small firm that does not grow still benefit when the industry grows?,一間冇擴充嘅細 firm，喺行業擴張時會唔會都得益？,"External economies depend on the industry's scale, not the firm's own scale. Even a firm that does not expand can enjoy them.",External economies 取決於行業嘅規模，唔係 firm 自己嘅規模。冇擴充嘅 firm 都可以享有。
clusterswift-03,clusterswift,tf,,,"When an industry expands excessively, input costs may rise and each firm's LRAC rises. These are external diseconomies of scale.",當行業過度擴張，投入成本可能上升，每間 firm 嘅 LRAC 上升。呢啲係 external diseconomies of scale。,,,,,T,"If too many firms compete for the same workers and space, what happens to input prices?",如果太多 firm 爭同一班工人同地方，投入價格會點？,"Excessive industry expansion bids up input costs, raising each firm's LRAC: external diseconomies.",行業過度擴張會推高投入成本，令每間 firm 嘅 LRAC 上升：external diseconomies。
